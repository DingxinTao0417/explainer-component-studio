            layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
            layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
            layer.style.backgroundSize = size + "px " + size + "px";
            return function (t) {
              var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
              layer.style.backgroundImage = tiles[k % 6];
              layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
            };
          }
          // ==== end kit:grain ====

          // the word: supported characters only, at most 6; nothing usable falls back to the default
          var word = String(v.word).toUpperCase().replace(/\s+/g, " ").trim();
          var chars = Array.from(word).filter(function (c) { return c in G; }).slice(0, 6);
          if (!chars.join("").trim()) chars = Array.from("SHIP");
          var hash = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          var segs = [];
          chars.forEach(function (c, li) {
            G[c].split(";").forEach(function (s) {
              if (!s) return;
              var n = 0, key = s[0] === "*";
              s = s.replace("*", "");
              segs.push({ li: li, key: key, d: "M" + (S2[s] || s).replace(/[\d.]+/g, function (x) { return n++ % 2 ? x : +x + li * ADV; }) });
            });
          });
          // order: up to three key segments (first, middle and last letter that has one) wait for the three beats; the
          // rest are spread over their letter's share of the run with a fixed jitter, never two of one letter in a row
          var ks = segs.filter(function (s) { return s.key; });
          var held = ks.length > 3 ? [ks[0], ks[Math.round((ks.length - 1) / 2)], ks[ks.length - 1]] : ks;
          var rest = segs.filter(function (s) { return held.indexOf(s) < 0; });
          chars.forEach(function (c, li) {
            var mine = rest.filter(function (s) { return s.li === li; });
            mine.forEach(function (s, j) { s.p = s.key ? 1 + li / 100 : (j + 0.5 + (hash(li * 7.3 + j * 1.7) - 0.5) * 0.6) / mine.length; });
          });
          rest.sort(function (a, b) { return a.p - b.p; });
          for (var i = 1; i < rest.length; i++) {
            if (rest[i].li !== rest[i - 1].li) continue;
            for (var j = i + 1; j < rest.length; j++) if (rest[j].li !== rest[i - 1].li) { rest.splice(i, 0, rest.splice(j, 1)[0]); break; }
          }
          var out = MT.EASE.out;
          rest.forEach(function (s, i) { s.at = CFG.first + (rest.length > 1 ? out(i / (rest.length - 1)) : 0) * CFG.span; });
          held.forEach(function (s, i) { s.at = CFG.keys[3 - held.length + i]; });

          // the svg: tube paths once in <defs>, four layers of <use>; the floor reflection is the whole sign again,
          // mirrored on the floor line, blurred and masked in the sign's own units. Ids carry a per-mount number
          var u = "sb" + (window.__sbMount = (window.__sbMount || 0) + 1) + "-";
          var WD = ADV * (chars.length - 1) + 260, box = 'filterUnits="userSpaceOnUse" x="-150" y="-150" width="' + (WD + 300) + '" height="';
          var defs = [["w", 22], ["n", 6], ["r", 5]].map(function (f) { return '<filter id="' + u + f[0] + '" ' + box + '700"><feGaussianBlur stdDeviation="' + f[1] + '"/></filter>'; }).join("");
          defs += '<linearGradient id="' + u + 'g" gradientUnits="userSpaceOnUse" x1="0" y1="' + (FL - 340) + '" x2="0" y2="' + FL + '"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.882" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.997" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>';
          defs += '<mask id="' + u + 'm" maskUnits="userSpaceOnUse" x="-150" y="-150" width="' + (WD + 300) + '" height="900"><rect x="-150" y="-150" width="' + (WD + 300) + '" height="900" fill="url(#' + u + 'g)"/></mask>';
          var uses = "";
          segs.forEach(function (s, i) { defs += '<path id="' + u + "p" + i + '" pathLength="1" d="' + s.d + '"/>'; uses += '<use href="#' + u + "p" + i + '"/>'; });
          var svg = q(".sb-svg");
          svg.innerHTML = "<defs>" + defs + '</defs><g class="sb-place"><g class="sb-bd" transform="matrix(1 0 0 -1 0 ' + 2 * FL + ')"><g mask="url(#' + u + 'm)"><g filter="url(#' + u + 'r)" opacity="0.42"><use href="#' + u + 's"/></g></g></g>' +
            '<g id="' + u + 's">' + [["--sb-glow", 76, "w"], ["--k-accent", 42, "n"], ["--k-accent", 30], ["--sb-core", 9.6]].map(function (l) {
              return '<g style="stroke:var(' + l[0] + ");stroke-width:" + l[1] + '"' + (l[2] ? ' filter="url(#' + u + l[2] + ')"' : "") + ">" + uses + "</g>";
            }).join("") + "</g></g>";
          var sign = svg.querySelector(".sb-place").lastChild;
          var lay = [].map.call(sign.children, function (g) { return [].slice.call(g.children); });

          // fit: the sign takes at most L.w of the width at its upstream size; everything around it follows its scale
          var sc = Math.min(1, (FW * L.w) / WD), ox = (FW - WD * sc) / 2, oy = FH * L.cy - 200 * sc, cam = q(".sb-cam");
          svg.querySelector(".sb-place").style.transform = "translate(" + ox + "px," + oy + "px) scale(" + sc + ")";
          [["--fy", FL], ["--by", FL + 20], ["--sy", 400 + GAP], ["--wy", 211.6]].forEach(function (p) { cam.style.setProperty(p[0], (oy + p[1] * sc).toFixed(1) + "px"); });
          [["--wrx", 0.64 * WD], ["--wry", 441.6], ["--brx", 0.56 * WD], ["--bry", 60]].forEach(function (p) { cam.style.setProperty(p[0], (p[1] * sc).toFixed(1) + "px"); });

          // subtitle: name and line split into units (spaces kept), fitted together; the dot rides on the line's first
          // unit so a wrap never leaves it hanging; an empty part is removed with its dot
          var sub = q(".sb-sub"), nm = q(".sb-name"), tg = q(".sb-tag"), dot = q(".sb-dot");
          var hasN = String(v.name).trim(), hasT = String(v.sub).trim();
          if (hasN) kSplit(nm, "word", false, v.name); else nm.remove();
          if (hasT) kSplit(tg, "word", false, v.sub); else tg.remove();
          if (hasN && hasT) tg.firstChild.insertBefore(dot, tg.firstChild.firstChild); else dot.remove();
          if (hasN || hasT) kFit(sub, { lines: 2, min: 40 }); else sub.remove();

          var wall = q(".sb-wall"), band = q(".sb-band"), grain = kGrain(q(".sb-grain"), { opacity: 0.09, blend: "soft-light" });
          var strike = function (df) {
            if (df >= 7 || df <= 0) return df > 0 ? STV[6] : 0;
            for (var k = 1; k < 7; k++) if (df < STF[k]) return MT.mix(STV[k - 1], STV[k], (df - STF[k - 1]) / (STF[k] - STF[k - 1]));
          };
          var tl = MT.scene(CFG.dur, function (t) {
            var f = t * 30, lit = 0; // frames at 30 fps
            var rev = MT.ramp(t, CFG.reveal, CFG.rev, "snappy");
            var sg = MT.interpolate(t, CFG.surge, [0, 1, 0], { easing: "out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
            segs.forEach(function (s, i) {
              var sf = s.at * 30, on = f >= sf;
              if (f >= sf + 1) lit++;
              var lv = f >= sf + 7 ? (0.58 + 0.42 * rev) * (1 + 0.035 * Math.sin(f * 0.9 + i * 2.3) * Math.sin(f * 0.37 + i)) : strike(f - sf);
              var b = lv * (1 + 0.25 * sg), o = [Math.min(1, 0.4 * b + 0.4 * sg), Math.min(1, 0.75 * b), Math.min(1, 0.35 + 0.65 * b), Math.min(1, b)];
              for (var k = 0; k < 4; k++) { lay[k][i].style.display = on ? "" : "none"; lay[k][i].style.opacity = o[k].toFixed(3); }
            });
            var p = 1 + 0.02 * sg;
            sign.setAttribute("transform", "matrix(" + p + " 0 0 " + p + " " + (WD / 2) * (1 - p) + " " + 200 * (1 - p) + ")");
            var amb = 0.12 + (0.5 * lit) / segs.length + 0.35 * rev + 0.3 * sg;
            wall.style.opacity = Math.min(1, amb).toFixed(3);
            band.style.opacity = Math.min(1, amb * 0.9).toFixed(3);
            cam.style.transform = "scale(" + (1 + CFG.push * MT.ramp(t, 0, CFG.dur, "smooth")) + ")";
            var kp = MT.ramp(t, CFG.sub, CFG.subDur, "out");
            if (sub.isConnected) { sub.style.opacity = kp; sub.style.transform = "translateY(" + ((1 - kp) * 0.44).toFixed(3) + "em)"; }
            grain(t);
          });
          window.__timelines["stroke-segment-build"] = tl;
        })();
      </script>
    </template>

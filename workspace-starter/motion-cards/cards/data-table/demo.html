<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"标题（可空）","default":"三种提问方式的效果对比"},
    {"id":"cols","type":"string","label":"表头（用 | 分隔，2–5 列）","default":"方式|耗时|成本|准确率"},
    {"id":"rows","type":"string","label":"内容（行用 ; 分隔，格用 |，2–6 行；数字格会滚动，开头加英文单引号的格不滚）","default":"直接提问|12.4s|¥0.08|71%;给出示例|9.6s|¥0.12|86%;分步引导|15.2s|¥0.21|93%"},
    {"id":"mark","type":"string","label":"高亮（row:3 第 3 行 / col:2 第 2 列 / none）","default":"row:3"},
    {"id":"badge","type":"string","label":"角标（可空，跟着高亮出现）","default":"最准"},
    {"id":"hit","type":"number","label":"高亮扫过的时刻（秒）","default":2.6,"min":0.5,"max":20,"step":0.05},
    {"id":"cues","type":"string","label":"每行出现的秒数（逗号分隔，空 = 每 0.32 秒一行）","default":""},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>data-table · 数据表格</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="data-table-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute; inset: 0; overflow: hidden;
          font-family: var(--k-font); color: var(--k-ink);
        }
        /* the wrapper is the size container; what changes with orientation lives inside it */
        .dt { position: absolute; inset: 0; container-type: size; --dt-rule: color-mix(in srgb, var(--k-ink) 14%, transparent); }
        .dt-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .dt-box { position: absolute; top: 5%; bottom: 5%; left: 0; right: 0; display: flex; align-items: center; justify-content: center; }
        .dt-stack { display: flex; flex-direction: column; width: 60%; }
        .dt-title { display: block; margin: 0 0 44px; font-size: 76px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
        /* sizes as variables: the script shrinks a crowded table here */
        .dt-tbl { position: relative; --dt-fb: 56px; --dt-fh: 42px; --dt-py: 26px; --dt-px: 36px; --dt-r: 22px; }
        .dt-frame { position: absolute; inset: 0; border-radius: var(--dt-r); background: var(--k-bg); border: 2px solid var(--dt-rule); }
        /* static clip: a rising row never shows below the frame */
        .dt-grid { position: relative; display: grid; padding: 2px; clip-path: inset(2px round calc(var(--dt-r) - 2px)); }
        .dt-hbg { background: var(--k-panel); border-radius: calc(var(--dt-r) - 2px) calc(var(--dt-r) - 2px) 0 0; }
        .dt-sep { border-top: 2px solid var(--dt-rule); }
        .dt-band { z-index: 1; margin: 6px 8px; border-radius: 14px; background: color-mix(in srgb, var(--k-accent) 10%, transparent); box-shadow: inset 0 0 0 3px var(--k-accent); }
        .dt-c { z-index: 2; display: flex; align-items: center; justify-content: center; gap: 18px; padding: var(--dt-py) var(--dt-px); font-size: var(--dt-fb); font-weight: 500; line-height: 1.3; white-space: nowrap; }
        .dt-h { padding: calc(var(--dt-py) * 0.75) var(--dt-px); font-size: var(--dt-fh); font-weight: 700; text-align: center; }
        .dt-l { justify-content: flex-start; text-align: left; }
        .dt-name { font-weight: 700; }
        .dt-x, .dt-v { display: block; }
        .dt-v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
        .dt-on { color: var(--k-accent); }
        .dt-badge { display: block; flex: none; padding: 4px 18px; border-radius: 999px; background: var(--k-accent); color: var(--k-on-accent); font-size: 34px; font-weight: 800; line-height: 1.3; white-space: nowrap; }
        .dt-badge.dt-top { position: absolute; z-index: 3; }
        /* stacked rows (portrait): the first cell is its own line above the values */
        .dt-k .dt-name { padding-bottom: 0; }
        .dt-k .dt-c:not(.dt-name):not(.dt-h) { padding-top: calc(var(--dt-py) * 0.4); }
        /* wrap long text cells (dt-wrap), then all text cells (dt-wrap2); headers and numbers never wrap */
        .dt-wrap .dt-w, .dt-wrap2 .dt-t { white-space: normal; text-wrap: balance; justify-content: flex-start; }
        /* portrait: the stack sits in the 12%-68% band (middle on the 40% line), 11% off each side */
        @container (orientation: portrait) {
          .dt-box { top: 12%; bottom: 32%; }
          .dt-stack { width: 78%; }
          .dt-title { margin-bottom: 36px; font-size: 72px; }
          .dt-tbl { --dt-fb: 48px; --dt-fh: 40px; --dt-py: 24px; --dt-px: 20px; --dt-r: 18px; }
          .dt-band { margin: 6px; }
          .dt-c { gap: 12px; }
          .dt-badge { padding: 4px 14px; font-size: 30px; }
        }
      </style>

      <div id="root" data-composition-id="data-table">
        <div class="dt">
          <div class="dt-bg"></div>
          <div class="dt-box">
            <div class="dt-stack">
              <div class="dt-title">三种提问方式的效果对比</div>
              <div class="dt-tbl">
                <div class="dt-frame"></div>
                <div class="dt-grid" style="grid-template-columns:repeat(4,auto)">
                  <div class="dt-hbg" style="grid-area:1/1/2/5"></div>
                  <div class="dt-sep" style="grid-area:3/1/4/5"></div>
                  <div class="dt-sep" style="grid-area:4/1/5/5"></div>
                  <div class="dt-band" style="grid-area:4/1/5/5"></div>
                  <div class="dt-c dt-h dt-l" style="grid-area:1/1"><span class="dt-x">方式</span></div>
                  <div class="dt-c dt-h" style="grid-area:1/2"><span class="dt-x">耗时</span></div>
                  <div class="dt-c dt-h" style="grid-area:1/3"><span class="dt-x">成本</span></div>
                  <div class="dt-c dt-h" style="grid-area:1/4"><span class="dt-x">准确率</span></div>
                  <div class="dt-c dt-l dt-name" style="grid-area:2/1"><span class="dt-x">直接提问</span></div>
                  <div class="dt-c" style="grid-area:2/2"><span class="dt-v">12.4s</span></div>
                  <div class="dt-c" style="grid-area:2/3"><span class="dt-v">¥0.08</span></div>
                  <div class="dt-c" style="grid-area:2/4"><span class="dt-v">71%</span></div>
                  <div class="dt-c dt-l dt-name" style="grid-area:3/1"><span class="dt-x">给出示例</span></div>
                  <div class="dt-c" style="grid-area:3/2"><span class="dt-v">9.6s</span></div>
                  <div class="dt-c" style="grid-area:3/3"><span class="dt-v">¥0.12</span></div>
                  <div class="dt-c" style="grid-area:3/4"><span class="dt-v">86%</span></div>
                  <div class="dt-c dt-l dt-name" style="grid-area:4/1"><span class="dt-x dt-on">分步引导</span><span class="dt-badge">最准</span></div>
                  <div class="dt-c" style="grid-area:4/2"><span class="dt-v dt-on">15.2s</span></div>
                  <div class="dt-c" style="grid-area:4/3"><span class="dt-v dt-on">¥0.21</span></div>
                  <div class="dt-c" style="grid-area:4/4"><span class="dt-v dt-on">93%</span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // timing (s), shared by both orientations
          var CFG = { title: 0.1, titleDur: 0.5, frame: 0.3, frameDur: 0.3, head: 0.35, headDur: 0.45, label: 0.45, labelEach: 0.07, labelDur: 0.35,
            rows: 0.95, each: 0.32, minGap: 0.12, rowDur: 0.5, fade: 0.35, numIn: 0.2, roll: 0.8, sweep: 0.45, tint: 0.12, pop: 1.14, popUp: 0.12, popDown: 0.3, badgeLag: 0.85, badgeDur: 0.36 };
          // layout: stack width (share of frame); title px (one line tmax..t1, else up to tl lines t2..tmin);
          // body / header font and floors; row padding; motion px
          var LAND = { boxW: 0.75, minW: 0.6, tmax: 76, t1: 64, t2: 68, tmin: 60, tl: 2, fb: 56, fh: 42, fmin: 40, hmin: 34, py: 26, pyMin: 12, rise: 36, slide: 44, label: 24, lane: 18, maxCols: 5 };
          var PORT = { boxW: 0.78, minW: 0.78, tmax: 72, t1: 72, t2: 72, tmin: 72, tl: 3, fb: 48, fh: 40, fmin: 40, hmin: 32, py: 24, pyMin: 8, rise: 32, slide: 36, label: 18, lane: 14, maxCols: 4 };
          var v = { title: "三种提问方式的效果对比", cols: "方式|耗时|成本|准确率", rows: "直接提问|12.4s|¥0.08|71%;给出示例|9.6s|¥0.12|86%;分步引导|15.2s|¥0.21|93%", mark: "row:3", badge: "最准", hit: 2.6, cues: "", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            // title, badge and cues may be set to "" on purpose
            for (var k in got) if (got[k] !== undefined && got[k] !== null && (got[k] !== "" || k === "title" || k === "badge" || k === "cues")) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".dt");
          var q = function (s) { return root.querySelector(s); };
          var FW = root.clientWidth, FH = root.clientHeight;
          if (!FW || !FH) {
            // not laid out yet: the host clip's declared size, then the window
            var hc = root.closest("[data-width][data-height]");
            FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          var P = FH > FW, L = P ? PORT : LAND;
          root.setAttribute("data-orient", P ? "portrait" : "landscape");
          if (String(v.backdrop) === "off") q(".dt-bg").style.display = "none";

          // ---- data: 2-5 header cells, 1-6 rows padded / cut to that width
          var cut = function (s, re) { return String(s).split(re).map(function (x) { return x.trim(); }); };
          var cols = cut(v.cols, /[|｜]/).slice(0, 5);
          while (cols.length < 2) cols.push("");
          var nc = cols.length;
          var data = cut(v.rows, /[;；]/).filter(Boolean).slice(0, 6).map(function (r) {
            var c = cut(r, /[|｜]/);
            while (c.length < nc) c.push("");
            return c.slice(0, nc);
          });
          // number cell: prefix (¥ $ 约), sign, digits (1,234), decimals, short unit
          var NUM = /^([^\d\sA-Za-z+\-−.,]{0,3})(\s?)([+\-−]?)(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?(\s?[^\d]{0,4})$/;
          var parse = function (s) {
            // a leading ' keeps a cell as text; ordinals (第1名) never roll
            var m = s.charAt(0) === "'" ? null : NUM.exec(s);
            if (!m || m[1].indexOf("第") >= 0) return null;
            var n = parseFloat(m[4].replace(/,/g, "") + (m[5] || ""));
            return { pre: m[1] + m[2], sign: m[3], val: m[3] && m[3] !== "+" ? -n : n, dec: m[5] ? m[5].length - 1 : 0, group: m[4].indexOf(",") > 0, suf: m[6], s: { n: 0 } };
          };
          var fmt = function (c, n) {
            var s = Math.abs(n).toFixed(c.dec), neg = n < 0 && +s !== 0;
            if (c.group) s = s.replace(/^\d+/, function (d) { return d.replace(/\B(?=(\d{3})+$)/g, ","); });
            return c.pre + (neg ? c.sign || "-" : c.sign === "+" ? "+" : "") + s + c.suf;
          };
          // width in em (CJK 1, Latin 0.6)
          var em = function (s) { var w = 0; for (var c = 0; c < s.length; c++) w += s.charCodeAt(c) > 255 ? 1 : 0.6; return w; };
          var mm = /^(row|col)\s*[:：]\s*(\d+)$/i.exec(String(v.mark).trim());
          var mark = mm ? { row: mm[1].toLowerCase() === "row", n: +mm[2] } : null;
          if (mark && (mark.n < 1 || mark.n > (mark.row ? data.length : nc))) mark = null;
          var badgeText = mark ? String(v.badge).trim() : "";

          // ---- build the grid (stacked: the first cell gets its own line)
          var grid = q(".dt-grid"), tbl = q(".dt-tbl"), stack = q(".dt-stack"), box = q(".dt-box"), titleEl = q(".dt-title");
          var stacked = false, B;
          var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
          var build = function () {
            grid.innerHTML = "";
            grid.className = "dt-grid" + (stacked ? " dt-k" : "");
            var vc = stacked ? nc - 1 : nc, span = stacked ? 2 : 1, end = 2 + data.length * span;
            grid.style.gridTemplateColumns = "repeat(" + vc + ", auto)";
            var mk = function (cls, r0, c0, r1, c1, html) {
              var d = document.createElement("div");
              d.className = cls;
              d.style.gridArea = r0 + " / " + c0 + " / " + r1 + " / " + c1;
              if (html !== undefined) d.innerHTML = html;
              grid.appendChild(d);
              return d;
            };
            B = { hbg: mk("dt-hbg", 1, 1, 2, vc + 1), rows: [], heads: [], cells: [], nums: [], band: null, badge: null };
            data.forEach(function (row, i) {
              var r = 2 + i * span;
              B.rows.push({ items: i ? [mk("dt-sep", r, 1, r + span, vc + 1)] : [], fades: [], nums: [] });
            });
            if (mark) {
              var c = stacked ? mark.n - 1 : mark.n;
              if (mark.row) { var r = 2 + (mark.n - 1) * span; B.band = mk("dt-band", r, 1, r + span, vc + 1); }
              else if (c >= 1) B.band = mk("dt-band", 1, c, end, c + 1);
            }
            cols.forEach(function (h, j) {
              if (stacked && !j) return;
              var cj = stacked ? j : j + 1;
              B.heads.push(mk("dt-c dt-h" + (j ? "" : " dt-l"), 1, cj, 2, cj + 1, '<span class="dt-x">' + esc(h) + "</span>").firstChild);
            });
            data.forEach(function (row, i) {
              var r = 2 + i * span, R = B.rows[i];
              row.forEach(function (s, j) {
                var num = j ? parse(s) : null, el;
                var html = num ? '<span class="dt-v">' + esc(fmt(num, num.val)) + "</span>" : '<span class="dt-x">' + esc(s.replace(/^'/, "")) + "</span>";
                var on = mark && (mark.row ? mark.n === i + 1 : mark.n === j + 1);
                if (!j && on && mark.row && badgeText) html += '<span class="dt-badge">' + esc(badgeText) + "</span>";
                if (stacked && !j) el = mk("dt-c dt-l dt-name", r, 1, r + 1, nc);
                else if (stacked) el = mk("dt-c", r + 1, j, r + 2, j + 1);
                else el = mk("dt-c" + (j ? "" : " dt-l dt-name"), r, j + 1, r + 1, j + 2);
                if (!num) el.className += " dt-t" + (em(s) > 6 ? " dt-w" : "");
                el.innerHTML = html;
                R.items.push(el);
                (num ? R.nums : R.fades).push(el);
                var cell = { el: el, span: el.firstChild, num: num, i: i, on: on };
                if (num) { num.span = cell.span; num.i = i; B.nums.push(num); }
                if (on) B.cells.push(cell);
                B.badge = el.querySelector(".dt-badge") || B.badge;
              });
              R.fades = R.fades.concat(R.items.filter(function (x) { return x.className === "dt-sep"; }));
            });
          };
          if (P && nc > L.maxCols) stacked = true;
          build();

          // ---- width: body font, header font (to floors), stack (portrait), wrap; still too wide = scale the block
          var BW = Math.round(FW * L.boxW), fb = L.fb, fh = L.fh, py = L.py, wraps = 0, sc = 1;
          // sizes; each value box locked to its final width so units never slide
          var apply = function () {
            tbl.style.setProperty("--dt-fb", fb + "px");
            tbl.style.setProperty("--dt-fh", Math.min(fh, fb) + "px");
            tbl.style.setProperty("--dt-py", py + "px");
            B.nums.forEach(function (c) { c.span.style.width = ""; });
            B.nums.map(function (c) { return c.span.offsetWidth + 4; }).forEach(function (w, k) { B.nums[k].span.style.width = w + "px"; });
          };
          var natural = function (m) { grid.style.width = m || "max-content"; var w = grid.offsetWidth; grid.style.width = ""; return w; };
          var need = function () { return natural(wraps ? "min-content" : ""); };
          stack.style.width = BW + "px";
          apply();
          for (var it = 0; it < 30 && need() > BW; it++) {
            if (fb > L.fmin) fb = Math.max(L.fmin, Math.floor((fb * BW) / natural()));
            else if (Math.min(fh, fb) > L.hmin) fh = Math.min(fh, fb) - 2;
            else if (P && !stacked && nc > 2) { stacked = true; fh = L.fh; build(); }
            else if (wraps < 2) { grid.classList.add(++wraps > 1 ? "dt-wrap2" : "dt-wrap"); fh = L.fh; }
            else break;
            apply();
          }
          var W = P || wraps ? BW : Math.max(Math.round(FW * L.minW), Math.min(BW, natural()));
          if (need() > W) sc = BW / (W = need());
          stack.style.width = W + "px";
          // title: one line down to t1, else up to tl balanced lines t2..tmin
          var title = String(v.title).trim(), tf = L.tmax;
          var setT = function (f) { titleEl.style.fontSize = (tf = f) + "px"; };
          var tLines = function () { return Math.round(titleEl.offsetHeight / (tf * 1.2)); };
          if (title) {
            titleEl.textContent = title;
            setT(L.tmax);
            while (tf > L.t1 && tLines() > 1) setT(tf - 2);
            if (tLines() > 1) { setT(L.t2); while (tf > L.tmin && tLines() > L.tl) setT(tf - 2); }
          } else titleEl.style.display = "none";
          // a column badge stands above its header: reserve the lane first
          if (badgeText && !B.badge) {
            B.badge = document.createElement("span");
            B.badge.className = "dt-badge dt-top";
            B.badge.textContent = badgeText;
            tbl.appendChild(B.badge);
            tbl.style.marginTop = B.badge.offsetHeight + 2 * L.lane + "px";
          }
          // too tall: row padding, body, title, header (to floors), then scale the block
          var BH = (box.clientHeight || FH * 0.83) - 16; // 8px of air at both ends of the band
          for (it = 0; it < 40 && stack.offsetHeight * sc > BH; it++) {
            var over = stack.offsetHeight - BH / sc, lines = B.rows.length * (stacked ? 2 : 1) + 1;
            if (py > L.pyMin) py = Math.max(L.pyMin, py - Math.ceil(over / (2 * lines)));
            else if (fb > L.fmin) fb -= 2;
            else if (title && tf > L.tmin) setT(Math.max(L.tmin, tf - 4));
            else if (Math.min(fh, fb) > L.hmin) fh = Math.min(fh, fb) - 2;
            else break;
            apply();
          }
          if (stack.offsetHeight * sc > BH) sc = BH / stack.offsetHeight;
          if (sc < 1) stack.style.transform = "scale(" + sc.toFixed(4) + ")";
          if (B.badge && B.badge.className.indexOf("dt-top") >= 0) {
            var bl = B.band ? B.band.offsetLeft + B.band.offsetWidth / 2 - B.badge.offsetWidth / 2 : 0;
            B.badge.style.left = Math.max(0, Math.min(tbl.offsetWidth - B.badge.offsetWidth, bl)) + "px";
            B.badge.style.top = -(B.badge.offsetHeight + L.lane) + "px";
          }

          // ---- timing: row cues (after the header, CFG.minGap apart); the hit waits for the last numbers
          var cs = String(v.cues).split(/[,，\s]+/).map(parseFloat).filter(isFinite);
          var gap = cs.length > 1 ? Math.max(0.1, cs[cs.length - 1] - cs[cs.length - 2]) : CFG.each;
          var cues = [], floor = CFG.head + 0.3;
          B.rows.forEach(function (R, i) {
            var t = i < cs.length ? cs[i] : i ? cues[i - 1] + gap : CFG.rows;
            cues.push(Math.max(floor, i ? cues[i - 1] + CFG.minGap : 0, t));
          });
          var last = cues.length ? cues[cues.length - 1] : CFG.rows;
          var hitT = Math.max(parseFloat(v.hit) || 0, last + Math.max(CFG.rowDur, CFG.roll) + 0.05);

          // each marked cell's text centre along the band (0 start, 1 end)
          var row = mark && mark.row, br = B.band && B.band.getBoundingClientRect();
          B.cells.forEach(function (c) {
            var r = c.span.getBoundingClientRect();
            c.f = br ? (row ? r.left + r.width / 2 - br.left : r.top + r.height / 2 - br.top) / Math.max(1, row ? br.width : br.height) : (c.i + 0.5) / B.rows.length;
          });

          var render = function () { B.nums.forEach(function (c) { c.span.textContent = fmt(c, c.s.n); }); };
          var tl = MT.timeline({ onUpdate: render });
          if (title) tl.fromTo(titleEl, { opacity: 0, y: L.rise }, { opacity: 1, y: 0, duration: CFG.titleDur, ease: "out" }, CFG.title);
          // frame, then the header bar wipes in from the left, labels follow
          tl.fromTo(q(".dt-frame"), { opacity: 0 }, { opacity: 1, duration: CFG.frameDur, ease: "none" }, CFG.frame);
          tl.fromTo(B.hbg, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: CFG.headDur, ease: "snappy" }, CFG.head);
          tl.fromTo(B.heads, { opacity: 0, x: -L.label }, { opacity: 1, x: 0, duration: CFG.labelDur, ease: "power3.out", stagger: CFG.labelEach }, CFG.label);
          // rows rise on their cues; numbers roll from 0, text fades in
          B.rows.forEach(function (R, i) {
            var t = cues[i];
            tl.fromTo(R.items, { y: L.slide }, { y: 0, duration: CFG.rowDur, ease: "power3.out" }, t);
            tl.fromTo(R.fades, { opacity: 0 }, { opacity: 1, duration: CFG.fade, ease: "power1.out" }, t);
            tl.fromTo(R.nums, { opacity: 0 }, { opacity: 1, duration: CFG.numIn, ease: "none" }, t);
          });
          B.nums.forEach(function (c) { tl.fromTo(c.s, { n: 0 }, { n: c.val, duration: CFG.roll, ease: "power3.out" }, cues[c.i]); });
          // hit: the band's width (row) / height (column) grows, so outline and corners keep their size; a cell
          // turns accent when the edge passes its text centre (power2.out inverted), numbers kick
          tl.addLabel("hit", hitT);
          if (B.band) {
            var bw = B.band.offsetWidth, bh = B.band.offsetHeight;
            B.band.style.cssText += ";width:" + bw + "px;height:" + bh + "px;place-self:start";
            tl.fromTo(B.band, row ? { width: 0 } : { height: 0 }, row ? { width: bw, duration: CFG.sweep, ease: "power2.out" } : { height: bh, duration: CFG.sweep, ease: "power2.out" }, hitT);
          }
          B.cells.forEach(function (c) {
            var t = hitT + CFG.sweep * (1 - Math.cbrt(1 - Math.max(0, Math.min(1, c.f))));
            tl.to(c.span, { color: "var(--k-accent)", duration: CFG.tint, ease: "none" }, t);
            if (c.num) {
              tl.fromTo(c.span, { scale: 1 }, { scale: CFG.pop, duration: CFG.popUp, ease: "power2.out" }, t);
              tl.to(c.span, { scale: 1, duration: CFG.popDown, ease: "back.out(3)" }, t + CFG.popUp);
            }
          });
          if (B.badge) tl.fromTo(B.badge, { scale: 0 }, { scale: 1, duration: CFG.badgeDur, ease: "back.out(2.4)" }, hitT + CFG.sweep * CFG.badgeLag);
          render();
          window.__timelines["data-table"] = tl;
        })();
      </script>
    </template>
  </body>

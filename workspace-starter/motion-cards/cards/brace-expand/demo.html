            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====

          kTone(root);
          if (String(v.backdrop) === "off") ["bg", "vig", "grain"].forEach(function (n) { q(".be-" + n).style.display = "none"; });
          var grain = kGrain(q(".be-grain"));
          var bl = q(".be-bl"), brr = q(".be-brr"), title = q(".be-title"), tm = q(".be-tm"), caret = q(".be-caret");
          var kick = q(".be-kick"), sub = q(".be-sub"), cam = q(".be-cam"), refl = q(".be-refl"), key = q(".be-key");
          var CX = FW / 2, CY = FH * L.cy, edge = FW * 0.4; // braces' outer edges stay inside the 10% side margins

          // brace glyph geometry in em, measured from the real mono font: advance and the gap centre -> inner ink edge
          // (upstream: 64px at 300px for its mono). Falls back to 0.55 / 0.2 em when canvas cannot measure.
          var adv = 0.55, inner = 0.2;
          try {
            var cx = document.createElement("canvas").getContext("2d"), bcs = getComputedStyle(bl);
            cx.font = "500 100px " + bcs.fontFamily;
            var mm = cx.measureText("{");
            if (mm.width > 30 && mm.actualBoundingBoxRight > 0) { adv = mm.width / 100; inner = MT.clamp((mm.actualBoundingBoxRight - mm.width / 2) / 100, 0.08, 0.3); }
          } catch (e) {}

          // title: phrases from the variable, measured at its final tracking, frozen into lines (tracking moves later)
          var latin = !kCJK.test(String(v.title));
          var LS = latin ? [-0.05, -0.03] : [0, 0.02];
          var pad = 0.287; // upstream: 47px of air per side at 164px, between the title and the inner edge
          var maxW = 2 * (edge - L.brace * (adv / 2 + inner) - pad * L.title);
          title.style.width = maxW + "px";
          title.style.letterSpacing = LS[1] + "em";
          kSplit(title, "word", false, v.title);
          var fit = kFit(title, { max: L.title, min: L.min, lines: L.lines, width: maxW });
          kRows(title, "be-row");
          var fs = fit.size, lines = Math.max(1, fit.lines), tw = Math.min(maxW, fit.w);
          var BFS = Math.min(L.brace, 1.83 * fs * (lines > 1 ? 1.25 : 1)), K = BFS / 300;
          var IN = inner * BFS;
          // half-distance of the brace centres at rest: the title plus its air, never tighter than 4 em of title
          var HALF = Math.min(edge - (adv / 2) * BFS, Math.max(tw / 2 + pad * fs, 2 * fs) + IN);
          var TH = title.offsetHeight;
          [bl, brr].forEach(function (b) { b.style.fontSize = BFS + "px"; b.style.top = CY + "px"; });
          title.style.top = CY + "px";
          caret.style.cssText += ";top:" + CY + "px;width:" + 8 * K + "px;height:" + 120 * K + "px;margin:" + -60 * K + "px 0 0 " + -4 * K + "px;box-shadow:" + kGlow("var(--k-accent)", 0.6);
          refl.style.top = CY + 150 * K + "px"; refl.style.height = 90 * K + "px";
          cam.style.transformOrigin = "50% " + CY + "px";

          // eyebrow and subtitle sit off the brace block (upstream: 206px above, 170px below the middle at brace 300px)
          var upper = Math.max(206 * K, TH / 2 + 0.2 * BFS), lower = Math.max(170 * K, TH / 2 + 0.12 * BFS);
          var hasKick = String(v.kicker).trim() !== "", hasSub = String(v.sub).trim() !== "";
          kick.style.display = hasKick ? "" : "none";
          sub.style.display = hasSub ? "" : "none";
          kick.style.bottom = FH - CY + upper + "px";
          sub.style.top = CY + lower + "px";
          var tl = MT.scene(CFG.dur, render);
          if (hasKick) {
            kick.style.letterSpacing = "0.5em"; // fit at the widest tracking, so the closing move never leaves the frame
            kSplit(kick, "line", false, v.kicker); // one unit: a code comment keeps every typed space ("// x")
            kFit(kick, { lines: 2, min: 40, width: FW * 0.78 });
            tl.fromTo(kick, { letterSpacing: "0.5em" }, { letterSpacing: "0.08em", duration: CFG.kickTrack, ease: "snappy" }, CFG.kick);
            tl.fromTo(kick, { opacity: 0 }, { opacity: 1, duration: CFG.kickFade, ease: "out" }, CFG.kick);
          }
          if (hasSub) {
            var su = kSplit(sub, "word", false, v.sub);
            kFit(sub, { lines: 2, min: 40, width: FW * 0.78 });
            kReveal(tl, su, "blur", CFG.sub, { each: CFG.subEach, gap: CFG.subGap });
          }

          var sbL = kSpeedBlur(q(".be-sb"), "be", CFG.blur), sbR = kSpeedBlur(root.querySelectorAll(".be-sb")[1], "be", CFG.blur);
          var exAt = function (t) { return t < CFG.expand ? 0 : MT.spring({ t: t, delay: CFG.expand, damping: CFG.spring.damping, stiffness: CFG.spring.stiffness }); };
          // curtain half-width: displacement times scale, so growing also pushes the braces apart; 0 = inner edges touch
          var xAt = function (t) { var ex = exAt(t); return (HALF - IN) * ex * MT.mix(CFG.sc0, 1, ex); };

          function render(t) {
            var f = t * 30; // frames at 30 fps
            var on = t >= CFG.appear, ex = exAt(t), sc = MT.mix(CFG.sc0, 1, ex), x = xAt(t), bx = x + IN * sc;
            var vx = MT.velocity(xAt, t);
            var glowK = Math.min(1, ex) * (1 - MT.ramp(t, CFG.glowFade, CFG.glowFadeDur, "out"));
            grain(t);
            key.style.opacity = (1 + 0.048 * Math.sin(f / 38)).toFixed(3); // upstream breathe 0.4 on the key light
            caret.style.opacity = !on && Math.floor(f / 3) % 2 === 0 ? 1 : 0;
            [[bl, -bx, sbL, -vx], [brr, bx, sbR, vx]].forEach(function (b) {
              b[0].style.opacity = on ? 1 : 0;
              b[0].style.left = CX + b[1] + "px";
              b[0].style.transform = "translate(-50%, -52%) scale(" + sc.toFixed(4) + ")";
              b[0].style.textShadow = on ? kGlow("var(--k-accent)", 0.5 + 0.5 * glowK) : "none";
              b[2](on ? b[3] : 0, 0);
            });
            // the title is revealed only between the inner brace edges, with a feather that narrows when the gap does
            var w = Math.max(0, 2 * x), fe = Math.min(CFG.feather * K, w / 4), a = CX - x, z = CX + x;
            var m = "linear-gradient(90deg, transparent " + a + "px, #000 " + (a + fe) + "px, #000 " + (z - fe) + "px, transparent " + z + "px)";
            tm.style.webkitMaskImage = tm.style.maskImage = m;
            tm.style.opacity = on && w > 0.5 ? 1 : 0;
            title.style.transform = "translate(-50%, -54%) scale(" + sc.toFixed(4) + ")";
            title.style.letterSpacing = MT.mix(LS[0], LS[1], MT.ramp(t, CFG.relax, CFG.relaxDur, "smooth")).toFixed(4) + "em";
            refl.style.left = CX - (x + 120 * K) + "px";
            refl.style.width = 2 * (x + 120 * K) + "px";
            refl.style.opacity = Math.min(1, ex);
            cam.style.transform = "scale(" + (1 + (CFG.pushTo - 1) * MT.ramp(t, CFG.push, CFG.pushDur, "smooth")).toFixed(5) + ")";
          }
          window.__timelines["brace-expand"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

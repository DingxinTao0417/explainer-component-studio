        .gt-sa { background: radial-gradient(ellipse 62% 78% at 64% 54%, transparent 18%, color-mix(in srgb, var(--gt-dk) 55%, transparent) 64%, color-mix(in srgb, var(--gt-dk) 92%, transparent) 100%); }
        .gt-sb { background: linear-gradient(90deg, color-mix(in srgb, var(--gt-dk) 55%, transparent) 0%, transparent 46%); }
        .gt-sl { opacity: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--gt-dk) 42%, transparent) 0%, transparent 55%); }

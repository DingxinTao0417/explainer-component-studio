<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"暗场和界面"},{"value":"off","label":"透明（只留飞线和脉冲）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>flyline-arc · 飞线连接</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="flyline-arc-template">
<!-- Ported from video-shotcraft demos/effects/glow-flyline-moves/FlylineArc.tsx
     (github.com/Vincentwei1021/video-shotcraft), Apache-2.0, Copyright 2026 Wei Yihao.
     Licence and notice: motion-cards/THIRD_PARTY/video-shotcraft/.
     Changes (2026-10): re-implemented from Remotion/React as a HyperFrames MT sub-composition, frames to seconds;
     neutral --k-* palette with --k-stage (indigo glow 128,138,255 -> accent-2 lightened), system fonts;
     upstream dark FakeDashboard (mark, wordmark, nav labels, initials) replaced by the text-free kit fake UI in
     stage colours, dimmed the same way (brightness 0.65, saturate 0.9); portrait: the UI 1320 px tall at the top,
     the second hop lands on the lower middle card and returns to the upper middle one, control points redrawn.
     Kept: frame timings (10/46 start, 22f growth out-cubic, 10f settle, 6f anchor), 100 butt segments with the
     0.3 + 0.7 k^2 tail, 18/7/3.5 px strokes, 9-point comet, r40 halo, end node, pulse 6f up / 12f down to 0.25,
     14f ring, blur 10, vignette 0.5, grain 0.07. -->
<style>
@font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
@font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
@font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
#root {
  --k-bg: var(--mc-bg, #ffffff);
  --k-panel: var(--mc-panel, #f4f5f7);
  --k-ink: var(--mc-ink, #15171c);
  --k-muted: var(--mc-muted, #6b7280);
  --k-accent: var(--mc-accent, #e8590c);
  --k-accent-2: var(--mc-accent-2, #2563eb);
  --k-on-accent: var(--mc-on-accent, #ffffff);
  --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
  --k-stage: var(--mc-stage, #0b0d12);
  --k-on-stage: var(--mc-on-stage, #f3f5f8);
  position: absolute;
  inset: 0;
  overflow: hidden;
  font-family: var(--k-font);
  color: var(--k-ink);
}
/* ==== kit:stage@1 (base and vignette lines) ==== */
.fa-stage { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--k-stage), white 5%) 0%, var(--k-stage) 52%, color-mix(in srgb, var(--k-stage), black 35%) 100%); }
.fa-stage ~ .fa-vig, .fa-stage ~ * .fa-vig { --vs: 0.55; --vc: color-mix(in srgb, var(--k-stage) 40%, black); }
/* ==== end kit:stage ==== */
/* ==== kit:vignette@1 ==== */
.fa-vig {
  position: absolute; inset: 0; pointer-events: none;
  --vs: 0.16; --vin: 45%; --vx: 50%; --vy: 46%; --vc: var(--fa-shade);
  background:
    radial-gradient(ellipse 72% 72% at var(--vx) var(--vy), transparent var(--vin), color-mix(in srgb, var(--vc) calc(var(--vs) * 32%), transparent) calc(var(--vin) + (100% - var(--vin)) * 0.55), color-mix(in srgb, var(--vc) calc(var(--vs) * 100%), transparent) 100%),
    radial-gradient(ellipse 100% 100% at var(--vx) var(--vy), transparent 60%, color-mix(in srgb, var(--vc) calc(var(--vs) * 60%), transparent) 100%);
}
/* ==== end kit:vignette ==== */
/* ==== kit:grain@1 ==== */
.fa-grain { position: absolute; inset: 0; pointer-events: none; }
/* ==== end kit:grain ==== */

/* the fake UI takes stage colours in every skin; the flyline family is accent-2 lifted toward white */
.fa { position: absolute; inset: 0; container-type: size;
  --fa-bg: color-mix(in srgb, var(--k-stage), white 3%); --fa-panel: color-mix(in srgb, var(--k-stage), white 7%); --fa-ink: var(--k-on-stage);
  --fa-glow: color-mix(in srgb, var(--k-accent-2), white 35%); --fa-glow2: color-mix(in srgb, var(--k-accent-2), white 50%);
  --fa-pale: color-mix(in srgb, var(--k-accent-2), white 78%); --fa-core: color-mix(in srgb, var(--k-accent-2), white 96%); }
.fa .fa-vig { --vs: 0.5; --vin: 45%; }
.fa-ui { position: absolute; left: 0; top: 0; filter: brightness(0.65) saturate(0.9); }
.fa-ui svg { display: block; }
.fa-fx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
@container (orientation: portrait) {
  /* the UI ends above the caption zone and fades into the stage */
  .fa-ui { -webkit-mask-image: linear-gradient(180deg, #000 92%, transparent); mask-image: linear-gradient(180deg, #000 92%, transparent); }
}
</style>

<div id="root" data-composition-id="flyline-arc">
  <div class="fa">
    <div class="fa-stage"></div>
    <div class="fa-ui"></div>
    <div class="fa-vig"></div>
    <svg class="fa-fx" aria-hidden="true"></svg>
    <div class="fa-grain"></div>
  </div>
</div>

<script>
(function () {
  // seconds = upstream frames / 30; the line and pulse curves run on frames (f = t * 30), as upstream
  var CFG = { dur: 4, hop1: 10, hop2: 46, grow: 22, settle: 10, anchor: 6, up: 6, down: 12, rest: 0.25, ring: 14, N: 100 };
  // which fake-UI cards the hops join, and the two inner control points of each cubic as frame fractions
  var LAND = { ui: 1, path: [0, 5, 1], c: [[[0.426, 0.0556], [0.6885, 0.3519]], [[0.9167, 0.5185], [0.7083, 0.1389]]] };
  var PORT = { ui: 0.6875, path: [0, 4, 1], c: [[[0.1667, 0.3333], [0.3056, 0.5208]], [[0.8333, 0.4688], [0.8148, 0.1979]]] };
  var v = { backdrop: "on" };
  try {
    var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
  } catch (e) {}

  var root = document.querySelector(".fa");
  var q = function (s) { return root.querySelector(s); };
  var FW = root.clientWidth, FH = root.clientHeight;
  if (!FW || !FH) {
    // not laid out yet: the host clip's declared size, then the window
    var hc = root.closest("[data-width][data-height]");
    FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
    FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
  }
  var P = FH > FW, L = P ? PORT : LAND, S = Math.min(FW, FH) / 1.08e3;
  root.setAttribute("data-orient", P ? "portrait" : "landscape");
  var off = String(v.backdrop) === "off";

  // ==== kit:grain@1 ====
  function kGrain(layer, o) {
    o = o || {};
    var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
    var dark = tones && tones.getAttribute("data-tone") === "dark";
    var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
      var f = "type='linear' slope='2.4' intercept='-0.7'";
      var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
        "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
        "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
        "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
        "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
      return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
    });
    layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
    layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
    layer.style.backgroundSize = size + "px " + size + "px";
    return function (t) {
      var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      layer.style.backgroundImage = tiles[k % 6];
      layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
    };
  }
  // ==== end kit:grain ====
  // ==== kit:fakeui@1 ====
  function kFakeUI(w, h, kind, seed) {
    var rnd = MT.seeded(seed || 7), out = [], cards = [], u = Math.min(w / 1600, h / 900);
    var ink = "color-mix(in srgb, var(--k-ink) 22%, var(--k-panel))", line = "color-mix(in srgb, var(--k-ink) 9%, var(--k-bg))";
    var R = function (x, y, rw, rh, r, c) { out.push('<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + rw.toFixed(1) + '" height="' + rh.toFixed(1) + '" rx="' + (r * u).toFixed(1) + '" style="fill:' + c + '"/>'); };
    var side = 190 * u, top = 64 * u, pad = 30 * u, gap = 22 * u;
    R(0, 0, w, h, 0, "var(--k-bg)");
    R(0, 0, side, h, 0, "var(--k-panel)");
    for (var i = 0; i < 6; i++) { R(24 * u, (92 + i * 46) * u, 18 * u, 18 * u, 5, i === 1 ? "var(--k-accent)" : ink); R(54 * u, (96 + i * 46) * u, (60 + rnd() * 60) * u, 10 * u, 5, ink); }
    R(side, top - u, w - side, Math.max(1, u), 0, line);
    R(side + pad, 22 * u, 170 * u, 18 * u, 9, ink);
    R(w - pad - 260 * u, 16 * u, 260 * u, 32 * u, 16, "var(--k-panel)");
    var x0 = side + pad, y0 = top + pad, cw = w - x0 - pad, ch = h - y0 - pad;
    if (kind === "list") {
      var rh = (ch - gap * 4) / 5;
      for (var r = 0; r < 5; r++) {
        var y = y0 + r * (rh + gap), m = y + rh / 2;
        cards.push({ x: x0, y: y, w: cw, h: rh });
        R(x0, y, cw, rh, 12, "var(--k-panel)");
        R(x0 + 24 * u, m - 18 * u, 36 * u, 36 * u, 10, r === 0 ? "var(--k-accent)" : ink);
        R(x0 + 80 * u, m - 14 * u, (260 + rnd() * 260) * u, 12 * u, 6, ink);
        R(x0 + 80 * u, m + 6 * u, (140 + rnd() * 160) * u, 9 * u, 4.5, line);
        R(x0 + cw - 150 * u, m - 13 * u, 110 * u, 26 * u, 13, line);
      }
    } else {
      var gw = (cw - gap * 2) / 3, gh = (ch - gap) / 2;
      for (var k = 0; k < 6; k++) {
        var cx = x0 + (k % 3) * (gw + gap), cy = y0 + Math.floor(k / 3) * (gh + gap), base = cy + gh - 24 * u;
        cards.push({ x: cx, y: cy, w: gw, h: gh });
        R(cx, cy, gw, gh, 14, "var(--k-panel)");
        R(cx + 22 * u, cy + 24 * u, (90 + rnd() * 70) * u, 12 * u, 6, ink);
        R(cx + 22 * u, cy + 52 * u, (110 + rnd() * 70) * u, 28 * u, 8, k === 0 ? "var(--k-accent)" : ink);
        if (k % 2) {
          for (var j = 0; j < 7; j++) { var bh = (0.25 + rnd() * 0.75) * gh * 0.4; R(cx + 22 * u + j * (gw - 44 * u) / 7, base - bh, (gw - 44 * u) / 7 - 8 * u, bh, 4, j === 5 ? "var(--k-accent-2)" : ink); }
        } else {
          var pts = [];
          for (var q = 0; q <= 12; q++) pts.push((cx + 22 * u + (q * (gw - 44 * u)) / 12).toFixed(1) + "," + (base - (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(q * 0.7 + k)) * (0.6 + 0.4 * rnd())) * gh * 0.4).toFixed(1));
          out.push('<polyline points="' + pts.join(" ") + '" style="fill:none;stroke:var(--k-accent-2);stroke-width:' + (3 * u).toFixed(1) + ';stroke-linejoin:round;stroke-linecap:round"/>');
        }
      }
    }
    return { svg: '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true">' + out.join("") + "</svg>", cards: cards };
  }
  // ==== end kit:fakeui ====

  // the fake UI in stage colours (its --k-bg / --k-panel / --k-ink become the card's stage mixes)
  var UH = Math.round(FH * L.ui), ui = kFakeUI(FW, UH, "grid", 7);
  q(".fa-ui").innerHTML = ui.svg.replace(/--k-(bg|panel|ink)\b/g, "--fa-$1");
  ["stage", "ui", "vig", "grain"].forEach(function (n) { if (off) q(".fa-" + n).style.display = "none"; });

  // SVG ids carry a per-mount number, so two copies of the card on one page never share a filter or gradient
  var id = "fa" + (window.__faMount = (window.__faMount || 0) + 1), NS = "http://www.w3.org/2000/svg", fx = q(".fa-fx");
  fx.setAttribute("viewBox", "0 0 " + FW + " " + FH);
  fx.innerHTML = '<defs><radialGradient id="' + id + 'h"><stop offset="0" style="stop-color:white;stop-opacity:.6"/><stop offset=".3" style="stop-color:var(--fa-glow2);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--fa-glow);stop-opacity:0"/></radialGradient>' +
    '<filter id="' + id + 'b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="' + 10 * S + '"/></filter></defs>';
  var el = function (tag, parent, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var a in attrs) e.setAttribute(a, attrs[a]);
    return (parent || fx).appendChild(e);
  };
  var A = function (e, attrs) { for (var a in attrs) e.setAttribute(a, attrs[a]); };
  var ctr = function (c) { return { x: c.x + c.w / 2, y: c.y + c.h / 2 }; };
  var bez = function (p, s) {
    var u = 1 - s;
    return { x: u * u * u * p[0].x + 3 * u * u * s * p[1].x + 3 * u * s * s * p[2].x + s * s * s * p[3].x, y: u * u * u * p[0].y + 3 * u * u * s * p[1].y + 3 * u * s * s * p[2].y + s * s * s * p[3].y };
  };

  // target pulse: blurred accent-2 outline, faint face lift, 1.5 px pale outline, one ring from the centre
  var pulses = [1, 2].map(function (n) {
    var c = ui.cards[L.path[n]], g = el("g"), at = n === 1 ? CFG.hop1 + CFG.grow : CFG.hop2 + CFG.grow, rr = 14 * S;
    var box = { x: c.x, y: c.y, width: c.w, height: c.h, rx: rr };
    return {
      at: at, c: ctr(c), g: g,
      blur: el("rect", g, Object.assign({ fill: "none", "stroke-width": 8 * S, filter: "url(#" + id + "b)", style: "stroke:var(--fa-glow)" }, box)),
      face: el("rect", g, Object.assign({ style: "fill:var(--fa-pale)" }, box)),
      edge: el("rect", g, { x: c.x + 0.75, y: c.y + 0.75, width: c.w - 1.5, height: c.h - 1.5, rx: rr - 0.75, fill: "none", "stroke-width": 1.5, style: "stroke:var(--fa-pale)" }),
      ring: el("circle", g, { fill: "none", style: "stroke:var(--fa-pale)" })
    };
  });
  // a hop: anchor at the start, two glow strokes, the white core as N butt segments, comet + halo + head while it
  // grows, then a resting node at the end
  var hops = [0, 1].map(function (n) {
    var a = ctr(ui.cards[L.path[n]]), b = ctr(ui.cards[L.path[n + 1]]), cp = L.c[n], g = el("g");
    var p = [a, { x: cp[0][0] * FW, y: cp[0][1] * FH }, { x: cp[1][0] * FW, y: cp[1][1] * FH }, b], segs = [];
    var o = {
      start: n ? CFG.hop2 : CFG.hop1, p: p, g: g, segs: segs,
      aHalo: el("circle", g, { cx: a.x, cy: a.y, style: "fill:var(--fa-glow);fill-opacity:.25" }),
      aDot: el("circle", g, { cx: a.x, cy: a.y, fill: "white" }),
      wide: el("polyline", g, { fill: "none", "stroke-width": 18 * S, "stroke-linecap": "round", "stroke-linejoin": "round", style: "stroke:var(--fa-glow)" }),
      mid: el("polyline", g, { fill: "none", "stroke-width": 7 * S, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-opacity": 0.24, style: "stroke:var(--fa-glow2)" })
    };
    var sg = el("g", g, { "stroke-width": 3.5 * S, "stroke-linecap": "butt", style: "stroke:var(--fa-core)" });
    for (var i = 0; i < CFG.N; i++) segs.push(el("line", sg));
    o.comet = el("polyline", g, { fill: "none", stroke: "white", "stroke-width": 6 * S, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-opacity": 0.55 });
    o.halo = el("circle", g, { r: 40 * S, fill: "url(#" + id + "h)" });
    o.head = el("circle", g, { r: 7 * S, fill: "white" });
    o.eHalo = el("circle", g, { cx: b.x, cy: b.y, r: 11 * S, style: "fill:var(--fa-glow);fill-opacity:.22" });
    o.eDot = el("circle", g, { cx: b.x, cy: b.y, r: 5 * S, fill: "white" });
    return o;
  });
  var vis = function (e, on) { e.style.display = on ? "" : "none"; };
  var R = MT.ramp, grain = off ? function () {} : kGrain(q(".fa-grain"), { opacity: 0.07, blend: "soft-light" });

  function drawHop(o, f) {
    vis(o.g, f >= o.start);
    if (f < o.start) return;
    var e = R(f, o.start, CFG.grow, "power2.out"), growing = f < o.start + CFG.grow;
    var settle = R(f, o.start + CFG.grow, CFG.settle, "power1.out"), an = R(f, o.start, CFG.anchor, "power2.out");
    var n = Math.max(2, Math.ceil(e * CFG.N) + 1), pts = [];
    for (var i = 0; i < n; i++) pts.push(bez(o.p, Math.min(i / CFG.N, e)));
    pts[n - 1] = bez(o.p, e);
    var str = function (a) { return a.map(function (p) { return p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" "); };
    A(o.aHalo, { r: 9 * S * an }); A(o.aDot, { r: 4.5 * S * an });
    A(o.wide, { points: str(pts), "stroke-opacity": 0.1 + 0.04 * settle }); A(o.mid, { points: str(pts) });
    // bright head, dim tail (0.3 + 0.7 k^2), evened out to 1 over the settle
    o.segs.forEach(function (s, i) {
      var on = i < n - 1;
      vis(s, on);
      if (!on) return;
      var k = Math.min(i / CFG.N, e) / Math.max(e, 0.001), gr = 0.3 + 0.7 * k * k;
      A(s, { x1: pts[i].x.toFixed(1), y1: pts[i].y.toFixed(1), x2: pts[i + 1].x.toFixed(1), y2: pts[i + 1].y.toFixed(1), "stroke-opacity": (gr + (1 - gr) * settle).toFixed(3) });
    });
    [o.comet, o.halo, o.head].forEach(function (x) { vis(x, growing); });
    [o.eHalo, o.eDot].forEach(function (x) { vis(x, !growing); });
    if (growing) {
      var hd = pts[n - 1];
      A(o.comet, { points: str(pts.slice(Math.max(0, n - 9))) });
      A(o.halo, { cx: hd.x, cy: hd.y }); A(o.head, { cx: hd.x, cy: hd.y });
    }
  }
  function drawPulse(o, f) {
    vis(o.g, f >= o.at);
    if (f < o.at) return;
    var amp = f <= o.at + CFG.up ? R(f, o.at, CFG.up, "power2.out") : MT.mix(1, CFG.rest, R(f, o.at + CFG.up, CFG.down, "power1.out"));
    var ring = R(f, o.at, CFG.ring, "power2.out");
    A(o.blur, { "stroke-opacity": 0.5 * amp }); A(o.face, { "fill-opacity": 0.05 * amp }); A(o.edge, { "stroke-opacity": 0.9 * amp });
    vis(o.ring, ring < 1);
    A(o.ring, { cx: o.c.x, cy: o.c.y, r: (12 + 80 * ring) * S, "stroke-width": (2.5 * (1 - ring) + 0.5) * S, "stroke-opacity": 0.75 * (1 - ring) });
  }

  var tl = MT.scene(CFG.dur, function (t) {
    var f = t * 30;
    pulses.forEach(function (o) { drawPulse(o, f); });
    hops.forEach(function (o) { drawHop(o, f); });
    grain(t);
  });
  window.__timelines["flyline-arc"] = tl;
})();
</script>
    </template>
  </body>
</html>

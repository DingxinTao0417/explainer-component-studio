<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"start","type":"number","label":"起始值","default":0},
    {"id":"target","type":"number","label":"目标值","default":12800},
    {"id":"decimals","type":"number","label":"小数位数","default":0,"min":0,"max":3,"step":1},
    {"id":"unit","type":"string","label":"单位（可空）","default":"次"},
    {"id":"caption","type":"string","label":"数字下面的一行说明","default":"一个提示词模板每天被调用（示例数据）"},
    {"id":"roll","type":"number","label":"滚动时长（秒）","default":1.4,"min":0.4,"max":4,"step":0.1},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>number-roll · 数字滚动</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="number-roll-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .nr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nr-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .nr-row { position: relative; display: flex; align-items: baseline; justify-content: center; }
        .nr-num { display: block; font-size: 300px; font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .nr-unit { position: relative; display: block; margin-left: 28px; font-size: 104px; font-weight: 800; white-space: nowrap; }
                .nr-cap { position: relative; display: block; margin-top: 44px; font-size: 54px; font-weight: 600; color: var(--k-muted); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="number-roll" data-width="1920" data-height="1080">
        <div class="nr">
          <div class="nr-bg"></div>
          <div class="nr-row">
            <span class="nr-num">12,800</span>
            <span class="nr-unit">次</span>
          </div>
          <span class="nr-cap">一个提示词模板每天被调用（示例数据）</span>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { at: 0.3, dim: 0.6, kick: 1.06, kickUp: 0.07, kickDown: 0.28, capIn: 0.35 };
          var v = { start: 0, target: 12800, decimals: 0, unit: "次", caption: "一个提示词模板每天被调用（示例数据）", roll: 1.4, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".nr");
          var q = function (s) { return root.querySelector(s); };
          var a = parseFloat(v.start) || 0, b = parseFloat(v.target);
          if (!isFinite(b)) b = 0;
          var dec = Math.max(0, Math.min(3, parseInt(v.decimals, 10) || 0));
          var dur = Math.max(0.4, parseFloat(v.roll) || 1.4);
          var fmt = function (n) {
            var s = Math.abs(n).toFixed(dec).split(".");
            s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return (n < 0 ? "-" : "") + s.join(".");
          };
          var num = q(".nr-num"), row = q(".nr-row");
          var unit = q(".nr-unit");
          unit.textContent = String(v.unit);
          if (!String(v.unit)) unit.style.display = "none";
          // resolve the two palette colours to rgb once, so the unit can be tweened between them
          var ink = getComputedStyle(unit).color;
          unit.style.color = "var(--k-accent)";
          var hot = getComputedStyle(unit).color || ink;
          unit.style.color = "";
          q(".nr-cap").textContent = String(v.caption);
          if (String(v.backdrop) === "off") q(".nr-bg").style.display = "none";

          // reserve the widest state once, so the unit never slides while digits are added
          num.textContent = fmt(a).length > fmt(b).length ? fmt(a) : fmt(b);
          var w = num.offsetWidth;
          if (w > 0) num.style.width = w + 4 + "px";

          var state = { n: a };
          var render = function () { num.textContent = fmt(state.n); };
          // power3.out shows the final digits before the tween ends; find the frame the last digit lands on
          var steps = Math.abs(b - a) * Math.pow(10, dec);
          var stop = CFG.at + dur * (1 - Math.pow(Math.min(1, 0.5 / (steps || 1)), 1 / 3));

          var tl = gsap.timeline({ paused: true, onUpdate: render });
          tl.fromTo(q(".nr-cap"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: CFG.capIn, ease: "power2.out" }, 0);
          tl.fromTo(state, { n: a }, { n: b, duration: dur, ease: "power3.out" }, CFG.at);
          // the stop: dimmed while rolling, full strength plus a small kick on the landing frame
          tl.fromTo(num, { opacity: CFG.dim }, { opacity: 1, duration: CFG.kickUp, ease: "none" }, stop);
          tl.fromTo(unit, { color: ink }, { color: hot, duration: CFG.kickUp, ease: "none" }, stop);
          tl.fromTo(row, { scale: 1 }, { scale: CFG.kick, duration: CFG.kickUp, ease: "power2.out" }, stop);
          tl.to(row, { scale: 1, duration: CFG.kickDown, ease: "back.out(3)" }, stop + CFG.kickUp);
          render();
          window.__timelines["number-roll"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

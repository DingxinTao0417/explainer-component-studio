<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"host","type":"string","label":"人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/presenter-bust.png"},
    {"id":"corner","type":"enum","label":"缩到哪个角","default":"br","options":[{"value":"br","label":"右下"},{"value":"bl","label":"左下"},{"value":"tr","label":"右上"},{"value":"tl","label":"左上"}]},
    {"id":"size","type":"number","label":"头像直径（px）","default":260,"min":180,"max":360,"step":10},
    {"id":"kicker","type":"string","label":"让出来的内容：小标题（可空）","default":"先看结论"},
    {"id":"title","type":"string","label":"让出来的内容：标题（可空）","default":"三步就能复现"},
    {"id":"note","type":"string","label":"让出来的内容：说明（可空）","default":"人退到角上，继续讲"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>host-to-chip · 人缩成角标</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="host-to-chip-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .hc { position: absolute; inset: 0; }
        .hc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .hc-main { position: absolute; left: 150px; top: 340px; width: 1200px; }
        .hc-kicker { display: block; font-size: 44px; line-height: 60px; font-weight: 700; color: var(--k-accent); }
        .hc-title { display: block; margin-top: 10px; font-size: 108px; line-height: 136px; font-weight: 800; white-space: nowrap; }
        .hc-note { display: block; margin-top: 18px; font-size: 44px; line-height: 60px; color: var(--k-muted); }
        .hc-dock { position: absolute; right: 70px; bottom: 70px; width: 260px; height: 260px; }
        .hc-ring { position: absolute; inset: 0; border: 9px solid var(--k-accent); border-radius: 50%; opacity: 0; }
        .hc-mask { position: absolute; inset: 0; overflow: hidden; border-radius: 130px; background: var(--k-panel); }
        .hc-disc { position: absolute; left: -13px; top: -13px; width: 286px; height: 286px; border-radius: 50%; background: var(--k-accent); }
        .hc-host { position: absolute; left: -26px; top: 26px; width: 312px; height: 390px; background: center / contain no-repeat; }
        .hc-edge { position: absolute; inset: 0; border: 6px solid var(--k-ink); border-radius: 130px; }
      </style>

      <div id="root" data-composition-id="host-to-chip" data-width="1920" data-height="1080">
        <div class="hc">
          <div class="hc-bg"></div>
          <div class="hc-main">
            <span class="hc-kicker" data-layout-allow-occlusion>先看结论</span>
            <span class="hc-title" data-layout-allow-occlusion>三步就能复现</span>
            <span class="hc-note" data-layout-allow-occlusion>人退到角上，继续讲</span>
          </div>
          <div class="hc-dock">
            <div class="hc-ring"></div>
            <div class="hc-ring"></div>
            <div class="hc-mask" data-layout-allow-overflow>
              <div class="hc-disc"></div>
              <div class="hc-host" style="background-image: url(motion-cards/lib/samples/presenter-bust.png)"></div>
            </div>
            <div class="hc-edge"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            at: 0.7,          // the full-screen host holds this long first
            shrink: 0.55,     // full frame → chip
            under: 0.86,      // it arrives a little too small…
            pop: 0.3,         // …and pops to size: "docked"
            margin: 70,       // gap to the canvas edge, reached slightly late with a small overshoot
            lag: 0.3,         // content starts this long after the host starts leaving
            beat: 0.34,       // one voice pulse
            amps: [1.3, 1.16, 1.38, 1.2, 1.34, 1.14], // fixed "speech" loudness pattern
          };
          var v = { corner: "br", size: 260, kicker: "先看结论", title: "三步就能复现", note: "人退到角上，继续讲", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".hc");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".hc-bg").style.display = "none";
          var host = q(".hc-host");
          if (v.host) host.style.backgroundImage = 'url("' + String(v.host) + '")';
          var texts = [];
          [["kicker", ".hc-kicker"], ["title", ".hc-title"], ["note", ".hc-note"]].forEach(function (p) {
            var el = q(p[1]);
            el.textContent = String(v[p[0]] || "");
            if (v[p[0]]) texts.push(el); else el.style.display = "none";
          });
          var S = Math.max(180, Math.min(360, parseFloat(v.size) || 260));
          var corner = String(v.corner || "br");
          var dock = q(".hc-dock"), main = q(".hc-main"), mask = q(".hc-mask"), edge = q(".hc-edge"), disc = q(".hc-disc");
          var hx = corner.charAt(1) === "r" ? "right" : "left", vy = corner.charAt(0) === "b" ? "bottom" : "top";
          dock.style.right = dock.style.bottom = "auto";
          if (hx === "left") { main.style.left = "auto"; main.style.right = "150px"; main.style.textAlign = "right"; }
          var m0 = {}, m1 = {};
          m0[hx] = 0; m0[vy] = 0; m1[hx] = CFG.margin; m1[vy] = CFG.margin;
          m1.duration = CFG.shrink + CFG.pop; m1.ease = "back.out(1.5)";
          var go = CFG.at, land = go + CFG.shrink;

          var tl = gsap.timeline({ paused: true });
          // 1) the frame collapses into its corner; the face stays inside it the whole way
          tl.fromTo(dock, m0, m1, go);
          tl.fromTo(dock, { width: 1920, height: 1080, scale: 1 }, { width: S, height: S, scale: CFG.under, duration: CFG.shrink, ease: "power3.inOut" }, go);
          tl.to(dock, { scale: 1, duration: CFG.pop, ease: "back.out(2.6)" }, land);
          tl.fromTo([mask, edge], { borderRadius: 0 }, { borderRadius: S / 2, duration: CFG.shrink, ease: "power3.inOut" }, go);
          tl.fromTo(edge, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, go + 0.2);
          tl.fromTo(disc, { left: 550, top: 170, width: 820, height: 820 }, { left: -S * 0.05, top: -S * 0.05, width: S * 1.1, height: S * 1.1, duration: CFG.shrink, ease: "power3.inOut" }, go);
          tl.fromTo(host, { left: 560, top: 80, width: 800, height: 1000 }, { left: -S * 0.1, top: S * 0.1, width: S * 1.2, height: S * 1.5, duration: CFG.shrink, ease: "power3.inOut" }, go);
          // 2) content takes the room the host gave up, a beat later
          if (texts.length) tl.fromTo(texts, { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.08 }, go + CFG.lag);
          // 3) voice rings: uneven pulses so it reads as speech, not as a loader
          var rings = all(".hc-ring"), t0 = land + CFG.pop;
          CFG.amps.forEach(function (a, i) {
            tl.fromTo(rings[0], { scale: 1, opacity: 0.9 }, { scale: a, opacity: 0, duration: CFG.beat, ease: "power1.out", immediateRender: false }, t0 + i * CFG.beat);
            tl.fromTo(rings[1], { scale: 1, opacity: 0.5 }, { scale: 1 + (a - 1) * 1.25, opacity: 0, duration: CFG.beat * 1.3, ease: "power1.out", immediateRender: false }, t0 + i * CFG.beat + 0.06);
          });
          window.__timelines["host-to-chip"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

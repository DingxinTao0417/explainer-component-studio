          var names = S(v.modes).split("|").map(S).filter(Boolean).slice(0, 3);

          var ms = dial.querySelectorAll(".ll-m"), pw = dial.clientWidth / 3;
          if (names.length < 2) dial.style.display = "none";
          if (S(v.from) || S(v.to)) root.setAttribute("data-pic", "");
          [].forEach.call(root.querySelectorAll(".ll-kick, .ll-u, .ll-m"), function (e) { e.setAttribute("data-layout-allow-occlusion", ""); });

          var gate = q(".ll-gate"), blobs = [].slice.call(root.querySelectorAll(".ll-blob")), core = q(".ll-core"), veil = q(".ll-veil");
          var leak = q(".ll-leak"), wash = q(".ll-wash"), page = q(".ll-page"), vig = q(".ll-vig"), draw = kGrain(q(".ll-grain"), { step: 2, blend: "soft-light" });
          blobs.forEach(function (b, j) { b.style.width = BLOBS[j].d * L.k + "px"; b.style.height = (BLOBS[j].d * L.k) / 1.35 + "px"; });
          core.style.width = 2200 * L.k + "px"; core.style.height = 1400 * L.k + "px";
          var ux = Math.cos((L.rot * Math.PI) / 180), uy = Math.sin((L.rot * Math.PI) / 180);

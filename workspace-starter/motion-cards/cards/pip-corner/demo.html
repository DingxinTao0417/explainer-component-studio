<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"srcs","type":"string","label":"满屏那张图的地址（只用第一张）","default":"motion-cards/lib/samples/p4.jpg"},
    {"id":"corner","type":"enum","label":"缩到哪个角","default":"br","options":[{"value":"br","label":"右下"},{"value":"bl","label":"左下"},{"value":"tr","label":"右上"},{"value":"tl","label":"左上"}]},
    {"id":"size","type":"number","label":"小窗宽度（px）","default":560,"min":400,"max":760,"step":20},
    {"id":"kicker","type":"string","label":"让出来的主画面：小标题（可空）","default":"接下来"},
    {"id":"title","type":"string","label":"让出来的主画面：标题（可空）","default":"把这一步拆开看"},
    {"id":"note","type":"string","label":"让出来的主画面：说明（可空）","default":"原画面缩到角上，继续放"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>pip-corner · 画中画缩到角</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="pip-corner-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .pc { position: absolute; inset: 0; }
        .pc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .pc-main { position: absolute; left: 150px; top: 370px; width: 1100px; }
        .pc-kicker { display: block; font-size: 44px; line-height: 60px; font-weight: 700; color: var(--k-accent); }
        .pc-title { display: block; margin-top: 10px; font-size: 112px; line-height: 140px; font-weight: 800; color: var(--k-ink); white-space: nowrap; }
        .pc-note { display: block; margin-top: 18px; font-size: 44px; line-height: 60px; color: var(--k-muted); }
        .pc-pip { position: absolute; width: 1920px; height: 1080px; overflow: hidden; }
        .pc-img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .pc-edge { position: absolute; inset: 0; box-sizing: border-box; border: 6px solid #fff; border-radius: 22px; opacity: 0; }
      </style>

      <div id="root" data-composition-id="pip-corner" data-width="1920" data-height="1080">
        <div class="pc">
          <div class="pc-bg"></div>
          <div class="pc-main">
            <span class="pc-kicker" data-layout-allow-occlusion>接下来</span>
            <span class="pc-title" data-layout-allow-occlusion>把这一步拆开看</span>
            <span class="pc-note" data-layout-allow-occlusion>原画面缩到角上，继续放</span>
          </div>
          <div class="pc-pip"><img class="pc-img" src="motion-cards/lib/samples/p4.jpg" alt="" /><div class="pc-edge"></div></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            at: 0.6,                    // the full-screen picture holds this long first
            shrink: 0.5,                // full → a touch SMALLER than the final window
            under: 0.9,                 // …this much of the final size…
            pop: 0.28,                  // …then it pops out to size: reads as "clicked into its dock"
            margin: 60,                 // gap to the canvas edge; it slides to it a little late and overshoots
            marginDur: 0.75,
            drift: 1.08,                // slow zoom on the picture, standing in for "the video is still playing"
            total: 3.4,
          };
          var v = { kicker: "接下来", title: "把这一步拆开看", note: "原画面缩到角上，继续放", corner: "br", size: 560, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".pc");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".pc-bg").style.display = "none";
          var list = String(v.srcs || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          if (list[0]) q(".pc-img").setAttribute("src", list[0]);
          [["kicker", ".pc-kicker"], ["title", ".pc-title"], ["note", ".pc-note"]].forEach(function (p) {
            var el = q(p[1]);
            el.textContent = String(v[p[0]] || "");
            if (!v[p[0]]) el.style.display = "none";
          });
          var corner = String(v.corner || "br");
          var w = Math.max(400, Math.min(760, parseFloat(v.size) || 560)), h = Math.round(w * 9 / 16);
          var pip = q(".pc-pip"), main = q(".pc-main");
          // pin the window to its corner with right/bottom (or left/top): it shrinks INTO the corner, no path to compute
          var hx = corner.charAt(1) === "r" ? "right" : "left", vy = corner.charAt(0) === "b" ? "bottom" : "top";
          pip.style[hx] = "0px"; pip.style[vy] = "0px";
          if (hx === "left") { main.style.left = "auto"; main.style.right = "150px"; main.style.textAlign = "right"; }
          var m0 = {}, m1 = {}; m0[hx] = 0; m0[vy] = 0; m1[hx] = CFG.margin; m1[vy] = CFG.margin;
          m1.duration = CFG.marginDur; m1.ease = "back.out(1.7)";

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".pc-img"), { scale: 1 }, { scale: CFG.drift, duration: CFG.total, ease: "none" }, 0);
          tl.fromTo(pip, { width: 1920, height: 1080, borderRadius: 0, boxShadow: "0px 0px 0px rgba(0,0,0,0)" }, { width: w * CFG.under, height: h * CFG.under, borderRadius: 22, boxShadow: "0px 24px 60px rgba(0,0,0,0.55)", duration: CFG.shrink, ease: "power3.inOut" }, CFG.at);
          tl.fromTo(pip, { width: w * CFG.under, height: h * CFG.under }, { width: w, height: h, duration: CFG.pop, ease: "back.out(2.4)", immediateRender: false }, CFG.at + CFG.shrink);
          tl.fromTo(pip, m0, m1, CFG.at + 0.08);
          tl.fromTo(q(".pc-edge"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, CFG.at + 0.1);
          // what was underneath eases back into place as it is uncovered
          tl.fromTo(main, { scale: 1.05, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, CFG.at + 0.15);
          window.__timelines["pip-corner"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

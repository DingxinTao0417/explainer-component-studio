var pathD = "M" + B[0] + " " + B[1] + "C" + B.slice(2).join(" ");

  '<linearGradient id="' + id("l") + '" x1="' + B[0] + '" y1="0" x2="' + B[6] + '" y2="0" gradientUnits="userSpaceOnUse">' + stop(0, "var(--k-accent)", 0.35) + stop(0.55, "var(--k-accent)", 1) + stop(1, "var(--tph-tip)", 1) + "</linearGradient>" +
  '<clipPath id="' + id("c") + '"><rect x="0" y="0" width="0" height="' + FH + '"/></clipPath>' +
  '<filter id="' + id("f") + '" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="' + 10 * u + '"/></filter></defs>';

  h += '<g class="g"><line x1="' + L.gx[0] * u + '" x2="' + L.gx[0] * u + '" y1="' + y + '" y2="' + y + '" style="stroke:' + (k === 3 ? "color-mix(in srgb, var(--k-ink) 22%, transparent)" : "var(--tph-line)") + ';stroke-width:1.5"' + (k === 3 ? "" : ' stroke-dasharray="2 10"') + "/>" +
    '<text x="' + L.tickX * u + '" y="' + (y + 10 * u) + '">' + TICKS[k] + "</text></g>";
});
MONTHS.forEach(function (m, k) { h += '<text class="m" x="' + (L.months[0] + k * L.months[2]) * u + '" y="' + L.months[1] * u + '">' + m + "</text>"; });

  '<path class="ln" d="' + pathD + '" pathLength="1" stroke-dasharray="1 2" style="fill:none;stroke:var(--k-accent);stroke-width:14;stroke-linecap:round;opacity:var(--tph-glow)" filter="url(#' + id("f") + ')"/>' +
  '<path class="ln" d="' + pathD + '" pathLength="1" stroke-dasharray="1 2" style="fill:none;stroke:url(#' + id("l") + ');stroke-width:5;stroke-linecap:round"/>';
QS.forEach(function (lab, k) {
  var p = bez(CFG.quarters[3 + k]);
  h += '<g class="qm"><line x1="' + p[0] + '" x2="' + p[0] + '" y1="' + (p[1] + 14) + '" y2="' + G[3] + '" stroke-dasharray="2 6" style="stroke:color-mix(in srgb, var(--k-accent) 25%, transparent);stroke-width:1.5"/>' +
    '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="7" style="fill:var(--k-bg);stroke:var(--k-accent);stroke-width:3"/><text x="' + (p[0] + 16) + '" y="' + (p[1] + 40) + '">' + lab + "</text></g>";

svg.innerHTML = h;
var all = function (s) { return [].slice.call(svg.querySelectorAll(s)); };
var gridG = all(".g"), monthT = all(".m"), area = svg.querySelector(".area"), clipR = svg.querySelector("clipPath rect"), lines = all(".ln"), qm = all(".qm"), head = svg.querySelector(".hd"), ring = head.firstChild;

// ---- one timeline: the frame function, plus the eyebrow and subtitle word reveals
var tl = MT.scene(CFG.dur, function (t) {
  gridG.forEach(function (g, k) {
    var e = MT.ramp(t, k * CFG.grid[0], CFG.grid[1], "out");

  // the head and the line it draws

  var tail = MT.ramp(t, CFG.t0 + CFG.travel - 4 * F, CFG.tail, "out");

    var m = t < st ? mv : 0; // a short trail behind it while it moves fast
    c.el.style.textShadow = m > 0.05 ? (-m * 1.4).toFixed(1) + "px 0 " + (m * 2).toFixed(1) + "px color-mix(in srgb, var(--k-accent) 50%, transparent)" + (dark ? ", 0 0 24px color-mix(in srgb, var(--k-accent) 25%, transparent)" : "") : "";
  });

  var b = MT.spring({ t: t, delay: CFG.badge, damping: 15, stiffness: 190 });
  badge.style.opacity = MT.ramp(t, CFG.badge, CFG.badgeIn, "out");
  badge.style.transform = "translateY(" + ((1 - b) * 30 * u).toFixed(2) + "px) scale(" + (0.9 + 0.1 * b).toFixed(4) + ")";
  scene.style.transform = "scale(" + (1 + CFG.push[2] * MT.ramp(t, CFG.push[0], CFG.push[1], "swift")).toFixed(5) + ")";

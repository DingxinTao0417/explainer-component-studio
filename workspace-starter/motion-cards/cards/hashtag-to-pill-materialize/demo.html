            while (box.firstChild) inner.appendChild(box.firstChild);
            outer.appendChild(inner); box.appendChild(svg); box.appendChild(outer);
            var fe = svg.firstChild.firstChild;
            return function (vx, vy) {
              vy = vy || 0;
              var sd = Math.min(max, (Math.sqrt(vx * vx + vy * vy) / 30) * amount);
              if (sd < 0.35) { outer.style.filter = outer.style.transform = inner.style.transform = ""; return; }
              var deg = (Math.atan2(vy, vx) * 180) / Math.PI;
              fe.setAttribute("stdDeviation", sd.toFixed(2) + " 0");
              outer.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
              inner.style.transform = "rotate(" + (-deg).toFixed(2) + "deg)";
              outer.style.filter = "url(#" + id + ")";
            };
          }
          // ==== end kit:speedblur ====
          var tone = kTone(root);
          var gdraw = kGrain(q(".hp-grain"), { step: 2 });

          // ---- page slots (title and body are optional): split, then fit by measuring ----
          var titleEl = q(".hp-title"), bodyEl = q(".hp-body");
          var title = String(v.title).trim();
          if (title) {
            kSplit(titleEl, "word", false, title);
            // one line if it fits at 72px or more, otherwise the orientation's own line count at the biggest size that fits
            if (!kFit(titleEl, { lines: 1, min: 72 }).fits && L.titleLines > 1) { titleEl.style.fontSize = ""; kFit(titleEl, { lines: L.titleLines, min: 72 }); }
          } else titleEl.style.display = "none";
          var lines = String(v.body).split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 3);
          if (lines.length) { kSplit(bodyEl, "line", false, lines.join("|")); kFit(bodyEl, { lines: 3, min: 40 }); } else bodyEl.style.display = "none";

          // ---- hero: the typed "#word" and the pill share one font size; both must fit the width, and the pill's
          // extras (icon, paddings) grow with the font, so the loop measures both instead of using kFit's fixed width ----
          var pill = q(".hp-pill"), lab = q(".hp-lab"), txt = q(".hp-txt"), line = q(".hp-line"), cur = q(".hp-cur"), anchor = q(".hp-anchor");
          line.style.display = "block";
          var fs = L.fs, chars = Array.from(String(v.word).replace(/^[#＃\s]+/, "").trim() || "入门教程"), cut = false;
          var apply = function () {
            pill.style.fontSize = line.style.fontSize = fs + "px";
            lab.textContent = chars.join("") + (cut ? "…" : "");
            txt.textContent = "#" + lab.textContent;
          };
          var wide = function () { return Math.max(pill.offsetWidth, txt.offsetWidth + 0.12 * fs) > FW * L.maxW; };
          apply();
          while (wide() && fs > L.min) { fs -= 2; apply(); }
          while (wide() && chars.length > 1) { chars.pop(); cut = true; apply(); }
          var units = kSplit(txt, "char", false, txt.textContent);
          var ends = [0].concat(units.map(function (u) { return u.offsetLeft + u.offsetWidth; }));
          var curGap = 0.06 * fs, curW = 0.053 * fs, lineH = line.offsetHeight, pw = pill.offsetWidth, K = fs / 132;
          line.style.display = "";

          // typing times: upstream's 4-6 frame gaps from a seeded generator; a long word is squeezed so the last char lands by f40
          var mb = function (a) { return function () { a = (a + 0x6d2b79f5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
          var rnd = mb(20260717), at = [], f = 0;
          units.forEach(function () { at.push(f); f += 4 + Math.floor(rnd() * 3); });
          var span = at[at.length - 1], sq = span > 0 ? Math.min(1, (CFG.endGap - CFG.type) * 30 / span) : 1;
          at = at.map(function (x) { return CFG.type + (x * sq) / 30; });

          // geometry: hero in the middle, parked pill at the left edge of the page column
          var HX = FW / 2, HY = FH * L.heroY, SX = L.left + (pw * L.end) / 2, SY = L.slotY;
          anchor.style.left = anchor.style.top = "0px";
          pill.style.transform = "translate(-50%, -50%)";
          var sb = kSpeedBlur(q(".hp-pillbox"), "hp", { amount: 0.1, max: 7 });
          var move = function (t) { return MT.interpolate(t, [CFG.moveStart, CFG.moveEnd], [0, 1], { easing: "cubic-bezier(0.5,0,0.25,1)", extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };
          var pxAt = function (t) { return MT.mix(HX, SX, move(t)); };
          var pyAt = function (t) { return MT.mix(HY, SY, move(t)); };
          var shadow = function (l) {
            var c = function (a) { return "color-mix(in srgb, var(--hp-shade) " + (Math.min(1, a * (tone === "dark" ? 2.6 : 1)) * 100).toFixed(1) + "%, transparent)"; };
            return "inset 0 " + (3 * K).toFixed(1) + "px 0 var(--hp-hi), inset 0 " + (-2 * K).toFixed(1) + "px 0 " + c(0.03) + ", 0 " + (K * (1 + l * 0.12)).toFixed(1) + "px " + (K * (2 + l * 0.3)).toFixed(1) + "px " + c(0.04 + l * 0.003) +
              ", 0 " + (K * l * 1.6).toFixed(1) + "px " + (K * l * 4).toFixed(1) + "px " + (-K * l * 0.6).toFixed(1) + "px " + c(l * 0.009);
          };

          // everything is a pure function of t: typing (a), pill (b), page (c)
          var tl = MT.scene(CFG.dur, function (t) {
            var E = 2e-3, st = t >= CFG.reveal - E ? "c" : t >= CFG.morph - E ? "b" : "a";
            if (root.getAttribute("data-st") !== st) root.setAttribute("data-st", st);
            gdraw(t);
            if (st === "a") {
              var n = 0;
              at.forEach(function (x, i) { if (t >= x - E) n = i + 1; });
              units.forEach(function (u, i) { u.style.opacity = i < n ? 1 : 0; });
              cur.style.left = (ends[n] + curGap) + "px";
              line.style.transform = "translate(" + ((FW - (ends[n] + curGap + curW)) / 2).toFixed(1) + "px, " + (HY - lineH / 2).toFixed(1) + "px)";
              return;
            }
            var m = move(t), settle = MT.interpolate(t, [CFG.morph, CFG.morph + CFG.settle], [1.03, 1], { easing: "power2.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
            var lift = CFG.lift * (1 - MT.interpolate(m, [0.35, 1], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }));
            anchor.style.transform = "translate(" + pxAt(t).toFixed(2) + "px, " + pyAt(t).toFixed(2) + "px) scale(" + (MT.mix(1, L.end, m) * settle).toFixed(4) + ")";
            pill.style.boxShadow = shadow(lift);
            sb(MT.velocity(pxAt, t), MT.velocity(pyAt, t));
          });
          window.__timelines["hashtag-to-pill-materialize"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

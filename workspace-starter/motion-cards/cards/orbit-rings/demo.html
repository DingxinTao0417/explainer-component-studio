<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"细环绕着标题慢慢转"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.2,"max":3,"step":0.1},
    {"id":"strength","type":"number","label":"环线和光点的浓度（0–1）","default":0.7,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>orbit-rings · 轨道环</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="orbit-rings-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .orb { position: absolute; inset: 0; overflow: hidden; }
        .orb-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .orb-fx { position: absolute; inset: 0; opacity: 0.7; }
        .orb-hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 160px; }
        .orb-title { display: block; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 0.02em; text-align: center; }
        .orb-ring { position: absolute; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--k-accent-2) 55%, transparent); }
        .orb-r1 { left: 720px; top: 300px; width: 480px; height: 480px; }
        .orb-r2 { left: 610px; top: 190px; width: 700px; height: 700px; border-style: dashed; border-color: color-mix(in srgb, var(--k-muted) 60%, transparent); }
        .orb-r3 { left: 490px; top: 70px; width: 940px; height: 940px; }
        .orb-r4 { left: 360px; top: -60px; width: 1200px; height: 1200px; border-color: color-mix(in srgb, var(--k-muted) 50%, transparent); }
        .orb-r5 { left: 220px; top: -200px; width: 1480px; height: 1480px; border-style: dashed; border-color: color-mix(in srgb, var(--k-accent-2) 40%, transparent); }
        .orb-dot { position: absolute; left: calc(50% - 8px); top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--k-accent); box-shadow: 0 0 22px 4px color-mix(in srgb, var(--k-accent) 55%, transparent); }
        .orb-r2 .orb-dot, .orb-r5 .orb-dot { left: calc(50% - 6px); top: -7px; width: 12px; height: 12px; background: var(--k-accent-2); box-shadow: 0 0 18px 3px color-mix(in srgb, var(--k-accent-2) 55%, transparent); }
      </style>

      <div id="root" data-composition-id="orbit-rings" data-width="1920" data-height="1080">
        <div class="orb" data-layout-allow-overflow>
          <div class="orb-bg"></div>
          <div class="orb-fx">
            <div class="orb-ring orb-r5"><span class="orb-dot"></span></div>
            <div class="orb-ring orb-r4"><span class="orb-dot"></span></div>
            <div class="orb-ring orb-r3"><span class="orb-dot"></span></div>
            <div class="orb-ring orb-r2"><span class="orb-dot"></span></div>
            <div class="orb-ring orb-r1"><span class="orb-dot"></span></div>
          </div>
          <div class="orb-hold"><span class="orb-title">细环绕着标题慢慢转</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { dur: 6, turns: [[-30, 62], [200, -44], [115, 32], [300, -24], [48, 17]] };
          var v = { title: "细环绕着标题慢慢转", speed: 1, strength: 0.7 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".orb");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var ttl = q(".orb-title");
          ttl.textContent = String(v.title || "");
          if (!v.title) q(".orb-hold").style.display = "none";
          var sp = Math.min(3, Math.max(0.2, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          if (isNaN(st)) st = 0.7;
          var fx = q(".orb-fx");
          fx.style.opacity = String(Math.min(1, Math.max(0, st)));
          var D = CFG.dur;

          var tl = gsap.timeline({ paused: true });
          // inner rings turn further than outer ones, neighbours turn opposite ways; constant speed, no easing
          [".orb-r1", ".orb-r2", ".orb-r3", ".orb-r4", ".orb-r5"].forEach(function (s, i) {
            var t = CFG.turns[i];
            tl.fromTo(q(s), { rotation: t[0] }, { rotation: t[0] + t[1] * sp, duration: D, ease: "none" }, 0);
          });
          window.__timelines["orbit-rings"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

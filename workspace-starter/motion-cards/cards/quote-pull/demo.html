<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"quote","type":"string","label":"被拉出来的那句话（一行，建议 14 字以内）","default":"先给例子，再提要求。"},
    {"id":"source","type":"string","label":"出处（可空）","default":"示例文档 · 第 2 节"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>quote-pull · 引文拉出</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="quote-pull-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .qp { position: absolute; inset: 0; overflow: hidden; }
        .qp-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .qp-page { position: absolute; left: 230px; top: 70px; width: 1460px; height: 1100px; padding: 80px 100px; border-radius: 18px; background: var(--k-ink); color: var(--k-bg); }
        .qp-h { font-size: 60px; font-weight: 800; line-height: 1.3; margin-bottom: 30px; }
        .qp-p { font-size: 42px; line-height: 1.7; opacity: 0.72; }
        .qp-slot { margin: 44px 0; height: 56px; }
        .qp-src { position: relative; display: inline-block; font-size: 42px; font-weight: 800; line-height: 56px; white-space: nowrap; }
        .qp-ghost { position: absolute; left: -22px; right: -22px; top: -8px; bottom: -8px; border-radius: 8px; background: var(--k-accent); opacity: 0; }
        .qp-srct { position: relative; display: block; }
        .qp-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .qp-hold { position: relative; }
        .qp-card { position: relative; padding: 62px 88px; border-radius: 22px; background: var(--k-accent); color: var(--k-on-accent); }
        .qp-sh { position: absolute; inset: 0; border-radius: 22px; box-shadow: 0 60px 130px rgba(0, 0, 0, 0.55), 0 12px 30px rgba(0, 0, 0, 0.35); opacity: 0; }
        .qp-txt { position: relative; display: block; font-size: 120px; font-weight: 800; line-height: 1.3333; white-space: nowrap; }
        .qp-mark { position: absolute; left: 24px; top: -170px; font-size: 250px; font-weight: 800; line-height: 1; color: var(--k-accent); }
        .qp-from { position: absolute; right: 8px; top: 100%; margin-top: 30px; font-size: 40px; line-height: 1.3; color: var(--k-ink); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="quote-pull" data-width="1920" data-height="1080">
        <div class="qp">
          <div class="qp-bg"></div>
          <div class="qp-page" data-layout-allow-overflow>
            <div class="qp-h" data-layout-ignore>写作笔记 · 示例文档</div>
            <div class="qp-p" data-layout-ignore>很多提示词写不好，不是因为不够长，而是因为只有要求、没有参照。对方得先看到你想要的样子。</div>
            <div class="qp-slot"><span class="qp-src" data-layout-allow-occlusion><span class="qp-ghost"></span><span class="qp-srct" data-layout-allow-occlusion>先给例子，再提要求。</span></span></div>
            <div class="qp-p" data-layout-ignore>一个具体的例子，能同时说明语气、长度和格式。这些东西改用形容词去描述，往往要多写三倍的字，还说不准。</div>
            <div class="qp-p" data-layout-ignore>所以动笔之前，先找一段你满意的成品放在最前面，再写你的要求。</div>
          </div>
          <div class="qp-stage">
            <div class="qp-hold">
              <div class="qp-card">
                <div class="qp-sh"></div>
                <span class="qp-txt" data-layout-allow-occlusion data-layout-allow-overlap>先给例子，再提要求。</span>
              </div>
              <span class="qp-mark" data-layout-allow-overlap>“</span>
              <span class="qp-from" data-layout-allow-overlap>—— 示例文档 · 第 2 节</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // swipe: the highlighter stroke · wait: beat between stroke and pull · dip: tiny press before the pull · pull: travel to centre
          var CFG = { at: 0.4, swipe: 0.45, wait: 0.25, dip: 0.1, pull: 0.62, blur: 9, pageDim: 0.42, maxFont: 120, maxWidth: 1400 };
          var v = { quote: "先给例子，再提要求。", source: "示例文档 · 第 2 节", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".qp");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".qp-bg").style.display = "none";
          var quote = String(v.quote || "先给例子，再提要求。");
          var txt = q(".qp-txt"), srct = q(".qp-srct"), from = q(".qp-from");
          txt.textContent = srct.textContent = quote;
          from.textContent = v.source ? "—— " + v.source : "";
          // the card text shrinks to stay on one line, so the strip on the page and the card are the same shape at two sizes
          var fs = Math.min(CFG.maxFont, Math.floor(CFG.maxWidth / Math.max(1, quote.length)));
          txt.style.fontSize = fs + "px";

          // where the sentence sits on the page vs. where the card text sits at rest (offsets ignore transforms, so preview scaling is harmless)
          var pos = function (el) { var x = 0, y = 0; while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x: x, y: y }; };
          var card = q(".qp-card"), page = q(".qp-page"), a = pos(srct), b = pos(txt), c = pos(card);
          var s0 = 42 / fs;
          var x0 = a.x - c.x - (b.x - c.x) * s0, y0 = a.y - c.y - (b.y - c.y) * s0;
          var clip = function (r) { return "inset(0% " + r + "% 0% 0% round 22px)"; };

          var tl = gsap.timeline({ paused: true });
          tl.set(card, { transformOrigin: "0 0" }, 0);
          // 1) the card starts life as a highlighter stroke lying exactly on the sentence
          tl.fromTo(card, { x: x0, y: y0, scale: s0, clipPath: clip(100) }, { x: x0, y: y0, scale: s0, clipPath: clip(0), duration: CFG.swipe, ease: "power2.inOut" }, CFG.at);
          // 2) a small press, then it comes off the page; the page falls back at the same moment
          var go = CFG.at + CFG.swipe + CFG.wait;
          tl.set(card, { clipPath: "none" }, go);
          tl.to(card, { scale: s0 * 0.94, x: x0 + 8, y: y0 + 3, duration: CFG.dip, ease: "power2.in" }, go);
          tl.to(card, { x: 0, y: 0, scale: 1, duration: CFG.pull, ease: "back.out(1.25)" }, go + CFG.dip);
          tl.fromTo(q(".qp-sh"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, go + CFG.dip);
          tl.fromTo(q(".qp-ghost"), { opacity: 0 }, { opacity: 0.45, duration: 0.05, ease: "none" }, go + CFG.dip);
          tl.fromTo(page, { filter: "blur(0px)", opacity: 1, scale: 1 }, { filter: "blur(" + CFG.blur + "px)", opacity: CFG.pageDim, scale: 0.965, duration: CFG.pull, ease: "power2.out" }, go + CFG.dip);
          // 3) dressing arrives only after the card has landed
          var land = go + CFG.dip + CFG.pull;
          tl.fromTo(q(".qp-mark"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, land - 0.05);
          tl.fromTo(from, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, land + 0.1);
          window.__timelines["quote-pull"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

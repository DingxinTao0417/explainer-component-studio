      o = o || {};
      var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
      var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
      for (;;) {
        el.style.fontSize = f + "px";
        m = kLines(el);
        if ((m.w <= W && m.n <= n) || f <= min) break;
        f = Math.max(min, f - 2);
      }
      if (m.w > W) {
        [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
        m = kLines(el);
      }
      return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
    }
    function kLines(el) {
      var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
      var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
      while ((t = it.nextNode())) {
        if (!t.data.trim()) continue;
        r.selectNodeContents(t);
        [].forEach.call(r.getClientRects(), function (b) {
          var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
          if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
          row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
        });
      }
      return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
    }
    // ==== kit:text@2 — kSplit "line" mode only (a line per "|"; nothing the user typed is trimmed) ====
    function kSplit(el, text) {
      var units = [];
      el.textContent = "";
      String(text).split(/\n|\|/).forEach(function (t) {
        var u = document.createElement("span");
        u.className = "ic-u"; u.textContent = t;
        el.appendChild(u); units.push(u);
      });
      return units;
    }
    // ==== kit:grain@1 — film grain on a full-size layer: 6 seeded noise tiles, a new tile and offset every 2 frames ====
    function kGrain(layer, o) {
      o = o || {};
      var size = o.size || 256, step = o.step || 2, dark = !!layer.closest('[data-tone="dark"]');
      var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
        var f = "type='linear' slope='2.4' intercept='-0.7'";
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
          "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
          "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
          "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
          "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
        return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
      });
      layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
      layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
      layer.style.backgroundSize = size + "px " + size + "px";
      return function (t) {
        var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        layer.style.backgroundImage = tiles[k % 6];
        layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
      };
    }

    kTone(root);
    if (String(v.backdrop) === "off") root.setAttribute("data-bare", "");
    var drawGrain = kGrain(q(".ic-grain"));

    // the picture is drawn once (ticket); page A gets a copy with its own gradient ids
    var src = q(".ic-dunes-src"), holder = q(".ic-dunes-a");
    holder.outerHTML = src.outerHTML.replace(/ic-(sky|sun|d1|d2|d3|sh)\b/g, "ic-$1a").replace("ic-dunes-src", "");
    var suns = root.querySelectorAll(".ic-sunc");

    // text slots: "|" lines, [accent] words, measured and shrunk to the floor, then wrapped
    var has = function (k) { return v[k] != null && String(v[k]).trim() !== ""; };
    var accent = function (u) {
      var s = u.textContent;
      if (s.indexOf("[") < 0) return;
      u.textContent = "";
      s.split(/(\[[^\]]*\])/).forEach(function (p) {
        if (!p) return;
        if (p.charAt(0) !== "[" || p.slice(-1) !== "]") return u.appendChild(document.createTextNode(p));
        var e = document.createElement("span"); e.className = "ic-hl"; e.textContent = p.slice(1, -1); u.appendChild(e);
      });
    };
    var slot = function (el, text, min) {
      var n = kSplit(el, text); n.forEach(accent);
      kFit(el, { lines: Math.max(1, n.length), min: min });
    };
    var show = function (el, on) { el.style.display = on ? "" : "none"; };
    var kA = q(".ic-a .ic-kick"), kB = q(".ic-b .ic-kick"), TT = P ? 72 : 56;
    var setKick = function (box, text) {
      var s = box.querySelector("span"), has = String(text).trim() !== "";
      s.textContent = text; show(box, has);
      if (has) kFit(s, { lines: 1, min: 28, width: box.clientWidth - 40 });
    };
    if (v.kicker != null) setKick(kA, v.kicker);
    if (v.donekicker != null) setKick(kB, v.donekicker);
    if (has("title")) slot(q(".ic-a .ic-title"), v.title, TT);
    if (has("done")) slot(q(".ic-done"), v.done, TT);
    var note = q(".ic-note");
    if (v.note != null) { show(note, has("note")); if (has("note")) slot(note, v.note, 40); }
    var btn = q(".ic-btn"), l1 = q(".ic-lb1"), l2 = q(".ic-lb2"), spin = q(".ic-spin");
    if (has("action")) l1.textContent = v.action;
    if (has("busy")) l2.textContent = v.busy;
    l2.style.display = "inline-block"; // measured while shown
    [l1, l2].forEach(function (l) { kFit(l, { lines: 1, min: 40, width: btn.clientWidth - 150 }); });
    l2.style.display = "";

    var a = q(".ic-a"), b = q(".ic-b"), pan = q(".ic-pan"), occ = q(".ic-occ"), lead = q(".ic-lead");
    var chk = q(".ic-chk"), seal = q(".ic-seal"), notes = [note, 0, q(".ic-code")];
   
    // occluder sized from the frame width: same full-cover slice of the sweep in both orientations
    var SOFT = FW * 0.17708, CORE = FW * 1.35417, OCC_W = CORE + 2 * SOFT, LEAD = FW * 0.33333; // upstream 340 / 2600 / 640 px of 1920
    var oc = function (pct) { return "color-mix(in srgb, var(--ic-o) " + pct + "%, transparent)"; };
    occ.style.width = OCC_W + "px";
    occ.style.background = "linear-gradient(90deg," + oc(0) + " 0px," + oc(85) + " " + SOFT * 0.6 + "px,var(--ic-o) " + SOFT + "px,var(--ic-o) " + (SOFT + CORE) + "px," + oc(80) + " " + (SOFT + CORE + SOFT * 0.4) + "px," + oc(0) + " " + OCC_W + "px)";
    var rim = q(".ic-rim"), sh = q(".ic-sh"), rg = "color-mix(in srgb, var(--k-accent) 42%, transparent)", mk = "linear-gradient(90deg, transparent 0px, #000 " + SOFT + "px, #000 " + (SOFT + CORE) + "px, transparent " + OCC_W + "px)";
    rim.style.left = SOFT * 0.35 + "px"; rim.style.width = FW * 0.13542 + "px";
    rim.style.background = "linear-gradient(90deg, transparent 0%," + rg + " 45%, transparent 100%)";
    sh.style.webkitMaskImage = sh.style.maskImage = mk;
    lead.style.width = LEAD + SOFT + "px"; lead.style.bottom = "0px";
    lead.style.background = "linear-gradient(90deg," + oc(0) + " 0px," + oc(38) + " " + LEAD + "px," + oc(50) + " " + (LEAD + SOFT) + "px)";
    b.style.transform = "translateX(40px)"; // B sits 40px right, cancelling the pan end point

    var ox = function (t) { return MT.mix(FW + 20, -OCC_W - 20, MT.ramp(t, CFG.sw0, CFG.sw1 - CFG.sw0, SWEEP)); };

    function render(t) {
      var before = t < CFG.cut - 1e-6;
      a.style.opacity = before ? 1 : 0; b.style.opacity = before ? 0 : 1;
      // slow pan through the cut; shove: A dragged left, B settles from the right
      var drift = 40 - 80 * MT.ramp(t, 0, CFG.slot, "smooth");
      var shove = before ? -28 * MT.ramp(t, CFG.sw0 - CFG.shoveLead, CFG.cut - CFG.sw0 + CFG.shoveLead, "exit") : 28 * (1 - MT.ramp(t, CFG.cut, CFG.shoveOut, "out"));
      pan.style.transform = "translateX(" + (drift + shove).toFixed(2) + "px)";
      var x = ox(t), on = t >= CFG.sw0 && t <= CFG.sw1 ? 1 : 0;
      occ.style.opacity = lead.style.opacity = on;
      // while the occluder is in view the checks treat the pages as set dressing (audited at rest)
      if (on) pan.setAttribute("data-layout-ignore", ""); else pan.removeAttribute("data-layout-ignore");
      occ.style.transform = "translateX(" + x.toFixed(1) + "px)";
      lead.style.transform = "translateX(" + (x - LEAD).toFixed(1) + "px)";
      var r = (190 * (1 + 0.04 * Math.sin((t * 30) / 16))).toFixed(2); // breathing sun, frames at 30 fps
      for (var i = 0; i < suns.length; i++) suns[i].setAttribute("r", r);
      // A: the button is pressed, then reads as busy
      var down = MT.ramp(t, CFG.press, CFG.pressDur, "out") * (1 - MT.ramp(t, CFG.upAt, CFG.upDur, "out"));
      var busy = t >= CFG.busyAt;
      btn.style.transform = "scale(" + (1 - 0.04 * down).toFixed(4) + ")";
      btn.style.filter = down > 0.01 ? "brightness(" + (1 - 0.12 * down).toFixed(3) + ")" : "";
      btn.style.boxShadow = "inset 0 1px 0 color-mix(in srgb, white 30%, transparent), 0 " + MT.mix(18, 6, down).toFixed(1) + "px " + MT.mix(40, 16, down).toFixed(1) + "px -12px color-mix(in srgb, color-mix(in srgb, var(--k-accent) 50%, black) 55%, transparent)";
      l1.style.display = busy ? "none" : "inline-block"; l2.style.display = busy ? "inline-block" : "none"; spin.style.display = busy ? "block" : "none";
      spin.style.transform = "rotate(" + ((t - CFG.press) * 720).toFixed(1) + "deg)";
      // B: rows rise, stamp springs down, tick drawn
      for (i = 0; i < 3; i += 2) {
        var p = MT.ramp(t, CFG.rows + i * CFG.rowGap, CFG.rowDur, "snappy");
        notes[i].style.opacity = p.toFixed(3);
        notes[i].style.transform = "translateY(" + ((1 - p) * (i ? 20 : 22)).toFixed(1) + "px)";
      }
      var sp = MT.spring({ t: t, delay: CFG.seal, damping: 13, stiffness: 190 });
      seal.style.transform = "rotate(" + MT.mix(-30, -8, sp).toFixed(2) + "deg) scale(" + MT.mix(1.8, 1, sp).toFixed(4) + ")";
      seal.style.opacity = Math.min(1, sp * 3).toFixed(3);
      chk.style.strokeDashoffset = (90 * (1 - MT.ramp(t, CFG.check, CFG.checkDur, "out"))).toFixed(2);
      drawGrain(t);
    }
    var tl = MT.scene(CFG.slot, render);
    window.__timelines["invisible-cut"] = tl;
  })();
</script>

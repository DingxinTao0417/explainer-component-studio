<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"lead","type":"string","label":"引子（可空）","default":"这种现象有个名字"},
    {"id":"term","type":"string","label":"被框住的术语（2–6 个字最好）","default":"幻觉"},
    {"id":"gloss","type":"string","label":"一句话解释（可空）","default":"模型把编出来的东西说得像真的"},
    {"id":"hit","type":"number","label":"说出术语的时刻（秒）","default":1.1,"min":0.6,"max":20,"step":0.05},
    {"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},
    {"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto","options":[{"value":"auto","label":"按扩展名自动判断"},{"value":"video","label":"视频"},{"value":"image","label":"图片"},{"value":"none","label":"不放人（人在别的层，这里只留字）"}]},
    {"id":"side","type":"enum","label":"人在哪一边","default":"right","options":[{"value":"right","label":"右边，字在左"},{"value":"left","label":"左边，字在右"}]},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>host-corner-frame · 口播角框</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="host-corner-frame-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .hf { position: absolute; inset: 0; }
        .hf-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .hf-host { position: absolute; bottom: 0; left: 910px; width: 1100px; height: 900px; object-fit: contain; object-position: 50% 100%; }
        /* two corner pieces on the diagonal of the term; the gap above the term is wide enough that the top-left piece
           flies in without ever passing under the lead line */
        .hf-c { position: absolute; display: block; width: 52px; height: 52px; border: 0 solid var(--k-accent); }
        .hf-c1 { left: 114px; top: 406px; border-top-width: 10px; border-left-width: 10px; }
        .hf-c2 { left: 414px; top: 578px; border-bottom-width: 10px; border-right-width: 10px; }
        .hf-txt { position: absolute; left: 140px; top: 300px; width: 760px; }
        .hf-lead { display: block; font-size: 52px; font-weight: 700; line-height: 1.3; color: var(--k-muted); white-space: nowrap; }
        .hf-term { display: block; width: fit-content; margin-top: 64px; font-size: 150px; font-weight: 900; line-height: 1.15; white-space: nowrap; }
        .hf-gloss { display: block; margin-top: 42px; font-size: 44px; font-weight: 700; line-height: 1.4; color: var(--k-muted); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="host-corner-frame" data-width="1920" data-height="1080">
        <div class="hf">
          <div class="hf-bg"></div>
          <video id="host-corner-frame-host" class="hf-host hf-host-v" data-var-src="host" src="motion-cards/lib/samples/presenter.png" data-start="0" muted playsinline></video>
          <img class="hf-host hf-host-i" data-var-src="host" src="motion-cards/lib/samples/presenter.png" alt="" />
          <div class="hf-c hf-c1"></div>
          <div class="hf-c hf-c2"></div>
          <div class="hf-txt">
            <span class="hf-lead">这种现象有个名字</span>
            <span class="hf-term">幻觉</span>
            <span class="hf-gloss">模型把编出来的东西说得像真的</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { leadAt: 0.25, rise: 0.45, termLead: 0.1, termIn: 0.35, lockLag: 0.05, lock: 0.42, travel: 44, pad: 26, glossLag: 0.7,
            termMax: 150, hostW: 1100, hostX: { right: 1460, left: 460 }, txtX: { right: 140, left: 1020 }, txtW: 760, txtTop: 300 };
          var v = { lead: "这种现象有个名字", term: "幻觉", gloss: "模型把编出来的东西说得像真的", hit: 1.1,
            host: "motion-cards/lib/samples/presenter.png", hostKind: "auto", side: "right", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && (got[k] !== "" || k === "lead" || k === "gloss" || k === "host")) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".hf");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".hf-bg").style.display = "none";

          // the presenter: a video, a still, or nothing (when the host already runs on its own layer in the project)
          var src = String(v.host || ""), kind = String(v.hostKind || "auto"), side = String(v.side) === "left" ? "left" : "right";
          if (kind === "auto") kind = !src ? "none" : /\.(png|jpe?g|webp|gif|avif|svg)([?#]|$)/i.test(src) ? "image" : "video";
          var vid = q(".hf-host-v"), img = q(".hf-host-i");
          if (kind !== "video") vid.parentNode.removeChild(vid);
          if (kind !== "image") img.parentNode.removeChild(img);
          Array.prototype.forEach.call(root.querySelectorAll(".hf-host"), function (el) { el.style.left = CFG.hostX[side] - CFG.hostW / 2 + "px"; });

          var em = function (s) { var w = 0; for (var c = 0; c < s.length; c++) w += s.charCodeAt(c) > 255 ? 1 : 0.6; return Math.max(w, 1); };
          var txt = q(".hf-txt"), lead = q(".hf-lead"), term = q(".hf-term"), gloss = q(".hf-gloss");
          var sLead = String(v.lead || ""), sTerm = String(v.term), sGloss = String(v.gloss || "");
          var x0 = CFG.txtX[side];
          txt.style.left = x0 + "px";
          txt.style.top = CFG.txtTop + "px";
          lead.textContent = sLead;
          gloss.textContent = sGloss;
          term.textContent = sTerm;
          if (!sLead) lead.style.display = "none";
          if (!sGloss) gloss.style.display = "none";
          lead.style.fontSize = Math.floor(Math.min(52, CFG.txtW / em(sLead || "x"))) + "px";
          gloss.style.fontSize = Math.floor(Math.min(44, CFG.txtW / em(sGloss || "x"))) + "px";
          // the term keeps room for the corner pieces on both sides of the column
          term.style.fontSize = Math.floor(Math.min(CFG.termMax, (CFG.txtW - 2 * CFG.pad) / em(sTerm))) + "px";

          // corners hug the term's own box on its diagonal: top-left and bottom-right
          var tx = x0 + term.offsetLeft, ty = CFG.txtTop + term.offsetTop, tw = term.offsetWidth, th = term.offsetHeight;
          var arm = Math.round(Math.max(40, Math.min(84, 0.3 * Math.min(tw, th))));
          var c1 = q(".hf-c1"), c2 = q(".hf-c2");
          [c1, c2].forEach(function (c) { c.style.width = arm + "px"; c.style.height = arm + "px"; });
          c1.style.left = tx - CFG.pad + "px";
          c1.style.top = ty - CFG.pad + "px";
          c2.style.left = tx + tw + CFG.pad - arm + "px";
          c2.style.top = ty + th + CFG.pad - arm + "px";

          var hit = Math.max(0.6, Number(v.hit) || 1.1), lockAt = hit + CFG.lockLag;
          var tl = gsap.timeline({ paused: true });
          if (sLead) tl.fromTo(lead, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: CFG.rise, ease: "power3.out" }, CFG.leadAt);
          // the term lands on the spoken word, then the two corners close in along the diagonal and settle with a small bite
          tl.fromTo(term, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: CFG.termIn, ease: "power3.out" }, hit - CFG.termLead);
          tl.fromTo([c1, c2], { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, lockAt);
          tl.fromTo(c1, { x: -CFG.travel, y: -CFG.travel }, { x: 0, y: 0, duration: CFG.lock, ease: "back.out(1.4)" }, lockAt);
          tl.fromTo(c2, { x: CFG.travel, y: CFG.travel }, { x: 0, y: 0, duration: CFG.lock, ease: "back.out(1.4)" }, lockAt);
          if (sGloss) tl.fromTo(gloss, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: CFG.rise, ease: "power3.out" }, hit + CFG.glossLag);
          window.__timelines["host-corner-frame"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

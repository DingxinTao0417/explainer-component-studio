          var mask = function (el, m) { el.style.webkitMaskImage = m; el.style.maskImage = m; };
          var lin = function (t, a, b, from, to) { return MT.interpolate(t, [a, b], [from, to], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };

          var render = function (t) {
            var f = t * 30;
            // entrance: each line blurs and slides up 36 px (at 92 px type) on one snappy progress
            [CFG.in1, CFG.in2].forEach(function (a, k) {
              var el = lines[k]; if (!el) return;
              var e = MT.ramp(t, a, CFG.inDur, "snappy");
              el.style.opacity = e;
              el.style.transform = "translateY(" + ((1 - e) * 36 * s).toFixed(2) + "px)";
              el.style.filter = e < 0.999 ? "blur(" + ((1 - e) * 10 * s).toFixed(2) + "px)" : "none";
            });
            push.style.transform = "scale(" + (1 + CFG.push * MT.ramp(t, 0, 104 / 30, "smooth")).toFixed(5) + ")";

            var p = MT.interpolate(t, [CFG.fill, CFG.fillEnd], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp", easing: "power1.out" });
            var pc = p * 100;
            var fi = Math.min(159, Math.floor(f + 1e-6));
            var act = FLASHES.filter(function (x) { return f >= x.at && f < x.at + x.life; })[0];
            var lvl = lin(t, CFG.fill, CFG.fillEnd, 0, 1) * (0.82 + 0.18 * FLICKER[fi]) + (act ? 0.35 : 0);
            var soft = function (sf) { return p >= 1 ? "none" : "linear-gradient(90deg, #000 0%, #000 " + at(pc - sf) + ", transparent " + at(pc + sf * 0.6) + ")"; };
            // four glow layers follow the fill edge with soft masks, then breathe with the flicker
            amb.style.opacity = (0.55 * lvl).toFixed(3);
            h1.style.opacity = (0.55 * lvl).toFixed(3); mask(h1, soft(14));
            h2.style.opacity = (0.62 * lvl).toFixed(3); mask(h2, soft(10));
            h3.style.opacity = (0.72 * Math.min(1, lvl + 0.1)).toFixed(3); mask(h3, soft(7));
            body.style.clipPath = "inset(-25% " + (100 - pc).toFixed(2) + "% -25% 0)";
            // wave-front trail: brightest at the edge, fading 34% back; fades out over 10 f after the fill
            var tf = lin(t, CFG.fillEnd, CFG.fillEnd + CFG.trailOut, 1, 0);
            tr.style.opacity = (0.95 * tf).toFixed(3);
            mask(tr, "linear-gradient(90deg, transparent 0%, transparent " + at(pc - CFG.trail) + ", rgba(0,0,0,0.9) " + at(pc - 3) + ", rgba(0,0,0,0.9) " + at(pc + 1) + ", transparent " + at(pc + 6) + ")");
            // over-exposed head: the glyphs right at the edge, only while filling
            var hf = t >= CFG.fill && p < 1 ? lin(t, CFG.fillEnd, CFG.fillEnd + CFG.headOut, 1, 0) : 0;
            hd.style.opacity = (0.9 * hf).toFixed(3);
            mask(hd, "linear-gradient(90deg, transparent 0%, transparent " + at(pc - 12) + ", #000 " + at(pc - 6) + ", #000 " + at(pc - 1) + ", transparent " + at(pc + 2) + ")");
            // bolts: one scheduled flash at a time, three strokes, decaying over its 3-4 frames
            if (act) {
              var b = BOLTS[act.bolt], wi = b.long ? 0 : 1;
              g.style.opacity = Math.min(1, 1.1 * (1 - (f - act.at) / act.life)).toFixed(3);
              [].forEach.call(paths, function (pa, k) { pa.setAttribute("d", b.d); pa.setAttribute("stroke-width", (WIDE[k][wi] * K).toFixed(2)); });
            } else g.style.opacity = 0;
            grain(t);
          };
          var tl = MT.scene(CFG.dur, render);
          window.__timelines["gradient-word-sweep"] = tl;
        })();
      </script>
    </template>
  </body>

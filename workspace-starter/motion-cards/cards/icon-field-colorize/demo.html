            '<path fill-rule="evenodd" d="M5.5 6h13A2.5 2.5 0 0 1 21 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-8A2.5 2.5 0 0 1 5.5 6zM12 8.9a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 1 0 0-7.2z"/><rect x="8" y="3.5" width="8" height="4" rx="1.5"/>',
            '<path d="M6.5 19a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 17.8 8.7 4.2 4.2 0 0 1 17.5 19z"/>',
            '<path transform="scale(.9) translate(1.2 .5)" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/>',
            '<path d="M3.5 10L12 3l8.5 7V21h-6v-6h-5v6h-6z"/>',
            '<path fill-rule="evenodd" d="M3 8h18v4H3zM5 12h14v9H5zM10.9 8h2.2v13h-2.2z"/>',
            '<path transform="scale(.9) translate(1 1)" d="M9.4 20.6l-1 1.9 7.2-.1 4.9-8.5-2.2.1-2 3.4L13 4.5h-2.1L7.6 17.3z"/>',
            '<path d="M20.3 6.7L9.6 17.4l-5.9-5.9 2.1-2.1 3.8 3.8 8.6-8.6z"/>',
            '<path transform="scale(.85) translate(1.8 1.8)" d="M21.5 15.5L14 12V5.5a2 2 0 1 0-4 0V12l-7.5 3.5v2l7.5-2v4l-2.5 2v1.5l4.5-1 4.5 1V21.5l-2.5-2v-4l7.5 2z"/>',
            '<circle cx="12" cy="12" r="4"/><path d="M12 1.5l1.4 3.6h-2.8zM12 22.5l-1.4-3.6h2.8zM1.5 12l3.6-1.4v2.8zM22.5 12l-3.6 1.4v-2.8zM4.6 4.6l3.5 1.5-2 2zM19.4 19.4l-3.5-1.5 2-2zM19.4 4.6l-1.5 3.5-2-2zM4.6 19.4l1.5-3.5 2 2z"/>',
            '<path d="M20 4C10 4 4.5 9 4 15.7 3.9 17.5 4 20 4 20s2.7-.2 4.4-.3C15 19.2 20 13.5 20 4zM6.8 17.2C10 11 15 8 15 8s-5.5 1.5-8.8 8z"/>'
          ];
          SHAPES.forEach(function (s, i) {
            root.style.setProperty("--ifc-g" + i, 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + s + "</svg>") + '")');
          });

          // the field: upstream's seeded layout (mulberry32, 3 draws per icon in row order) on this orientation's grid
          var S = Math.min(FW, FH) / 1.08e3, T = 66 * S, G = 32 * S, CX = L.cx * S, CY = L.cy * S, TR = 18 * S;
          var X0 = (FW - ((L.cols - 1) * CX + CX / 2 + T)) / 2, Y0 = (FH - ((L.rows - 1) * CY + T)) / 2;
          var from = CFG.bands.map(function (b) { return Math.round(b * (L.rows - 1)); });
          var rowStep = CFG.sweep / (L.rows - 1), colStep = CFG.tilt / (L.cols - 1);
          var field = q(".ifc-field"), rnd = MT.seeded(20260718), R = Math.hypot(FW / 2, FH / 2), icons = [], html = "";
          field.style.cssText = "--ts:" + T + "px;--gs:" + G + "px;--tr:" + TR + "px";
          for (var r = 0; r < L.rows; r++) {
            for (var c = 0; c < L.cols; c++) {
              var r1 = rnd(), r2 = rnd(), r3 = rnd(), x = X0 + c * CX + (r % 2) * (CX / 2), y = Y0 + r * CY;
              var d = Math.hypot(x + T / 2 - FW / 2, y + T / 2 - FH / 2) / R, jit = (r1 - 0.5) * 0.08, arr = [];
              for (var w = 0; w < 4; w++) if (r >= from[w]) arr.push({ k: w, at: CFG.waves[w] + (r - from[w]) * rowStep + c * colStep + r3 * CFG.jit });
              icons.push({ r: r, t0: CFG.in0 + Math.min(9, Math.floor((d * 0.75 + r1 * 0.35) * 10)) * CFG.batch + r2 * CFG.inJit, arr: arr });
              html += '<div class="ifc-i" style="left:' + x.toFixed(1) + "px;top:" + y.toFixed(1) + "px;--g:var(--ifc-g" + (Math.floor(r3 * 16) % 16) +
                ");--gy:var(--ifc-y" + Math.floor(r2 * 3) + ");--jx:" + (jit < 0 ? "black" : "white") + ";--jp:" + Math.abs(jit * 100).toFixed(1) +
                '%"></div>';
            }
          }
          field.innerHTML = html;
          icons.forEach(function (ic, i) { ic.e = field.children[i]; });

          // text: every slot through kSplit -> kFit; an empty slot hides, all three empty also drops the veil.
          // Both title lines end at the smaller fitted size, so a long first line does not sit under a huge second one
          var units = {}, shown = [], fs = [];
          [["kick", "kicker"], ["t1", "title"], ["t2", "title2"]].forEach(function (p) {
            var el = q(".ifc-" + p[0]), s = String(v[p[1]] == null ? "" : v[p[1]]).trim();
            units[p[0]] = [];
            if (!s) { el.style.display = "none"; return; }
            shown.push(el);
            if (p[0] === "kick") { el.textContent = s; units.kick = [el]; kFit(el, { lines: 1 }); return; }
            units[p[0]] = kSplit(el, "word", true, s);
            fs.push([el, kFit(el, { lines: 1, min: 72 }).size]);
          });
          fs.forEach(function (e) { e[0].style.fontSize = Math.min.apply(null, fs.map(function (x) { return x[1]; })) + "px"; });
          var scrim = q(".ifc-scrim"), key = q(".ifc-key"), spill = q(".ifc-spill");
          if (!shown.length) scrim.style.display = "none";
          else {
            // the veil's solid part (78% at 45% of its radius) covers the text block plus 40px, never smaller than upstream's
            var bw = Math.max.apply(null, shown.map(function (el) { return kLines(el).w; }));
            var bh = shown[shown.length - 1].getBoundingClientRect().bottom - shown[0].getBoundingClientRect().top;
            scrim.style.setProperty("--se", Math.max(FW * L.se[0], (bw / 2 + 40 * S) / 0.45).toFixed(0) + "px " + Math.max(FH * L.se[1], (bh / 2 + 40 * S) / 0.45).toFixed(0) + "px");
          }

          var EO = MT.ease("out"), EOV = MT.ease("overshoot"), ESN = MT.ease("snappy"), ESM = MT.ease("smooth");
          // write only what changed: "w" / "n" = a data- attribute ("" removes it), "--x" = a custom property, else a style
          var put = function (el, k, val) {
            var c = el._c || (el._c = {});
            if (c[k] === val) return;
            c[k] = val;
            if (k.length === 1) val === "" ? el.removeAttribute("data-" + k) : el.setAttribute("data-" + k, val);
            else if (k.charAt(0) === "-") el.style.setProperty(k, val);
            else el.style[k] = val;
          };
          var last = { spill: "" };
          var tl = MT.scene(CFG.end, function (t) {
            var inh = MT.ramp(t, CFG.inhale, CFG.inhaleDur, ESM) * (1 - MT.ramp(t, CFG.release, CFG.releaseDur, EO));
            var push = 1 + CFG.push * MT.ramp(t, 0, CFG.pushEnd, ESM), lit = [], col = [];
            field.style.transform = "scale(" + push.toFixed(5) + ")";
            field.style.opacity = (1 - CFG.dim * inh).toFixed(4);
            key.style.opacity = (0.45 + 0.35 * MT.ramp(t, CFG.waves[0], CFG.lit, EO)).toFixed(4);
            scrim.style.opacity = MT.ramp(t, CFG.scrim, CFG.scrimDur, EO).toFixed(4);
            icons.forEach(function (ic) {
              var op = MT.ramp(t, ic.t0, CFG.fade, EO);
              put(ic.e, "opacity", op.toFixed(3));
              if (op <= 0) return;
              var s = MT.mix(0.6, 1, MT.ramp(t, ic.t0, CFG.grow, EOV)), lift = (1 - MT.ramp(t, ic.t0, CFG.grow, ESN)) * CFG.lift * S;
              var prev = -1, cur = -1, p = 0, since = -1;
              ic.arr.forEach(function (a) { var qq = MT.clamp((t - a.at) / CFG.flip, 0, 1); if (qq > 0) { prev = cur; cur = a.k; p = qq; since = t - a.at; } });
              if (cur >= 0) { lit[ic.r] = (lit[ic.r] || 0) + 1 / L.cols; col[ic.r] = cur; }
              var flip = p > 0 && p < 1, pop = flip ? 1 + CFG.pop * Math.sin(p * Math.PI) : 1;
              var flash = since >= CFG.flip ? Math.max(0, 1 - (since - CFG.flip) / CFG.flash) : 0;
              var gk = since >= 0 ? 1 + 1.2 * Math.max(0, 1 - since / CFG.glow) : 1;
              put(ic.e, "transform", "translate(0px," + lift.toFixed(2) + "px) scale(" + (s * pop).toFixed(4) + ")");
              put(ic.e, "--gk", gk.toFixed(3));
              put(ic.e, "--gx", gk > 1 ? "0 0 56px color-mix(in srgb, var(--c) " + (50 * (gk - 1) / 1.2).toFixed(1) + "%, transparent)" : "0 0 0 transparent");
              // the new colour fills the cap from the top edge down (a hard stop, never a cross-fade) over the old one
              var fp = flip ? EO(p) : 0;
              put(ic.e, "w", String(flip ? prev : cur).replace("-1", ""));
              put(ic.e, "n", flip ? String(cur) : "");
              put(ic.e, "--fp", (fp * 100).toFixed(2) + "%");
              put(ic.e, "--gf", (MT.clamp((fp * T - (T - G) / 2) / G, 0, 1) * 100).toFixed(2) + "%");
              // a short white flash once the cap is full (screen with white = a mix towards white)
              put(ic.e, "--fl", (45 * flash).toFixed(1) + "%");
            });
            // each lit row tints the stage behind it (strength = share of the row already lit)
            var stops = [], y0 = FH / 2 + (Y0 + T / 2 - 1.1 * CY - FH / 2) * push, y1 = FH / 2 + (Y0 + (L.rows - 1) * CY + T / 2 + 1.1 * CY - FH / 2) * push;
            for (var r = 0; r < L.rows; r++) {
              var yy = FH / 2 + (Y0 + r * CY + T / 2 - FH / 2) * push, a = lit[r] || 0;
              stops.push((a > 0 ? "color-mix(in srgb, var(--ifc-w" + col[r] + ") calc(var(--ifc-spill) * " + a.toFixed(3) + "), transparent)" : "transparent") + " " + yy.toFixed(1) + "px");
            }
            var bg = lit.length ? "linear-gradient(180deg, transparent " + y0.toFixed(1) + "px, " + stops.join(", ") + ", transparent " + y1.toFixed(1) + "px)" : "none";
            if (bg !== last.spill) { last.spill = bg; spill.style.background = bg; }
          });
          // title: veil, eyebrow, then the two lines rise word by word out of their own line
          tl.fromTo(units.kick, { opacity: 0 }, { opacity: 1, duration: CFG.kickDur, ease: "out" }, CFG.kick);
          tl.fromTo(units.kick, { y: 12 * S }, { y: 0, duration: CFG.kickRise, ease: "snappy" }, CFG.kick);
          kReveal(tl, units.t1, "rise", CFG.title, { each: CFG.word, gap: CFG.gap });
          kReveal(tl, units.t2, "rise", CFG.title2, { each: CFG.word, gap: CFG.gap });
          window.__timelines["icon-field-colorize"] = tl;
        })();
      </script>
    </template>

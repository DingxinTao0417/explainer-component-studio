<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"items","type":"string","label":"三个节点的文字，用 | 隔开（方框 | 圆 | 方框）","default":"素材|模型|成片"},
    {"id":"x","type":"number","label":"示意图左上角 x（1920×1080 坐标）","default":160,"min":0,"max":1920,"step":1},
    {"id":"y","type":"number","label":"示意图左上角 y","default":380,"min":0,"max":1080,"step":1},
    {"id":"w","type":"number","label":"示意图宽","default":1600,"min":600,"max":1920,"step":10},
    {"id":"h","type":"number","label":"示意图高（也是圆的直径）","default":320,"min":120,"max":700,"step":10},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明，只留线稿和字"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>sketch-draw · 线稿画出</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="sketch-draw-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .sd { position: absolute; inset: 0; }
        .sd-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .sd-svg { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; }
        .sd-ink { fill: var(--k-accent); stroke: rgba(13, 16, 22, 0.78); stroke-width: 6; stroke-linejoin: round; paint-order: stroke; }
        .sd-rev { fill: none; stroke: #fff; stroke-linecap: butt; }
        .sd-t { position: absolute; top: 380px; display: flex; align-items: center; justify-content: center; width: 400px; height: 320px; font-size: 80px; font-weight: 700; white-space: nowrap; text-shadow: 0 2px 10px rgba(13, 16, 22, 0.6); }
        .sd-t1 { left: 160px; }
        .sd-t2 { left: 760px; }
        .sd-t3 { left: 1360px; }
      </style>

      <div id="root" data-composition-id="sketch-draw" data-width="1920" data-height="1080">
        <div class="sd">
          <div class="sd-bg"></div>
          <svg class="sd-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
          <div class="sd-t sd-t1">素材</div>
          <div class="sd-t sd-t2">模型</div>
          <div class="sd-t sd-t3">成片</div>
        </div>
      </div>

      <script>
        (function () {
          // box / ring / shaft / barb: how long each kind of stroke takes · beat: pen-up pause between strokes
          // word: a label fades up once its shape is this far drawn (0–1) · lap / gap: how the ring's end passes its start
          var CFG = { at: 0.3, box: 0.55, ring: 0.5, shaft: 0.22, barb: 0.07, beat: 0.045, rest: 0.09, word: 0.45, wordDur: 0.26, lap: 0.32, gap: 34, air: 30 };
          var v = { items: "素材|模型|成片", x: 160, y: 380, w: 1600, h: 320, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".sd");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".sd-bg").style.display = "none";
          var num = function (a, d) { a = parseFloat(a); return isFinite(a) ? a : d; };
          var NS = "http://www.w3.org/2000/svg", svg = q(".sd-svg"), defs = q("defs"), sn = 0;
          function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var key in attrs) e.setAttribute(key, attrs[key]); parent.appendChild(e); return e; }
          // one pen stroke = a filled ribbon (w0 at landing, w1 mid-stroke, w2 at lift-off) uncovered by a mask stroke along its centre line
          function stroke(d, w0, w1, w2) {
            var id = "sd-m" + sn++;
            var rev = el("path", { d: d, class: "sd-rev" }, el("mask", { id: id, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1920, height: 1080 }, defs));
            var len = rev.getTotalLength(), m = Math.max(10, Math.round(len / 9)), a = [], b = [];
            for (var j = 0; j <= m; j++) {
              var t = j / m, p = rev.getPointAtLength(len * t), p0 = rev.getPointAtLength(Math.max(0, len * t - 1)), p1 = rev.getPointAtLength(Math.min(len, len * t + 1));
              var dx = p1.x - p0.x, dy = p1.y - p0.y, dl = Math.sqrt(dx * dx + dy * dy) || 1, end = t < 0.5 ? w0 : w2;
              var half = (end + (w1 - end) * Math.pow(Math.sin(Math.PI * t), 0.6)) / 2;
              a.push((p.x - (dy / dl) * half).toFixed(1) + " " + (p.y + (dx / dl) * half).toFixed(1));
              b.unshift((p.x + (dy / dl) * half).toFixed(1) + " " + (p.y - (dx / dl) * half).toFixed(1));
            }
            el("path", { d: "M" + a.concat(b).join("L") + "Z", class: "sd-ink", mask: "url(#" + id + ")" }, svg);
            rev.style.strokeWidth = w1 + 10 + "px";
            rev.style.strokeDasharray = len + 2 + "px " + (len + 40) + "px"; // the gap is longer than the path, and the start offset sits inside it: no hairline at the pen-down point
            return { rev: rev, len: len + 8 };
          }
          // a box drawn in one go from near the top-left corner: no two sides parallel, and the last side overshoots the corner
          function boxPath(x0, y0, x1, y1) {
            var r = 28;
            return "M" + (x0 + 34) + " " + (y0 - 3) + "L" + (x1 - r) + " " + (y0 + 4) + "Q" + (x1 + 3) + " " + (y0 + 2) + " " + (x1 + 2) + " " + (y0 + r) +
              "L" + (x1 - 3) + " " + (y1 - r) + "Q" + (x1 - 1) + " " + (y1 + 3) + " " + (x1 - r) + " " + (y1 + 1) +
              "L" + (x0 + r) + " " + (y1 - 3) + "Q" + (x0 - 2) + " " + (y1 - 1) + " " + (x0 - 1) + " " + (y1 - r) + "L" + (x0 + 3) + " " + (y0 - 20);
          }
          // a lumpy ring that spirals in by `gap`, so the end passes inside the start
          function ringPath(cx, cy, R) {
            var pts = [], n = 80, sweep = Math.PI * 2 + CFG.lap;
            for (var i = 0; i <= n; i++) {
              var u = i / n, th = -2.4 + sweep * u, rr = R + CFG.gap / 2 - CFG.gap * u + 5 * Math.sin(th * 3 + 1.1);
              pts.push((cx + rr * Math.cos(th)).toFixed(1) + " " + (cy + rr * 0.97 * Math.sin(th)).toFixed(1));
            }
            return "M" + pts.join("L");
          }

          var X = num(v.x, 160), Y = num(v.y, 380), W = num(v.w, 1600), H = num(v.h, 320), nw = W * 0.25, R = H / 2, cy = Y + H / 2, mx = X + W / 2;
          var names = String(v.items || "").split("|"), labels = [q(".sd-t1"), q(".sd-t2"), q(".sd-t3")], lefts = [X, mx - nw / 2, X + W - nw];
          labels.forEach(function (n, i) {
            n.textContent = (names[i] || "").trim();
            n.style.left = lefts[i] + "px";
            n.style.top = Y + "px";
            n.style.width = nw + "px";
            n.style.height = H + "px";
          });

          var tl = gsap.timeline({ paused: true }), t = CFG.at;
          function draw(d, dur, w0, w1, w2, pause) {
            var s = stroke(d, w0, w1, w2);
            tl.fromTo(s.rev, { strokeDashoffset: s.len }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, t);
            t += dur + pause;
          }
          function word(n, dur) {
            tl.fromTo(n, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: CFG.wordDur, ease: "power2.out" }, t + dur * CFG.word);
          }
          function arrow(xa, xb) {
            draw("M" + xa + " " + (cy + 4) + "Q" + (xa + xb) / 2 + " " + (cy - 14) + " " + xb + " " + cy, CFG.shaft, 8, 16, 12, CFG.beat);
            draw("M" + xb + " " + cy + "L" + (xb - 46) + " " + (cy - 36), CFG.barb, 12, 16, 8, CFG.beat);
            draw("M" + xb + " " + cy + "L" + (xb - 40) + " " + (cy + 38), CFG.barb, 12, 16, 8, CFG.rest);
          }
          // order of drawing = order of reading: shape, its word, the arrow out of it, the next shape
          word(labels[0], CFG.box);
          draw(boxPath(X, Y, X + nw, Y + H), CFG.box, 8, 18, 7, CFG.rest);
          arrow(X + nw + CFG.air, mx - R - CFG.air);
          word(labels[1], CFG.ring);
          draw(ringPath(mx, cy, R), CFG.ring, 8, 18, 7, CFG.rest);
          arrow(mx + R + CFG.air, X + W - nw - CFG.air);
          word(labels[2], CFG.box);
          draw(boxPath(X + W - nw, Y, X + W, Y + H), CFG.box, 8, 18, 7, 0);
          window.__timelines["sketch-draw"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

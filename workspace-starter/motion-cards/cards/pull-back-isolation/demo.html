    e.innerHTML = panel(s[2] - 2, s[3] - 2, i + 3);
    world.insertBefore(e, hero);
    return { el: e, d: Math.sqrt(s[0] * s[0] + s[1] * s[1]) };
  });
  sibs.slice().sort(function (a, b) { return a.d - b.d; }).forEach(function (s, r) { s.at = CFG.fade + r * CFG.gap; });

  var R = MT.ramp, O = MT.EASE.out;
  var render = function (t) {
    world.style.transform = "scale(" + (L.s[0] + (L.s[1] - L.s[0]) * R(t, 0, CFG.pull, "power2.out")).toFixed(4) + ")";
    var bg = R(t, CFG.sink[0], CFG.sink[1], "power1.inOut"), gl = R(t, CFG.glow[0], CFG.glow[1], "power1.inOut");
    q(".pb-dark").style.opacity = bg.toFixed(3);
    // a sibling goes out: opacity first (ease-out), darkening later (k squared), so it never parks as a grey slab
    sibs.forEach(function (s) {
      var k = MT.clamp((t - s.at) / CFG.fadeDur), st = s.el.style;
      st.opacity = (1 - O(k)).toFixed(3);
      st.filter = k > 0.001 ? "brightness(" + (1 - 0.7 * k * k).toFixed(3) + ") blur(" + (k * 5).toFixed(2) + "px)" : "";
      st.transform = "scale(" + (1 - 0.03 * k).toFixed(4) + ")";
    });
    hero.style.boxShadow = "inset 0 1px 0 color-mix(in srgb, white " + (90 + 10 * gl).toFixed(1) + "%, transparent), " + kShadow(18, 1 - 0.6 * gl) +
      ", 0 0 70px color-mix(in srgb, var(--pb-glow) " + (32 * gl).toFixed(1) + "%, transparent), 0 0 180px color-mix(in srgb, var(--pb-glow2) " + (20 * gl).toFixed(1) + "%, transparent)";
    var g = q(".pb-grain").style;
    grain(t);
    g.opacity = (0.05 + 0.04 * bg).toFixed(3);
    g.mixBlendMode = bg > 0.5 ? "soft-light" : "overlay";
  };
  var tl = MT.scene(CFG.dur, render);
  window.__timelines["pull-back-isolation"] = tl;
})();

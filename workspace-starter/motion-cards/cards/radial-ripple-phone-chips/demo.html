var LAND = { tw: 360 };
var PORT = { tw: 290 };
var v = { left: "自动整理", right: "一键导出", screen: "", dur: 5.6, backdrop: "on" };
try {
  var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
} catch (e) {}

var root = document.querySelector(".rr");
var q = function (s) { return root.querySelector(s); };
var FW = root.clientWidth, FH = root.clientHeight;
if (!FW || !FH) {
  // not laid out yet: the host clip's declared size, then the window
  var hc = root.closest("[data-width][data-height]");
  FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
  FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
}
var P = FH > FW, L = P ? PORT : LAND;
root.setAttribute("data-orient", P ? "portrait" : "landscape");

// ==== kit:tone@1 ====
function kRGB(el, color) {
  var p = document.createElement("i");
  p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
  el.appendChild(p);
  var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
  el.removeChild(p);
  return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
}
function kTone(wrap) {
  var c = kRGB(wrap, "var(--k-bg)");
  var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
  wrap.setAttribute("data-tone", tone);
  return tone;
}
// ==== end kit:tone ====

// ==== kit:grain@1 ====
function kGrain(layer, o) {
  o = o || {};
  var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
  var dark = tones && tones.getAttribute("data-tone") === "dark";
  var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
    var f = "type='linear' slope='2.4' intercept='-0.7'";
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
      "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
      "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
      "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
      "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
    return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
  });
  layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
  layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
  layer.style.backgroundSize = size + "px " + size + "px";
  return function (t) {
    var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    layer.style.backgroundImage = tiles[k % 6];
    layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
  };
}
// ==== end kit:grain ====

// ==== kit:text@2 (kWords, kSplit) ====
var kCJK = /[⺀-鿿豈-﫿＀-￯]/;
function kWords(s, key) {
  s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
  var bar = s.indexOf("|") >= 0, out = [], k = key && !bar ? s.indexOf(key) : -1;
  var cut = function (x) {
    if (/ /.test(s) || !kCJK.test(s) || typeof Intl.Segmenter !== "function") return x.split(/( )/);
    return Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(x), function (g) { return g.segment; });
  };
  var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);
  var pre = "";
  bits.forEach(function (x) {
    var t = x.trim(), last = out[out.length - 1];
    if (last && /^ /.test(x)) last.sp = true;
    if (!t) return;
    if (!/[\p{L}\p{N}]/u.test(t)) {
      if (!last || last.sp || /^[\p{Ps}\p{Pi}]+$/u.test(t)) pre += t;
      else { last.t += t; last.sp = / $/.test(x); }
      return;
    }
    out.push({ t: pre + t, sp: / $/.test(x) });
    pre = "";
  });
  if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
  if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
  if (out.length) out[out.length - 1].sp = false;
  return out;
}
function kSplit(el, by, rise, text) {
  var s = text != null ? String(text) : el.textContent, units = [];
  var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
  el.textContent = "";
  parts.forEach(function (p) {
    var u = document.createElement("span"), box = u;
    u.className = "rr-u"; u.textContent = p.t;
    if (by === "line") u.style.display = "block";
    if (!p.t.trim()) { el.appendChild(u); return; }
    if (rise) { box = document.createElement("span"); box.className = "rr-cut"; box.style.display = u.style.display; box.appendChild(u); }
    el.appendChild(box);
    if (p.sp) el.appendChild(document.createTextNode(" "));
    units.push(u);
  });
  return units;
}
// ==== end kit:text ====

// ==== kit:fit@1 (kFit, kLines) ====
function kFit(el, o) {
  o = o || {};
  var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
  var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
  for (;;) {
    el.style.fontSize = f + "px";
    m = kLines(el);
    if ((m.w <= W && m.n <= n) || f <= min) break;
    f = Math.max(min, f - 2);
  }
  if (m.w > W) {
    [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
    m = kLines(el);
  }
  return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
}
function kLines(el) {
  var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
  var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
  while ((t = it.nextNode())) {
    if (!t.data.trim()) continue;
    r.selectNodeContents(t);
    [].forEach.call(r.getClientRects(), function (b) {
      var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
      if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
      row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
    });
  }
  return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
}
// ==== end kit:fit ====

kTone(root);
if (String(v.backdrop) === "off") q(".rr-st").style.display = "none";
var grain = kGrain(q(".rr-grain"));
var dur = Math.min(12, Math.max(5, Number(v.dur) || 5.6));

// chips: an empty label hides its chip; text goes through kSplit + kFit (40px floor, then it wraps)
var chips = [[".rr-cl", v.left, CFG.c1, 0, -1], [".rr-cr", v.right, CFG.c2, CFG.ph2, 1]].map(function (c) {
  var el = q(c[0]), tx = el.querySelector(".rr-tx");
  if (!String(c[1] == null ? "" : c[1]).trim()) { el.style.display = "none"; return null; }
  kSplit(tx, "word", false, c[1]);
  kFit(tx, { lines: 1, min: 40, width: L.tw });
  return { el: el, bg: el.querySelector(".rr-cb"), fg: [el.querySelector(".rr-ic"), tx], t0: c[2], ph: c[3], side: c[4] };
}).filter(Boolean);

// screen: an optional screenshot replaces the drawn feed and its app chrome; it fills the screen at least and
// scrolls by at most CFG.scroll, never past its own bottom
var feed = q(".rr-feed"), sc = q(".rr-sc"), shot = null;
if (String(v.screen || "").trim()) {
  feed.innerHTML = "";
  feed.style.padding = "0";
  shot = document.createElement("img");
  shot.className = "rr-shot";
  shot.setAttribute("src", String(v.screen).trim());
  shot.setAttribute("alt", "");
  feed.appendChild(shot);
  [".rr-top", ".rr-bot", ".rr-mp"].forEach(function (s) { q(s).style.display = "none"; });
}
var travel = function () { return shot ? MT.clamp(shot.offsetHeight - sc.clientHeight, 0, CFG.scroll) : CFG.scroll; };

var rings = [].slice.call(root.querySelectorAll(".rr-ring"));
var ph = q(".rr-ph"), sh = q(".rr-sh"), pb = q(".rr-pb"), wv = q(".rr-wv");
var bars = [];
wv.style.background = "none";
for (var b = 0; b < 22; b++) bars.push(wv.appendChild(document.createElement("i")));
var tint = function (a) { return "color-mix(in srgb, var(--rr-shade) calc(" + a + "% * var(--rr-sk)), transparent)"; };

var tl = MT.scene(dur, function (t) {
  var f = t * 30; // frames at 30 fps, for the waveform's per-frame constants
  // rings breathe out of phase: neighbours 1.7 rad apart read as a ripple, not one zoom
  rings.forEach(function (r, i) { r.style.transform = "scale(" + (1 + CFG.amp * Math.sin(t * CFG.ringW + i * CFG.step)).toFixed(5) + ")"; });
  // phone rises 90px into place; the far shadow tightens as it lands
  var u = 1 - MT.ramp(t, 0, CFG.rise, "snappy");
  ph.style.transform = "translateY(" + (u * CFG.lift).toFixed(2) + "px)";
  ph.style.opacity = Math.min(1, (1 - u) * 2.2);
  sh.style.boxShadow = "0 4px 10px " + tint(20) + ", 0 " + (40 + u * 30).toFixed(1) + "px " + (80 + u * 40).toFixed(1) + "px -20px " + tint(42) + ", 0 90px 140px -40px " + tint(25);
  // feed scrolls at constant speed (no ease: autoplay, not a swipe)
  var sp = MT.clamp((t - CFG.s0) / (dur - CFG.s1 - CFG.s0), 0, 1);
  feed.style.transform = "translateY(" + (-sp * travel()).toFixed(2) + "px)";
  // chips: spring pop 0.8 -> 1 with one overshoot, slide 28px out from the phone, then the float eases in
  chips.forEach(function (c) {
    var s = MT.spring({ t: t, delay: c.t0, damping: CFG.damp, stiffness: CFG.stiff });
    var sl = MT.ramp(t, c.t0, CFG.slide, "snappy");
    var fl = Math.sin(t * CFG.flW + c.ph) * CFG.fl * MT.ramp(t, c.t0 + CFG.flLag, CFG.flDur, "smooth");
    var op = MT.clamp((t - c.t0) / CFG.fade, 0, 1);
    c.el.style.transform = "translate(" + (c.side * (1 - sl) * -CFG.out).toFixed(2) + "px, calc(-50% + " + fl.toFixed(2) + "px)) scale(" + (0.8 + 0.2 * s).toFixed(4) + ")";
    c.bg.style.opacity = op;
    c.fg.forEach(function (n) { n.style.opacity = op >= 0.5 ? 1 : 0; });
  });
  // mini player: progress creeps, the waveform jitters deterministically
  var pp = CFG.play + CFG.playW * t;
  pb.style.width = (pp * 100).toFixed(2) + "%";
  bars.forEach(function (el, k) {
    var a = 0.35 + 0.65 * Math.abs(Math.sin(k * 1.37 + f * 0.21) * Math.cos(k * 0.53 - f * 0.09));
    el.style.height = (4 + a * 16).toFixed(1) + "px";
    el.style.background = k / 22 < pp ? "color-mix(in srgb, var(--k-accent), white 35%)" : "rgba(255,255,255,.3)";
  });
  grain(t);
});
window.__timelines["radial-ripple-phone-chips"] = tl;
})();
</script>

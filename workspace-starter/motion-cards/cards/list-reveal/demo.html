                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {
            if (!el.children.length) return [];
            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====

          var dark = kTone(root) === "dark";
          var off = String(v.backdrop) === "off";
          var grain = null;
          if (off) [".lr-bg", ".lr-dust", ".lr-vig", ".lr-grain"].forEach(function (s) { q(s).style.display = "none"; });
          else grain = kGrain(q(".lr-grain"), { opacity: dark ? 0.09 : 0.06 }); // upstream grain 0.09

          // ---- the copy block: eyebrow, title lines (each rises out of its own line), subtitle ----
          var kick = q(".lr-kick"), h1 = q(".lr-h1"), sub = q(".lr-sub"), copy = q(".lr-copy");
          var kt = String(v.kicker).trim(), tt = String(v.title).trim(), st = String(v.sub).trim();
          var titleUnits = [];
          if (kt) { kSplit(kick, "line", false, kt); kFit(kick, { lines: 1, min: 28 }); } else kick.style.display = "none";
          if (tt) { titleUnits = kSplit(h1, "line", true, tt); kFit(h1, { lines: titleUnits.length, min: L.titleMin }); } else h1.style.display = "none";
          if (st) { var su = kSplit(sub, "line", false, st); kFit(sub, { lines: su.length, min: 40 }); } else sub.style.display = "none";
          if (!kt && !tt && !st) { copy.style.display = "none"; q(".lr-col").setAttribute("data-solo", ""); }
          if (!tt && !kt) sub.style.marginTop = "0";

          // ---- the list: rebuilt from the variables (the static HTML shows the defaults) ----
          var ICONS = [
            '<path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19Z"/><path d="M9.5 20.5v-6h5v6"/>',
            '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/>',
            '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M10.2 9.2v5.6l4.6-2.8Z"/>',
            '<path d="M4 6.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2V14a2 2 0 0 1-2 2h-7l-4.5 3.5V16H6a2 2 0 0 1-2-2Z"/>',
            '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
            '<path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"/>',
            '<path d="M14 4h3.5A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M10 8l-4 4 4 4M6 12h9"/>'
          ];
          var labels = String(v.items).split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 7);
          if (labels.length < 2) labels = ["首页", "任务", "作品", "消息", "设置", "退出"];
          var n = labels.length, keys = String(v.keys).split("|").map(function (s) { return s.trim(); });
          var act = Math.max(0, Math.min(n - 1, Math.round(+v.active || 1) - 1)), bdAt = Math.round(+v.badgeItem || 4) - 1;
          var bd = String(v.badge).trim(), rowH = n > 6 && L.rowH7 ? L.rowH7 : L.rowH;
          var list = q(".lr-list"), div = q(".lr-div");
          list.innerHTML = "";
          var rows = labels.map(function (t, i) {
            var el = document.createElement("div"), last = i === n - 1;
            el.className = "lr-item" + (i === act ? " lr-on" : "") + (last ? " lr-last" : "");
            el.style.height = rowH + "px";
            el.innerHTML = (i === act ? '<span class="lr-sheen"></span>' : "") + '<span class="lr-ic"><svg viewBox="0 0 24 24">' + ICONS[last ? 6 : i] + '</svg></span><span class="lr-lb"></span>' +
              (i === bdAt && bd ? '<span class="lr-bd"></span>' : keys[i] ? '<span class="lr-ky"></span>' : "");
            list.appendChild(el);
            el.querySelector(".lr-lb").textContent = t;
            var kyEl = el.querySelector(".lr-ky"), bdEl = el.querySelector(".lr-bd");
            if (kyEl) kyEl.textContent = keys[i];
            if (bdEl) bdEl.textContent = bd;
            return { el: el, ic: el.querySelector(".lr-ic"), lb: el.querySelector(".lr-lb"), ky: kyEl || bdEl, pill: !!bdEl, sheen: el.querySelector(".lr-sheen"), t0: CFG.start + i * CFG.each };
          });
          list.appendChild(div);
          // a label that still needs two lines at 40px is cut with an ellipsis instead (two lines do not fit the row)
          rows.forEach(function (r) {
            var lb = r.el.querySelector(".lr-lb");
            if (kFit(lb, { lines: 1, min: 40 }).lines > 1) lb.style.cssText += ";white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
          });
          // the divider sits in the middle of the extra gap above the last row
          div.style.top = (n - 1) * (rowH + L.gap) + L.extra - (L.gap + L.extra) / 2 + "px";
          if (n < 3) div.style.display = "none";

          // ---- dust: 22 soft motes (upstream hash), drifting slowly across and up ----
          var dustBox = q(".lr-dust"), dots = [];
          for (var d = 0; d < 22; d++) {
            var z = kHash(7 * 31 + d * 7.1), mote = document.createElement("i"), sz = (2 + z * z * 16) * S;
            mote.style.width = mote.style.height = sz.toFixed(1) + "px";
            if (z > 0.7) mote.style.filter = "blur(" + ((z - 0.7) * 10).toFixed(1) + "px)";
            dustBox.appendChild(mote);
            dots.push({ el: mote, z: z, x0: kHash(7 * 13 + d * 3.7), y0: kHash(7 * 17 + d * 5.3), i: d });
          }

          var softBack = MT.bezier(0.3, 1.18, 0.5, 1); // upstream soft overshoot, about 1.5%
          var light = q(".lr-light");
          function render(t) {
            var f = t * 30; // frames at 30 fps, for the upstream periods below
            // layer 2: the whole list drifts at constant speed, unrelated to the per-row curves
            list.style.transform = "translateY(" + ((CFG.drift / 2 - (CFG.drift * t) / CFG.driftEnd) * S).toFixed(3) + "px)";
            rows.forEach(function (r) {
              var lin = MT.ramp(t, r.t0, CFG.win, "linear"), p = softBack(lin);
              var pi = softBack(MT.ramp(t, r.t0 + CFG.iconLag, CFG.win, "linear")), pk = MT.ramp(t, r.t0 + CFG.keyLag, CFG.keyDur, "out");
              var bl = (1 - MT.EASE.out(lin)) * CFG.blur * S;
                  var on = !!r.sheen, ok = lin >= 0.2;

              r.el.style.filter = bl > 0.3 ? "blur(" + bl.toFixed(2) + "px)" : "none";
              r.el.style.transform = "translateY(" + ((1 - p) * CFG.rise * S).toFixed(2) + "px) scale(" + (CFG.from + (1 - CFG.from) * p).toFixed(4) + ")";
              r.ic.style.opacity = Math.min(1, Math.max(0, pi) * 2).toFixed(3);
              r.ic.style.transform = "scale(" + (0.72 + 0.28 * pi).toFixed(4) + ")";
              if (r.ky) {
                var pop = r.pill ? (lin * 2.2 >= 1 && pk > 0 ? 1 : 0) : on && !ok ? 0 : pk;
                r.ky.style.opacity = pop.toFixed(3);
                r.ky.style.transform = "translateX(" + ((1 - pk) * 14 * S).toFixed(2) + "px)" + (r.pill ? " scale(" + (0.6 + 0.4 * pk).toFixed(4) + ")" : "");
              }
              if (r.sheen) {
                var sp = MT.ramp(t, r.t0 + CFG.sheenAt, CFG.sheenDur, "swift");

                r.sheen.style.setProperty("--sp", (-30 + 160 * sp).toFixed(2) + "%");
              }
            });
            div.style.transform = "scaleX(" + MT.ramp(t, rows[n - 1].t0, CFG.win, "snappy").toFixed(4) + ")";
            if (light) light.style.opacity = ((1 + 0.06 * Math.sin(f / 38)) / 1.06).toFixed(4);
            if (grain) grain(t);
            dots.forEach(function (m) {
              var W = FW + 200, Hh = FH + 100, tw = 0.5 + 0.5 * Math.sin(f / (14 + m.z * 20) + m.i);
              m.el.style.left = ((((m.x0 * W + f * 0.12 * (0.4 + m.z)) % W) + W) % W - 100).toFixed(1) + "px";
              m.el.style.top = ((((m.y0 * FH - f * 0.12 * 0.3 * (0.5 + m.z)) % Hh) + Hh) % Hh - 50).toFixed(1) + "px";
              m.el.style.opacity = ((0.25 + 0.75 * tw) * (0.3 + m.z * 0.7)).toFixed(3);
            });
          }

          var tl = MT.timeline({ duration: CFG.dur });
          tl.each(render);
          if (kt) tl.fromTo(kick, { opacity: 0 }, { opacity: 1, duration: CFG.kickDur, ease: "out" }, CFG.kick);
          if (titleUnits.length) kReveal(tl, titleUnits, "rise", CFG.title, { each: CFG.titleEach, gap: CFG.titleGap });
          if (st) {
            tl.fromTo(sub, { opacity: 0 }, { opacity: 1, duration: CFG.subDur, ease: "out" }, CFG.sub);
            tl.fromTo(sub, { y: CFG.subRise * S }, { y: 0, duration: CFG.subDur, ease: "snappy" }, CFG.sub);
          }
          window.__timelines["list-reveal"] = tl;
        })();
      </script>
    </template>

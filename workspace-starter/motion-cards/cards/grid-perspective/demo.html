<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"标题放在地平线上方"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.2,"max":3,"step":0.1},
    {"id":"strength","type":"number","label":"网格和地平线光的浓度（0–1）","default":0.7,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>grid-perspective · 透视网格</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="grid-perspective-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .gp { position: absolute; inset: 0; overflow: hidden; }
        .gp-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .gp-fx { position: absolute; inset: 0; opacity: 0.7; }
        .gp-hold { position: absolute; left: 0; right: 0; top: 0; height: 62%; display: flex; align-items: center; justify-content: center; padding: 0 160px; }
        .gp-title { display: block; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 0.02em; text-align: center; }
        .gp-floor { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; overflow: hidden; perspective: 640px; perspective-origin: 50% 0%; }
        .gp-plane { position: absolute; left: -1600px; right: -1600px; top: 0; height: 1500px; overflow: hidden; transform-origin: 50% 0%; transform: rotateX(68deg); }
        .gp-grid { position: absolute; left: 0; right: 0; top: -600px; bottom: 0; background-image: linear-gradient(color-mix(in srgb, var(--k-accent-2) 70%, transparent) 0 2px, transparent 2px), linear-gradient(90deg, color-mix(in srgb, var(--k-accent-2) 70%, transparent) 0 2px, transparent 2px); background-size: 100px 100px; background-position: 50px 0; }
        .gp-fade { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; background: linear-gradient(to bottom, var(--k-bg) 0%, color-mix(in srgb, var(--k-bg) 55%, transparent) 30%, transparent 80%); }
        .gp-glow { position: absolute; left: 8%; right: 8%; top: calc(62% - 110px); height: 220px; background: radial-gradient(closest-side, color-mix(in srgb, var(--k-accent) 34%, transparent), color-mix(in srgb, var(--k-accent) 10%, transparent) 50%, transparent); }
        .gp-hz { position: absolute; left: 0; right: 0; top: calc(62% - 1px); height: 3px; background: linear-gradient(90deg, transparent 4%, color-mix(in srgb, var(--k-accent) 75%, transparent) 50%, transparent 96%); }
      </style>

      <div id="root" data-composition-id="grid-perspective" data-width="1920" data-height="1080">
        <div class="gp" data-layout-allow-overflow>
          <div class="gp-bg"></div>
          <div class="gp-fx">
            <div class="gp-floor"><div class="gp-plane"><div class="gp-grid"></div></div></div>
            <div class="gp-fade"></div>
            <div class="gp-glow"></div>
            <div class="gp-hz"></div>
          </div>
          <div class="gp-hold"><span class="gp-title">标题放在地平线上方</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { dur: 6, cell: 100, cells: 3, glowLow: 0.6 };
          var v = { title: "标题放在地平线上方", speed: 1, strength: 0.7 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".gp");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var ttl = q(".gp-title");
          ttl.textContent = String(v.title || "");
          if (!v.title) q(".gp-hold").style.display = "none";
          var sp = Math.min(3, Math.max(0.2, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          if (isNaN(st)) st = 0.7;
          var fx = q(".gp-fx");
          fx.style.opacity = String(Math.min(1, Math.max(0, st)));
          var D = CFG.dur;

          var tl = gsap.timeline({ paused: true });
          // the floor slides toward the viewer by a whole number of cells, so the last frame matches the first
          var cells = Math.max(1, Math.min(6, Math.round(CFG.cells * sp)));
          tl.fromTo(q(".gp-grid"), { y: 0 }, { y: CFG.cell * cells, duration: D, ease: "none" }, 0);
          // the horizon glow only breathes, it never flashes
          tl.fromTo(q(".gp-glow"), { opacity: CFG.glowLow }, { opacity: 1, duration: D / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
          window.__timelines["grid-perspective"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

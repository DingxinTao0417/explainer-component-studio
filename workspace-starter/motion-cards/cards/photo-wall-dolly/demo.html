<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"srcs","type":"string","label":"墙上的图，用 | 分隔；第一张是镜头最后停住的那张，其余循环铺满","default":"motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p8.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p5.jpg"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>photo-wall-dolly · 照片墙推轨</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="photo-wall-dolly-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .pw { position: absolute; inset: 0; }
        .pw-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .pw-stage { position: absolute; inset: 0; perspective: 1800px; }
        .pw-cam { position: absolute; inset: 0; }
        .pw-layer { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
        .pw-ph { position: absolute; overflow: hidden; box-sizing: border-box; }
        .pw-mid .pw-ph { border: 10px solid #fff; border-radius: 6px; background: #fff; box-shadow: 0 22px 50px rgba(0, 0, 0, 0.5); }
        .pw-far .pw-ph { border-radius: 6px; }
        .pw-near .pw-ph { border-radius: 10px; filter: blur(9px); }
        .pw-img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .pw-dim { position: absolute; inset: 0; background: #05070b; opacity: 0; }
        .pw-ring { position: absolute; inset: -10px; box-sizing: border-box; border: 10px solid var(--k-accent); border-radius: 6px; opacity: 0; }
      </style>

      <div id="root" data-composition-id="photo-wall-dolly" data-width="1920" data-height="1080">
        <div class="pw">
          <div class="pw-bg"></div>
          <div class="pw-stage">
            <div class="pw-cam">
              <div class="pw-layer pw-far"></div>
              <div class="pw-layer pw-mid"></div>
              <div class="pw-layer pw-near"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            from: { x: -1500, y: -260 },     // camera starts up-left of the target (wall units) and travels on a diagonal
            travel: 2.8,                     // sine.inOut: a dolly on rails has no hard start or stop
            wide: 0.8, close: 1.6,           // zoom while sweeping → zoom when parked on the target
            pushAt: 1.9, pushDur: 1.4,       // the push-in starts before the travel ends, so it never stops twice
            far: 0.55, near: 1.7,            // parallax: how fast the back and front layers slide relative to the wall
            yaw: 7,                          // the wall is seen at an angle while sweeping and squares up as it parks
            dimFar: 0.55, dimRest: 0.55,
          };
          var v = { backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".pw");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".pw-bg").style.display = "none";
          var list = String(v.srcs || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          if (!list.length) list = ["motion-cards/lib/samples/p1.jpg"];
          var mk = function (layer, x, y, w, h, rot, src, dim) {
            var d = document.createElement("div");
            d.className = "pw-ph";
            d.style.left = Math.round(x - w / 2) + "px"; d.style.top = Math.round(y - h / 2) + "px";
            d.style.width = Math.round(w) + "px"; d.style.height = Math.round(h) + "px";
            var im = document.createElement("img"); im.className = "pw-img"; im.alt = ""; im.setAttribute("src", src);
            var dm = document.createElement("div"); dm.className = "pw-dim"; dm.style.opacity = dim;
            d.appendChild(im); d.appendChild(dm);
            layer.appendChild(d);
            if (rot) gsap.set(d, { rotation: rot });
            return d;
          };
          var far = q(".pw-far"), mid = q(".pw-mid"), near = q(".pw-near");
          var i, c, r, k = 0, target = null, rest = [];
          // back layer: smaller, darker, on a tighter grid
          for (c = -4; c <= 2; c++) for (r = -2; r <= 1; r++) {
            k++;
            mk(far, c * 620 + 150 + 60 * Math.sin(k * 1.9), r * 430 + 190 + (c & 1 ? 120 : 0), 400, 250, 0, list[(k * 3) % list.length], CFG.dimFar);
          }
          // the wall itself: uneven sizes, alternate columns dropped by 130px, a degree or two of tilt
          k = 0;
          for (c = -4; c <= 2; c++) for (r = -2; r <= 1; r++) {
            k++;
            if (c === 0 && r === 0) { target = mk(mid, 0, 0, 560, 350, 0, list[0], 0); continue; }
            var s = 0.8 + 0.28 * (0.5 + 0.5 * Math.sin(k * 2.7));
            var ph = mk(mid, c * 760 + 46 * Math.sin(k * 2.3), r * 500 + (c & 1 ? 130 : 0) + 30 * Math.sin(k * 1.3), 560 * s, 350 * s, 2.4 * Math.sin(k * 3.1), list[1 + (k % Math.max(1, list.length - 1))] || list[0], 0);
            rest.push(ph.querySelector(".pw-dim"));
          }
          var ring = document.createElement("div"); ring.className = "pw-ring"; target.style.overflow = "visible"; target.appendChild(ring);
          // two out-of-focus photos close to the lens: they cross the frame fast and are gone before the camera parks
          mk(near, -1530, -430, 760, 475, -4, list[2 % list.length], 0.35);
          mk(near, -2350, 410, 760, 475, 5, list[4 % list.length], 0.35);

          var cam = q(".pw-cam");
          var tl = gsap.timeline({ paused: true });
          tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
          [[far, CFG.far], [mid, 1], [near, CFG.near]].forEach(function (p) {
            tl.fromTo(p[0], { x: -CFG.from.x * p[1], y: -CFG.from.y * p[1] }, { x: 0, y: 0, duration: CFG.travel, ease: "sine.inOut" }, 0.1);
          });
          tl.fromTo(cam, { scale: CFG.wide, rotationY: CFG.yaw }, { scale: CFG.close, rotationY: 0, duration: CFG.pushDur, ease: "power2.inOut" }, CFG.pushAt);
          var lock = CFG.pushAt + CFG.pushDur - 0.25;
          tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, lock);
          tl.fromTo(rest, { opacity: 0 }, { opacity: CFG.dimRest, duration: 0.45, ease: "power1.out" }, lock - 0.15);
          window.__timelines["photo-wall-dolly"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

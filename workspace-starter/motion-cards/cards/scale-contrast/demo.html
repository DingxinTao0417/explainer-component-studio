<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"small","type":"string","label":"铺垫的小字（一行）","default":"结果不好，多半不是模型的问题"},
    {"id":"big","type":"string","label":"压进来的大词（2–4 个字）","default":"没说清"},
    {"id":"hit","type":"number","label":"大词压下来的时间（秒）","default":1.2,"min":0,"max":10,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>scale-contrast · 大小字对比</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="scale-contrast-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .sc { position: absolute; inset: 0; }
        .sc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .sc-stage { position: absolute; left: 110px; right: 110px; top: 84px; bottom: 84px; }
        .sc-small { position: absolute; left: 0; top: 0; display: block; white-space: nowrap; font-size: 48px; font-weight: 700; line-height: 1.3; letter-spacing: 0.02em; }
        .sc-bigwrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .sc-big { display: block; white-space: nowrap; font-size: 560px; font-weight: 900; line-height: 1.1; color: var(--k-accent); }
      </style>

      <div id="root" data-composition-id="scale-contrast" data-width="1920" data-height="1080">
        <div class="sc">
          <div class="sc-bg"></div>
          <div class="sc-stage">
            <div class="sc-bigwrap"><span class="sc-big">没说清</span></div>
            <span class="sc-small">结果不好，多半不是模型的问题</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { smallAt: 0.15, smallIn: 0.4, smallUp: 1.75, push: 0.32, lead: 0.05, dim: 0.6, from: 1.8, slam: 0.2, dent: 0.955, rebound: 0.34, fill: 1680, max: 560 };
          var v = { small: "结果不好，多半不是模型的问题", big: "没说清", hit: 1.2, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".sc");
          var q = function (s) { return root.querySelector(s); };
          var small = q(".sc-small"), big = q(".sc-big");
          small.textContent = String(v.small);
          big.textContent = String(v.big);
          // one full-width glyph is 1em wide, so the size that fills the stage is simply width / count
          var count = Math.max(1, String(v.big).length);
          big.style.fontSize = Math.min(CFG.max, Math.floor(CFG.fill / count)) + "px";
          if (String(v.backdrop) === "off") q(".sc-bg").style.display = "none";
          var hit = Math.max(CFG.smallAt + CFG.smallIn + 0.2, parseFloat(v.hit) || 1.2);

          var tl = gsap.timeline({ paused: true });
          // the small line owns the centre of the frame first
          tl.fromTo(small, { opacity: 0 }, { opacity: 1, duration: CFG.smallIn, ease: "power2.out" }, CFG.smallAt);
          // …then gets shoved to the corner a beat BEFORE the big word lands, as if pushed by the air in front of it
          tl.fromTo(small,
            { left: "50%", top: "50%", xPercent: -50, yPercent: -50, scale: CFG.smallUp },
            { left: "0%", top: "0%", xPercent: 0, yPercent: 0, scale: 1, duration: CFG.push, ease: "power3.out" }, hit - CFG.lead);
          tl.to(small, { opacity: CFG.dim, duration: CFG.push, ease: "none" }, hit - CFG.lead);
          // the big word comes from in front of the lens: accelerating, no easing out, then a dent and rebound
          tl.fromTo(big, { opacity: 0, scale: CFG.from }, { opacity: 1, scale: 1, duration: CFG.slam, ease: "power3.in" }, hit);
          tl.to(big, { scale: CFG.dent, duration: 0.07, ease: "power1.out" }, hit + CFG.slam);
          tl.to(big, { scale: 1, duration: CFG.rebound, ease: "back.out(3)" }, hit + CFG.slam + 0.07);
          window.__timelines["scale-contrast"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"标题压在色光上也读得清"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.2,"max":3,"step":0.1},
    {"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.6,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>mesh-flow · 流动色光</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="mesh-flow-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .mf { position: absolute; inset: 0; overflow: hidden; }
        .mf-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .mf-fx { position: absolute; inset: 0; opacity: 0.6; }
        .mf-hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 160px; }
        .mf-title { display: block; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 0.02em; text-align: center; }
        .mf-b { position: absolute; border-radius: 50%; }
        .mf-b1 { left: -360px; top: -420px; width: 1400px; height: 1400px; background: radial-gradient(closest-side, color-mix(in srgb, var(--k-accent-2) 62%, transparent), color-mix(in srgb, var(--k-accent-2) 22%, transparent) 55%, transparent); }
        .mf-b2 { left: 980px; top: 260px; width: 1240px; height: 1240px; background: radial-gradient(closest-side, color-mix(in srgb, var(--k-accent) 40%, transparent), color-mix(in srgb, var(--k-accent) 14%, transparent) 55%, transparent); }
        .mf-b3 { left: 60px; top: 420px; width: 1100px; height: 1100px; background: radial-gradient(closest-side, color-mix(in srgb, var(--k-accent-2) 46%, transparent), color-mix(in srgb, var(--k-accent-2) 16%, transparent) 55%, transparent); }
        .mf-b4 { left: 1080px; top: -460px; width: 980px; height: 980px; background: radial-gradient(closest-side, color-mix(in srgb, var(--k-accent) 34%, transparent), color-mix(in srgb, var(--k-accent) 12%, transparent) 55%, transparent); }
      </style>

      <div id="root" data-composition-id="mesh-flow" data-width="1920" data-height="1080">
        <div class="mf" data-layout-allow-overflow>
          <div class="mf-bg"></div>
          <div class="mf-fx">
            <div class="mf-b mf-b1"></div>
            <div class="mf-b mf-b2"></div>
            <div class="mf-b mf-b3"></div>
            <div class="mf-b mf-b4"></div>
          </div>
          <div class="mf-hold"><span class="mf-title">标题压在色光上也读得清</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { dur: 6, breathe: 0.16, moves: [[340, 150], [-300, -130], [260, -160], [-240, 120]] };
          var v = { title: "标题压在色光上也读得清", speed: 1, strength: 0.6 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".mf");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var ttl = q(".mf-title");
          ttl.textContent = String(v.title || "");
          if (!v.title) q(".mf-hold").style.display = "none";
          var sp = Math.min(3, Math.max(0.2, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          if (isNaN(st)) st = 0.6;
          var fx = q(".mf-fx");
          fx.style.opacity = String(Math.min(1, Math.max(0, st)));
          var D = CFG.dur;

          var tl = gsap.timeline({ paused: true });
          // each glow crosses its own short path once; the vertical part goes out and back so the path bends
          all(".mf-b").forEach(function (b, i) {
            var m = CFG.moves[i], dx = m[0] * sp, dy = m[1] * sp, grow = 1 + CFG.breathe * (i % 2 ? -1 : 1);
            tl.fromTo(b, { x: -dx / 2, scale: 1 }, { x: dx / 2, scale: grow, duration: D, ease: "sine.inOut" }, 0);
            tl.fromTo(b, { y: -dy / 2 }, { y: dy / 2, duration: D / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
          });
          window.__timelines["mesh-flow"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

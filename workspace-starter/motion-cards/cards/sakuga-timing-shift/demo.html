}
function kLines(el) {
  var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
  var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
  while ((t = it.nextNode())) {
    if (!t.data.trim()) continue;
    r.selectNodeContents(t);
    [].forEach.call(r.getClientRects(), function (b) {
      var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
      if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
      row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
    });
  }
  return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
}
// ==== end kit:fit ====

// ==== kit:grain@1 ====
function kGrain(layer, o) {
  o = o || {};
  var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
  var dark = tones && tones.getAttribute("data-tone") === "dark";
  var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
    var f = "type='linear' slope='2.4' intercept='-0.7'";
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
      "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
      "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
      "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
      "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
    return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
  });
  layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
  layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
  layer.style.backgroundSize = size + "px " + size + "px";
  return function (t) {
    var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    layer.style.backgroundImage = tiles[k % 6];
    layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
  };
}
// ==== end kit:grain ====

var tone = kTone(root);
if (getComputedStyle(root).getPropertyValue("--mc-font").trim()) root.style.setProperty("--sg-hv", "var(--k-font)"); // host font wins over the bold face
// backdrop off: only the effect stays (label, card, speed and focus lines); paper, slot, slate and sheet go
if (String(v.backdrop) === "off") ["paper", "slot", "slate", "sheet"].forEach(function (n) { q(".sg-" + n).style.display = "none"; });
var grain = kGrain(q(".sg-grain"), tone === "dark" ? {} : { opacity: 0.06 });

// text slots: units through kSplit / kWords, then fitted to the measured layout; empty optional slots disappear
var slot = function (el, text, o) {
  var s = String(text).trim();
  if (!s) { el.style.display = "none"; return; }
  kSplit(el, "word", false, s);
  kFit(el, o);
};
root.removeAttribute("data-ones");
slot(q(".sg-big.b"), v.before, { min: 72, width: L.lab });
slot(q(".sg-note.b"), v.note1, { width: L.note });
root.setAttribute("data-ones", "");
slot(q(".sg-big.a"), v.after, { min: 72, width: L.lab });
slot(q(".sg-note.a"), v.note2, { width: L.note });
if (String(v.name).trim()) slot(q(".sg-name"), v.name, { lines: 1 }); else q(".sg-hd").style.display = "none";
slot(q(".sg-sub"), v.sub, { lines: 2 });
var te = q(".sg-title"), key = String(v.key).trim();
te.textContent = "";
kWords(v.title, key).forEach(function (u) {
  var s = te.appendChild(document.createElement("span"));
  s.className = "sg-u" + (key && u.t === key ? " sg-key" : "");
  s.textContent = u.t;
  if (u.sp) te.appendChild(document.createTextNode(" "));
});
if (!kCJK.test(v.title)) te.style.letterSpacing = "-0.04em"; // all-Latin numbers may run tight; Chinese never does
kFit(te, { min: 72 });

var rig = q(".sg-rig"), sh = q(".sg-sh"), lab = q(".sg-lab"), pop = q(".sg-pop"), ul = q(".sg-ul path");
var slate = q(".sg-slate"), cnt = q(".sg-cnt"), sheet = q(".sg-sheet"), cam = q(".sg-cam");
var cells = [].slice.call(root.querySelectorAll(".sg-cells i")), fl = q(".sg-fl"), sl = q(".sg-sl");
var CW = rig.offsetWidth, CH = rig.offsetHeight, CY = rig.offsetTop, XC = rig.offsetLeft;
var XL = XC - L.reach, XR = XC + L.reach;
q(".sg-slot").style.height = CH + 20 + "px";
[].forEach.call(root.querySelectorAll(".sg-svg"), function (s) { s.setAttribute("viewBox", "0 0 " + FW + " " + FH); });

// frames at 30 fps from here on
var S = CFG.sw * 30, A = CFG.arrive * 30, E = CFG.settle * 30, N = CFG.dur * 30, ST = CFG.step * 30, ND = Math.ceil(S / ST);
var SQ = CFG.squash.map(function (x) { return x * 30; }), PP = CFG.pop.map(function (x) { return x * 30; });
var C = { extrapolateLeft: "clamp", extrapolateRight: "clamp" };
var I = function (f, a, b, e) { C.easing = e; return MT.interpolate(f, a, b, C); };
var h = function (n) { var s = Math.sin(n * 127.3) * 43758.5453; return s - Math.floor(s); };
var r = function (n) { return n.toFixed(1); };
var p2 = function (n) { return (n < 10 ? "0" : "") + n; };
// on ones: a 20-frame dash to 40 px past the slot, then 6 frames back
var pos2 = function (f) { return f < A ? I(f, [S, A], [XR, XC - CFG.over], "power3.out") : I(f, [A, E], [XC - CFG.over, XC], "power2.inOut"); };
var shown = "";

function render(t) {
  var f = t * 30 + 1e-6, F = Math.floor(f), three = f < S, hit = !three && f < S + CFG.hit * 30;
  // on threes everything is read from the held frame qd: position (even steps), pose, hop
  var qd = Math.floor(f / ST) * ST, dw = Math.round(qd / ST), ev = dw % 2 === 0;
  var x = three ? I(qd, [0, (ND - 1) * ST], [XL, XR]) : pos2(f);
  var rot = three ? Math.sin(qd * 0.7) * 5 : I(f, [S, S + 8], [-4, 0], "power2.out");
  var hop = three ? (ev ? -18 : -2) : 0;
  var sf = three ? 0 : Math.min(Math.abs(pos2(f) - pos2(f - 1)) / CFG.speed, 1); // stretch from the speed
  var sx = (1 + 0.3 * sf) * I(f, SQ, [1, 0.92, 1], "power2.out") * (three ? (ev ? 0.97 : 1.035) : 1);
  var sy = (1 - 0.1 * sf) * I(f, SQ, [1, 1.07, 1], "power2.out") * (three ? (ev ? 1.035 : 0.97) : 1);
  var so = three ? (hop < -5 ? 18 : 10) : 10 + 10 * sf;
  rig.style.transform = "translate(" + r(x - XC) + "px," + hop + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")";
  sh.style.transform = "translate(" + r(so) + "px," + r(so + (three ? -hop * 0.6 : 0)) + "px)";
  if (three) root.removeAttribute("data-ones"); else root.setAttribute("data-ones", "");
  if (hit) root.setAttribute("data-hit", ""); else root.removeAttribute("data-hit");

  // label: rises in, boils (a new hand-drawn pose every 4 frames until 108 f), pops at the switch
  var li = MT.ramp(f, 0, CFG.labelIn * 30, "out"), qb = Math.min(Math.floor(f / (CFG.boil * 30)) * CFG.boil * 30, CFG.boilEnd * 30);
  lab.style.opacity = slate.style.opacity = li;
  lab.style.transform = "translateY(" + r(MT.mix(16, 0, li)) + "px)";
  pop.style.transform = "translate(" + r((h(qb + 1) - 0.5) * 5) + "px," + r((h(qb + 2) - 0.5) * 5) + "px) rotate(" + ((h(qb + 3) - 0.5) * 2).toFixed(2) + "deg) scale(" + I(f, PP, [1, 1.25, 1], "power2.out").toFixed(4) + ")";
  var w = function (i, b) { return r(b + (h(qb * 3 + i * 7 + 11) - 0.5) * 8); };
  ul.setAttribute("d", "M4 " + w(0, 12) + "Q90 " + w(1, 8) + " 170 " + w(2, 13) + "T296 " + w(3, 10));
  cnt.textContent = three ? "A" + p2(dw + 1) + " / " + ND : "B" + p2(Math.min(F - S, E - S) + 1) + " / " + (E - S + 1);

  // exposure sheet: on threes a ring every 3rd cell, bars between; on ones a ring in every cell; playhead 1 cell a frame
  var si = MT.ramp(f, CFG.sheetIn[0] * 30, CFG.sheetIn[1] * 30, "out"), hd = Math.min(F, CFG.head * 30) % 30, st = three + "/" + hd;
  sheet.style.opacity = si;
  sheet.style.transform = "translateY(" + r(MT.mix(14, 0, si)) + "px)";
  if (st !== shown) {
    shown = st;
    cells.forEach(function (c, i) { c.className = (three && i % 3 ? "n" : "") + (i === hd ? " h" : ""); });
  }

  // speed lines behind the dashing card, length by speed, a new scatter every frame
  var d = "";
  if (!three && !hit && sf > 0.08) for (var i = 0; i < 9; i++) {
    var yy = CY + 20 + h(i * 7.3 + F * 0.37) * (CH - 40), len = (160 + h(i * 3.1 + F) * 260) * sf;
    var x0 = x + CW * (1 + 0.3 * sf) * 0.8 + h(i * 5.7 + F * 1.3) * 80, th = 3 + h(i * 2.9) * 6;
    d += "M" + r(x0) + " " + r(yy - th / 2) + "L" + r(x0 + len) + " " + r(yy) + "L" + r(x0) + " " + r(yy + th / 2) + "Z";
  }
  sl.setAttribute("d", d);
  // impact frames: 64 focus wedges aimed at the card centre
  d = "";
  if (hit) {
    var cx = x + CW / 2, cy = CY + CH / 2, pt = function (rr, a) { return r(cx + Math.cos(a) * rr) + "," + r(cy + Math.sin(a) * rr); };
    for (var j = 0; j < 64; j++) {
      var a = (j / 64) * Math.PI * 2 + h(j + F) * 0.05, r0 = 300 + h(j * 1.7 + F) * 220, wd = 0.012 + h(j * 4.1) * 0.02;
      d += "M" + pt(r0, a) + "L" + pt(1500, a - wd) + "L" + pt(1500, a + wd) + "Z";
    }
  }
  fl.setAttribute("d", d);
  // hold: a 2% push-in, eased out over the rest of the slot
  cam.style.transform = "scale(" + MT.mix(1, 1 + CFG.push, MT.ramp(f, E, N - E, "out")).toFixed(5) + ")";
  grain(t);
}

var tl = MT.scene(CFG.dur, render);
window.__timelines["sakuga-timing-shift"] = tl;
})();
</script>
</template>

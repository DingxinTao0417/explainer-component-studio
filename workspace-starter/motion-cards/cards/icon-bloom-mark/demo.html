if (String(v.logo).trim()) { mk.innerHTML = img(String(v.logo).trim()); gl = null; }
[].forEach.call(gh, function (g) { g.innerHTML = main.innerHTML; });

var name = String(v.name).replace(/\|/g, "").trim(), units = [];

  return "polygon(" + p(c - 300, -300) + "," + p(c + 428, 428) + "," + p(-1000, 428) + "," + p(-1000, -300) + ")";

  shd.style.transform = "translateX(" + (wob * 2.2 * ip).toFixed(2) + "px) scaleX(" + (on ? sx : mx).toFixed(4) + ")";

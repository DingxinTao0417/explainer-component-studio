<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"光从标题后面慢慢扫过"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.2,"max":3,"step":0.1},
    {"id":"strength","type":"number","label":"光束浓度（0–1）","default":0.7,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>scan-beams · 光束扫</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="scan-beams-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .sb { position: absolute; inset: 0; overflow: hidden; }
        .sb-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .sb-fx { position: absolute; inset: 0; opacity: 0.7; }
        .sb-hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 160px; }
        .sb-title { display: block; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 0.02em; text-align: center; }
        .sb-beam { position: absolute; top: -120px; left: 0; height: 1320px; }
        .sb-m1 { width: 520px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--k-panel) 85%, transparent) 30%, color-mix(in srgb, var(--k-accent) 20%, var(--k-panel)) 50%, color-mix(in srgb, var(--k-panel) 85%, transparent) 70%, transparent); }
        .sb-m2 { width: 860px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--k-panel) 60%, transparent) 35%, color-mix(in srgb, var(--k-accent-2) 22%, var(--k-panel)) 50%, color-mix(in srgb, var(--k-panel) 60%, transparent) 65%, transparent); }
        .sb-m3 { width: 300px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--k-panel) 80%, transparent) 30%, color-mix(in srgb, var(--k-accent-2) 30%, var(--k-panel)) 50%, color-mix(in srgb, var(--k-panel) 80%, transparent) 70%, transparent); }
      </style>

      <div id="root" data-composition-id="scan-beams" data-width="1920" data-height="1080">
        <div class="sb" data-layout-allow-overflow>
          <div class="sb-bg"></div>
          <div class="sb-fx">
            <div class="sb-beam sb-m2"></div>
            <div class="sb-beam sb-m1"></div>
            <div class="sb-beam sb-m3"></div>
          </div>
          <div class="sb-hold"><span class="sb-title">光从标题后面慢慢扫过</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { dur: 6, skew: -22, runs: [[-260, 1500], [520, 1320], [-1000, 1700]] };
          var v = { title: "光从标题后面慢慢扫过", speed: 1, strength: 0.7 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".sb");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var ttl = q(".sb-title");
          ttl.textContent = String(v.title || "");
          if (!v.title) q(".sb-hold").style.display = "none";
          var sp = Math.min(3, Math.max(0.2, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          if (isNaN(st)) st = 0.7;
          var fx = q(".sb-fx");
          fx.style.opacity = String(Math.min(1, Math.max(0, st)));
          var D = CFG.dur;

          var tl = gsap.timeline({ paused: true });
          // every beam keeps one slant and one constant speed; they differ only in width, start point and distance
          [".sb-m1", ".sb-m2", ".sb-m3"].forEach(function (s, i) {
            var r = CFG.runs[i];
            tl.fromTo(q(s), { x: r[0], skewX: CFG.skew }, { x: r[0] + r[1] * sp, skewX: CFG.skew, duration: D, ease: "none" }, 0);
          });
          window.__timelines["scan-beams"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

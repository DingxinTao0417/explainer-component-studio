            var S = s.S, C = s.C, spinEnd = C + 0.2;
            // arc grows, circles by dash offset (no transform: the row may move), shrinks as the mark draws; 0.25 = 12 o'clock
            tl.fromTo(s.arc, { opacity: 0, strokeDasharray: "0 1" }, { opacity: 1, strokeDasharray: arcOn, duration: 0.22, ease: "power2.out" }, S);
            tl.fromTo(s.arc, { strokeDashoffset: 0.25 }, { strokeDashoffset: 0.25 - (spinEnd - S) * CFG.spin, duration: spinEnd - S, ease: "none" }, S);
            tl.fromTo(s.arc, { strokeDasharray: arcOn }, { strokeDasharray: "0 1", duration: 0.18, ease: "power2.in" }, C);
            tl.fromTo(s.arc, { opacity: 1 }, { opacity: 0, duration: 0.04, ease: "none" }, C + 0.16);
            if (!s.bad) {
              draw(s.ok, C + 0.06, CFG.mark);
              pop(s.ico, C, 1.18);
              tl.fromTo(s.lab, { color: "var(--k-muted)" }, { color: "var(--k-ink)", duration: 0.2, ease: "power2.out" }, C);
              tl.fromTo(fill, { scaleX: ok / n }, { scaleX: (ok + 1) / n, duration: 0.4, ease: "power3.out" }, C);
              ok++;
              pop(count, C + 0.08, 1.25);
              if (s.det) tl.fromTo(s.det, { opacity: 1 }, { opacity: 0, duration: CFG.fade, ease: "none" }, C + CFG.keep);
            } else {
              // failure: two-stroke cross, shake, accent text; later steps never start
              draw(s.x1, C + 0.06, 0.16);
              draw(s.x2, C + 0.2, 0.16);
              // shake from +9px; the ease ends at 1 (MT shows the end value after a tween)
              tl.fromTo(s.ico, { x: 9 }, { x: 0, duration: 0.32, immediateRender: false, ease: function (p) { return 1 - Math.cos(p * 3 * Math.PI) * (1 - p); } }, C);
              tl.fromTo(s.lab, { color: "var(--k-muted)" }, { color: "var(--k-accent)", duration: 0.2, ease: "power2.out" }, C);
              if (s.det) tl.fromTo(s.l2 || s.l1.parentNode, { color: "var(--k-muted)" }, { color: "var(--k-accent)", duration: 0.2, ease: "power2.out" }, C);
              tl.fromTo([fill, q(".ar-bfill"), q(".ar-bedge")], { backgroundColor: "var(--k-accent-2)" }, { backgroundColor: "var(--k-accent)", duration: 0.2, ease: "power2.out" }, C);
            }
          });
          // the summary pops (opaque scale) into the room the last fold leaves
          tl.fromTo(pill, { scale: 0 }, { scale: 1, duration: CFG.sumDur, ease: "back.out(1.7)" }, endT + CFG.sumLag);
          tl.each(render);
          render(0);
          window.__timelines["agent-run"] = tl;
        })();
      </script>
        </template>
  </body>

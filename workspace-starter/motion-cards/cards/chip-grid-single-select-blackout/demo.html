          if (off) [".cg-backdrop", ".cg-vig", ".cg-grain"].forEach(function (s) { q(s).style.display = "none"; });
          else grain = kGrain(q(".cg-grain"));
          var txt = function (x) { return String(x == null ? "" : x).trim(); };
          var lin = function (f, a, b) { return MT.clamp((f - a) / (b - a), 0, 1); };
          var oq = function (x) { return 1 - (1 - x) * (1 - x); };
          var rgb = function (c) { return kRGB(root, c); };
          var C = { top: rgb("var(--cg-top)"), bot: rgb("var(--cg-bot)"), itop: rgb("var(--cg-itop)"), ink: rgb("var(--k-ink)"), bg: rgb("var(--k-bg)"), faint: rgb("var(--cg-faint)"), muted: rgb("var(--k-muted)") };
          var mixc = function (a, b, p) { return "rgb(" + a.map(function (x, i) { return Math.round(x + (b[i] - x) * p); }).join(",") + ")"; };
          var cam = q(".cg-cam"), sk = dark ? 2.4 : 1;

          // eyebrow: neutral mark + name + tracked label (each part leaves when its variable is empty)
          var head = q(".cg-head"), kick = q(".cg-kick"), lab = q(".cg-lb");
          var nm = txt(v.name), kt = txt(v.kicker), ne = null;
          kick.innerHTML = "";
          if (nm) {
            var mk = document.createElement("span");
            mk.style.display = "flex";
            mk.innerHTML = kMark(32);
            kick.appendChild(mk);
            ne = document.createElement("span");
            ne.className = "cg-nm"; ne.textContent = nm;
            kick.appendChild(ne);
          }
          if (kt) { lab.textContent = (nm ? "· " : "") + kt; kick.appendChild(lab); }
          if (!nm && !kt) kick.style.display = "none";
          var headW = head.clientWidth || FW * 0.8;
          if (kt) kFit(lab, { lines: 1, min: 28, width: Math.max(160, headW - (ne ? 32 + 14 + ne.offsetWidth + 14 : 0)) });

          // question: units rise out of their own line, one per word
          var qe = q(".cg-q"), qUnits = [];
          if (txt(v.question)) {
            qUnits = kSplit(qe, "word", true, v.question);
            kFit(qe, { lines: P ? 2 : 1, min: 72 });
          } else qe.style.display = "none";

          // chips: built from the options, measured, then placed on rows (3+2 landscape, 2+2+1 portrait); positions stay locked
          var opts = txt(v.options).split("|").map(txt).filter(Boolean).slice(0, 5);
          if (opts.length < 2) opts = ["按年付费", "按月付费"];
          var n = opts.length, pick = MT.clamp(Math.round(+v.pick || 1), 1, n) - 1;
          var per = P ? L.per : (n === 4 ? 2 : Math.min(L.per, n));
          var box = q(".cg-chips"), GAP = 22, rowMax = FW * L.rowMax, maxW = (rowMax - GAP * (per - 1)) / per;
          box.innerHTML = "";
          var chips = opts.map(function (s, i) {
            var c = document.createElement("div");
            c.className = "cg-chip";
            c.style.cssText = "left:0;top:0;transform:none;max-width:" + maxW + "px";
            c.innerHTML = (i === pick ? '<i class="cg-glow" data-layout-allow-overflow></i>' : "") + '<div class="cg-face"><i class="cg-flash"></i><span class="cg-lab"><svg class="cg-tick" viewBox="0 0 18 18"><path d="M3.5 9.5 L7.3 13 L14.5 5"/></svg><span class="cg-txt"></span></span></div>';
            var tx = c.querySelector(".cg-txt");
            tx.textContent = s;
            box.appendChild(c);
            var f = kFit(tx, { lines: 1, min: 40, width: maxW - 144 - (i === pick ? 32 : 0) });
            if (i !== pick) c.querySelector(".cg-face").style.boxShadow = "inset 0 1px 0 var(--cg-hi)," + kShadow(6, 1.1 * sk);
            if (f.lines === 1) tx.style.whiteSpace = "nowrap";
            return { el: c, face: c.querySelector(".cg-face"), flash: c.querySelector(".cg-flash"), tick: c.querySelector(".cg-tick"), glow: c.querySelector(".cg-glow"), w: c.offsetWidth, h: c.offsetHeight };
          });
          var y = L.rowY;
          for (var r = 0; r < n; r += per) {
            var row = chips.slice(r, r + per), rw = GAP * (row.length - 1), rh = 0;
            row.forEach(function (c) { rw += c.w; rh = Math.max(rh, c.h); });
            var x = (FW - rw) / 2;
            row.forEach(function (c) { c.x = x; c.y = y; x += c.w + GAP; });
            y += rh + GAP;
          }
          chips.forEach(function (c) {
            c.el.style.cssText = "left:" + c.x + "px;top:" + c.y + "px;width:" + c.w + "px;height:" + c.h + "px";
          });
          var sel = chips[pick], tgx = sel.x + sel.w * 0.62, tgy = sel.y + sel.h * 0.58;
          var cx0 = sel.x + sel.w / 2, cy0 = sel.y + sel.h / 2;

          // result: old price (struck), new price (chars rise), unit, saving pill
          var res = q(".cg-res"), was = q(".cg-was"), wt = q(".cg-wt"), strike = q(".cg-strike"), nowEl = q(".cg-big"), unitEl = q(".cg-unit"), pill = q(".cg-pill"), pt = q(".cg-pt");
          var wv = txt(v.was), nv = txt(v.now), uv = txt(v.unit), pv = txt(v.note);
          if (wv) { wt.textContent = wv; wt.appendChild(strike); } else was.style.display = "none";
          var nowUnits = [];
          if (nv) {
            nowUnits = kSplit(nowEl, "char", true, nv);
            kFit(nowEl, { lines: 1, min: 72, width: (res.clientWidth || FW * 0.8) - (wv && !P ? was.offsetWidth + 44 : 0) - (uv ? 150 : 0) });
          } else nowEl.style.display = "none";
          if (uv) unitEl.textContent = uv; else unitEl.style.display = "none";
          if (pv) { pt.textContent = pv; kFit(pt, { lines: 1, min: 40, width: (pill.clientWidth || FW * 0.8) - 60 }); } else pill.style.display = "none";

          var rise = function (u, p) {
            u.style.opacity = p > 0 ? 1 : 0;
            u.style.transform = "translateY(calc(" + ((1 - p) * 105).toFixed(2) + "% + " + ((1 - p) * 0.3).toFixed(3) + "em))";
          };

          function render(t) {
            var f = t * 30 + 1e-4; // frames at 30 fps
            if (grain) grain(t);
            // camera: a very slow 1.5% push while the question is read, back to 1 after the collapse
            cam.style.transform = "scale(" + (1 + CFG.push * MT.ramp(t, CFG.pushIn[0], CFG.pushIn[1], "smooth") - CFG.push * MT.ramp(t, S(CFG.collapse), CFG.pushOut, "smooth")).toFixed(4) + ")";
            // head
            var tOut = MT.ramp(t, CFG.titleOut, CFG.titleOutDur, "exit");
            head.style.opacity = 1 - tOut;
            head.style.transform = "translateY(" + (-30 * tOut).toFixed(2) + "px)";
            kick.style.opacity = MT.ramp(t, 0, CFG.kickDur, "out");
            lab.style.letterSpacing = (0.24 + 0.3 * (1 - MT.ramp(t, 0, CFG.trackDur, "snappy"))).toFixed(3) + "em";
            qUnits.forEach(function (u, i) { rise(u, MT.ramp(t, CFG.q + i * CFG.qGap, CFG.qEach, "snappy")); });
            // two-step press: one grey frame, then five linear frames to black, a sin pulse, the rest sink to 18% in place
            var flash = f >= CFG.flash && f < CFG.flash + 1 ? 1 : 0;
            var bk = lin(f, CFG.flash + 1, CFG.flash + 1 + CFG.blackDur);
            var pr = lin(f, CFG.flash + 1, CFG.flash + 1 + CFG.pulseDur);
            var pulse = 1 + (pr > 0 ? Math.sin(pr * Math.PI) * 0.04 : 0);
            var fade = oq(lin(f, CFG.flash + 1, CFG.flash + 1 + CFG.fadeDur));
            var gone = oq(lin(f, CFG.collapse, CFG.collapse + CFG.goneDur));
            var lift = MT.ramp(t, S(CFG.collapse), CFG.liftDur, "smooth");
            chips.forEach(function (c, i) {
              var inP = MT.ramp(t, CFG.chip + i * CFG.chipGap, CFG.chipDur, "snappy"), s = c.el.style;
              s.top = (c.y + (1 - inP) * 30).toFixed(2) + "px";
              if (i !== pick) { s.opacity = (inP * MT.mix(1, 0.18, fade) * (1 - gone)).toFixed(4); s.transform = "none"; return; }
              s.opacity = inP.toFixed(4);
              s.transform = "translate(" + ((FW / 2 - cx0) * lift).toFixed(2) + "px," + ((L.target - cy0) * lift).toFixed(2) + "px) scale(" + (pulse * MT.mix(1, 0.88, lift)).toFixed(4) + ")";
              var fs = c.face.style, elev = 6 + 10 * bk + 26 * lift;
              fs.background = "linear-gradient(180deg," + mixc(C.top, C.itop, bk) + "," + mixc(C.bot, C.ink, bk) + ")";
              fs.borderColor = bk > 0 ? "color-mix(in srgb, var(--k-ink) " + (10 + 90 * bk).toFixed(1) + "%, transparent)" : "var(--cg-line)";
              fs.boxShadow = "inset 0 1px 0 color-mix(in srgb, var(--cg-hi) " + (100 * (1 - 0.85 * bk)).toFixed(1) + "%, transparent)," + kShadow(elev, (1.1 + 0.9 * bk) * sk);
              fs.color = mixc(C.ink, C.bg, bk);
              c.flash.style.opacity = flash;
              c.tick.style.cssText = "opacity:" + bk + ";width:" + (30 * bk).toFixed(2) + "px;margin:0 " + (14 * bk).toFixed(2) + "px 0 " + (-12 * bk).toFixed(2) + "px";
              c.glow.style.setProperty("--ga", (20 * bk * (1 - 0.5 * lift)).toFixed(2) + "%");
            });
            // cursor: arc in from the lower right, presses at the flash frame, leaves
            var cp = MT.ramp(t, CFG.cur, CFG.curDur, "swift");
            var press = f >= CFG.flash - 1 && f < CFG.flash + 6 ? 1 - 0.16 * Math.sin(Math.PI * (f - CFG.flash + 1) / 7) : 1;
            var cs = q(".cg-cur").style;
            cs.left = MT.mix(FW * L.curX, tgx, cp).toFixed(2) + "px";
            cs.top = (MT.mix(FH * L.curY, tgy, cp) - Math.sin(Math.PI * cp) * 60).toFixed(2) + "px";
            cs.transform = "scale(" + press.toFixed(3) + ")";
            cs.opacity = (MT.ramp(t, CFG.showAt, CFG.showDur, "out") * (1 - MT.ramp(t, CFG.hideAt, CFG.hideDur, "out"))).toFixed(4);
            // result
            was.style.opacity = f >= CFG.was ? 1 : 0;
            var oldIn = MT.ramp(t, S(CFG.was), S(14), "snappy"), sw = MT.ramp(t, CFG.strikeAt, CFG.strikeDur, "swift");
            wt.style.transform = "translateY(" + ((1 - oldIn) * 110).toFixed(1) + "%)";
            wt.style.color = mixc(C.muted, C.faint, sw);
            strike.style.width = "calc(" + (sw * 100).toFixed(1) + "% + " + (8 * sw).toFixed(1) + "px)";
            nowUnits.forEach(function (u, i) { rise(u, MT.ramp(t, CFG.now + i * CFG.nowGap, CFG.nowEach, "snappy")); });
            unitEl.style.opacity = MT.ramp(t, CFG.unitAt, CFG.unitDur, "out");
            var sv = MT.ramp(t, CFG.pill, CFG.pillDur, "overshoot");
            pill.style.opacity = Math.min(1, sv * 1.5);
            pt.style.transform = "translateY(" + ((1 - sv) * 16).toFixed(2) + "px) scale(" + (0.8 + 0.2 * sv).toFixed(3) + ")";
          }
          window.__timelines["chip-grid-single-select-blackout"] = MT.scene(CFG.dur, render);
        })();
      </script>
    </template>
  </body>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"信号从中心|扩散到每个节点"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.8,"max":2,"step":0.1},
    {"id":"strength","type":"number","label":"点阵浓度（0–1）","default":1,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>radial-wave · 点阵涟漪</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="radial-wave-template">
      <!-- Ported from video-shotcraft demos/ui-entrance/radial-wave/RadialWave.tsx
           (github.com/Vincentwei1021/video-shotcraft), Apache-2.0, Copyright 2026 Wei Yihao.
           Licence and notice: motion-cards/THIRD_PARTY/video-shotcraft/.
           Changes (2026-10): re-implemented from Remotion/React as a HyperFrames MT sub-composition, normalised time
           t (0..1 over 114 frames) converted to seconds (x 113/30); neutral --k-* palette (accent-2 dots, accent pulse
           on a --k-bg ground instead of #6c8cff / #b9f2ff on #0a0b10); the pulse glow is accent-tinted for white
           grounds; 153 dots drawn at the same cell positions and distance formula, the 480x270 design stage replaced by
           cell-relative sizes; portrait swaps to a 9 x 17 grid (same centre-out distances, same timing);
           optional title panel and speed / strength variables added; the second wave is allowed to finish
           (upstream clips at t=1 with the centre dot still pulsing). Wave timing, 0.5 overshoot, 0.8 pulse
           amplitude, opacity ramp and the 0.3 colour-switch threshold are unchanged. -->
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        /* the wrapper is the size container; orientation-specific static layout lives in @container below */
        .rw { position: absolute; inset: 0; container-type: size; --rw-glow: 62%; }
        .rw[data-tone="dark"] { --rw-glow: 92%; }
        .rw-bg { position: absolute; inset: 0; background: var(--k-bg); }
        /* static fallback = the settled lattice (75% accent-2 dots); the script hides it and draws the 153 live dots */
        .rw-static { position: absolute; inset: 0; background-image: radial-gradient(circle closest-side, color-mix(in srgb, var(--k-accent-2) 75%, transparent) 0 34.5%, transparent 36.5%); background-size: calc(100% / 17) calc(100% / 9); }
        .rw-dots { position: absolute; inset: 0; }
        .rw-dot { position: absolute; display: block; border-radius: 50%; background: var(--k-accent-2); }
        .rw-hold { position: absolute; top: 0; bottom: 0; left: 12%; right: 12%; display: flex; align-items: center; justify-content: center; }
        .rw-panel { display: block; box-sizing: border-box; max-width: 100%; padding: 44px 72px; border-radius: 40px; background: var(--k-bg); text-align: center;
          box-shadow: 0 0 0 2px color-mix(in srgb, var(--k-ink) 12%, transparent), 0 2px 4px color-mix(in srgb, var(--k-ink) 14%, transparent), 0 28px 64px -14px color-mix(in srgb, var(--k-ink) 30%, transparent); }
        .rw-title { display: block; font-size: 96px; font-weight: 800; line-height: 1.25; }
        @container (orientation: portrait) {
          .rw-static { background-size: calc(100% / 9) calc(100% / 17); }
          .rw-hold { top: 12%; bottom: 32%; left: 11%; right: 11%; }
          .rw-panel { padding: 40px 44px; border-radius: 36px; }
          .rw-title { font-size: 100px; }
        }
        /* ==== kit:text@2 ==== */
        .rw-u { display: inline-block; white-space: pre; }
        .rw-cut { display: inline-block; vertical-align: top; clip-path: inset(-0.06em -0.04em -0.22em -0.04em); }
        /* ==== end kit:text ==== */

        /* ==== kit:fit@1 ==== */
        .rw-row { display: block; white-space: nowrap; }
        /* ==== end kit:fit ==== */
      </style>

      <div id="root" data-composition-id="radial-wave">
        <div class="rw">
          <div class="rw-bg"></div>
          <div class="rw-static"></div>
          <div class="rw-dots"></div>
          <div class="rw-hold"><div class="rw-panel"><span class="rw-title">信号从中心扩散到每个节点</span></div></div>
        </div>
      </div>

      <script>
        (function () {
          // timing in seconds (upstream normalised t x 113 / 30), shared by both orientations
          var CFG = { rate: 1.318, reach: 0.678, over: 0.5, p0: 2.335, pk: 0.942, pw: 0.565, amp: 0.8, thr: 0.3,
                      base: 0.25, lit: 0.5, glowOp: 0.25, title: 3.7, titleDur: 0.45, titleFade: 0.15, dur: 5.5 };
          // grid per orientation: same centre-out distances (maxD = hypot(8, 4) either way), so the timing never differs
          var LAND = { cols: 17, rows: 9, titleLines: 1, titleMin: 64, rise: 0.05 };
          var PORT = { cols: 9, rows: 17, titleLines: 2, titleMin: 72, rise: 0.04 };
          var v = { title: "信号从中心|扩散到每个节点", speed: 1, strength: 1 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".rw");
          var q = function (s) { return root.querySelector(s); };
          // orientation = the box the host clip gave this card (the root declares no size, so it fills the clip)
          var FW = root.clientWidth, FH = root.clientHeight;
          if (!FW || !FH) {
            // not laid out yet: the host clip's declared size, then the window
            var hc = root.closest("[data-width][data-height]");
            FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          var P = FH > FW, L = P ? PORT : LAND;
          root.setAttribute("data-orient", P ? "portrait" : "landscape");
          // ==== kit:tone@1 ====
          function kRGB(el, color) {
            var p = document.createElement("i");
            p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
            el.appendChild(p);
            var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
            el.removeChild(p);
            return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
          }
          function kTone(wrap) {
            var c = kRGB(wrap, "var(--k-bg)");
            var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
            wrap.setAttribute("data-tone", tone);
            return tone;
          }
          // ==== end kit:tone ====

          // ==== kit:text@2 ====
          var kCJK = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/;
          function kWords(s, key) {
            s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
            var bar = s.indexOf("|") >= 0, out = [], k = key && !bar ? s.indexOf(key) : -1;
            var cut = function (x) {
              if (/ /.test(s) || !kCJK.test(s) || typeof Intl.Segmenter !== "function") return x.split(/( )/);
              return Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(x), function (g) { return g.segment; });
            };
            var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);
            var pre = "";
            bits.forEach(function (x) {
              var t = x.trim(), last = out[out.length - 1];
              if (last && /^ /.test(x)) last.sp = true;
              if (!t) return;
              if (!/[\p{L}\p{N}]/u.test(t)) {
                if (!last || last.sp || /^[\p{Ps}\p{Pi}]+$/u.test(t)) pre += t;
                else { last.t += t; last.sp = / $/.test(x); }
                return;
              }
              out.push({ t: pre + t, sp: / $/.test(x) });
              pre = "";
            });
            if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
            if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
            if (out.length) out[out.length - 1].sp = false;
            return out;
          }
          function kSplit(el, by, rise, text) {
            var s = text != null ? String(text) : el.textContent, units = [];
            var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
            el.textContent = "";
            parts.forEach(function (p) {
              var u = document.createElement("span"), box = u;
              u.className = "rw-u"; u.textContent = p.t;
              if (by === "line") u.style.display = "block";
              if (!p.t.trim()) { el.appendChild(u); return; }
              if (rise) { box = document.createElement("span"); box.className = "rw-cut"; box.style.display = u.style.display; box.appendChild(u); }
              el.appendChild(box);
              if (p.sp) el.appendChild(document.createTextNode(" "));
              units.push(u);
            });
            return units;
          }
          function kReveal(tl, units, variant, at, o) {
            o = o || {};
            var each = o.each || 0.6, gap = o.gap != null ? o.gap : 0.053, ease = o.ease || "snappy";
            units.forEach(function (u, i) {
              var t0 = at + i * gap, fs = parseFloat(getComputedStyle(u).fontSize) || 40;
              if (variant === "rise") {
                tl.set(u, { opacity: 0 }, 0).set(u, { opacity: 1 }, t0);
                tl.fromTo(u, { y: u.offsetHeight * 1.05 + fs * 0.3 }, { y: 0, duration: each, ease: ease }, t0);
              } else if (variant === "blur") {
                tl.fromTo(u, { opacity: 0, y: fs * 0.25, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: each, ease: ease }, t0);
              } else if (variant === "drop") {
                tl.fromTo(u, { opacity: 0 }, { opacity: 1, duration: each / 3, ease: "none" }, t0);
                tl.fromTo(u, { y: -fs * 0.6 }, { y: 0, duration: each, ease: "overshoot" }, t0);
              } else if (variant === "scale") {
                tl.fromTo(u, { opacity: 0 }, { opacity: 1, duration: each * 0.1, ease: "power1.out" }, t0);
                tl.fromTo(u, { scale: 1.6, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: each, ease: ease }, t0);
              } else {
                tl.fromTo(u, { opacity: 0, marginRight: "0.5em" }, { opacity: 1, marginRight: "0em", duration: each, ease: ease }, t0);
              }
            });
            return tl;
          }
          // ==== end kit:text ====

          // ==== kit:fit@1 ====
          function kFit(el, o) {
            o = o || {};
            var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
            var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
            for (;;) {
              el.style.fontSize = f + "px";
              m = kLines(el);
              if ((m.w <= W && m.n <= n) || f <= min) break;
              f = Math.max(min, f - 2);
            }
            if (m.w > W) {
              [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
              m = kLines(el);
            }
            return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
          }
          function kLines(el) {
            var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
            while ((t = it.nextNode())) {
              if (!t.data.trim()) continue;
              r.selectNodeContents(t);
              [].forEach.call(r.getClientRects(), function (b) {
                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {
            if (!el.children.length) return [];
            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====
          kTone(root);

          var sp = Math.min(2, Math.max(0.8, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          st = isNaN(st) ? 1 : Math.min(1, Math.max(0, st));
          var layer = q(".rw-dots");
          layer.style.opacity = String(st);
          q(".rw-static").style.display = "none";

          // the lattice: dots at cell centres (percent positions), diameter 10/28.235 of a cell (upstream 10 of 28.2 design px)
          var cell = Math.min(FW / L.cols, FH / L.rows), D = Math.round(cell * 0.3542);
          var cx = (L.cols - 1) / 2, cy = (L.rows - 1) / 2, maxD = Math.hypot(cx, cy);
          var glow = "0 0 " + Math.round(D * 1.2) + "px color-mix(in srgb, var(--k-accent) var(--rw-glow), transparent)";
          var dots = [];
          for (var r = 0; r < L.rows; r++) for (var c = 0; c < L.cols; c++) {
            var el = document.createElement("div");
            el.className = "rw-dot";
            el.style.cssText = "left:" + ((c + 0.5) / L.cols * 100) + "%;top:" + ((r + 0.5) / L.rows * 100) + "%;width:" + D + "px;height:" + D + "px;margin:" + (-D / 2) + "px";
            layer.appendChild(el);
            dots.push({ el: el, dist: Math.hypot(c - cx, r - cy) / maxD, hot: -1 });
          }

          // title: the shared text path (kSplit, then kFit by real layout), empty = no panel
          var hold = q(".rw-hold"), panel = q(".rw-panel"), ttl = q(".rw-title");
          var text = String(v.title == null ? "" : v.title).trim();
          if (!text) hold.style.display = "none";
          else {
            kSplit(ttl, "word", false, text);
            var padX = parseFloat(getComputedStyle(panel).paddingLeft) * 2;
            kFit(ttl, { lines: L.titleLines, min: L.titleMin, width: hold.clientWidth - padX });
          }
          var rise = L.rise * Math.min(FW, FH), out3 = MT.ease("power3.out");
          var hp = Math.PI;

          function render(t) {
            var te = t * sp;
            for (var i = 0; i < dots.length; i++) {
              var d = dots[i];
              var w1 = out3(MT.clamp((te - d.dist * CFG.rate) / CFG.reach));
              var s0 = CFG.p0 + (1 - d.dist) * CFG.pk;
              var pulse = Math.sin(MT.clamp((te - s0) / CFG.pw) * hp);
              var s = w1 * (1 + CFG.over * Math.sin(w1 * hp)) + pulse * CFG.amp;
              var hot = pulse > CFG.thr ? 1 : 0;
              d.el.style.transform = "scale(" + (Math.round(s * 1e4) / 1e4) + ")";
              d.el.style.opacity = String(Math.round((CFG.base + w1 * CFG.lit + pulse * CFG.glowOp) * 1e4) / 1e4);
              if (hot !== d.hot) {
                d.hot = hot;
                d.el.style.background = hot ? "var(--k-accent)" : "var(--k-accent-2)";
                d.el.style.boxShadow = hot ? glow : "none";
              }
            }
            // title panel: pops in after the second wave has come home (opaque slide, 0.15 s opacity gate)
            hold.style.opacity = String(MT.ramp(te, CFG.title, CFG.titleFade, "linear"));
            panel.style.transform = "translateY(" + ((1 - MT.ramp(te, CFG.title, CFG.titleDur, "snappy")) * rise).toFixed(2) + "px)";
          }
          var tl = MT.scene(CFG.dur, render);
          window.__timelines["radial-wave"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

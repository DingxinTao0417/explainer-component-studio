}
// ==== end kit:text ====

// ==== kit:fit@1 ====
function kFit(el, o) {
  o = o || {};
  var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
  var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
  for (;;) {
    el.style.fontSize = f + "px";
    m = kLines(el);
    if ((m.w <= W && m.n <= n) || f <= min) break;
    f = Math.max(min, f - 2);
  }
  if (m.w > W) {
    [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
    m = kLines(el);
  }
  return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
}
function kLines(el) {
  var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
  var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
  while ((t = it.nextNode())) {
    if (!t.data.trim()) continue;
    r.selectNodeContents(t);
    [].forEach.call(r.getClientRects(), function (b) {
var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
    });
  }
  return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
}
// ==== end kit:fit ====

    var dark = kTone(root) === "dark";
    if (txt("backdrop") === "off") [".cd-backdrop", ".cd-vig", ".cd-grain", ".cd-dust"].forEach(function (s) { q(s).style.display = "none"; });
    var hero = q(".cd-hero"), face = hero.querySelector(".cd-face"), rim = q(".cd-rim"), cam = q(".cd-cam");
    var layer = q(".cd-3d"), ground = q(".cd-ground");
    var hs = getComputedStyle(hero), CX = parseFloat(hs.left), CY = parseFloat(hs.top), CW = parseFloat(hs.width), CH = parseFloat(hs.height);
    q(".cd-persp").style.perspectiveOrigin = L.vp[0] * FW + "px " + L.vp[1] * FH + "px";
    cam.style.transformOrigin = CX + CW / 2 + "px " + (CY + CH / 2) + "px";
    var clamp = MT.clamp, A = "var(--k-accent)", mixc = function (c, p) { return "color-mix(in srgb, " + c + " " + Math.round(clamp(p / 100) * 1000) / 10 + "%, transparent)"; };
    face.style.boxShadow = "inset 0 1px 0 var(--cd-hi), " + kShadow(22, dark ? 2.6 : 1.15);

    // text slots: empty hides, long shrinks then wraps
    var nm = q(".cd-nm"), row = q(".cd-readrow"), cap = q(".cd-cap span"), capBox = q(".cd-cap");
    nm.textContent = txt("name"); nm.style.display = txt("name") ? "" : "none";
    q(".cd-val").textContent = txt("value"); q(".cd-unit").textContent = txt("unit"); q(".cd-unit").style.display = txt("unit") ? "" : "none";
    q(".cd-read").style.display = txt("value") ? "" : "none";
    if (txt("name")) kFit(nm, { lines: 1, min: 28, width: nm.clientWidth || 400 });
    if (txt("value")) kFit(row, { lines: 1, min: 64, width: q(".cd-read").clientWidth || 580 });
    var TW = q(".cd-title").clientWidth || 780, capW = capBox.clientWidth - 56;
    var lines = [["line1", ".cd-l1"], ["line2", ".cd-l2"]].map(function (a) {
      var el = q(a[1]), s = txt(a[0]);
      if (!s) { el.style.display = "none"; return []; }
      var us = kSplit(el, "word", true, s);
      us.forEach(function (u) { u.setAttribute("data-layout-allow-occlusion", ""); });
      if (a[0] === "line2") us[us.length - 1].style.color = A;
      kFit(el, { lines: 1, min: L.minTitle, width: TW });
      return us;
    });
    var capFit = function (s) { cap.textContent = s; cap.style.fontSize = ""; capBox.style.display = s ? "flex" : "none"; if (s) kFit(cap, { lines: 1, min: 40, width: capW }); };

    // seven clones, far to near; their text sits in pseudo-elements
    var SPARK = q(".cd-spark polyline").getAttribute("points"), MARK = q(".cd-mark").outerHTML, clones = [];
    for (var idx = N; idx >= 1; idx--) {
      var el = document.createElement("div"), c = idx / N;
      el.className = "cd-card cd-clone";
      el.innerHTML = '<div class="cd-face" style="--cf:' + MT.mix(55, 6, c).toFixed(1) + '%;border-color:' + mixc(A, MT.mix(55, 85, c)) + ';box-shadow:0 0 ' + (18 + 20 * c).toFixed(0) + "px " + mixc(A, 12 + 10 * c) + '">' +
        '<div class="cd-in"><div class="cd-top">' + MARK + '<div class="cd-nm"></div><div class="cd-tag" data-t="0' + (idx + 1) + '"></div></div>' +
        '<svg class="cd-spark" viewBox="0 0 576 130" aria-hidden="true"><polyline points="' + SPARK + '"/></svg></div></div>';
      el.querySelector(".cd-nm").setAttribute("data-t", txt("name"));
      layer.insertBefore(el, hero);
      clones.push({ el: el, idx: idx });
    }

    var inner = [".cd-top", ".cd-read", ".cd-spark, .cd-area", ".cd-slots"].map(function (k) { return [].slice.call(hero.querySelectorAll(k)); });
    var slots = [].slice.call(hero.querySelectorAll(".cd-slot"));
    var count = q(".cd-count"), punchEl = q(".cd-punch"), dEl = q(".cd-d"), dpEl = q(".cd-dp");
    var land = CFG.merge + CFG.mergeDur;
    var spreadOf = function (t, i) { var s0 = CFG.spread + (i - 1) * CFG.each; return t < s0 ? 0 : MT.spring({ t: t, delay: s0, damping: CFG.spDamp, stiffness: CFG.spStiff, mass: CFG.spMass }); };
    var mergeOf = function (t) { return MT.ramp(t, CFG.merge, CFG.mergeDur, "exit"); };
    var depthOf = function (t, i) { return spreadOf(t, i) * (1 - mergeOf(t)); };

    // dust motes (26, drift 0.18)
    var dust = q(".cd-dust"), motes = [], DW = FW + 200, DH = FH + 100;
    for (var m = 0; m < 26; m++) {
      var z = kHash(155 + m * 7.1), md = document.createElement("div"), sz = 2 + z * z * 16;
      md.className = "cd-mote"; md.style.width = md.style.height = sz.toFixed(1) + "px";
      if (z > 0.7) md.style.filter = "blur(" + ((z - 0.7) * 10).toFixed(1) + "px)";
      dust.appendChild(md);
      motes.push({ el: md, z: z, x0: kHash(65 + m * 3.7) * DW, y0: kHash(85 + m * 5.3) * FH, m: m });
    }
    var grain = kGrain(q(".cd-grain"));

    function render(t) {
      var f = t * 30, mg = mergeOf(t); // f: frames at 30 fps, dust only
      var enter = MT.ramp(t, 0, CFG.enterDur, "snappy");
      var press = MT.ramp(t, CFG.press, CFG.pressDur, "swift") * (1 - MT.ramp(t, CFG.spread, 0.333, "overshoot"));
      var popT = clamp((t - land) / CFG.popDur), pop = t >= land ? Math.sin(popT * Math.PI) * Math.pow(1 - popT, 0.6) : 0;
      var rimF = t >= land ? Math.max(0, 1 - (t - land) / CFG.rimDur) : 0;
      var lit = MT.ramp(t, land - 1 / 30, CFG.litDur, "snappy");
      hero.style.transform = "translate3d(0px," + ((1 - enter) * 40 * S).toFixed(2) + "px,0px) scale(" + ((1 - 0.04 * press) * (1 + 0.06 * pop) * MT.mix(0.94, 1, enter)).toFixed(4) + ")";
      hero.style.opacity = clamp(enter * 1.4).toFixed(3);
      hero.style.filter = enter < 1 ? "blur(" + ((1 - enter) * 10).toFixed(2) + "px)" : "none";
      rim.style.borderColor = mixc(A, 25 * press + 90 * rimF);
      rim.style.boxShadow = rimF > 0 ? "0 0 " + (50 * rimF).toFixed(1) + "px " + mixc(A, 45 * rimF) + ", inset 0 0 " + (40 * rimF).toFixed(1) + "px " + mixc(A, 18 * rimF) : "none";
      inner.forEach(function (g, k) {
        var p = MT.ramp(t, CFG.riseAt + k * CFG.riseStep, CFG.riseDur, "snappy");
        g.forEach(function (e) { e.style.opacity = p.toFixed(3); e.style.transform = "translateY(" + ((1 - p) * 16 * S).toFixed(2) + "px)"; });
      });
      slots.forEach(function (s, i) {
        var on = i === 0 ? 1 : lit;
        s.style.background = mixc(A, 6 + 84 * on);
        s.style.color = on > 0.8 ? "var(--k-on-accent)" : on < 0.15 ? "var(--k-muted)" : "var(--k-ink)";
        s.style.borderColor = mixc(A, 18 + 50 * on);
      });
      ground.style.opacity = enter.toFixed(3);
      ground.style.setProperty("--gl", (14 + 12 * rimF).toFixed(1));

      var dr = 14 * S * MT.ramp(t, CFG.dollyAt, CFG.dollyDur, "smooth") * (1 - mg);
      clones.forEach(function (c) {
        var i = c.idx, d = depthOf(t, i), sp = spreadOf(t, i), op = (1 - (i / N) * 0.72) * clamp(sp * 2.5) * (1 - mg * 0.4);
        if (op <= 0.005 || d <= 0.002) { c.el.style.opacity = "0"; return; }
        var dx = (L.dx * S * i - dr * i * 0.4) * d, dy = L.dy * S * i * d;
        var vel = Math.abs(depthOf(t + 1 / 60, i) - depthOf(t - 1 / 60, i)) * GAP_Z * i;
        var born = clamp(1 - (t - (CFG.spread + (i - 1) * CFG.each)) / (8 / 30));
        c.el.style.opacity = op.toFixed(3);
        c.el.style.transform = "translate3d(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px," + (-GAP_Z * i * d).toFixed(2) + "px)";
        c.el.style.filter = "blur(" + (Math.min(10, vel * 0.06) + (i / N) * 1.6).toFixed(2) + "px)" + (born > 0 ? " drop-shadow(0 0 " + (14 * born).toFixed(1) + "px " + mixc(A, 70 * born) + ")" : "");
      });

      // counter: +1 per clone, digit rolls up

      var roll = MT.ramp(t - last, 0, CFG.rollDur, "snappy"), spd = roll < 1 ? 1 - roll : 0;
      var punch = t >= land ? Math.sin(clamp((t - land) / CFG.punchDur) * Math.PI) : 0;
      var cs = dEl.style, ps = dpEl.style, g = 0.35 + 0.5 * punch;
      dEl.textContent = n; dpEl.setAttribute("data-p", n > 1 ? n - 1 : "");
      cs.transform = "translateY(" + ((1 - roll) * 45).toFixed(2) + "%)";
      cs.opacity = clamp(roll * 1.6).toFixed(3);
      ps.transform = "translateY(" + (-roll * 45).toFixed(2) + "%)";
      ps.opacity = n > 1 ? clamp(1 - roll * 1.6).toFixed(3) : "0";
      cs.filter = ps.filter = spd > 0.05 ? "blur(" + (spd * 6).toFixed(2) + "px)" : "none";
      cs.textShadow = dark ? "0 0 " + (24 * g).toFixed(1) + "px " + mixc(A, 45 * g) + ", 0 0 " + (70 * g).toFixed(1) + "px " + mixc(A, 30 * g) : "none";
      punchEl.style.transform = "scale(" + (1 + 0.06 * punch).toFixed(4) + ")";
      var lab = MT.ramp(t, CFG.labelAt, CFG.labelDur, "out");
      count.style.opacity = capBox.style.opacity = lab.toFixed(3);
      count.style.transform = capBox.style.transform = "translateY(" + ((1 - lab) * 20 * S).toFixed(2) + "px)";
      var st = n === 1 ? "1" : "2";
      if (cap.getAttribute("data-s") !== st) { cap.setAttribute("data-s", st); capFit(txt(n === 1 ? "label1" : "label")); }

      motes.forEach(function (o) {
        var x = ((((o.x0 + f * 0.18 * (0.4 + o.z)) % DW) + DW) % DW) - 100;
        var y = ((((o.y0 - f * 0.054 * (0.5 + o.z)) % DH) + DH) % DH) - 50;
        o.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
        o.el.style.opacity = ((0.25 + 0.75 * (0.5 + 0.5 * Math.sin(f / (14 + o.z * 20) + o.m))) * (0.3 + o.z * 0.7)).toFixed(3);
      });
      // dolly
      cam.style.transform = "scale(" + (1 + 0.02 * MT.ramp(t, CFG.dollyAt, CFG.dollyDur, "smooth") + 0.006 * MT.ramp(t, CFG.dolly2At, CFG.dolly2Dur, "smooth")).toFixed(5) + ")";

    }

    var tl = MT.scene(CFG.dur, render);

    kReveal(tl, lines[0], "rise", CFG.title, { each: CFG.word, gap: CFG.wordGap });
    kReveal(tl, lines[1], "rise", CFG.title2, { each: CFG.word, gap: CFG.wordGap });

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"srcs","type":"string","label":"胶片上每一格的图，用 | 分隔，按经过的先后排","default":"motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p8.jpg"},
    {"id":"stop","type":"number","label":"最后停在第几格（从 1 数）","default":5,"min":2,"max":12,"step":1},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>filmstrip-pass · 胶片带掠过</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="filmstrip-pass-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .fp { position: absolute; inset: 0; }
        .fp-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .fp-band { position: absolute; left: 0; top: 278px; width: 1920px; height: 524px; background: var(--k-panel); box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4); }
        .fp-holes { position: absolute; left: 0; width: 1920px; height: 30px; background-image: repeating-linear-gradient(90deg, #05070b 0, #05070b 36px, transparent 36px, transparent 80px); }
        .fp-holes-a { top: 22px; }
        .fp-holes-b { bottom: 22px; }
        .fp-cell { position: absolute; left: 660px; top: 352px; width: 600px; height: 376px; overflow: hidden; border-radius: 8px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); }
        .fp-img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .fp-dim { position: absolute; inset: 0; background: #05070b; opacity: 0.62; }
        .fp-finder { position: absolute; left: 520px; top: 259px; display: block; width: 880px; height: 562px; }
      </style>

      <div id="root" data-composition-id="filmstrip-pass" data-width="1920" data-height="1080">
        <div class="fp">
          <div class="fp-bg"></div>
          <div class="fp-band"><div class="fp-holes fp-holes-a"></div><div class="fp-holes fp-holes-b"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p1.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p2.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p3.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p4.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p5.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p6.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p7.jpg" alt="" /><div class="fp-dim"></div></div>
          <div class="fp-cell"><img class="fp-img" src="motion-cards/lib/samples/p8.jpg" alt="" /><div class="fp-dim"></div></div>
          <svg class="fp-finder" viewBox="0 0 880 562" fill="none" stroke="var(--k-accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M5 75 V5 H75" /><path d="M805 5 H875 V75" /><path d="M875 487 V557 H805" /><path d="M75 557 H5 V487" /></svg>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            pitch: 640,            // cell width 600 + gap 40
            perCell: 0.8,          // seconds for one cell to travel one pitch: the constant speed of the pass
            cruise: 2.9,           // how long it runs at that speed (shortened automatically when "stop" is an early cell)
            brake: 1.0,            // then it coasts to a stop on the chosen cell (power2.out, so speed is continuous)
            grow: 0.42,            // the cell in the finder is 1.42× the others
            reach: 0.8,            // how close (in pitches) a cell must be before it starts to grow
            dim: 0.62,
          };
          var v = { stop: 5, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".fp");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".fp-bg").style.display = "none";
          var list = String(v.srcs || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          var cells = all(".fp-cell");
          var n = Math.max(2, list.length || cells.length);
          while (cells.length < n) { var extra = cells[0].cloneNode(true); root.insertBefore(extra, q(".fp-finder")); cells.push(extra); }
          while (cells.length > n) { root.removeChild(cells.pop()); }
          cells.forEach(function (c, i) { if (list[i]) c.querySelector(".fp-img").setAttribute("src", list[i]); });
          var dims = cells.map(function (c) { return c.querySelector(".fp-dim"); });
          var holes = all(".fp-holes"), finder = q(".fp-finder");
          var stop = Math.max(2, Math.min(n, Math.round(parseFloat(v.stop) || 1))) - 1;
          var speed = CFG.pitch / CFG.perCell;
          var camEnd = stop * CFG.pitch;
          var camBrake = camEnd - speed * CFG.brake / 2;   // distance covered by a power2.out of that length at that entry speed
          // never start further back than a quarter pitch before the first cell, or the pass opens on empty film
          var cruise = Math.max(0.2, Math.min(CFG.cruise, (camBrake + CFG.pitch / 4) / speed));
          var camStart = camBrake - speed * cruise;
          var push = 600 * CFG.grow / 2;                  // neighbours are shoved aside by half the extra width
          var ss = function (t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
          var state = { cam: camStart };
          // everything on screen is a pure function of the camera position, so any seek gives the same picture
          var render = function () {
            var best = 0;
            cells.forEach(function (c, i) {
              var d = i * CFG.pitch - state.cam, a = Math.abs(d);
              var near = 1 - ss(a / (CFG.pitch * CFG.reach));
              var x = d + (d < 0 ? -1 : 1) * push * ss(a / CFG.pitch);
              if (near > best) best = near;
              gsap.set(c, { x: x, scale: 1 + CFG.grow * near, zIndex: near > 0.4 ? 2 : 1, autoAlpha: Math.abs(x) > 1500 ? 0 : 1 });
              gsap.set(dims[i], { opacity: CFG.dim * (1 - near) });
            });
            var bx = (-state.cam % 80) + "px";
            holes[0].style.backgroundPositionX = bx; holes[1].style.backgroundPositionX = bx;
            gsap.set(finder, { scale: 1.07 - 0.07 * best });   // the brackets tighten as a cell locks in
          };

          var tl = gsap.timeline({ paused: true, onUpdate: render });
          tl.fromTo(root, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
          tl.fromTo(state, { cam: camStart }, { cam: camBrake, duration: cruise, ease: "none" }, 0);
          tl.fromTo(state, { cam: camBrake }, { cam: camEnd, duration: CFG.brake, ease: "power2.out", immediateRender: false }, cruise);
          render();
          window.__timelines["filmstrip-pass"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

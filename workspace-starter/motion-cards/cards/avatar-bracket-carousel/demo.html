          }
          // ==== end kit:text ====

          // ==== kit:fit@1 ====
          function kFit(el, o) {
            o = o || {};
            var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
            var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
            for (;;) {
              el.style.fontSize = f + "px";
              m = kLines(el);
              if ((m.w <= W && m.n <= n) || f <= min) break;
              f = Math.max(min, f - 2);
            }
            if (m.w > W) {
              [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
              m = kLines(el);
            }
            return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
          }
          function kLines(el) {
            var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
            while ((t = it.nextNode())) {
              if (!t.data.trim()) continue;
              r.selectNodeContents(t);
              [].forEach.call(r.getClientRects(), function (b) {
                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {
            if (!el.children.length) return [];
            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====

          kTone(root);
          var off = String(v.backdrop) === "off";
          if (off) ["ab-bg", "ab-vig", "ab-grain"].forEach(function (c) { q("." + c).style.display = "none"; });
          var drawGrain = off ? function () {} : kGrain(q(".ab-grain"), { opacity: 0.07, blend: "soft-light" });

          // roles: 1-4 names, one per avatar; the queue only has as many members (and steps) as there are names
          var names = String(v.roles).split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 4);
          if (!names.length) names = ["写作", "整理", "翻译", "答疑"];
          var n = names.length, sw = CFG.sw.slice(0, n - 1);
          var avs = qa(".ab-av"), rows = qa(".ab-role"), rts = qa(".ab-rt");
          avs.concat(rows).forEach(function (el, i) { if (i % 4 >= n) el.style.display = "none"; });
          var box = q(".ab-box"), u = parseFloat(getComputedStyle(box).getPropertyValue("--u")) || 4;
          var cw = parseFloat(getComputedStyle(box).getPropertyValue("--cw")) || 312;
          rts.forEach(function (el, k) {
            if (k >= n) return;
            kSplit(el, "word", false, names[k]);
            el.style.maxWidth = cw - 98 + "px"; // chip width less the dot and its padding
            kFit(el, { lines: 1, min: 28, width: cw - 98 });
          });

          // the two words: fitted to their share of the row (landscape) or the column width (portrait)
          var wl = null, wr = null;
          var words = [[".ab-wl", v.left], [".ab-wr", v.right]].map(function (p, i) {
            var el = q(p[0]), s = String(p[1]);
            if (!s.trim()) { el.style.display = "none"; return null; }
            kSplit(el, "word", false, s);
            if (i) wr = el; else wl = el;
            return el;
          }).filter(Boolean);
          var gap = parseFloat(getComputedStyle(box).gap) || 0, BW = FW * L.boxW;
          var ww = P ? BW : (BW - q(".ab-slot").offsetWidth - 2 * gap) / Math.max(1, words.length);
          words.forEach(function (el) { el.style.maxWidth = ww + "px"; kFit(el, { lines: 1, min: L.wordMin, width: ww }); });

          var spring = function (k) { return 1 - Math.exp(-6 * k) * Math.cos(14 * k * 0.25 * 2.2); }; // upstream E.spring(k, 0.25): w = 8 + 8 * 0.75 = 14
          var posAt = function (t) { var p = 0; sw.forEach(function (s) { p += MT.ramp(t, s, CFG.win, spring); }); return p; };
          var halo = q(".ab-halo"), brk = q(".ab-brk"), chip = q(".ab-chip"), corners = qa(".ab-brk path");
          var DIR = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
          var wordIn = function (el, t0, t) {
            if (!el) return;
            var p = MT.ramp(t, t0, CFG.wordDur, "snappy");
            el.style.opacity = p; el.style.filter = "blur(" + (1 - p) * AMP.wordBlur * u + "px)";
            el.style.transform = "translateY(" + (1 - p) * AMP.word * u + "px)";
          };

          var tl = MT.scene(CFG.dur, function (t) {
            var pos = posAt(t), h = 1 / 60;
            var vel = posAt(t + h) - posAt(t - h);       // queue speed in steps per frame, for a slight smear along the move
            var smear = Math.min(0.08, Math.abs(vel) * AMP.smear);
            var breath = 0;
            sw.forEach(function (s) { breath += Math.sin(MT.ramp(t, s, CFG.breath, "linear") * Math.PI); });
            var lock = MT.ramp(t, CFG.lock, CFG.lockDur, "snappy"), lop = MT.ramp(t, CFG.fade, CFG.fadeDur, "out");
            wordIn(wl, CFG.wordL, t); wordIn(wr, CFG.wordR, t);
            halo.style.opacity = lop;
            brk.style.opacity = lop;
            brk.style.transform = "scale(" + (1 + Math.min(1, breath) * AMP.breath) + ")";
            corners.forEach(function (c, i) { c.setAttribute("transform", "translate(" + DIR[i][0] * (1 - lock) * AMP.corner + " " + DIR[i][1] * (1 - lock) * AMP.corner + ")"); });
            chip.style.opacity = lop;
            chip.style.transform = "translate(-50%, " + (58 * u + (1 - lop) * AMP.chipRise * u) + "px)";
            for (var k = 0; k < n; k++) {
              var d = Math.abs(k - pos), sc = Math.max(0.5, 1 - d * 0.38), op = Math.max(0, 1 - d * 0.62);
              var en = MT.ramp(t, CFG.enter + k * CFG.enterGap, CFG.enterDur, "out");
              avs[k].style.transform = "translateY(" + ((k - pos) * AMP.step * u + (1 - en) * AMP.rise * u) + "px) scale(" + sc * (1 - smear * 0.5) + "," + sc * (1 + smear) + ")";
              avs[k].style.opacity = op * en;
              avs[k].style.filter = "blur(" + Math.min(3, d * 2.4) * u + "px)";
              rows[k].style.transform = "translateY(" + (k - pos) * AMP.chip * u + "px)";
              rows[k].style.opacity = Math.max(0, 1 - d * 2.2);
            }
            drawGrain(t);
          });
          window.__timelines["avatar-bracket-carousel"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

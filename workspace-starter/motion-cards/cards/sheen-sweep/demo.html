      <style>

            radial-gradient(ellipse 72% 72% at var(--vx) var(--vy), transparent var(--vin), color-mix(in srgb, var(--vc) calc(var(--vs) * 32%), transparent) calc(var(--vin) + (100% - var(--vin)) * 0.55), color-mix(in srgb, var(--vc) calc(var(--vs) * 100%), transparent) 100%),
            radial-gradient(ellipse 100% 100% at var(--vx) var(--vy), transparent 60%, color-mix(in srgb, var(--vc) calc(var(--vs) * 60%), transparent) 100%);
        }

        /* --u is one upstream pixel at this card size (the card is 900 upstream px wide), --cy the card's centre line,
           --dk the desk top, --hz the soft horizon glow. --bx / --tx / --on are the sweep, written by the script */
        .sw { position: absolute; inset: 0; container-type: size; }
        .sw-in {

            radial-gradient(ellipse 50% 46% at 90% 95%, color-mix(in srgb, var(--k-accent-2) 10%, transparent), transparent 72%),

        }

        }

        .sw-desk { top: var(--dk); background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--sw-shade) 8%, transparent)); }

        .sw-p { perspective: calc(var(--u) * 2400); perspective-origin: 50% calc(var(--cy) - var(--u) * 120); }

          background: linear-gradient(135deg, color-mix(in srgb, var(--k-accent) 35%, var(--k-on-stage)), color-mix(in srgb, var(--k-accent) 70%, var(--k-on-stage)) 42%, color-mix(in srgb, var(--k-accent) 70%, var(--k-stage)) 70%, color-mix(in srgb, var(--k-accent) 50%, var(--k-on-stage)));

        /* the sweep: shown only while the band crosses (--on), the band and its mask share one 115-degree geometry,
           2x the face wide, moved by --bx */
        .sw-sweep { opacity: var(--on); }
        .sw-bm { mask-image: linear-gradient(115deg, transparent 38%, #000 50%, transparent 62%); mask-size: 200% 100%; mask-position: var(--bx) 0; mask-repeat: no-repeat; }
        .sw-band {

        @container (orientation: portrait) {

      <script>
        (function () {
          // timing in seconds (upstream frames / 30), shared by both orientations: the card lands on a slow spring
          // (shadow 4f behind), holds, then turns 7 degrees towards the light (54-96f) while the band sweeps once
          // (58-90f); afterwards it drifts 1.5 degrees more until 150f

          // spring of the landing (upstream: heavy, no bounce); the layout per orientation lives in the CSS (--u, --cy)
          var SPR = { damping: 24, stiffness: 70, mass: 1.1 };
          var v = { name: "示例应用", role: "会员编号", holder: "0042 7310", tier: "专业版", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k]; // "" hides role / holder / tier
          } catch (e) {}

          var q = function (s) { return root.querySelector(s); };

            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          root.setAttribute("data-orient", FH > FW ? "portrait" : "landscape");
          root.setAttribute("data-backdrop", String(v.backdrop) === "off" ? "off" : "on");

          // ==== kit:tone@1 ====
          function kRGB(el, color) {
            var p = document.createElement("i");

            el.removeChild(p);
            return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
          }
          function kTone(wrap) {
            var c = kRGB(wrap, "var(--k-bg)");
            var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
            wrap.setAttribute("data-tone", tone);
            return tone;
          }
          // ==== end kit:tone ====

          // ==== kit:text@2 ====
          var kCJK = /[\u2e80-\u9fff\uf900-\ufaff\uff00-\uffef]/;

            };
            var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);

            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;

                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          // ==== end kit:fit ====

          // ==== kit:grain@1 ====
          function kGrain(layer, o) {
            o = o || {};
            var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
            var dark = tones && tones.getAttribute("data-tone") === "dark";
            var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
              var f = "type='linear' slope='2.4' intercept='-0.7'";
              var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
                "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
                "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
                "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
                "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
              return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
            });
            layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
            layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
            layer.style.backgroundSize = size + "px " + size + "px";
            return function (t) {
              var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
              layer.style.backgroundImage = tiles[k % 6];
              layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
            };
          }
          // ==== end kit:grain ====

          kTone(root);
          // face text: each slot split into units and fitted to its own box; empty optional slots are removed. The
          // short label slots go per character: word units lose the space after a lone "·" ("成员 A · 示例用户")
          [["name", 40, "word"], ["role", 28, "char"], ["holder", 40, "char"], ["tier", 40, "char"]].forEach(function (s) {
            var el = q(".sw-" + s[0]);
            if (!String(v[s[0]]).trim()) { el.style.display = "none"; return; }
            kSplit(el, s[2], false, v[s[0]]);
            kFit(el, { lines: 1, min: s[1] });
          });
          // the lit engraving: the same face as ::before copies (decoration), revealed by the band's mask
          var face = q(".sw-face"), lit = q(".sw-fc").cloneNode(true);
          lit.className += " sw-lit sw-sweep sw-bm";
          [].forEach.call(lit.querySelectorAll(".sw-t"), function (el) { el.setAttribute("data-t", el.textContent); el.textContent = ""; });
          face.insertBefore(lit, q(".sw-top"));

          var card = q(".sw-card"), sh1 = q(".sw-sh1"), sh2 = q(".sw-sh2"), W = card.offsetWidth, H = card.offsetHeight, u = W / 900;
          var grain = kGrain(q(".sw-grain"));
          var tl = MT.scene(CFG.dur, function (t) {
            var en = MT.spring({ t: t, damping: SPR.damping, stiffness: SPR.stiffness, mass: SPR.mass });
            var si = MT.spring({ t: t, delay: CFG.lag, damping: SPR.damping, stiffness: SPR.stiffness, mass: SPR.mass });
            var turn = MT.ramp(t, CFG.turn0, CFG.turn1 - CFG.turn0, "smooth"), drift = MT.ramp(t, CFG.turn1, CFG.dur - CFG.turn1, "out");
            var ap = MT.ramp(t, 0, CFG.appear, "out");
            card.style.opacity = ap;
            card.style.transform = "translateY(" + ((MT.mix(120, 0, en) - 6 * drift) * u).toFixed(2) + "px) rotateX(" + (MT.mix(16, 9, en) - 1.5 * turn).toFixed(3) +
              "deg) rotateY(" + (MT.mix(36, 21, en) - 7 * turn - 1.5 * drift).toFixed(3) + "deg) scale(" + MT.mix(0.94, 1, en).toFixed(4) + ")";
            sh1.style.opacity = (ap * MT.mix(0.08, 0.34, si)).toFixed(3);
            sh1.style.transform = "translateY(" + (MT.mix(60, 0, si) * u).toFixed(1) + "px)";
            sh2.style.opacity = (ap * MT.mix(0.05, 0.2, si)).toFixed(3);
            // the band centre runs from 0.45W left of the card to 0.45W right of it; the top hairline lights where
            // the band meets the top edge (half the height along the 115-degree slant)
            var c = MT.mix(-0.45 * W, 1.45 * W, MT.ramp(t, CFG.sw0, CFG.sw1 - CFG.sw0, "swift"));
            face.style.setProperty("--on", t >= CFG.sw0 && t <= CFG.sw1 ? 1 : 0);
            face.style.setProperty("--bx", (c - W).toFixed(1) + "px");
            face.style.setProperty("--tx", (c + 0.2332 * H).toFixed(1) + "px");
            grain(t);
          });
          window.__timelines["sheen-sweep"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

    <template id="stack-build-fan-template">

      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }

          --k-muted: var(--mc-muted, #6b7280);

          color: var(--k-ink);

        .sbf-cam, .sbf-floor, .sbf-pv, .sbf-card, .sbf-face, .sbf-cov, .sbf-sheen, .sbf-bar { position: absolute; display: block; }
        .sbf-cam { inset: 0; }
        .sbf-floor { height: 70px; border-radius: 50%; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--sbf-shade) 28%, transparent) 0%, transparent 70%); }
        .sbf-pv { left: 0; top: 0; width: 0; height: 0; }

        .sbf-cov { left: 12px; right: 12px; top: 104px; bottom: 12px; border-radius: 14px; overflow: hidden; background-size: cover; background-position: center; }
        .sbf-bar { left: 24px; border-radius: 6px; }
        .sbf-sheen { inset: 0; mix-blend-mode: soft-light; pointer-events: none; opacity: 0; --sp: -18%;

        .sbf-head { position: absolute; left: 10%; right: 10%; top: 150px; text-align: center; text-wrap: balance; }
        .sbf-title { display: block; font-size: 88px; font-weight: 700; line-height: 1.2; }
        .sbf-sub { display: block; margin: 12px auto 0; font-size: 40px; line-height: 1.3; color: var(--k-muted); }
        @container (orientation: portrait) {
          .sbf-head { left: 11%; right: 11%; top: 300px; }
          .sbf-title { font-size: 96px; }
          .sbf-sub { margin-top: 20px; }
        }
        /* title rise: a clip-path cut, not overflow: hidden (read as occlusion) */
        .sbf-u { display: inline-block; white-space: pre-wrap; }
        .sbf-cut { display: inline-block; vertical-align: top; clip-path: inset(-0.06em -0.04em -0.22em -0.04em); }
        /* ==== kit:derived@1 — colours mixed from the palette ====
           line: hairlines; shade: shadows (tinted, never black); hi: lit top edge; tint: cover wash (white on dark: accent goes olive) */
        .sbf {
          --sbf-line: color-mix(in srgb, var(--k-ink) 12%, transparent);
          --sbf-shade: color-mix(in srgb, var(--k-ink) 85%, var(--k-accent-2));

        .sbf[data-tone="dark"] {

        .sbf-vig { position: absolute; inset: 0; --vs: 16%; background: radial-gradient(ellipse 72% 72% at 50% 46%, transparent 45%, color-mix(in srgb, var(--sbf-shade) calc(var(--vs) * 0.32), transparent) 75%, color-mix(in srgb, var(--sbf-shade) var(--vs), transparent)); }
        .sbf[data-tone="dark"] .sbf-vig { --vs: 55%; }

      <div id="root" data-composition-id="stack-build-fan">

          <div class="sbf-vig"></div>
          <div class="sbf-head">
            <div class="sbf-title">这么多做法，先学这一种</div>

          </div>
          <div class="sbf-cam"><div class="sbf-floor"></div></div>

      </div>

            } else if (i === 5) { // table rows: dot, label bar, status pill

              var blur = Math.min(10, Math.abs((inAt(t - 1 / 60, j) - inAt(t + 1 / 60, j)) * D) * 0.18);
              var tilt = (i % 2 ? 1 : -1) * CFG.tilt * (y / D);
              var rot = MT.mix((kHash(i * 3 + 1) - 0.5) * CFG.jitR + tilt, cd.k * CFG.rot, fan);
              var tx = MT.mix((kHash(i * 5 + 2) - 0.5) * CFG.jitX, cd.k * CFG.tx, fan);
              var ly = cd.hero ? -CFG.liftPx * lift : 0;
              cd.pv.style.opacity = t < S[j] ? 0 : MT.clamp((t - S[j]) * 15);
              cd.pv.style.transform = "translate(" + (tx * s).toFixed(2) + "px," + ((y + dip + ly) * s).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + (squeeze * s).toFixed(4) + ")";
              cd.face.style.boxShadow = "inset 0 1px 0 var(--sbf-hi), " + kShadow(6 + (y / D) * 50 + (cd.hero ? 26 * lift : 0), str) +
                (cd.hero && rg > 0 ? ", 0 0 0 " + (3 * rg).toFixed(2) + "px color-mix(in srgb, " + A + " " + (90 * rg).toFixed(1) + "%, transparent)" : "");
              cd.fe.setAttribute("stdDeviation", "0 " + blur.toFixed(2));
              cd.face.style.filter = blur > 0.4 ? "url(#sbf" + mount + "b" + i + ")" : "none";
              if (cd.sheen) cd.sheen.style.cssText = "opacity:" + (sh > 0 && sh < 1 ? 1 : 0) + ";--sp:" + ((-0.18 + 1.36 * sh) * 100).toFixed(1) + "%";
            });
          }

          var tl = MT.scene(CFG.dur, render);
          // phrases climb out of their cuts; the opacity gate hides them from the checker
          tEl.textContent = "";
          parts.forEach(function (w, k) {
            var c = document.createElement("span"), u = document.createElement("span"), t0 = CFG.title + k * CFG.wordGap;
            // a space between Latin phrases
            if (k && /[!-~]$/.test(parts[k - 1]) && /^[!-~]/.test(w)) tEl.appendChild(document.createTextNode(" "));
            c.className = "sbf-cut"; u.className = "sbf-u"; u.textContent = w; c.appendChild(u); tEl.appendChild(c);
            tl.set(u, { opacity: 0 }, 0).set(u, { opacity: 1 }, t0);
            tl.fromTo(u, { y: u.offsetHeight * 1.05 + parseFloat(getComputedStyle(u).fontSize) * 0.3 }, { y: 0, duration: CFG.word, ease: "snappy" }, t0);
          });
          tl.fromTo(sEl, { opacity: 0 }, { opacity: 1, duration: 0.467, ease: "out" }, CFG.sub);
          tl.fromTo(sEl, { y: 16 }, { y: 0, duration: 0.6, ease: "snappy" }, CFG.sub);
          window.__timelines["stack-build-fan"] = tl;
        })();
      </script>
    </template>

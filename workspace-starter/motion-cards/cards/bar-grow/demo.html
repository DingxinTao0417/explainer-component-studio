<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"values","type":"string","label":"数值，用 | 分隔（3–5 个）","default":"18|27|64|35"},
    {"id":"labels","type":"string","label":"柱子下的标签，用 | 分隔","default":"只给任务|加了背景|加了示例|加了格式"},
    {"id":"unit","type":"string","label":"数值后的单位（可空）","default":"分"},
    {"id":"focus","type":"number","label":"强调第几根（0 = 最高的那根）","default":0,"min":0,"max":5,"step":1},
    {"id":"headline","type":"string","label":"结论（一句）","default":"给一个示例，评分直接翻倍（示例数据）"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>bar-grow · 柱子长出</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="bar-grow-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .bgw { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
        .bgw-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .bgw-head { position: relative; display: block; margin-top: 60px; font-size: 68px; line-height: 90px; font-weight: 800; white-space: nowrap; }
        .bgw-chart { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: var(--bgw-g, 80px); height: 750px; margin-top: 0; }
        .bgw-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: var(--bgw-w, 320px); }
        .bgw-val { display: block; font-size: 96px; font-weight: 800; line-height: 1.25; white-space: nowrap; color: var(--k-muted); }
        .bgw-val small { font-size: 52px; font-weight: 700; margin-left: 8px; }
        .bgw-bar { display: block; width: 100%; border-radius: 18px 18px 0 0; background: color-mix(in srgb, var(--k-muted) 50%, var(--k-bg)); }
        .bgw-col.is-focus .bgw-val { color: var(--k-accent); font-size: 128px; }
        .bgw-col.is-focus .bgw-bar { background: var(--k-accent); }
        .bgw-base { position: relative; display: block; width: 1680px; height: 6px; border-radius: 3px; background: var(--k-muted); }
        .bgw-labels { position: relative; display: flex; justify-content: center; gap: var(--bgw-g, 80px); margin-top: 22px; }
        .bgw-lab { display: block; width: var(--bgw-w, 320px); text-align: center; font-size: 52px; font-weight: 600; color: var(--k-muted); white-space: nowrap; }
        .bgw-lab.is-focus { color: var(--k-ink); font-weight: 800; }
      </style>

      <div id="root" data-composition-id="bar-grow" data-width="1920" data-height="1080">
        <div class="bgw">
          <div class="bgw-bg"></div>
          <span class="bgw-head">给一个示例，评分直接翻倍（示例数据）</span>
          <div class="bgw-chart">
            <div class="bgw-col"><span class="bgw-val">18<small>分</small></span><span class="bgw-bar" style="height: 146px"></span></div>
            <div class="bgw-col"><span class="bgw-val">27<small>分</small></span><span class="bgw-bar" style="height: 219px"></span></div>
            <div class="bgw-col is-focus"><span class="bgw-val">64<small>分</small></span><span class="bgw-bar" style="height: 520px"></span></div>
            <div class="bgw-col"><span class="bgw-val">35<small>分</small></span><span class="bgw-bar" style="height: 284px"></span></div>
          </div>
          <div class="bgw-base"></div>
          <div class="bgw-labels">
            <span class="bgw-lab">只给任务</span><span class="bgw-lab">加了背景</span><span class="bgw-lab is-focus">加了示例</span><span class="bgw-lab">加了格式</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { at: 0.35, gap: 0.16, grow: 0.5, maxH: 520, focusLag: 0.12, focusGrow: 0.55, popLead: 0.1, focusPopAt: 0.45, pop: 0.28, labIn: 0.3 };
          var v = { values: "18|27|64|35", labels: "只给任务|加了背景|加了示例|加了格式", unit: "分", focus: 0, headline: "给一个示例，评分直接翻倍（示例数据）", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".bgw");
          var q = function (s) { return root.querySelector(s); };
          var vals = String(v.values).split("|").map(parseFloat).filter(isFinite).slice(0, 5);
          var labs = String(v.labels).split("|");
          var n = vals.length, max = Math.max.apply(null, vals) || 1;
          var fi = parseInt(v.focus, 10) || 0;
          fi = fi >= 1 && fi <= n ? fi - 1 : vals.indexOf(max);
          q(".bgw-head").textContent = String(v.headline);
          if (String(v.backdrop) === "off") q(".bgw-bg").style.display = "none";
          // five bars would not fit at the default column width, so the columns narrow a little
          if (n >= 5) { root.style.setProperty("--bgw-w", "270px"); root.style.setProperty("--bgw-g", "64px"); }

          var chart = q(".bgw-chart"), labRow = q(".bgw-labels");
          chart.textContent = "";
          labRow.textContent = "";
          var mk = function (tag, cls, txt) { var e = document.createElement(tag); e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
          var cols = [];
          for (var i = 0; i < n; i++) {
            var col = mk("div", "bgw-col" + (i === fi ? " is-focus" : ""));
            var val = mk("span", "bgw-val", String(vals[i]));
            if (String(v.unit)) val.appendChild(mk("small", "", String(v.unit)));
            var bar = mk("span", "bgw-bar");
            col.appendChild(val);
            col.appendChild(bar);
            chart.appendChild(col);
            var lab = mk("span", "bgw-lab" + (i === fi ? " is-focus" : ""), labs[i] || "");
            labRow.appendChild(lab);
            cols.push({ val: val, bar: bar, lab: lab, h: Math.max(8, Math.round((vals[i] / max) * CFG.maxH)) });
          }

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".bgw-head"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0);
          tl.fromTo(labRow.children, { opacity: 0 }, { opacity: 1, duration: CFG.labIn, ease: "none", stagger: CFG.gap }, CFG.at - 0.1);
          // plain bars leave the baseline left to right and skip the focus slot; the focus bar starts last, alone
          var turn = 0;
          cols.forEach(function (c, i) {
            var isF = i === fi;
            var t0 = isF ? CFG.at + (n - 1) * CFG.gap + CFG.focusLag : CFG.at + turn++ * CFG.gap;
            var d = isF ? CFG.focusGrow : CFG.grow;
            tl.fromTo(c.bar, { height: 0 }, { height: c.h, duration: d, ease: isF ? "back.out(1.5)" : "power3.out" }, t0);
            // the value shows once its bar has arrived: plain ones just before the end, the focus one on its overshoot
            tl.set(c.val, { transformOrigin: "50% 100%" }, 0);
            tl.fromTo(c.val, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: CFG.pop, ease: isF ? "back.out(3.2)" : "back.out(2)" }, isF ? t0 + d * CFG.focusPopAt : t0 + d - CFG.popLead);
          });
          window.__timelines["bar-grow"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

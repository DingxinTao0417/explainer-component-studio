<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},
    {"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},
    {"id":"ax","type":"number","label":"上一镜推向的点：横向 0–1","default":0.53,"min":0,"max":1,"step":0.01},
    {"id":"ay","type":"number","label":"上一镜推向的点：纵向 0–1","default":0.27,"min":0,"max":1,"step":0.01},
    {"id":"bx","type":"number","label":"下一镜里对上的点：横向 0–1","default":0.43,"min":0,"max":1,"step":0.01},
    {"id":"by","type":"number","label":"下一镜里对上的点：纵向 0–1","default":0.15,"min":0,"max":1,"step":0.01},
    {"id":"zoom","type":"number","label":"推到几倍","default":3,"min":1.6,"max":5,"step":0.1},
    {"id":"mark","type":"enum","label":"对位圈","default":"on","options":[{"value":"on","label":"显示"},{"value":"off","label":"不显示"}]},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>zoom-match · 匹配缩放</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="zoom-match-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .zm { position: absolute; inset: 0; overflow: hidden; }
        .zm-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .zm-from, .zm-to { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; object-fit: cover; }
        .zm-ring { position: absolute; left: 0; top: 0; width: 200px; height: 200px; margin: -100px 0 0 -100px; border: 8px solid var(--k-accent); border-radius: 50%; opacity: 0; }
      </style>

      <div id="root" data-composition-id="zoom-match" data-width="1920" data-height="1080">
        <div class="zm" data-layout-allow-overflow>
          <div class="zm-bg"></div>
          <img class="zm-from" src="motion-cards/lib/samples/p1.jpg" data-var-src="from" alt="" />
          <img class="zm-to" src="motion-cards/lib/samples/p2.jpg" data-var-src="to" alt="" />
          <div class="zm-ring"></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { cut: 1.0, push: 0.267, pull: 0.4, mix: 0.067, haze: 8, ringAt: 0.4, ringIn: 0.2, ringOut: 0.2 };
          var v = { "from": "motion-cards/lib/samples/p1.jpg", "to": "motion-cards/lib/samples/p2.jpg", "ax": 0.53, "ay": 0.27, "bx": 0.43, "by": 0.15, "zoom": 3, "mark": "on", "backdrop": "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".zm");
          var q = function (s) { return root.querySelector(s); };
          var num = function (x, d) { x = parseFloat(x); return isFinite(x) ? x : d; };
          var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
          var W = 1920, H = 1080, F = 1 / 30, cut = CFG.cut;
          if (String(v.backdrop) === "off") q(".zm-bg").style.display = "none";
          var tl = gsap.timeline({ paused: true });
          var a = q(".zm-from"), b = q(".zm-to"), ring = q(".zm-ring");
          a.setAttribute("src", String(v.from)); b.setAttribute("src", String(v.to));
          var ax = clamp(num(v.ax, 0.5), 0, 1), ay = clamp(num(v.ay, 0.5), 0, 1), bx = clamp(num(v.bx, 0.5), 0, 1), by = clamp(num(v.by, 0.5), 0, 1);
          var z = clamp(num(v.zoom, 3), 1.2, 6), fog = "blur(" + CFG.haze + "px)";
          // the old shot grows around A, so A never leaves its spot on screen
          tl.set(a, { transformOrigin: ax * 100 + "% " + ay * 100 + "%" }, 0);
          tl.set(b, { transformOrigin: "0 0" }, 0);
          tl.fromTo(a, { scale: 1, filter: "blur(0px)" }, { scale: z, filter: fog, duration: CFG.push, ease: "power3.in" }, cut - CFG.push);
          // the new shot starts at the same magnification with B lying exactly on A (nudged only if it would uncover an edge) …
          var sx = clamp(ax * W - z * bx * W, W - z * W, 0), sy = clamp(ay * H - z * by * H, H - z * H, 0);
          tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: CFG.mix, ease: "none" }, cut - CFG.mix / 2);
          // … and pulls back until it is simply the full picture
          tl.fromTo(b, { scale: z, x: sx, y: sy, filter: fog }, { scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: CFG.pull, ease: "power3.out" }, cut);
          if (String(v.mark) !== "off") {
            // optional ring: lands on A before the push, rides B back to where B lives in the new shot
            var onA = (sx + z * bx * W) - ax * W, onAy = (sy + z * by * H) - ay * H;
            ring.style.left = ax * W + "px"; ring.style.top = ay * H + "px";
            tl.fromTo(ring, { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: CFG.ringIn, ease: "power3.out" }, CFG.ringAt);
            tl.fromTo(ring, { x: onA, y: onAy }, { x: (bx - ax) * W, y: (by - ay) * H, duration: CFG.pull, ease: "power3.out", immediateRender: false }, cut);
            tl.to(ring, { opacity: 0, duration: CFG.ringOut, ease: "power1.in" }, cut + CFG.pull - 0.1);
          }
          window.__timelines["zoom-match"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

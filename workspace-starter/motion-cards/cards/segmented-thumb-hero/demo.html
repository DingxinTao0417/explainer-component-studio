          ics.forEach(function (ic) { ic.style.width = ""; ic.style.marginRight = ""; });
          var blur = kSpeedBlur(q(".st-tb"), "st", { amount: 0.06, max: 6 });
          var cMuted = kRGB(root, "var(--k-muted)"), cInk = kRGB(root, "var(--k-ink)");
          var tint = function (p) { return "rgb(" + [0, 1, 2].map(function (i) { return Math.round(cMuted[i] + (cInk[i] - cMuted[i]) * p); }).join(",") + ")"; };
          var shade = function (a) { return "color-mix(in srgb, var(--st-shade) " + Math.min(100, a * 100).toFixed(1) + "%, transparent)"; };
          var K = DK ? 2.6 : 1;

          var slideAt = function (t, ease) { return MT.ramp(t, CFG.slide, CFG.slideEnd - CFG.slide, ease); };
          var settle = function (t) { var f = Math.min(1, (t - CFG.slideEnd) / CFG.settleDur); return t < CFG.slideEnd ? 0 : CFG.settle * Math.sin(f * Math.PI) * (1 - f); };

          var tl = MT.scene(CFG.dur, function (t) {
            var fl = MT.spring({ t: t, delay: CFG.float, damping: CFG.floatSpring.damping, stiffness: CFG.floatSpring.stiffness, mass: CFG.floatSpring.mass });
            ctl.style.transform = "translateY(" + (MT.mix(L.rise * S, 0, fl)).toFixed(2) + "px)";
            ctl.style.opacity = Math.min(1, fl * 1.5).toFixed(3);
            pool.style.opacity = Math.min(1, fl).toFixed(3);
            // track shadow settles as the control lands: offset 30 -> 14, blur 80 -> 44, strength .32 -> .20
            ctl.style.boxShadow = "inset 0 2px 5px " + shade(0.08 * K) + ", inset 0 -1px 0 var(--st-hi), 0 1px 0 var(--st-hi), 0 " +
              MT.mix(30, 14, fl).toFixed(1) + "px " + MT.mix(80, 44, fl).toFixed(1) + "px -18px " + shade(MT.mix(0.32, 0.2, fl) * K);
            draw(t);

            // thumb: ease-out body, leading edge a touch quicker (power4), trailing edge slower (power2) -> stretches ~10% mid-slide
            var thumbT = slideAt(t, "power3.out"), st = settle(t);
            var l = PAD + (slideAt(t, "power2.out") + st) * SEGW, r = PAD + SEGW + (slideAt(t, "power4.out") + st) * SEGW;
            thumb.style.left = l.toFixed(2) + "px"; thumb.style.width = (r - l).toFixed(2) + "px";
            blur(MT.velocity(function (u) { return PAD + slideAt(u, "power3.out") * SEGW; }, t));

            // labels follow the thumb continuously (no hard colour flip at the midpoint)
            var amt = MT.clamp((thumbT - 0.2) / 0.6, 0, 1);
            segs[0].style.color = tint(1 - amt); segs[1].style.color = tint(amt);
            // icons: new one pops with an overshoot, old one closes; each slot width follows min(1, scale) so the text re-centres smoothly
            var inS = t >= CFG.slideEnd ? MT.spring({ t: t, delay: CFG.slideEnd, damping: CFG.iconSpring.damping, stiffness: CFG.iconSpring.stiffness, mass: CFG.iconSpring.mass }) : 0;
            var outS = 1 - MT.ramp(t, CFG.slide, CFG.oldOut, "power3.in");
            [outS, inS].forEach(function (s, i) {
              var w = Math.min(1, Math.max(0, s));
              ics[i].style.width = (IW * w).toFixed(2) + "px"; ics[i].style.marginRight = (GAP * w).toFixed(2) + "px";
              iis[i].style.transform = "scale(" + Math.max(0, s).toFixed(4) + ")";
            });

            // cursor: from outside the bottom-right corner to the tip target, then press
            var ct = MT.ramp(t, CFG.cursor, CFG.cursorDur, "power3.out");
            var cx = MT.mix(FW + L.from[0] * S, tipX - 20, ct), cy = MT.mix(FH + L.from[1] * S, tipY - 10, ct);
            var pr = t < CFG.click ? 0 : t < CFG.click + CFG.pressDur[0] ? (t - CFG.click) / CFG.pressDur[0] : MT.clamp(1 - (t - CFG.click - CFG.pressDur[0]) / (CFG.pressDur[1] - CFG.pressDur[0]), 0, 1);
            cur.style.left = cx.toFixed(2) + "px"; cur.style.top = cy.toFixed(2) + "px";
            cur.style.transform = "scale(" + (1 - pr * 0.14).toFixed(4) + ")";
            cur.style.filter = "drop-shadow(0 " + (2 - pr).toFixed(2) + "px " + (3 - pr).toFixed(2) + "px " + shade(0.22) + ") drop-shadow(0 " + (12 - pr * 6).toFixed(2) + "px " + (18 - pr * 6).toFixed(2) + "px " + shade(0.2) + ")";
            // ring: centred on the click point, above the thumb, never follows it
            var rp = MT.ramp(t, CFG.ripple, CFG.rippleDur, "power2.out"), on = t > CFG.ripple && rp < 1;
            ring.style.width = ring.style.height = (260 * S * rp).toFixed(2) + "px";
            ring.style.left = (tipX - 130 * S * rp).toFixed(2) + "px"; ring.style.top = (tipY - 130 * S * rp).toFixed(2) + "px";
            ring.style.opacity = on ? ((1 - rp) * 0.9).toFixed(3) : "0";
          });
          window.__timelines["segmented-thumb-hero"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

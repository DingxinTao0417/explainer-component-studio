    if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
    if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
    if (out.length) out[out.length - 1].sp = false;
    return out;
  }
  function kSplit(el, by, rise, text) {
    var s = text != null ? String(text) : el.textContent, units = [];
    var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
    el.textContent = "";
    parts.forEach(function (p) {
      var u = document.createElement("span"), box = u;
      u.className = "tt-u"; u.textContent = p.t;
      if (by === "line") u.style.display = "block";
      if (!p.t.trim()) { el.appendChild(u); return; }
      if (rise) { box = document.createElement("span"); box.className = "tt-cut"; box.style.display = u.style.display; box.appendChild(u); }
      el.appendChild(box);
      if (p.sp) el.appendChild(document.createTextNode(" "));
      units.push(u);
    });
    return units;
  }
  // ==== end kit:text ====

  // ==== kit:fit@1 (kFit, kLines) ====
  function kFit(el, o) {
    o = o || {};
    var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
    var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
    for (;;) {
      el.style.fontSize = f + "px";
      m = kLines(el);
      if ((m.w <= W && m.n <= n) || f <= min) break;
      f = Math.max(min, f - 2);
    }
    if (m.w > W) {
      [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
      m = kLines(el);
    }
    return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
  }
  function kLines(el) {
    var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
    var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
    while ((t = it.nextNode())) {
      if (!t.data.trim()) continue;
      r.selectNodeContents(t);
      [].forEach.call(r.getClientRects(), function (b) {
        var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
        if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
        row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
      });
    }
    return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
  }
  // ==== end kit:fit ====

  var root = document.querySelector(".tt");
  var q = function (s, el) { return (el || root).querySelector(s); };
  var FW = root.clientWidth, FH = root.clientHeight;
  if (!FW || !FH) {
    // not laid out yet: the host clip's declared size, then the window
    var hc = root.closest("[data-width][data-height]");
    FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
    FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
  }
  var P = FH > FW, L = P ? PORT : LAND;
  root.setAttribute("data-orient", P ? "portrait" : "landscape");
  kTone(root);
  if (String(v.backdrop) === "off") [".tt-backdrop", ".tt-vig", ".tt-grain"].forEach(function (s) { q(s).style.display = "none"; });

  // ---- text: lists split at "|", every slot through kSplit (typed spaces kept), empty slots hidden
  var put = function (el, s) { s = String(s == null ? "" : s).trim(); el.style.display = s ? "" : "none"; if (s) kSplit(el, "word", false, s); return !!s; };
  var list = function (s) { return String(s == null ? "" : s).split("|").map(function (x) { return x.trim(); }); };
  var names = list(v.stops).filter(Boolean).slice(0, 5);
  if (names.length < 2) names = list("v1.0|v2.0|v3.0|今天");
  var N = names.length, dates = list(v.dates), heads = list(v.heads), notes = list(v.notes), tags = list(v.tags);
  var hd = q(".tt-hd");
  q(".tt-eye").style.display = put(q(".tt-kick"), v.kicker) ? "" : "none";
  put(q(".tt-title"), v.title);
  kFit(q(".tt-kick"), { width: hd.clientWidth - 54, min: 28 });
  kFit(q(".tt-title"), { lines: L.lines, min: L.min });

  // stops: the static hero stop is the pattern, one clone per stop; the last clone is the hero
  var world = q(".tt-world"), proto = q(".tt-stop"), far = q(".tt-far"), S = [], i;
  [].slice.call(world.querySelectorAll(".tt-stop")).forEach(function (s) { world.removeChild(s); });
  far.textContent = "";
  for (i = 0; i < N; i++) {
    var el = world.appendChild(proto.cloneNode(true));
    el.style.setProperty("--i", i);
    el.classList.toggle("tt-hero", i === N - 1);
    put(q(".tt-chip", el), names[i]);
    put(q(".tt-name", el), names[i]);
    put(q(".tt-cdate", el), dates[i]);
    put(q(".tt-when", el), dates[i]);
    put(q(".tt-ctitle", el), heads[i]);
    put(q(".tt-note", el), notes[i]);
    q(".tt-tag", el).style.display = put(q(".tt-tx", el), tags[i]) ? "" : "none";
    var fm = far.appendChild(document.createElement("span"));
    fm.className = "tt-fm";
    fm.setAttribute("data-t", dates[i] || names[i]);
    S.push({ el: el, card: q(".tt-card", el), halo: q(".tt-halo", el), stem: q(".tt-stem", el), face: q(".tt-face", el), body: q(".tt-body", el) });
  }
  var IN = S[0].card.clientWidth - 60;
  S.forEach(function (s) {
    var chip = q(".tt-chip", s.el);
    kFit(chip, { width: IN * 0.6 - 28, min: 28 });
    kFit(q(".tt-cdate", s.el), { width: IN - chip.offsetWidth - 12, min: 28 });
    kFit(q(".tt-ctitle", s.el), { min: 40 });
    kFit(q(".tt-note", s.el), { lines: 2, min: 40 });
    kFit(q(".tt-tx", s.el), { width: IN - 22, min: 28 });
    kFit(q(".tt-name", s.el), { min: 28 });
    kFit(q(".tt-when", s.el), { min: 28 });
  });
  // every card takes the tallest card's height, so the tops line up
  var H = Math.max.apply(null, S.map(function (s) { return s.card.offsetHeight; }));
  S.forEach(function (s) { s.card.style.height = H + "px"; });

  // ---- camera: progress 0-1 along the travel; pops on the 30 fps grid, as upstream (first frame at or past the stop)
  var GAP = Math.round(L.gap * FW), TRAVEL = (N - 1) * GAP;
  var cam = function (t) { return MT.interpolate(MT.interpolate(t, [CFG.go, CFG.stop], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }), KIN, KOUT, { easing: "power1.inOut" }); };
  var camX = function (t) { return cam(t) * TRAVEL; };
  var popAt = function (j) { for (var f = Math.round(CFG.go * 30); f < Math.round(CFG.stop * 30); f++) if (cam(f / 30) >= j / (N - 1) - 1e-6) break; return f / 30 - CFG.lead; };
  // upstream's durationInFrames: the spring's own settle time (|1 - s| < 0.005 for 20 frames, Remotion's rule) squeezed into popF frames
  var spf = function (f) { return MT.spring({ t: f / 30, damping: CFG.damp, stiffness: CFG.stiff, mass: CFG.mass }); };
  var nat, f = 0, n;
  while (Math.abs(1 - spf(f)) >= 0.005) f++;
  for (nat = f, n = 0; n < 20; n++) if (Math.abs(1 - spf(++f)) >= 0.005) { n = 0; nat = f + 1; }
  var spr = function (d) { return d <= 0 ? 0 : d * 30 > CFG.popF ? 1 : spf((d * 30 * nat) / CFG.popF); };
  var zAt = function (t) { return 1 + (CFG.zoom - 1) * MT.ramp(t, CFG.stop, CFG.zoomDur, "power2.out"); };

  // ---- layout: axis under the header with room for the tallest overshoot; push-in origin at the upstream line,
  // moved only as far as needed to keep the pushed-in hero under the header and its labels above the low line
  var hb = hd.offsetTop + hd.offsetHeight + 24, LB = 34 + q(".tt-lab", S[0].el).offsetHeight, LOW = L.low * FH;
  var A = Math.round(Math.max(L.ay * FH, hb + 44 + 1.2 * H)), lo = -1e9, hi = 1e9, hp = popAt(N - 1);
  for (f = Math.round(CFG.stop * 30) + 1; f <= Math.round(CFG.end * 30); f++) {
    var z = zAt(f / 30) - 1;
    hi = Math.min(hi, ((A - 44 - spr(f / 30 - hp) * H) * (z + 1) - hb) / z);
    lo = Math.max(lo, ((A + LB) * (z + 1) - LOW) / z);
  }
  var Z = Math.round(Math.max(lo, Math.min(hi, L.zy * FH)));
  var zoom = q(".tt-zoom"), ticks = q(".tt-ticks");
  zoom.style.transformOrigin = far.style.transformOrigin = "50% " + Z + "px";
  world.style.width = FW + TRAVEL + "px";
  q(".tt-axis").style.top = A - 1 + "px";
  ticks.style.cssText = "left:" + FW / 2 + "px;top:" + (A - 9) + "px;width:" + ((N + 0.2) * GAP + 2) + "px;--gap:" + GAP + "px";
  S.forEach(function (s, j) { s.el.style.left = FW / 2 + j * GAP + "px"; s.el.style.top = A + "px"; s.pop = popAt(j); });
  // far labels: one size for all, shrunk so the widest stays inside the frame at its widest parallax offset
  var fms = [].slice.call(far.children), probe = far.appendChild(document.createElement("span")), fw = 0;
  probe.className = "tt-fm";
  fms.forEach(function (fm) { probe.textContent = fm.getAttribute("data-t"); fw = Math.max(fw, probe.offsetWidth); });
  far.removeChild(probe);
  var fs = Math.floor(280 * Math.min(1, (FW - 2 * CFG.farOut * CFG.par * GAP - 40) / Math.max(1, fw)));
  fms.forEach(function (fm) { fm.style.fontSize = fs + "px"; fm.style.top = A - 490 + "px"; });

  var blur = kSpeedBlur(q(".tt-blur"), "tt", { amount: CFG.blur, max: CFG.blurMax });
  var grain = kGrain(q(".tt-grain"));
  var tl = MT.scene(CFG.end, function (t) {
    var X = camX(t), z = zAt(t), h = MT.ramp(t, 0, CFG.head, "power2.out");
    // the world is the only thing that travels; it smears sideways while it is fast
    world.style.transform = "translateX(" + (-X).toFixed(2) + "px)";
    blur(-MT.velocity(camX, t), 0);
    zoom.style.transform = "scale(" + z.toFixed(4) + ")";
    far.style.transform = "scale(" + (1 + (z - 1) * CFG.par).toFixed(4) + ")";
    // far labels move at 0.35 of the camera speed and fade with their distance from it
    fms.forEach(function (fm, j) {
      fm.style.opacity = Math.max(0, 1 - Math.abs(X - j * GAP) / GAP / CFG.farOut).toFixed(3);
      fm.style.left = (FW / 2 + (j * GAP - X) * CFG.par).toFixed(1) + "px";
    });
    hd.style.opacity = h.toFixed(3);
    hd.style.transform = "translateY(" + ((1 - h) * 8).toFixed(2) + "px)";
    // each stop: node lights over 6 frames from its pop; stem and card spring up from the axis
    S.forEach(function (s) {
      var d = t - s.pop, p = spr(d), lit = MT.clamp(d / CFG.lit, 0, 1);
      s.el.classList.toggle("tt-dim", lit <= 0.5);
      s.halo.style.transform = "scale(" + (0.6 + 0.4 * lit).toFixed(3) + ")";
      s.stem.style.transform = "scaleY(" + Math.min(1, p).toFixed(4) + ")";
      s.card.style.transform = "scaleY(" + p.toFixed(4) + ") scaleX(" + (0.85 + 0.15 * p).toFixed(4) + ")";
      s.face.style.opacity = Math.min(1, 2 * p).toFixed(3);
      s.body.style.opacity = p >= 0.25 ? 1 : 0;
    });
    grain(t);
  });
  window.__timelines["timeline-travel"] = tl;
})();
</script>

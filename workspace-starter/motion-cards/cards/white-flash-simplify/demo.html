          kTone(root);
          if (String(v.backdrop) === "off") root.setAttribute("data-bare", "");
          var S = q(".wf-s"), CY = L.cy * FH, s1 = Math.min(FW, FH) / (3 * 360);

          // the wordmark: one string (kWords keeps typed spaces) in four copies, fitted once on the flat copy
          var name = kWords(v.name).map(function (u) { return u.t + (u.sp ? " " : ""); }).join("") || " ";
          var fw = q(".wf-fw");
          qa(".wf-w").forEach(function (w) { w.textContent = name; });
          var fit = kFit(fw, { min: L.min });
          qa(".wf-word").forEach(function (w) { w.style.fontSize = fit.size + "px"; });
          var gh = fit.size * fit.lines;
          S.style.setProperty("--cy", CY.toFixed(1) + "px");
          S.style.setProperty("--hh", (gh / 2).toFixed(1) + "px");
          S.style.setProperty("--rf", (gh * 0.86).toFixed(1) + "px");

          // tagline: optional, rises word by word under the rule
          var tag = q(".wf-tag"), units = [];
          if (String(v.tagline).trim()) { units = kSplit(tag, "word", true, v.tagline); kFit(tag, { lines: 2, min: 40 }); }
          else tag.style.display = "none";

          // mark: the placeholder unless a logo image is given; "none" drops it
          var mk = q(".wf-mk"), lg = String(v.logo).trim();
          if (lg === "none") mk.style.display = "none";
          else if (lg) { mk.innerHTML = '<img alt="" />'; mk.firstChild.setAttribute("src", lg); }
          var dot = mk.querySelector("circle"), bar = mk.querySelector("circle + rect");

          // dust: 36 motes on the stage, upstream hash positions, kept inside the frame
          var dust = q(".wf-dust"), motes = [];
          for (var i = 0; i < 36; i++) {
            var z = kHash(4 * 31 + i * 7.1), d = document.createElement("div");
            d.className = "wf-dot"; d.style.width = d.style.height = (2 + z * z * 16) * s1 + "px";
            if (z > 0.7) d.style.filter = "blur(" + ((z - 0.7) * 10).toFixed(1) + "px)";
            dust.appendChild(d); motes.push({ el: d, z: z, sz: (2 + z * z * 16) * s1, x: kHash(4 * 13 + i * 3.7), y: kHash(4 * 17 + i * 5.3) });
          }
          dust.style.opacity = 0.5;
          var g1 = kGrain(q(".wf-g1"), { opacity: 0.09, blend: "soft-light" }), g2 = kGrain(q(".wf-g2"), { opacity: 0.04, blend: "overlay" });

          var dark = q(".wf-dark"), flat = q(".wf-flat"), push = q(".wf-push"), lock = q(".wf-lock"), key = q(".wf-key"), glow = q(".wf-glow");
          var liq = qa(".wf-liq"), bl = q(".wf-bl"), bloom = q(".wf-bloom"), flash = q(".wf-flash"), rule = q(".wf-rule");
          var fl = qa(".wf-flare div"), R = MT.ramp, mod = function (a, b) { return ((a % b) + b) % b; };
          // the burst must cover the farthest corner from the word centre (upstream 1580 px for 1121 px)
          var reach = (Math.hypot(FW / 2, Math.max(CY, FH - CY)) / 1121) * 1500;

          function render(t) {
            var f = Math.round(t * 30 * 1000) / 1000, i; // frames at 30 fps, as upstream
            var isDark = f < 50;
            dark.style.opacity = isDark ? 1 : 0;
            flat.style.opacity = isDark ? 0 : 1;
            var charge = R(t, CFG.charge, CFG.chargeDur, "exit"), flare = R(t, CFG.charge, CFG.flareDur, "exit"), b = 1 + CFG.bright * charge;
            if (isDark) {
              push.style.transform = "scale(" + (1 + CFG.pushTo * R(t, 0, CFG.pushDur, "smooth")).toFixed(5) + ")";
              key.style.setProperty("--ky", "20%");
              key.style.setProperty("--kl", (0.55 * (1 + 0.6 * 0.12 * Math.sin(f / 38))).toFixed(4));
              glow.style.setProperty("--ga", (0.28 + 0.25 * charge).toFixed(3));
              var sh = R(t, CFG.sheen, CFG.sheenDur, "swift"), sx = MT.mix(-30, 130, sh), flow = ((f * 1.1) % 300).toFixed(2) + "% 0";
              var shv = sh > 0 && sh < 1 ? "linear-gradient(105deg, transparent " + (sx - 10).toFixed(2) + "%, color-mix(in srgb, white 85%, transparent) " + sx.toFixed(2) + "%, transparent " + (sx + 10).toFixed(2) + "%)" : "";
              for (i = 0; i < liq.length; i++) {
                liq[i].style.setProperty("--wf-sh", shv || null);
                liq[i].style.backgroundPosition = "0 0, 0 0, 0 0, " + flow;
                liq[i].style.filter = b > 1.001 ? "brightness(" + b.toFixed(3) + ") saturate(" + (1 / Math.sqrt(b)).toFixed(3) + ")" : "";
              }
              bl.style.backgroundPosition = flow;
              bloom.style.opacity = (0.42 + 0.4 * charge).toFixed(3);
              // flare: soft halo, 4px core fading at both ends, wide glow; all open from the word centre
              var spec = [[1.146, 48, 0.55], [1.042, 4, 0.95], [0.9375, 180, 0.45]];
              for (i = 0; i < 3; i++) {
                var w = spec[i][0] * FW * flare, h = spec[i][1] * s1, a = (spec[i][2] * flare * 100).toFixed(1);
                fl[i].style.cssText = "left:" + (FW / 2 - w / 2).toFixed(1) + "px;width:" + w.toFixed(1) + "px;top:" + (CY - h / 2).toFixed(1) + "px;height:" + h.toFixed(1) + "px;opacity:" + (flare > 0 ? 1 : 0) + ";background:" +
                  (i === 1 ? "linear-gradient(90deg, transparent 0%, color-mix(in srgb, white " + a + "%, transparent) 50%, transparent 100%)"
                    : "radial-gradient(ellipse 50% 50% at 50% 50%, color-mix(in srgb, color-mix(in srgb, var(--k-accent-2), white " + (i ? 80 : 88) + "%) " + a + "%, transparent) 0%, transparent " + (i ? 70 : 100) + "%)");
              }
              for (i = 0; i < motes.length; i++) {
                var m = motes[i], tw = 0.5 + 0.5 * Math.sin(f / (14 + m.z * 20) + i);
                m.el.style.left = mod(m.x * FW + f * 0.2 * (0.4 + m.z) * s1, FW - m.sz).toFixed(1) + "px";
                m.el.style.top = mod(m.y * FH - f * 0.06 * (0.5 + m.z) * s1, FH - m.sz).toFixed(1) + "px";
                m.el.style.opacity = ((0.25 + 0.75 * tw) * (0.3 + m.z * 0.7)).toFixed(3);
              }
              g1(t);
            } else {
              var sc = MT.mix(CFG.focusFrom, 1, R(t, CFG.focus, CFG.focusDur, "snappy")) * (1 + CFG.holdTo * R(t, CFG.hold, CFG.holdDur, "smooth"));
              lock.style.transform = "scale(" + sc.toFixed(5) + ")";
              rule.style.transform = "scaleX(" + R(t, CFG.rule, CFG.ruleDur, "snappy").toFixed(4) + ")";
              var mp = R(t, CFG.mark, CFG.markDur, "snappy"), cp = R(t, CFG.cut, CFG.cutDur, "snappy");
              mk.style.clipPath = "inset(" + (50 * (1 - mp)).toFixed(2) + "%)"; // the frame opens from its centre
              if (dot) { dot.style.transform = "scale(" + cp.toFixed(4) + ")"; bar.style.transform = "scaleX(" + cp.toFixed(4) + ")"; }
              g2(t);
            }
            // the white: a burst from the word centre (t^2, faster and faster), pure white 50-54, then the exposure falls
            var burst = Math.pow(MT.clamp((t - CFG.flash) / (CFG.white - CFG.flash), 0, 1), 2);
            if (isDark) {
              flash.style.background = "radial-gradient(circle " + ((80 * s1) + burst * reach).toFixed(1) + "px at 50% " + CY.toFixed(1) + "px, white 0%, color-mix(in srgb, white " + ((0.6 + 0.4 * burst) * 100).toFixed(1) + "%, transparent) 55%, transparent 100%)";
              flash.style.opacity = t < CFG.flash ? 0 : Math.min(1, burst * 1.4).toFixed(3);
            } else {
              flash.style.background = "white";
              flash.style.opacity = (f < 54 ? 1 : 1 - R(t, CFG.recover, CFG.recoverDur, "out")).toFixed(4);
            }
          }

          var tl = MT.scene(CFG.slot, render);
          kReveal(tl, units, "rise", CFG.tag, { each: CFG.tagEach, gap: CFG.tagGap });
          window.__timelines["white-flash-simplify"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

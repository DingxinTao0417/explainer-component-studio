<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"num","type":"string","label":"序号（1–2 位）","default":"02"},
    {"id":"title","type":"string","label":"章节标题","default":"把任务拆成小步"},
    {"id":"sub","type":"string","label":"标题下的一行（可空）","default":"一次只让它做一件事"},
    {"id":"drift","type":"number","label":"序号在整段里滑过的距离（px，负数向左）","default":-170,"min":-400,"max":400,"step":10},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>chapter-numeral · 巨大序号章节</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="chapter-numeral-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .chn { position: absolute; inset: 0; }
        .chn-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .chn-num { position: absolute; right: 70px; top: 0; display: block; height: 1080px; line-height: 1060px; font-size: 1280px; font-weight: 900; letter-spacing: -0.05em; white-space: nowrap; color: var(--k-ink); opacity: 0.1; }
        .chn-num::before { content: attr(data-d); }
        .chn-fore { position: absolute; left: 140px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
        .chn-mask { display: block; overflow: hidden; padding: 6px 0; }
        .chn-title { display: block; font-size: 168px; font-weight: 900; line-height: 1.25; letter-spacing: 0.02em; white-space: nowrap; }
        .chn-rule { display: block; width: 180px; height: 14px; margin: 28px 0 44px; border-radius: 7px; background: var(--k-accent); }
        .chn-sub { display: block; font-size: 72px; font-weight: 600; line-height: 1.3; white-space: nowrap; color: var(--k-muted); }
      </style>

      <div id="root" data-composition-id="chapter-numeral" data-width="1920" data-height="1080">
        <div class="chn">
          <div class="chn-bg"></div>
          <span class="chn-num" data-d="02"></span>
          <div class="chn-fore">
            <span class="chn-mask"><span class="chn-title">把任务拆成小步</span></span>
            <span class="chn-rule"></span>
            <span class="chn-sub">一次只让它做一件事</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { span: 4, numAlpha: 0.1, numFade: 0.7, titleAt: 0.45, titleDur: 0.55, ruleGap: 0.3, ruleDur: 0.4, subGap: 0.5 };
          var v = { num: "02", title: "把任务拆成小步", sub: "一次只让它做一件事", drift: -170, backdrop: "on" };
          try {
                      var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
                      for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
                    } catch (e) {}
          var root = document.querySelector(".chn");
          var q = function (s) { return root.querySelector(s); };
          // the numeral is texture, not copy: it is drawn through ::before so it is not treated as a text block
          q(".chn-num").setAttribute("data-d", String(v.num));
          q(".chn-title").textContent = String(v.title);
          var sub = q(".chn-sub");
          if (got && got.sub === "") { sub.style.display = "none"; } else { sub.textContent = String(v.sub); }
          if (String(v.backdrop) === "off") q(".chn-bg").style.display = "none";
          var drift = parseFloat(v.drift);
          if (!isFinite(drift)) drift = -170;

          var tl = gsap.timeline({ paused: true });
          // the numeral never stops: constant speed for the whole slot, so the frame is still alive after the title lands
          tl.fromTo(q(".chn-num"), { x: -drift / 2 }, { x: drift / 2, duration: CFG.span, ease: "none" }, 0);
          tl.fromTo(q(".chn-num"), { opacity: 0 }, { opacity: CFG.numAlpha, duration: CFG.numFade, ease: "power1.out" }, 0);
          // foreground arrives in reading order: title, then the short rule, then the sub line
          tl.fromTo(q(".chn-title"), { yPercent: 108 }, { yPercent: 0, duration: CFG.titleDur, ease: "power3.out" }, CFG.titleAt);
          tl.set(q(".chn-rule"), { transformOrigin: "0% 50%" }, 0);
          tl.fromTo(q(".chn-rule"), { scaleX: 0 }, { scaleX: 1, duration: CFG.ruleDur, ease: "power2.out" }, CFG.titleAt + CFG.ruleGap);
          tl.fromTo(sub, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, CFG.titleAt + CFG.subGap);
          window.__timelines["chapter-numeral"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

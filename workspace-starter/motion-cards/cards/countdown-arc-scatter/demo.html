    if (off) [".ca-bg", ".ca-vig", ".ca-grain"].forEach(function (s) { q(s).style.display = "none"; });
    else grain = kGrain(q(".ca-grain"), { opacity: dark ? 0.09 : 0.05 });
    // a host font (--mc-font) wins over the built-in bold face
    if (getComputedStyle(root).getPropertyValue("--mc-font").trim()) root.style.setProperty("--ca-f", "var(--k-font)");
    var txt = function (x) { return String(x == null ? "" : x).replace(/\s+/g, " ").trim(); };

    // corner labels: empty hides them
    var lab = q(".ca-lab"), wm = q(".ca-wm");
    if (txt(v.label)) lab.textContent = txt(v.label); else lab.style.display = "none";
    if (txt(v.name)) { q(".ca-nm").textContent = txt(v.name); } else wm.style.display = "none";
    var note = q(".ca-note"), nt = txt(v.note);
    if (!nt) note.style.display = "none";
    else if (/^[$>] /.test(nt)) { note.innerHTML = '<span class="ca-dl"></span>'; note.firstChild.textContent = nt.charAt(0); note.appendChild(document.createTextNode(nt.slice(1))); }
    else note.textContent = nt;

    // the number list; the hero sits at angle 0, so the spring stops it on the crest
    var nums = String(v.nums).split("|").map(txt).filter(Boolean), hv = txt(v.hero) || "5";
    var HI = nums.lastIndexOf(hv);
    if (HI < 0) { HI = Math.min(6, nums.length); nums.splice(HI, 0, hv); }

    // title: the slot holds the hero (same font, so the flying number lands glyph on glyph), then the words
    var title = q(".ca-title"), slot = q(".ca-slot"), ws = q(".ca-ws");
    slot.textContent = hv;
    var words = kSplit(ws, "word", 0, v.title);
    if (!words.length) ws.style.display = "none";
    var fit = kFit(title, L.fit);
    var TF = fit.size, last = words[words.length - 1];
    var wb = function (u, k) {
      var s = CFG.words + k * CFG.wordEach;
      return { s: s, d: u === last ? CFG.lastDur : CFG.wordDur };
    };
    var tint0 = words.length ? wb(last, words.length - 1).s + CFG.tintLag : CFG.fly + CFG.flyDur;
    var note0 = tint0 - CFG.noteLead;

    // slot centre in wrapper px (the preview may scale the whole stage: divide it out)
    var rr = root.getBoundingClientRect(), sc = rr.width / (root.offsetWidth || 1), sr = slot.getBoundingClientRect();
    var SX = (sr.left + sr.width / 2 - rr.left) / sc, SY = (sr.top + sr.height / 2 - rr.top) / sc;

    // dial geometry
    var CX = FW / 2, R = L.R * K, CY = L.top * FH + R, D2R = Math.PI / 180;
    var polar = function (a, r) { return [CX + Math.sin(a * D2R) * r, CY - Math.cos(a * D2R) * r]; };
    var winOp = function (pa) { return Math.min(1, Math.max(0, (CFG.win - Math.abs(pa)) / CFG.winSoft)); };
    var rotAt = function (t) {
      if (t <= CFG.wind) return CFG.from + CFG.windDeg * MT.ramp(t, 0, CFG.wind, "swift");
      return (CFG.from + CFG.windDeg) * (1 - MT.spring({ t: t, delay: CFG.wind, damping: CFG.damping, stiffness: CFG.stiffness }));
    };
    var flyAt = function (t) { return MT.ramp(t, CFG.fly, CFG.flyDur, "swift"); };
    var outAt = function (t) { return MT.ramp(t, CFG.out, CFG.outDur, "swift"); };
    var NS = L.num * K;
    function numState(i, t) {
      var pa = (i - HI) * CFG.spacing + rotAt(t), p = polar(pa, R), s = { x: p[0], y: p[1], r: pa, op: winOp(pa), z: NS / TF };
      if (i === HI) {
        var h = flyAt(t);
        s.x = MT.mix(s.x, SX, h); s.y = MT.mix(s.y, SY, h); s.r *= 1 - h; s.z = MT.mix(NS, TF, h) / TF; s.op = Math.max(s.op, h); s.h = h;
      } else s.op *= 1 - outAt(t);
      return s;
    }

    // the dial: outer hairline arc and crest marker (static in the HTML), ticks and hand drawn per frame
    var arcSvg = q(P ? ".ca-arcP" : ".ca-arcL"), a0 = polar(-L.arcSpan, L.arc * K), a1 = polar(L.arcSpan, L.arc * K), ay = CY - L.arc * K, f2 = function (n) { return n.toFixed(1); };
    arcSvg.setAttribute("viewBox", "0 0 " + FW + " " + FH);
    arcSvg.firstChild.setAttribute("d", "M" + f2(a0[0]) + " " + f2(a0[1]) + "A" + f2(L.arc * K) + " " + f2(L.arc * K) + " 0 0 1 " + f2(a1[0]) + " " + f2(a1[1]));
    arcSvg.lastChild.setAttribute("d", "M" + f2(CX - 13 * K) + " " + f2(ay + 8 * K) + "L" + f2(CX + 13 * K) + " " + f2(ay + 8 * K) + "L" + f2(CX) + " " + f2(ay + 30 * K) + "Z");
    var dial = q(".ca-dial"), NSV = "http://www.w3.org/2000/svg", ticks = [];
    dial.setAttribute("viewBox", "0 0 " + FW + " " + FH);
    for (var j = 0; j < 61; j++) {
      var ln = document.createElementNS(NSV, "line"), a = (j - 30) * 4 - 48, major = a % CFG.spacing === 0;
      ln.setAttribute("stroke-linecap", "round");
      ln.setAttribute("stroke-width", (major ? 3 : 1.5) * K);
      ln.style.stroke = "var(--k-ink)";
      dial.appendChild(ln);
      ticks.push({ el: ln, a: a, r0: L.ticks[major ? 0 : 1] * K, op: major ? 0.7 : 0.28 });
    }
    var hand = document.createElementNS(NSV, "line");
    hand.setAttribute("class", "ca-hand"); hand.setAttribute("stroke-width", 6 * K); hand.setAttribute("stroke-linecap", "round");
    dial.appendChild(hand);

    // numbers: each in its own small box so the motion blur stays local (upstream SpeedBlur box 360px)
    var B = 240 * K, layer = q(".ca-nums");
    var dig = nums.map(function (n, i) {
      var box = document.createElement("div"), el = document.createElement("div");
      box.className = "ca-nb"; box.style.width = box.style.height = B + "px";
      el.className = "ca-n"; el.textContent = n; el.style.fontSize = (i === HI ? TF : NS) + "px";
      // the hero crosses the first word while that word is still fading in (upstream path): intended
      if (i === HI) el.setAttribute("data-layout-allow-overlap", "");
      box.appendChild(el); layer.appendChild(box);
      return { box: box, el: el, blur: kSpeedBlur(box, "ca", { amount: CFG.blurAmt, max: CFG.blurMax }) };
    });

    var stage = q(".ca-stage"), rule = q(".ca-rule"), arcs = [].slice.call(root.querySelectorAll(".ca-arc"));
    var E = 0.5 / 30; // half a frame, for the centred-difference velocity
    var tl = MT.scene(CFG.dur, function (t) {
      var rot = rotAt(t), out = outAt(t), fin = MT.ramp(t, 0, CFG.frameIn, "out");
      stage.style.transform = "scale(" + (1 + CFG.push * MT.ramp(t, 0, CFG.pushDur, "smooth")).toFixed(5) + ")";
      rule.style.transform = "scaleX(" + fin.toFixed(4) + ")";
      lab.style.opacity = wm.style.opacity = fin;
      arcs.forEach(function (s) { s.style.opacity = ((1 - out * 0.65) * fin).toFixed(4); });
      dial.style.opacity = 1 - out;
      ticks.forEach(function (k) {
        var pa = k.a + rot, op = winOp(pa), p0 = polar(pa, k.r0), p1 = polar(pa, L.ticks[2] * K);
        k.el.style.display = op > 0 ? "" : "none";
        k.el.setAttribute("x1", f2(p0[0])); k.el.setAttribute("y1", f2(p0[1]));
        k.el.setAttribute("x2", f2(p1[0])); k.el.setAttribute("y2", f2(p1[1]));
        k.el.style.strokeOpacity = (op * k.op).toFixed(3);
      });
      var h0 = polar(rot * CFG.handRatio, L.hand[0] * K), h1 = polar(rot * CFG.handRatio, L.hand[1] * K);
      hand.setAttribute("x1", f2(h0[0])); hand.setAttribute("y1", f2(h0[1]));
      hand.setAttribute("x2", f2(h1[0])); hand.setAttribute("y2", f2(h1[1]));
      var landed = false;
      dig.forEach(function (d, i) {
        var s = numState(i, t);
        if (s.h >= 1) landed = true;
        if (s.op <= 0.002 || s.h >= 1) { d.box.style.display = "none"; return; }
        var a = numState(i, t - E), b = numState(i, t + E);
        d.box.style.display = "";
        d.box.style.transform = "translate(" + f2(s.x - B / 2) + "px," + f2(s.y - B / 2) + "px)";
        d.el.style.opacity = s.op.toFixed(3);
        d.el.style.transform = "translate(-50%,-50%) rotate(" + s.r.toFixed(3) + "deg)" + (i === HI ? " scale(" + s.z.toFixed(4) + ")" : "");
        d.el.style.filter = i !== HI && out > 0.01 ? "blur(" + (out * CFG.scatterBlur * K).toFixed(2) + "px)" : "";
        d.blur((b.x - a.x) * 30, (b.y - a.y) * 30);
      });
      // the hero hands over to its slot on the landing frame, where both coincide
      slot.style.opacity = landed ? 1 : 0;
      words.forEach(function (u, k) {
        var w = wb(u, k), p = MT.ramp(t, w.s, w.d, "out");
        u.style.opacity = p;
        u.style.transform = "translateY(" + ((1 - p) * CFG.wordRise).toFixed(3) + "em)";
        u.style.filter = p < 0.999 ? "blur(" + ((1 - p) * CFG.wordBlur * TF / 150).toFixed(2) + "px)" : "";
      });
      if (last) last.style.color = "color-mix(in srgb, var(--k-accent) " + (MT.ramp(t, tint0, CFG.tintDur, "swift") * 100).toFixed(1) + "%, var(--k-ink))";
      var c = MT.ramp(t, note0, CFG.noteDur, "snappy");
      note.style.opacity = c;
      note.style.transform = "translateY(" + ((1 - c) * 24 * K).toFixed(2) + "px)";
      if (grain) grain(t);
    });
    window.__timelines["countdown-arc-scatter"] = tl;
  })();
</script>
</template>

              if (sd < 0.35) { outer.style.filter = outer.style.transform = inner.style.transform = ""; return; }
              var deg = (Math.atan2(vy, vx) * 180) / Math.PI;
              fe.setAttribute("stdDeviation", sd.toFixed(2) + " 0");
              outer.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
              inner.style.transform = "rotate(" + (-deg).toFixed(2) + "deg)";
              outer.style.filter = "url(#" + id + ")";
            };
          }
          // ==== end kit:speedblur ====
          
          // ==== kit:grain@1 ====
          function kGrain(layer, o) {
            o = o || {};
            var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
            var dark = tones && tones.getAttribute("data-tone") === "dark";
            var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
              var f = "type='linear' slope='2.4' intercept='-0.7'";
              var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
                "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
                "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
                "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
                "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
              return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
            });
            layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
            layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
            layer.style.backgroundSize = size + "px " + size + "px";
            return function (t) {
              var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
              layer.style.backgroundImage = tiles[k % 6];
              layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
            };
          }
          // ==== end kit:grain ====
          var root = document.querySelector(".re");
          var q = function (s, p) { return (p || root).querySelector(s); };
          var qa = function (s, p) { return [].slice.call((p || root).querySelectorAll(s)); };
          var FW = root.clientWidth, FH = root.clientHeight;
          if (!FW || !FH) {
            // not laid out yet: the host clip's declared size, then the window
            var hc = root.closest("[data-width][data-height]");
            FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          var P = FH > FW, L = P ? PORT : LAND;
          root.setAttribute("data-orient", P ? "portrait" : "landscape");
          var tone = kTone(root), dark = tone === "dark";
          if (String(v.backdrop) === "off") root.setAttribute("data-off", "");

          // ---- text: variables replace the defaults; an empty optional field hides its whole block ----
          var S = function (k) { return String(v[k]).trim(); };
          var list = function (s, n) { return s.split("|").map(function (x) { return x.trim(); }).filter(Boolean).slice(0, n); };
          var put = function (el, text) { el.textContent = text; el.style.display = text ? "" : "none"; };
          var h1 = q(".re-h1"), ds = q(".re-ds"), view = q(".re-view"), page = q(".re-page");
          put(h1, S("title")); put(ds, S("desc")); put(q(".re-nm"), S("name"));
          var tabs = q(".re-tabs"), tl = list(S("tabs"), 4);
          tabs.innerHTML = ""; tl.forEach(function (t) { var s = document.createElement("span"); s.className = "re-tab"; s.textContent = t; tabs.appendChild(s); });
          tabs.style.display = tl.length ? "" : "none";
          var cl = String(v.cols).split("|").map(function (x) { return x.trim(); });
          qa(".re-th span").forEach(function (s, i) { s.textContent = cl[i] || ""; });
          var items = list(S("rows"), L.rows); if (!items.length) items = ["整理参考资料"];
          var lst = q(".re-list"), slots = qa(".re-slot");
          while (slots.length > items.length) lst.removeChild(slots.pop());
          while (slots.length < items.length) { var cn = slots[0].cloneNode(true); lst.appendChild(cn); slots.push(cn); }
          // layout-check exemptions: a flying row passes over the rows and table head already on the page, on purpose
          var allow = function (el) { el.setAttribute("data-layout-allow-occlusion", ""); el.setAttribute("data-layout-allow-overlap", ""); };
          qa(".re-th span, .re-tab").forEach(allow);
          slots.forEach(function (s, i) {
            q(".re-no", s).textContent = i + 1; q(".re-ti", s).textContent = items[i];
            put(q(".re-su", s), S("sub")); put(q(".re-me", s), S("meta")); put(q(".re-pill", s), S("status"));
            qa(".re-no, .re-ti, .re-su, .re-me, .re-pill", s).forEach(allow);
          });
          // ---- fit the text slots, then freeze each slot at its row's height ----
          kFit(h1, { lines: L.titleLines, min: L.titleMin }); kFit(ds, { lines: L.descLines, min: 40 });
          slots.forEach(function (s) {
            kFit(q(".re-ti", s), { lines: 1, min: 40 }); kFit(q(".re-su", s), { lines: 1, min: 40 });
            s.style.height = q(".re-face", s).offsetHeight + "px";
          });
          // ---- the camera, measured from the page: the page is bigger than the frame by design ----
          var last = slots[slots.length - 1], hdTop = q(".re-hd").offsetTop;
          var rb = lst.offsetTop + last.offsetTop + last.offsetHeight;
          var z1 = L.z1, z0 = L.z0, cyF;
          if (P) {
            z1 = Math.min(L.z1, (L.band * FH) / (rb - hdTop)); z0 = Math.min(L.z0, z1);
            cyF = hdTop + (FH / 2 - L.hdY * FH) / z1;
          } else {
            cyF = rb - (L.rbY * FH - FH / 2) / z1;
          }
          var cam = kPageCam(view, page, [
            { t: 0, cx: FW / 2, cy: cyF - L.pan, zoom: z0 },
            { t: CFG.cam, cx: FW / 2, cy: cyF, zoom: z1 }
          ]);
          var grain = kGrain(q(".re-grain"), { opacity: 0.035 });
          // ---- one set of parts per row; the speed blur wraps each row's face ----
          var parts = slots.map(function (s) {
            var fly = q(".re-fly", s); fly.className += " re-ab";
            return { fly: fly, face: q(".re-face", s), dash: q(".re-dash", s), ct: q(".re-ct", s), seam: q(".re-seam", s), sb: kSpeedBlur(fly, "re", { amount: 0.22, max: 3.2 }) };
          });
          var sc = dark ? 2.6 : 1;
          var C = function (a) { return "color-mix(in srgb, var(--re-shade) " + (Math.min(1, a * sc) * 100).toFixed(1) + "%, transparent)"; };
          var X = function (n) { return n.toFixed(1) + "px"; };
          var FLYE = "cubic-bezier(0.5,0,0.8,0.75)"; // downward flight keeps its speed into the slot
          var clamp = { extrapolateLeft: "clamp", extrapolateRight: "clamp" };
          var airAt = function (t, cue) { return 1 - MT.interpolate(t, [cue, cue + CFG.fly], [0, 1], { easing: FLYE, extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };

          function render(t) {
            cam(t); grain(t);
            parts.forEach(function (r, i) {
              var cue = CFG.cues[i], land = cue + CFG.fly, tail = land + CFG.press;
              var inAir = t >= cue && t < tail;
              if (inAir) {
                var air = airAt(t, cue), p = 1 - air, f = r.fly.style;
                var sc2 = t < land ? 1.06 - 0.065 * p : MT.interpolate(t, [land, tail], [0.995, 1], { easing: "power1.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
                f.opacity = MT.interpolate(t, [cue, cue + CFG.appear], [0, 1], clamp);
                f.transform = "perspective(900px) translateY(" + (-120 * air).toFixed(2) + "px) rotateX(" + (16 * air).toFixed(3) + "deg) scale(" + sc2.toFixed(4) + ")";
                r.face.style.boxShadow =
                  "inset 0 1px 0 color-mix(in srgb, white " + ((dark ? 30 : 90) * air).toFixed(1) + "%, transparent), 0 0 0 1px " + C(0.07 * air) +
                  ", 0 " + X(34 * air) + " " + X(64 * air) + " -" + X(10 * air) + " " + C(0.24 * air) + ", 0 " + X(6 * air) + " " + X(14 * air) + " " + C(0.1 * air);
                var vy = t < land ? 120 * (airAt(t - 1 / 60, cue) - airAt(t + 1 / 60, cue)) * 30 : 0;
                r.sb(0, vy);
                var near = MT.interpolate(air, [0, 0.5], [1, 0], clamp);
                var cop = t < land ? near * 0.5 : MT.interpolate(t, [land, land + 0.1], [0.5, 0], clamp);
                r.ct.style.opacity = 1;
                r.ct.style.boxShadow = "0 " + X(2 + 6 * air) + " " + X(6 + 18 * air) + " " + C(0.22 * cop);
              } else {
                r.fly.style.opacity = t < cue ? 0 : "";
                r.fly.style.transform = "";
                r.face.style.boxShadow = "";
                r.sb(0, 0);
                r.ct.style.opacity = 0;
              }
              // the empty slot box, brightening as the row comes, gone 2 f after it lands
              var hint = MT.interpolate(t, [cue - CFG.hintLead, cue - CFG.hintLead + CFG.hintDur], [0.55, 1], clamp);
              r.dash.style.opacity = (MT.interpolate(t, [land, land + CFG.dashFade], [1, 0], clamp) * hint).toFixed(3);
              // embed seam: accent line on the bottom edge spreads from the centre, then fades
              if (t >= land && t < land + CFG.seamFade) {
                r.seam.style.opacity = MT.interpolate(t, [land, land + 0.067, land + CFG.seamFade], [1, 1, 0], clamp).toFixed(3);
                r.seam.style.transform = "scaleX(" + MT.interpolate(t, [land, land + CFG.seamSpread], [0, 1], { easing: "power3.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" }).toFixed(4) + ")";
              } else { r.seam.style.opacity = 0; r.seam.style.transform = "scaleX(0)"; }
            });
          }
          var tl2 = MT.scene(CFG.dur, render);
          window.__timelines["row-embed"] = tl2;
        })();
      </script>
    </div>
    </template>
  </body>
</html>

var root = document.querySelector(".fz");
var q = function (s) { return root.querySelector(s); };
var FW = root.clientWidth, FH = root.clientHeight;
if (!FW || !FH) {

  var hc = root.closest("[data-width][data-height]");

  FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;

var P = FH > FW, L = P ? PORT : LAND, K = L.k;
root.setAttribute("data-orient", P ? "portrait" : "landscape");
kTone(root);
if (String(v.backdrop) === "off") q(".fz-stage").style.display = "none";

// ---- cards: i = 2..8 on the rail (the static page holds 4, 5, 6); card i shows image pick - 1 + (i - 5)
var IM = String(v.srcs).split("|").map(function (s) { return s.trim(); }).filter(Boolean);
if (!IM.length) for (var j = 1; j <= 8; j++) IM.push(DEF + j + ".jpg");

var rail = q(".fz-rail"), stat = [].slice.call(rail.children), cards = [], tgt = stat[1], pin = q(".fz-pin");
for (var i = 2; i <= 8; i++) {
  var c = i >= 4 && i <= 6 ? stat[i - 4] : rail.appendChild(stat[0].cloneNode(true));
  c.style.setProperty("--i", i);
  c.firstChild.style.backgroundImage = 'url("' + IM[(((pick + i - CFG.target) % n) + n) % n].replace(/["\\]/g, "\\$&") + '")';
  c.style.setProperty("--w", ((200 + ((i * 53) % 140)) / 6).toFixed(1) + "%");
  cards.push(c);
}

// ---- text: note rises word by word (kSplit -> kFit); the remark is set verbatim (it does not animate, and

if (sub) { q(".fz-by").textContent = sub.replace(/\s*\|\s*/g, " "); kFit(q(".fz-by"), { min: 40, width: L.subW }); }
else q(".fz-sub").style.display = "none";

  units = kSplit(say, "word", true, note);
  var fs = kFit(say, { lines: L.lines, min: 48, width: L.noteW }).size;

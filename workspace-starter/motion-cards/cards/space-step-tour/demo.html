  function kSplit(el, by, rise, text) {

    var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
    el.textContent = "";
    parts.forEach(function (p) {
      var u = document.createElement("span"), box = u;
      u.className = "sp-u"; u.textContent = p.t;
      if (by === "line") u.style.display = "block";
      if (!p.t.trim()) { el.appendChild(u); return; }
      if (rise) { box = document.createElement("span"); box.className = "sp-cut"; box.style.display = u.style.display; box.appendChild(u); }
      el.appendChild(box);
      if (p.sp) el.appendChild(document.createTextNode(" "));
      units.push(u);
    });
    return units;
  }
  function kReveal(tl, units, variant, at, o) {
    o = o || {};
    var each = o.each || 0.6, gap = o.gap != null ? o.gap : 0.053, ease = o.ease || "snappy";
    units.forEach(function (u, i) {
      var t0 = at + i * gap, fs = parseFloat(getComputedStyle(u).fontSize) || 40;
      if (variant === "rise") {
        tl.set(u, { opacity: 0 }, 0).set(u, { opacity: 1 }, t0);
        tl.fromTo(u, { y: u.offsetHeight * 1.05 + fs * 0.3 }, { y: 0, duration: each, ease: ease }, t0);
      }
    });
    return tl;
  }
  // ==== end kit:text ====

  // ==== kit:fit@1 (no kRows) ====
  function kFit(el, o) {
    o = o || {};
    var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
    var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
    for (;;) {
      el.style.fontSize = f + "px";
      m = kLines(el);
      if ((m.w <= W && m.n <= n) || f <= min) break;
      f = Math.max(min, f - 2);
    }
    if (m.w > W) {
      [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
      m = kLines(el);
    }
    return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
  }
  function kLines(el) {
    var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
    var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
    while ((t = it.nextNode())) {
      if (!t.data.trim()) continue;
      r.selectNodeContents(t);
      [].forEach.call(r.getClientRects(), function (b) {
        var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
        if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
        row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
      });
    }
    return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
  }
  // ==== end kit:fit ====

  // ==== kit:speedblur@1 ====
  function kSpeedBlur(box, prefix, o) {
    o = o || {};
    var amount = o.amount || 0.45, max = o.max || 36;
    var id = prefix + "-sb" + (window.__kxN = (window.__kxN || 0) + 1);
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
    svg.innerHTML = '<filter id="' + id + '" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>';
    var outer = document.createElement("div"), inner = document.createElement("div");
    outer.style.cssText = inner.style.cssText = "position:absolute;inset:0";
    while (box.firstChild) inner.appendChild(box.firstChild);
    outer.appendChild(inner); box.appendChild(svg); box.appendChild(outer);
    var fe = svg.firstChild.firstChild;
    return function (vx, vy) {
      vy = vy || 0;
      var sd = Math.min(max, (Math.sqrt(vx * vx + vy * vy) / 30) * amount);
      if (sd < 0.35) { outer.style.filter = outer.style.transform = inner.style.transform = ""; return; }
      var deg = (Math.atan2(vy, vx) * 180) / Math.PI;
      fe.setAttribute("stdDeviation", sd.toFixed(2) + " 0");
      outer.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
      inner.style.transform = "rotate(" + (-deg).toFixed(2) + "deg)";
      outer.style.filter = "url(#" + id + ")";
    };
  }
  // ==== end kit:speedblur ====

  kTone(root);
  var grain = null;
  if (String(v.backdrop) === "off") [".sp-backdrop", ".sp-key", ".sp-fill", ".sp-vig", ".sp-grain"].forEach(function (s) { q(s).style.display = "none"; });
  else grain = kGrain(q(".sp-grain"));

  // dust fixed in world space (upstream hash and ranges), so every bit of parallax comes from the camera
  var world = q(".sp-world");
  var hash = function (n) { var x = Math.sin(n * 91.345 + 47.853) * 43758.5453; return x - Math.floor(x); };
  for (var i = 0; i < 70; i++) {
    var m = document.createElement("div"), r = 3 + hash(i * 11.9 + 3) * 7;
    m.className = "sp-mote";
    m.style.cssText = "left:" + (-r).toFixed(1) + "px;top:" + (-r).toFixed(1) + "px;width:" + (2 * r).toFixed(1) + "px;height:" + (2 * r).toFixed(1) + "px;opacity:calc(" + (0.25 + hash(i * 13.1 + 4) * 0.55).toFixed(3) + " * var(--sp-mk));transform:translate3d(" +
      (-2600 + hash(i * 3.1) * 6800).toFixed(1) + "px," + (-2000 + hash(i * 5.7 + 1) * 4800).toFixed(1) + "px," + (-3200 + hash(i * 7.3 + 2) * 3600).toFixed(1) + "px)";
    world.insertBefore(m, world.firstChild);
  }

  // text: lay out flat at 1:1, fit, then hand the units to the timeline
  var list = function (s) { return String(s).split("|").map(function (x) { return x.trim(); }); };
  var steps = list(v.steps), notes = list(v.notes);
  root.classList.add("sp-flat");
  var cards = qa(".sp-card").map(function (el, i) {
    var t = el.querySelector(".sp-t"), b = el.querySelector(".sp-b");
    var units = kSplit(t, "char", true, steps[i] || "");
    kFit(t, { lines: 1, min: 96 });
    b.textContent = notes[i] || "";
    kFit(b, { lines: 2, min: 40 });
    return { el: el, units: units, b: b, edge: el.querySelector(".sp-edge"), on: el.querySelector(".sp-on") };
  });
  var pk = q(".sp-pk"), pt = q(".sp-pt"), ps = q(".sp-ps"), words = [];
  [[pk, v.kicker], [pt, v.title], [ps, v.sub]].forEach(function (p) { if (!String(p[1]).trim()) p[0].style.display = "none"; });
  pk.textContent = String(v.kicker).trim();
  if (kFit(pk, { lines: 1, min: 28 }).fits) pk.style.whiteSpace = "nowrap"; // the tracking tween must not re-wrap it
  if (String(v.title).trim()) { words = kSplit(pt, "word", true, v.title); kFit(pt, { lines: 1, min: 96 }); }
  ps.textContent = String(v.sub).trim();
  kFit(ps, { lines: 2, min: 40 });
  // card text turns with the world: rotated glyph boxes overlap their neighbours by design
  qa(".sp-world .sp-u, .sp-eye b, .sp-eye span, .sp-b, .sp-pk, .sp-ps").forEach(function (x) { x.setAttribute("data-layout-allow-overlap", ""); });
  root.classList.remove("sp-flat");
  var tl = MT.scene(CFG.slot, render);
  cards.forEach(function (c, i) { kReveal(tl, c.units, "rise", CFG.title[i], { each: CFG.tEach, gap: CFG.tGap }); });
  kReveal(tl, words, "rise", CFG.words, { each: CFG.wEach, gap: CFG.wGap });

  // the motion blur needs the world inside its two wrappers; the perspective moves onto the inner one
  var blur = kSpeedBlur(q(".sp-cam"), "sp", { amount: CFG.blur });
  world.parentNode.style.perspective = CFG.persp + "px";

  var FLY = MT.bezier(0.62, 0, 0.16, 1), R = MT.ramp;
  function camAt(t) {
    var c = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0, s: MT.mix(CFG.push, 1, R(t, 0, CFG.pushDur, "snappy")), af: 0 }, hop = 0, creep = 0;
    CFG.fly.forEach(function (w, i) {
      var u = R(t, w[0], w[1] - w[0], FLY);
      c.af += u;
      KEYS.forEach(function (k) { c[k] = MT.mix(c[k], POSES[i + 1][k], u); });
      if (i < 2 && u > 0 && u < 1) hop = CFG.hop * Math.sin(Math.PI * u);
    });
    for (var i = 0; i < 3; i++) creep += R(t, CFG.arrive[i] + CFG.creepLag, CFG.hold[i] - CFG.arrive[i], "smooth") * (1 - R(t, CFG.fly[i][0], CFG.creepOut, "smooth"));
    c.s *= (1 + hop) * (1 - CFG.creep * creep) * (1 - CFG.creep * R(t, CFG.endCreep, CFG.slot - CFG.endCreep, "smooth"));
    return c;
  }
  var f3 = function (n) { return n.toFixed(3); };
  var camT = function (c) { return "scale(" + (1 / c.s).toFixed(5) + ") rotateZ(" + f3(-c.rz) + "deg) rotateY(" + f3(-c.ry) + "deg) rotateX(" + f3(-c.rx) + "deg) translate3d(" + f3(-c.x) + "px," + f3(-c.y) + "px," + f3(-c.z) + "px)"; };
  var poseT = function (p) { return "translate3d(" + p.x + "px," + p.y + "px," + p.z + "px) rotateX(" + p.rx + "deg) rotateY(" + p.ry + "deg) rotateZ(" + p.rz + "deg) scale(" + p.s + ")"; };
  // screen offset of world point p seen by camera c: the same matrix order as camT, then the perspective divide
  // (CSS scale() leaves z alone)
  function proj(c, p) {
    var D = Math.PI / 180, x = p[0] - c.x, y = p[1] - c.y, z = p[2] - c.z, a, n;
    a = -c.rx * D; n = y * Math.cos(a) - z * Math.sin(a); z = y * Math.sin(a) + z * Math.cos(a); y = n;
    a = -c.ry * D; n = x * Math.cos(a) + z * Math.sin(a); z = -x * Math.sin(a) + z * Math.cos(a); x = n;
    a = -c.rz * D; n = x * Math.cos(a) - y * Math.sin(a); y = x * Math.sin(a) + y * Math.cos(a); x = n;
    var k = CFG.persp / (CFG.persp - z);
    return [(x / c.s) * k, (y / c.s) * k];
  }

  var key = q(".sp-key"), pp = q(".sp-pp");
  function render(t) {
    var f = t * 30; // frames at 30 fps
    if (grain) grain(t);
    key.style.opacity = ((1 + 0.072 * Math.sin(f / 38)) / 1.072).toFixed(3); // upstream breathe 0.6
    var c = camAt(t);
    world.style.transform = camT(c);
    // motion blur: how fast the world point now at the frame centre moved across the screen in the last 1/60 s
    var o = proj(camAt(t - 1 / 60), [c.x, c.y, c.z]);
    blur(-o[0] * 60, -o[1] * 60);
    var over = R(t, CFG.fly[2][0], CFG.fly[2][1] - CFG.fly[2][0], "smooth");
    cards.forEach(function (cd, i) {
      // focus by station distance; everything comes back (a little dimmed) for the overview
      var d = Math.min(1, Math.abs(c.af - i)), fo = Math.max(1 - d, over * 0.85), el = cd.el;
      el.style.transform = poseT(POSES[i]) + " translateZ(" + ((1 - d) * 18).toFixed(2) + "px)";
      el.style.opacity = (0.22 + 0.78 * fo).toFixed(3);
      el.style.filter = fo < 0.985 ? "blur(" + ((1 - fo) * 7).toFixed(2) + "px)" : "none";
      el.style.borderColor = "color-mix(in srgb, var(--k-ink) " + (8 + 8 * fo).toFixed(1) + "%, transparent)";
      cd.edge.style.opacity = (0.4 + 0.6 * fo).toFixed(3);
      var rv = CFG.title[i], ni = R(t, rv - CFG.numLead, CFG.numDur, "out"), bi = R(t, rv + CFG.bodyLag, CFG.bodyDur, "out");
      el.style.setProperty("--sp-no", ni.toFixed(3));
      el.style.setProperty("--sp-ny", ((1 - ni) * CFG.numRise).toFixed(1) + "px");
      cd.b.style.opacity = bi.toFixed(3);
      cd.b.style.transform = "translateY(" + ((1 - bi) * CFG.bodyRise).toFixed(1) + "px)";
      cd.on.style.width = (R(t, CFG.arrive[i], CFG.hold[i] - CFG.arrive[i], "smooth") * 100).toFixed(2) + "%";
      cd.on.style.boxShadow = "0 0 " + (10 * fo).toFixed(1) + "px color-mix(in srgb, var(--k-accent) 60%, transparent)";
    });
    pp.style.opacity = R(t, CFG.plateIn, CFG.plateDur, "out").toFixed(3);
    var kk = R(t, CFG.kick, CFG.kickDur, "snappy"), si = R(t, CFG.sub, CFG.subDur, "out");
    pk.style.opacity = kk.toFixed(3);
    pk.style.letterSpacing = MT.mix(CFG.track[0], CFG.track[1], kk).toFixed(3) + "em";
    ps.style.opacity = si.toFixed(3);
    ps.style.transform = "translateY(" + ((1 - si) * CFG.subRise).toFixed(1) + "px)";
  }
  window.__timelines["space-step-tour"] = tl;
})();
</script>
    </template>

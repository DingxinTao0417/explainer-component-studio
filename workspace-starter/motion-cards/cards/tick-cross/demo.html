<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"items","type":"string","label":"条目，用 | 隔开（留空则只画记号）","default":"先列提纲再动笔|想到哪里写到哪里|放一晚再改一遍|第一稿就要完美"},
    {"id":"marks","type":"string","label":"每条的记号：v 是勾，x 是叉，用逗号隔开","default":"v,x,v,x"},
    {"id":"x","type":"number","label":"第一个记号左上角 x（1920×1080 坐标）","default":380,"min":0,"max":1920,"step":1},
    {"id":"y","type":"number","label":"第一行顶边 y","default":100,"min":0,"max":1080,"step":1},
    {"id":"pitch","type":"number","label":"行距（像素）","default":220,"min":110,"max":400,"step":5},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>tick-cross · 打勾打叉</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="tick-cross-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .tc { position: absolute; inset: 0; }
        .tc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .tc-list { position: absolute; left: 380px; top: 100px; }
        .tc-row { display: flex; align-items: center; height: 220px; padding-left: 236px; font-size: 116px; font-weight: 700; white-space: nowrap; }
        .tc-svg { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; }
        .tc-ink { fill: var(--k-accent); stroke: rgba(13, 16, 22, 0.78); stroke-width: 6; stroke-linejoin: round; paint-order: stroke; }
        .tc-rev { fill: none; stroke: #fff; stroke-linecap: butt; stroke-linejoin: round; }
      </style>

      <div id="root" data-composition-id="tick-cross" data-width="1920" data-height="1080">
        <div class="tc">
          <div class="tc-bg"></div>
          <div class="tc-list">
            <div class="tc-row">先列提纲再动笔</div>
            <div class="tc-row">想到哪里写到哪里</div>
            <div class="tc-row">放一晚再改一遍</div>
            <div class="tc-row">第一稿就要完美</div>
          </div>
          <svg class="tc-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
        </div>
      </div>

      <script>
        (function () {
          // step: time from one row's mark to the next · tick: one flick · slash: each of the two strokes of a cross · lift: pen-up between them
          // dim: what a crossed-out row fades to, and how long that takes · size: the square a mark is drawn in
          var CFG = { at: 0.4, step: 0.55, tick: 0.26, slash: 0.12, lift: 0.05, dim: 0.38, dimDur: 0.35, size: 156 };
          var v = { items: "先列提纲再动笔|想到哪里写到哪里|放一晚再改一遍|第一稿就要完美", marks: "v,x,v,x", x: 380, y: 100, pitch: 220, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".tc");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".tc-bg").style.display = "none";
          var num = function (a, d) { a = parseFloat(a); return isFinite(a) ? a : d; };
          var NS = "http://www.w3.org/2000/svg", svg = q(".tc-svg"), defs = q("defs"), sn = 0;
          function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var key in attrs) e.setAttribute(key, attrs[key]); parent.appendChild(e); return e; }
          // one pen stroke = a filled ribbon (w0 at landing, w1 mid-stroke, w2 at lift-off) uncovered by a mask stroke along its centre line
          function stroke(d, w0, w1, w2) {
            var id = "tc-m" + sn++;
            var rev = el("path", { d: d, class: "tc-rev" }, el("mask", { id: id, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1920, height: 1080 }, defs));
            var len = rev.getTotalLength(), m = Math.max(10, Math.round(len / 7)), a = [], b = [];
            for (var j = 0; j <= m; j++) {
              var t = j / m, p = rev.getPointAtLength(len * t), p0 = rev.getPointAtLength(Math.max(0, len * t - 1)), p1 = rev.getPointAtLength(Math.min(len, len * t + 1));
              var dx = p1.x - p0.x, dy = p1.y - p0.y, dl = Math.sqrt(dx * dx + dy * dy) || 1, end = t < 0.5 ? w0 : w2;
              var half = (end + (w1 - end) * Math.pow(Math.sin(Math.PI * t), 0.6)) / 2;
              a.push((p.x - (dy / dl) * half).toFixed(1) + " " + (p.y + (dx / dl) * half).toFixed(1));
              b.unshift((p.x + (dy / dl) * half).toFixed(1) + " " + (p.y - (dx / dl) * half).toFixed(1));
            }
            el("path", { d: "M" + a.concat(b).join("L") + "Z", class: "tc-ink", mask: "url(#" + id + ")" }, svg);
            rev.style.strokeWidth = w1 + 10 + "px";
            rev.style.strokeDasharray = len + 2 + "px " + (len + 40) + "px"; // the gap is longer than the path, and the start offset sits inside it: no hairline at the pen-down point
            return { rev: rev, len: len + 8 };
          }

          var X = num(v.x, 380), Y = num(v.y, 100), pitch = num(v.pitch, 220), S = CFG.size / 100;
          var names = String(v.items || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          var marks = String(v.marks || "").split(",").map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
          var list = q(".tc-list"), rows = [];
          list.style.left = X + "px";
          list.style.top = Y + "px";
          list.textContent = "";
          names.forEach(function (name) {
            var row = document.createElement("div");
            row.className = "tc-row";
            row.style.height = pitch + "px";
            row.textContent = name;
            list.appendChild(row);
            rows.push(row);
          });

          var tl = gsap.timeline({ paused: true });
          var go = function (s, dur, ease, at) { tl.fromTo(s.rev, { strokeDashoffset: s.len }, { strokeDashoffset: 0, duration: dur, ease: ease }, at); };
          marks.forEach(function (kind, i) {
            var ox = X + 8, oy = Y + i * pitch + (pitch - CFG.size) / 2, t = CFG.at + i * CFG.step;
            // mark shapes are written in a 100-unit square and placed at (ox, oy)
            var P = function (px, py) { return (ox + px * S).toFixed(1) + " " + (oy + py * S).toFixed(1); };
            if (kind === "x") {
              // two strokes with a pen-up between them, each one braking at the end; only after both does the row fade
              go(stroke("M" + P(14, 12) + "Q" + P(46, 44) + " " + P(88, 90), 10, 20, 8), CFG.slash, "power2.out", t);
              go(stroke("M" + P(86, 14) + "Q" + P(56, 48) + " " + P(12, 88), 10, 20, 8), CFG.slash, "power2.out", t + CFG.slash + CFG.lift);
              if (rows[i]) tl.fromTo(rows[i], { opacity: 1 }, { opacity: CFG.dim, duration: CFG.dimDur, ease: "power1.out" }, t + CFG.slash * 2 + CFG.lift);
            } else {
              // one stroke: a short push down, then a flick up that is still accelerating when the pen leaves
              go(stroke("M" + P(8, 50) + "Q" + P(24, 60) + " " + P(36, 86) + "Q" + P(54, 40) + " " + P(98, 6), 10, 22, 6), CFG.tick, "power2.in", t);
            }
          });
          window.__timelines["tick-cross"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

     portrait re-laid out (600x440 page, three sources above, two below, close-up 1.75x, two lines per paragraph).

<script>
(function(){
// timing in seconds (upstream frames / 30), shared by both orientations
var CFG={
dur:5,flip:0.467,flipLen:1.167,cam:3.2,bloom:[0.633,0.7,0.767,0.9],streak:[0.667,1.133],
rect:1.2,rectGap:0.133,rectLen:0.667,dim:3,dimLen:1,dimTo:0.62,

};
// close-up zoom, start offset from the rest spot (px), old title's floor in page px (x zoom 1.96 / 1.69 when it turns away >= 40 px)
var LAND={z0:2.05,pan:[130,95],bmin:22};
var PORT={z0:1.75,pan:[45,-135],bmin:24};
var v={name:"示例应用",before:"手动整理的周报",backdrop:"on"};
try {
var got=(window.__hyperframes&&window.__hyperframes.getVariables&&window.__hyperframes.getVariables())||{};
for(var key in got) if(got[key]!==undefined&&got[key]!==null&&got[key]!=="") v[key]=got[key];
} catch (e){}

var root=document.querySelector(".ih");
var q=function(s){return root.querySelector(s);},qa=function(s){return [].slice.call(root.querySelectorAll(s));};
var FW=root.clientWidth,FH=root.clientHeight;
if(!FW||!FH){
// not laid out yet: the host clip's declared size, then the window
var hc=root.closest("[data-width][data-height]");

}
var P=FH>FW,L=P?PORT:LAND;

// ==== kit:tone@1 ====
function kRGB(el, color) {
var p = document.createElement("i");
p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
el.appendChild(p);
var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
el.removeChild(p);
return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
}
function kTone(wrap) {
var c = kRGB(wrap, "var(--k-bg)");
var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
wrap.setAttribute("data-tone", tone);
return tone;
}
// ==== end kit:tone ====
// ==== kit:text@2 (kWords only) ====
var kCJK = /[⺀-鿿豈-﫿＀-￯]/;
function kWords(s, key) {
s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
var bar = s.indexOf("|") >= 0, out = [], k = key && !bar ? s.indexOf(key) : -1;
var cut = function (x) {
if (/ /.test(s) || !kCJK.test(s) || typeof Intl.Segmenter !== "function") return x.split(/( )/);
return Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(x), function (g) { return g.segment; });
};
var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);

bits.forEach(function (x) {
var t = x.trim(), last = out[out.length - 1];

if (!t) return;

else { last.t += t; last.sp = / $/.test(x); }
return;
}
out.push({ t: pre + t, sp: / $/.test(x) });
pre = "";
});
if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
if (out.length) out[out.length - 1].sp = false;

}
// ==== end kit:text ====
// ==== kit:fit@1 (kFit, kLines; no kRows) ====
function kFit(el, o) {
o = o || {};
var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
for (;;) {
el.style.fontSize = f + "px";
m = kLines(el);
if ((m.w <= W && m.n <= n) || f <= min) break;
f = Math.max(min, f - 2);
}
if (m.w > W) {
[].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
m = kLines(el);
}
return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
}
function kLines(el) {
var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
while ((t = it.nextNode())) {
if (!t.data.trim()) continue;
r.selectNodeContents(t);
[].forEach.call(r.getClientRects(), function (b) {
var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
});
}
return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
}
// ==== end kit:fit ====
// ==== kit:grain@1 ====
function kGrain(layer, o) {
o = o || {};
var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
var dark = tones && tones.getAttribute("data-tone") === "dark";
var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
var f = "type='linear' slope='2.4' intercept='-0.7'";
var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
"<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
"<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
"<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
"<rect width='100%' height='100%' filter='url(#g)'/></svg>";
return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
});
layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
layer.style.backgroundSize = size + "px " + size + "px";
return function (t) {
var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

};
}
// ==== end kit:grain ====

var C=CFG,dark=kTone(root)==="dark",off=String(v.backdrop)==="off";
if(off) qa(".ih-bg,.ih-rects,.ih-vig,.ih-grain").forEach(function(n){n.style.display="none";});
var grain=off?function(){}:kGrain(q(".ih-grain"));
var GK=dark?1:0.5,HK=dark?1:0.7;// flash and halo gain
// titles: a block per phrase, fitted down to the floor, then wrapped
[[".ih-name",v.name,40],[".ih-before",v.before,L.bmin]].forEach(function(a){
var el=q(a[0]);
el.textContent="";
kWords(a[1]).forEach(function(u){el.appendChild(document.createElement("span")).textContent=u.t;el.lastChild.className="ih-u";if(u.sp) el.appendChild(document.createTextNode(" "));});
kFit(el,{min:a[2]});
});
// pipes: each rest path (portrait: CSS d) -> glow tube, core, tip spark, comets; user-space gradients (a straight
// line has no box)
var svg=q(".ih-svg"),id="ih"+(window.__ihN=(window.__ihN||0)+1),defs="",body="";
var fx=function(n,fe){return '<filter id="'+id+n+'" filterUnits="userSpaceOnUse" x="-1200" y="-1200" width="2400" height="2400">'+fe+"</filter>";};
var pipes=qa(".ih-pp").map(function(p,i){
var d=getComputedStyle(p).d;
d = d && d !== "none" ? d.replace(/^path\("|"\)$/g, "") : p.getAttribute("d");
var g=id+"r"+i,a='<path d="'+d+'" ';
defs += '<linearGradient id="'+g+'" gradientUnits="userSpaceOnUse">'+[100,72,48,24,0].map(function(m,k){
return '<stop offset="'+k/4+'" style="stop-color:color-mix(in oklch var(--ih-hue) hue,var(--k-accent) '+m+'%,var(--k-accent-2))"/>';
}).join("")+"</linearGradient>";
body += '<g><g filter="url(#' + id + 'g)">' + a + 'stroke="url(#' + g + ')" stroke-width="12"/></g>' + a + 'class="ih-core" stroke-width="3"/>' + a + 'class="ih-tail" stroke-width="8" stroke-dasharray="26 48" filter="url(#' + id + 's)"/>' +
a + 'class="ih-head" stroke-width="6" stroke-dasharray="7 67"/><circle class="ih-glo" r="16" filter="url(#' + id + 's)"/><circle class="ih-tip" r="5.5"/></g>';
return {};
});
svg.innerHTML="<defs>"+fx("g",'<feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>')+fx("s",'<feGaussianBlur stdDeviation="3.5"/>')+defs+"</defs>"+body;
[].slice.call(svg.children,1).forEach(function(g,i){
var c=g.children,p=pipes[i];
p.g=g.style;p.body=c[0].firstChild;p.core=c[1];p.tail=c[2].style;p.head=c[3].style;p.dots=[c[4],c[5]];
p.len=p.core.getTotalLength();
var a=p.core.getPointAtLength(0),e=p.end=p.core.getPointAtLength(p.len),r=svg.querySelector("#"+id+"r"+i);
[a.x,a.y,e.x,e.y].forEach(function(n,k){r.setAttribute(["x1","y1","x2","y2"][k],n.toFixed(1));});
p.ring=q(".ih-top").appendChild(document.createElement("i")).style;
});

var rig=q(".ih-rig"),rs=rig.style,front=q(".ih-front").style,back=q(".ih-back").style,flash=q(".ih-flash").style;
var zs=qa(".ih-z"),pns=qa(".ih-pn"),tiles=qa(".ih-t"),rects=qa(".ih-rects i"),rl=q(".ih-rects").style,gl=qa(".ih-glare i");
var PW=pns[0].offsetWidth,PH=pns[0].offsetHeight,Y1=parseFloat(getComputedStyle(rig).getPropertyValue("--y"))||0;
var CAM=MT.bezier(0.55,0,0.18,1),POP=MT.bezier(0.34,1.5,0.64,1),OUT3=MT.ease("power2.out"),CL={extrapolateLeft:"clamp",extrapolateRight:"clamp"};
var px=function(n){return n.toFixed(2)+"px";},mx=function(c,a){return "color-mix(in srgb,var("+c+") "+a.toFixed(1)+"%,#0000)";};

function render(t){
grain(t);
var cam=MT.ramp(t,0,C.cam,CAM),z=MT.mix(L.z0,1,cam),x=L.pan[0]*(1-cam),y=Y1+L.pan[1]*(1-cam);
var rot=180*MT.ramp(t,C.flip,C.flipLen,"power2.out"),bloom=MT.interpolate(t,C.bloom,[0,1,0.25,0],CL);
var on=C.pipe+C.grow,br=t>on?0.5+0.5*Math.sin((t-on)*C.breathe):0,g=bloom*1.1+br*0.16;
// CSS zoom keeps the text sharp; the face turned away also goes to opacity 0
rs.width=px(PW*z);rs.height=px(PH*z);
rs.transform="translate("+px(x)+","+px(y)+") rotateY("+rot.toFixed(3)+"deg)";
zs.forEach(function(e){e.style.zoom=z.toFixed(4);});
front.opacity=rot<90?1:0;
back.opacity=rot<90?0:1;
pns.forEach(function(e){e.style.boxShadow="var(--ih-psh),0 0 "+px(50+g*90)+" "+mx("--ih-h1",(10+g*45)*HK)+",0 0 "+px(150+g*120)+" "+mx("--ih-mid",(16+g*28)*HK);});
flash.inset=px(-6*z);flash.borderRadius=px(18*z);flash.filter="blur("+px(5*z)+")";
flash.opacity=(Math.min(0.96,bloom*1.05)*GK*GK).toFixed(3);// light skins: 0.25, the glare carries the colour
flash.transform=(rot>90?"rotateY(180deg) ":"")+"translateZ(1px)";
// frames: 18% of the pan, 10% of the zoom
rl.transform="translate("+px(x*0.18)+","+px(y*0.18)+") scale("+(1+(z-1)*0.1).toFixed(4)+")";
var dim=MT.mix(1,C.dimTo,MT.ramp(t,C.dim,C.dimLen,"linear"));
rects.forEach(function(e,i){e.style.opacity=(MT.ramp(t,C.rect+i*C.rectGap,C.rectLen,"power2.out")*dim).toFixed(3);});
// beat 1: five tiles pop together
var a=MT.clamp((t-C.icon)/C.iconLen,0,1),pop=POP(a),lit=MT.ramp(t,C.lit,C.litLen,"power2.out")*(t>on?0.82+0.18*br:1);
tiles.forEach(function(e){
var s=e.style;
s.opacity=Math.min(1,a*2.2).toFixed(3);
s.transform="translateY("+px((1-pop)*22)+") scale("+(0.72+0.28*pop).toFixed(4)+")";
s.boxShadow="var(--ih-tsh),0 0 "+px(18+lit*40)+" "+mx("--k-accent",Math.min(1,lit)*44);
});
// beat 2: five pipes grow together, each over its own length
var gr=MT.ramp(t,C.pipe,C.grow,"power1.out"),fl=gr>=1?MT.ramp(t,on,C.flowLen,"linear"):0,rk=MT.clamp((t-C.ring)/C.ringLen,0,1);
pipes.forEach(function(p,i){
var pulse=t>on?0.84+0.16*Math.sin((t-on)*C.breathe+i):1,dash=(p.len*gr).toFixed(2)+" "+(p.len+60).toFixed(0),hd=p.core.getPointAtLength(p.len*gr);
var o=-((t-C.pipe)*C.speed+i*C.phase),r=6+OUT3(rk)*26,s=p.ring;
p.g.display=gr>0?"":"none";
[p.body,p.core].forEach(function(e,k){e.setAttribute("stroke-dasharray",dash);e.style.opacity=(k?0.8:0.9)*pulse;});
p.dots.forEach(function(c){c.setAttribute("cx",hd.x.toFixed(2));c.setAttribute("cy",hd.y.toFixed(2));c.style.opacity=gr>0&&gr<1?1:0;});
// comets run to the hub
p.tail.strokeDashoffset=o.toFixed(2);p.tail.opacity=0.38*fl;
p.head.strokeDashoffset=(o-19).toFixed(2);p.head.opacity=0.95*fl;
s.opacity=rk>0&&rk<1?((1-rk)*0.85).toFixed(3):0;
s.left=px(FW/2+p.end.x-r);s.top=px(FH/2+p.end.y-r);s.width=s.height=px(2*r);
});
// edge flash, only while the bloom is up
var up=bloom>0.02,nz=Math.sin(Math.floor(t*30)*91.345+47.853)*43758.5453;
[Math.min(1,bloom*(1-0.06*(nz-Math.floor(nz)))),bloom*0.88,MT.interpolate(t,C.streak,[0,0.9],CL)].forEach(function(k,i){gl[i].style.opacity=up?(k*GK).toFixed(3):0;});
}

var tl=MT.scene(C.dur,render);
window.__timelines["integration-hub-map"]=tl;
})();
</script>

    m = kLines(el);
    if ((m.w <= W && m.n <= n) || f <= min) break;
    f = Math.max(min, f - 2);
   }
   if (m.w > W) {
    [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
    m = kLines(el);
   }
   return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
  }
  function kLines(el) {
   var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
   var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
   while ((t = it.nextNode())) {
    if (!t.data.trim()) continue;
    r.selectNodeContents(t);
    [].forEach.call(r.getClientRects(), function (b) {
     var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
     if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
     row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
    });
   }
   return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
  }
  // ==== end kit:fit ====
  // ==== kit:text@2 (kWords only) ====
  var kCJK = /[⺀-鿿豈-﫿＀-￯]/;
  function kWords(s, key) {
   s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
   var bar = s.indexOf("|") >= 0, out = [], k = key && !bar ? s.indexOf(key) : -1;
   var cut = function (x) {
    if (/ /.test(s) || !kCJK.test(s) || typeof Intl.Segmenter !== "function") return x.split(/( )/);
    return Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(x), function (g) { return g.segment; });
   };
   var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);
   var pre = "";
   bits.forEach(function (x) {
    var t = x.trim(), last = out[out.length - 1];
    if (last && /^ /.test(x)) last.sp = true;
    if (!t) return;
    if (!/[\p{L}\p{N}]/u.test(t)) {
     if (!last || last.sp || /^[\p{Ps}\p{Pi}]+$/u.test(t)) pre += t;
     else { last.t += t; last.sp = / $/.test(x); }
     return;
    }
    out.push({ t: pre + t, sp: / $/.test(x) });
    pre = "";
   });
   if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
   if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
   if (out.length) out[out.length - 1].sp = false;
   return out;
  }
  // ==== end kit:text ====

  var tone = kTone(root);
  var grain = kGrain(q(".ag-grain"));
  if (String(v.backdrop) === "off") q(".ag-stage").style.display = "none";

  // the one parameter: rest and peak gap (px), the pre-dial recall is 6.5% of the travel (12 -> 6 by default)
  var R = Math.round(parseFloat(v.rest)), M = Math.round(parseFloat(v.peak));
  if (!(R >= 0)) R = 12;
  R = Math.min(40, R);
  if (!(M > 0)) M = 104;
  M = Math.max(R + 20, Math.min(300, M));
  var PRE = Math.max(0, R - (M - R) * CFG.recall);

  // nav row: one block per item (portrait keeps the first three), a gap spacer between neighbours
  var names = kWords(v.items).map(function (u) { return u.t; });
  if (names.length < 2) names = kWords(DEF).map(function (u) { return u.t; });
  names = names.slice(0, L.max);
  var n = names.length, nav = q(".ag-nav"), h = "", i;
  for (i = 0; i < n; i++) h += (i ? '<i class="ag-s"><i class="ag-m" data-layout-allow-overflow><i class="ag-x"></i><i class="ag-ml"></i><i class="ag-bd"></i></i></i>' : "") + '<b class="ag-b' + (i ? "" : " on") + '"></b>';
  nav.innerHTML = h;
  var blocks = qa(".ag-b"), ms = qa(".ag-m"), bds = qa(".ag-bd"), sumW = 0;
  blocks.forEach(function (b, j) { b.textContent = names[j]; sumW += b.offsetWidth; });
  // canvas zoom: the row at its widest (peak gap, 2.5% push-in) stays inside the frame; layer name and badges keep their size
  var z = Math.min(1, (FW * L.fit) / ((sumW + (n - 1) * M + 60) * 1.025)), iz = 1 / z;
  if (z < 1) q(".ag-lay").style.transform = "scale(" + z.toFixed(4) + ")";

  // text slots: eyebrow and layer name shrink to fit (floor 24px), then wrap; empty hides them
  var eb = q(".ag-eb"), ebt = q(".ag-ebt"), lnt = q(".ag-lnt"), XS = 0.4;
  ebt.textContent = String(v.param).trim();
  if (!ebt.textContent) eb.style.display = "none";
  else {
   ebt.style.maxWidth = FW * L.ebW + "px";
   // bottom-anchored: a label that still wraps at 24px grows upwards, away from the readout, and skips the tracking
   if (kFit(ebt, { width: FW * L.ebW, min: 24 }).fits) ebt.style.whiteSpace = "nowrap";
   else XS = 0;
   // the closing tracking starts 0.4em wider: less when that would push a long eyebrow out of the frame
   var cs = ebt.textContent.length * parseFloat(ebt.style.fontSize);
   XS = Math.max(0, Math.min(XS, (FW * 0.9 - ebt.offsetWidth) / cs));
  }
  lnt.textContent = String(v.layer).trim();
  if (!lnt.textContent) lnt.style.display = "none";
  else { lnt.style.maxWidth = L.lnW + "px"; kFit(lnt, { width: L.lnW, min: 24 }); }

  // readout: light face unless the host swaps the font; ink -> accent while the dial moves
  var num = q(".ag-num"), ng = q(".ag-ng"), GL = tone === "dark" ? 35 : 10;
  var mixA = function (p) { return "color-mix(in srgb, var(--k-accent) " + p.toFixed(1) + "%, transparent)"; };
  if (getComputedStyle(root).getPropertyValue("--mc-font").trim()) num.style.fontFamily = "var(--k-font)";

  // ruler: a tick tape from -60 to past the peak, slid under the fixed pin; digits every 10 units
  var rl = q(".ag-rl"), st = q(".ag-st"), pin = q(".ag-pin"), RW = rl.clientWidth, U = CFG.unit, U0 = -60;
  var U1 = Math.max(180, Math.ceil((M + 70) / 10) * 10), lh = "";
  st.style.width = (U1 - U0) * U + 2 + "px";
  for (i = 0; i <= U1; i += 10) lh += '<i class="ag-lb" data-n="' + i + '" style="left:' + ((i - U0) * U + 1) + 'px"></i>';
  st.insertAdjacentHTML("beforeend", lh);
  var lbs = qa(".ag-lb");

  // one horizontal blur filter per block, ids unique per mount
  var N = (window.__agN = (window.__agN || 0) + 1), fh = "";
  for (i = 0; i < n; i++) fh += '<filter id="ag' + N + "b" + i + '" x="-20%" y="-10%" width="140%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>';
  q(".ag-fx").innerHTML = fh;
  var fe = qa(".ag-fx feGaussianBlur"), hds = qa(".ag-h"), fr = q(".ag-fr"), ln = q(".ag-ln"), dm = q(".ag-dm"), cam = q(".ag-cam");

  // gap(t): recall (swift), dial out (swift), hold, then an underdamped spring home with its overshoot x0.45
  function gapAt(t) {
   if (t < CFG.grow) return R + (PRE - R) * MT.ramp(t, CFG.pre, CFG.preLen, "swift");
   if (t < CFG.rel) return PRE + (M - PRE) * MT.ramp(t, CFG.grow, CFG.growLen, "swift");
   var s = MT.spring({ t: t - CFG.rel, damping: 9, stiffness: 80, mass: 1.1 });
   return Math.max(0, M + (R - M) * (s > 1 ? 1 + (s - 1) * CFG.over : s));
  }
  // px per frame (30 fps), central difference as upstream
  var vel = function (t) { return gapAt(t + 1 / 60) - gapAt(t - 1 / 60); };
  var sp = function (t, d, damping, stiffness) { return MT.spring({ t: t, delay: d, damping: damping, stiffness: stiffness }); };

  var tl = MT.scene(CFG.dur, function (t) {
   var g = gapAt(t), vv = vel(t), mv = Math.min(1, Math.abs(vv) / 1.2), hot = 0, k;
   // heat: the fastest of the last 6 frames, fading by frame (the readout keeps its colour a moment)
   for (k = 0; k <= 6; k++) hot = Math.max(hot, Math.min(1, Math.abs(vel(t - k / 30)) / 1.5) * (1 - k / 7));
   var pulse = 1 + 0.06 * Math.abs(Math.sin((Math.PI * g) / 2)) * mv;
   var sh = R + Math.round((g - R) / 2) * 2;
   if (Math.abs(g - M) < 1) sh = M;
   sh = Math.max(0, sh);
   grain(t);
   cam.style.transform = "scale(" + (1 + 0.025 * MT.ramp(t, 0, CFG.dur, "smooth")).toFixed(5) + ")";

   var e = MT.ramp(t, CFG.eb, CFG.ebLen, "snappy"), ni = MT.ramp(t, CFG.num, CFG.numLen, "snappy");
   eb.style.opacity = e;
   ebt.style.letterSpacing = (0.28 + (1 - e) * XS).toFixed(3) + "em";
   ng.style.transform = "translateY(" + ((1 - ni) * 105).toFixed(2) + "%)";
   ng.style.opacity = ni > 0 ? 1 : 0;
   num.textContent = sh;
   num.style.color = "color-mix(in oklab, var(--k-accent) " + (hot * 100).toFixed(1) + "%, var(--k-ink))";
   num.style.transform = "scale(" + pulse.toFixed(4) + ")";
   num.style.textShadow = hot > 0.05 ? "0 0 " + (40 * hot).toFixed(1) + "px " + mixA(GL * hot) : "none";
   rl.style.opacity = MT.ramp(t, CFG.rl, CFG.rlLen, "out");
   st.style.transform = "translateX(" + (RW / 2 - (g - U0) * U - 1).toFixed(2) + "px)";
   lbs.forEach(function (l) { l.style.opacity = MT.clamp((Math.abs(l.getAttribute("data-n") - g) * U - 26) / 26, 0, 1); });
   pin.style.boxShadow = "0 0 " + (8 + hot * 14).toFixed(1) + "px " + mixA(35 + hot * 40);

   var si = sp(t, CFG.sel, 16, 140);
   var gr = (1 - si) * 26;
   fr.style.inset = (-gr).toFixed(2) + "px";
   fr.style.opacity = ln.style.opacity = Math.min(1, si * 1.4);
   ln.style.transform = "translate(" + (-gr).toFixed(2) + "px," + (-gr).toFixed(2) + "px) scale(" + iz.toFixed(4) + ")";
   hds.forEach(function (d, j) { d.style.transform = "scale(" + sp(t, CFG.hd + j * CFG.hdStep, 13, 240).toFixed(4) + ")"; });
   dm.textContent = Math.round(sumW + (n - 1) * g) + " × 120";

   // everything below reads the same g: spacer widths (so block positions), measures, badge digits
   nav.style.setProperty("--ag-g", g.toFixed(3));
   nav.style.setProperty("--ag-n", '"' + sh + '"');
   blocks.forEach(function (b, j) {
    var p = MT.ramp(t, CFG.bk + j * CFG.bkStep, CFG.bkLen, "snappy"), bl = Math.min(9, Math.abs((j - (n - 1) / 2) * vv) * 0.5);
    b.style.opacity = p;
    b.style.transform = "translateY(" + ((1 - p) * CFG.rise).toFixed(2) + "px)";
    fe[j].setAttribute("stdDeviation", bl.toFixed(2) + " 0");
    b.style.filter = bl > 0.5 ? "url(#ag" + N + "b" + j + ")" : "";
   });
   var mo = MT.ramp(t, CFG.ms, CFG.msLen, "out");
   ms.forEach(function (m, j) {
    var p = MT.ramp(t, CFG.bd + j * CFG.bdStep, CFG.bdLen, "snappy");
    m.style.opacity = mo;
    bds[j].style.opacity = p;
    bds[j].style.transform = "translateX(-50%) translateY(" + ((1 - p) * 10).toFixed(1) + "px) scale(" + (pulse * (0.7 + 0.3 * p) * iz).toFixed(3) + ")";
   });
  });
  window.__timelines["autolayout-gap-dial"] = tl;
 })();
</script>
</template>

      <script>

            };

          function kFit(el, o) {

          function kLines(el) {

                "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
                "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
                "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +

          });
          // kicker: per character (word units lose the space after a lone "·"), fitted at its widest tracking (it
          // closes from 0.62em to 0.36em); an empty kicker or subtitle is removed
          if (String(v.kicker).trim()) {
            kSplit(kt, "char", false, v.kicker);
            kt.style.letterSpacing = "0.62em";
            kFit(kt, { lines: 1, min: 40, width: tw.clientWidth - 184 });
          } else kick.style.display = "none";
          if (String(v.sub).trim()) { kSplit(sub, "word", false, v.sub); kFit(sub, { lines: 2, min: 40 }); } else sub.style.display = "none";

          // geometry: lamp over the frame centre, pendulum centred on the title; the iris opens to 1.6x the title's
          // half width (upstream: 1080px over its ~675px half width, an estimate for the 220px serif Latin line), never
          // smaller than upstream's 1080px
          var CX = FW / 2, CY = tw.offsetTop, AMP = 0.3125 * FW, ox = tw.offsetLeft, oy = CY - tw.offsetHeight / 2;
          var R1 = Math.max(R0 * 3, kLines(ttl).w * 0.8), K = R1 / (R0 * 3);
          var spot = function (t) {
            // theta from -pi/2 (far left); after the first full swing the envelope eases to 0, so x and speed reach 0 together
            var s = MT.clamp(t, CFG.sw0, CFG.sw1), th = -Math.PI / 2 + (2 * Math.PI * (s - CFG.sw0)) / CFG.per;
            var u = Math.sin(th) * (1 - MT.ramp(s, CFG.sw0 + 0.75 * CFG.per, CFG.sw1 - CFG.sw0 - 0.75 * CFG.per, "smooth"));
            return [CX + AMP * u, CY + DROP - ARC * u * u];
          };
          var outCubic = MT.bezier(0.215, 0.61, 0.355, 1);
          var litc = q(".sp-litc"), pool = q(".sp-pool"), cone = q(".sp-cone"), spotEl = q(".sp-spot"), kls = qa(".sp-kl");
          var cv = q(".sp-motes"), g = cv.getContext("2d"), wc = kRGB(root, "var(--sp-warm)").join(",");
          cv.width = FW; cv.height = FH;
          var rnd = function (i) { var s = Math.sin(i * 91.7 + 13.1) * 43758.5453; return s - Math.floor(s); };
          var grain = kGrain(q(".sp-grain"), { opacity: 0.09, blend: "soft-light" });
          var px = function (n, x) { inn.style.setProperty(n, x.toFixed(1) + "px"); };

          var tl = MT.scene(CFG.dur, function (t) {
            var f = t * 30, fi = Math.floor(f + 1e-3) - 4; // frames at 30 fps
            var on = fi < 0 ? 0 : fi > 5 ? 1 : FL[fi];
            var p = spot(t), x = p[0], y = p[1];
            var iris = MT.ramp(t, CFG.sw1, CFG.iris, outCubic), fade = 1 - 0.7 * MT.ramp(t, CFG.sw1, CFG.iris, "linear");
            var br = 1 + 0.04 * Math.sin(f / 17) * MT.ramp(t, CFG.sw1 + CFG.iris, CFG.iris, "smooth");
            var ph = MT.mix(R0 * 1.05, 1300 * K, iris), cb = y + MT.mix(R0 * 0.8, 420, iris);
            px("--sx", x); px("--sy", y); px("--mx", x - ox); px("--my", y - oy + 60); px("--ph", ph); px("--cb", cb);
            px("--sr", MT.mix(R0, R1, iris)); px("--sry", MT.mix(R0 * 0.92, 480 * K, iris));
            litc.style.opacity = on * br;
            spotEl.style.opacity = on * MT.mix(1, 0.55, iris) * br;
            pool.style.opacity = on * fade * 0.9;
            cone.style.opacity = cv.style.opacity = on * fade;
            lit.style.opacity = on;
            // dust in the beam: drifts up the cone, sways and twinkles (upstream hash, 56 motes), clipped to the cone
            g.clearRect(0, 0, FW, FH);
            g.save();
            g.beginPath(); g.moveTo(CX - MOUTH, LAMP); g.lineTo(CX + MOUTH, LAMP); g.lineTo(x + ph, cb); g.lineTo(x - ph, cb); g.closePath(); g.clip();
            for (var i = 0; i < 56; i++) {
              var uu = (rnd(i) + 1 - (((f * (0.35 + rnd(i + 200) * 0.5)) % 160) / 160) * 0.4) % 1;
              var yy = MT.mix(LAMP + 120, cb - 40, uu), kk = (yy - LAMP) / (cb - LAMP);
              var xx = MT.mix(CX, x, kk) + (rnd(i + 100) - 0.5) * MT.mix(MOUTH, ph, kk) * 1.6 + Math.sin(f / 23 + i) * 7;
              var a = (0.16 + rnd(i + 500) * 0.4) * (0.35 + 0.65 * Math.abs(Math.sin(f / (11 + rnd(i + 400) * 9) + i)));
              g.fillStyle = "rgba(" + wc + "," + a.toFixed(3) + ")";
              g.beginPath(); g.arc(xx, yy, 0.9 + rnd(i + 300) * 1.8, 0, 2 * Math.PI); g.fill();
            }
            g.restore();
            // follow-up: kicker tracking closes while its rules grow, subtitle rises 18px
            var kp = MT.ramp(t, CFG.kick, CFG.fol, "snappy"), sp = MT.ramp(t, CFG.sub, CFG.fol, "snappy");
            kick.style.opacity = kp;
            kt.style.letterSpacing = MT.mix(0.62, 0.36, kp).toFixed(3) + "em";
            kls.forEach(function (l) { l.style.width = MT.mix(0, 70, kp).toFixed(1) + "px"; });
            sub.style.opacity = sp;
            sub.style.transform = "translateY(" + MT.mix(18, 0, sp).toFixed(1) + "px)";
            grain(t);
          });
          window.__timelines["spotlight-title-sweep"] = tl;
        })();
      </script>
    </template>

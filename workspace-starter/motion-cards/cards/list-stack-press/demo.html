          var cnt = q(".ls-cnt"), dg = [].slice.call(root.querySelectorAll(".ls-dg"));
          var lineH = dg[0].offsetHeight;

          var E = { fly: MT.bezier(0.45, 0.05, 0.25, 1.12), cy: MT.bezier(0.42, 0, 0.2, 1), z: MT.bezier(0.3, 0, 0.18, 1), roll: MT.bezier(0.25, 0.8, 0.25, 1), hl: MT.bezier(0.3, 0, 0.2, 1), gl: MT.bezier(0.45, 0, 0.35, 1) };
          var C = CFG.cue, D = CFG.fly, clampB = { extrapolateLeft: "clamp", extrapolateRight: "clamp" };
          var ramp = function (t, a, b, ease) { return MT.interpolate(t, [a, b], [0, 1], { easing: ease, extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };
          var flyT = function (i, t) { return ramp(t, C[i], C[i] + D, E.fly); };
          // the flight covers L.rise px; the overshoot past the slot keeps L.ov px per unit of progress
          var flyY = function (i, t) { var u = flyT(i, t); return L.rise * (1 - Math.min(u, 1)) + L.ov * (1 - Math.max(u, 1)); };
          var press = function (i, t) {
            var m = 0;
            for (var j = i + 1; j < C.length; j++) {
              var p = MT.interpolate(t, [C[j], C[j] + CFG.pressAt[1], C[j] + CFG.pressAt[2]], [0, L.press, 0], { easing: "sine.inOut", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
              m = Math.max(m, p);
            }
            return m;
          };
          var rollAt = function (t) {
            var p = 0;
            for (var i = 0; i < C.length; i++) p += ramp(t, C[i] + D, C[i] + D + CFG.roll, E.roll);
            return p;
          };

          var render = function (t) {
            // camera: one continuous curve, vertical first, zoom a little later
            var u = MT.clamp(t / CFG.cam, 0, 1), z = ZS + (ZE - ZS) * MT.ease(E.z)(u), cy = CYS + (CYE - CYS) * MT.ease(E.cy)(u);
            page.style.transform = "translate(" + (FW / 2 - CX * z).toFixed(2) + "px," + (FH / 2 - cy * z).toFixed(2) + "px) scale(" + z.toFixed(4) + ")";
            boxes.forEach(function (b, i) {
              var tt = flyT(i, t);
              b.style.opacity = tt > 0 ? 1 : 0;
              var settled = tt >= 0.999, pr = settled ? press(i, t) : 0;
              var elev = settled ? 3 - pr * 0.3 : 3 + 53 * MT.clamp(1 - tt, 0, 1);
              card[i].style.transform = "translateY(" + (flyY(i, t) + pr).toFixed(3) + "px) rotate(" + (CFG.tilt[i] * (1 - tt)).toFixed(4) + "deg) scale(" + (CFG.sc0 - (CFG.sc0 - 1) * tt).toFixed(5) + ")";
              card[i].style.boxShadow = "inset 0 1px 0 var(--ls-hi), " + kShadow(elev, dark ? 3 : 1.15);
              sb[i](0, settled || tt <= 0 ? 0 : MT.velocity(function (s) { return flyY(i, s); }, t));
              // highlighter: grows after the landing, then fades (the last card gets a shorter beat)
              var h = i === C.length - 1 ? CFG.hlLast : CFG.hl, hs = C[i] + D + h[0];
              var grow = ramp(t, hs, hs + h[1], E.hl), fade = 1 - ramp(t, hs + h[1], hs + h[1] + h[2], "none");
              hl[i].style.opacity = grow > 0 && fade > 0 ? 0.85 * fade : 0;
              hl[i].style.width = HW[i] * grow + "px";
              // glaze: one band over the whole stack in page coordinates, clipped by each card
              var ge = ramp(t, CFG.glaze[0], CFG.glaze[3], E.gl), gv = MT.interpolate(t, CFG.glaze, [0, 1, 1, 0], clampB);
              var s = CW / 1104;
              glz[i].style.opacity = gv * 0.55;
              glz[i].style.left = (CW * (-0.8225 + 2.5362 * ge) - (Y0 + i * PITCH - 200) * 0.25 * s).toFixed(1) + "px";
            });
            // counter: anticipation, then a continuous odometer that moves one digit per landing
            var an = ramp(t, 0, CFG.ant, "power2.out"), pos = rollAt(t), a = Math.floor(pos + 1e-6), fr = pos - a;
            var bl = Math.min(6, Math.abs(MT.velocity(rollAt, t)));
            cnt.style.opacity = CFG.antFrom + (1 - CFG.antFrom) * an;
            cnt.style.transform = "scale(" + (CFG.antScale + (1 - CFG.antScale) * an).toFixed(4) + ")";
            dg[0].textContent = a % 10; dg[1].textContent = fr < 0.001 ? "" : (a + 1) % 10;
            dg[0].style.transform = "translateY(" + (-fr * lineH).toFixed(2) + "px)";
            dg[1].style.transform = "translateY(" + ((1 - fr) * lineH).toFixed(2) + "px)";
            dg[0].style.filter = dg[1].style.filter = bl > 0.3 ? "blur(" + bl.toFixed(2) + "px)" : "";
          };
          window.__timelines["list-stack-press"] = MT.scene(CFG.total, render);
        })();
      </script>
    </template>
  </body>
</html>

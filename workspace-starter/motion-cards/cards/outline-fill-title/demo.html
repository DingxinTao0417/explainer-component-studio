<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"标题（建议 4–7 个字）","default":"先搭骨架再填肉"},
    {"id":"sub","type":"string","label":"标题下的一行（可空）","default":"结构定了，内容才有地方放"},
    {"id":"fillAt","type":"number","label":"开始灌色的时间（秒）","default":0.9,"min":0.3,"max":10,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>outline-fill-title · 描边填实</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="outline-fill-title-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .oft { position: absolute; inset: 0; }
        .oft-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .oft-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .oft-wrap { position: relative; display: block; }
        .oft-line { position: relative; display: block; --lv-l: -12%; --lv-r: -12%; font-size: 184px; font-weight: 900; line-height: 1.3; letter-spacing: 0.05em; white-space: nowrap; color: color-mix(in srgb, var(--k-ink) 9%, transparent); -webkit-text-stroke: 4px var(--k-ink); }
        .oft-line::after { content: attr(data-fill); position: absolute; left: 0; top: 0; color: var(--k-accent); -webkit-text-stroke: 4px var(--k-accent); clip-path: polygon(0% 100%, 100% 100%, 100% var(--lv-r), 0% var(--lv-l)); }
        .oft-sub { display: block; margin-top: 34px; font-size: 54px; font-weight: 600; letter-spacing: 0.06em; white-space: nowrap; color: var(--k-muted); }
      </style>

      <div id="root" data-composition-id="outline-fill-title" data-width="1920" data-height="1080">
        <div class="oft">
          <div class="oft-bg"></div>
          <div class="oft-stage">
            <div class="oft-wrap">
              <span class="oft-line" data-fill="先搭骨架再填肉">先搭骨架再填肉</span>
            </div>
            <span class="oft-sub">结构定了，内容才有地方放</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { lineAt: 0.2, lineDur: 0.45, fillDur: 0.85, lead: 0.12, bump: 1.035, subGap: 0.15 };
          var v = { title: "先搭骨架再填肉", sub: "结构定了，内容才有地方放", fillAt: 0.9, backdrop: "on" };
          try {
                      var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
                      for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
                    } catch (e) {}
          var root = document.querySelector(".oft");
          var q = function (s) { return root.querySelector(s); };
          var line = q(".oft-line"), wrap = q(".oft-wrap"), sub = q(".oft-sub");
          // the filled copy is the outline node's ::after (same glyphs, same box), so there is only one text node to keep in sync
          line.textContent = String(v.title);
          line.setAttribute("data-fill", String(v.title));
          if (got && got.sub === "") { sub.style.display = "none"; } else { sub.textContent = String(v.sub); }
          if (String(v.backdrop) === "off") q(".oft-bg").style.display = "none";
          var fillAt = Math.max(CFG.lineAt + 0.1, parseFloat(v.fillAt) || 0.9);
          var done = fillAt + CFG.lead + CFG.fillDur;

          var tl = gsap.timeline({ paused: true });
          // stage 1: only the outline, a promise of the word
          tl.fromTo(line, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: CFG.lineDur, ease: "power2.out" }, CFG.lineAt);
          // stage 2: the level climbs from the feet of the glyphs; the right side leads so the surface is tilted like liquid
          tl.fromTo(line, { "--lv-r": "104%" }, { "--lv-r": "-12%", duration: CFG.fillDur, ease: "power2.inOut" }, fillAt);
          tl.fromTo(line, { "--lv-l": "104%" }, { "--lv-l": "-12%", duration: CFG.fillDur, ease: "power2.inOut" }, fillAt + CFG.lead);
          // full: one small bump says "set"
          tl.fromTo(wrap, { scale: 1 }, { scale: CFG.bump, duration: 0.1, ease: "power2.out" }, done - 0.04);
          tl.to(wrap, { scale: 1, duration: 0.28, ease: "back.out(2.2)" }, done + 0.06);
          tl.fromTo(sub, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, done + CFG.subGap);
          window.__timelines["outline-fill-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

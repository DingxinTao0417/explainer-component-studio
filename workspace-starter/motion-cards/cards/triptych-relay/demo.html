<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"srcs","type":"string","label":"三张图的地址，用 | 分隔，按接棒顺序","default":"motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p3.jpg"},
    {"id":"labels","type":"string","label":"三格的标签，用 | 分隔（每个不超过 6 个字）","default":"写提示词|看结果|改一轮"},
    {"id":"beats","type":"string","label":"三次接棒的时刻（秒），用 | 分隔，对齐旁白","default":"0.7|2.0|3.3"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>triptych-relay · 三联接力</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="triptych-relay-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .tr { position: absolute; inset: 0; }
        .tr-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .tr-row { position: absolute; left: 60px; top: 90px; width: 1800px; height: 900px; display: flex; gap: 24px; }
        .tr-pane { position: relative; flex: none; width: 584px; height: 900px; overflow: hidden; border-radius: 20px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); }
        /* the picture never resizes: the pane is a window that opens and closes over it */
        .tr-img { position: absolute; inset: 0; background-repeat: no-repeat; background-position: center; background-size: 1440px 900px; }
        .tr-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 12px; background: var(--k-accent); }
        .tr-dim { position: absolute; inset: 0; background: #05070b; opacity: 0.6; }
        .tr-tag { position: absolute; left: 32px; bottom: 44px; display: block; }
        .tr-num { display: block; font: 700 40px/48px Consolas, "Courier New", monospace; color: var(--k-accent); }
        .tr-txt { display: block; font-size: 52px; line-height: 66px; font-weight: 700; color: #fff; white-space: nowrap; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6); }
      </style>

      <div id="root" data-composition-id="triptych-relay" data-width="1920" data-height="1080">
        <div class="tr">
          <div class="tr-bg"></div>
          <div class="tr-row">
            <div class="tr-pane"><div class="tr-img" style="background-image: url(motion-cards/lib/samples/p5.jpg)"></div><div class="tr-bar"></div><div class="tr-dim"></div><div class="tr-tag"><span class="tr-num">01</span><span class="tr-txt">写提示词</span></div></div>
            <div class="tr-pane"><div class="tr-img" style="background-image: url(motion-cards/lib/samples/p1.jpg)"></div><div class="tr-bar"></div><div class="tr-dim"></div><div class="tr-tag"><span class="tr-num">02</span><span class="tr-txt">看结果</span></div></div>
            <div class="tr-pane"><div class="tr-img" style="background-image: url(motion-cards/lib/samples/p3.jpg)"></div><div class="tr-bar"></div><div class="tr-dim"></div><div class="tr-tag"><span class="tr-num">03</span><span class="tr-txt">改一轮</span></div></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            inAt: 0.1,
            wide: 1000, narrow: 376, even: 584,   // wide + 2 × narrow = 3 × even = 1752, so the row never changes length
            swap: 0.5,                            // one ease for all three widths, otherwise the outer edges wobble
            dim: 0.6,
            push: 1.05,                           // the active picture keeps creeping in, so it is alive while it holds
            tail: 1.3,                            // how long the last pane holds
          };
          var v = { labels: "写提示词|看结果|改一轮", beats: "0.7|2.0|3.3", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".tr");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".tr-bg").style.display = "none";
          var list = String(v.srcs || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          var panes = all(".tr-pane");
          var labels = String(v.labels || "").split("|");
          var beats = String(v.beats || "").split("|").map(parseFloat);
          panes.forEach(function (p, i) {
            if (list[i]) p.querySelector(".tr-img").style.backgroundImage = 'url("' + list[i] + '")';
            p.querySelector(".tr-txt").textContent = (labels[i] || "").trim();
            if (!isFinite(beats[i])) beats[i] = (i ? beats[i - 1] : -0.6) + 1.3;
          });
          var end = beats[2] + CFG.tail;

          var tl = gsap.timeline({ paused: true });
          panes.forEach(function (p, i) {
            tl.fromTo(p, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, CFG.inAt + i * 0.08);
            gsap.set(p, { width: CFG.even });
            gsap.set(p.querySelector(".tr-bar"), { scaleX: 0, transformOrigin: "0% 50%" });
          });
          var widthNow = [CFG.even, CFG.even, CFG.even];
          beats.forEach(function (at, k) {
            var until = k < 2 ? beats[k + 1] : end;
            panes.forEach(function (p, i) {
              var to = i === k ? CFG.wide : CFG.narrow;
              if (to !== widthNow[i]) tl.fromTo(p, { width: widthNow[i] }, { width: to, duration: CFG.swap, ease: "power3.inOut", immediateRender: false }, at);
              widthNow[i] = to;
            });
            var img = panes[k].querySelector(".tr-img"), dim = panes[k].querySelector(".tr-dim");
            tl.fromTo(dim, { opacity: CFG.dim }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, at + 0.1);
            // the bar is the baton: it fills for exactly as long as this pane has the floor
            tl.fromTo(panes[k].querySelector(".tr-bar"), { scaleX: 0 }, { scaleX: 1, duration: until - at, ease: "none", immediateRender: false }, at);
            tl.fromTo(img, { scale: 1 }, { scale: CFG.push, duration: until - at, ease: "none", immediateRender: false }, at);
            if (k < 2) {
              tl.fromTo(dim, { opacity: 0 }, { opacity: CFG.dim, duration: 0.4, ease: "power2.inOut", immediateRender: false }, until);
              tl.fromTo(img, { scale: CFG.push }, { scale: 1, duration: CFG.swap, ease: "power2.out", immediateRender: false }, until);
            }
          });
          window.__timelines["triptych-relay"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

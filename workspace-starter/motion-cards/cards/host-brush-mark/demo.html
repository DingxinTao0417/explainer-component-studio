<!doctype html>
<html

    {"id":"line2","type":"string","label":"第二行：带重点的那句","default":"是你提问的方式"},
    {"id":"key","type":"string","label":"刷上笔刷的重点（第二行里的一段）","default":"提问的方式"},

  <head>
    <meta charset="UTF-8" />
    <title>host-brush-mark · 口播笔刷</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="host-brush-mark-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .hb { position: absolute; inset: 0; }
        .hb-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .hb-host { position: absolute; bottom: 0; left: -90px; width: 1100px; height: 900px; object-fit: contain; object-position: 50% 100%; }
        /* the paint sits under the words; the script reshapes it to the key's real box */
        .hb-paint { position: absolute; left: 1173.6px; top: 406.9px; width: 614.4px; height: 153.6px; }
        .hb-paint svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        .hb-ink { fill: var(--k-accent); }
        .hb-txt { position: absolute; left: 1020px; top: 330px; width: 760px; }
        .hb-l1 { display: block; font-size: 56px; font-weight: 700; line-height: 1.3; color: var(--k-muted); white-space: nowrap; }
        .hb-l2 { display: block; margin-top: 18px; font-size: 96px; font-weight: 900; line-height: 1.25; white-space: nowrap; }
        .hb-key { display: inline-block; position: relative; color: var(--k-on-accent); }
      </style>

      <div id="root" data-composition-id="host-brush-mark" data-width="1920" data-height="1080">
        <div class="hb">
          <div class="hb-bg"></div>
          <video id="host-brush-mark-host" class="hb-host hb-host-v" data-var-src="host" src="motion-cards/lib/samples/presenter.png" data-start="0" muted playsinline></video>
          <img class="hb-host hb-host-i" data-var-src="host" src="motion-cards/lib/samples/presenter.png" alt="" />
          <div class="hb-paint"><svg viewBox="0 0 614.4 153.6" preserveAspectRatio="none" aria-hidden="true"><path class="hb-ink" d="M 0 75.2 L 17.1 37.8 L 34.1 22.5 L 51.2 19.8 L 68.3 20.6 L 85.3 21.5 L 102.4 22.3 L 119.5 22.9 L 136.5 23 L 153.6 22.8 L 170.7 22.1 L 187.7 21.3 L 204.8 20.4 L 221.9 19.7 L 238.9 19.3 L 256 19.3 L 273.1 19.7 L 290.1 20.4 L 307.2 21.3 L 324.3 22.1 L 341.3 22.8 L 358.4 23 L 375.5 22.9 L 392.5 22.4 L 409.6 21.6 L 426.7 20.7 L 443.7 19.9 L 460.8 19.3 L 477.9 19.2 L 494.9 19.5 L 512 20.1 L 529.1 23 L 546.1 28.1 L 563.2 33.7 L 580.3 39.5 L 597.3 45.4 L 614.4 51.6 L 614.4 58.7 L 597.3 71.4 L 580.3 84.8 L 563.2 98.8 L 546.1 113.1 L 529.1 126.8 L 512 134.2 L 494.9 134.9 L 477.9 134.5 L 460.8 133.4 L 443.7 131.9 L 426.7 130.6 L 409.6 130.1 L 392.5 130.5 L 375.5 131.7 L 358.4 133.2 L 341.3 134.4 L 324.3 134.9 L 307.2 134.4 L 290.1 133.2 L 273.1 131.7 L 256 130.5 L 238.9 130.1 L 221.9 130.6 L 204.8 131.9 L 187.7 133.4 L 170.7 134.5 L 153.6 134.9 L 136.5 134.2 L 119.5 132.9 L 102.4 131.4 L 85.3 130.4 L 68.3 130.1 L 51.2 130.8 L 34.1 129 L 17.1 115.1 L 0 79 Z" /></svg></div>
          <div class="hb-txt">
            <span class="hb-l1">真正拉开差距的</span>
            <span class="hb-l2"><span class="hb-pre">是你</span><span class="hb-key">提问的方式</span><span class="hb-post"></span></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { l1At: 0.25, l2At: 0.55, rise: 0.45, sweep: 0.45, flipAt: 0.92, pop: 1.05, lead: 0.4, tailOut: 1, body: 0.58, flick: 0.22, drop: 0.03,
            hostW: 1100, hostX: { right: 1460, left: 460 }, txtX: { right: 140, left: 1020 }, txtW: 760, txtTop: 330 };
          var v = { line1: "真正拉开差距的", line2: "是你提问的方式", key: "提问的方式", hit: 1.4,
            host: "motion-cards/lib/samples/presenter.png", hostKind: "auto", side: "left", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && (got[k] !== "" || k === "line1" || k === "host")) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".hb");
          var q = function (s) { return root.querySelector(s); };
          var cs = getComputedStyle(root);
          var tok = function (name, d) { return (cs.getPropertyValue("--k-" + name) || "").trim() || d; };
          var INK = tok("ink", "#15171c"), ON = tok("on-accent", "#ffffff");
          if (String(v.backdrop) === "off") q(".hb-bg").style.display = "none";

          // the presenter: a video, a still, or nothing (when the host already runs on its own layer in the project)
          var src = String(v.host || ""), kind = String(v.hostKind || "auto"), side = String(v.side) === "right" ? "right" : "left";
          if (kind === "auto") kind = !src ? "none" : /\.(png|jpe?g|webp|gif|avif|svg)([?#]|$)/i.test(src) ? "image" : "video";
          var vid = q(".hb-host-v"), img = q(".hb-host-i");
          if (kind !== "video") vid.parentNode.removeChild(vid);
          if (kind !== "image") img.parentNode.removeChild(img);
          Array.prototype.forEach.call(root.querySelectorAll(".hb-host"), function (el) { el.style.left = CFG.hostX[side] - CFG.hostW / 2 + "px"; });

          var em = function (s) { var w = 0; for (var c = 0; c < s.length; c++) w += s.charCodeAt(c) > 255 ? 1 : 0.6; return Math.max(w, 1); };
          var txt = q(".hb-txt"), l1 = q(".hb-l1"), l2 = q(".hb-l2"), mid = q(".hb-key");
          var line1 = String(v.line1 || ""), line2 = String(v.line2), key = String(v.key);
          var at = key ? line2.indexOf(key) : -1;
          if (at < 0) { key = line2; at = 0; }
          var x0 = CFG.txtX[side];
          txt.style.left = x0 + "px";
          txt.style.top = CFG.txtTop + "px";
          l1.textContent = line1;
          if (!line1) l1.style.display = "none";
          l1.style.fontSize = Math.floor(Math.min(56, CFG.txtW / em(line1 || "x"))) + "px";
          q(".hb-pre").textContent = line2.slice(0, at);
          mid.textContent = key;
          q(".hb-post").textContent = line2.slice(at + key.length);
          var fs = Math.floor(Math.min(96, CFG.txtW / em(line2)));
          l2.style.fontSize = fs + "px";

          // one brush stroke behind the key: a round, loaded start before it, a full-height body under every glyph of it,
          // and only past its last glyph a dry tail that thins out and flicks up; the words become white text later, so no
          // stroke of them may ever stick out of the paint onto the background
          var kx = x0 + mid.offsetLeft, ky = CFG.txtTop + mid.offsetTop, kw = mid.offsetWidth, kh = mid.offsetHeight;
          var L = CFG.lead * fs, T = CFG.tailOut * fs, H = CFG.body * fs, bw = L + kw + T, bh = 1.6 * fs;
          var bx = kx - L, by = ky + kh / 2 + CFG.drop * fs - bh / 2, uS = L / bw, uE = (L + kw) / bw;
          var r = function (x) { return Math.round(x * 10) / 10; };
          var upper = [], lower = [], N = 72;
          for (var i = 0; i <= N; i++) {
            var u = i / N, p = Math.max(0, (u - uE) / (1 - uE));
            var half = u < uS ? H * Math.sqrt(u / uS) : H * (1 - 0.92 * Math.pow(p, 1.15));
            var c = bh / 2 - CFG.flick * fs * Math.pow(p, 1.6);
            // the brush lifts off: the lower edge climbs faster than the upper one, so the tail thins upwards, not to an arrow tip
            upper.push(r(bw * u) + " " + r(c - half * (1 + 0.25 * p) - 0.02 * fs * Math.sin(17 * u + 1)));
            lower.push(r(bw * u) + " " + r(c + half * (1 - 0.25 * p) + 0.025 * fs * Math.sin(23 * u + 2)));
          }
          var paint = q(".hb-paint");
          paint.style.left = r(bx) + "px";
          paint.style.top = r(by) + "px";
          paint.style.width = r(bw) + "px";
          paint.style.height = r(bh) + "px";
          paint.querySelector("svg").setAttribute("viewBox", "0 0 " + r(bw) + " " + r(bh));
          q(".hb-ink").setAttribute("d", "M " + upper.join(" L ") + " L " + lower.reverse().join(" L ") + " Z");

          var hit = Math.max(1, Number(v.hit) || 1.4), flip = hit + CFG.sweep * CFG.flipAt;
          var tl = gsap.timeline({ paused: true });
          if (line1) tl.fromTo(l1, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: CFG.rise, ease: "power3.out" }, CFG.l1At);
          tl.fromTo(l2, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: CFG.rise, ease: "power3.out" }, line1 ? CFG.l2At : CFG.l1At);
          // the paint is laid down left to right under dark words; once it has covered them, the words flip to the paint's own text colour at once
          tl.fromTo(paint, { clipPath: "inset(-10% 100% -10% 0%)" }, { clipPath: "inset(-10% 0% -10% 0%)", duration: CFG.sweep, ease: "power2.inOut" }, hit);
          tl.fromTo(mid, { color: INK }, { color: ON, duration: 0.06, ease: "none" }, flip);
          tl.fromTo(mid, { scale: 1 }, { scale: CFG.pop, duration: 0.12, ease: "power2.out" }, flip);
          tl.to(mid, { scale: 1, duration: 0.28, ease: "power2.out" }, flip + 0.12);
          window.__timelines["host-brush-mark"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

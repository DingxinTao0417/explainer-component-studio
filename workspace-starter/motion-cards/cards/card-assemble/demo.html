<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"卡片标题","default":"写好提示词"},
    {"id":"items","type":"string","label":"要点（用 | 分隔，2–5 条）","default":"先说清楚目标|再给一个示例|最后限定格式"},
    {"id":"tag","type":"string","label":"底部标签","default":"三步法"},
    {"id":"cues","type":"string","label":"每条要点落位的秒数（逗号分隔，第一条不早于 1.4 秒）","default":"1.6,2.4,3.2"},
        {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>card-assemble · 信息卡拼装</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="card-assemble-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .cs { position: absolute; inset: 0; }
        .cs-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .cs-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .cs-card { position: relative; flex: none; width: 1480px; height: 768px; }
        .cs-fill { position: absolute; inset: 0; border-radius: 40px; background: var(--k-panel); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4); }
        .cs-frame { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        .cs-frame rect { fill: none; stroke: var(--k-accent); stroke-width: 8; stroke-dasharray: 1 1.2; }
        .cs-body { position: absolute; inset: 0; padding: 56px 84px; box-sizing: border-box; display: flex; flex-direction: column; }
        .cs-head { flex: none; display: flex; align-items: center; gap: 44px; height: 160px; margin-bottom: 36px; }
        .cs-ico { position: relative; flex: none; display: block; width: 160px; height: 160px; }
        .cs-ig { position: absolute; inset: 0; box-sizing: border-box; border: 6px dashed var(--k-muted); border-radius: 36px; opacity: 0; }
        .cs-ic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 36px; background: var(--k-accent); }
        .cs-ic svg { display: block; width: 96px; height: 96px; fill: var(--k-on-accent); }
        .cs-slot { position: relative; display: flex; align-items: center; }
        .cs-title { flex: 1; height: 160px; font-size: 104px; font-weight: 900; white-space: nowrap; }
        .cs-li { flex: none; height: 112px; font-size: 76px; font-weight: 700; white-space: nowrap; }
        .cs-foot { flex: none; height: 88px; margin-top: 36px; }
        .cs-ghost { position: absolute; left: 0; top: 50%; width: 62%; height: 36px; margin-top: -18px; border-radius: 18px; background: var(--k-muted); opacity: 0; }
        .cs-li:nth-child(2n) .cs-ghost { width: 78%; }
        .cs-li:nth-child(3n) .cs-ghost { width: 54%; }
        .cs-foot .cs-ghost { width: 230px; height: 72px; margin-top: -36px; border-radius: 36px; }
        .cs-c { position: relative; display: flex; align-items: center; gap: 30px; }
        .cs-dot { flex: none; display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--k-accent); }
        .cs-lt, .cs-tt { display: block; line-height: 1; }
        .cs-tag { height: 88px; padding: 0 40px; box-sizing: border-box; border: 5px solid var(--k-accent); border-radius: 44px; color: var(--k-accent); font-size: 50px; font-weight: 800; white-space: nowrap; }
    
      </style>

      <div id="root" data-composition-id="card-assemble" data-width="1920" data-height="1080">
        <div class="cs">
          <div class="cs-bg"></div>
          <div class="cs-stage">
            <div class="cs-card">
              <div class="cs-fill"></div>
              <svg class="cs-frame" viewBox="0 0 1480 768"><rect x="4" y="4" width="1472" height="760" rx="36" pathLength="1"></rect></svg>
              <div class="cs-body">
                <div class="cs-head">
                  <div class="cs-ico"><span class="cs-ig"></span><span class="cs-ic"><svg viewBox="0 0 100 100"><path d="M50 4 L61 39 L96 50 L61 61 L50 96 L39 61 L4 50 L39 39 Z"></path></svg></span></div>
                  <div class="cs-slot cs-title"><span class="cs-ghost"></span><span class="cs-c"><span class="cs-tt">写好提示词</span></span></div>
                </div>
                <div class="cs-rows">
                  <div class="cs-slot cs-li"><span class="cs-ghost"></span><span class="cs-c"><span class="cs-dot"></span><span class="cs-lt">先说清楚目标</span></span></div>
                  <div class="cs-slot cs-li"><span class="cs-ghost"></span><span class="cs-c"><span class="cs-dot"></span><span class="cs-lt">再给一个示例</span></span></div>
                  <div class="cs-slot cs-li"><span class="cs-ghost"></span><span class="cs-c"><span class="cs-dot"></span><span class="cs-lt">最后限定格式</span></span></div>
                </div>
                <div class="cs-slot cs-foot"><span class="cs-ghost"></span><span class="cs-c cs-tag">三步法</span></div>
              </div>
            </div>
          </div>
    
        </div>
      </div>

      <script>
        (function () {
          var CFG = { first: 1.6, gap: 0.8, minGap: 0.45, floor: 1.4, frameAt: 0.1, frame: 0.55, titleAt: 0.85, iconAt: 1.08, drop: 30, land: 0.36, ghost: 0.16, tagLag: 0.7, rowH: [0, 112, 112, 112, 112, 104], fonts: [0, 76, 76, 76, 76, 72], baseH: 432 };
          var v = { title: "写好提示词", items: "先说清楚目标|再给一个示例|最后限定格式", tag: "三步法", cues: "1.6,2.4,3.2", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".cs");
          var q = function (s) { return root.querySelector(s); };
          var cs = getComputedStyle(root);
          var tok = function (name, d) { return (cs.getPropertyValue("--k-" + name) || "").trim() || d; };
          var INK = tok("ink", "#f3f5f8"), MUTED = tok("muted", "#8b93a3"), ACCENT = tok("accent", "#ffcf33"), ONACC = tok("on-accent", "#14161a");
          if (String(v.backdrop) === "off") q(".cs-bg").style.display = "none";
          var split = function (s, max) { return String(s).split("|").map(function (x) { return x.trim(); }).filter(Boolean).slice(0, max); };
          // rough text width in em: CJK counts 1, latin and digits 0.6
          var em = function (s) { var w = 0; for (var c = 0; c < s.length; c++) w += s.charCodeAt(c) > 255 ? 1 : 0.6; return Math.max(w, 1); };
          // cue times: take what was given, continue at the same spacing, keep a floor and a minimum distance
          var cueList = function (raw, count) {
            var c = String(raw).split(/[,，\s]+/).map(parseFloat).filter(function (x) { return isFinite(x); }).slice(0, count);
            var gap = c.length > 1 ? (c[c.length - 1] - c[0]) / (c.length - 1) : CFG.gap;
            if (!c.length) c.push(CFG.first);
            while (c.length < count) c.push(c[c.length - 1] + gap);
            c[0] = Math.max(c[0], CFG.floor);
            for (var i = 1; i < count; i++) c[i] = Math.max(c[i], c[i - 1] + CFG.minGap);
            return c;
          };
          var items = split(v.items, 5), n = items.length, cues = cueList(v.cues, n);
          var tagAt = cues[n - 1] + Math.min(CFG.tagLag, n > 1 ? cues[n - 1] - cues[n - 2] : CFG.tagLag);

          // card height follows the number of rows; the frame is redrawn to match
          var H = CFG.baseH + n * CFG.rowH[n], card = q(".cs-card"), frame = q(".cs-frame"), rect = frame.querySelector("rect");
          card.style.height = H + "px";
          frame.setAttribute("viewBox", "0 0 1480 " + H);
          rect.setAttribute("height", H - 8);
          q(".cs-tt").textContent = String(v.title);
          q(".cs-title").style.fontSize = Math.floor(Math.min(104, 1060 / em(String(v.title)))) + "px";
          q(".cs-tag").textContent = String(v.tag);
          var rowsBox = q(".cs-rows");
          rowsBox.innerHTML = "";
          var rows = items.map(function (t) {
            var holder = document.createElement("div");
            holder.innerHTML = '<div class="cs-slot cs-li"><span class="cs-ghost"></span><span class="cs-c"><span class="cs-dot"></span><span class="cs-lt"></span></span></div>';
            var r = holder.firstChild;
            r.querySelector(".cs-lt").textContent = t;
            r.style.fontSize = Math.floor(Math.min(CFG.fonts[n], 1240 / em(t))) + "px";
            r.style.height = CFG.rowH[n] + "px";
            rowsBox.appendChild(r);
            return r;
          });
          var part = function (slot) { return { ghost: slot.querySelector(".cs-ghost"), c: slot.querySelector(".cs-c") }; };

          var tl = gsap.timeline({ paused: true });
          var F = CFG.frameAt, FE = CFG.frameAt + CFG.frame;
          // 1) the outline is drawn in one stroke, then the card body fades in behind it
          tl.fromTo(rect, { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, F);
          tl.fromTo(rect, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: CFG.frame, ease: "power2.inOut" }, F);
          tl.fromTo(q(".cs-fill"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, FE - 0.15);
          // 2) grey placeholders mark every slot, so each piece has somewhere to land
          var land = function (slot, t, isText) {
            var p = part(slot);
            tl.fromTo(p.ghost, { opacity: 0 }, { opacity: CFG.ghost, duration: 0.25, ease: "power1.out" }, FE - 0.05);
            tl.to(p.ghost, { opacity: 0, duration: 0.12, ease: "none" }, t);
            tl.fromTo(p.c, { opacity: 0, y: -CFG.drop }, { opacity: 1, y: 0, duration: CFG.land, ease: "back.out(1.8)" }, t);
            return p.c;
          };
          land(q(".cs-title"), CFG.titleAt);
          tl.fromTo(q(".cs-ig"), { opacity: 0 }, { opacity: 0.45, duration: 0.25, ease: "power1.out" }, FE - 0.05);
          tl.to(q(".cs-ig"), { opacity: 0, duration: 0.12, ease: "none" }, CFG.iconAt);
          tl.fromTo(q(".cs-ic"), { opacity: 0 }, { opacity: 1, duration: 0.001, ease: "none" }, CFG.iconAt);
          tl.fromTo(q(".cs-ic"), { scale: 0.3, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.4)" }, CFG.iconAt);
          // 3) points land one by one on their cues; the newest is white, earlier ones step back
          rows.forEach(function (r, i) {
            var c = land(r, cues[i]);
            tl.fromTo(c, { color: INK }, { color: INK, duration: 0.01 }, cues[i]);
            if (i < n - 1) tl.to(c, { color: MUTED, duration: 0.3, ease: "power2.out" }, cues[i + 1]);
            // 4) when the tag closes the card, every point returns to full white: the card is complete
            if (i < n - 1) tl.to(c, { color: INK, duration: 0.3, ease: "power2.out" }, tagAt + 0.1);
          });
          land(q(".cs-foot"), tagAt);
    
          window.__timelines["card-assemble"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

            inner.style.transform = "rotate(" + (-deg).toFixed(2) + "deg)";
            outer.style.filter = "url(#" + id + ")";
          };
        }
        // ==== end kit:speedblur ====

        // shadows: palette shade, 2.6x on dark skins
        var SH = kTone(root) === "dark" ? 2.6 : 1;
        if (String(v.backdrop) === "off") q(".tf-bg").style.display = "none";
        var page = q(".tf-pg"), hit = q(".tf-hit"), qEl = q(".tf-q"), ph = q(".tf-ph"), ring = q(".tf-ring"), cnt = q(".tf-cnt");
        var s = FW / page.offsetWidth; // frame px per page px (1 in the 1920x1080 and 1080x1920 frames)

        // text slots: split, then fit by measuring the laid-out lines
        var nm = q(".tf-nm");
        kSplit(nm, "word", false, v.name);
        kFit(nm, { lines: 1, min: 28, width: L.nameW });
        var fitTitle = function (el, text) {
          el.style.fontSize = "";
          kSplit(el, "word", false, text);
          var r = kFit(el, { lines: 2, min: 28 });
          if (r.lines > 1) el.parentNode.querySelector(".tf-b + .tf-b").style.display = "none"; // two-line title: one body bar
        };
        fitTitle(q(".tf-hit .tf-t"), v.title);
        var chars = kSplit(qEl, "char", false, v.query);
        kFit(qEl, { lines: 1, min: 28, width: L.qW });
        var caret = document.createElement("i");
        caret.className = "tf-ca";
        qEl.appendChild(caret);

        // the grid the result leaves behind: sections of 2 / 3 / 3 other cards, then the result's own section
        var items = String(v.items).split("|").map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 9);
        var groups = [items.slice(0, 2), items.slice(2, 5), items.slice(5, 8), items.slice(8)];
        var proto = hit.cloneNode(true), leave = [], ghost = document.createElement("div"), rank = 0, sec1 = q(".tf-sc"), last = sec1;
        [].forEach.call(proto.querySelectorAll(".tf-rp, .tf-sel"), function (x) { x.remove(); });
        proto.classList.remove("tf-hit");
        proto.querySelector(".tf-b + .tf-b").style.display = "";
        ghost.className = "tf-gh";
        groups.forEach(function (g, si) {
          if (si && si < 3 && !g.length) return;
          var sec = sec1;
          if (si) {
            sec = document.createElement("div");
            sec.className = "tf-sc";
            sec.innerHTML = '<div class="tf-sh"><span>' + SEC[si] + '</span></div><div class="tf-gr"></div>';
            last.after(sec);
            leave.push({ el: sec.firstChild, at: CFG.filter + rank * CFG.leaveGap }); // an emptied header goes with its first card
          }
          last = sec;
          var grid = sec.querySelector(".tf-gr");
          if (si === 3) grid.appendChild(ghost);
          g.forEach(function (x) {
            var c = proto.cloneNode(true);
            grid.appendChild(c);
            fitTitle(c.querySelector(".tf-t"), x);
            leave.push({ el: c, at: CFG.filter + rank++ * CFG.leaveGap });
          });
        });
        var total = items.length + 1;
        // the result flies over the leaving titles and headers for a few frames while they fade: on purpose
        leave.forEach(function (it) {
          [].forEach.call(it.el.querySelectorAll(".tf-u, .tf-sh > span"), function (x) { x.setAttribute("data-layout-allow-occlusion", ""); x.setAttribute("data-layout-allow-overlap", ""); });
        });

        // page positions (offsets ignore the camera transform)
        var at = function (el) { var x = 0, y = 0; while (el && el !== page) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x, y]; };
        var blur = kSpeedBlur(q(".tf-fly"), "tf", { amount: 0.04, max: 7 });
        var slot = at(hit), from = at(ghost), dx0 = from[0] - slot[0], dy0 = from[1] - slot[1];
        var CW = hit.offsetWidth, CH = hit.offsetHeight, CX = slot[0] + CW / 2, CY = slot[1] + CH / 2; // click point
        var keys = [L.type, L.type, [page.offsetWidth * L.ov[0], (FH / s) * L.ov[1], 1], null, [CX, L.landY, L.landZ]];
        keys[3] = keys[2];
        var camE = MT.bezier(0.33, 0, 0.15, 1);
        var cam = function (t) {
          var i = 0;
          while (i < 3 && t > CFG.cam[i + 1]) i++;
          var a = keys[i], b = keys[i + 1], p = camE(MT.clamp((t - CFG.cam[i]) / (CFG.cam[i + 1] - CFG.cam[i]), 0, 1));
          return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p, a[2] + (b[2] - a[2]) * p];
        };
        var I = function (x, a, b, e) { return MT.interpolate(x, a, b, { easing: e, extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };
        var slideE = MT.bezier(0.35, 0, 0.2, 1), moveE = MT.bezier(0.45, 0, 0.2, 1);
        var slideP = function (t) { return I(t, [CFG.filter, CFG.filter + CFG.slide], [0, 1], slideE); };
        // typing ends on [31] for any length, so the breath before the filter stays 11 frames
        var N = chars.length, gap = N > 1 ? MT.clamp((CFG.typeEnd - CFG.type) / (N - 1), CFG.gap[0], CFG.gap[1]) : 0;
        var T0 = Math.max(CFG.type, CFG.typeEnd - gap * Math.max(0, N - 1)), blinkAt = T0 + gap * Math.max(0, N - 1) + CFG.blinkLag;
        var ptr = q(".tf-ptr"), rips = root.querySelectorAll(".tf-rp"), sel = q(".tf-sel"), cs = function (a) { return "color-mix(in srgb, var(--tf-shade) " + (Math.min(1, a * SH) * 100).toFixed(1) + "%, transparent)"; };

        var render = function (t) {
          var c = cam(t), Z = c[2] * s;
          page.style.transform = "translate(" + (FW / 2 - c[0] * Z).toFixed(2) + "px," + (FH / 2 - c[1] * Z).toFixed(2) + "px) scale(" + Z.toFixed(4) + ")";
          // search: placeholder until the first key, then one character at a time; caret solid while typing, then blinking
          var typed = 0, e = 1e-4;
          chars.forEach(function (u, i) { var on = t >= T0 + i * gap - e; u.style.opacity = on ? 1 : 0; if (on) typed = i + 1; });
          ph.style.opacity = typed ? 0 : 1;
          var lu = chars[typed - 1];
          caret.style.left = (lu ? lu.offsetLeft + lu.offsetWidth : 0) + "px";
          caret.style.opacity = t >= T0 - CFG.caretLead - e && t < CFG.caretOff && (t < blinkAt || Math.floor((t - blinkAt + e) / CFG.blink) % 2 === 0) ? 1 : 0;
          ring.style.opacity = I(t, [T0 - CFG.focusIn[0], T0 - CFG.focusIn[1], CFG.focusOut[0], CFG.focusOut[1]], [0, 1, 1, 0]);
          cnt.textContent = "显示 " + (t >= CFG.filter - e ? 1 : total) + " / " + total;
          // filter: the other cards leave in reading order, each fading, sinking, shrinking and blurring
          leave.forEach(function (it) {
            var p = I(t, [it.at, it.at + CFG.leave], [0, 1], "power1.inOut");
            it.el.style.opacity = 1 - p;
            it.el.style.transform = p ? "translate(0px," + (8 * U * p).toFixed(2) + "px) scale(" + (1 - 0.015 * p).toFixed(4) + ")" : "";
            it.el.style.filter = p > 0.02 ? "blur(" + (1.5 * U * p).toFixed(2) + "px)" : "";
          });
          // the result slides up to the first slot, floating on the way (sin), shadow widening, blurred along y
          var sp = slideP(t), fl = Math.sin(sp * Math.PI);
          hit.style.transform = "translate(" + (dx0 * (1 - sp)).toFixed(2) + "px," + (dy0 * (1 - sp)).toFixed(2) + "px) scale(" + (1 + 0.02 * fl).toFixed(4) + ")";
          hit.style.boxShadow = "0 " + ((1 + 2 * fl) * U).toFixed(1) + "px " + ((2 + 4 * fl) * U).toFixed(1) + "px " + cs(0.07 + 0.03 * fl) + ", 0 " + ((4 + 18 * fl) * U).toFixed(1) + "px " + ((12 + 30 * fl) * U).toFixed(1) + "px -" + ((4 + 6 * fl) * U).toFixed(1) + "px " + cs(0.09 + 0.12 * fl);
          blur(0, MT.velocity(function (x) { return dy0 * (1 - slideP(x)); }, t));
          // pointer: constant size on screen, arcs down to the click point, presses at the click
          var m = I(t, CFG.move, [0, 1], moveE), px = L.from[0] + (CX - L.from[0]) * m, py = L.from[1] + (CY - L.from[1]) * m + Math.sin(m * Math.PI) * L.arc;
          ptr.style.opacity = I(t, CFG.ptr, [0, 1, 1, 0]);
          ptr.style.transform = "translate(" + px.toFixed(2) + "px," + py.toFixed(2) + "px) scale(" + ((1.6 / c[2]) * I(t, CFG.press, [1, 0.86, 1])).toFixed(4) + ")";
          // click: two rings from the click point, 3 frames apart; then the outline lights
          [0, 1].forEach(function (r) {
            var a = CFG.click + r * CFG.ringLag, on = t >= a && t <= a + CFG.ring, k = I(t, [a, a + CFG.ring], [0, 1], "power2.out");
            var rad = (14 + ((r ? 78 : 54) - 14) * k) * U, el = rips[r];
            el.style.opacity = on ? 1 - k : 0;
            el.style.width = el.style.height = (2 * rad).toFixed(1) + "px";
            el.style.margin = (-rad).toFixed(1) + "px 0 0 " + (-rad).toFixed(1) + "px";
          });
          sel.style.opacity = t >= CFG.sel - e ? I(t, [CFG.sel, CFG.sel + CFG.selIn], [0.5, 1]) : 0;
          sel.style.transform = "scale(" + I(t, [CFG.sel, CFG.sel + CFG.selSet], [1.015, 1], "power2.out").toFixed(4) + ")";
        };
        var tl = MT.scene(CFG.dur, render);
        window.__timelines["type-and-filter"] = tl;
      })();
      </script>
    </template>
  </body>

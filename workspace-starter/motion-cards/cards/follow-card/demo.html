<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"host","type":"string","label":"头像图地址（透明底人物或方形头像）","default":"motion-cards/lib/samples/presenter-bust.png"},
    {"id":"who","type":"string","label":"名字（8 字以内）","default":"你的名字"},
    {"id":"bio","type":"string","label":"一行简介（14 字以内，可空）","default":"每周一条，把一件事讲明白"},
    {"id":"btn","type":"string","label":"按钮文字：按之前","default":"关注"},
    {"id":"btnDone","type":"string","label":"按钮文字：按之后","default":"已关注"},
    {"id":"cardY","type":"number","label":"卡片顶边位置（px）","default":320,"min":40,"max":600,"step":10},
    {"id":"pressAt","type":"number","label":"按钮被按下的时间（秒）","default":1.7,"min":1.1,"max":10,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>follow-card · 关注卡</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="follow-card-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .fc { position: absolute; inset: 0; }
        .fc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .fc-card { position: absolute; left: 100px; top: 320px; width: 1720px; height: 440px; display: flex; align-items: center; padding: 0 90px 0 80px; border-radius: 56px; background: var(--k-panel); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45); }
        .fc-ava { position: relative; display: block; flex: none; width: 290px; height: 290px; overflow: hidden; border-radius: 50%; background: var(--k-accent); }
        .fc-face { position: absolute; left: -29px; top: 32px; width: 348px; height: 435px; background: center / contain no-repeat; }
        .fc-info { display: block; flex: 1; min-width: 0; margin: 0 48px 0 60px; }
        .fc-name { display: block; font-size: 88px; line-height: 118px; font-weight: 800; white-space: nowrap; }
        .fc-bio { display: block; margin-top: 8px; font-size: 50px; line-height: 70px; color: var(--k-muted); white-space: nowrap; }
        .fc-btn { position: relative; display: block; flex: none; width: 400px; height: 140px; border: 5px solid var(--k-muted); border-radius: 70px; }
        .fc-fill { position: absolute; inset: -5px; border-radius: 70px; background: var(--k-accent); }
        .fc-ring { position: absolute; inset: -5px; border: 7px solid var(--k-accent); border-radius: 70px; opacity: 0; }
        .fc-lab { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 58px; font-weight: 800; white-space: nowrap; }
        .fc-todo { color: var(--k-on-accent); }
        .fc-tick { display: block; flex: none; width: 54px; height: 54px; margin-right: 14px; }
      </style>

      <div id="root" data-composition-id="follow-card" data-width="1920" data-height="1080">
        <div class="fc">
          <div class="fc-bg"></div>
          <div class="fc-card">
            <div class="fc-ava" data-layout-allow-overflow><div class="fc-face" style="background-image: url(motion-cards/lib/samples/presenter-bust.png)"></div></div>
            <div class="fc-info">
              <span class="fc-name">你的名字</span>
              <span class="fc-bio">每周一条，把一件事讲明白</span>
            </div>
            <div class="fc-btn">
              <div class="fc-fill"></div>
              <div class="fc-lab fc-done" data-layout-allow-overlap data-layout-allow-occlusion><svg class="fc-tick" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path class="fc-tickp" d="M8 23 L18 33 L37 12" /></svg><span class="fc-donet" data-layout-allow-overlap data-layout-allow-occlusion>已关注</span></div>
              <div class="fc-lab fc-todo" data-layout-allow-overlap>关注</div>
              <div class="fc-ring"></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            at: 0.3,        // card starts rising
            rise: 0.55,
            from: 300,      // px below its seat
            down: 0.1,      // press: how long the button takes to go down
            depth: 0.88,    // press: how small it gets
            up: 0.45,       // release, springy
            bump: 10,       // px the whole card gives under the press
          };
          var v = { who: "你的名字", bio: "每周一条，把一件事讲明白", btn: "关注", btnDone: "已关注", pressAt: 1.7, cardY: 320, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".fc");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".fc-bg").style.display = "none";
          if (v.host) q(".fc-face").style.backgroundImage = 'url("' + String(v.host) + '")';
          q(".fc-name").textContent = String(v.who || "");
          q(".fc-bio").textContent = String(v.bio || "");
          if (!v.bio) q(".fc-bio").style.display = "none";
          q(".fc-todo").textContent = String(v.btn || "");
          q(".fc-donet").textContent = String(v.btnDone || "");
          var card = q(".fc-card"), btn = q(".fc-btn"), go = CFG.at;
          card.style.top = (parseFloat(v.cardY) || 0) + "px";
          var press = Math.max(go + 0.8, parseFloat(v.pressAt) || 1.7), hit = press + CFG.down;

          var tl = gsap.timeline({ paused: true });
          // 1) the card rises as one piece; what is on it lands a beat behind, left to right
          tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, go);
          tl.fromTo(card, { y: CFG.from }, { y: 0, duration: CFG.rise, ease: "back.out(1.3)" }, go);
          tl.fromTo(q(".fc-ava"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, go + 0.2);
          tl.fromTo([q(".fc-name"), q(".fc-bio")], { opacity: 0, x: 36 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.1 }, go + 0.3);
          tl.set(btn, { opacity: 0 }, 0);
          tl.set(btn, { opacity: 1 }, go + 0.48);
          tl.fromTo(btn, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.2)" }, go + 0.48);
          // before the press the button is the filled "follow" state
          tl.set(q(".fc-done"), { opacity: 0 }, 0);
          tl.set(q(".fc-tickp"), { strokeDasharray: 46, strokeDashoffset: 46 }, 0);
          // 2) the press: down fast, state swaps at the bottom, springs back
          tl.to(btn, { scale: CFG.depth, duration: CFG.down, ease: "power2.in" }, press);
          tl.to(card, { y: CFG.bump, duration: CFG.down, ease: "power2.in" }, press);
          tl.set([q(".fc-fill"), q(".fc-todo")], { opacity: 0 }, hit);
          tl.set(q(".fc-done"), { opacity: 1 }, hit);
          tl.to(q(".fc-tickp"), { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" }, hit + 0.08);
          tl.to(btn, { scale: 1, duration: CFG.up, ease: "back.out(3.4)" }, hit);
          tl.to(card, { y: 0, duration: 0.4, ease: "back.out(2)" }, hit);
          tl.fromTo(q(".fc-ring"), { scaleX: 1, scaleY: 1, opacity: 0.9 }, { scaleX: 1.22, scaleY: 1.6, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, hit);
          window.__timelines["follow-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

      <style>

  #root {

    --k-ink: var(--mc-ink, #15171c);

  }

  /* ==== kit:derived@1 ==== */
  .mr {

    .mr-sub { margin-top: 20px; }
    .mr-cap { left: 30px; bottom: 26px; }

  }
  function kSplit(el, by, rise, text) {

      sB: CFG.bc + CFG.lag + kStagger(i, 12, CFG.bcSpread)

    o.ph = o.el.querySelector(".mr-ph");

  setText(q(".mr-name"), v.name, { width: L.nameW, lines: 2 });
  var labs = [].slice.call(root.querySelectorAll(".mr-lab")), views = kWords(v.views);
  labs.forEach(function (lb, j) { setText(lb, views[j] ? views[j].t : "", { width: L.sw - 12, min: 30 }); });
  var t0 = T[0], capW = t0.B.w - 2 * L.capL;
  t0.el.insertAdjacentHTML("beforeend", '<div class="mr-cap" style="width:' + capW + 'px"><div class="mr-kick"></div><div class="mr-pick"></div><div class="mr-meta"></div></div>');

  kFit(kickEl, { width: capW });

  var pill = q(".mr-pill"), str = dark ? 2.6 : 1;

    return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
  }
  // ==== end kit:fit ====

  var tone = kTone(root), off = String(v.backdrop) === "off";
  if (getComputedStyle(root).getPropertyValue("--mc-font").trim()) root.style.setProperty("--sh-hv", "var(--k-font)");
  var pos = q(".sh-pos"), txt = q(".sh-txt"), type = q(".sh-type"), glow = q(".sh-glow"), mk = q(".sh-mk");
  if (off) ["backdrop", "vig", "glow", "grain"].forEach(function (n) { q(".sh-" + n).style.display = "none"; });
  var img = String(v.image).trim(), logo = String(v.logo).trim(), sub = String(v.sub).trim();
  // a picture as the poster: darkened toward the bottom so the light type reads on any photo
  if (img) pos.style.setProperty("--sh-base", "linear-gradient(color-mix(in srgb, var(--k-stage) 35%, transparent), color-mix(in srgb, var(--k-stage) 68%, transparent)), url(\"" + img.replace(/"/g, "%22") + "\") 50% 50% / cover no-repeat");
  if (logo === "none") mk.style.display = "none";
  else if (logo) { mk.innerHTML = ""; var li = document.createElement("img"); li.src = logo; li.alt = ""; mk.appendChild(li); }
  // text slots: the title in "|" phrases, the subline as whole lines (kWords drops the space after a lone " · ");
  // then the measured fit: title one line down to 72px, then two; subline one line down to 40px, then it wraps
  var tt = q(".sh-tt"), st = q(".sh-st");
  kSplit(tt, "word", false, v.title);
  kFit(tt, { lines: 1, min: 72 });
  if (sub) { kSplit(st, "line", false, sub); kFit(st, { lines: 1, min: 40 }); } else q(".sh-su").style.display = "none";
  // geometry: u = one upstream design px (480 x 270 stage), the poster box comes from the CSS
  var u = Math.min(FW, FH) / 270, PW = txt.offsetWidth || FW * 0.8, PH = txt.offsetHeight || FH * 0.56, TW = PW / 5, TH = PH / 5, S = u / 2, D = Math.PI / 180;
  // a title taller than its row (three lines in portrait) pushes the mark up inside its cell and the subline down
  var over = Math.max(0, tt.offsetHeight - TH * 0.9) / 2;
  if (over) { mk.style.paddingBottom = 20 + over + "px"; q(".sh-su").style.marginTop = over + "px"; }

  // the tiles' copy of the type: same nodes and sizes, every text run turned into <i data-t> drawn by ::before
  var gh = type.cloneNode(true), tw = document.createTreeWalker(gh, NodeFilter.SHOW_TEXT), tn, runs = [];
  while ((tn = tw.nextNode())) if (tn.data.trim()) runs.push(tn);
  runs.forEach(function (n) { var i = document.createElement("i"); i.setAttribute("data-t", n.data); n.parentNode.replaceChild(i, n); });
  gh.classList.add("sh-gh");

  // perspective (900 design px), its origin and the poster centre in frame px, half a cell's diagonal: the off-frame test
  var PP = 900 * u, OX = FW / 2, OY = FH * L.cy, PX = txt.offsetLeft + PW / 2, PY = txt.offsetTop + PH / 2, HD = Math.hypot(TW, TH) / 2;
  q(".sh-cam").style.perspective = PP + "px";
  pos.removeChild(q(".sh-face"));
  var LE = MT.bezier(0.42, 0, 0.3, 1), IN2 = MT.ease("power2.in"), OUT2 = MT.ease("power2.out"), IO1 = MT.ease("power1.inOut"), IN1 = MT.ease("power1.in");
  // the parts of the type (mark, title, subline) as boxes in poster px, 8px spare for overhang: a cell only carries
  // the parts it shows, which keeps the page small for the layout checks
  var tr = txt.getBoundingClientRect(), parts = [].map.call(type.children, function (p) {
    var g = document.createRange(), b;
    g.selectNodeContents(p); b = g.getBoundingClientRect();
    return b.width ? [b.left - tr.left - 8, b.top - tr.top - 8, b.right - tr.left + 8, b.bottom - tr.top + 8] : null;
  });
  var tiles = [];
  for (var i = 0; i < 25; i++) {
    var r = (i / 5) | 0, c = i % 5, m = Math.abs(r - 2) + Math.abs(c - 2), H = function (n) { return kHash(i + n); };
    // exit heading: away from the centre with +-0.4 cell of jitter; the centre tile takes a seeded angle
    var ang = m ? Math.atan2(r - 2 + (H(310) - 0.5) * 0.8, c - 2 + (H(320) - 0.5) * 0.8) : H(300) * Math.PI * 2;
    var el = document.createElement("div");
    el.className = "sh-tl";
    el.style.cssText = "left:" + (c * TW + S / 2) + "px;top:" + (r * TH + S / 2) + "px;width:" + (TW - S) + "px;height:" + (TH - S) + "px";
    el.innerHTML = '<div class="sh-cl"><div class="sh-sl" style="left:' + (-c * TW - S / 2) + "px;top:" + (-r * TH - S / 2) + "px;width:" + PW + "px;height:" + PH + 'px"></div><div class="sh-sd"></div></div>';
    var gc = gh.cloneNode(true), keep = 0;
    for (var k = parts.length - 1; k >= 0; k--) {
      var b = parts[k];
      if (b && b[0] < (c + 1) * TW && b[2] > c * TW && b[1] < (r + 1) * TH && b[3] > r * TH) keep = 1;
      else gc.removeChild(gc.children[k]);
    }
    if (keep) el.querySelector(".sh-sl").appendChild(gc);
    pos.appendChild(el);
    tiles.push({
      el: el, sd: el.querySelector(".sh-sd"), cx: (c + 0.5) * TW - PW / 2, cy: (r + 0.5) * TH - PH / 2, d: m * CFG.wave, o: CFG.out + m * CFG.outWave, wob: H(360) < 0.5 ? -1 : 1,
      dx: (H(0) - 0.5) * L.ax, dy: (H(50) - 0.5) * L.ay, dz: (H(100) - 0.3) * 700,
      rx: (H(150) - 0.5) * 360, ry: (H(200) - 0.5) * 360, rz: (H(250) - 0.5) * 360,
      ex: Math.cos(ang) * (L.ex[0] + H(330) * L.ex[1]), ey: Math.sin(ang) * (L.ey[0] + H(340) * L.ey[1]), er: (H(350) - 0.5) * 300,
      blur: kSpeedBlur(el, "sh", { amount: CFG.blur })
    });
  }
  // one tile's pose at t: scatter -> cell (tin), a damped rotateX click after landing, then out along its heading (tout)
  var pose = function (T, t) {
    var tin = MT.ramp(t, T.d, CFG.land, LE), inv = 1 - tin, tout = MT.ramp(t, T.o, CFG.outDur, IN2);
    var f = (t - T.d - CFG.land) * 30, st = f > 0 && f < 14 ? Math.exp(-f / 3.2) * Math.sin(f * 0.75) : 0; // frames at 30 fps
    return { x: (T.dx * inv + T.ex * tout) * u, y: (T.dy * inv + T.ey * tout) * u, z: (T.dz * inv - 4 * Math.abs(st)) * u,
      rx: T.rx * inv + T.wob * 2.5 * st, ry: T.ry * inv, rz: T.rz * inv + T.er * tout, a: Math.min(1, tin * 2.5) };
  };
  var grain = off ? function () {} : kGrain(q(".sh-grain"), { opacity: 0.08, blend: "soft-light" });

  var tl = MT.scene(CFG.dur, function (t) {
    var ps = 1 + 0.03 * MT.ramp(t, CFG.push, CFG.pushDur, IO1), k = "scale(" + ps.toFixed(5) + ")", whole = t < CFG.out;
    pos.style.transform = txt.style.transform = k;
    glow.style.opacity = (MT.ramp(t, CFG.glow, CFG.glowDur, OUT2) * (1 - MT.ramp(t, CFG.out, CFG.glowOut, IN1))).toFixed(3);
    // the unsliced type holds the poster until the first tile leaves, then the tiles' copies take over
    txt.style.opacity = whole ? MT.ramp(t, CFG.type, CFG.typeDur, OUT2).toFixed(3) : 0;
    root.style.setProperty("--sh-g", whole ? 0 : 1);
    tiles.forEach(function (T) {
      var p = pose(T, t), a = pose(T, t - 1 / 60), b = pose(T, t + 1 / 60), vx = (b.x - a.x) * 30, vy = (b.y - a.y) * 30, w = -p.rz * D;
      // a tile wholly outside the frame (centre projected through the perspective, half diagonal + 120px spare) is not
      // drawn: its blur filter is most of the paint cost of a frame
      var f = PP / (PP - p.z - HD), X = OX + (PX + ps * (T.cx + p.x) - OX) * f, Y = OY + (PY + ps * (T.cy + p.y) - OY) * f, R = HD * f + 120;
      if (X + R < 0 || X - R > FW || Y + R < 0 || Y - R > FH) { T.el.style.opacity = 0; T.blur(0, 0); return; }
      T.el.style.opacity = p.a.toFixed(3);
      T.el.style.transform = "translate3d(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px," + p.z.toFixed(2) + "px) rotateX(" + p.rx.toFixed(3) + "deg) rotateY(" + p.ry.toFixed(3) + "deg) rotateZ(" + p.rz.toFixed(3) + "deg)";
      // facing shade: darker the more the tile turns away from the camera
      T.sd.style.opacity = ((1 - Math.abs(Math.cos(p.rx * D) * Math.cos(p.ry * D))) * 0.6).toFixed(3);
      // motion blur along the screen velocity, turned into the tile's own plane; under sigma 1 (250 px/s) it is not
      // visible and only costs paint time, so it starts there
      if (Math.hypot(vx, vy) * CFG.blur < 30) T.blur(0, 0);
      else T.blur(vx * Math.cos(w) - vy * Math.sin(w), vx * Math.sin(w) + vy * Math.cos(w));
    });
    grain(t);
  });
  window.__timelines["shard-assemble-poster"] = tl;
})();
      </script>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"src","type":"string","label":"截图地址（1920×1080，从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},
    {"id":"x","type":"number","label":"要看的位置：中心 x（截图像素）","default":545,"min":0,"max":1920,"step":1},
    {"id":"y","type":"number","label":"要看的位置：中心 y（截图像素）","default":736,"min":0,"max":1080,"step":1},
    {"id":"mag","type":"number","label":"放大倍数","default":2.1,"min":1.3,"max":4,"step":0.1},
    {"id":"size","type":"number","label":"镜片直径（像素）","default":440,"min":200,"max":800,"step":10},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>magnifier-lens · 放大镜</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="magnifier-lens-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .ml { position: absolute; inset: 0; overflow: hidden; }
        .ml-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .ml-base { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; object-fit: cover; }
        .ml-g { position: absolute; left: 0; top: 0; width: 440px; height: 440px; }
        .ml-handle { position: absolute; left: 50%; top: 50%; width: 46px; height: 190px; margin: 0 0 0 -23px; border-radius: 23px; background: var(--k-panel); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.4); transform-origin: 50% 0; transform: rotate(42deg) translateY(214px); }
        .ml-glass { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: var(--k-bg); box-shadow: 0 34px 70px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.35); }
        .ml-in { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; max-width: none; object-fit: cover; }
        .ml-shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 46%); box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.22); }
        .ml-ring { position: absolute; inset: -6px; border-radius: 50%; border: 12px solid var(--k-ink); }
        .ml-ring2 { position: absolute; inset: -6px; border-radius: 50%; border: 12px solid var(--k-accent); opacity: 0; }
      </style>

      <div id="root" data-composition-id="magnifier-lens" data-width="1920" data-height="1080">
        <div class="ml">
          <div class="ml-bg"></div>
          <img class="ml-base" src="motion-cards/lib/samples/ui.png" data-var-src="src" alt="" />
          <div class="ml-g">
            <div class="ml-handle" data-layout-allow-overflow></div>
            <div class="ml-glass" data-layout-allow-overflow><img class="ml-in" src="motion-cards/lib/samples/ui.png" data-var-src="src" alt="" /></div>
            <div class="ml-shine"></div>
            <div class="ml-ring"></div>
            <div class="ml-ring2"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // the lens appears fromX px sideways and fromY px above/below the target (always towards the middle of the frame), then glides: x eases both ways, y brakes only, which bends the path into an arc
          var CFG = { appear: 0.25, appearDur: 0.3, go: 0.7, glide: 1.0, fromX: 1130, fromY: 290, lockDur: 0.3, lockScale: 1.07 };
          var v = { src: "", x: 545, y: 736, mag: 2.1, size: 440, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}
          var num = function (key, d) { var n = parseFloat(v[key]); return isFinite(n) ? n : d; };

          var root = document.querySelector(".ml");
          var q = function (s) { return root.querySelector(s); };
          if (v.src) { q(".ml-base").setAttribute("src", String(v.src)); q(".ml-in").setAttribute("src", String(v.src)); }
          if (String(v.backdrop) === "off") q(".ml-bg").style.display = "none";

          var size = num("size", 440), R = size / 2, mag = num("mag", 2.1);
          var x1 = num("x", 545), y1 = num("y", 736);
          var x0 = Math.max(R, Math.min(1920 - R, x1 + CFG.fromX * (x1 < 960 ? 1 : -1)));
          var y0 = Math.max(R, Math.min(1080 - R, y1 + CFG.fromY * (y1 > 700 ? -1 : 1)));
          var g = q(".ml-g"), inner = q(".ml-in");
          g.style.width = g.style.height = size + "px";

          // lens centred on (cx, cy) shows the same point of the screenshot, magnified: the inner copy is offset by R - c·mag
          var gx = function (c) { return c - R; }, ix = function (c) { return R - c * mag; };

          var tl = gsap.timeline({ paused: true });
          tl.set(inner, { transformOrigin: "0 0", scale: mag }, 0);
          tl.fromTo(g, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: CFG.appearDur, ease: "back.out(1.8)" }, CFG.appear);
          // group and inner copy use the same ease and duration per axis, so the picture in the glass never slips
          tl.fromTo(g, { x: gx(x0) }, { x: gx(x1), duration: CFG.glide, ease: "power2.inOut" }, CFG.go);
          tl.fromTo(inner, { x: ix(x0) }, { x: ix(x1), duration: CFG.glide, ease: "power2.inOut" }, CFG.go);
          tl.fromTo(g, { y: gx(y0) }, { y: gx(y1), duration: CFG.glide, ease: "power3.out" }, CFG.go);
          tl.fromTo(inner, { y: ix(y0) }, { y: ix(y1), duration: CFG.glide, ease: "power3.out" }, CFG.go);
          // lock-on: the rim turns to the accent colour and gives one small squeeze
          var lock = CFG.go + CFG.glide - 0.08;
          tl.fromTo(q(".ml-ring2"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, lock);
          tl.to(g, { scale: CFG.lockScale, duration: 0.1, ease: "power2.out" }, lock);
          tl.to(g, { scale: 1, duration: CFG.lockDur, ease: "back.out(2.5)" }, lock + 0.1);
          window.__timelines["magnifier-lens"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

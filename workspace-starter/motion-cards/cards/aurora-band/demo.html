<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"示例标题（留空不显示）","default":"色带在后面慢慢错开"},
    {"id":"speed","type":"number","label":"速度倍数","default":1,"min":0.2,"max":3,"step":0.1},
    {"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.6,"min":0,"max":1,"step":0.05}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>aurora-band · 极光带</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="aurora-band-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .ab { position: absolute; inset: 0; overflow: hidden; }
        .ab-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .ab-fx { position: absolute; inset: 0; opacity: 0.6; }
        .ab-hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 160px; }
        .ab-title { display: block; font-size: 92px; font-weight: 800; line-height: 1.3; letter-spacing: 0.02em; text-align: center; }
        .ab-h { position: absolute; left: -820px; width: 3560px; transform: rotate(-17deg); }
        .ab-h1 { top: 20px; height: 330px; }
        .ab-h2 { top: 350px; height: 420px; }
        .ab-h3 { top: 740px; height: 300px; }
        .ab-band { display: block; width: 100%; height: 100%; }
        .ab-b1 { background: radial-gradient(ellipse 30% 50% at 34% 50%, color-mix(in srgb, var(--k-accent-2) 60%, transparent), transparent), radial-gradient(ellipse 26% 46% at 76% 50%, color-mix(in srgb, var(--k-accent-2) 42%, transparent), transparent), linear-gradient(to bottom, transparent, color-mix(in srgb, var(--k-accent-2) 16%, transparent) 50%, transparent); }
        .ab-b2 { background: radial-gradient(ellipse 28% 50% at 24% 50%, color-mix(in srgb, var(--k-accent) 34%, transparent), transparent), radial-gradient(ellipse 32% 48% at 68% 50%, color-mix(in srgb, var(--k-accent) 44%, transparent), transparent), linear-gradient(to bottom, transparent, color-mix(in srgb, var(--k-accent) 12%, transparent) 50%, transparent); }
        .ab-b3 { background: radial-gradient(ellipse 34% 50% at 44% 50%, color-mix(in srgb, var(--k-accent-2) 50%, transparent), transparent), radial-gradient(ellipse 22% 44% at 84% 50%, color-mix(in srgb, var(--k-accent) 30%, transparent), transparent), linear-gradient(to bottom, transparent, color-mix(in srgb, var(--k-accent-2) 14%, transparent) 50%, transparent); }
      </style>

      <div id="root" data-composition-id="aurora-band" data-width="1920" data-height="1080">
        <div class="ab" data-layout-allow-overflow>
          <div class="ab-bg"></div>
          <div class="ab-fx">
            <div class="ab-h ab-h1"><div class="ab-band ab-b1"></div></div>
            <div class="ab-h ab-h2"><div class="ab-band ab-b2"></div></div>
            <div class="ab-h ab-h3"><div class="ab-band ab-b3"></div></div>
          </div>
          <div class="ab-hold"><span class="ab-title">色带在后面慢慢错开</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { dur: 6, slide: [260, -320, 220], wide: [[0.82, 1.2], [1.18, 0.8], [0.9, 1.25]] };
          var v = { title: "色带在后面慢慢错开", speed: 1, strength: 0.6 };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".ab");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          var ttl = q(".ab-title");
          ttl.textContent = String(v.title || "");
          if (!v.title) q(".ab-hold").style.display = "none";
          var sp = Math.min(3, Math.max(0.2, parseFloat(v.speed) || 1));
          var st = parseFloat(v.strength);
          if (isNaN(st)) st = 0.6;
          var fx = q(".ab-fx");
          fx.style.opacity = String(Math.min(1, Math.max(0, st)));
          var D = CFG.dur;

          var tl = gsap.timeline({ paused: true });
          // neighbours slide in opposite directions along their own length, and each one's width breathes once
          all(".ab-band").forEach(function (b, i) {
            var dx = CFG.slide[i] * sp, w = CFG.wide[i];
            tl.fromTo(b, { x: -dx / 2 }, { x: dx / 2, duration: D, ease: "sine.inOut" }, 0);
            tl.fromTo(b, { scaleY: w[0] }, { scaleY: w[1], duration: D / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
          });
          window.__timelines["aurora-band"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

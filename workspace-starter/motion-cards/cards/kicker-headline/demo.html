<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"kicker","type":"string","label":"引子小字","default":"很多人第一步就错了"},
    {"id":"headline","type":"string","label":"大标题（建议 5–9 个字）","default":"先别急着写提示词"},
    {"id":"give","type":"number","label":"小字让位的时间（秒）","default":1.1,"min":0.5,"max":10,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>kicker-headline · 小标带大标</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="kicker-headline-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .kkh { position: absolute; inset: 0; }
        .kkh-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .kkh-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .kkh-kicker { display: flex; align-items: center; height: 64px; margin-bottom: 44px; font-size: 56px; font-weight: 700; letter-spacing: 0.14em; white-space: nowrap; color: var(--k-accent); }
        .kkh-dash { display: block; width: 56px; height: 8px; margin: 0 30px; border-radius: 4px; background: var(--k-accent); }
        .kkh-ktext { display: block; }
        .kkh-head { display: block; height: 190px; line-height: 190px; font-size: 156px; font-weight: 900; letter-spacing: 0.02em; white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="kicker-headline" data-width="1920" data-height="1080">
        <div class="kkh">
          <div class="kkh-bg"></div>
          <div class="kkh-stage">
            <div class="kkh-kicker"><span class="kkh-dash"></span><span class="kkh-ktext">很多人第一步就错了</span><span class="kkh-dash"></span></div>
            <span class="kkh-head">先别急着写提示词</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { kickAt: 0.2, kickIn: 0.3, kickBig: 1.3, lift: 171, yield: 0.5, lag: 0.26, headFrom: 0.4, headDur: 0.5 };
          var v = { kicker: "很多人第一步就错了", headline: "先别急着写提示词", give: 1.1, backdrop: "on" };
          try {
                      var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
                      for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
                    } catch (e) {}
          var root = document.querySelector(".kkh");
          var q = function (s) { return root.querySelector(s); };
          q(".kkh-ktext").textContent = String(v.kicker);
          q(".kkh-head").textContent = String(v.headline);
          if (String(v.backdrop) === "off") q(".kkh-bg").style.display = "none";
          var kick = q(".kkh-kicker"), head = q(".kkh-head");
          var give = Math.max(CFG.kickAt + CFG.kickIn, parseFloat(v.give) || 1.1);

          var tl = gsap.timeline({ paused: true });
          // the kicker first sits exactly where the headline's centre will be, a size up so it can carry the frame alone
          tl.fromTo(kick, { opacity: 0, y: CFG.lift + 24, scale: CFG.kickBig }, { opacity: 1, y: CFG.lift, scale: CFG.kickBig, duration: CFG.kickIn, ease: "power3.out" }, CFG.kickAt);
          // it gives way upward and shrinks to its supporting size
          tl.to(kick, { y: 0, scale: 1, duration: CFG.yield, ease: "power3.inOut" }, give);
          // the headline grows out of the spot the kicker is leaving, a beat behind it
          tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, give + CFG.lag);
          tl.fromTo(head, { scale: CFG.headFrom }, { scale: 1, duration: CFG.headDur, ease: "expo.out" }, give + CFG.lag);
          window.__timelines["kicker-headline"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

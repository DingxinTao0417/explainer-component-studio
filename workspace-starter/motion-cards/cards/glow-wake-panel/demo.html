 Changes (2026-10): Remotion/React -> HyperFrames MT scene, frames to seconds; --k-* palette with --k-stage (#040308
 -> stage, purple / pink light -> accent-2 and an accent-2 + accent mix, tail blue -> accent-2 + on-stage, grey UI ->
 ink mixes on --k-panel, column rules -> accent / accent-2); upstream mark and wordmark -> the neutral mark and a bar;
 the kanban panel redrawn as one inline SVG with the same boxes (sidebar 300, two columns, three task cards each); the
 back "ghost" panel keeps the sidebar only (its main area is hidden behind the front panel); src fills both panels;
 preserve-3d dropped (every layer is flat in the group plane); added: film grain against banding, and on dark skins a
 screen-blended pool of on-stage light (16%) under the head; portrait: the 16:9 scene scaled 0.66 into the middle
 band, the panel rolled -40 deg instead of -17 and the drift halved, so the sweep climbs the tall frame. Kept as upstream: panel 1250 x 860 r 26 at 400,150, scale 1.05, rotateY -13 / X 9 / Z -17, perspective
 1700 at 46% 40%, light 4f -> 120f linear -260 -> 1510 px, envelope 0/16/100/130f, tail 100/116/132f, drift

<style>

@font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }

#root {
 --k-bg: var(--mc-bg, #ffffff);
 --k-panel: var(--mc-panel, #f4f5f7);

.gwp { position: absolute; inset: 0; container-type: size;

 --gwp-core: color-mix(in srgb, var(--k-on-stage) 82%, var(--k-accent-2));
 --gwp-pink: color-mix(in srgb, var(--k-on-stage) 35%, color-mix(in srgb, var(--k-accent-2) 65%, var(--k-accent))); }

.gwp-l { inset: 0; }

.gwp-fit { left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; perspective: 1700px; perspective-origin: 46% 40%; }
/* the tilted panel group (static = the hero frame, 62f) */

<script>
(function () {
 // timing in seconds (upstream frames / 30), shared by both orientations: the light crosses 4f -> 120f, the panel
 // wakes over 0-16f and sleeps over 100-130f, the right-edge tail swells 100-116f and settles at 132f; 140f long
 var CFG = { dur: 4.667, run: [0.133, 4], env: [0, 0.533, 3.333, 4.333], tail: [3.333, 3.867, 4.4], drift: 4.4 };
 // panel and light, upstream px in the panel's own plane: width, light row, light start / end, mark x, glow width
 var W = 1250, SY = 150, X0 = -260, X1 = W + 260, MARK = 60, MW = 230;
 // layout per orientation: the 16:9 scene's scale and offset, the panel's roll and the drift's size (portrait: a
 // steeper roll and half the drift so the sweep climbs the tall frame from the mark at x ~180 to the far corner at
 // x ~810, both inside the 10% margins)
 var LAND = { k: 1, x: 0, y: 0, rz: -17, dr: 1 };
 var PORT = { k: 0.66, x: -70, y: 366, rz: -40, dr: 0.5 };
 var v = { src: "", backdrop: "on" };
 try {
  var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
 } catch (e) {}

 var root = document.querySelector(".gwp");
 var q = function (s) { return root.querySelector(s); };
 var qa = function (s) { return [].slice.call(root.querySelectorAll(s)); };
 var FW = root.clientWidth, FH = root.clientHeight;
 if (!FW || !FH) {
  // not laid out yet: the host clip's declared size, then the window
  var hc = root.closest("[data-width][data-height]");
  FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
  FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
 }
 var P = FH > FW, L = P ? PORT : LAND;
 root.setAttribute("data-orient", P ? "portrait" : "landscape");
 if (String(v.backdrop) === "off") q(".gwp-stage").style.display = "none";
 var src = String(v.src).trim();
 if (src) qa(".gwp-pn").forEach(function (p) {
  p.style.backgroundImage = 'url("' + src.replace(/"/g, "%22") + '")';
  p.firstChild.style.display = "none";
 });

 // the scene keeps its own 16:9 px (the CSS box of .gwp-fit); the frame decides scale and offset
 var fit = q(".gwp-fit"), DW = fit.offsetWidth, DH = fit.offsetHeight, u = P ? FW / DH : FW / DW;
 fit.style.transform = "translate(" + (L.x * u).toFixed(1) + "px, " + (L.y * u).toFixed(1) + "px) scale(" + (L.k * u).toFixed(4) + ")";

 // ==== kit:tone@1 ====
 function kRGB(el, color) {
  var p = document.createElement("i");
  p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
  el.appendChild(p);
  var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
  el.removeChild(p);
  return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
 }
 function kTone(wrap) {
  var c = kRGB(wrap, "var(--k-bg)");
  var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
  wrap.setAttribute("data-tone", tone);
  return tone;
 }
 // ==== end kit:tone ====
 var dark = kTone(root) === "dark", pool = q(".gwp-pool");

 var grp = q(".gwp-grp"), fog = q(".gwp-fog"), heads = qa(".gwp-head"), vs = q(".gwp-vs"), mk = q(".gwp-mk");
 var dk = q(".gwp-dk"), tail = q(".gwp-tail"), gov = q(".gwp-ghost .gwp-ov");
 var a = function (x) { return "color-mix(in srgb, var(--k-stage) " + (x * 100).toFixed(1) + "%, transparent)"; };
 var lin = function (t, xs, ys) { return MT.interpolate(t, xs, ys, { extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };

 // ==== kit:grain@1 ====
 function kGrain(layer, o) {
   o = o || {};
   var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
   var dark = tones && tones.getAttribute("data-tone") === "dark";
   var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
     var f = "type='linear' slope='2.4' intercept='-0.7'";
     var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
       "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
       "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
       "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
       "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
     return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
   });
   layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
   layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
   layer.style.backgroundSize = size + "px " + size + "px";
   return function (t) {
     var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
     layer.style.backgroundImage = tiles[k % 6];
     layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
   };
 }
 // ==== end kit:grain ====

 // film grain over the gradients (dark-stage strength); none when the card sits on a host picture
 var grain = String(v.backdrop) === "off" ? null : kGrain(q(".gwp-grain"), { opacity: 0.09, blend: "soft-light" });

 var tl = MT.scene(CFG.dur, function (t) {
  if (grain) grain(t);
  var sx = lin(t, CFG.run, [X0, X1]);                       // linear: a searchlight, not a hand
  var env = lin(t, CFG.env, [0, 1, 1, 0]);
  var tb = lin(t, CFG.tail, [0, 0.8, 0.25]);
  var near = MT.clamp((sx - (W - 420)) / 420, 0, 1);
  var dx = L.dr * MT.interpolate(t, [0, CFG.drift], [-150, 150]), dy = L.dr * MT.interpolate(t, [0, CFG.drift], [-36, 36]); // unclamped
  grp.style.transform = "translate(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px) scale(1.05) rotateY(-13deg) rotateX(9deg) rotateZ(" + L.rz + "deg)";
  fog.style.transform = "translateX(" + sx.toFixed(1) + "px)";
  fog.style.opacity = env;
  heads.forEach(function (h) { h.style.transform = fog.style.transform; h.style.opacity = env; });

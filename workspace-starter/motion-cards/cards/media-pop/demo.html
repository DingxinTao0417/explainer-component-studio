<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"src","type":"string","label":"图片地址（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},
    {"id":"label","type":"string","label":"图下标签（可空）","default":"示例图 · 一句说明"},
    {"id":"tilt","type":"number","label":"落定后的倾角（度）","default":-2.5,"min":-8,"max":8,"step":0.5},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>media-pop · 图片弹入</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="media-pop-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .mp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .mp-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .mp-card { position: relative; width: 1120px; padding: 18px 18px 0; border-radius: 18px; background: #fff; box-shadow: 0 50px 110px rgba(0, 0, 0, 0.45), 0 10px 26px rgba(0, 0, 0, 0.3); }
        .mp-img { display: block; width: 1084px; height: 610px; object-fit: cover; border-radius: 8px; }
        .mp-label { display: block; height: 92px; line-height: 88px; font-size: 40px; font-weight: 700; color: #15171c; text-align: center; white-space: nowrap; overflow: hidden; }
        .mp-flash { position: absolute; inset: 0; border-radius: 18px; background: #fff; opacity: 0; }
      </style>

      <div id="root" data-composition-id="media-pop" data-width="1920" data-height="1080">
        <div class="mp">
          <div class="mp-bg"></div>
          <div class="mp-card">
            <img class="mp-img" src="motion-cards/lib/samples/p1.jpg" data-var-src="src" alt="" />
            <span class="mp-label">示例图 · 一句说明</span>
            <div class="mp-flash"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { at: 0.2, from: 0.55, over: 1.06, inDur: 0.22, settle: 0.3, drop: 70, flash: 0.55 };
          var v = { label: "示例图 · 一句说明", tilt: -2.5, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".mp");
          var q = function (s) { return root.querySelector(s); };
          if (v.src) q(".mp-img").setAttribute("src", String(v.src));
          var lab = q(".mp-label");
          lab.textContent = String(v.label || "");
          if (!v.label) { lab.style.display = "none"; q(".mp-card").style.paddingBottom = "18px"; }
          if (String(v.backdrop) === "off") q(".mp-bg").style.display = "none";
          var tilt = parseFloat(v.tilt) || 0;
          var card = q(".mp-card");

          var tl = gsap.timeline({ paused: true });
          // lands from slightly above and tilted the other way, overshoots, then sits
          tl.fromTo(card, { opacity: 0, scale: CFG.from, y: -CFG.drop, rotation: -tilt * 2.4 }, { opacity: 1, scale: CFG.over, y: 0, rotation: tilt * 1.3, duration: CFG.inDur, ease: "power3.out" }, CFG.at);
          tl.to(card, { scale: 1, rotation: tilt, duration: CFG.settle, ease: "back.out(2)" }, CFG.at + CFG.inDur);
          // a short white flash on landing sells the "print hitting the table"
          tl.fromTo(q(".mp-flash"), { opacity: CFG.flash }, { opacity: 0, duration: 0.3, ease: "power2.out" }, CFG.at + CFG.inDur - 0.04);
          window.__timelines["media-pop"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

// seconds (frames / 30), both orientations; leg k: cursor at leg0 + k*leg for fly, camera lag later for cam, click at +aim
var CFG = { dur: 8.4, intro: 0.467, push: 0.733, leg0: 0.733, leg: 1.467, fly: 0.533, lag: 0.067, cam: 0.667, aim: 0.733, back: 6.6, backDur: 0.8, creep: 7.4, creepDur: 0.6, hop: 0.08, blur: 0.09, blurMax: 8 };
// world px: overview centre o, zooms so / sc, anchor line ay (of frame height), cursor start c0
var LAND = { o: [1200, 780], so: 0.66, sc: 1.3, ay: 0.5, c0: [1240, 830] };
var PORT = { o: [740, 930], so: 0.548, sc: 1.25, ay: 0.4, c0: [780, 1010] };
// bar heights before / after the range switch
var BA = [0.42, 0.5, 0.46, 0.58, 0.52, 0.6, 0.55, 0.64, 0.6, 0.7, 0.66, 0.74], BB = [0.3, 0.38, 0.45, 0.42, 0.55, 0.62, 0.58, 0.7, 0.76, 0.82, 0.88, 0.96];
var v = { titles: "本月处理量|每周访问|新功能开关|常用模板", name: "示例应用", backdrop: "on" };
try {
var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
} catch (e) {}
var root = document.querySelector(".cf");
var q = function (s) { return root.querySelector(s); }, qa = function (s) { return [].slice.call(root.querySelectorAll(s)); };
var FW = root.clientWidth, FH = root.clientHeight;
if (!FW || !FH) {
// not laid out yet: the host clip's declared size, then the window
var hc = root.closest("[data-width][data-height]");
FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
}
var P = FH > FW, L = P ? PORT : LAND;
root.setAttribute("data-orient", P ? "portrait" : "landscape");
if (String(v.backdrop) === "off") q(".cf-st").style.display = "none";

// ==== kit:tone@1 ====
function kRGB(el, color) {
var p = document.createElement("i");
p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
el.appendChild(p);
var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
el.removeChild(p);
return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
}
function kTone(wrap) {
var c = kRGB(wrap, "var(--k-bg)");
var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
wrap.setAttribute("data-tone", tone);
return tone;
}
// ==== end kit:tone ====

// ==== kit:speedblur@1 ====
function kSpeedBlur(box, prefix, o) {
o = o || {};
var amount = o.amount || 0.45, max = o.max || 36;
var id = prefix + "-sb" + (window.__kxN = (window.__kxN || 0) + 1);
var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
svg.innerHTML = '<filter id="' + id + '" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>';
var outer = document.createElement("div"), inner = document.createElement("div");
outer.style.cssText = inner.style.cssText = "position:absolute;inset:0";
while (box.firstChild) inner.appendChild(box.firstChild);
outer.appendChild(inner); box.appendChild(svg); box.appendChild(outer);
var fe = svg.firstChild.firstChild;
return function (vx, vy) {
vy = vy || 0;
var sd = Math.min(max, (Math.sqrt(vx * vx + vy * vy) / 30) * amount);
if (sd < 0.35) { outer.style.filter = outer.style.transform = inner.style.transform = ""; return; }
var deg = (Math.atan2(vy, vx) * 180) / Math.PI;
fe.setAttribute("stdDeviation", sd.toFixed(2) + " 0");
outer.style.transform = "rotate(" + deg.toFixed(2) + "deg)";
inner.style.transform = "rotate(" + (-deg).toFixed(2) + "deg)";
outer.style.filter = "url(#" + id + ")";
};
}
// ==== end kit:speedblur ====

// ==== kit:grain@1 ====
function kGrain(layer, o) {
o = o || {};
var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
var dark = tones && tones.getAttribute("data-tone") === "dark";
var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
var f = "type='linear' slope='2.4' intercept='-0.7'";
var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
"<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
"<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
"<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
"<rect width='100%' height='100%' filter='url(#g)'/></svg>";
return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
});
layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
layer.style.backgroundSize = size + "px " + size + "px";
return function (t) {
var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
layer.style.backgroundImage = tiles[k % 6];
layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
};
}
// ==== end kit:grain ====

// ==== kit:fit@1 ====
function kFit(el, o) {
o = o || {};
var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
for (;;) {
el.style.fontSize = f + "px";
m = kLines(el);
if ((m.w <= W && m.n <= n) || f <= min) break;
f = Math.max(min, f - 2);
}
if (m.w > W) {
[].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
m = kLines(el);
}
return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
}
function kLines(el) {
var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
while ((t = it.nextNode())) {
if (!t.data.trim()) continue;
r.selectNodeContents(t);
[].forEach.call(r.getClientRects(), function (b) {
var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
});
}
return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
}
// ==== end kit:fit ====

kTone(root);
var grain = kGrain(q(".cf-grain"));
// titles: "|" lists one label per module (inner spaces kept, empty keeps the default); one line >= 32px, else
// it wraps and hides the subtitle under it
var tt = String(v.titles).split("|");
qa(".cf-t").forEach(function (el, i) { var s = (tt[i] || "").trim(); if (s) el.textContent = s; if (!kFit(el, { min: 32 }).fits) el.nextElementSibling.style.opacity = 0; });
var nm = q(".cf-name");
nm.textContent = String(v.name).trim() || nm.textContent;
kFit(nm, { min: 32, width: 520 });

var cam = q(".cf-cam"), cur = q(".cf-cur"), rip = q(".cf-rip"), mods = qa(".cf-m");
var seg = qa(".cf-seg span"), thumb = q(".cf-seg b"), meta = q(".cf-m1 .cf-s"), nums = qa(".cf-nb span"), up = q(".cf-up"), bars = qa(".cf-bars i");
var gr = q(".cf-gr"), tip = q(".cf-tip"), gd = q(".cf-gd"), pt = q(".cf-pt");
var tg = q(".cf-tg"), tgOn = q(".cf-tg i"), knob = q(".cf-tg u"), pg = q(".cf-pg"), fill = q(".cf-pg i i"), pgl = q(".cf-pg span");
var tb = q(".cf-tb"), row = qa(".cf-tr")[1], rbar = row.querySelector("s"), ck = q(".cf-ck");
var sb = kSpeedBlur(q(".cf-sb"), "cf", { amount: CFG.blur, max: CFG.blurMax });
cur.style.left = cur.style.top = "0px";
var CE = MT.bezier(0.55, 0, 0.18, 1), AX = FW / 2, AY = FH * L.ay, G = null;
var legAt = function (k) { return CFG.leg0 + k * CFG.leg; }, clickAt = function (k) { return legAt(k) + CFG.aim; };
// world position of an element's centre
function at(el) {
var x = el.offsetWidth / 2, y = el.offsetHeight / 2;
for (; el && el !== cam; el = el.offsetParent) { x += el.offsetLeft; y += el.offsetTop; }
return [x, y];
}
// stops = module centres; targets = "90" segment, data point 9 (81.8% / 24% of the chart), toggle, row 2 checkbox
function geo() {
var g = at(gr);
return { m: mods.map(at), t: [at(seg[2]), [g[0] + 0.31818 * gr.offsetWidth, g[1] - 0.26 * gr.offsetHeight], at(tg), at(row.querySelector(".cf-cb"))] };
}
// camera: push 0.94 -> 1, four legs (legs 2-4 pull out 8% mid-flight), pull back, 1% creep
function camAt(t) {
var x = L.o[0], y = L.o[1], s = L.so * MT.mix(0.94, 1, MT.ramp(t, 0, CFG.push, "snappy")), hop = 0;
for (var k = 0; k < 4; k++) {
var u = MT.ramp(t, legAt(k) + CFG.lag, CFG.cam, CE), m = G.m[k];
x = MT.mix(x, m[0], u); y = MT.mix(y, m[1], u); s = MT.mix(s, L.sc, u);
if (k && u > 0 && u < 1) hop = CFG.hop * Math.sin(Math.PI * u);
}
var b = MT.ramp(t, CFG.back, CFG.backDur, "smooth");
x = MT.mix(x, L.o[0], b); y = MT.mix(y, L.o[1], b); s = MT.mix(s, L.so, b);
return { x: x, y: y, s: s * (1 - hop) * (1 + 0.01 * MT.ramp(t, CFG.creep, CFG.creepDur, "smooth")) };
}
// cursor: each leg a swift move on an arc bowed sideways up to 90px (12% of the distance)
function curAt(t) {
var x = L.c0[0], y = L.c0[1];
for (var k = 0; k < 4; k++) {
var u = MT.ramp(t, legAt(k), CFG.fly, "swift"), p = G.t[k], dx = p[0] - x, dy = p[1] - y;
var len = Math.max(1, Math.hypot(dx, dy)), bow = Math.sin(Math.PI * u) * Math.min(90, len * 0.12);
var nx = MT.mix(x, p[0], u) - (dy / len) * bow;
y = MT.mix(y, p[1], u) + (dx / len) * bow; x = nx;
}
return [x, y];
}
var ox = function (u) { var c = camAt(u); return -c.x * c.s; }, oy = function (u) { var c = camAt(u); return -c.y * c.s; };
var fx = function (n) { return n.toFixed(2); }, tr = function (x, y) { return "translate(" + fx(x) + "px," + fx(y) + "px) scale("; };
var ac = function (p) { return "color-mix(in srgb, var(--cf-tint) " + p + "%, transparent)"; };

function render(t) {
G = G || geo();
var c = camAt(t), s = c.s, io = MT.ramp(t, 0, CFG.intro, "out"), k;
cam.style.transform = tr(-c.x * s, -c.y * s) + s.toFixed(5) + ")";
cam.style.opacity = io;
sb(MT.velocity(ox, t), MT.velocity(oy, t));
var p = curAt(t), X = AX + (p[0] - c.x) * s, Y = AY + (p[1] - c.y) * s, pr = 0, rp = -1;
// frames at 30 fps: press down 3, up 6 (overshoot); ring 18
for (k = 0; k < 4; k++) {
var f = (t - clickAt(k)) * 30;
if (f > -2 && f < 8) pr = Math.max(pr, f < 1 ? MT.ramp(f, -2, 3, "swift") : 1 - MT.ramp(f, 1, 6, "overshoot"));
if (f >= 0 && f < 18) rp = f / 18;
}
cur.style.transform = tr(X, Y) + (1 - 0.16 * pr).toFixed(3) + ")";
cur.style.opacity = io;
rip.style.opacity = rp < 0 ? 0 : (1 - rp) * 0.9;
rip.style.transform = tr(X, Y) + (0.3 + MT.EASE.out(Math.max(0, rp)) * 1.2).toFixed(3) + ")";

var resp = function (k, d, e) { return MT.ramp(t, clickAt(k) + 2 / 30, (d || 16) / 30, e || "snappy"); };
var a = [resp(0), resp(1), resp(2), resp(3, 14)];
mods.forEach(function (m, k) { m.style.setProperty("--ca", a[k].toFixed(3)); });
// 1: range 30 -> 90: thumb, figure swap, bars spring one by one
var sel = MT.ramp(t, clickAt(0), 8 / 30, "snappy"), r0 = a[0];
thumb.style.left = fx(5 + MT.mix(118, 236, sel)) + "px";
seg[1].classList.toggle("on", sel < 0.5); seg[2].classList.toggle("on", sel >= 0.5);
meta.textContent = sel > 0.5 ? "近 90 天" : "近 30 天";
nums[0].style.transform = "translateY(" + fx(-r0 * 150) + "px)"; nums[0].style.opacity = 1 - r0;
nums[1].style.transform = "translateY(" + fx((1 - r0) * 150) + "px)"; nums[1].style.opacity = r0;
up.textContent = r0 > 0.5 ? "▲ 25%" : "▲ 18%";
bars.forEach(function (b, i) {
b.style.height = fx(MT.mix(BA[i], BB[i], MT.spring({ t: t, delay: clickAt(0) + (2 + i * 1.4) / 30, damping: 15, stiffness: 190 })) * 100) + "%";
if (i < 11) b.style.background = ac((14 + (10 * r0 * i) / 11).toFixed(1));
});
// 2: guide drops, point swells, tooltip springs (shown from 75% opacity)
var sp = MT.spring({ t: t, delay: clickAt(1) + 2 / 30, damping: 14, stiffness: 210 }), o = Math.min(1, sp * 2), d = 2 * (9 + 7 * sp) + 5;
tip.style.opacity = o < 0.75 ? 0 : o;
tip.style.transform = "translateY(" + fx((1 - sp) * 16) + "px) scale(" + (0.86 + 0.14 * sp).toFixed(3) + ")";
gd.style.clipPath = "inset(0 0 " + fx((1 - resp(1, 12)) * 100) + "% 0)";
pt.style.width = pt.style.height = fx(d) + "px";
// 3: toggle springs on, bar 0 -> 25%
var on = MT.spring({ t: t, delay: clickAt(2) + 1 / 30, damping: 16, stiffness: 240 }), roll = resp(2, 26, "out");
tg.classList.toggle("on", on > 0.5);
tgOn.style.opacity = MT.clamp(on);
knob.style.left = fx(5 + 38 * on) + "px";
pg.style.opacity = Math.min(1, roll * 3);
fill.style.width = fx(roll * 25) + "%";
pgl.textContent = "正在开启 · " + Math.round(roll * 25) + "%";
// 4: row 2 picked: tint, bar, box, tick
var r3 = a[3];
tb.classList.toggle("s", r3 >= 0.01);
row.classList.toggle("on", r3 > 0.3);
row.style.background = ac((8 * r3).toFixed(2));
rbar.style.transform = "scaleY(" + r3.toFixed(3) + ")";
ck.style.strokeDashoffset = fx(26 * (1 - resp(3, 12, "out")));
grain(t);
}

var tl = MT.scene(CFG.dur, render);
window.__timelines["cursor-flyover"] = tl;
})();
</script>
</template>
</body>

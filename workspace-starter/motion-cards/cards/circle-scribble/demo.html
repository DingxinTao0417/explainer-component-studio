<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300,"min":0,"max":1920,"step":1},
    {"id":"y","type":"number","label":"目标左上角 y","default":576,"min":0,"max":1080,"step":1},
    {"id":"w","type":"number","label":"目标宽","default":416,"min":20,"max":1800,"step":1},
    {"id":"h","type":"number","label":"目标高","default":150,"min":20,"max":1000,"step":1},
    {"id":"pad","type":"number","label":"圈离目标的余量（像素）","default":20,"min":0,"max":80,"step":1},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"垫示例截图（放大 2 倍）"},{"value":"off","label":"透明，只留圈"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>circle-scribble · 手绘圈</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="circle-scribble-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .cs { position: absolute; inset: 0; }
        .cs-shot { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; background-repeat: no-repeat; background-size: 3840px 2160px; background-position: -680px -220px; }
        .cs-svg { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; }
        .cs-ink { fill: var(--k-accent); stroke: rgba(13, 16, 22, 0.78); stroke-width: 6; stroke-linejoin: round; paint-order: stroke; }
        .cs-rev { fill: none; stroke: #fff; stroke-linecap: butt; }
      </style>

      <div id="root" data-composition-id="circle-scribble" data-width="1920" data-height="1080">
        <div class="cs">
          <div class="cs-shot" style="background-image: url(motion-cards/lib/samples/ui.png)"></div>
          <svg class="cs-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <mask id="cs-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><path class="cs-rev" d="" /></mask>
            </defs>
            <path class="cs-ink" d="" mask="url(#cs-mask)" />
          </svg>
        </div>
      </div>

      <script>
        (function () {
          // at: pen touches down · draw: one stroke, fast then slowing · lap: how far past the start the pen keeps going (radians)
          // gap: px between the start of the stroke and the end that passes it · wob: lumpiness · thin/thick/tail: stroke width at landing / mid-stroke / lift-off
          var CFG = { at: 0.2, draw: 0.52, lap: 0.42, gap: 40, wob: 7, tilt: -0.07, start: -2.45, thin: 7, thick: 18, tail: 4 };
          var v = { x: 300, y: 576, w: 416, h: 150, pad: 20, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".cs");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") q(".cs-shot").style.display = "none";
          var num = function (a, d) { a = parseFloat(a); return isFinite(a) ? a : d; };
          var W = num(v.w, 416), H = num(v.h, 150), pad = num(v.pad, 20);
          var cx = num(v.x, 300) + W / 2, cy = num(v.y, 576) + H / 2;
          // an ellipse through the box corners needs sqrt(2) x the half sizes; pad comes on top
          var rx = (W / 2) * 1.414 + pad + CFG.gap / 2, ry = (H / 2) * 1.414 + pad + CFG.gap / 2;

          // centre line: a lumpy, slightly tilted ellipse that spirals inwards by `gap`, so the end passes inside the start
          var sweep = Math.PI * 2 + CFG.lap, n = 96, pts = [], ct = Math.cos(CFG.tilt), st = Math.sin(CFG.tilt);
          for (var i = 0; i <= n; i++) {
            var u = i / n, th = CFG.start + sweep * u;
            var off = -CFG.gap * u + CFG.wob * Math.sin(th * 3 + 1.1) + CFG.wob * 0.5 * Math.sin(th * 5 + 0.4);
            var px = (rx + off) * Math.cos(th), py = (ry + off) * Math.sin(th);
            pts.push([cx + px * ct - py * st, cy + px * st + py * ct]);
          }
          var d = "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L");
          var rev = q(".cs-rev");
          rev.setAttribute("d", d);
          var len = rev.getTotalLength();

          // the visible stroke is a filled ribbon: thin where the pen lands, thick mid-stroke, thinnest where it lifts
          var m = Math.max(40, Math.round(len / 9)), a = [], b = [];
          for (var j = 0; j <= m; j++) {
            var t = j / m, p = rev.getPointAtLength(len * t);
            var p0 = rev.getPointAtLength(Math.max(0, len * t - 1)), p1 = rev.getPointAtLength(Math.min(len, len * t + 1));
            var dx = p1.x - p0.x, dy = p1.y - p0.y, dl = Math.sqrt(dx * dx + dy * dy) || 1;
            var end = t < 0.5 ? CFG.thin : CFG.tail;
            var half = (end + (CFG.thick - end) * Math.pow(Math.sin(Math.PI * t), 0.6)) / 2;
            a.push((p.x - (dy / dl) * half).toFixed(1) + " " + (p.y + (dx / dl) * half).toFixed(1));
            b.unshift((p.x + (dy / dl) * half).toFixed(1) + " " + (p.y - (dx / dl) * half).toFixed(1));
          }
          q(".cs-ink").setAttribute("d", "M" + a.concat(b).join("L") + "Z");
          rev.style.strokeWidth = CFG.thick + 12 + "px";
          rev.style.strokeDasharray = len + 2 + "px " + (len + 40) + "px"; // the gap is longer than the path, and the start offset sits inside it: no hairline at the pen-down point

          var tl = gsap.timeline({ paused: true });
          // one stroke: the mask uncovers the ribbon along its own centre line
          tl.fromTo(rev, { strokeDashoffset: len + 8 }, { strokeDashoffset: 0, duration: CFG.draw, ease: "power2.out" }, CFG.at);
          window.__timelines["circle-scribble"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

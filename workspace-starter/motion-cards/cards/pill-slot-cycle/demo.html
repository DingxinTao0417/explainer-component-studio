            // two rows: each text slot fits on its own, the stem and the end share the smaller size
            [stem, end].forEach(function (el) { el.style.whiteSpace = "normal"; el.style.width = AV + "px"; });
            S = Math.min(kFit(stem, { max: S, min: 72, lines: 2, width: AV }).size, kFit(end, { max: S, min: 72, lines: 2, width: AV }).size);
            PF = Math.max(40, Math.min(PF, Math.floor((PF * AV * 0.96) / pw())));
            setF();
            [stem, end].forEach(function (el) { el.style.width = Math.ceil(kLines(el).w) + 2 + "px"; });
            // a pill still wider than the band at 40px wraps inside itself
            pills.forEach(function (p) { if (p.offsetWidth > AV) { p.style.whiteSpace = "normal"; p.lastChild.style.width = AV * 0.96 - (p.offsetWidth - p.lastChild.offsetWidth) + "px"; } });
          }
          var sw = stem.offsetWidth, ew = end.offsetWidth, sh = stem.offsetHeight, eh = end.offsetHeight;
          var pws = pills.map(function (p) { return p.offsetWidth; }), phs = pills.map(function (p) { return p.offsetHeight; });
          var maxPw = Math.max.apply(null, pws), slotH = Math.max(eh, Math.max.apply(null, phs));
          var kb = PF / 64, ks = S / 96;

          // ---- positions (px): the stem is pinned at x0 for the whole cycle; only the close moves it. The slot box
          // starts where the end words go; the pills sit the stem gap (0.375em) after the stem ----
          var x0, sTop, slTop, slX, pX, dS, dE, side = FW * L.side;
          if (!stack) {
            var gap = 0.375 * S, wg = joinSp ? 0.1875 * S : 0, lineW = sw + gap + maxPw;
            x0 = Math.max(side, Math.min(FW * L.x0, FW - side - lineW));
            sTop = FH * L.cy - sh / 2; slTop = FH * L.cy - slotH / 2; slX = x0 + sw + wg; pX = gap - wg;
            dS = dE = (FW - (sw + wg + ew)) / 2 - x0;
          } else {
            var gapV = 0.3 * S, top = FH * L.cy - (sh + gapV + slotH) / 2;
            x0 = (FW - Math.max(sw, maxPw)) / 2;
            sTop = top; slTop = top + sh + gapV; slX = x0; pX = 0;
            dS = (FW - sw) / 2 - x0; dE = (FW - ew) / 2 - x0;
          }
          stem.style.left = x0 + "px"; stem.style.top = sTop + "px";
          slot.style.left = slX + "px"; slot.style.top = slTop + "px";
          slot.style.width = Math.max(pX + maxPw, ew) + "px"; slot.style.height = slotH + "px";
          slot.style.perspective = 1400 * kb + "px";
          end.style.top = (slotH - eh) / 2 + "px";
          pills.forEach(function (p, i) { p.style.left = pX + "px"; p.style.top = (slotH - phs[i]) / 2 + "px"; });

          // vertical-only blur filters, ids carry a per-mount number (two mounts share the document)
          var ID = "psc-b" + (window.__pscN = (window.__pscN || 0) + 1) + "-", fe = [];
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
          svg.innerHTML = [0, 1, 2, 3].map(function (i) { return '<filter id="' + ID + i + '" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="0 0"/></filter>'; }).join("");
          root.appendChild(svg);
          [0, 1, 2, 3].forEach(function (i) { fe[i] = svg.childNodes[i].firstChild; });
          var blur = function (el, i, sd) {
            if (sd > 0.3) { fe[i].setAttribute("stdDeviation", "0 " + sd.toFixed(2)); el.style.filter = "url(#" + ID + i + ")"; }
            else el.style.filter = "";
          };

          // ---- motion (upstream curves; distances per font px: in +120 / out -130 per 64px pill, end +90 per 96px stem) ----
          var IN = 1.875 * PF, OUT = -2.031 * PF, FIN = 0.9375 * S, H = 0.5 / 30;
          var cEnd = CFG.intro + N * CFG.beat, SS = dark ? 2.6 : 1;
          var inY = function (tb) { return MT.mix(IN, 0, MT.ramp(tb, 0, CFG.swap, "snappy")); };
          var outY = function (tb) { return MT.mix(0, OUT, MT.ramp(tb, 0, CFG.out, "exit")); };
          var finY = function (t) { return (1 - MT.ramp(t, cEnd, CFG.fin, "back.out(1.4)")) * FIN; };
          // one pill's pose: y, rotateX around its top (in) or bottom (out) edge, scale, opacity, lift 0..1 for the shadow
          var pose = function (p, y, rx, sc, op, lift, bi, sd, org) {
            p.style.transformOrigin = org;
            p.style.transform = "translateY(" + y.toFixed(2) + "px) rotateX(" + rx.toFixed(2) + "deg) scale(" + sc.toFixed(4) + ")";
            p.style.opacity = op;
            p.style.boxShadow = "inset 0 1px 0 var(--psc-hi), " + kShadow((6 + lift * 30) * kb, SS);
            blur(p, bi, sd);
          };

          var tl = MT.scene(cEnd + CFG.cAt + CFG.center + CFG.hold, function (t) {
            grain(t);
            // intro: the sentence rises 0.52em and focuses in; the close centres it (per row when stacked)
            var st = MT.ramp(t, 0, CFG.intro, "out"), rise = ((1 - st) * 0.52 * S).toFixed(2);
            var ct = MT.ramp(t, cEnd + CFG.cAt, CFG.center, "smooth"), f = st < 0.98 ? "blur(" + ((1 - st) * 6 * ks).toFixed(2) + "px)" : "";
            stem.style.transform = "translate(" + (ct * dS).toFixed(2) + "px, " + rise + "px)";
            slot.style.transform = "translate(" + (ct * dE).toFixed(2) + "px, " + rise + "px)";
            stem.style.opacity = slot.style.opacity = st;
            stem.style.filter = slot.style.filter = f;
            pills.forEach(function (p) { p.style.opacity = 0; });
            end.style.opacity = 0;
            var rel = t - CFG.intro;
            if (t < cEnd) {
              if (rel < 0) return;
              // beat i: pill i lands from below while pill i-1 leaves upward, both inside the first 8f of the beat
              var i = Math.min(Math.floor(rel / CFG.beat), N - 1), tb = rel - i * CFG.beat, a = MT.ramp(tb, 0, CFG.swap, "snappy");
              pose(pills[i], inY(tb), -38 * (1 - a), MT.mix(0.94, 1, a), i ? Math.min(1, a * 1.6) : a, 1 - a, 0, Math.min(14 * kb, Math.abs(inY(tb + H) - inY(tb - H)) * 0.55), "50% 0%");
              var o = MT.ramp(tb, 0, CFG.out, "exit");
              if (i && o < 1) pose(pills[i - 1], outY(tb), 34 * o, MT.mix(1, 0.94, o), 1 - o, o, 1, Math.min(12 * kb, Math.abs(outY(tb + H) - outY(tb - H)) * 0.45), "50% 100%");
              return;
            }
            // close: the last pill flies off (7f) while the end words land with the only overshoot of the card
            var lo = MT.ramp(t, cEnd, CFG.out, "exit");
            if (lo < 1) pose(pills[N - 1], OUT * lo, 34 * lo, MT.mix(1, 0.94, lo), 1 - lo, lo, 3, lo * 12 * kb, "50% 100%");
            var fT = MT.ramp(t, cEnd, CFG.fin, "back.out(1.4)");
            end.style.opacity = Math.min(1, fT * 1.4);
            end.style.transform = "translateY(" + finY(t).toFixed(2) + "px)";
            blur(end, 2, Math.min(10 * ks, Math.abs(finY(t + H) - finY(t - H)) * 0.5));
          });
          window.__timelines["pill-slot-cycle"] = tl;
        })();
      </script>
    </template>
  </body>

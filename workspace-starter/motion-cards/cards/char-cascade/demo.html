<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"text","type":"string","label":"一行大字（建议 4–9 个字）","default":"先跑通，再优化"},
    {"id":"key","type":"string","label":"上强调色的词（可空）","default":"跑通"},
    {"id":"step","type":"number","label":"相邻两个字的间隔（秒）","default":0.055,"min":0.02,"max":0.2,"step":0.005},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>char-cascade · 逐字落位</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="char-cascade-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .cc { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .cc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .cc-line { position: relative; display: flex; justify-content: center; font-size: 168px; font-weight: 900; line-height: 1.3; }
        .cc-ch { display: block; white-space: pre; }
        .cc-hot { color: var(--k-accent); }
      </style>

      <div id="root" data-composition-id="char-cascade" data-width="1920" data-height="1080">
        <div class="cc">
          <div class="cc-bg"></div>
          <div class="cc-line"><span class="cc-ch">先</span><span class="cc-ch cc-hot">跑</span><span class="cc-ch cc-hot">通</span><span class="cc-ch">，</span><span class="cc-ch">再</span><span class="cc-ch">优</span><span class="cc-ch">化</span></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { at: 0.2, step: 0.055, fall: 0.5, drop: 150, swing: 26, fade: 0.1, back: 1.9 };
          var v = { text: "先跑通，再优化", key: "跑通", step: CFG.step, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".cc");
          var line = root.querySelector(".cc-line");
          var text = String(v.text), key = String(v.key || "");
          var hotAt = key ? text.indexOf(key) : -1;
          var chars = text.split("");
          line.textContent = "";
          var els = [];
          for (var i = 0; i < chars.length; i++) {
            var s = document.createElement("span");
            s.className = "cc-ch" + (hotAt >= 0 && i >= hotAt && i < hotAt + key.length ? " cc-hot" : "");
            s.textContent = chars[i];
            line.appendChild(s);
            els.push(s);
          }
          // long lines: shrink so the row still fits 1640px
          if (chars.length > 9) line.style.fontSize = Math.floor(1560 / chars.length) + "px";
          if (String(v.backdrop) === "off") root.querySelector(".cc-bg").style.display = "none";
          var step = parseFloat(v.step) || CFG.step;

          var tl = gsap.timeline({ paused: true });
          for (var j = 0; j < els.length; j++) {
            // a fixed wave instead of randomness: height and spin both ride a sine along the row
            var wave = Math.sin(j * 1.15 + 0.4);
            var from = { opacity: 0, y: -(CFG.drop + 50 * wave), rotation: CFG.swing * Math.sin(j * 2.1 + 1) };
            var t0 = CFG.at + j * step;
            tl.set(els[j], { transformOrigin: "50% 80%" }, 0);
            tl.fromTo(els[j], { y: from.y, rotation: from.rotation }, { y: 0, rotation: 0, duration: CFG.fall, ease: "back.out(" + CFG.back + ")" }, t0);
            tl.fromTo(els[j], { opacity: 0 }, { opacity: 1, duration: CFG.fade, ease: "none" }, t0);
          }
          window.__timelines["char-cascade"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

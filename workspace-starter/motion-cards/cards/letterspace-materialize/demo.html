          // water glints: 22 short lines, positions from upstream's sin hash (a light skin shows them stronger: no screen blend on white)
          var glints = [], gain = dark ? 1 : 2.4;
          for (var i = 0; i < 22; i++) {
            var s = Math.sin(i * 91.7) * 43758.5453, r = s - Math.floor(s), s2 = Math.sin(i * 47.3 + 5) * 24634.6345, r2 = s2 - Math.floor(s2), dp = (i + 0.5) / 22;
            var gw = (40 + r2 * 120 + dp * 160) * L.gw, el = document.createElement("div");
            el.className = "ls-gl";
            el.style.top = (HZ + 8 + dp * dp * 0.926 * (FH - HZ - 8)).toFixed(1) + "px";
            el.style.width = gw.toFixed(1) + "px";
            el.style.left = (FW / 2 + (r - 0.5) * (500 + dp * 1100) * L.gx - gw / 2).toFixed(1) + "px";
            near.appendChild(el);
            glints.push({ el: el, a: 0.05 + (1 - dp) * 0.12, ph: r * 6.28 });
          }
          far.style.transformOrigin = near.style.transformOrigin = "50% " + HZ + "px";
          var grain = kGrain(q(".ls-grain"), { opacity: dark ? 0.08 : 0.05 });
          if (String(v.backdrop) === "off") scene.style.display = "none";

          var strokeEase = MT.bezier(0.5, 0, 0.3, 1);
          var render = function (t) {
            // every letter shares one progress: same start frame, same finish frame
            var e = MT.ramp(t, CFG.start, CFG.dur, strokeEase);
            // brightens over the last 30% of the draw, falls back after the finish
            var rise = MT.ramp(t, CFG.start + CFG.dur * 0.7, CFG.dur * 0.3, "swift");
            var fall = 1 - MT.ramp(t, CFG.start + CFG.dur, CFG.glowFall, "out");
            var g = e >= 1 ? fall : rise;
            var off = (1 - e).toFixed(4), op = e > 0 ? 1 : 0;
            var glow = function (k) {
              return "drop-shadow(0 0 " + ((5 + g * k * 10) * sig).toFixed(2) + "px color-mix(in srgb, var(--ls-glow) " + ((0.3 + g * k * 0.38) * 100).toFixed(1) + "%, transparent))";
            };
            var fm = glow(1), fr = glow(0.5);
            pathsMain.forEach(function (p) { p.style.strokeDashoffset = off; p.style.opacity = op; p.style.filter = fm; });
            pathsRefl.forEach(function (p) { p.style.strokeDashoffset = off; p.style.opacity = op; p.style.filter = fr; });
            // slow push-in: far layer 1 -> 1.02, near layer 1 -> 1.035; the word does not move
            var push = MT.ramp(t, 0, CFG.push, "smooth");
            far.style.transform = "scale(" + (1 + CFG.farPush * push).toFixed(5) + ")";
            near.style.transform = "scale(" + (1 + CFG.nearPush * push).toFixed(5) + ")";
            // the dawn glow lifts while the word finishes
            dawn.style.opacity = (0.85 + 0.15 * MT.ramp(t, CFG.start + CFG.dur * 0.5, CFG.dur, "out")).toFixed(4);
            var f = t * 30; // frames at 30 fps, as upstream's glint drift
            glints.forEach(function (gl) {
              gl.el.style.transform = "translateX(" + (Math.sin(f / 38 + gl.ph) * 14).toFixed(1) + "px)";
              gl.el.style.opacity = Math.min(1, gl.a * gain * (0.75 + 0.25 * Math.sin(f / 23 + gl.ph))).toFixed(3);
            });
            grain(t);
          };
          var tl = MT.scene(CFG.total, render);
          window.__timelines["letterspace-materialize"] = tl;
        })();
      </script>
    </template>

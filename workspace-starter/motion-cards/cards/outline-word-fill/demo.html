          var hud = q(".ow-hud");
          var shockC = mk("circle", { cx: CX, cy: CY, r: R, fill: "none", opacity: 0 });
          var ringG = mk("g", {}), spinG = mk("g", {}, ringG), innerG = mk("g", {}, ringG), lines = [];
          lines.push(mk("circle", { r: R, fill: "none", "stroke-width": 2 * s, "stroke-dasharray": 22 * s + " " + 18 * s }, spinG));
          [0, 90, 180, 270].forEach(function (a) {
            lines.push(mk("line", { x1: 0, y1: -R - 22 * s, x2: 0, y2: -R + 10 * s, "stroke-width": 2.5 * s, "stroke-linecap": "round", transform: "rotate(" + a + ")" }, spinG));
          });
          lines.push(mk("circle", { r: R - 34 * s, fill: "none", "stroke-width": s, opacity: 0.35 }, innerG));
          for (var i = 0; i < 72; i++) {
            var major = i % 6 === 0;
            lines.push(mk("line", { x1: 0, y1: -(R - 34 * s), x2: 0, y2: -(R - (major ? 58 : 44) * s), "stroke-width": (major ? 2 : 1.2) * s, opacity: major ? 0.7 : 0.32, transform: "rotate(" + i * 5 + ")" }, innerG));
          }
          var lineEnd = CX - R - 28 * s;
          var side = [0, 1].map(function (k) {
            var ln = mk("line", { x1: k ? FW : 0, y1: CY, x2: k ? FW : 0, y2: CY, "stroke-width": 2 * s, "stroke-dasharray": 14 * s + " " + 12 * s });
            var dot = mk("circle", { cx: 0, cy: CY, r: 5 * s });
            lines.push(ln); return { ln: ln, dot: dot, k: k };
          });

          // ---- dust: upstream Dust(count 22, seed 3, drift 0.12, opacity 0.4) with its own sin hash ----
          var hsh = function (n) { var x = Math.sin(n * 91.345 + 47.853) * 43758.5453; return x - Math.floor(x); };
          var dustL = q(".ow-dust"), motes = [];
          dustL.style.opacity = 0.4;
          for (var d = 0; d < 22; d++) {
            var z = hsh(3 * 31 + d * 7.1), m = document.createElement("div");
            m.className = "ow-mote";
            m.style.width = m.style.height = px((2 + z * z * 16) * s);
            if (z > 0.7) m.style.filter = "blur(" + ((z - 0.7) * 10).toFixed(1) + "px)";
            dustL.appendChild(m);
            motes.push({ el: m, z: z, x0: hsh(3 * 13 + d * 3.7), y0: hsh(3 * 17 + d * 5.3), i: d });
          }

          var cam = q(".ow-cam");
          cam.style.transformOrigin = px(CX) + " " + px(CY);
          var wsAt = function (t) { return MT.mix(CFG.s0, 1, MT.ramp(t, CFG.shrink, CFG.shrinkDur, "snappy")); };

          var tl = MT.scene(CFG.dur, function (t) {
            var f = t * 30; // frames at 30 fps for the per-frame drift / twinkle constants
            grain(t);
            motes.forEach(function (o) {
              var W2 = FW + 200 * s, H2 = FH + 100 * s, dr = 0.12 * s;
              var x = (((o.x0 * W2 + f * dr * (0.4 + o.z)) % W2) + W2) % W2 - 100 * s;
              var y = o.y0 * FH - f * dr * 0.3 * (0.5 + o.z);
              var tw = 0.5 + 0.5 * Math.sin(f / (14 + o.z * 20) + o.i);
              o.el.style.transform = "translate(" + px(x) + "," + px((((y % H2) + H2) % H2) - 50 * s) + ")";
              o.el.style.opacity = ((0.25 + 0.75 * tw) * (0.3 + o.z * 0.7)).toFixed(3);
            });

            var born = MT.ramp(t, CFG.born, CFG.bornDur, "out");
            var ws = wsAt(t);
            var zb = Math.min(CFG.blurMax, Math.abs(wsAt(t + 1 / 60) - wsAt(t - 1 / 60)) * 9) * k2;
            var cin = MT.ramp(t, CFG.ring, CFG.ringIn, "out");
            var shrink = MT.ramp(t, CFG.ring, CFG.ringDur, "out");
            var ext = MT.ramp(t, CFG.ext, CFG.extDur, "out");
            var warm = MT.ramp(t, CFG.warm, CFG.warmDur, "swift");
            var lit = t >= CFG.pop - 1e-4 ? 1 : 0; // hard cut: no in-between state
            var flash = lit * (1 - MT.ramp(t, CFG.pop, CFG.flash, "out"));
            var lock = lit * (0.55 + 0.45 * flash);
            var shock = MT.ramp(t, CFG.pop, CFG.shock, "out");
            var rot = CFG.spin * Math.min(t, CFG.pop) + (t > CFG.pop ? CFG.brake * MT.ramp(t, CFG.pop, CFG.shock, "out") : 0);
            var push = 1 + CFG.push * MT.ramp(t, 0, CFG.dur, "swift");

            cam.style.transform = "scale(" + push.toFixed(5) + ")";
            q(".ow-key").style.setProperty("--ki", (0.45 + 0.5 * flash + 0.15 * lit).toFixed(3));

            // drafting colour: grey warming slightly, then locked to the accent at the cut (half strength after the flash)
            var lineC = lit ? mixc(LINE_W, ACC, lock) : mixc(MUTED, LINE_W, warm);
            lines.forEach(function (e) { e.setAttribute("stroke", lineC); });
            ringG.setAttribute("transform", "translate(" + CX + " " + CY + ") scale(" + MT.mix(CFG.r0, 1, shrink).toFixed(5) + ")");
            ringG.setAttribute("opacity", cin.toFixed(3));
            spinG.setAttribute("transform", "rotate(" + rot.toFixed(3) + ")");
            innerG.setAttribute("transform", "rotate(" + (CFG.spinIn * t).toFixed(3) + ")");
            side.forEach(function (o) {
              var x = o.k ? FW - lineEnd * ext : lineEnd * ext;
              o.ln.setAttribute("x2", x.toFixed(2)); o.ln.setAttribute("opacity", ext.toFixed(3));
              o.dot.setAttribute("cx", x.toFixed(2)); o.dot.setAttribute("fill", lineC); o.dot.setAttribute("opacity", ext.toFixed(3));
            });
            var sk = lit && shock < 1;
            shockC.setAttribute("opacity", sk ? 1 : 0);
            shockC.setAttribute("r", (R + shock * CFG.shockGrow * s).toFixed(2));
            shockC.setAttribute("stroke", rgba(ACC, 0.55 * (1 - shock)));
            shockC.setAttribute("stroke-width", ((2 + 10 * (1 - shock)) * s).toFixed(2));

            ros.forEach(function (el, i) {
              el.style.opacity = ext.toFixed(3);
              el.style.transform = "translateX(" + px((1 - ext) * 30 * s * (i ? 1 : -1)) + ")";
            });
            roVal.style.color = lit ? "" : "var(--k-ink)";
            roVal.style.textShadow = lit && flash > 0.02 ? "0 0 " + px(18 * flash * s) + " " + rgba(ACC, 0.8) : "none";

            [kick, sub].forEach(function (el, i) {
              var p = MT.ramp(t, CFG.kick + i * CFG.subLag, CFG.rise, "snappy");
              el.style.opacity = p.toFixed(3);
              el.style.transform = "translate(-50%, " + px((1 - p) * CFG.riseY * s) + ")";
            });

            word.style.opacity = born.toFixed(3);
            word.style.transform = "translate(-50%, -54%) scale(" + ws.toFixed(5) + ")";
            if (lit) {
              word.style.color = "var(--k-ink)";
              word.style.webkitTextStroke = "0px transparent";
              word.style.filter = "none";
              word.style.textShadow = flash > 0.01
                ? "0 0 " + px(14 * flash * k2) + " " + rgba(HOT, 0.7 * flash) + ", 0 0 " + px(60 * flash * k2) + " " + rgba(ACC, 0.65 * flash)
                : "0 0 " + px(40 * k2) + " " + rgba(ACC, dark ? 0.18 : 0.1);
            } else {
              word.style.color = rgba(INK, 0.09); // a 9% fill: reads hollow, and the checker still sees painted text
              word.style.webkitTextStroke = px(2 * s) + " " + mixc(MUTED, HOT, warm);
              word.style.textShadow = "none";
              word.style.filter = zb > 0.05 ? "blur(" + (zb / ws).toFixed(2) + "px)" : warm > 0.01 ? "drop-shadow(0 0 " + px(10 * warm * k2) + " " + rgba(ACC, 0.5 * warm) + ")" : "none";
            }
          });
          window.__timelines["outline-word-fill"] = tl;
        })();
      </script>
    </template>

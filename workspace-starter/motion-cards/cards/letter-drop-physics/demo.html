          });
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", "0"); svg.setAttribute("height", "0"); svg.style.position = "absolute";
          svg.innerHTML = defs.join("");
          root.appendChild(svg);
          chars.forEach(function (c) { c.fe = svg.querySelector("#" + c.id + " feGaussianBlur"); });

          // vertical offset from the floor (negative = above) d frames into a character's drop
          var B1 = CFG.fall + CFG.b1, B2 = B1 + CFG.b2;
          var dropY = function (d, D) {
            if (d <= 0) return -D;
            if (d < CFG.fall) return -D + D * Math.pow(d / CFG.fall, 2);
            if (d < B1) { var a = (d - CFG.fall) / CFG.b1; return -CFG.h1 * fs * 4 * a * (1 - a); }
            if (d < B2) { var b = (d - B1) / CFG.b2; return -CFG.h2 * fs * 4 * b * (1 - b); }
            return 0;
          };
          // squash at the three touchdowns: damped wobble, strength 1 / 0.45 / 0.18 (frames)
          var hits = [[CFG.fall, 1], [B1, 0.45], [B2, 0.18]];
          var squash = function (d) {
            var s = 0;
            hits.forEach(function (p) { var e = d - p[0]; if (e >= 0 && e <= 16) s += p[1] * Math.exp(-e / 2.6) * Math.cos(e * 0.85); });
            return s;
          };
          var shK = dark ? 0.52 : 0.2, F = function (f) { return f / 30; };

          var tl = MT.scene(CFG.dur, function (t) {
            var f = t * 30; // frames at 30 fps
            var inhale = MT.ramp(t, F(CFG.snap - CFG.inhale), F(CFG.inhale), "out");
            var snap = MT.ramp(t, F(CFG.snap), F(CFG.snapDur), "snappy");
            var snapRot = MT.ramp(t, F(CFG.snap), F(CFG.rotOver), "overshoot");
            var pulse = CFG.pulse * inhale * (1 - snap);
            chars.forEach(function (c) {
              var d = f - c.st, y = dropY(d, c.D), vy = dropY(d + 0.5, c.D) - dropY(d - 0.5, c.D), air = -y;
              var rot = c.tilt * MT.ramp(t, F(c.st + CFG.fall), F(CFG.settle), "out") * (1 - snapRot);
              // standing tilted on one bottom corner: lifted by sin|rot| x half the glyph width so it never sinks in
              var jit = -Math.sin((Math.abs(rot) * Math.PI) / 180) * c.hw;
              var st = Math.min(1, Math.abs(vy) / ((2 * c.D) / CFG.fall)) * CFG.stretch * (d < CFG.fall ? 1 : 0.6);
              var sq = squash(d), sy = (1 + st) * (1 - 0.2 * sq) + pulse, sx = (1 - st * 0.55) * (1 + 0.15 * sq) + pulse;
              c.g.style.opacity = d < 0 ? 0 : 1;
              c.g.style.transform = d < 0 ? "" : "translateY(" + (y + jit).toFixed(2) + "px) rotate(" + rot.toFixed(3) + "deg) scale(" + sx.toFixed(4) + "," + sy.toFixed(4) + ")";
              // vertical speed blur: full while falling, reduced while bouncing (no smear at the touchdowns)
              var sd = Math.min(16 * u, Math.abs(vy) * (d < CFG.fall ? 0.26 : 0.12));
              if (sd < 0.35 || d < 0) c.g.style.filter = "";
              else { c.fe.setAttribute("stdDeviation", "0 " + sd.toFixed(2)); c.g.style.filter = "url(#" + c.id + ")"; }
              // contact shadow: small and firm on the floor, wide, soft and faint the higher the glyph is
              var lift = MT.clamp(air / (2.386 * fs), 0, 1);
              c.sh.style.opacity = d < 0 ? 0 : (shK * (1 - lift * 0.85) * MT.clamp((d + 2) / 8, 0, 1)).toFixed(3);
              c.sh.style.transform = "scaleX(" + (MT.mix(0.74, 1.3, lift) * (1 + 0.12 * Math.max(0, sq))).toFixed(3) + ")";
              c.sh.style.filter = "blur(" + (MT.mix(7, 28, lift) * u).toFixed(1) + "px)";
            });
            var p = MT.ramp(t, F(CFG.sub), F(CFG.subDur), "out");
            sub.style.opacity = p.toFixed(3);
            sub.style.transform = "translateY(" + ((1 - p) * 0.25 * L.sub).toFixed(2) + "px)";
            if (grain) grain(t);
          });
          window.__timelines["letter-drop-physics"] = tl;
        })();
      </script>
    </template>
  </body>

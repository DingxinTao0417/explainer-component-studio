<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"prompt","type":"string","label":"提问","default":"怎么写出更好的提示词？"},
    {"id":"answer","type":"string","label":"回答（| 换行；- 开头是列表行；**词** 加粗）","default":"可以从三处入手：|- **说清目标**和读者|- **给一个例子**做参照|- **限定格式**和字数|这样回答会稳定很多。"},
    {"id":"cps","type":"number","label":"每秒出几个字","default":14,"min":4,"max":40,"step":1},
    {"id":"think","type":"number","label":"思考几秒（0 = 不显示思考中）","default":0.6,"min":0,"max":4,"step":0.1},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（只留对话面板）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>ai-stream-answer · AI流式回答</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="ai-stream-answer-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        /* the wrapper is the size container; everything that changes with orientation lives inside it */
        .asr { position: absolute; inset: 0; container-type: size; }
        .asr-bg { position: absolute; inset: 0; background: var(--k-bg); }
        /* landscape: a 1360 x 896 chat panel in the middle of the frame */
        .asr-panel { position: absolute; left: 280px; right: 280px; top: 92px; bottom: 92px; display: flex; flex-direction: column; padding: 56px 64px 48px; border-radius: 44px; background: var(--k-bg); border: 3px solid color-mix(in srgb, var(--k-ink) 10%, transparent); box-shadow: 0 28px 72px color-mix(in srgb, var(--k-ink) 9%, transparent); }
        .asr-q { display: flex; flex: none; justify-content: flex-end; }
        .asr-bub { display: block; max-width: 75%; padding: 24px 40px; border-radius: 40px 40px 12px 40px; background: var(--k-panel); font-size: 54px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; transform-origin: 100% 100%; }
        /* the answer scrolls inside this window; the question above it stays put. The gap above it (margin-top) is taller
           than one character box (79px at 60px), so a row that scrolls out is fully clipped before the script hides it */
        .asr-view { position: relative; flex: 1 1 auto; min-height: 0; margin-top: 84px; overflow: hidden; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
        .asr-flow { position: relative; }
        .asr-who { position: absolute; left: 0; top: 9px; width: 72px; height: 72px; border-radius: 50%; background: var(--k-accent); color: var(--k-on-accent); display: flex; align-items: center; justify-content: center; }
        .asr-spark { display: block; width: 42px; height: 42px; fill: currentColor; }
        .asr-think { position: absolute; left: 100px; top: 0; font-size: 50px; line-height: 90px; color: var(--k-muted); white-space: nowrap; opacity: 0; }
        /* the right padding keeps room for the cursor after a full line; a URL or code name with no break point wraps anywhere */
        .asr-ans { padding: 0 14px 0 100px; font-size: 60px; line-height: 1.5; overflow-wrap: anywhere; }
        .asr-para + .asr-para { margin-top: 10px; }
        .asr-li { display: flex; align-items: flex-start; }
        .asr-dot { display: block; flex: none; width: 18px; height: 18px; margin: calc(0.75em - 9px) 28px 0 6px; border-radius: 50%; background: var(--k-accent); }
        .asr-txt { display: block; flex: 1 1 auto; min-width: 0; }
        .asr-em { font-weight: 800; color: var(--k-accent); }
        .asr-tools { display: flex; gap: 40px; margin: 24px 0 0 100px; color: var(--k-muted); }
        .asr-ic { display: block; width: 52px; height: 52px; }
        .asr-ic svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .asr-cur { position: absolute; left: 0; top: 0; width: 10px; height: 58px; border-radius: 3px; background: var(--k-accent); opacity: 0; }
        /* portrait: the panel spans x 10%-90% and y 12%-68%; the avatar gets its own row so the answer uses the full width */
        @container (orientation: portrait) {
          .asr-panel { left: 10%; right: 10%; top: 12%; bottom: 32%; padding: 44px 44px 40px; border-radius: 36px; }
          .asr-bub { max-width: 90%; padding: 20px 34px; border-radius: 34px 34px 10px 34px; font-size: 46px; }
          .asr-view { margin-top: 72px; }
          .asr-who { top: 0; width: 60px; height: 60px; }
          .asr-spark { width: 34px; height: 34px; }
          .asr-think { left: 80px; font-size: 44px; line-height: 60px; }
          .asr-ans { padding: 82px 12px 0 0; font-size: 50px; }
          .asr-dot { width: 16px; height: 16px; margin: calc(0.75em - 8px) 24px 0 4px; }
          .asr-tools { gap: 36px; margin: 22px 0 0; }
          .asr-ic { width: 46px; height: 46px; }
          .asr-cur { width: 8px; height: 48px; }
        }
      </style>

      <div id="root" data-composition-id="ai-stream-answer">
        <div class="asr">
          <div class="asr-bg"></div>
          <div class="asr-panel">
            <div class="asr-q"><div class="asr-bub">怎么写出更好的提示词？</div></div>
            <div class="asr-view" data-layout-allow-overflow>
              <div class="asr-flow">
                <div class="asr-who"><svg class="asr-spark" viewBox="0 0 24 24"><path d="M12 2C12.8 7.6 16.4 11.2 22 12C16.4 12.8 12.8 16.4 12 22C11.2 16.4 7.6 12.8 2 12C7.6 11.2 11.2 7.6 12 2Z" /></svg></div>
                <div class="asr-think">思考中</div>
                <div class="asr-ans">
                  <div class="asr-para">可以从三处入手：</div>
                  <div class="asr-para asr-li"><span class="asr-dot"></span><span class="asr-txt"><b class="asr-em">说清目标</b>和读者</span></div>
                  <div class="asr-para asr-li"><span class="asr-dot"></span><span class="asr-txt"><b class="asr-em">给一个例子</b>做参照</span></div>
                  <div class="asr-para asr-li"><span class="asr-dot"></span><span class="asr-txt"><b class="asr-em">限定格式</b>和字数</span></div>
                  <div class="asr-para">这样回答会稳定很多。</div>
                </div>
                <div class="asr-tools">
                  <span class="asr-ic"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5" /><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" /></svg></span>
                  <span class="asr-ic"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" /><path d="M20.5 3.5v5h-5" /></svg></span>
                  <span class="asr-ic"><svg viewBox="0 0 24 24"><path d="M7.5 10.5v9.5h-3a1.5 1.5 0 0 1-1.5-1.5v-6.5a1.5 1.5 0 0 1 1.5-1.5z" /><path d="M7.5 10.5l3.8-7c1.5 0 2.6 1.3 2.3 2.8l-.7 3.2h5.6a2 2 0 0 1 2 2.4l-1.3 6.5a2 2 0 0 1-2 1.6h-9.7" /></svg></span>
                </div>
                <div class="asr-cur"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // timing (seconds), shared by both orientations. think: when the "thinking" line starts (the variable sets how long
          // it lasts); soft / hard: extra pause after a comma-type / full-stop-type mark; latin: a Latin character takes this
          // share of a CJK one; jitter: +-30% per character, seeded; solid: the cursor stays lit this long after it moves, then
          // blinks (period blink); hold: it is removed this long after the last character (1.35 = lit, off, on, off, so it
          // reads as blinking and is dark when removed); tools: the icons start this long after the last character, once the
          // cursor is gone; lead / glide: a scroll step starts this early and lasts this long (lead = glide: the step is done
          // when the character that needs it lights); fade: the soft top edge of the window, as a share of the line height
          var CFG = { ask: 0.2, askDur: 0.45, who: 0.62, whoDur: 0.34, think: 0.85, sweep: 0.75, parGap: 0.22, dotLead: 0.14, dotDur: 0.3, soft: 0.12, hard: 0.28, latin: 0.45, jitter: 0.6, seed: 7, solid: 0.3, blink: 0.8, hold: 1.35, tools: 1.4, toolEach: 0.08, toolDur: 0.35, lead: 0.32, glide: 0.32, fade: 0.18 };
          // layout per orientation: motion distances in px (sizes live in the CSS)
          var LAND = { rise: 28, toolRise: 14, pad: 10 };
          var PORT = { rise: 22, toolRise: 12, pad: 8 };
          var v = { prompt: "怎么写出更好的提示词？", answer: "可以从三处入手：|- **说清目标**和读者|- **给一个例子**做参照|- **限定格式**和字数|这样回答会稳定很多。", cps: 14, think: 0.6, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".asr");
          var q = function (s) { return root.querySelector(s); };
          var FW = root.clientWidth, FH = root.clientHeight;
          if (!FW || !FH) {
            // not laid out yet: the host clip's declared size, then the window
            var hc = root.closest("[data-width][data-height]");
            FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          var P = FH > FW, L = P ? PORT : LAND;
          root.setAttribute("data-orient", P ? "portrait" : "landscape");
          if (String(v.backdrop) === "off") q(".asr-bg").style.display = "none";

          var cps = Math.max(1, parseFloat(v.cps) || 14);
          var think = parseFloat(v.think);
          think = isFinite(think) ? Math.max(0, think) : 0.6;
          q(".asr-bub").textContent = String(v.prompt);

          // the answer: one span per character, laid out in its final place from the start (no reflow while it streams).
          // "|" starts a paragraph, "- " at its start makes it a list row, **...** is emphasis
          var ans = q(".asr-ans"), chars = [], paras = [];
          ans.innerHTML = "";
          String(v.answer).split("|").forEach(function (raw) {
            var li = /^\s*-\s+/.test(raw), text = raw.replace(/^\s*-\s+/, "").trim();
            var p = { el: document.createElement("div"), li: li, dot: null, first: chars.length }, box = p.el;
            p.el.className = "asr-para" + (li ? " asr-li" : "");
            if (li) {
              p.dot = document.createElement("span");
              p.dot.className = "asr-dot";
              box = document.createElement("span");
              box.className = "asr-txt";
              p.el.appendChild(p.dot);
              p.el.appendChild(box);
            }
            text.split("**").forEach(function (seg, n) {
              if (!seg) return;
              var host = box;
              if (n % 2) { host = document.createElement("b"); host.className = "asr-em"; box.appendChild(host); }
              Array.from(seg).forEach(function (ch) {
                var s = document.createElement("span");
                s.textContent = ch;
                host.appendChild(s);
                chars.push({ el: s, ch: ch, o: "" });
              });
            });
            p.last = chars.length - 1;
            if (p.last >= p.first) { paras.push(p); ans.appendChild(p.el); }
          });
          var thinkEl = q(".asr-think"), tk = Array.from(thinkEl.textContent.trim()).map(function (ch) {
            var s = document.createElement("span");
            s.textContent = ch;
            return s;
          });
          thinkEl.textContent = "";
          tk.forEach(function (s) { thinkEl.appendChild(s); });

          // when each character appears: cps on average, +-30% seeded jitter, pauses after punctuation and between paragraphs
          var rnd = MT.seeded(CFG.seed), t0 = CFG.think + think, t = t0;
          paras.forEach(function (p, n) {
            if (n) t += CFG.parGap;
            p.at = t;
            if (p.li) t += CFG.dotLead;
            for (var i = p.first; i <= p.last; i++) {
              var c = chars[i];
              c.at = t;
              t += ((c.ch.charCodeAt(0) < 256 ? CFG.latin : 1) / cps) * (1 - CFG.jitter / 2 + CFG.jitter * rnd());
              if (/[，、；：,;:]/.test(c.ch)) t += CFG.soft;
              else if (/[。！？!?…]/.test(c.ch)) t += CFG.hard;
            }
          });
          var tEnd = chars.length ? chars[chars.length - 1].at : t0, toolsAt = tEnd + CFG.tools;

          var view = q(".asr-view"), flow = q(".asr-flow"), who = q(".asr-who"), cur = q(".asr-cur"), tools = q(".asr-tools"), bubRow = q(".asr-q");
          var glide = MT.ease("power2.out");
          var lineH = parseFloat(getComputedStyle(ans).lineHeight) || 90;
          var wrote = { who: "", y: null, think: "" };

          // everything that follows the clock is drawn here from t alone: which characters show, the scroll, the cursor.
          // Layout is read live (fonts may land after the script ran), all reads first, then all writes
          var draw = function (t) {
            var viewH = view.clientHeight, gap = view.offsetTop - (bubRow.offsetTop + bubRow.offsetHeight);
            var tops = chars.map(function (c) { return c.el.offsetTop; }), hs = chars.map(function (c) { return c.el.offsetHeight; });
            // the top of every visual line (a character box sits in the middle of its line), then the tool row
            var rows = [];
            chars.forEach(function (c, i) {
              var r = Math.round(tops[i] + hs[i] / 2 - lineH / 2);
              if (!rows.length || r > rows[rows.length - 1] + 2) rows.push(r);
            });
            rows.push(tools.offsetTop);
            // scroll: whenever the newest line (or the tool row) would pass the bottom of the window, glide up to the first
            // line top at or past the shortfall, so lines leave through the top edge whole and no settled frame shows a cut line
            var prev = 0, y = 0;
            var need = function (bottom, at) {
              var raw = bottom + L.pad - viewH, tg = raw;
              if (raw <= prev) return;
              for (var k = 0; k < rows.length; k++) if (rows[k] >= raw) { tg = rows[k]; break; }
              if (tg > prev) { y += (tg - prev) * glide(MT.clamp((t - at + CFG.lead) / CFG.glide, 0, 1)); prev = tg; }
            };
            paras.forEach(function (p) {
              for (var i = p.first; i <= p.last; i++) if (i === p.first || tops[i] !== tops[i - 1]) need(tops[i] + hs[i], i === p.first ? p.at : chars[i].at);
            });
            need(tools.offsetTop + tools.offsetHeight, toolsAt);
            y = Math.round(y);
            // a box that slid up out of the window is hidden once it is fully clipped (the gap above the window is taller than
            // a box); the second test keeps it off the question bubble should a fallback font draw taller boxes
            var keep = function (top, h) { return top + h - y > 0 && top - y > 2 - gap; };
            var shown = 0;
            while (shown < chars.length && chars[shown].at <= t) shown++;
            // the cursor: after the newest character, or at the head of a paragraph that has begun but shows nothing yet
            var ci = -1, head = false, moved = t0;
            paras.forEach(function (p) { if (p.at <= t && chars[p.first].at > t) { ci = p.first; head = true; moved = p.at; } });
            if (ci < 0 && shown) { ci = shown - 1; moved = chars[ci].at; }
            var curOn = ci >= 0 && t >= t0 && t < tEnd + CFG.hold, cx = 0, cy = 0;
            if (curOn) {
              var ce = chars[ci].el;
              // always past the whole box (.asr-ans keeps a right padding for it): tucking it into the empty half of a
              // full-width ，。 reads as text_occluded
              cx = ce.offsetLeft + (head ? 0 : ce.offsetWidth + 4);
              cy = ce.offsetTop + (ce.offsetHeight - cur.offsetHeight) / 2;
            }

            // writes
            if (wrote.y !== y) {
              wrote.y = y;
              flow.style.transform = y ? "translate(0px, " + -y + "px)" : "";
              // a short soft edge that ends above the glyphs of a line resting at the top: only lines on their way out fade
              var m = y ? "linear-gradient(to bottom, transparent 0px, #000 " + Math.round(Math.min(y, CFG.fade * lineH)) + "px)" : "none";
              view.style.webkitMaskImage = m;
              view.style.maskImage = m;
            }
            chars.forEach(function (c, i) {
              var o = i < shown && keep(tops[i], hs[i]) ? "1" : "0";
              if (c.o !== o) { c.o = o; c.el.style.opacity = o; }
            });
            paras.forEach(function (p) { if (p.dot) p.dot.style.opacity = keep(tops[p.first], hs[p.first]) ? "" : "0"; });
            var wo = keep(who.offsetTop, who.offsetHeight) ? "" : "0";
            if (wrote.who !== wo) { wrote.who = wo; who.style.opacity = wo; }
            // lit while characters keep coming; once nothing has arrived for CFG.solid it blinks (so it blinks out at the end)
            var idle = Math.max(0, t - moved - CFG.solid);
            cur.style.opacity = curOn ? String(MT.clamp(0.5 + 1.5 * Math.cos((2 * Math.PI * idle) / CFG.blink), 0, 1)) : "0";
            cur.style.left = Math.round(cx) + "px";
            cur.style.top = Math.round(cy) + "px";
            // thinking: on from CFG.think until the first character; a darker band sweeps through it a whole number of times
            var thinking = think > 0 && t >= CFG.think && t < t0;
            if (wrote.think !== thinking) {
              wrote.think = thinking;
              thinkEl.style.opacity = thinking ? "1" : "0";
              if (!thinking) tk.forEach(function (s) { s.style.color = ""; });
            }
            if (thinking) {
              var per = think / Math.max(1, Math.round(think / CFG.sweep)), pos = (((t - CFG.think) % per) / per) * (tk.length + 3) - 1.5;
              tk.forEach(function (s, i) {
                var k = Math.max(0, 1 - Math.abs(i + 0.5 - pos) / 1.6);
                s.style.color = "color-mix(in srgb, var(--k-ink) " + Math.round(k * 100) + "%, var(--k-muted))";
              });
            }
          };

          var tl = MT.timeline();
          // the question pops out of its bottom-right corner (opaque: dark text on a light bubble never fades)
          tl.fromTo(q(".asr-bub"), { scale: 0, y: L.rise }, { scale: 1, y: 0, duration: CFG.askDur, ease: "back.out(1.4)" }, CFG.ask);
          // the assistant mark pops, and its sparkle turns while it is thinking
          tl.fromTo(who, { scale: 0 }, { scale: 1, duration: CFG.whoDur, ease: "back.out(2)" }, CFG.who);
          tl.fromTo(q(".asr-spark"), { rotation: 0 }, { rotation: 180, duration: think, ease: "power1.inOut" }, CFG.think);
          // a list row's dot pops just before its first character
          paras.forEach(function (p) { if (p.dot) tl.fromTo(p.dot, { scale: 0 }, { scale: 1, duration: CFG.dotDur, ease: "back.out(2.6)" }, p.at); });
          // after the cursor goes, the copy / regenerate / like icons fade up one after another
          tl.fromTo(tools.children, { opacity: 0, y: L.toolRise }, { opacity: 1, y: 0, duration: CFG.toolDur, ease: "power2.out", stagger: CFG.toolEach }, toolsAt);
          tl.each(draw);
          window.__timelines["ai-stream-answer"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"hold","type":"number","label":"全白停几帧（1–3）","default":2,"min":1,"max":3,"step":1},
    {"id":"tail","type":"number","label":"衰减时长（秒）","default":0.3,"min":0.1,"max":0.8,"step":0.033},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"预览：垫两张占位画面"},{"value":"off","label":"透明（压在两镜交界上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>flash-cut · 闪白切</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="flash-cut-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .fc { position: absolute; inset: 0; overflow: hidden; }
        .fc-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .fc-a, .fc-b { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; object-fit: cover; }
        .fc-white { position: absolute; inset: 0; background: #fff; opacity: 0; }
      </style>

      <div id="root" data-composition-id="flash-cut" data-width="1920" data-height="1080">
        <div class="fc" data-layout-allow-overflow>
          <div class="fc-bg"></div>
          <img class="fc-a" src="motion-cards/lib/samples/p1.jpg" alt="" />
          <img class="fc-b" src="motion-cards/lib/samples/p2.jpg" alt="" />
          <div class="fc-white"></div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { cut: 1.0, ramp: 0.067, swap: 0.02 };
          var v = { "hold": 2, "tail": 0.3, "backdrop": "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".fc");
          var q = function (s) { return root.querySelector(s); };
          var num = function (x, d) { x = parseFloat(x); return isFinite(x) ? x : d; };
          var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
          var W = 1920, H = 1080, F = 1 / 30, cut = CFG.cut;
          var demo = String(v.backdrop) !== "off";
          if (!demo) ["bg", "a", "b"].forEach(function (n) { q(".fc-" + n).style.display = "none"; });
          var tl = gsap.timeline({ paused: true });
          // preview only: the placeholder shots change under full cover, one frame after `cut`
          if (demo) tl.fromTo(q(".fc-b"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, cut + CFG.swap);
          var white = q(".fc-white");
          var hold = clamp(Math.round(num(v.hold, 2)), 1, 3) * F, tail = clamp(num(v.tail, 0.3), 0.1, 0.8);
          // two frames of blow-out on the old shot, flat white for `hold`, then a fast fall with a long thin tail on the new one
          tl.fromTo(white, { opacity: 0 }, { opacity: 1, duration: CFG.ramp, ease: "power2.in" }, cut - CFG.ramp);
          tl.to(white, { opacity: 0, duration: tail, ease: "power3.out" }, cut + hold);
          window.__timelines["flash-cut"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

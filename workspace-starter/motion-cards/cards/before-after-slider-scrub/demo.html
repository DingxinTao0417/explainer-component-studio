              if (p.sp) el.appendChild(document.createTextNode(" "));
              units.push(u);
            });
            return units;
          }
          function kReveal(tl, units, variant, at, o) {
            o = o || {};
            var each = o.each || 0.6, gap = o.gap != null ? o.gap : 0.053, ease = o.ease || "snappy";
            units.forEach(function (u, i) {
              var t0 = at + i * gap, fs = parseFloat(getComputedStyle(u).fontSize) || 40;
              if (variant === "rise") {
                tl.set(u, { opacity: 0 }, 0).set(u, { opacity: 1 }, t0);
                tl.fromTo(u, { y: u.offsetHeight * 1.05 + fs * 0.3 }, { y: 0, duration: each, ease: ease }, t0);
              } else if (variant === "blur") {
                tl.fromTo(u, { opacity: 0, y: fs * 0.25, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: each, ease: ease }, t0);
              } else if (variant === "drop") {
                tl.fromTo(u, { opacity: 0 }, { opacity: 1, duration: each / 3, ease: "none" }, t0);
                tl.fromTo(u, { y: -fs * 0.6 }, { y: 0, duration: each, ease: "overshoot" }, t0);
              } else if (variant === "scale") {
                tl.fromTo(u, { opacity: 0 }, { opacity: 1, duration: each * 0.1, ease: "power1.out" }, t0);
                tl.fromTo(u, { scale: 1.6, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: each, ease: ease }, t0);
              } else {
                tl.fromTo(u, { opacity: 0, marginRight: "0.5em" }, { opacity: 1, marginRight: "0em", duration: each, ease: ease }, t0);
              }
            });
            return tl;
          }
          // ==== end kit:text ====

          // ==== kit:fit@1 ====
          function kFit(el, o) {
            o = o || {};
            var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
            var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
            for (;;) {
              el.style.fontSize = f + "px";
              m = kLines(el);
              if ((m.w <= W && m.n <= n) || f <= min) break;
              f = Math.max(min, f - 2);
            }
            if (m.w > W) {
              [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
              m = kLines(el);
            }
            return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
          }
          function kLines(el) {
            var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
            while ((t = it.nextNode())) {
              if (!t.data.trim()) continue;
              r.selectNodeContents(t);
              [].forEach.call(r.getClientRects(), function (b) {
                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {
            if (!el.children.length) return [];
            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====
          var dark = kTone(root) === "dark";
          if (String(v.backdrop) === "off") q(".bs-backdrop").style.display = "none";
          var panel = q(".bs-panel");
          var PW = panel.clientWidth || FW * L.pw, PH = panel.clientHeight || FH * L.ph;

          // the two pictures: optional images, else the same text-free fake UI twice (before gets the foggy treatment in CSS)
          var uiB = q(".bs-before .bs-ui"), uiA = q(".bs-after .bs-ui"), fog = q(".bs-fog");
          var srcs = String(v.srcs).split("|").map(function (s) { return s.trim(); }).filter(Boolean);
          if (srcs.length) {
            var pic = function (el, s) { el.style.backgroundImage = 'url("' + s.replace(/"/g, "%22") + '")'; };
            pic(uiA, srcs[srcs.length > 1 ? 1 : 0]);
            pic(uiB, srcs[0]);
            if (srcs.length > 1) { uiB.classList.remove("bs-soft"); fog.style.display = "none"; } // two real shots: no fake "before"
          } else {
            var ui = kFakeUI(PW, PH - TB, L.kind, 7);
            uiA.innerHTML = uiB.innerHTML = ui.svg;
          }

          // tags: each label is a text slot (split, then fitted down to 28px, then it wraps); empty hides the pill
          [["before", ".bs-before"], ["after", ".bs-after"]].forEach(function (p) {
            var tag = q(p[1] + " .bs-tag"), s = String(v[p[0]]).trim();
            if (!s) { tag.style.display = "none"; return; }
            var lb = tag.querySelector(".bs-lb");
            kSplit(lb, "word", false, s);
            kFit(lb, { lines: 1, min: 28, width: FW * 0.2 });
          });

          var after = q(".bs-after"), edge = q(".bs-edge"), bar = q(".bs-bar"), knob = q(".bs-knob");
          bar.style.left = knob.style.left = "0px"; // from here the script moves them with translateX
          var blur = kSpeedBlur(q(".bs-sb"), "bs", { amount: 0.12, max: 14 });
          var grain = kGrain(q(".bs-grain"), dark ? {} : { opacity: 0.04 });

          // bar position in % of the panel width as a pure function of t
          var pos = function (t) {
            if (t < CFG.t0) return MT.mix(CFG.start, CFG.back, MT.ramp(t, CFG.pre, CFG.t0 - CFG.pre, "smooth"));
            if (t < CFG.fling) return MT.mix(CFG.back, CFG.peak, MT.ramp(t, CFG.t0, CFG.fling - CFG.t0, "out"));
            if (t < CFG.bounce) return MT.mix(CFG.peak, CFG.rest, MT.ramp(t, CFG.fling, CFG.bounce - CFG.fling, "smooth"));
            if (t < CFG.hold) return CFG.rest;
            return MT.mix(CFG.rest, CFG.end, MT.ramp(t, CFG.hold, CFG.scrub - CFG.hold, "smooth"));
          };
          // upstream measured speed in px per frame on a frame 1920 wide (19.2 px per percent): the same scale here keeps
          // the knob squish and the blur identical in both orientations
          var ref = function (s) { return pos(s) * 19.2; };

          var tl = MT.scene(CFG.dur, function (t) {
            var x = (pos(t) / 100) * PW, vx = MT.velocity(ref, t), speed = Math.abs(vx) / 30; // vx: px per second; speed: per frame
            var squish = 1 + Math.min(speed / 110, 1) * 0.18; // peak 1.18
            var press = 1 - 0.06 * Math.sin(Math.PI * MT.ramp(t, CFG.pre, CFG.fling - CFG.pre, "linear")); // pinched while it flies
            after.style.clipPath = "inset(0px " + (PW - x).toFixed(2) + "px 0px 0px)";
            edge.style.left = (x - 24).toFixed(2) + "px";
            bar.style.transform = "translateX(" + x.toFixed(2) + "px)";
            knob.style.transform = "translateX(" + x.toFixed(2) + "px) scale(" + (press * squish).toFixed(4) + "," + press.toFixed(4) + ")";
            knob.style.boxShadow = "inset 0 1px 0 var(--bs-hi), " + kShadow(14 + Math.min(speed / 8, 18), dark ? 2.6 : 1);
            blur(vx, 0);
            grain(t);
          });
          window.__timelines["before-after-slider-scrub"] = tl;
        })();
      </script>
    </template>
  </body>

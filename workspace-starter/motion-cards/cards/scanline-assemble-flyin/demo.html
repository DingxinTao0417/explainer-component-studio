  kTone(root);
  if (String(v.backdrop) === "off") qa(".sa-bg, .sa-vig, .sa-grain, .sa-grid, .sa-glit").forEach(function (e) { e.style.display = "none"; });
  if (getComputedStyle(root).getPropertyValue("--mc-font").trim()) qa(".sa-h1, .sa-stats b").forEach(function (e) { e.style.fontFamily = "var(--k-font)"; });

  // text through kWords (typed spaces kept, | phrases whole) as plain text, so a tilted block has no unit boxes to
  // collide; the title may break only between phrases (zero-width spaces + keep-all). Then kFit to the box
  var plain = function (s, br) { return kWords(s).map(function (u) { return u.t + (u.sp ? " " : br || ""); }).join(""); };
  var parts = String(v.title).split("|"), many = parts.length > 1, key = q(".sa-key");
  q(".sa-hd").textContent = plain(many ? parts.slice(0, -1).join("|") + "|" : v.title, "\u200b");
  key.textContent = many ? plain(parts[parts.length - 1] + "|") : "";
  key.style.display = many ? "" : "none";
  kFit(q(".sa-h1"), { lines: many ? 2 : 1, min: 72 }); // no | : one plain line
  q(".sa-body").textContent = plain(v.sub);
  kFit(q(".sa-body"), { lines: 2, min: 40 });
  [[".sa-name", v.name, 32], [".sa-btx", v.cta, 32]].forEach(function (s) {
    var el = q(s[0]);

  });
  q(".sa-media").style.backgroundImage = "url('" + String(v.src).replace(/'/g, "%27") + "')";

  var board = q(".sa-board"), cam = q(".sa-cam"), AH = board.offsetHeight, AY = board.offsetTop;
  cam.style.transformOrigin = FW * L.origin[0] + "px " + FH * L.origin[1] + "px";
  var NAMES = "NAV TAG H1 TEXT MEDIA CTA STATS".split(" "), slots = [];
  var blocks = qa(".sa-fly").map(function (fly, i) {
    var w = fly.offsetWidth, h = fly.offsetHeight, sb = document.createElement("div"), sl = document.createElement("div"), tk = null;

    sl.setAttribute("data-l", NAMES[i] + " " + w + "×" + h);

  });

  var bpEls = qa(".sa-edge, .sa-dim"), nEl = q(".sa-n"), clk = q(".sa-clk"), stEl = q(".sa-st"), ico = q(".sa-ico path"), mg = blocks[4].fly;
  var grain = kGrain(q(".sa-grain")), last = CFG.land[6], fx = function (x) { return x.toFixed(2); };

  function pose(i, t) {
    var a = MT.ramp(t, CFG.land[i] - CFG.flight, CFG.flight, "overshoot"), f = L.from[i];

      "M" + x + " " + (y - a) + "V" + y + "H" + (x - a) + "M" + (a - g) + " " + y + "H" + -g + "V" + (y - a);

 Changes (2026-10): Remotion/React -> HyperFrames MT scene, frames to seconds; --k-* palette with --k-stage (#050409
 -> stage, purple / pink light -> accent-2 and an accent-2 + accent mix, grey UI -> ink mixes, column rules -> accent /
 accent-2 / muted, panel -> --k-panel); upstream mark and wordmark -> the neutral mark and a bar; the wide kanban panel
 redrawn as one inline SVG with the same boxes (sidebar 560, three 620 px columns, two task cards each); src fills the
 panel; panel 1400 -> 2000 px tall so portrait has no bottom edge; added: film grain against banding, and on dark skins
 a screen-blended pool of on-stage light (14%) under the head; portrait: panel top at 326 px, 2300 px wide with two
 columns and four cards each, slide from 200 px, pan and head distances in frame fractions with the head's constants
 scaled together so the corner turn and every fade keep their frames. Kept as upstream: panel 3000 px wide, r 60, top edge at y 150, pan

<style>

@font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
@font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
#root {
 --k-bg: var(--mc-bg, #ffffff);
 --k-panel: var(--mc-panel, #f4f5f7);
 --k-ink: var(--mc-ink, #15171c);
 --k-muted: var(--mc-muted, #6b7280);
 --k-accent: var(--mc-accent, #e8590c);
 --k-accent-2: var(--mc-accent-2, #2563eb);
 --k-on-accent: var(--mc-on-accent, #ffffff);
 --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
 --k-stage: var(--mc-stage, #0b0d12);
 --k-on-stage: var(--mc-on-stage, #f3f5f8);
 position: absolute;
 inset: 0;
 overflow: hidden;
 font-family: var(--k-font);
 color: var(--k-ink);
}
.ssp { position: absolute; inset: 0; container-type: size; --top: 150px;
 --ssp-pg: var(--k-panel);
 --ssp-l2: color-mix(in srgb, var(--k-accent-2) 70%, var(--k-on-stage));
 --ssp-core: color-mix(in srgb, var(--k-on-stage) 82%, var(--k-accent-2));

.ssp div, .ssp i { position: absolute; display: block; }
.ssp-l { inset: 0; }
.ssp-stage { background: var(--k-stage); }

.ssp-pan { left: 0; top: var(--top); width: 3000px; height: 2000px; transform: translateX(-684px); }
.ssp-pn { left: 0; top: 0; width: 100%; height: 100%; border-radius: 60px 60px 0 0; overflow: hidden; background: var(--ssp-pg) 0 0 / 100% auto no-repeat; }

.ssp-pn .f2 { fill: color-mix(in srgb, var(--k-ink) 68%, var(--ssp-pg)); }

.ssp-pn .h { fill: color-mix(in srgb, var(--k-ink) 32%, var(--ssp-pg)); }

.ssp[data-tone="dark"] .ssp-pool { display: block; }

.ssp-st { left: 0; top: 0; transform: translateX(1638px); }
.ssp-st i { left: -620px; top: -30px; width: 1240px; height: 380px; filter: blur(6px); background: radial-gradient(ellipse 620px 190px at 50% 0%, color-mix(in srgb, var(--ssp-sf) 50%, transparent), color-mix(in srgb, var(--k-accent-2) 16%, transparent) 55%, transparent 78%); }

/* ==== kit:grain@1 ==== */
.ssp-grain { position: absolute; inset: 0; pointer-events: none; }

<script>
(function () {
 // timing in seconds (upstream frames / 30), shared by both orientations: one linear move over all 132f; the head
 // climbs the left edge for its first 360 px (16f), the top streak fades in from -120 px (11f), the left one is gone
 // by +900 px (53f)
 var CFG = { dur: 4.4 };
 // pan and head, upstream px: head start / end (head < 0 = still on the left edge), climb up the left edge
 var H0 = -360, H1 = 2600, CLIMB = 620;
 // layout per orientation: panel width (top edge is the CSS --top), slide start, the panel's right edge at the end
 // and the head's end, as frame fractions (landscape 180 px, 1900 px, 1500 px; portrait starts at 200 px so the
 // corner turn at 0.53 s is still in frame)
 var LAND = { pw: 3000, s0: 0.0938, edge: 0.9896, end: 0.7813 };
 var PORT = { pw: 2300, s0: 0.185, edge: 0.9896, end: 0.7813 };
 var v = { src: "", backdrop: "on" };
 try {
  var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
  for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
 } catch (e) {}

 var root = document.querySelector(".ssp");
 var q = function (s) { return root.querySelector(s); };
 var FW = root.clientWidth, FH = root.clientHeight;
 if (!FW || !FH) {
  // not laid out yet: the host clip's declared size, then the window
  var hc = root.closest("[data-width][data-height]");
  FW = hc ? +hc.getAttribute("data-width") : window.innerWidth;
  FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
 }
 var P = FH > FW, L = P ? PORT : LAND;
 root.setAttribute("data-orient", P ? "portrait" : "landscape");
 if (String(v.backdrop) === "off") q(".ssp-stage").style.display = q(".ssp-eave").style.display = "none";
 var pn = q(".ssp-pn"), src = String(v.src).trim();
 if (src) { pn.style.backgroundImage = 'url("' + src.replace(/"/g, "%22") + '")'; pn.firstChild.style.display = "none"; }

 // ==== kit:tone@1 ====
 function kRGB(el, color) {
  var p = document.createElement("i");
  p.style.cssText = "position:absolute;width:0;height:0;color:" + color;
  el.appendChild(p);
  var c = getComputedStyle(p).color, n = (c.match(/-?[\d.]+/g) || [0, 0, 0]).map(Number);
  el.removeChild(p);
  return /^color\(/.test(c) ? [n[0] * 255, n[1] * 255, n[2] * 255] : n.slice(0, 3);
 }
 function kTone(wrap) {
  var c = kRGB(wrap, "var(--k-bg)");
  var tone = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255 < 0.45 ? "dark" : "light";
  wrap.setAttribute("data-tone", tone);
  return tone;
 }
 // ==== end kit:tone ====
 var dark = kTone(root) === "dark", pool = q(".ssp-pool");

 var TOP = parseFloat(getComputedStyle(q(".ssp-pan")).getPropertyValue("--top"));
 // frame px: the slide runs A -> B; kh scales the head so it ends at `end` of the width, and every head constant
 // (climb start, fade points) scales with it, so each phase keeps its frames in both orientations
 var A = L.s0 * FW, B = L.edge * FW - L.pw, kh = (L.end * FW - B) / H1;
 var pan = q(".ssp-pan"), st = q(".ssp-st"), sl = q(".ssp-sl"), dk = q(".ssp-dk"), hs = q(".ssp-hs"), vs = q(".ssp-vs");
 var px = function (n) { return n.toFixed(1) + "px"; };

 // ==== kit:grain@1 ====
 function kGrain(layer, o) {
   o = o || {};
   var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
   var dark = tones && tones.getAttribute("data-tone") === "dark";
   var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
     var f = "type='linear' slope='2.4' intercept='-0.7'";
     var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
       "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
       "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
       "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
       "<rect width='100%' height='100%' filter='url(#g)'/></svg>";
     return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
   });
   layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
   layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
   layer.style.backgroundSize = size + "px " + size + "px";
   return function (t) {
     var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
     layer.style.backgroundImage = tiles[k % 6];
     layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
   };
 }
 // ==== end kit:grain ====

 // film grain over the gradients (dark-stage strength); none when the card sits on a host picture
 var grain = String(v.backdrop) === "off" ? null : kGrain(q(".ssp-grain"), { opacity: 0.09, blend: "soft-light" });

 var tl = MT.scene(CFG.dur, function (t) {
  if (grain) grain(t);
  var p = t / CFG.dur;                                            // linear: a machine pan, no ease
  var slide = MT.mix(A, B, p), head = kh * MT.mix(H0, H1, p);
  var on = Math.max(0, head), c = MT.clamp((head - kh * H0) / (-kh * H0), 0, 1), vy = TOP + CLIMB - c * CLIMB;
  var vG = head < 0 ? 1 : Math.max(0, 1 - head / (900 * kh)), hG = MT.clamp((head + 120 * kh) / (240 * kh), 0, 1);
  pan.style.transform = "translateX(" + px(slide) + ")";
  st.style.transform = "translateX(" + px(on) + ")"; st.style.opacity = hG;
  sl.style.top = px(vy - TOP - 320); sl.style.opacity = vG;
  dk.style.background = "radial-gradient(ellipse 1350px 1000px at " + px(on + 60) + " " + px((head < 0 ? vy - TOP : 40) + 260) + unlit;
  if (dark) pool.style.background = "radial-gradient(ellipse 1350px 1000px at " + px(on) + " " + px((head < 0 ? vy - TOP : 40) + 200) + ", color-mix(in srgb, var(--k-on-stage) 14%, transparent), transparent 60%)";
  hs.style.transform = "translateX(" + px(slide + on) + ")"; hs.style.opacity = hG;
  vs.style.transform = "translate(" + px(slide) + ", " + px(vy - TOP) + ")"; vs.style.opacity = vG;
 });
 window.__timelines["slide-spotlight-pan"] = tl;
})();
</script>

  // ==== kit:speedblur@1 ====

  }
  // ==== end kit:fit ====

  var tone = kTone(root), off = String(v.backdrop) === "off", C = CFG, S = tone === "dark" ? 2.6 : 1;
  var esc = function (s) { return String(s).trim().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); };
  var img = function (s) { return '<img src="' + esc(s) + '" alt="">'; };
  // text-free UI pieces (no DOM text, so no contrast checks). KIND: landscape size, upstream radius and scale;
  // kinds 0 nav, 1 card, 2 strip, 3 search, 4 stats, 5 header
  var KIND = [[1190, 38, 10, 0.62], [258, 225, 16, 0.72], [552, 113, 12, 0.5], [559, 24, 10, 0.55], [284, 50, 10, 0.9], [550, 43, 8, 0.8]];
  var COL = ["--og-t", "--og-l", "--k-accent", "--k-accent-2", "--og-c", "--og-c2"];
  // rects "x y w h radius colour"; cards add 8 chart bars from a seed
  var UI = [
    "14 10 18 18 5 2,42 15 96 9 4.5 0,420 15 52 8 4 1,488 15 52 8 4 1,556 15 52 8 4 1,624 15 52 8 4 1,1062 9 112 20 10 4,1078 15 62 8 4 2",
    "18 20 140 13 6.5 0,210 18 30 16 8 4,18 44 206 8 4 1,18 58 170 8 4 1,18 190 58 18 9 5,84 190 46 18 9 4",
    "16 16 26 26 8 3,54 18 300 12 6 0,54 40 470 8 4 1,54 54 430 8 4 1,54 68 290 8 4 1,54 86 64 16 8 5,124 86 52 16 8 4,476 16 60 16 8 4",
    "10 6 12 12 6 1,30 9 180 6 3 1,516 5 32 14 7 4",
    "12 19 12 12 6 2,30 13 54 10 5 0,30 29 40 7 3.5 1,104 19 12 12 6 3,122 13 54 10 5 0,122 29 40 7 3.5 1,196 19 12 12 6 3,214 13 54 10 5 0,214 29 40 7 3.5 1",
    "14 12 150 14 7 0,174 12 74 18 9 4,430 16 104 10 5 1"
  ];
  function ui(k, s) {
    var o = UI[k].split(","), j, h;
    if (k === 1) for (j = 0; j < 8; j++) { h = 24 + 64 * Math.abs(Math.sin(j * 1.9 + s * 2.3)); o.push([18 + 28 * j, (176 - h).toFixed(1), 22, h.toFixed(1), 4, j === 5 ? 3 : j === 7 ? 2 : 1].join(" ")); }
    return o.map(function (r) { r = r.split(" "); return '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="' + r[4] + '" style="fill:var(' + COL[r[5]] + ')"/>'; }).join("");
  }
  var svgOf = function (k, s, at) {
    var d = KIND[k];
    return "<svg " + (at || "") + 'viewBox="0 0 ' + d[0] + " " + d[1] + '" aria-hidden="true">' + (at ? '<rect width="100%" height="100%" rx="' + d[2] + '" style="fill:var(--og-card);stroke:var(--og-ln)"/>' : "") + ui(k, s) + "</svg>";
  };
  var box = function (x, y, w, h) { return 'x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" '; };

  // the page behind: an image, or a nav over a grid of cards
  var pg = q(".og-page"), pv = String(v.page).trim();
  if (off) ["backdrop", "page", "scrim", "vg", "grain"].forEach(function (c) { q(".og-" + c).style.display = "none"; });
  else if (pv) pg.innerHTML = img(pv);
  else {
    var pw = pg.clientWidth, ph = pg.clientHeight, nc = P ? 2 : 3, gw = pw * (P ? 0.8 : 0.58), g = pw * 0.02;
    var tw = (gw - (nc - 1) * g) / nc, th = (tw * 225) / 258, nh = (pw * 38) / 1190, o = [svgOf(0, 0, box(0, 0, pw, nh))];

  }

  // the cast in cue order (later arrivals stack on top): kind, fly-in offset dx, dy (px)
  var CAST = [[0, 0, -120], [1, -500, 0], [1, 500, 0], [2, 450, 260], [1, -400, 300], [2, 0, 320], [3, 0, -240], [4, 380, 0], [5, 360, -200]];
  var shots = String(v.shots).split("|").filter(function (s) { return s.trim(); });
  var cast = [].map.call(root.querySelectorAll(".og-fly"), function (bx, i) {
    var el = bx.firstChild, c = CAST[i], d = KIND[c[0]], s = i && i < 6 && shots[i - 1];
    el.innerHTML = s ? img(s) : svgOf(c[0], i);
    var k = (el.offsetWidth / d[0]) * d[3]; // on-screen scale of the upstream texture: shadow and radius follow it
    el.style.borderRadius = (d[2] * k).toFixed(1) + "px";
    return { el: el, dx: c[1] * U, dy: c[2] * U, k: k, rot: parseFloat(getComputedStyle(el).getPropertyValue("--r")) || 0, t0: C.cue + i * C.gap, blur: kSpeedBlur(bx, "og", { amount: 0.3, max: 22 }) };
  });
  var sh = function (k, y, b, a, a2) {
    var m = function (x) { return "color-mix(in srgb, var(--og-shade) " + Math.min(100, x * S * 100).toFixed(1) + "%, transparent)"; };
    return "0 " + (y * k).toFixed(1) + "px " + (b * k).toFixed(1) + "px " + m(a) + ", 0 " + (2 * k).toFixed(1) + "px " + (6 * k).toFixed(1) + "px " + m(a2);
  };

  // sign-off: the name in letters, fitted (the mark is 1.3 em), the tagline fitted under it
  var stack = q(".og-stack"), word = q(".og-word"), nm = q(".og-name"), mk = q(".og-mk"), tag = q(".og-tag"), logo = String(v.logo).trim();
  if (logo === "none") mk.style.display = "none";
  else if (logo) mk.innerHTML = img(logo);
  var marks = logo === "none" ? [] : [mk], SW = stack.clientWidth;
  var letters = kSplit(nm, "char", false, String(v.name).trim() || "示例应用");
  var fs = kFit(nm, { width: SW - (marks.length ? 1.6 * parseFloat(getComputedStyle(word).fontSize) : 0), min: 72 }).size;
  word.style.fontSize = fs + "px";
  kRows(nm, "og-row");
  if (String(v.tagline).trim()) { kSplit(tag, "line", false, v.tagline); kFit(tag, { width: SW, min: 40 }); }
  else tag.style.display = "none";
  // stage light on the name row (upstream radii 700 x 360 px at a 118 px name)
  var RB = root.getBoundingClientRect(), WB = word.getBoundingClientRect(), sc = RB.width / FW || 1, sl = q(".og-sl");
  [["--x", WB.left + WB.width / 2 - RB.left], ["--y", WB.top + WB.height / 2 - RB.top], ["--w", 5.93 * fs * sc], ["--h", 3.05 * fs * sc]]
    .forEach(function (a) { sl.style.setProperty(a[0], (a[1] / sc).toFixed(1) + "px"); });

  // 20 gold motes with a warm halo and 6 bokeh, all from the index (upstream frame fractions)
  var dust = q(".og-dust"), motes = [], DW = 1.92e3, DH = 1.08e3;
  for (var i = 0; i < 26; i++) {
    var b = i > 19, n = b ? i - 20 : i, el = dust.appendChild(document.createElement("i"));
    var m = b ? { x: (n * 701 + 260) / DW, y: (n * 389 + 640) / DH, rise: 0.55 + (n % 3) * 0.2, size: 14 + (n % 3) * 7, op: 0.1 + (n % 2) * 0.06 }
      : { x: (n * 439 + 137) / DW, y: (n * 613 + 271) / DH, rise: 0.3 + (n % 5) * 0.11, amp: 9 + (n % 4) * 5, fq: 0.022 + (n % 3) * 0.008, ph: (n * 0.83) % (2 * Math.PI), size: 2.4 + (n % 3) * 0.9, op: 0.35 + ((n * 7) % 5) * 0.09 };
    m.x = (m.x % 1) * FW; m.y = (m.y % 1) * FH; m.size *= U; m.b = b; m.el = el;
    el.className = b ? "og-b" : "og-d";
    el.style.width = el.style.height = m.size.toFixed(1) + "px";
    if (b) el.style.opacity = m.op;
    else el.style.boxShadow = "0 0 " + (2.5 * m.size).toFixed(1) + "px " + (0.6 * m.size).toFixed(1) + "px color-mix(in srgb, var(--og-gold) 60%, transparent)";
    motes.push(m);
  }

  var grain = off ? null : kGrain(q(".og-grain"), tone === "dark" ? {} : { opacity: 0.045 });
  var cam = q(".og-cam"), sw = q(".og-sw"), vg = q(".og-vg"), rl = q(".og-rl"), xs = [q(".og-xl"), q(".og-xr")];
  var BZ = MT.bezier, FLY = BZ(0.34, 1.4, 0.44, 1), BL = BZ(0.4, 0, 0.4, 1), CR = BZ(0.3, 0, 0.2, 1), SWE = BZ(0.4, 0, 0.6, 1), LP = BZ(0.2, 0.75, 0.3, 1);
  var lin = function (t, a, d) { return MT.clamp((t - a) / d); };
  var ip = function (t, a, b, e) { return MT.interpolate(t, a, b, { easing: e, extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };
  var press = function (el, t, t0) {
    // letterpress: lifted, enlarged, soft, then set (upstream 28 px, 1.35x, 8 px blur at 118 px)
    var p = MT.ramp(t, t0, C.press, LP), s = el.style;
    s.opacity = p.toFixed(3);
    s.transform = "translateY(" + ((1 - p) * 0.237 * fs).toFixed(2) + "px) scale(" + (1.35 - 0.35 * p).toFixed(4) + ")";
    s.filter = p < 0.995 ? "blur(" + ((1 - p) * 0.068 * fs).toFixed(2) + "px)" : "none";
  };
  function render(t) {
    var f = t * 30; // frames at 30 fps, for the upstream per-frame constants
    if (grain) {
      pg.style.filter = "blur(" + (14 * U * MT.ramp(t, 0, C.blur, BL)).toFixed(2) + "px) saturate(.45)";
      grain(t);
    }
    // crane: 4 deg tilt and 1.06x settle in 1.333 s, then a slow push from 1.2 s, starting at rest
    var cr = MT.ramp(t, 0, C.crane, CR);
    cam.style.transform = "perspective(" + L.persp + "px) rotateX(" + (4 - 4 * cr).toFixed(3) + "deg) scale(" + (1.06 - 0.06 * cr + 0.035 * MT.ramp(t, C.push, C.pushDur, "smooth")).toFixed(4) + ")";
    // cast: overshooting fly-in from 2x tilt and 1.12x, blur along the path, shadow tightens + 1.5% press on landing
    var rec = lin(t, C.recede, C.recedeDur);
    cast.forEach(function (c) {
      var s = c.el.style, u = t - c.t0, p = MT.ramp(t, c.t0, C.fly, FLY), air = Math.max(0, 1 - p), land = ip(u, [0.3, 0.4, 0.533], [0, 1, 0]);
      s.opacity = u < 0 ? 0 : (lin(u, 0, C.fadeIn) * (1 - 0.12 * rec)).toFixed(3);
      s.transform = "translate(" + (c.dx * (1 - p)).toFixed(2) + "px," + (c.dy * (1 - p)).toFixed(2) + "px) rotate(" + (c.rot * (2 - p)).toFixed(3) + "deg) scale(" + ((1.12 - 0.12 * p) * (1 - 0.015 * land)).toFixed(4) + ")";
      s.filter = rec > 0 ? "saturate(" + (1 - 0.08 * rec).toFixed(3) + ")" : "none";
      s.boxShadow = land > 0.01 ? sh(c.k, 10 - 5 * land, 24 - 12 * land, 0.16 + 0.06 * land, 0.08 + 0.06 * land) : sh(c.k, 10 + 26 * air, 24 + 46 * air, 0.16 + 0.1 * air, 0.08);
      var vp = u < 0 ? 0 : -MT.velocity(function (z) { return MT.ramp(z, c.t0, C.fly, FLY); }, t);
      c.blur(c.dx * vp, c.dy * vp);
    });
    // dust rises and sways, bokeh rises faster (upstream px per frame)
    motes.forEach(function (m) {
      var H = m.b ? FH + 100 * U : FH, x = m.x, y = (m.y - f * m.rise * U) % H;
      if (y < 0) y += H;
      if (m.b) y -= 50 * U;
      else { x += Math.sin(f * m.fq + m.ph) * m.amp * U; m.el.style.opacity = (m.op * (0.7 + 0.3 * Math.sin(f * 0.21 + m.ph * 3))).toFixed(3); }
      m.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
    });
    sw.style.opacity = ip(f, [2, 5, 11, 14], [0, 0.12, 0.12, 0]).toFixed(4);
    sw.style.setProperty("--sx", (141.67 * MT.ramp(t, C.sweep, C.sweepDur, SWE) - 36.46).toFixed(2) + "%");
    sl.style.opacity = ip(t, C.light, [0, 0.55, 0.32]).toFixed(4);
    vg.style.opacity = (0.1 * lin(t, C.vig, C.vigDur)).toFixed(4);
    // mark first, letters 1.8 frames apart; one breath of tracking once all are set
    marks.forEach(function (el) { press(el, t, C.mark); });
    letters.forEach(function (el, i) { press(el, t, Math.round((C.letters + i * C.step) * 30) / 30); });
    word.style.letterSpacing = (0.03 + ip(t, [C.breath, C.breath + C.breathDur], [-0.01, 0.005], CR)).toFixed(4) + "em";
    // the rule grows from its centre, its hairlines shoot out and fade; the tagline floats up
    var ex = MT.ramp(t, C.rule, C.ext, CR), tg = MT.ramp(t, C.tag, C.tagDur, "out");
    rl.style.transform = "scaleX(" + MT.ramp(t, C.rule, C.ruleDur, CR).toFixed(4) + ")";
    xs.forEach(function (x) { x.style.transform = "scaleX(" + ex.toFixed(4) + ")"; x.style.opacity = ex > 0 ? (1 - lin(t, C.extFade, C.extFadeDur)).toFixed(3) : 0; });

    tag.style.transform = "translateY(" + ((1 - tg) * 6 * U).toFixed(2) + "px)";
  }
  var tl = MT.scene(CFG.dur, render);
  render(0);
  window.__timelines["outro-group-photo-launch"] = tl;
})();

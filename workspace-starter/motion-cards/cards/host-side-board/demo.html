<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"host","type":"string","label":"人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/host.png"},
    {"id":"side","type":"enum","label":"人让到哪一侧","default":"left","options":[{"value":"left","label":"左"},{"value":"right","label":"右"}]},
    {"id":"heading","type":"string","label":"板上的标题（可空）","default":"上手前先备好"},
    {"id":"items","type":"string","label":"条目，用 | 分开（2–4 条）","default":"一段示例素材|一句明确的目标|十分钟不被打断"},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>host-side-board · 人旁白板</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="host-side-board-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .sb { position: absolute; inset: 0; }
        .sb-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .sb-host { position: absolute; left: 110px; top: 230px; width: 680px; height: 850px; }
        .sb-disc { position: absolute; left: 50px; top: 30px; width: 580px; height: 580px; border-radius: 50%; background: var(--k-accent); }
        .sb-fig { position: absolute; inset: 0; background: center bottom / contain no-repeat; }
        .sb-slot { position: absolute; left: 890px; top: 0; width: 940px; height: 1080px; display: flex; align-items: center; }
        .sb-board { display: block; width: 940px; padding: 56px 60px 52px; border-radius: 28px; background: var(--k-panel); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); }
        .sb-head { display: block; font-size: 84px; line-height: 110px; font-weight: 800; white-space: nowrap; }
        .sb-rule { display: block; width: 150px; height: 10px; margin: 20px 0 30px; border-radius: 5px; background: var(--k-accent); }
        .sb-item { display: flex; align-items: center; height: 150px; }
        .sb-num { display: flex; flex: none; align-items: center; justify-content: center; width: 92px; height: 92px; margin-right: 30px; border-radius: 50%; background: var(--k-accent); color: var(--k-on-accent); font-size: 50px; font-weight: 800; }
        .sb-txt { display: block; font-size: 66px; line-height: 90px; font-weight: 700; white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="host-side-board" data-width="1920" data-height="1080">
        <div class="sb">
          <div class="sb-bg"></div>
          <div class="sb-slot">
            <div class="sb-board">
              <span class="sb-head">上手前先备好</span>
              <span class="sb-rule"></span>
              <div class="sb-list">
                <div class="sb-item"><span class="sb-num">1</span><span class="sb-txt">一段示例素材</span></div>
                <div class="sb-item"><span class="sb-num">2</span><span class="sb-txt">一句明确的目标</span></div>
                <div class="sb-item"><span class="sb-num">3</span><span class="sb-txt">十分钟不被打断</span></div>
              </div>
            </div>
          </div>
          <div class="sb-host">
            <div class="sb-disc"></div>
            <div class="sb-fig" style="background-image: url(motion-cards/lib/samples/host.png)"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            at: 0.5,          // host holds the centre this long
            slide: 0.6,       // host: centre → side
            big: 1.08,        // host is a little larger while alone, gives up size as well as place
            boardLag: 0.2,    // board starts opening this long after the host starts moving
            open: 0.5,        // board unfold
            firstItem: 0.7,   // first item, counted from `at`
            gap: 0.24,        // between items
          };
          var v = { side: "left", heading: "上手前先备好", items: "一段示例素材|一句明确的目标|十分钟不被打断", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".sb");
          var q = function (s) { return root.querySelector(s); };
          var all = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
          if (String(v.backdrop) === "off") q(".sb-bg").style.display = "none";
          if (v.host) q(".sb-fig").style.backgroundImage = 'url("' + String(v.host) + '")';
          var head = q(".sb-head");
          head.textContent = String(v.heading || "");
          if (!v.heading) { head.style.display = "none"; q(".sb-rule").style.display = "none"; }
          var list = String(v.items || "").split("|").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 4);
          var box = q(".sb-list");
          box.textContent = "";
          list.forEach(function (t, i) {
            var row = document.createElement("div"), n = document.createElement("span"), x = document.createElement("span");
            row.className = "sb-item"; n.className = "sb-num"; x.className = "sb-txt";
            n.textContent = String(i + 1); x.textContent = t;
            row.appendChild(n); row.appendChild(x); box.appendChild(row);
          });
          var right = String(v.side) === "right", dir = right ? -1 : 1;
          var host = q(".sb-host"), slot = q(".sb-slot"), board = q(".sb-board");
          if (right) { host.style.left = "1130px"; slot.style.left = "90px"; }
          var from = right ? "inset(0% 0% 0% 100% round 28px)" : "inset(0% 100% 0% 0% round 28px)";
          var go = CFG.at;

          var tl = gsap.timeline({ paused: true });
          tl.set(host, { transformOrigin: "50% 100%" }, 0);
          // host leaves the centre first; the board grows out of the edge the host just left
          tl.fromTo(host, { x: 510 * dir, scale: CFG.big }, { x: 0, scale: 1, duration: CFG.slide, ease: "power3.inOut" }, go);
          tl.fromTo(board, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, go + CFG.boardLag);
          tl.fromTo(board, { clipPath: from, x: -90 * dir }, { clipPath: "inset(0% 0% 0% 0% round 28px)", x: 0, duration: CFG.open, ease: "power3.out" }, go + CFG.boardLag);
          tl.fromTo(head, { opacity: 0, x: -30 * dir }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, go + CFG.boardLag + 0.22);
          tl.fromTo(q(".sb-rule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, go + CFG.boardLag + 0.3);
          all(".sb-item").forEach(function (row, i) {
            var t = go + CFG.firstItem + i * CFG.gap;
            var num = row.querySelector(".sb-num");
            tl.set(num, { opacity: 0 }, 0);
            tl.set(num, { opacity: 1 }, t);
            tl.fromTo(num, { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.6)" }, t);
            tl.fromTo(row.querySelector(".sb-txt"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, t + 0.06);
          });
          window.__timelines["host-side-board"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

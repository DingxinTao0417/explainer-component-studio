            var el = document.createElement("div");
            el.className = "pk-r c2";
            var p = ICONS[i % ICONS.length].map(function (d) { return '<path d="' + d + '"/>'; }).join("");
            el.innerHTML = '<span class="pk-ic"><svg viewBox="0 0 16 16" fill="none" stroke="var(--k-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg></span><span class="pk-t"></span>';
            el.lastChild.textContent = txt;
            list.appendChild(el);
            return { el: el, t: el.lastChild, ic: el.firstChild, c: 2, k: 1 };
          });
          // each option shrinks to fit the pill (never below 40px), measured once at the focus size; the same ratio
          // then applies to its smaller sizes, so a long option keeps its depth cue
          var avail = L.vw * L.avail - S * 21;
          rows.forEach(function (r) {
            r.t.style.whiteSpace = "normal";
            var f = kFit(r.t, { max: 17 * S, min: 40, lines: 1, width: avail });
            r.k = f.size / (17 * S);
            r.t.style.whiteSpace = "";
          });
          var pill = q(".pk-pill"), view = q(".pk-view"), ground = q(".pk-ground"), badge = q(".pk-badge");
          var blur = kSpeedBlur(q(".pk-box"), "pk", { amount: 0.06, max: 0.8 * S });
          list = q(".pk-list");

          // position in rows: 5 steps; inside a step the first (1 - hold) glides on outQuint, the rest stands still
          var N = Math.max(1, Math.min(CFG.steps, rows.length - 1));
          function stepAt(t) {
            var g = Math.min(N, Math.max(0, (t - CFG.t0) / CFG.step)), st = Math.min(N - 1, Math.floor(g));
            return { st: st, lo: Math.min(1, g - st) };
          }
          function posAt(t) {
            var s = stepAt(t), x = Math.min(1, s.lo / (1 - CFG.hold));
            return rows.length < 2 ? 0 : s.st + 1 - Math.pow(1 - x, 5);
          }
          var ramp = function (t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); };
          var tl = MT.scene(CFG.dur, function (t) {
            var pos = posAt(t), s = stepAt(t);
            var land = Math.max(0, (s.lo - (1 - CFG.hold)) / CFG.hold);
            var br = land > 0 ? Math.sin(Math.min(1, land / CFG.breathLen) * Math.PI) * CFG.breath : 0;
            var fade = ramp(t, 0, CFG.fade);
            view.style.opacity = ground.style.opacity = fade;
            badge.style.opacity = ramp(t, CFG.badgeAt, CFG.badgeEnd);
            pill.style.transform = "scaleY(" + (1 + br).toFixed(4) + ")";
            list.style.transform = "translateY(" + ((2 - pos) * RH).toFixed(2) + "px)";
            rows.forEach(function (r, i) {
              var d = Math.abs(i - pos), k2 = Math.min(2, d);
              var c = d < 0.5 ? 0 : d < 1.5 ? 1 : 2;
              if (c !== r.c) { r.c = c; r.el.className = "pk-r c" + c; }
              r.el.style.opacity = ((k2 <= 1 ? 1 - 0.45 * k2 : 0.55 - 0.37 * (k2 - 1)) * Math.min(1, Math.max(0, (CFG.out - d) / (CFG.out - 2)))).toFixed(3);
              r.t.style.fontSize = Math.max(40, (17 - 3 * Math.min(1, d / 2)) * S * r.k).toFixed(2) + "px";
              r.ic.style.opacity = Math.max(0, 1 - d * 1.6).toFixed(3);
            });
            // list speed in px per second (upstream blurs by speed only while it glides; the hold gives zero)
            blur(0, -MT.velocity(posAt, t) * RH);
            if (grain) grain(t);
          });
          window.__timelines["picker-carousel-feature-cycle"] = tl;
        })();
      </script>
    </template>
  </body>

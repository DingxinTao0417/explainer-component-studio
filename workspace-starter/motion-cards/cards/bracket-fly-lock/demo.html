              pre = "";

            if (pre) out.length ? (out[out.length - 1].t += pre) : out.push({ t: pre, sp: false });
            if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
            if (out.length) out[out.length - 1].sp = false;
            return out;
          }
          function kSplit(el, by, rise, text) {
            var s = text != null ? String(text) : el.textContent, units = [];
            var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
            el.textContent = "";
            parts.forEach(function (p) {
              var u = document.createElement("span"), box = u;
              u.className = "bf-u"; u.textContent = p.t;
              if (by === "line") u.style.display = "block";
              if (!p.t.trim()) { el.appendChild(u); return; }
              if (rise) { box = document.createElement("span"); box.className = "bf-cut"; box.style.display = u.style.display; box.appendChild(u); }
              el.appendChild(box);
              if (p.sp) el.appendChild(document.createTextNode(" "));
              units.push(u);
            });
            return units;
          }
          // ==== end kit:text ====
          var tone = kTone(root);

          // ---- target rectangle (defaults when a value is missing)
          var num = function (x, d, lo) { x = parseFloat(x); return isFinite(x) && x >= lo ? x : d; };
          var TX = num(v.x, 240, 0), TY = num(v.y, 340, 0), TW = num(v.w, 640, 40), TH = num(v.h, 420, 40);
          var CX = TX + TW / 2, CY = TY + TH / 2, PAD = CFG.pad, F = 1 / 30;
          root.style.setProperty("--tx", TX + "px"); root.style.setProperty("--ty", TY + "px");
          root.style.setProperty("--tw", TW + "px"); root.style.setProperty("--th", TH + "px");
          var cam = q(".bf-cam"), scene = q(".bf-scene"), off = String(v.backdrop) === "off";
          cam.style.transformOrigin = CX + "px " + CY + "px";
          if (off) { scene.style.display = "none"; q(".bf-grain").style.display = "none"; }

          // ---- scenery: a card grid anchored on the target
          if (!off) {
            var cards = "", n = 0, i0 = -Math.ceil(TX / (TW + CFG.gap)) - 1, i1 = Math.ceil((FW - TX) / (TW + CFG.gap)) + 1;
            var j0 = -Math.ceil(TY / (TH + CFG.gap)) - 1, j1 = Math.ceil((FH - TY) / (TH + CFG.gap)) + 1;
            for (var i = i0; i <= i1; i++) for (var j = j0; j <= j1; j++) {
              var cx0 = TX + i * (TW + CFG.gap), cy0 = TY + j * (TH + CFG.gap);
              if ((!i && !j) || n > 60 || cx0 > FW + 60 || cx0 + TW < -60 || cy0 > FH + 60 || cy0 + TH < -60) continue;
              n++;
              cards += '<i class="bf-card" style="left:' + cx0 + "px;top:" + cy0 + "px;width:" + TW + "px;height:" + TH + 'px"></i>';
            }
            scene.insertAdjacentHTML("afterbegin", cards);
          }

          // ---- label slots: shrink to the floor, then wrap
          var tag = q(".bf-tag"), nameEl = q(".bf-name"), codeEl = q(".bf-code"), dot = q(".bf-dot");
          var lab = String(v.label == null ? "" : v.label).trim(), cod = String(v.code == null ? "" : v.code).trim();
          nameEl.style.display = lab ? "" : "none";
          codeEl.style.display = cod ? "" : "none";
          var showTag = !!(lab || cod);
          tag.style.display = showTag ? "" : "none";
          var tagW = 0, tagH = 0, above = true;
          var RIGHT = FW * (P ? 0.9 : 0.95);
          if (showTag) {
            if (cod) { codeEl.textContent = cod; kFit(codeEl, { lines: 1, min: 28, width: 280 }); }
            if (lab) {
              kSplit(nameEl, "word", false, lab);
              var room = RIGHT - (TX - PAD + 2) - (tag.offsetWidth - nameEl.offsetWidth);
              room = Math.max(160, room); nameEl.style.maxWidth = room + "px";
              kFit(nameEl, { lines: 1, min: 40, width: room });
            }
            tagW = tag.offsetWidth; tagH = tag.offsetHeight;
            // above the frame unless that hits the top zone; then below
            var topLimit = P ? FH * 0.12 : 8;
            above = TY - PAD - 14 - tagH >= topLimit || TY + TH + PAD + 14 + tagH > (P ? FH * 0.68 : FH - 8);
            tag.style.transformOrigin = above ? "0 100%" : "0 0";
          }
          var tagU = [dot, nameEl, codeEl];

          // ---- frame, centre cross, camera
          var ks = [].slice.call(root.querySelectorAll(".bf-k")), fly = q(".bf-fly");
          var xh = [].slice.call(root.querySelectorAll(".bf-xh")), glow = q(".bf-glow"), glowFill = glow.firstChild, dim = q(".bf-dim");
          var ARM = Math.max(28, Math.min(CFG.arm, Math.round(Math.min(TW, TH) * 0.4)));
          ks.forEach(function (k) {
            k.setAttribute("width", ARM); k.setAttribute("height", ARM); k.setAttribute("viewBox", "0 0 " + ARM + " " + ARM);
            [].forEach.call(k.querySelectorAll("path"), function (p) { p.setAttribute("d", "M3 " + (ARM - 3) + "V3H" + (ARM - 3)); });
            k.style.left = k.style.top = "0px";
          });
          var blur = kSpeedBlur(q(".bf-ret"), "bf", { amount: CFG.blur, max: CFG.max });
          var grain = kGrain(q(".bf-grain"), { opacity: tone === "dark" ? 0.06 : 0.035 });
          var clamp = { extrapolateLeft: "clamp", extrapolateRight: "clamp" };
          // fly offset (px), out cubic
          var flyAt = function (t) {
            var p = MT.interpolate(t, [CFG.flyIn, CFG.flyEnd], [0, 1], { easing: "power3.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
            return [(1 - p) * L.fx, (1 - p) * L.fy];
          };
          // frame scale: 2.2 -> 0.94 (swift) -> 1 (out)
          var shrinkAt = function (t) {
            return t < CFG.under ? MT.mix(CFG.big, CFG.low, MT.ramp(t, CFG.shrink0, CFG.under - CFG.shrink0, "swift"))
              : MT.mix(CFG.low, 1, MT.ramp(t, CFG.under, CFG.lock - CFG.under, "out"));
          };

          var tl = MT.scene(CFG.dur, function (t) {
            var f = flyAt(t), f0 = flyAt(t - F / 2), f1 = flyAt(t + F / 2), s = shrinkAt(t);
            var bite = MT.interpolate(t, [CFG.lock, CFG.lock + F, CFG.lock + 5 * F], [0, 1, 0], clamp);
            var hw = (TW / 2 + PAD) * s - CFG.bite * bite, hh = (TH / 2 + PAD) * s - CFG.bite * bite;
            var focus = MT.ramp(t, CFG.lock - 2 * F, 12 * F, "power3.out");
            var glo = MT.interpolate(t, [CFG.lock, CFG.lock + 3 * F, CFG.lock + 10 * F], [0, CFG.glow, CFG.hold], clamp);
            // camera: slow push toward the target (not with backdrop off)
            cam.style.transform = "scale(" + (off ? 1 : MT.mix(1, 1 + CFG.cam, MT.ramp(t, 0, CFG.dur - F, "smooth"))).toFixed(5) + ")";
            // focus dim and lock glow
            dim.style.boxShadow = "0 0 0 3000px color-mix(in srgb, var(--bf-shade) " + (CFG.dim * 100 * focus).toFixed(2) + "%, transparent)";
            var on = t >= CFG.lock;
            glow.style.display = on ? "block" : "none";
            glow.style.boxShadow = "0 0 0 1.5px color-mix(in srgb, var(--k-accent) " + (55 * focus).toFixed(2) + "%, transparent), 0 18px 48px -16px color-mix(in srgb, var(--k-accent) " + (35 * focus).toFixed(2) + "%, transparent)";
            glowFill.style.opacity = glo.toFixed(3);
            // four mirrored L corners; the group flies in blurred along its path
            var cs = [[CX - hw, CY - hh, 1, 1], [CX + hw, CY - hh, -1, 1], [CX - hw, CY + hh, 1, -1], [CX + hw, CY + hh, -1, -1]];
            ks.forEach(function (k, i) {
              k.style.transform = "translate(" + cs[i][0].toFixed(2) + "px," + cs[i][1].toFixed(2) + "px) scale(" + cs[i][2] + "," + cs[i][3] + ")";
            });
            fly.style.transform = "translate(" + f[0].toFixed(2) + "px," + f[1].toFixed(2) + "px)";
            fly.style.opacity = MT.interpolate(t, [CFG.flyIn, CFG.flyIn + 3 * F], [0, 1], clamp).toFixed(3);
            xh.forEach(function (e) { e.style.opacity = (0.8 * (1 - focus)).toFixed(3); });
            blur((f1[0] - f0[0]) / F, (f1[1] - f0[1]) / F);
            // label: scale pop; pill fades over 3 frames, text cuts in at half
            if (showTag) {
              var lp = MT.interpolate(t, [CFG.label0, CFG.labelEnd], [0, 1], { easing: "back.out(1.8)", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
              var ta = MT.clamp((t - CFG.label0) / (3 * F), 0, 1), sc = Math.max(0.001, lp);
              tag.style.setProperty("--a", ta.toFixed(3));
              tagU.forEach(function (u) { u.style.opacity = ta >= 0.5 ? 1 : 0; });
              tag.style.left = Math.min(CX - hw + 2, RIGHT - tagW).toFixed(2) + "px";
              tag.style.top = (above ? CY - hh - 14 : CY + hh + 14).toFixed(2) + "px";
              tag.style.transform = (above ? "translateY(-100%) " : "") + "scale(" + sc.toFixed(4) + ")";
            }
            grain(t);
          });
          window.__timelines["bracket-fly-lock"] = tl;
        })();
      </script>
    </template>
  </body>

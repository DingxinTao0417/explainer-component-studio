<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"s1","type":"string","label":"第一块的图片地址","default":"motion-cards/lib/samples/p1.jpg"},
    {"id":"t1","type":"string","label":"第一块的标题","default":"第一步 · 收集素材"},
    {"id":"s2","type":"string","label":"第二块的图片地址","default":"motion-cards/lib/samples/ui.png"},
    {"id":"t2","type":"string","label":"第二块的标题","default":"第二步 · 排进任务表"},
    {"id":"s3","type":"string","label":"第三块的图片地址","default":"motion-cards/lib/samples/p3.jpg"},
    {"id":"t3","type":"string","label":"第三块的标题","default":"第三步 · 导出检查"},
    {"id":"hold","type":"number","label":"每一块停多久（秒）","default":0.9,"min":0.3,"max":8,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>canvas-tour · 大画布巡游</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="canvas-tour-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .ct { position: absolute; inset: 0; overflow: hidden; }
        .ct-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .ct-dip { position: absolute; inset: 0; will-change: transform; }
        .ct-world { position: absolute; left: 0; top: 0; width: 4400px; height: 3000px; will-change: transform; }
        .ct-floor { position: absolute; left: -1400px; top: -1000px; width: 7200px; height: 5000px; background-image: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0 4px, rgba(255, 255, 255, 0) 5px); background-size: 120px 120px; }
        .ct-wire { position: absolute; left: 0; top: 0; display: block; width: 4400px; height: 3000px; }
        .ct-wire path { fill: none; stroke: var(--k-accent); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 2 26; opacity: 0.8; }
        .ct-block { position: absolute; display: flex; flex-direction: column; padding: 20px 20px 0; border-radius: 26px; background: var(--k-panel); box-shadow: 0 50px 120px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.08); }
        .ct-b1 { left: 340px; top: 300px; width: 1120px; height: 732px; }
        .ct-b2 { left: 2260px; top: 640px; width: 1480px; height: 934px; }
        .ct-b3 { left: 1180px; top: 1840px; width: 1000px; height: 664px; }
        .ct-pic { display: block; width: 100%; flex: 1 1 0; min-height: 0; object-fit: cover; border-radius: 12px; }
        .ct-name { display: block; flex: 0 0 104px; line-height: 100px; font-size: 48px; font-weight: 800; white-space: nowrap; overflow: hidden; }
      </style>

      <div id="root" data-composition-id="canvas-tour" data-width="1920" data-height="1080">
        <div class="ct" data-layout-allow-overflow>
          <div class="ct-bg"></div>
          <div class="ct-dip">
            <div class="ct-world" data-layout-allow-overflow>
              <div class="ct-floor"></div>
              <svg class="ct-wire" viewBox="0 0 4400 3000" xmlns="http://www.w3.org/2000/svg">
                <path d="M 1500 640 C 1900 560 2020 900 2220 1000" />
                <path d="M 2600 1640 C 2540 1900 2420 2100 2220 2180" />
              </svg>
              <div class="ct-block ct-b1"><img class="ct-pic" src="motion-cards/lib/samples/p1.jpg" data-var-src="s1" alt="" /><span class="ct-name">第一步 · 收集素材</span></div>
              <div class="ct-block ct-b2"><img class="ct-pic" src="motion-cards/lib/samples/ui.png" data-var-src="s2" alt="" /><span class="ct-name">第二步 · 排进任务表</span></div>
              <div class="ct-block ct-b3"><img class="ct-pic" src="motion-cards/lib/samples/p3.jpg" data-var-src="s3" alt="" /><span class="ct-name">第三步 · 导出检查</span></div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            // one stop per block: canvas centre of the block and the zoom that makes it fill about 70% of the frame
            stops: [{ cx: 900, cy: 666, z: 1.18 }, { cx: 3000, cy: 1107, z: 0.9 }, { cx: 1680, cy: 2172, z: 1.3 }],
            move: 1, moveEase: "power3.inOut", dip: 0.86, creep: 0.025
          };
          var v = { hold: 0.9, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".ct");
          var q = function (s) { return root.querySelector(s); };
          [1, 2, 3].forEach(function (n) {
            var b = q(".ct-b" + n);
            if (v["s" + n]) b.querySelector(".ct-pic").setAttribute("src", String(v["s" + n]));
            if (v["t" + n]) b.querySelector(".ct-name").textContent = String(v["t" + n]);
          });
          if (String(v.backdrop) === "off") { q(".ct-bg").style.display = "none"; q(".ct-floor").style.display = "none"; }
          var hold = parseFloat(v.hold);
          if (!isFinite(hold)) hold = 0.9;
          hold = Math.max(0.2, hold);
          // camera looking at stop s with an extra zoom factor k: the stop's canvas point goes to frame centre
          var cam = function (s, k) { var z = s.z * k; return { scale: z, x: 960 - z * s.cx, y: 540 - z * s.cy }; };
          var world = q(".ct-world"), dip = q(".ct-dip");

          var tl = gsap.timeline({ paused: true });
          tl.set(world, { transformOrigin: "0 0" }, 0);
          tl.set(dip, { transformOrigin: "50% 50%" }, 0);
          var t = 0;
          CFG.stops.forEach(function (s, i) {
            var a = cam(s, 1), b = cam(s, 1 + CFG.creep);
            if (i === 0) tl.fromTo(world, { scale: a.scale, x: a.x, y: a.y }, { scale: b.scale, x: b.x, y: b.y, duration: hold, ease: "none" }, 0);
            else {
              // travel: position and zoom ride one ease, and the whole view pulls back a little at mid-flight
              tl.to(world, { scale: a.scale, x: a.x, y: a.y, duration: CFG.move, ease: CFG.moveEase }, t);
              tl.fromTo(dip, { scale: 1 }, { scale: CFG.dip, duration: CFG.move / 2, ease: "sine.inOut" }, t);
              tl.to(dip, { scale: 1, duration: CFG.move / 2, ease: "sine.inOut" }, t + CFG.move / 2);
              t += CFG.move;
              // parked: keep creeping in so the stop is a slow shot, not a still
              tl.to(world, { scale: b.scale, x: b.x, y: b.y, duration: hold, ease: "none" }, t);
            }
            t += hold;
          });
          window.__timelines["canvas-tour"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

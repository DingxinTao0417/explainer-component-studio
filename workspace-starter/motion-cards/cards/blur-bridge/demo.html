<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},
    {"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},
    {"id":"soft","type":"number","label":"最虚时的模糊（px）","default":30,"min":12,"max":60,"step":2},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>blur-bridge · 模糊过桥</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="blur-bridge-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .bb { position: absolute; inset: 0; overflow: hidden; }
        .bb-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .bb-from, .bb-to { position: absolute; left: 0; top: 0; display: block; width: 1920px; height: 1080px; object-fit: cover; }
      </style>

      <div id="root" data-composition-id="blur-bridge" data-width="1920" data-height="1080">
        <div class="bb" data-layout-allow-overflow>
          <div class="bb-bg"></div>
          <img class="bb-from" src="motion-cards/lib/samples/p1.jpg" data-var-src="from" alt="" />
          <img class="bb-to" src="motion-cards/lib/samples/p2.jpg" data-var-src="to" alt="" />
        </div>
      </div>

      <script>
        (function () {
          var CFG = { cut: 1.0, out: 0.3, back: 0.4, swell: 1.12, mix: 0.1 };
          var v = { "from": "motion-cards/lib/samples/p1.jpg", "to": "motion-cards/lib/samples/p2.jpg", "soft": 30, "backdrop": "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".bb");
          var q = function (s) { return root.querySelector(s); };
          var num = function (x, d) { x = parseFloat(x); return isFinite(x) ? x : d; };
          var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
          var W = 1920, H = 1080, F = 1 / 30, cut = CFG.cut;
          if (String(v.backdrop) === "off") q(".bb-bg").style.display = "none";
          var tl = gsap.timeline({ paused: true });
          var a = q(".bb-from"), b = q(".bb-to"), soft = clamp(num(v.soft, 30), 4, 80), fog = "blur(" + soft + "px)";
          a.setAttribute("src", String(v.from)); b.setAttribute("src", String(v.to));
          // 1 · the old shot goes out of focus, slowly at first; it swells a little so the soft edges stay outside the frame
          tl.fromTo(a, { filter: "blur(0px)", scale: 1 }, { filter: fog, scale: CFG.swell, duration: CFG.out, ease: "power2.in" }, cut - CFG.out);
          // 2 · at the softest point the new shot is mixed in over three frames; both are equally soft, so no edge can jump
          tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: CFG.mix, ease: "none" }, cut - CFG.mix / 2);
          // 3 · the new shot pulls focus
          tl.fromTo(b, { filter: fog, scale: CFG.swell }, { filter: "blur(0px)", scale: 1, duration: CFG.back, ease: "power2.out" }, cut);
          window.__timelines["blur-bridge"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"title","type":"string","label":"标题（建议 4–8 个字）","default":"三步写好提示词"},
    {"id":"sub","type":"string","label":"底板下的一行说明（可空）","default":"照着做，十分钟上手"},
    {"id":"side","type":"enum","label":"底板从哪边砸进来","default":"left","options":[{"value":"left","label":"左"},{"value":"right","label":"右"}]},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>slab-title-slam · 厚底标题砸入</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="slab-title-slam-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #ffffff);
          --k-panel: var(--mc-panel, #f4f5f7);
          --k-ink: var(--mc-ink, #15171c);
          --k-muted: var(--mc-muted, #6b7280);
          --k-accent: var(--mc-accent, #e8590c);
          --k-accent-2: var(--mc-accent-2, #2563eb);
          --k-on-accent: var(--mc-on-accent, #ffffff);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .sts { position: absolute; inset: 0; }
        .sts-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .sts-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sts-unit { position: relative; display: block; min-width: 1180px; }
        .sts-slab { position: absolute; inset: 0; display: block; border-radius: 10px; background: var(--k-accent); box-shadow: 0 26px 0 color-mix(in srgb, var(--k-accent) 52%, #000); }
        .sts-title { position: relative; display: block; height: 300px; padding: 0 96px; line-height: 290px; font-size: 156px; font-weight: 900; letter-spacing: 0.02em; text-align: center; white-space: nowrap; color: var(--k-on-accent); }
        .sts-sub { display: block; margin-top: 78px; font-size: 52px; font-weight: 600; letter-spacing: 0.06em; white-space: nowrap; color: var(--k-muted); }
      </style>

      <div id="root" data-composition-id="slab-title-slam" data-width="1920" data-height="1080">
        <div class="sts">
          <div class="sts-bg"></div>
          <div class="sts-stage">
            <div class="sts-unit">
              <span class="sts-slab"></span>
              <span class="sts-title">三步写好提示词</span>
            </div>
            <span class="sts-sub">照着做，十分钟上手</span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { at: 0.3, travel: 0.2, dist: 2100, lean: 15, over: 34, recoil: 0.42, titlePop: 1.1, subGap: 0.26 };
          var v = { title: "三步写好提示词", sub: "照着做，十分钟上手", side: "left", backdrop: "on" };
          try {
                      var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
                      for (var k in got) if (got[k] !== undefined && got[k] !== null && got[k] !== "") v[k] = got[k];
                    } catch (e) {}
          var root = document.querySelector(".sts");
          var q = function (s) { return root.querySelector(s); };
          q(".sts-title").textContent = String(v.title);
          var sub = q(".sts-sub");
          if (got && got.sub === "") { sub.style.display = "none"; } else { sub.textContent = String(v.sub); }
          if (String(v.backdrop) === "off") q(".sts-bg").style.display = "none";
          var dir = String(v.side) === "right" ? -1 : 1;
          var slab = q(".sts-slab"), unit = q(".sts-unit"), title = q(".sts-title");
          var hit = CFG.at + CFG.travel;

          var tl = gsap.timeline({ paused: true });
          // the slab is still accelerating when it reaches its mark: no ease-out, the stop is a wall
          tl.fromTo(slab, { x: -dir * CFG.dist, skewX: dir * CFG.lean }, { x: 0, skewX: dir * CFG.lean, duration: CFG.travel, ease: "power1.in" }, CFG.at);
          // inertia: the top edge keeps going for a moment, then the whole block springs back
          tl.to(slab, { skewX: -dir * CFG.lean * 0.45, duration: 0.05, ease: "power2.out" }, hit);
          tl.to(slab, { skewX: 0, duration: CFG.recoil, ease: "elastic.out(1, 0.42)" }, hit + 0.05);
          tl.fromTo(unit, { x: 0 }, { x: dir * CFG.over, duration: 0.05, ease: "power2.out" }, hit);
          tl.to(unit, { x: 0, duration: CFG.recoil, ease: "elastic.out(1, 0.5)" }, hit + 0.05);
          // the title does not ride in on the slab: it exists only from the frame the slab stops
          tl.fromTo(title, { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, hit);
          tl.fromTo(title, { scale: CFG.titlePop }, { scale: 1, duration: 0.2, ease: "power3.out" }, hit);
          tl.fromTo(sub, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, hit + CFG.subGap);
          window.__timelines["slab-title-slam"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

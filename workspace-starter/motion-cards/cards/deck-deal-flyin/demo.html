  var sh = q(".dkf-sh"), view = q(".dkf-view"), pg = q(".dkf-pg"), lamp = q(".dkf-key"), dim = q(".dkf-dim"), fog = q(".dkf-fog");
  if (String(v.backdrop) === "off") [".dkf-bg", ".dkf-tab", ".dkf-key", ".dkf-vig"].forEach(function (s) { q(s).style.display = "none"; });

  // monotone cubic Hermite through the keys, one curve per camera parameter: the speed is continuous at every key
  function herm(xs, ys) {
    var n = xs.length, d = [], m = [], i;
    for (i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
    for (i = 0; i < n; i++) m.push(!i ? d[0] : i === n - 1 ? 0 : d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
    for (i = 0; i < n - 1; i++) {
      if (!d[i]) { m[i] = m[i + 1] = 0; continue; }
      var a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
      if (h > 9) { h = 3 / Math.sqrt(h); m[i] = h * a * d[i]; m[i + 1] = h * b * d[i]; }
    }
    return function (x) {
      if (x <= xs[0]) return ys[0];
      if (x >= xs[n - 1]) return ys[n - 1];
      for (var j = 0; j < n - 2 && x > xs[j + 1]; j++);
      var w = xs[j + 1] - xs[j], s = (x - xs[j]) / w, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * ys[j] + (s3 - 2 * s2 + s) * w * m[j] + (-2 * s3 + 3 * s2) * ys[j + 1] + (s3 - s2) * w * m[j + 1];
    };
  }
  var CAM = L.cam[0].map(function (x, p) { return herm(CFG.camT, L.cam.map(function (a) { return a[p]; })); });

  // 26 cards in reading order (row 1 has two, the rest three); the pile sits on the table right of the board
  var N = 26, PX = 1288, PY = 250, CW = 357.33, PCX = PX + CW / 2, PCY = PY + 156;
  var R = function (x, y, w, h, c) { return '<rect x="' + x + '" y="' + y + '" width="' + w.toFixed(0) + '" height="' + h + '" rx="' + h / 2 + '" style="fill:' + c + '"/>'; };
  var INK = function (p) { return "color-mix(in srgb,var(--k-ink) " + p + "%,var(--dkf-card))"; };
  // a project card without text: title, tag, two lines, three label/value rows, three counts, two chips
  function face(f, h) {
    var a = function (n) { return kHash(f * 7 + n); }, o = R(22, 24, 150 + a(1) * 100, 18, INK(80)) + R(272, 25, 62, 14, "var(--k-accent)") + R(22, 60, 296, 10, INK(20)) + R(22, 78, 140 + a(2) * 130, 10, INK(20));
    for (var r = 0; r < 3; r++) o += R(22, 112 + r * 24, 42, 10, INK(26)) + R(78, 112 + r * 24, 50 + a(3 + r) * 80, 10, INK(62));
    for (r = 0; r < 3; r++) o += R(22 + r * 104, h - 106, 52, 10, INK(26)) + R(80 + r * 104, h - 107, 12, 12, INK(70));
    o += R(22, h - 56, 88, 30, INK(9)) + R(36, h - 46, 60, 10, f % 3 ? INK(40) : "var(--k-accent-2)") + R(120, h - 56, 40, 30, INK(9));
    return '<svg width="100%" height="100%" viewBox="0 0 357 ' + h + '" aria-hidden="true">' + o + "</svg>";
  }
  var imgs = String(v.srcs).split("|").map(function (s) { return s.trim(); }).filter(Boolean);
  // the slots are the static grid (.dkf-cs): columns 373.33px apart, rows 288 / 312px tall with 81px between them
  var els = q(".dkf-cs").children, cards = [];
  for (var k = 0; k < N; k++) {
    var row = k < 2 ? 0 : 1 + Math.floor((k - 2) / 3), x = 56 + 373.33 * (k < 2 ? k : (k - 2) % 3), h = row ? 312 : 288, y = row ? 223 + 393 * row : 247;
    var el = els[k], img = imgs.length ? "background-image:url('" + imgs[k % imgs.length].replace(/'/g, "%27") + "')" : "";
    // upstream's 10 card faces, then the 16 extras reuse them (face (i * 3 + 2) % 10)
    el.innerHTML = '<i class="dkf-g" style="' + img + '"></i><div class="dkf-f" style="' + img + '">' + (img ? "" : face(k < 10 ? k : ((k - 10) * 3 + 2) % 10, h)) + "<i></i></div>";
    cards.push({ g: el.firstChild, f: el.lastChild, s: el.lastChild.lastChild, cue: CFG.deal + CFG.step * k - CFG.squeeze * k * (k - 1),
      // offset from the grid slot to the card's place in the pile (deterministic jitter), its tilt and height there
      px: PX + ((k * 7) % 9 - 4) * 2 - x, py: PY + ((k * 5) % 7 - 3) * 2 - y, pr: (k * 11) % 7 - 3, pz: (N - k) * CFG.layer,
      d: Math.hypot(x + CW / 2 - PCX, y + h / 2 - PCY) });
  }

  // text: both title lines rise phrase by phrase; the counter follows the landed cards
  var tEl = q(".dkf-title"), sEl = q(".dkf-sub"), cnt = q(".dkf-cnt"), nEl = q(".dkf-n"), uEl = q(".dkf-unit");
  var tU = kSplit(tEl, "word", true, v.title), subOn = String(v.sub).trim() !== "", sU = subOn ? kSplit(sEl, "word", true, v.sub) : [];
  kFit(tEl, { lines: L.lines, min: 72 });
  if (subOn) kFit(sEl, { lines: L.lines, min: 72 }); else sEl.style.display = "none";
  var total = Math.max(0, Math.min(9999, Math.round(+v.total || 0))), digits = Math.max(2, String(total).length);
  nEl.textContent = ("000" + total).slice(-digits);
  uEl.textContent = String(v.unit).trim();
  if (!uEl.textContent || !total) cnt.style.display = "none"; else kFit(uEl);

  var DIVE = MT.bezier(0.3, 0, 0.2, 1), SETTLE = MT.bezier(0.3, 0, 0.25, 1.15), LIT = MT.bezier(0.5, 0, 0.6, 1);
  var DA = dark ? 0.88 : 0.2, SA = dark ? 1 : 0.6, FA = dark ? 1 : 0.45; // per tone: board shade, shadow and far-shade strength
  var shade = function (a) { return "color-mix(in srgb,var(--dkf-shade) " + (Math.min(1, a * SA) * 100).toFixed(1) + "%,transparent)"; };
  var PILE = "0 1px 2px " + shade(0.35), BOTTOM = "0 1px 3px " + shade(0.4) + ",0 26px 60px " + shade(0.75);

  function render(t) {
    var c = CAM.map(function (f) { return f(t); }), z = c[2] * U;
    pg.style.zoom = z.toFixed(4);
    pg.style.transformOrigin = c[0].toFixed(1) + "px " + c[1].toFixed(1) + "px";
    pg.style.transform = "translate(" + (FW / 2 / z - c[0]).toFixed(2) + "px," + (FH / 2 / z - c[1]).toFixed(2) + "px) rotateY(" + c[4].toFixed(3) + "deg) rotateX(" + c[3].toFixed(3) + "deg) rotateZ(" + c[5].toFixed(3) + "deg)";
    view.style.perspective = (c[6] * z).toFixed(1) + "px";
    sh.style.transform = "translate(" + (c[7] * U).toFixed(1) + "px," + (c[8] * U).toFixed(1) + "px)";
    // light: the key light on the pile widens over the board; the board's shade opens from the pile outwards
    var lu = MT.ramp(t, CFG.lit, CFG.litLen, LIT), hole = 4200 * lu, fe = 600 + 1000 * lu, dc = "color-mix(in srgb,var(--dkf-dim) " + DA * 100 + "%,transparent)";
    // + a veil of the table colour over the brushed tile as the camera pulls out (the tile turns to moire below zoom 0.8)
    lamp.style.background = "radial-gradient(" + (1100 + 1400 * lu).toFixed(0) + "px " + (800 + 1600 * lu).toFixed(0) + "px at " + (PCX + 1992 - 600 * lu).toFixed(0) + "px " + (PCY + 1709 + 900 * lu).toFixed(0) +
      "px, color-mix(in srgb,white " + (20 - 8 * lu).toFixed(1) + "%,transparent), color-mix(in srgb,white 5%,transparent) 45%, transparent 70%), radial-gradient(ellipse 50% 50%, color-mix(in srgb,var(--dkf-t0) " + (CFG.veil * MT.clamp((0.8 - c[2]) / 0.3)).toFixed(1) + "%,transparent) 40%, transparent)";
    dim.style.background = lu >= 1 ? "none" : lu <= 0 ? dc : "radial-gradient(circle at " + PCX + "px " + PCY + "px, transparent " + hole.toFixed(0) + "px, " + dc + " " + (hole + fe).toFixed(0) + "px)";
    var fo = MT.ramp(t, CFG.fog, CFG.fogLen, "smooth") * FA;
    fog.style.background = fo ? "linear-gradient(180deg, color-mix(in srgb,var(--dkf-dim) " + (62 * fo).toFixed(1) + "%,transparent), color-mix(in srgb,var(--dkf-dim) " + (30 * fo).toFixed(1) + "%,transparent) 35%, transparent 70%)" : "none";
    var ant = MT.ramp(t, CFG.ant, CFG.antLen, "power1.out"), landed = 0;
    cards.forEach(function (cd, k) {
      var d = t - cd.cue, dv = DIVE(MT.clamp(d / CFG.dive)), st = SETTLE(MT.clamp((d - CFG.dive) / CFG.settle)), s = Math.sin(dv * Math.PI), tr, bs, go = 0;
      var dk = lu < 1 ? MT.clamp((cd.d - hole) / fe) * DA : 0; // a card in the still-unlit part of the board is shaded with it
      if (d >= CFG.dive) landed++;
      if (d < 0) {
        // in the pile: pressed down during the anticipation, the top card nudged out by the dealer's thumb
        tr = "translate3d(" + (cd.px - (k ? 0 : CFG.topPull * ant)).toFixed(2) + "px," + (cd.py + (t < CFG.release ? CFG.pileDown * ant : 0)).toFixed(2) + "px," + cd.pz + "px) rotateZ(" + cd.pr + "deg)";
        bs = k === N - 1 ? BOTTOM : PILE;
        dk = (0.08 * (1 - lu) * DA) / 0.88;
      } else if (d < CFG.dive + CFG.settle) {
        // dive along an arc (+110px at the top, 1.06x), then settle onto the board with a small overshoot and a press
        var zz = (MT.mix(cd.pz, CFG.hover, dv) + s * CFG.arc) * (1 - st), sc = (1 + s * CFG.peak) * MT.interpolate(d, [CFG.press, CFG.press + 0.033, CFG.press + 0.067], [1, 0.996, 1], { extrapolate: "clamp" });
        var rz = "px," + zz.toFixed(2) + "px) rotateZ(" + (cd.pr * (1 - dv)).toFixed(3) + "deg) scale(" + sc.toFixed(4) + ")";
        tr = "translate3d(" + (cd.px * (1 - dv)).toFixed(2) + "px," + (cd.py * (1 - dv)).toFixed(2) + rz;
        bs = "0 " + (36 - 24 * st).toFixed(1) + "px " + (70 - 50 * st).toFixed(1) + "px " + shade(0.45 - 0.25 * st);
        if (dv > 0.02 && dv < 0.98) {
          // ghost: a blurred copy 6% of the path back towards the pile, fading as the dive ends
          go = 0.28 * (1 - dv);
          cd.g.style.transform = "translate3d(" + (cd.px * (1.06 - dv)).toFixed(2) + "px," + (cd.py * (1.06 - dv)).toFixed(2) + rz;
        }
        dk = dv > 0.6 ? dk * Math.min(1, (dv - 0.6) / 0.4) : 0;
      } else {
        // landed: flat on the board; the contact shadow tightens 3f behind the card
        var lg = 1 - MT.ramp(d, CFG.dive, 0.233, "out");
        tr = "none";
        bs = "0 " + (2 + 14 * lg).toFixed(1) + "px " + (6 + 30 * lg).toFixed(1) + "px " + shade(0.1 + 0.12 * lg);
      }
      cd.f.style.transform = tr;
      cd.f.style.boxShadow = bs + ",0 0 0 1px var(--dkf-line)";
      cd.g.style.opacity = go.toFixed(3);
      cd.s.style.background = dk > 0.005 ? "color-mix(in srgb,var(--dkf-dim) " + (dk * 100).toFixed(1) + "%,transparent)" : "none";
    });
    nEl.textContent = ("000" + Math.round((total * landed) / N)).slice(-digits);
    cnt.style.opacity = MT.ramp(t, CFG.stat, CFG.statLen, "out").toFixed(3);
  }

  var tl = MT.scene(CFG.dur, render);
  kReveal(tl, tU, "rise", CFG.title, { each: CFG.word, gap: CFG.gap });
  kReveal(tl, sU, "rise", CFG.sub, { each: CFG.word, gap: CFG.gap });
  window.__timelines["deck-deal-flyin"] = tl;
})();
</script>
    </template>
  </body>
</html>

            });
            layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
            layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
            layer.style.backgroundSize = size + "px " + size + "px";
            return function (t) {
              var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
              layer.style.backgroundImage = tiles[k % 6];
              layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
            };
          }
          // ==== end kit:grain ====

          kTone(root);
          var bare = String(v.backdrop) === "off";
          if (bare) root.setAttribute("data-bare", "");
          var S = function (x) { return String(x == null ? "" : x).trim(); };

          // a slot: hidden when empty, else split into lines at "|" (line units keep every typed space; nothing here
          // animates word by word) and shrunk to fit its box, one line per part
          function slot(el, text, o) {
            if (!S(text)) { el.style.display = "none"; return; }
            o.lines = Math.max(o.lines || 1, S(text).split("|").filter(function (s) { return s.trim(); }).length);
            kSplit(el, "line", false, S(text));
            return kFit(el, o);
          }
          function page(pg, w, tag, body, img) {
            if (S(img)) {
              // a picture page: the type layers go, the picture sits under the vignette and grain
              [].forEach.call(pg.children, function (c) { if (!/bl-(fx)/.test(c.className)) c.style.display = "none"; });
              var im = document.createElement("img");
              im.className = "bl-img"; im.alt = ""; im.setAttribute("src", S(img));
              pg.insertBefore(im, pg.firstChild);
              return;
            }
            var mast = q(".bl-mast", pg), half = (mast.clientWidth - 24) / 2;
            slot(q(".bl-name > span", pg), v.name, { lines: 1, min: 28, width: half - 64 });
            slot(q(".bl-issue", pg), v.issue, { lines: 1, min: 28, width: half });
            if (!S(v.name)) q(".bl-name", pg).style.display = "none";
            slot(q(".bl-tag", pg), tag, { lines: 1, min: 40 });
            slot(q(".bl-body", pg), body, { min: L.bodyMin });
            // the giant word keeps clear of the page number (landscape) and of the 10% margins (portrait)
            var wt = q(".bl-wt", pg), pn = q(".bl-pn", pg), wd = q(".bl-word", pg);
            if (!S(w)) { wd.style.display = "none"; return; }
            var room = (P ? FW * 0.78 : FW - wd.offsetLeft - pn.offsetWidth - FW * 0.05 - 60) - L.word * 0.22;
            wt.style.maxWidth = room + "px"; // a word past the minimum size wraps inside the margins
            var f = slot(wt, w, { min: L.wordMin, width: room, spare: 0.02 });
            q(".bl-dot", pg).style.fontSize = f.size + "px";
            // a word that wrapped drops the dot (it would sit outside the margin beside the block)
            if (f.lines > 1) q(".bl-dot", pg).style.display = "none";
          }
          // page A is built from page B's markup (the static frame is page B)
          var PB = q(".bl-pb"), PA = PB.cloneNode(true);
          PA.className = "bl-page bl-pa";
          q(".bl-paper", PA).className = "bl-paper bl-backdrop";
          q(".bl-pn", PA).textContent = "01 / 02";
          PB.parentNode.insertBefore(PA, PB);
          page(PA, v.old_word, v.old_tag, v.old_body, v.from);
          page(PB, v.new_word, v.new_tag, v.new_body, v.to);

          // 12 leaves, frame-width / 12 each (= the 12 hairline columns); each face holds a full copy of its page
          var leaves = q(".bl-leaves"), L3 = [], i;
          leaves.style.perspective = (FW * 0.99).toFixed(0) + "px";
          var face = function (pg, x, back) {
            var f = document.createElement("div"), c = pg.cloneNode(true);
            f.className = "bl-face" + (back ? " bl-back" : "");
            c.style.opacity = 1;
            c.style.width = FW + "px";
            c.style.left = -x + "px";
            // copies overlap, get shaded and sit off-centre by design: exempt their text (the flat pages are checked)
            [].forEach.call(c.querySelectorAll("*"), function (e) { e.setAttribute("data-layout-allow-overlap", ""); e.setAttribute("data-layout-allow-occlusion", ""); e.setAttribute("data-layout-allow-caption-zone", ""); });
            f.appendChild(c);
            f.insertAdjacentHTML("beforeend", '<div class="bl-sh"></div><div class="bl-sp"></div><div class="bl-ed"></div>');
            return f;
          };
          for (i = 0; i < CFG.n; i++) {
            var x0 = Math.round((i * FW) / CFG.n), x1 = Math.round(((i + 1) * FW) / CFG.n), lf = document.createElement("div");
            lf.className = "bl-leaf";
            lf.style.left = x0 + "px";
            lf.style.width = x1 - x0 + "px";
            var fa = face(PA, x0, false), fb = face(PB, x0, true);
            lf.appendChild(fa); lf.appendChild(fb);
            leaves.appendChild(lf);
            L3.push({ el: lf, f: fa.children, b: fb.children, s: CFG.wave + CFG.span * Math.pow(i / (CFG.n - 1), CFG.pow) });
          }
          var ang = function (t, s) { return t < s ? 0 : 180 * MT.spring({ t: t, delay: s, damping: CFG.damping, stiffness: CFG.stiffness }); };
          // unmask: the first frame from which the last leaf stays within 0.3 deg of 180 for 4 frames (2.667 s)
          var UNMASK = 80 / 30, last = L3[CFG.n - 1].s;
          for (var fr = Math.ceil(last * 30); fr < 200; fr++) {
            var ok = true;
            for (var kk = 0; kk < 4; kk++) if (Math.abs(ang((fr + kk) / 30, last) - 180) > 0.3) ok = false;
            if (ok) { UNMASK = fr / 30; break; }
          }

          var cam = q(".bl-cam"), groove = q(".bl-groove"), rule = q(".bl-rule", PB), D = Math.PI / 180;
          // vignette and grain sit under each page's text (on top they would hide it from the checker); the leaf copies
          // carry the vignette slice by slice, so the frame does not change when the flat page gives way to the leaves
          var go = { opacity: root.getAttribute("data-tone") === "dark" ? 0.09 : 0.06 }, gA = kGrain(q(".bl-grain", PA), go), gB = kGrain(q(".bl-grain", PB), go);
          // one face's light: shade 0.5 sin(th) away from the key light, a sheen near 35 deg, the lit edge line
          function lit(kids, th, on) {
            var r = th * D, sp = 0.22 * Math.max(0, Math.cos((th - 35) * (Math.PI / 70))) * Math.sin(Math.min(Math.PI, 2 * r));
            kids[1].style.opacity = on ? (0.5 * Math.sin(r)).toFixed(3) : 0;
            kids[2].style.opacity = on && sp > 0.005 ? sp.toFixed(3) : 0;
            kids[3].style.opacity = on ? (0.7 * Math.sin(r)).toFixed(3) : 0;
          }
          function render(t) {
            var c = 1 + CFG.push * MT.ramp(t, 0, CFG.wave, "smooth") + CFG.push2 * MT.ramp(t, CFG.wave, 26 / 30, "smooth") * (1 - MT.ramp(t, CFG.settle, CFG.settleDur, "smooth"));
            cam.style.transform = "scale(" + c.toFixed(5) + ")";
            var wave = t >= CFG.wave && t < UNMASK;
            PA.style.opacity = t < CFG.wave ? 1 : 0;
            PB.style.opacity = t >= UNMASK ? 1 : 0;
            leaves.style.opacity = groove.style.opacity = wave ? 1 : 0;
            if (rule) rule.style.transform = "scaleX(" + (t < UNMASK ? 1 : MT.ramp(t, UNMASK + CFG.rule, CFG.ruleDur, "snappy")).toFixed(4) + ")";
            if (wave) {
              for (var j = 0; j < CFG.n; j++) {
                var th = ang(t, L3[j].s), front = th < 90;
                L3[j].el.style.transform = "rotateY(" + (-th).toFixed(3) + "deg)";
                lit(L3[j].f, th, front && th > 0.05);
                lit(L3[j].b, Math.min(90, Math.abs(180 - th)), !front && Math.abs(180 - th) > 0.05);
              }
            }
            gA(t); gB(t);
          }

          var tl = MT.scene(CFG.slot, render);
          window.__timelines["blinds-slice"] = tl;
        })();
      </script>
    </template>
  </body>

          if (!list.length) list = ["关键词"];
          list.forEach(function (w, i) {
            var a = i * 2.39996 + kHash(i * 7 + 1) * 0.8, r = (330 + kHash(i * 13 + 2) * 660) * U, s = i % 22;
            var acc = ACC.indexOf(s) >= 0, ser = SER.indexOf(s) >= 0, cjk = kCJK.test(w);
            var el = document.createElement("div");
            el.className = "fw-w " + (acc ? "fw-ca" : "fw-c" + Math.floor(kHash(i + 5) * 3)) + (ser ? " fw-s" : "");
            el.textContent = w;
            // background texture: crosses the title, leaves the frame and the portrait caption zone by design
            el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", ""); el.setAttribute("data-layout-allow-caption-zone", "");
            el.style.fontSize = ((64 + kHash(i + 3) * 56) * (cjk ? L.fs : 1) * U).toFixed(1) + "px";
            el.style.letterSpacing = cjk ? "0" : ser ? "-0.01em" : "-0.03em";
            if (ser && !cjk) el.style.fontStyle = "italic";
            field.appendChild(el);
            words.push({ el: el, x: Math.cos(a) * r * L.kx, y: Math.sin(a) * r * L.ky, rz: (kHash(i + 21) - 0.5) * 12, ph: i / list.length, acc: acc });
          });
          var glow = q(".fw-glow"), N = list.length;
          var gs = dark ? [0.55, 0.3] : [0.28, 0.15]; // accent-word glow: full on dark skins, half on light ones
          var glowStr = "0 0 " + (18 * U).toFixed(1) + "px color-mix(in srgb, var(--k-accent) " + gs[0] * 100 + "%, transparent), 0 0 " + (48 * U).toFixed(1) + "px color-mix(in srgb, var(--k-accent) " + gs[1] * 100 + "%, transparent)";

          var curve = function (u) {
            for (var k = 0; k < 4; k++) if (u <= OT[k + 1]) return OP[k] + ((OP[k + 1] - OP[k]) * (u - OT[k])) / (OT[k + 1] - OT[k]);
            return 0;
          };
          // z moves linearly with u; drift 0.5 + 1.35u fans the words out as they come close; roll turns the whole tunnel
          var proj = function (x, y, u, c, sn, drift) {
            var z = CFG.z0 + (CFG.z1 - CFG.z0) * u, d = drift ? 0.5 + u * 1.35 : 1, s = CFG.P / (CFG.P - z);
            return [CX + (x * c - y * sn) * d * s, CY + (x * sn + y * c) * d * s, s];
          };
          var f2 = function (n) { return n.toFixed(2); };

          var tl = MT.scene(CFG.dur, function (t) {
            var p = t / CFG.dur, roll = (2.5 * Math.PI / 180) * Math.sin(p * Math.PI * 2), c = Math.cos(roll), sn = Math.sin(roll);
            var du = CFG.cycles / (CFG.dur * 30), deg = (roll * 180) / Math.PI;
            grain(t);
            glow.style.opacity = f2(0.82 + 0.14 * Math.sin(p * Math.PI * 4)); // breathes twice, in step with the 2 cycles
            rings.forEach(function (g) {
              var u = (p * CFG.cycles + g.ph) % 1, s = proj(0, 0, u, c, sn, false)[2], rx = 1150 * s * U;
              var op = Math.min(1, u / 0.3) * (1 - MT.clamp((u - 0.55) / 0.3, 0, 1));
              g.el.setAttribute("cx", CX); g.el.setAttribute("cy", CY);
              g.el.setAttribute("rx", f2(rx * L.kx)); g.el.setAttribute("ry", f2(rx * L.ky));
              g.el.setAttribute("stroke-opacity", f2(op * 0.16)); g.el.setAttribute("stroke-width", f2((1 + s * 0.8) * U));
              g.el.setAttribute("transform", "rotate(" + f2(deg) + " " + CX + " " + CY + ")");
            });
            dust.forEach(function (d) {
              // a streak from where the mote was 2.6 frames ago to where it is now
              var u = (p * CFG.cycles + d.ph) % 1, a = proj(d.x, d.y, Math.max(0, u - du * 2.6), c, sn, true), b = proj(d.x, d.y, u, c, sn, true);
              d.el.setAttribute("x1", f2(a[0])); d.el.setAttribute("y1", f2(a[1])); d.el.setAttribute("x2", f2(b[0])); d.el.setAttribute("y2", f2(b[1]));
              d.el.setAttribute("stroke-opacity", f2(curve(u) * 0.75)); d.el.setAttribute("stroke-width", f2(d.w * Math.min(2.4, b[2]) * U));
            });
            words.forEach(function (w) {
              var u = (p * CFG.cycles + w.ph) % 1, a = proj(w.x, w.y, u, c, sn, true), b = proj(w.x, w.y, Math.max(0, u - du), c, sn, true);
              var vx = a[0] - b[0], vy = a[1] - b[1], s = a[2], st = w.el.style; // screen speed in px per frame
              // inside the ellipse round the title a word drops to 20%, so it never fights the title
              var k = Math.pow((a[0] - CX) / ex, 2) + Math.pow((a[1] - CY) / ey, 2);
              var op = curve(u) * (fg && k < 1 ? 0.2 + 0.8 * k * k : 1);
              if (op <= 0.005) { st.opacity = 0; return; }
              var blur = (u < CFG.fogEnd ? (1 - u / CFG.fogEnd) * CFG.fog : 0) + (u > CFG.nearAt ? (u - CFG.nearAt) * CFG.near : 0);
              var sh = w.acc ? [glowStr] : [];
              if (Math.hypot(vx, vy) > CFG.trailMin * U) for (var j = 1; j <= 4; j++) {
                var m = ((j / 4) * 0.9) / s; // 4 copies trailing back along the screen speed (upstream 6 over the same length)
                sh.push(f2(-vx * m) + "px " + f2(-vy * m) + "px " + f2(j * 1.2 * U) + "px color-mix(in srgb, currentColor " + Math.round((0.2 - j * 0.039) * 100) + "%, transparent)");
              }
              st.opacity = op.toFixed(3);
              st.transform = "translate(" + f2(a[0]) + "px," + f2(a[1]) + "px) translate(-50%,-50%) scale(" + s.toFixed(4) + ") rotate(" + f2(w.rz + deg) + "deg)";
              st.textShadow = sh.join(",");
              st.filter = blur > 0.05 ? "blur(" + f2((blur * U) / Math.max(0.6, s)) + "px)" : "";
            });
          });
          window.__timelines["flying-words"] = tl;
        })();
      </script>
    </template>

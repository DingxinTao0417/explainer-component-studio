    <template id="trailer-bumper-template">

      <style>

        /* ==== end kit:backdrop ==== */
      </style>

      <div id="root" data-composition-id="trailer-bumper">
        <div class="tb">
          <div class="tb-black"></div>
          <div class="tb-bgl"><div class="tb-backdrop"></div><div class="tb-vig"></div></div>
          <div class="tb-box">

      </div>

                "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +

            if (out.length) out[out.length - 1].sp = false;

          layers[0].innerHTML = tint(gridUI.svg);
          layers[1].innerHTML = tint(listUI.svg);
          var zoomer = q(".tb-zoomer"), card = gridUI.cards[1], Z = L.close;
          zoomer.firstChild.innerHTML = tint(gridUI.svg);
          zoomer.style.zoom = Z;
          zoomer.style.left = (FW / 2 / Z - (card.x + card.w / 2)) + "px";
          zoomer.style.top = (FH / 2 / Z - (card.y + card.h * L.focus)) + "px";
          var grain = kGrain(q(".tb-grain"));
          var shots = q(".tb-shots"), black = q(".tb-black"), bgl = q(".tb-bgl");

          var tl = MT.scene(CFG.total, function (t) {
            var T = t + 1e-6; // frame-exact cut times
            var inShots = T < CFG.black;
            shots.style.display = inShots ? "block" : "none";
            if (inShots) {
              var k = T < CFG.cut2 ? 0 : T < CFG.cut3 ? 1 : 2, start = [0, CFG.cut2, CFG.cut3][k];
              layers.forEach(function (el, i) { el.style.display = i === k ? "block" : "none"; });
              // slow linear push-in inside every cut, so three cuts never read as three stills
              layers[k].style.transform = "scale(" + MT.interpolate(t, [start, start + CFG.push], [1, CFG.pushTo], { extrapolateLeft: "clamp", extrapolateRight: "clamp" }).toFixed(4) + ")";
              grain(t);
            }
            // title: black stays under the backdrop, which lights up from it (with no backdrop the black fades away)
            var up = MT.ramp(t, CFG.title, CFG.lightUp, "out");
            black.style.opacity = off && T >= CFG.title ? 1 - up : 1;
            bgl.style.opacity = up;
            var fade = MT.interpolate(t, [CFG.title, CFG.title + CFG.titleIn], [0, 1], { easing: "power2.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
            var rise = MT.interpolate(t, [CFG.title, CFG.title + CFG.titleIn], [CFG.rise * S, 0], { easing: "power3.out", extrapolateLeft: "clamp", extrapolateRight: "clamp" });
            col.style.transform = "translate(0px," + rise.toFixed(2) + "px)";
            name.style.opacity = fade;
            kick.style.opacity = MT.ramp(t, CFG.title + CFG.kick, CFG.kickDur, "out");
            sub.style.opacity = MT.ramp(t, CFG.title + CFG.sub, CFG.subDur, "out");
            name.style.letterSpacing = MT.mix(track0, track1, MT.ramp(t, CFG.title, CFG.settle - CFG.title, "out")).toFixed(4) + "em";
          });
          window.__timelines["trailer-bumper"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

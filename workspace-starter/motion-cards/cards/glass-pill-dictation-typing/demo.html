                tl.fromTo(u, { opacity: 0, marginRight: "0.5em" }, { opacity: 1, marginRight: "0em", duration: each, ease: ease }, t0);
              }
            });
            return tl;
          }
          // ==== end kit:text ====
          // ==== kit:fit@1 ====
          function kFit(el, o) {
            o = o || {};
            var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
            var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
            for (;;) {
              el.style.fontSize = f + "px";
              m = kLines(el);
              if ((m.w <= W && m.n <= n) || f <= min) break;
              f = Math.max(min, f - 2);
            }
            if (m.w > W) {
              [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
              m = kLines(el);
            }
            return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
          }
          function kLines(el) {
            var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
            while ((t = it.nextNode())) {
              if (!t.data.trim()) continue;
              r.selectNodeContents(t);
              [].forEach.call(r.getClientRects(), function (b) {
                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);
              });
            }
            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {
            if (!el.children.length) return [];
            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {
              if (!row || (tops[i] != null && last != null && Math.abs(tops[i] - last) > fs * 0.5)) { row = el.appendChild(document.createElement("div")); row.className = cls; }
              if (tops[i] != null) last = tops[i];
              row.appendChild(c);
            });
            return [].slice.call(el.children);
          }
          // ==== end kit:fit ====

          var dark = kTone(root) === "dark";
          var off = String(v.backdrop) === "off";
          var grain = null, blobs = [].slice.call(root.querySelectorAll(".gd-blob"));
          // backdrop off keeps the light itself (sun, floor, pill) and drops the stage: base, soft lights, vignette, grain
          if (off) [".gd-bg", ".gd-vig", ".gd-grain"].forEach(function (s) { q(s).style.display = "none"; });
          else grain = kGrain(q(".gd-grain"), { opacity: dark ? 0.09 : 0.05 });

          // the sentence: every char (spaces too) in its own span, laid out in full and shown one by one, so the line
          // breaks never move while typing; it shrinks (not below 40px) to fit one line, then wraps and the pill grows
          var txt = q(".gd-txt"), pill = q(".gd-pill"), floor = q(".gd-floor"), btn = q(".gd-btn"), hint = q(".gd-hint");
          kSplit(txt, "char", false, String(v.text).replace(/[\r\n]+/g, " "));
          var chars = [].slice.call(txt.children);
          kFit(txt, { lines: 1, min: 40, spare: 0.06 });
          var caret = document.createElement("i");
          caret.className = "gd-caret";
          txt.appendChild(caret);
          var ch = caret.offsetHeight, lh = parseFloat(getComputedStyle(txt).lineHeight) || ch * 1.15;
          // caret slot after n typed chars: 4px past the n-th char, or at the start of the line box when none is typed
          var slot = function (c, end) { return { x: (c ? c.offsetLeft + (end ? c.offsetWidth : 0) : 0) + 4, y: c ? c.offsetTop + (c.offsetHeight - ch) / 2 : (lh - ch) / 2 }; };
          var pos = [slot(chars[0], false)].concat(chars.map(function (c) { return slot(c, true); }));
          var kb = btn.offsetWidth / 92;
          var bars = [].slice.call(btn.querySelectorAll(".gd-bar"));
          var cInk = kRGB(root, "var(--k-ink)"), cAcc = kRGB(root, "var(--k-accent)"), cOn = kRGB(root, "var(--k-on-accent)");
          var cNeu = kRGB(root, "color-mix(in srgb, var(--k-ink) 72%, var(--k-bg))");
          var rgb = function (a, b, p) { return "rgb(" + a.map(function (x, i) { return Math.round(x + (b[i] - x) * p); }).join(",") + ")"; };
          if (!String(v.hint).trim()) hint.style.display = "none";
          else { hint.textContent = String(v.hint).replace(/\s+/g, " ").trim(); kFit(hint, { lines: 1, min: 40 }); }

          var tl = MT.scene(CFG.dur, function (t) {
            var f = t * 30; // frames at 30 fps: the bars' breathing and the soft lights' drift keep the upstream per-frame periods
            var appear = MT.ramp(t, 0, CFG.appearDur, "linear");
            var land = MT.ramp(t, 0, CFG.landDur, "snappy");
            var blur = L.blur * (1 - MT.ramp(t, 0, CFG.blurDur, "out"));
            var n = Math.floor(MT.clamp((t - CFG.type0) / CFG.typeDur, 0, 1) * chars.length + 1e-6); // epsilon: the last char must show at the exact end
            var cr = MT.ramp(t, CFG.caretIn, CFG.caretInDur, "linear") * (1 - MT.ramp(t, CFG.caretOut, CFG.caretOutDur, "out"));
            var g = 1 - MT.ramp(t, CFG.light, CFG.lightDur, "smooth");
            root.style.setProperty("--g", g.toFixed(4));
            root.style.setProperty("--gl", (1 - land).toFixed(4));
            pill.style.opacity = appear;
            pill.style.transform = "scale(" + (1.25 - 0.25 * land).toFixed(4) + ")";
            pill.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "";
            floor.style.opacity = appear;
            for (var i = 0; i < chars.length; i++) chars[i].style.opacity = i < n ? 1 : 0;
            caret.style.opacity = cr;
            caret.style.left = pos[n].x + "px";
            caret.style.top = pos[n].y + "px";
            caret.style.background = rgb(cInk, cAcc, 0.8 * g);
            btn.style.borderColor = g > 0.5 ? "color-mix(in srgb, white 50%, transparent)" : "color-mix(in srgb, var(--k-ink) " + (16 + 10 * (1 - g)).toFixed(1) + "%, transparent)";
            bars.forEach(function (b, j) {
              b.style.height = (kb * (BARS[j] + 2.4 * Math.sin(f * 0.5 + j * 1.7))).toFixed(2) + "px";
              b.style.background = rgb(cNeu, cOn, g);
            });
            hint.style.opacity = (MT.ramp(t, CFG.hint, CFG.hintDur, "out") * (0.9 + 0.1 * (0.5 + 0.5 * Math.sin(f / 22)))).toFixed(4);
            blobs.forEach(function (b, j) { b.style.transform = "translateX(" + (Math.sin(f / 40 + j) * 6).toFixed(2) + "px)"; });
            if (grain) grain(t);
          });
          window.__timelines["glass-pill-dictation-typing"] = tl;
        })();
      </script>
    </template>
  </body>

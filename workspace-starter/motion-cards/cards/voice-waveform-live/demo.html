// ==== kit:grain@1 ====
function kGrain(layer, o) {
o = o || {};
var size = o.size || 256, step = o.step || 2, tones = layer.closest("[data-tone]");
var dark = tones && tones.getAttribute("data-tone") === "dark";
var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
var f = "type='linear' slope='2.4' intercept='-0.7'";
var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
"<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
"<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
"<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +
"<rect width='100%' height='100%' filter='url(#g)'/></svg>";
return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
});
layer.style.opacity = o.opacity != null ? o.opacity : dark ? 0.09 : 0.05;
layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
layer.style.backgroundSize = size + "px " + size + "px";
return function (t) {
var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
layer.style.backgroundImage = tiles[k % 6];
layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
};
}
// ==== end kit:grain ====

kTone(root);
var grain = kGrain(q(".vw-grain"));

// the signal: value noise from mulberry32 seeds (upstream formula, so the bars match the reference), a
// trapezoid talk/pause envelope times a syllable layer. Arguments in frames at 30 fps
var m32 = function (a) { var t = (a += 0x6d2b79f5); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
var noise = function (x) { var i = Math.floor(x), fr = x - i, a = m32(i * 7919 + 13), s = fr * fr * (3 - 2 * fr); return a + (m32((i + 1) * 7919 + 13) - a) * s; };
var seg = function (s, a) { return MT.interpolate(s, [a[0], a[0] + CFG.rise, a[1] - CFG.fall, a[1]], [0, 1, 1, 0], { extrapolate: "clamp" }); };
var env = function (fr) { var s = fr / 30; return Math.max(seg(s, CFG.talk[0]), seg(s, CFG.talk[1])) * (0.55 + 0.45 * noise(fr / 4.5 + 200)); };

// bars: index 0 is the oldest sample; --g fades the older ones; centre weight sin^0.8
var wave = q(".vw-wave"), bars = [], CEN = [];
wave.style.background = "none";
for (var i = 0; i < N; i++) {
var b = wave.appendChild(document.createElement("i"));
b.className = "vw-b"; b.style.setProperty("--g", (i / (N - 1)).toFixed(3));
bars.push(b); CEN.push(Math.pow(Math.sin((i / (N - 1)) * Math.PI), 0.8));
}

// transcript: each unit of a stretch gets an onset; a different unit count spreads over the upstream onsets
var txt = q(".vw-txt"), car = q(".vw-car"), W = [], used = 0;
[].forEach.call(txt.querySelectorAll(".vw-l"), function (el, li) {
var s = String(li ? v.line2 : v.line1);
if (!s.trim()) { el.style.display = "none"; return; }
used++;
var units = kSplit(el, "word", 0, s), ons = CFG.words[li], m = ons.length, n = units.length;
units.forEach(function (u, j) {
var x = n > 1 ? (j * (m - 1)) / (n - 1) : 0, a = Math.min(m - 2, Math.floor(x));
W.push({ el: u, at: ons[a] + (ons[a + 1] - ons[a]) * (x - a) });
});
});
if (!kCJK.test(v.line1 + v.line2)) txt.classList.add("vw-lat");
var TW = parseFloat(getComputedStyle(txt).maxWidth);
kFit(txt, { width: TW, lines: Math.max(1, used) * L.per, min: 72 });
var FS = parseFloat(getComputedStyle(txt).fontSize), H = txt.offsetHeight, TY = L.yb - H / 2;
var bub = q(".vw-bub"), cs = getComputedStyle(bub), PY = parseFloat(cs.getPropertyValue("--py")), BR = parseFloat(cs.getPropertyValue("--br"));
q(".vw-tx").style.top = q(".vw-hw").style.top = TY + "px";
if (!used) q(".vw-tx").style.display = "none";
// the caret sits after the newest word: measured once, the words never reflow (only transforms move them)
W.forEach(function (w) { var u = w.el; w.cx = u.offsetLeft + u.offsetWidth + 0.06 * FS; w.cy = u.offsetTop + (u.offsetHeight - 0.8 * FS) / 2 + 0.04 * FS; });

var hint = q(".vw-hint"), lab = q(".vw-lab"), sentEl = q(".vw-sent"), tm = q(".vw-tm"), tm2 = q(".vw-tm2");
hint.textContent = v.hint;
if (!kCJK.test(v.hint)) hint.classList.add("vw-lat");
kFit(hint, { width: TW, lines: L.per, min: 72 });
if (!String(v.hint).trim()) hint.style.display = "none";
q(".vw-lt").textContent = v.label;
kFit(q(".vw-lt"), { width: parseFloat(getComputedStyle(q(".vw-lt")).maxWidth) });
if (!String(v.label).trim()) lab.style.display = "none";
q(".vw-st").textContent = v.sent;
if (!String(v.sent).trim()) sentEl.style.display = "none";
sentEl.style.top = TY - L.lift + (H / 2 + PY) * 0.72 + L.gap + "px";
kFit(sentEl);

// the bubble text flips to --k-on-accent once the filling bubble gives it 3:1 (or beats the ink), so no frame
// has grey on orange; light skin flips at about 90% fill, the dark skin near 40%
var lum = function (c) { return c.reduce(function (s, x, j) { x /= 255; return s + [0.2126, 0.7152, 0.0722][j] * (x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)); }, 0); };
var con = function (a, b) { a = lum(a); b = lum(b); return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); };
var BG = kRGB(root, "var(--k-bg)"), AC = kRGB(root, "var(--k-accent)"), INK = kRGB(root, "var(--k-ink)"), ON = kRGB(root, "var(--k-on-accent)"), FLIP = 1;
for (var a = 0; a <= 1; a += 0.05) {
var mixd = BG.map(function (x, j) { return x + (AC[j] - x) * a; });
if (con(ON, mixd) >= Math.min(3, con(INK, mixd))) { FLIP = a; break; }
}

var tb = q(".vw-tb"), cap = q(".vw-cap"), glow = q(".vw-glow"), dot = q(".vw-dot"), rings = root.querySelectorAll(".vw-ring");
var gray = q(".vw-gray"), md = q(".vw-md"), btn = q(".vw-btn"), up = q(".vw-up"), ck = q(".vw-ck");
var R = MT.ramp, mix = MT.mix, last = "";

var tl = MT.scene(CFG.slot, function (t) {
var f = t * 30, S = CFG.submit, sub = t >= S; // f: frames at 30 fps (sample spacing and noise rates are per frame)
var inT = R(t, 0, CFG.inDur), labelT = R(t, CFG.label, CFG.labelDur, "out");
var press = MT.interpolate(t, [S, S + CFG.pressIn, S + CFG.pressOut], [1, 0.82, 1], { extrapolate: "clamp" });
var col = mix(1, 0.06, R(t, S, CFG.collapse, "exit"));
var upT = R(t, S + CFG.upAt, CFG.upDur, "exit"), ckT = R(t, S + CFG.checkAt, CFG.checkDur, "overshoot");
var toB = R(t, S + CFG.bubAt, CFG.bubDur, "swift"), fill = R(t, S + CFG.fillAt, CFG.fillDur, "out");
var sentT = R(t, S + CFG.sentAt, CFG.sentDur, "out"), idle = R(t, S + CFG.idleAt, CFG.idleDur, "swift");

// waveform: bar i reads the signal (63 - i) * 1.6 frames ago, so history scrolls left; collapse on submit
var sum = 0, h, i;
for (i = 0; i < N; i++) {
var st = f - (N - 1 - i) * SCROLL;
h = Math.max(DOT, (st < 0 ? 0 : env(st)) * CEN[i] * (0.35 + 0.65 * noise(st * 1.7 + i * 0.13)) * L.maxH * col);
if (i >= N - 12) sum += h;
bars[i].style.height = h.toFixed(1) + "px";
bars[i].className = h <= DOT + 1 || col < 0.25 ? "vw-b q" : "vw-b";
}
var now = sub ? 0 : env(f), level = (sum / 12 / L.maxH) * col;
glow.style.opacity = (inT * (0.08 + 0.22 * level)) / 0.3;

// transcript: each unit rises out of a blur on its onset, accent first, sinking to ink 0.1-0.3 s later
var lastAt = -99, ink = fill >= FLIP;
W.forEach(function (w) {
var p = R(t, w.at, CFG.wordDur), fresh = 1 - R(t, w.at + CFG.freshAt, CFG.freshDur, "linear"), s = w.el.style;
if (t >= w.at && w.at >= lastAt) { lastAt = w.at; car.style.left = w.cx + "px"; car.style.top = w.cy + "px"; }
s.opacity = p;
s.filter = p < 1 ? "blur(" + ((1 - p) * 10).toFixed(2) + "px)" : "none";
s.transform = "translateY(" + ((1 - p) * 0.22 * FS).toFixed(2) + "px)";
s.color = ink ? "var(--k-on-accent)" : "color-mix(in srgb, var(--k-accent) " + (fresh * 100).toFixed(1) + "%, var(--k-ink))";
});
// caret: steady while talking, blinking every 8 frames in the pause, gone on submit
car.style.opacity = !sub && t > CFG.inDur && lastAt > -99 && (now > 0.05 || Math.floor(((t - lastAt) * 30) / 8) % 2 === 0) ? 1 : 0;
tb.style.transform = "translateY(" + (-L.lift * toB).toFixed(2) + "px) translateY(-50%) scale(" + mix(1, 0.72, toB).toFixed(4) + ")";
bub.style.opacity = fill;
bub.style.borderBottomRightRadius = mix(BR, BR * 0.28, fill).toFixed(1) + "px";
var hO = R(t, CFG.hintIn, CFG.hintDur, "out") * (1 - R(t, CFG.hintOut, CFG.hintOutDur, "linear"));
hint.style.opacity = hO > 0.01 ? hO : 0;
hint.style.filter = "blur(" + ((1 - hO) * 6).toFixed(2) + "px)";
sentEl.style.opacity = sentT;
sentEl.style.transform = "translateY(" + ((1 - sentT) * 16).toFixed(2) + "px)";
lab.style.opacity = labelT * (1 - idle);
lab.style.transform = "translateY(-100%) translateY(" + ((1 - labelT) * 10).toFixed(2) + "px)";
dot.style.boxShadow = "0 0 0 " + (4 + 6 * now).toFixed(1) + "px color-mix(in srgb, var(--k-accent) 18%, transparent)";

// capsule: focus-in entrance, then on submit it sinks, shrinks and the mic greys out
cap.style.opacity = inT;
cap.style.transform = "translateY(" + (L.sink * idle).toFixed(2) + "px) scale(" + (mix(1.04, 1, inT) * mix(1, 0.94, idle)).toFixed(4) + ")";
cap.style.filter = inT < 1 ? "blur(" + ((1 - inT) * 6).toFixed(2) + "px)" : "none";
for (i = 0; i < 2; i++) {
rings[i].style.inset = (-(8 + (14 + 14 * i) * now) * L.k).toFixed(1) + "px";
rings[i].style.opacity = Math.min(1, now * 1.6);
}
gray.style.opacity = idle;
md.style.boxShadow = "inset 0 1.5px 0 color-mix(in srgb, white 35%, transparent), 0 8px 20px -8px color-mix(in srgb, var(--k-accent) " + (60 * (1 - idle)).toFixed(1) + "%, transparent)";
btn.style.transform = "scale(" + press.toFixed(4) + ")";
up.style.opacity = 1 - upT;
up.style.transform = "translateY(" + (-30 * L.k * upT).toFixed(2) + "px)";
ck.style.opacity = Math.min(1, ckT * 1.4);
ck.style.transform = "translateY(" + (16 * L.k * (1 - ckT)).toFixed(2) + "px) scale(" + (0.7 + 0.3 * ckT).toFixed(3) + ")";
// timer: seconds spoken, frozen at submit
var tt = "0:" + ("0" + Math.floor(Math.max(0, Math.min(t, S) - 0.4))).slice(-2);
if (tt !== last) tm.textContent = tm2.textContent = last = tt;
grain(t);
});
window.__timelines["voice-waveform-live"] = tl;
})();
</script>

            var u = (t - CFG.at) / CFG.seg, p = cruise(u);
            var cx = L.cx[0] + (L.cx[1] - L.cx[0]) * p, cy = cy0 + (cy1 - cy0) * p;
            rig.style.transform = "scale(" + L.s + ") rotateX(" + L.rx + "deg) rotateY(" + L.ry + "deg) rotateZ(" + (L.rz + (p - 0.5) * 2).toFixed(3) + "deg)";
            plane.style.transform = "translate(" + (-cx).toFixed(2) + "px," + (-cy).toFixed(2) + "px)";
            fl.forEach(function (f) {
              // lift h: floater moved (-0.34h, -0.78h); shadow copy at the slot moved (0.22h, 0.42h), scaled 1 + 0.0011h
              // about the full-width block's centre (text left of it gets its shadow further left), blurred 2 + 0.09h,
              // opacity 0.08 + 0.0026h (max 0.22); gone below 1.5px
              var h = (1 - fall(MT.clamp((u - f[1] + CFG.fall) / CFG.fall, 0, 1))) * f[2], c = f[3];
              f[0].style.transform = h > 0.01 ? "translate(" + (-0.34 * h).toFixed(2) + "px," + (-0.78 * h).toFixed(2) + "px)" : "";
              c.display = h > 1.5 ? "" : "none";
              c.transform = "translate(" + (0.22 * h).toFixed(2) + "px," + (0.42 * h).toFixed(2) + "px) scale(" + (1 + 0.0011 * h).toFixed(4) + ")";
              c.filter = "blur(" + (2 + 0.09 * h).toFixed(2) + "px)";
              c.opacity = (Math.min(0.22, 0.08 + 0.0026 * h) * SH).toFixed(3);
            });
          };
          var tl = MT.scene(CFG.dur, render);
          window.__timelines["graze-face-tour"] = tl;
        })();
      </script>
    </template>
  </body>

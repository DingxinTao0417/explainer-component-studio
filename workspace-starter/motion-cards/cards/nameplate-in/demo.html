<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"host","type":"string","label":"人物图地址（透明底；压在实拍上时留空）","default":"motion-cards/lib/samples/host.png"},
    {"id":"who","type":"string","label":"名字","default":"小周"},
    {"id":"role","type":"string","label":"身份一行（可空）","default":"本期主讲 · 做了八年剪辑"},
    {"id":"plateX","type":"number","label":"名字牌左边位置（px）","default":640,"min":60,"max":1500,"step":10},
    {"id":"plateY","type":"number","label":"名字牌顶边位置（px，对到胸口）","default":650,"min":60,"max":860,"step":10},
    {"id":"hold","type":"number","label":"停留时长（秒）","default":2,"min":0.8,"max":8,"step":0.1},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>nameplate-in · 名字牌</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="nameplate-in-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .np { position: absolute; inset: 0; }
        .np-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .np-disc { position: absolute; left: 610px; top: 150px; width: 700px; height: 700px; border-radius: 50%; background: var(--k-panel); }
        .np-fig { position: absolute; left: 580px; top: 130px; width: 760px; height: 950px; background: center bottom / contain no-repeat; }
        .np-plate { position: absolute; left: 640px; top: 650px; display: flex; align-items: stretch; }
        .np-bar { display: block; flex: none; width: 14px; border-radius: 3px; background: var(--k-accent); }
        .np-box { display: block; padding: 16px 48px 20px 34px; border-radius: 0 14px 14px 0; background: var(--k-bg); }
        .np-name { display: block; font-size: 84px; line-height: 108px; font-weight: 800; white-space: nowrap; }
        .np-role { display: block; font-size: 44px; line-height: 60px; font-weight: 500; color: var(--k-muted); white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="nameplate-in" data-width="1920" data-height="1080">
        <div class="np">
          <div class="np-bg"></div>
          <div class="np-disc"></div>
          <div class="np-fig" style="background-image: url(motion-cards/lib/samples/host.png)"></div>
          <div class="np-plate">
            <div class="np-bar"></div>
            <div class="np-box">
              <span class="np-name">小周</span>
              <span class="np-role">本期主讲 · 做了八年剪辑</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = {
            at: 0.4,        // bar starts standing up
            bar: 0.22,      // bar grow
            boxLag: 0.14,   // backing wipes out of the bar this long after the bar starts
            box: 0.4,
            nameLag: 0.2,   // name leaves the bar
            roleLag: 0.34,  // role follows: 0.14s behind the name
            slide: 64,      // px the lines travel out of the bar
            out: 0.56,      // whole exit, played as the entrance reversed
          };
          var v = { host: "motion-cards/lib/samples/host.png", who: "小周", role: "本期主讲 · 做了八年剪辑", plateX: 640, plateY: 650, hold: 2, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}
          var root = document.querySelector(".np");
          var q = function (s) { return root.querySelector(s); };
          if (String(v.backdrop) === "off") { q(".np-bg").style.display = "none"; q(".np-disc").style.display = "none"; }
          if (v.host) q(".np-fig").style.backgroundImage = 'url("' + String(v.host) + '")';
          else { q(".np-fig").style.display = "none"; q(".np-disc").style.display = "none"; }
          var plate = q(".np-plate"), bar = q(".np-bar"), box = q(".np-box"), name = q(".np-name"), role = q(".np-role");
          plate.style.left = (parseFloat(v.plateX) || 0) + "px";
          plate.style.top = (parseFloat(v.plateY) || 0) + "px";
          name.textContent = String(v.who || "");
          role.textContent = String(v.role || "");
          if (!v.role) role.style.display = "none";
          var go = CFG.at, hold = Math.max(0.8, parseFloat(v.hold) || 2);
          var bye = go + CFG.roleLag + 0.4 + hold;
          var shut = "inset(0% 100% 0% 0%)", open = "inset(0% 0% 0% 0%)";

          var tl = gsap.timeline({ paused: true });
          // in: line first, then the backing wipes out of it, then name, then role
          tl.fromTo(bar, { scaleY: 0, opacity: 1 }, { scaleY: 1, duration: CFG.bar, ease: "power3.out" }, go);
          tl.fromTo(box, { clipPath: shut }, { clipPath: open, duration: CFG.box, ease: "power3.out" }, go + CFG.boxLag);
          tl.fromTo(name, { opacity: 0, x: -CFG.slide }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, go + CFG.nameLag);
          tl.fromTo(role, { opacity: 0, x: -CFG.slide }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, go + CFG.roleLag);
          // out: the same path backwards — role, name, backing, line
          tl.to(role, { opacity: 0, x: -CFG.slide * 0.6, duration: 0.2, ease: "power2.in" }, bye);
          tl.to(name, { opacity: 0, x: -CFG.slide * 0.6, duration: 0.22, ease: "power2.in" }, bye + 0.08);
          tl.to(box, { clipPath: shut, duration: 0.28, ease: "power3.in" }, bye + 0.12);
          tl.to(bar, { scaleY: 0, duration: 0.16, ease: "power2.in" }, bye + CFG.out - 0.16);
          window.__timelines["nameplate-in"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id":"lead","type":"string","label":"空位前的半句","default":"好提示词，要写得"},
    {"id":"tail","type":"string","label":"空位后的半句（可空）","default":""},
    {"id":"options","type":"string","label":"滚过去的几个词，用 | 分开","default":"更长|更礼貌|更花哨"},
    {"id":"answer","type":"string","label":"最后停住的答案","default":"更具体"},
    {"id":"spin","type":"number","label":"开始滚动的时间（秒）","default":0.5,"min":0,"max":10,"step":0.05},
    {"id":"backdrop","type":"enum","label":"底","default":"on","options":[{"value":"on","label":"实底"},{"value":"off","label":"透明（压在画面上）"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>word-slot · 词槽轮换</title>
    <script src="../../lib/preview.js"></script>
  </head>
  <body>
    <template id="word-slot-template">
      <style>
        @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"), local("MicrosoftYaHei"); }
        @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
        @font-face { font-family: "Noto Sans SC"; src: local("Noto Sans SC"), local("Noto Sans CJK SC"); }
        #root {
          --k-bg: var(--mc-bg, #0d1016);
          --k-panel: var(--mc-panel, #1a202b);
          --k-ink: var(--mc-ink, #f3f5f8);
          --k-muted: var(--mc-muted, #8b93a3);
          --k-accent: var(--mc-accent, #ffcf33);
          --k-accent-2: var(--mc-accent-2, #4f8cff);
          --k-on-accent: var(--mc-on-accent, #14161a);
          --k-font: var(--mc-font, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif);
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--k-font);
          color: var(--k-ink);
        }
        .ws { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .ws-bg { position: absolute; inset: 0; background: var(--k-bg); }
        .ws-line { position: relative; display: flex; align-items: center; font-size: 108px; font-weight: 800; line-height: 1.4; letter-spacing: 0.01em; }
        .ws-text { display: block; white-space: pre; }
        .ws-win { position: relative; display: block; height: 1.4em; margin: 0 0.16em; padding: 0 0.26em; overflow: hidden; border-radius: 0.14em; background: var(--k-panel); }
        .ws-reel { display: block; }
        .ws-item { display: block; height: 1.4em; text-align: center; white-space: nowrap; color: var(--k-muted); }
        .ws-ans { color: var(--k-accent); }
        .ws-shade { position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: 0.14em; background: linear-gradient(to bottom, var(--k-panel) 0%, transparent 24%, transparent 76%, var(--k-panel) 100%); }
        .ws-lock { position: absolute; inset: 0; border-radius: 0.14em; border: 5px solid var(--k-accent); }
      </style>

      <div id="root" data-composition-id="word-slot" data-width="1920" data-height="1080">
        <div class="ws">
          <div class="ws-bg"></div>
          <div class="ws-line">
            <span class="ws-text ws-lead">好提示词，要写得</span>
            <span class="ws-win" data-layout-allow-occlusion data-layout-allow-overflow><span class="ws-reel"><span class="ws-item ws-ans">更具体</span></span><span class="ws-shade"></span><span class="ws-lock"></span></span>
            <span class="ws-text ws-tail"></span>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var CFG = { lineIn: 0.35, spin: 0.5, roll: 1.3, loops: 2, over: 9, back: 0.22, lockIn: 0.24 };
          var v = { lead: "好提示词，要写得", tail: "", options: "更长|更礼貌|更花哨", answer: "更具体", spin: CFG.spin, backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          var root = document.querySelector(".ws");
          var q = function (s) { return root.querySelector(s); };
          q(".ws-lead").textContent = String(v.lead || "");
          q(".ws-tail").textContent = String(v.tail || "");
          if (String(v.backdrop) === "off") q(".ws-bg").style.display = "none";
          var opts = String(v.options || "").split("|");
          // the reel is built answer-first, top to bottom, and travels DOWN: at rest (y = 0) the window shows the answer
          var seq = [String(v.answer || "")];
          for (var n = 0; n < CFG.loops; n++) for (var i = opts.length - 1; i >= 0; i--) if (opts[i]) seq.push(opts[i]);
          var reel = q(".ws-reel");
          reel.textContent = "";
          for (var s = 0; s < seq.length; s++) {
            var it = document.createElement("span");
            it.className = "ws-item" + (s === 0 ? " ws-ans" : "");
            it.textContent = seq[s];
            reel.appendChild(it);
          }
          var count = seq.length, one = 100 / count;
          var spin = Math.max(0, parseFloat(v.spin) || 0), stop = spin + CFG.roll;

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".ws-line"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: CFG.lineIn, ease: "power3.out" }, 0);
          // spin: all the speed is at the start, the last two words crawl by — then the reel runs a hair past the answer and drops back
          tl.fromTo(reel, { yPercent: -one * (count - 1) }, { yPercent: one * CFG.over / 100, duration: CFG.roll, ease: "power3.out" }, spin);
          tl.to(reel, { yPercent: 0, duration: CFG.back, ease: "power2.inOut" }, stop);
          // lock: the frame only shows up once the answer has stopped
          tl.fromTo(q(".ws-lock"), { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: CFG.lockIn, ease: "back.out(2.4)" }, stop + CFG.back - 0.06);
          window.__timelines["word-slot"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

        /* ==== kit:grain@1 ==== */

        /* ==== end kit:grain ==== */
        /* ==== kit:text@2 ==== */

        /* ==== end kit:text ==== */
        /* ==== kit:fit@1 ==== */

        /* ==== end kit:fit ==== */

        .lw { position: absolute; inset: 0; container-type: size; }
        /* upstream: low-contrast mesh = a cool key light top-left (16%), a warm afterglow bottom-right (10%), a soft

          radial-gradient(50% 46% at 80% 82%, var(--lw-warm) 0%, transparent 72%),

        /* portrait: the box is the 12%-68% band (its middle on the 40% line), 10% off each side */
        @container (orientation: portrait) {

      </style>

      <div id="root" data-composition-id="lead-word-zoom-assemble">
        <div class="lw">

          <div class="lw-vig"></div>
          <div class="lw-grain"></div>
          <div class="lw-box">
            <div class="lw-ttl"><span class="lw-u">隆重介绍</span><span class="lw-u">全新的</span><span class="lw-u lw-key">一键导出</span></div>

          </div>
        </div>
      </div>

      <script>
        (function () {

            intro: 0.2,                         // first word fades in and comes into focus (6f)
            hold: 0.4, s0: 2.3, push: 1.06,     // it sits at 2.3x and keeps pushing 6% closer (0-12f)

          var LAND = { fs: 108, min: 72, lines: 2, leadMax: 0.9, subLines: 1 };
          var PORT = { fs: 88, min: 72, lines: 2, leadMax: 0.8, subLines: 2 };
          var PUSH = MT.bezier(0.25, 1, 0.5, 1), ZOOM = MT.bezier(0.5, 0, 0.05, 1), WORD = MT.bezier(0.22, 0.8, 0.36, 1);
          var v = { title: "隆重介绍|全新的|一键导出", key: "一键导出", sub: "选好格式，点一下，剩下的交给它", ending: "crash", backdrop: "on" };
          try {
            var got = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
            for (var k in got) if (got[k] !== undefined && got[k] !== null) v[k] = got[k];
          } catch (e) {}

          if (!String(v.title).trim()) v.title = "隆重介绍|全新的|一键导出"; // the line itself cannot be empty
          var root = document.querySelector(".lw");
          var q = function (s) { return root.querySelector(s); };
          var FW = root.clientWidth, FH = root.clientHeight;
          if (!FW || !FH) {

            FH = hc ? +hc.getAttribute("data-height") : window.innerHeight;
          }
          var P = FH > FW, L = P ? PORT : LAND;
          root.setAttribute("data-orient", P ? "portrait" : "landscape");

          // ==== kit:tone@1 ====
          function kRGB(el, color) {
            var p = document.createElement("i");

            wrap.setAttribute("data-tone", tone);

          }
          // ==== end kit:tone ====
          // ==== kit:grain@1 ====

            var dark = tones && tones.getAttribute("data-tone") === "dark";
            var tiles = [0, 1, 2, 3, 4, 5].map(function (k) {
              var f = "type='linear' slope='2.4' intercept='-0.7'";
              var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "'><filter id='g' x='0' y='0' width='100%' height='100%' color-interpolation-filters='sRGB'>" +
                "<feTurbulence type='fractalNoise' baseFrequency='" + (o.freq || 0.85) + "' numOctaves='2' seed='" + (k * 17 + 3) + "' stitchTiles='stitch'/>" +
                "<feColorMatrix type='matrix' values='0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0.33 0.33 0.33 0 0 0 0 0 0 1'/>" +
                "<feComponentTransfer><feFuncR " + f + "/><feFuncG " + f + "/><feFuncB " + f + "/></feComponentTransfer></filter>" +

            layer.style.mixBlendMode = o.blend || (dark ? "soft-light" : "overlay");
            layer.style.backgroundSize = size + "px " + size + "px";
            return function (t) {
              var k = Math.floor((Math.max(0, t) * 30) / step), h = function (n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
              layer.style.backgroundImage = tiles[k % 6];
              layer.style.backgroundPosition = Math.floor(h(k * 3 + 1) * size) + "px " + Math.floor(h(k * 7 + 2) * size) + "px";
            };
          }
          // ==== end kit:grain ====
          // ==== kit:text@2 (kWords, kSplit) ====
          var kCJK = /[⺀-鿿豈-﫿＀-￯]/;
          function kWords(s, key) {
            s = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
            var bar = s.indexOf("|") >= 0, out = [], k = key && !bar ? s.indexOf(key) : -1;
            var cut = function (x) {
              if (/ /.test(s) || !kCJK.test(s) || typeof Intl.Segmenter !== "function") return x.split(/( )/);
              return Array.from(new Intl.Segmenter("zh", { granularity: "word" }).segment(x), function (g) { return g.segment; });
            };
            var bits = bar ? s.split("|") : k >= 0 ? cut(s.slice(0, k)).concat([key], cut(s.slice(k + key.length))) : cut(s);
            var pre = "";
            bits.forEach(function (x) {
              var t = x.trim(), last = out[out.length - 1];
              if (last && /^ /.test(x)) last.sp = true;
              if (!t) return;

            if (bar) out.forEach(function (u, i) { var n = out[i + 1]; if (n && !kCJK.test(u.t.slice(-1)) && !kCJK.test(n.t.charAt(0))) u.sp = true; });
            if (out.length) out[out.length - 1].sp = false;
            return out;
          }

            var s = text != null ? String(text) : el.textContent, units = [];
            var parts = by === "word" ? kWords(s) : (by === "line" ? s.split(/\n|\|/) : Array.from(s)).map(function (t) { return { t: t }; });
            el.textContent = "";
            parts.forEach(function (p) {
              var u = document.createElement("span"), box = u;
              u.className = "lw-u"; u.textContent = p.t;
              if (by === "line") u.style.display = "block";
              if (!p.t.trim()) { el.appendChild(u); return; }
              if (rise) { box = document.createElement("span"); box.className = "lw-cut"; box.style.display = u.style.display; box.appendChild(u); }
              el.appendChild(box);
              if (p.sp) el.appendChild(document.createTextNode(" "));

            });
            return units;
          }
          // ==== end kit:text ====
          // ==== kit:fit@1 ====
          function kFit(el, o) {
            o = o || {};
            var f = o.max || parseFloat(getComputedStyle(el).fontSize), min = Math.min(f, o.min || 40), n = o.lines || 1;
            var W = (o.width || el.clientWidth) * (1 - (o.spare == null ? 0.04 : o.spare)), m;
            for (;;) {
              el.style.fontSize = f + "px";
              m = kLines(el);
              if ((m.w <= W && m.n <= n) || f <= min) break;
              f = Math.max(min, f - 2);
            }
            if (m.w > W) {
              [].forEach.call(el.querySelectorAll("*"), function (c) { if (c.offsetWidth > W) c.style.whiteSpace = "normal"; });
              m = kLines(el);
            }
            return { size: f, lines: m.n, fits: m.w <= W && m.n <= n };
          }
          function kLines(el) {
            var k = el.offsetWidth ? el.getBoundingClientRect().width / el.offsetWidth : 1, fs = parseFloat(getComputedStyle(el).fontSize) * k;
            var rows = [], r = document.createRange(), it = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), t;
            while ((t = it.nextNode())) {
              if (!t.data.trim()) continue;
              r.selectNodeContents(t);
              [].forEach.call(r.getClientRects(), function (b) {
                var c = (b.top + b.bottom) / 2, row = rows.filter(function (w) { return Math.abs(w.c - c) < fs * 0.45; })[0];
                if (!row) rows.push((row = { c: c, x0: b.left, x1: b.right }));
                row.x0 = Math.min(row.x0, b.left); row.x1 = Math.max(row.x1, b.right);

            return { n: rows.length, w: Math.max.apply(null, rows.map(function (w) { return (w.x1 - w.x0) / k; }).concat([0])) };
          }
          function kRows(el, cls) {

            var fs = parseFloat(getComputedStyle(el).fontSize), kids = [].slice.call(el.childNodes), row = null, last = null;
            var tops = kids.map(function (c) { return c.nodeType === 1 ? c.offsetTop : null; });
            kids.forEach(function (c, i) {

              if (tops[i] != null) last = tops[i];

          // ==== end kit:fit ====

          var dark = kTone(root) === "dark", off = String(v.backdrop) === "off", crash = String(v.ending) !== "hold";
          var grain = null;

          else grain = kGrain(q(".lw-grain"), { opacity: dark ? 0.09 : 0.05 });

          // the line: phrases from "|" (a typed space stays a real space outside the inline-blocks, so words never
          // stick together). One line if it fits at >= 72px, else two lines from the largest size again.
          var box = q(".lw-box"), ttl = q(".lw-ttl"), sub = q(".lw-sub");
          var units = kSplit(ttl, "word", 0, v.title), key = String(v.key).replace(/\s+/g, " ").trim();
          if (!kCJK.test(String(v.title))) ttl.style.letterSpacing = "-0.03em"; // all-Latin line: upstream tracking
          units.forEach(function (u) { if (key && u.textContent === key) u.className += " lw-key"; });
          if (!kFit(ttl, { max: L.fs, min: L.min, lines: 1 }).fits) kFit(ttl, { max: L.fs, min: L.min, lines: L.lines });
          kRows(ttl, "lw-row");
          var subOn = String(v.sub).trim() !== "";
          if (subOn) { kSplit(sub, "word", 0, v.sub); kFit(sub, { min: 40, lines: L.subLines }); } else sub.style.display = "none";

          // the pivot, measured once (upstream did it under delayRender): the first word's centre and its baseline,
          // read from a zero-size inline-block placed right after it (its top edge sits on the baseline)
          var lead = units[0], ruler = document.createElement("span");
          ruler.style.cssText = "display:inline-block;width:0;height:0";
          lead.parentNode.insertBefore(ruler, lead.nextSibling);
          var tb = ttl.getBoundingClientRect(), lb = lead.getBoundingClientRect();
          var ox = lb.left + lb.width / 2 - tb.left, oy = ruler.getBoundingClientRect().top - tb.top;

          var fs = parseFloat(ttl.style.fontSize) || L.fs, BLUR = fs / 96;

          var S0 = Math.min(CFG.s0, (L.leadMax * FW) / (lb.width * CFG.push));
          ttl.style.transformOrigin = ox.toFixed(2) + "px " + oy.toFixed(2) + "px";
          box.style.transformOrigin = "50% 50%";

          var lin = function (t, a, d) { return MT.clamp((t - a) / d, 0, 1); };
          var span = function (t, a, d, from, to, ease) { return MT.interpolate(t, [a, a + d], [from, to], { easing: ease, extrapolateLeft: "clamp", extrapolateRight: "clamp" }); };

          var tl = MT.scene(CFG.dur, function (t) {
            var s = scaleAt(t), x = span(t, CFG.hold, CFG.slide, dx, 0, ZOOM), y = span(t, CFG.hold, CFG.slide, dy, 0, ZOOM);

            var b = (Math.min(CFG.velMax, vel * CFG.velBlur) + span(t, 0, CFG.intro, CFG.introBlur / CFG.s0, 0, "power2.out")) * BLUR;
            ttl.style.filter = b > 0.05 ? "blur(" + b.toFixed(2) + "px)" : "";

  // pages: 0 is the opener, 1-3 the chapters; an empty t3 drops the last push

  if (!String(v.t3).trim()) chs.pop().remove();

  var names = list(v.names), subs = list(v.subs), imgs = list(v.imgs);

  var two = function (s) {

  };

  chs.forEach(function (ch, i) {

    q(".bp-name", ch).textContent = name;

    sub.style.display = subs[i] ? "" : "none";

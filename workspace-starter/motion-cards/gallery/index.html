n拖影是同一张图的 4 份副本，带 2px 模糊，围着目标点逐级放大：目标点本身不动、保持清楚，离它越远错位越大，这就是径向模糊的样子。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| zoom 落定倍数（变量） | 2.4 | 过 3.5 倍画面发虚，而且目标周围没有参照物 | 低于 1.6 冲击不够，改用慢一点的推近 |\n| rush 冲的时长 | 0.2s | 0.3s 还算快推，过 0.4s 就不是“急”了 | 0.13s（4 帧）是下限，再短只看到跳切 |\n| over 过冲 | 1.07 | 过 1.12 像弹簧，显得轻浮 | 1.0 时停得很硬，像剪辑软件里的关键帧 |\n| settle 收回时长 | 0.26s | 过 0.4s 像没刹住 | 低于 0.15s 过冲看不见 |\n| smear 拖影级差 | 2.5% 一级，共 4 级 | 一级超过 5% 能数出几个重影 | 去掉拖影也成立，只是少了速度感 |\n| hit 开始时间（变量） | 0.8s | — | 低于 0.4s 观众还没看清全貌，不知道是从哪里冲过来的 |\n\n## 已知坑\n\n- 第一版只有 3 层拖影，级差 5%–7%（1.05 / 1.11 / 1.18），连拍图上每个字清清楚楚变成三个，像印刷套色错位。改成 4 层、每级 2.5%，再给副本加 2px 模糊才连成一片。\n- 第一版拖影的最浓点正好在镜头停下的那一帧，接着 0.13 秒才淡完：画面已经停了，上面还盖着重影。现在最浓点提前一帧，停下那一帧归零。\n- 目标点靠边时不居中：第一版默认目标是右侧的状态徽章（fx 0.88），2.4 倍下镜头被画面边界挡住，徽章最后停在画面右侧四分之一处，“就是这里”指偏了。目标的可居中范围是 0.5 ÷ zoom 到 1 − 0.5 ÷ zoom（2.4 倍时是 0.21–0.79），超出就降倍数。\n- 放大后的镜头层大半在画面外，检查报过 `escaped_container`，包裹层上的 `data-layout-allow-overflow` 是为它加的。\n- 回收阶段不能用带回弹的缓动：位移和缩放按同一进度插值，回弹会让进度越过终点，目标贴边时那一瞬间会露出底色。这里用的是没有回弹的 `power2.out`，过冲由前一段冲过头来做。\n\n## 动效与皮的边界\n\n属于这张卡的：到点才动、0.2 秒的加速冲入、冲过头再收、只出现在最快两帧的径向拖影、落定后目标在画面中央。\n\n只是皮：被拍的内容、落定倍数的具体值、拖影层数、有没有实底、落定后叠什么标注。\n\n## 接进片子\n\n- 变量：`src` 画面地址，`fx` / `fy` 目标点（0–1），`zoom` 落定倍数，`hit` 开始冲的秒数，`backdrop`。\n- 对旁白：`hit` 填“这里”“这一行”那个词出口的时间减 0.2 秒，让镜头在词说完时撞到位。\n- 音效：`hit` 处一个 0.2 秒的短促掠过声，`hit + 0.2` 处一个轻的撞击声。\n- 连用：前面用 slow-push 铺垫，反差最大；落定后接荧光笔或下划线类的卡标出具体的字；离开时用 pull-reveal 退回全貌。一条片子里用三次以内。"},{"id":"cursor-click","name":"光标点击","group":"证据与界面","type":"evidence","intents":["software"],"numbers":null,"chart":null,"one_line":"一个放大的箭头光标沿弧线滑到按钮上，停一拍后按下：按钮面下沉、发亮，按到底的那一帧从点击处扩散两圈波纹，再弹回","use_when":"旁白说“点这里”“按下导出”，要让观众看清点的是哪个按钮、是哪一刻点的","energy":"中","needs":["文"],"overlay":true,"slot":3,"hero":1.45,"sfx":"click=pop","pairs_with":["spotlight-dim","screen-push-focus","input-typing"],"vars":[{"id":"label","type":"string","label":"按钮上的字","default":"开始导出"},{"id":"x","type":"number","label":"点击位置 x（画面像素）","default":1185},{"id":"y","type":"number","label":"点击位置 y（画面像素）","default":803},{"id":"click","type":"number","label":"按下的时间（秒）","default":1.2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.8,1.3,1.45,2.6],"doc":"## 命门\n\n1. **到了先停一拍。** 光标 1.1 秒到位，1.2 秒才按下，中间 0.1 秒不动。滑到就按，观众的眼睛还在追光标，点击那一下就漏看了。\n2. **按下快，松开慢。** 按下 0.07 秒，松开 0.28 秒并带回弹。两头一样快像闪了一下，两头一样慢像在按一块海绵。\n3. **波纹从按到底的那一帧出发。** 波纹不跟着光标到达，也不跟着松开，而是卡在按钮沉到最低的 1.27 秒。早了像光标自带的光圈，晚了像另一件事。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.4 → 1.1s | 光标（横向） | 从右方 620px 外滑到点击点（默认位置下起点被夹在 x=1790，实际走 605px） | power3.out |\n| 0.4 → 1.1s | 光标（纵向） | 从下方 150px 上移到点击点（默认位置下起点被夹在 y=905，实际走约 100px） | power2.inOut |\n| 1.1 → 1.2s | 光标 | 停住 | — |\n| 1.2 → 1.27s | 光标 | 以箭头尖为原点缩到 0.84 | power2.in |\n| 1.2 → 1.27s | 按钮面 | 下沉 15px，盖住底下的深色垫层；表面提亮 35% | power2.in |\n| 1.27 → 1.87s | 第一圈波纹 | 缩放 0.12 → 1（直径 380px），透明度 0.9 → 0 | power2.out |\n| 1.39 → 1.99s | 第二圈波纹 | 缩放 0.12 → 1.5，透明度 0.6 → 0 | power2.out |\n| 1.36 → 1.64s | 光标、按钮面 | 弹回原位 | back.out(2.2) / back.out(2.6) |\n\n横向先快后慢、纵向两头缓，两条轴不同步，路径就弯了。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| travel 滑行时长 | 0.7s | 过 1s 像在犹豫 | 低于 0.4s 只看到光标闪到按钮上 |\n| settle 到位停顿 | 0.1s | 过 0.3s 像卡住 | 0 时点击被滑行吞掉 |\n| sink 下沉 | 15px | 过 24px 按钮像掉下去 | 低于 8px 在视频里看不出 |\n| ripple 波纹时长 | 0.6s | 过 0.9s 波纹还在散，下一句旁白已经开始 | 低于 0.35s 像闪光 |\n| aimX / aimY 落点偏移 | 225 / 28px | — | 0 时箭头正好压在按钮文字上 |\n| click（变量）按下时刻 | 1.2s | — | 小于 1.0s 会被抬到 1.0（滑行加停顿至少要这么久） |\n\n## 已知坑\n\n- 第一版把点击点放在按钮正中，落定后箭头把“开始导出”四个字盖住了一半。现在点击点在按钮中心右侧 225px、下方 28px（按钮 700×170px、字 70px，箭头整个还在按钮右半边里）；按钮比 600px 窄时把 `aimX` 改小。\n- 波纹的起始透明度不是 0。如果只写一条从 0.9 到 0 的补间，时间轴停在点击之前时波纹圈会一直亮着。现在是“0 → 亮 → 0”三段，点击前恒为 0。\n- 光标起点太靠下会被画面底边切掉一截：箭头是 120×165px，第一版起点在点击点下方 250px，连拍第一帧只露出半个箭头。现在是下方 150px，并且把起点夹在画面内（x 不超过 1790，y 不超过 905）；点击点越靠下，纵向的弧度越小，y 超过 850 时路径接近水平。\n- 光标压在按钮文字上会被校验当成遮挡，在按钮和文字上加了 `data-layout-allow-occlusion`。\n- 浅色按钮配白色波纹看不见：波纹用的是 `--k-ink`。换成浅色皮时把波纹改成深色或强调色。\n- 示例面板是 1580×900（画面宽的 82%），默认点击点 (1185, 803) 时正好居中。`x / y` 改了面板会整块跟着挪，偏离默认值超过 170px（横向）或 90px（纵向）面板就出画；那种位置请用透明模式压在真实画面上。\n- 透明模式下没有按钮可以下沉，只剩光标和波纹，点击感弱一半。可以把 `sink` 的位移加在录屏层上做一次 5px 的轻推作为补偿。\n\n## 动效与皮的边界\n\n属于这张卡的：两轴不同步的弧线、到位后的一拍停顿、快按慢放、波纹卡在按到底那一帧、按钮面和垫层的相对位移。\n\n只是皮：光标造型和大小，按钮的颜色、圆角、文字，周围的示例面板，波纹是一圈还是两圈。\n\n## 接进片子\n\n- 变量：`label` 按钮上的字；`x / y` 点击点（画面像素，示例面板会自动挪到让按钮落在点击点左上）；`click` 按下的时刻；`backdrop` 填 `off` 时只留光标和波纹，压在真实录屏上。\n- `click` 对齐旁白里的动词（“点”“按”）。真实录屏里按钮有反应的那一帧也对在 `click + 0.07` 秒。\n- 音效：`click + 0.07` 秒（默认 1.27 秒）一个短促的弹出声或鼠标声。\n- 接法：前面用 `spotlight-dim` 或 `screen-push-focus` 把按钮所在区域指出来；点完之后切到结果画面。"},{"id":"doc-stack-pick","name":"文档堆里抽一张","group":"证据与界面","type":"evidence","intents":["result","point"],"numbers":null,"chart":null,"one_line":"四页错开叠着的文档里，压在中间的一页先横着抽出来（上面的几页被带动一下），离开纸堆后才翻到最上层，放大转正到画面中央，其余几页退后变暗","use_when":"旁白说“在这么多材料里，关键是这一份”，要表现从一堆里挑出一个","energy":"中","needs":["文"],"overlay":true,"slot":3.5,"hero":3,"sfx":"draw=whoosh, land=pop","pairs_with":["media-pop","quote-pull","screen-push-focus"],"vars":[{"id":"titles","type":"string","label":"四页的标题（用 | 分开，从底到顶）","default":"访谈记录|提纲初稿|数据附表|终版脚本"},{"id":"pick","type":"number","label":"抽第几页（1 是最底下那页）","default":2},{"id":"note","type":"string","label":"每页角上的小字","default":"示例文档"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.7,0.95,1.15,3],"doc":"## 命门\n\n1. **先横着抽，再换层。** 被选中的那页先在原来的层里往右移 790px，这时它还压在上面几页底下；完全离开纸堆的那一刻才改到最上层。一开始就把它提到最上层，它会从别的纸里“穿”出来，像界面元素，不像纸。\n2. **上面的纸要被带一下。** 抽的时候，压在它上面的几页跟着右移 16px、多转 1.4°，再弹回去。别的纸纹丝不动，这页就像是从空气里滑出来的，没有摩擦。\n3. **选中的转正，其余的仍然歪着。** 抽出来的页回到 0°、放大到 1.22 倍；纸堆只把歪度收到六成，并整体退后、压暗 58%。全都摆正的话，画面变成整齐的列表，“一堆里挑一个”就没了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.45s | 四页 | 叠着不动：每页错开 56px、14px，角度 -8° / -3° / 3° / 7° | — |\n| 0.45 → 0.87s | 被选中的页（默认第 2 页） | 右移 790px、上移 26px、多转 5° | power2.inOut |\n| 0.45 → 0.70 → 0.87s | 它上面的页 | 被带动 16px、1.4°，再回位 | power2.out，再 power1.inOut |\n| 0.87s | 被选中的页 | 改到最上层 | 瞬间 |\n| 0.87 → 1.43s | 被选中的页 | 移到画面中央，角度回 0，缩放 1 → 1.22，投影加深 | back.out(1.3) |\n| 0.87 → 1.43s | 其余三页 | 左移 250px，缩到 0.88，角度收到六成，盖上 58% 的暗层 | power2.out |\n| 1.28 → 1.48s | 被选中页的顶边条 | 灰色换成强调色 | 线性 |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| out 抽出距离 | 790px | 过 1000px 会抽到画面外面 | 低于 700px 换层时还和纸堆重叠，能看到穿帮 |\n| draw 抽出时长 | 0.42s | 过 0.7s 像慢动作 | 低于 0.3s 上面几页的带动看不出来 |\n| drag 带动幅度 | 16px | 过 40px 整堆纸像被扯散 | 0 时没有摩擦感 |\n| front 选中页最终大小 | 1.22 | 过 1.3 页面上下顶出画面（纸高 780px） | 低于 1.1 和纸堆拉不开主次 |\n| shade 纸堆压暗 | 0.58 | 过 0.8 纸堆几乎消失，不知道是从哪抽的 | 低于 0.3 纸堆还在抢眼 |\n\n## 已知坑\n\n- 纸堆里每页都有标题，文字的外框彼此重叠，校验逐对报 `content_overlap`，一共十几条；旋转还会让文字外框变高，连同一页上的角标和标题都报。这是“叠着”本身，让不开，所以在每页的角标和标题上加了 `data-layout-allow-overlap`。\n- 纸堆压暗不能用透明度。把纸调成半透明，会透出它下面那几页的字。现在是在每页最上面盖一层底色的遮罩。\n- 抽最顶上那一页时没有“上面的纸”可以带动，动作会显得轻。要抽的最好是中间的页；非要抽顶页，就把 `drag` 用在它下面那一页上。\n- 换层的时刻是写死在抽出动作结束时的。改短 `out` 而不检查 0.87 秒那一帧，会看到纸角从上一页里穿出来。\n- 页面上的标题是 64px，放大后 78px，一行最多 7 个字（纸宽 600px，左右各留 56px）。更长的标题要缩字号或折成两行。\n\n## 动效与皮的边界\n\n属于这张卡的：先平移后换层的顺序、上层纸被带动、选中页转正放大而纸堆保持歪斜并退后变暗。\n\n只是皮：纸的颜色、圆角和上面的内容（可以整页换成截图），页数，纸堆在左还是在右，顶边条和它的变色。\n\n## 接进片子\n\n- 变量：`titles` 四页的标题，用 `|` 分开，顺序是从底到顶；`pick` 抽第几页（1 是最底下）；`note` 每页角上的小字；`backdrop`。\n- 0.45 秒开始抽，对齐旁白里的“这一份”；1.43 秒落定，之后停住。\n- 音效：0.45 秒一个纸张抽出的掠过声，1.4 秒左右落定配一个轻的弹出声。\n- 接法：落定后可以直接接 `screen-push-focus` 推近这一页上的某处，或者接 `quote-pull` 拉出其中一句。"},{"id":"dot-field","name":"点阵波","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"铺满全屏的整齐点阵不动，一道斜的波纹整镜缓慢横穿过去，波到之处的点依次变亮变大再恢复","use_when":"讲数据、网络、信号、模型这类“很多个小单元”的话题，标题或数字卡下面需要一点有秩序的动静","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["number-roll","big-stat-slab","kicker-headline"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"点阵在标题后面慢慢起伏"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"波纹亮度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **点不动，只有亮度在走。** 每个点始终在自己的格子上，波只改变它的大小和颜色。让点自己位移，整屏会像在晃，压在上面的字跟着发虚。\n2. **波前是软的、宽的。** 变亮的范围前后各占画面宽度的 20%，最亮的芯只有 9%。波前做成一条硬线，就成了扫描线，观众会盯着它等它扫完。\n3. **最大的点也只有 8px 半径。** 点距 64px，最大时点只占格子的四分之一。再大，点会连成色块，从标题笔画的空隙里透出来。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 全程 | 底层点阵（半径 3px，灰） | 不动 | — |\n| 0 → 6s | 第一道波（强调色） | 波前从画面宽度的 10% 走到 74%，向右倾 14° | 线性 |\n| 0 → 6s | 第二道波（第二强调色） | 跟在第一道后面 48% 处，约 2 秒起从左边渐渐进画 | 线性 |\n\n波经过时，点先变成半径 5px 的彩色点（波前两侧各 20% 的范围内渐显），到波芯附近再叠上半径 8px 的点（两侧各 9%），过后按相反顺序退回。两道波由同一个数驱动。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1（6 秒走 64%） | 2 以上波会在镜头结束前冲出画面，后半段只剩静止的点 | 0.4 时波几乎停在原地，只是一条发亮的带 |\n| strength（变量） | 0.7 | 1 时波芯很亮，会抢标题 | 0.3 时底层的灰点也跟着变淡，接近纯色底 |\n| from / travel（CFG） | 10 / 64 | travel 过 90 一镜之内横穿全屏，偏快 | from 为负时第一帧画面里没有波 |\n| 点距（CSS background-size） | 64px | 96 以上太稀，波的形状看不出来 | 40 以下太密，缩小播放时出摩尔纹 |\n\n## 已知坑\n\n- 波的位置是用一个自定义属性 `--df-p` 驱动遮罩渐变做的。补间的目标必须是声明这个属性的那一层，补到别的节点上波不会动。\n- 五层点阵的 `background-position` 必须完全一样，差 1px 就能看到大点和小点错开。\n- 第二道波进画时正好经过标题的左半边。默认亮度下没问题；把 strength 开到 1 且标题很细时，改 CSS 里的 48% 让它晚点进来。\n- 成片缩到很小（比如信息流预览）时，半径 3px 的底点会消失或闪。小尺寸分发时把底点加到 4px。\n- 遮罩是 `-webkit-mask-image` 和 `mask-image` 各写一遍。只留一个，在部分渲染环境里整层会不显示或全显示。\n\n## 动效与皮的边界\n\n属于这张卡的：点阵本身静止、软而宽的斜波前、点“先亮再大、先小再暗”的两级变化、两道波一前一后同速走。\n\n只是皮的：点的形状（换成小方块、小十字都行）、点距、波的两种颜色、波前的倾角、是一道波还是两道。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把数字卡或标题卡叠在更高的轨道上；`speed` 是波走的距离倍数；`strength` 是整层点阵的浓度。\n- 时间：整镜铺满。想让波正好在某个词上经过画面中央，可以算：第一道波约在第 3.75 秒到达正中。\n- 音效：没有。\n- 常见接法：垫在 `number-roll`、`big-stat-slab` 下面，数字落定的时刻尽量错开波经过数字的时刻。"},{"id":"filmstrip-pass","name":"胶片带掠过","group":"图片与多素材","type":"evidence","intents":["categories","steps"],"numbers":null,"chart":null,"one_line":"一条带齿孔的图片带匀速从右往左滑，每一格经过中间的取景框时放大到 1.42 倍并提亮、把邻格挤开，过了又缩回变暗，最后滑行着停在指定的一格上","use_when":"旁白在快速带过一串东西（“试了这个、这个、还有这个”），每个只需要看一眼，最后停在要细讲的那一个上","energy":"中","needs":["多图"],"overlay":true,"slot":4.5,"hero":4.3,"sfx":"pass=whoosh, cell=tick, stop=shutter","pairs_with":["grid-to-hero","media-pop","lower-third"],"vars":[{"id":"srcs","type":"string","label":"胶片上每一格的图，用 | 分隔，按经过的先后排","default":"motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p8.jpg"},{"id":"stop","type":"number","label":"最后停在第几格（从 1 数）","default":5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,1,1.4,3,4.3],"doc":"## 命门\n\n1. **带子匀速，格子自己变。** 带子全程每 0.8 秒走一格，不在每一格上停。格子的大小、亮度只由它离取景框中心的距离决定。让带子“走一格停一下”，就成了翻页的幻灯片，没有“掠过”。\n2. **放大的那格要把邻居挤开。** 中间那格宽了 252px，左右两格各被推开 126px。不推的话，放大的格子直接盖住邻格三分之一，带子看着像叠坏了。\n3. **停的时候速度要接得上。** 最后 1 秒用 power2.out 滑停，这一段的路程按“入口速度 × 时长 ÷ 2”算出来，所以从匀速到减速没有顿一下。随手写一段减速，接缝处速度会突变，像被人拽了一把。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.25s | 整体 | 淡入（带子已经在走） | power1.out |\n| 0 → 2.90s | 带子 | 以 800px/s 向左匀速走，第 1–4 格分别在 0.2 / 1.0 / 1.8 / 2.6s 经过正中 | 线性 |\n| 离中心 512px 以内 | 每一格 | 放大到最多 1.42 倍，蒙片从 0.62 降到 0；邻格被推开最多 126px | 随距离平滑变化 |\n| 同上 | 取景框四角 | 有格子对正时从 1.07 收紧到 1 | 随距离平滑变化 |\n| 2.90 → 3.90s | 带子 | 再滑 400px，停在第 5 格正中 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| perCell 每格用时 | 0.8s | 过 1.2s 就不是掠过了，每格都像在等人看 | 低于 0.5s 每格在框里只有两三帧是大的，只能看到颜色 |\n| stop 停在第几格（变量） | 5 | 越靠后整段越长（每多一格加 0.8s，最多匀速 2.9s） | 2 时匀速段只剩 0.5s，几乎一上来就在减速 |\n| brake 滑停时长 | 1.0s | 过 1.6s 最后一格到得很慢，像没电了 | 低于 0.5s 是急刹 |\n| grow 中间格放大量 | 0.42 | 过 0.55 中间格会高出胶片带太多，带子的形状没了 | 低于 0.2 取景框里外差别不大，看不出重点 |\n| reach 多近开始放大 | 0.8 格 | 过 1.0 相邻两格同时都是大的 | 低于 0.5 放大来得很突然，像弹了一下 |\n| dim 框外压暗 | 0.62 | 过 0.8 框外只剩黑块 | 低于 0.3 整条一样亮，取景框成了摆设 |\n\n## 已知坑\n\n- 格子的状态是从“镜头位置”这一个数算出来的，计算挂在**时间轴**的 `onUpdate` 上，并且建完时间轴后手动算了一次。挂在某一段补间上的话，拖到另一段时不会重算，第一帧也是错的。\n- `stop` 设得小的时候，按默认的 2.9 秒匀速段往回推，起点会落在第一格前面好几格的空带子上。脚本把起点限制在第一格前四分之一格以内，匀速段会自动变短（`stop: 2` 时整段只有 1.5 秒），`slot` 要跟着收。\n- 齿孔是一张重复的渐变背景，每帧只改它的 `background-position`，并且对 80px 取模。让齿孔跟着带子真的平移，需要一个几千像素宽的节点。\n- 走到画面外 1500px 以上的格子会被设成不可见。图多于 12 张时也只是多几个隐藏节点，不会拖慢，但 `stop` 的上限是图的张数。\n- 中间格放大后是 852×534，比 524px 高的胶片带高出 10px，是故意让它“从带子里鼓出来”。把 `grow` 调到 0.39 以下它就回到带子里面了。\n\n## 动效与皮的边界\n\n属于这张卡的：带子匀速、格子按离中心的距离连续地放大提亮、邻格被挤开、取景框跟着收紧、速度连续的滑停。\n\n只是皮：胶片带的底色和齿孔、取景框是四个角还是整圈、格子的宽高比和圆角、从右往左还是反过来、放大和压暗的具体数值。\n\n## 接进片子\n\n- 变量：`srcs` 每一格的图，用 `|` 分隔，按经过的先后排；`stop` 最后停在第几格（从 1 数，最小 2）；`backdrop`。\n- 默认参数下第 1–4 格在 0.2 / 1.0 / 1.8 / 2.6 秒经过正中，第 5 格在 3.9 秒停稳。旁白每点到一样东西，尽量落在这些时刻上；旁白更快或更慢就改 `CFG.perCell`。\n- 音效：全程一条轻的掠过声垫底，每格对正时一个很轻的滴答，停稳时一个快门声。\n- 停稳后常接 `grid-to-hero` 或 `media-pop` 把停住的那张单独放大，或者加一条 `lower-third` 说明。"},{"id":"flash-cut","name":"闪白切","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜在两帧里冲到过曝，全白停两帧，然后白很快褪掉、拖一小段余光，底下已经是下一镜","use_when":"旁白出现“结果是——”“按下去之后”这类揭晓、拍照、瞬间发生的节点，换镜要干脆","energy":"高","needs":["无"],"overlay":true,"slot":2,"hero":1.134,"sfx":"flash=shutter","pairs_with":["stamp-verdict","media-pop"],"vars":[{"id":"hold","type":"number","label":"全白停几帧（1–3）","default":2},{"id":"tail","type":"number","label":"衰减时长（秒）","default":0.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.967,1.034,1.134,1.6],"doc":"这是一个叠加层：一张白压在两镜上面，全白的两帧里换镜。\n\n## 命门\n\n1. **白来得比走得快。** 冲白只用 2 帧，褪白用 0.3 秒。对称的淡入淡出是“叠白过渡”，慢而柔，读成回忆或做梦；前短后长才像闪光灯。\n2. **褪的曲线是先陡后缓。** power3.out：第一帧就掉到 73%，第三帧只剩 34%，后面是一段很薄的余光。匀速褪的话，下一镜会灰蒙蒙地糊 0.3 秒，看着像曝光坏了。\n3. **全白 2 帧，换镜在白里。** 少于 2 帧盖不住硬切的跳变；多于 3 帧观众会意识到“屏幕白了”，注意力掉出内容。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（刚到全白的那一帧）。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.933 → 1.0s | 白层 | 透明度 0 → 1 | power2.in |\n| 1.0 → 1.067s | 白层 | 全白（`hold` = 2 帧） | — |\n| 1.067 → 1.367s | 白层 | 透明度 1 → 0（`tail` = 0.3s） | power3.out |\n\n宿主把两镜的交界对在卡内 **1.033 秒**。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| ramp 冲白时长 | 0.067s（2 帧） | 0.13s 以上能看见“变亮”的过程，变成叠白 | 1 帧也行，更硬 |\n| hold（变量） | 2 帧 | 3 帧是上限 | 1 帧时两镜亮度差大就会漏 |\n| tail（变量） | 0.3s | 0.5s 以上是“余晖”，适合情绪段落 | 0.15s 很脆，适合连续几张图的快切 |\n| 褪白曲线 | power3.out | expo.out 更脆，几乎没有余光 | power1.out 发灰发闷 |\n\n## 已知坑\n\n- 全片别超过两三次。闪白很耗观众的眼睛，在手机上尤其刺眼；暗色调的片子里把白换成暖一点的浅色会舒服些。\n- 下一镜本身是白底或浅色底（文档、网页录屏）：褪白几乎看不出来，转场等于没有。这种情况换成色块或圈入。\n- 连续两次闪白之间至少隔 1 秒以上，间隔太短会接近频闪。\n- 下一镜开头有小字的话，前 0.15 秒被余光盖着读不清，把字的出场时间往后放到卡内 1.3 秒以后。\n\n## 动效与皮的边界\n\n属于这张卡的：2 帧冲白、2 帧全白、先陡后缓的褪白，三段的长短比例。\n\n只是皮：白的颜色（纯白、暖白、强调色的浅色）、余光拖多长、是整屏均匀的白还是中间更亮。\n\n## 接进片子\n\n- 变量：`hold` 全白帧数，`tail` 褪白时长，`backdrop` 在片子里填 `off`。\n- 对齐：这段的起点 = 两镜交界 − 1.033 秒，时长 2 秒，轨道压在两镜上面。\n- 音效：1.0 秒放一个快门声或很短的“嚓”。\n- 常见接法：闪完落在一张结果图或一个结论章上；下一镜如果自己带一个从 1.04 倍缓缓收回的小缩放，“闪一下、定住”的感觉更完整。"},{"id":"flow-nodes","name":"节点流程线","group":"结构与流程","type":"structure","intents":["process","steps"],"numbers":null,"chart":null,"one_line":"几个节点横向排开，一条线从左往右一段段画过去，画到哪个节点，那个节点就放大点亮","use_when":"旁白在讲一条有方向的流程（输入、处理、输出），环节有三到五个，每个环节的名字不超过五六个字","energy":"中","needs":["文"],"overlay":false,"slot":5,"hero":4.6,"sfx":"node=pop","pairs_with":["timeline-vertical","roadmap-light"],"vars":[{"id":"items","type":"string","label":"节点文字（用 | 分隔，2–5 个）","default":"输入问题|检索资料|生成回答|人工复核"},{"id":"cues","type":"string","label":"每个节点点亮的秒数（逗号分隔，不够就均匀排开）","default":"0.5,1.5,2.5,3.5"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.6,1.3,2.62,4.6],"doc":"## 命门\n\n1. **线到了节点才亮。** 每一段线在 cue 之前 0.5 秒开始画，cue 那一帧到达，节点这时才从 0.82 倍弹到 1.2 倍并填满强调色。节点先亮、线后补，因果就反了，读成“几个圆被连起来”，不是“流程走到了这一步”。\n2. **当前节点是实心的、最大的；走过的只留一圈描边。** 走过的节点退回 1 倍、填色撤掉、数字换成强调色，文字缩到 0.9 倍变灰。走过的还保持实心，四个黄圆排成一排，看不出现在在哪。\n3. **没到的节点是暗的空位，线是淡的轨。** 开场 0.3 秒就把整条路线的骨架摆出来，观众先知道一共几站，再看线往前走。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.03 → 0.33s | 淡轨和全部空位圆 | 淡入（空位圆是 0.82 倍） | power1.out |\n| cue − 0.5 → cue | 强调色的线 | 从上一个节点画到这个节点（第一个节点没有这段） | power2.inOut |\n| cue → +0.34s | 节点 | 0.82 → 1.2 倍 | back.out(2.5) |\n| cue → +0.12s | 填色和描边 | 淡入；数字在填到一半（+0.06s）时一次切出 | 线性 |\n| cue + 0.05 → +0.37s | 节点下的文字 | 上移 32px 淡入 | power3.out |\n| 下一个 cue → +0.3s | 上一个节点 | 回到 1 倍，填色 0.12 秒淡掉，数字在一半时切成强调色，文字缩到 0.9 倍变灰 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 每段线的时长 | 0.5s | 过 0.8 线比旁白慢，节点点亮迟到 | 低于 0.25 线像是瞬移 |\n| peak 当前节点倍数 | 1.2 | 过 1.4 放大的圆会压到下面的文字（圆和字只隔 60px） | 1.05 以下和走过的分不开 |\n| node 各条数的圆直径 | 280 / 280 / 260 / 220px（2 / 3 / 4 / 5 个） | 五个节点超过 240，放大时圆和圆之间只剩一条缝 | 低于 180，圆里的数字小于 84px，整排又缩回画面中间一条 |\n| fonts 各条数的字号 | 104 / 96 / 84 / 64px（2 / 3 / 4 / 5 个） | 四个节点时一列只有 440px，再大四个字就放不下 | 五个节点不要低于 64 |\n| idle 空位倍数 | 0.82 | 1.0 时空位和走过的节点一样大，层次少一档 | 低于 0.7 空位太小，像装饰点 |\n| fill 填色时长 | 0.12s | 过 0.25 点亮发软 | 0 是硬切，可以接受 |\n| past 走过的文字倍数 | 0.9 | — | 再小字会低于 56px（脚本已经按 56px 兜底） |\n\n## 已知坑\n\n- 深色数字压在半透明的强调色圆上会有一小段对比度不够。现在的做法是：填色线性淡 0.12 秒，数字在正中间那一帧整个切换（出现，或者由深色换成强调色），前后两个状态都读得清。改 `fill` 时别动“切在一半”这个关系。\n- 整排宽 1760px。五个节点时每列只有 352px，文字超过 5 个汉字就会缩到 56px 以下。五个节点就用两三个字的名字。\n- 线是用一根条做横向缩放画出来的，原点必须在左端；原点留在中间，线会从中间往两头长。\n- 两个 cue 的间隔小于 0.55 秒时，后一个会被推迟。旁白念得很快的流程，把 cue 对在每个环节名的重音上，而不是第一个字上。\n- 文字只有一行，不换行。需要解释的环节，换成 `roadmap-light`，那张卡的格子里放得下两行。\n\n## 动效与皮的边界\n\n属于这张卡的：线一段段地画并且在 cue 那一帧到达、节点在到达时放大填色、走过的退成描边、未到的是空位。\n\n只是皮：圆换成方块或图标、线的粗细、数字要不要、文字在上还是在下、强调色。把线去掉只留点亮，就是 `roadmap-light` 的思路，不是这张卡。\n\n## 接进片子\n\n- `items`：节点名，`|` 分隔，2–5 个，每个 2–5 个字。\n- `cues`：每个节点点亮的秒数，对齐旁白说出环节名的那个词。线会提前 0.5 秒出发，第一个 cue 不早于 0.4 秒。\n- `backdrop`：`off` 只留线、节点和字，底下自己垫压暗的画面。\n- 音效：每个 cue 一个 pop；需要更强的方向感时，在每段线出发时加一个很短的 whoosh。\n- 接法：讲完流程后要放大其中一环，下一镜接那一环的录屏；需要先交代“全图”再逐个讲，换 `roadmap-light`。"},{"id":"follow-card","name":"关注卡","group":"人物与口播","type":"structure","intents":["outro"],"numbers":null,"chart":null,"one_line":"一张主页卡片从下方升起坐稳，头像、名字、简介、按钮从左到右先后落位，随后按钮被按下去、在最低点换成“已关注”再弹回来","use_when":"片中或片尾提醒观众关注、订阅，想演示“点一下”这个动作，而不是只放一句话","energy":"中","needs":["人","文"],"overlay":true,"slot":3.5,"hero":3,"sfx":"rise=whoosh, press=pop, done=chime","pairs_with":["subscribe-cta","host-to-chip","nameplate-in"],"vars":[{"id":"host","type":"string","label":"头像图地址（透明底人物或方形头像）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"who","type":"string","label":"名字（8 字以内）","default":"你的名字"},{"id":"bio","type":"string","label":"一行简介（14 字以内，可空）","default":"每周一条，把一件事讲明白"},{"id":"btn","type":"string","label":"按钮文字：按之前","default":"关注"},{"id":"btnDone","type":"string","label":"按钮文字：按之后","default":"已关注"},{"id":"cardY","type":"number","label":"卡片顶边位置（px）","default":320},{"id":"pressAt","type":"number","label":"按钮被按下的时间（秒）","default":1.7},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.5,1.4,1.867,3],"doc":"## 命门\n\n1. **先让人读完，再按。** 卡片 0.85 秒坐稳，按钮 1.14 秒就位，1.70 秒才按下去，中间留了半秒多。卡片一到就按，观众还没看清按钮上写的是什么，状态就变了，等于没演示。\n2. **在最低点换状态。** 按钮 0.1 秒压到 0.88 倍，文字和底色在压到底的那一帧瞬间切换，然后弹回。在弹回途中或弹回之后才换，读成“按了没反应、过一会儿自己变了”。\n3. **按下快，弹回慢。** 下去 0.1 秒，回来 0.45 秒带过冲。两段一样长是一次“缩放提示”，不是一次“按”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.85s | 整张卡（1720×440px，画面宽的 90%） | 从下方 300px 升到位，前 0.15s 淡入 | back.out(1.3) |\n| 0.50 → 0.90s | 头像（直径 290px） | 0.4 → 1 弹出 | back.out(2) |\n| 0.60 / 0.70s 起 | 名字（88px）、简介（50px） | 右移 36px 淡入，各 0.35s | power3.out |\n| 0.78 → 1.14s | 按钮（400×140px，字 58px） | 0 → 1 弹出（不透明） | back.out(2.2) |\n| 1.70 → 1.80s | 按钮 | 1 → 0.88；整张卡同时下沉 10px | power2.in |\n| 1.80s | 按钮 | 底色和“关注”瞬间消失，露出描边和“已关注” | 瞬切 |\n| 1.80 → 2.25s | 按钮 | 0.88 → 1 | back.out(3.4) |\n| 1.80 → 2.30s | 按钮外圈 | 一圈强调色描边向外扩开并淡出 | power2.out |\n| 1.88 → 2.14s | 对勾 | 一笔画出 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| rise 升起时长 | 0.55s | 过 0.8s 像慢慢浮上来，没精神 | 低于 0.35s 像被弹出来 |\n| pressAt（变量） | 1.7s | 对着旁白说“点一下关注”的那个词去设 | 低于 1.1s 会被自动抬到 1.1，保证按钮先就位 |\n| down 按下时长 | 0.1s | 过 0.2s 像慢动作 | 低于 0.06s 只有两帧，看不到压下去 |\n| depth 按下的深度 | 0.88 | 过 0.95 看不出按了 | 低于 0.8 按钮上的字被挤得发虚 |\n| bump 整卡下沉 | 10px | 过 20px 像卡片要掉 | 0 也成立，只是少一点“受力” |\n\n## 已知坑\n\n- 按钮上“关注”是深色字压在强调色底上。它不能淡入淡出：淡到一半时深字压着深色卡面，对比度不够。所以按钮是不透明地从 0 弹出，换状态也是瞬切。\n- 两个状态的文字叠在同一个位置，按钮宽度固定 400px。“已关注”带对勾最多放 4 个字，更长的词（比如五个字的“已加入收藏”）要加宽按钮并相应缩短名字。\n- 头像是按“透明底半身人物、头在上方 22% 处”裁的。换成方形头像照片时，把头像里那个节点的位置和尺寸改成铺满圆（宽高各 290，偏移 0）。\n- 名字 8 个字、简介 14 个字是上限（中间那一栏宽约 750px），再长会顶到按钮。脚本没有做自动缩字；宁可删字，简介不要缩到 40px 以下。\n- 卡片高 440px，默认顶边在 320px（上下居中）。压在片尾画面上时通常要放到 580px 左右，别挡住画面中心；`cardY` 超过 600 卡片底边就贴到画面底了。\n- 按钮外圈扩开时纵向到 1.6 倍（约 224px 高），还在 440px 高的卡片里面。把卡片压矮到 300px 以下时，这一圈会伸出卡片上下沿，要把纵向倍数降到 1.3。\n\n## 动效与皮的边界\n\n属于这张卡的：卡片整块升起、内容从左到右错开落位；按之前留出阅读时间；快压、最低点换状态、慢弹回；换状态时向外扩的一圈。\n\n只是皮：卡片的形状颜色、头像是圆是方、按钮的两种样式、对勾图形、所有文字。它不模仿任何平台的界面，按钮文字和头像都是变量；要贴近某个平台的样子，由使用者自己换皮。\n\n## 接进片子\n\n- 变量：`host` 头像图；`who` 名字；`bio` 一行简介，可空；`btn` 和 `btnDone` 按钮按下前后的文字；`cardY` 卡片顶边位置；`pressAt` 按下的时间；`backdrop` 压在画面上填 `off`。\n- 开始时间：卡的 0.3 秒对齐旁白提到“关注”之前的半句，`pressAt` 对齐“关注”这个词本身。\n- 音效：0.3 秒升起一个轻的掠过声，1.8 秒压到底一个短的弹出声，对勾画完（2.1 秒）可以加一个提示音。\n- 常见接法：片尾先 `subscribe-cta` 出一句话，再用这张卡演示动作；或者片中只用这张卡，停 2 秒后整张下移退场。"},{"id":"formula-assemble","name":"公式拼装","group":"结构与流程","type":"structure","intents":["grouping","definition"],"numbers":null,"chart":null,"one_line":"几个词块跟着旁白依次从上方落进一行，加号在下一个词块落下前先弹出，最后等号弹出，结果在第二行放大砸出来","use_when":"旁白用“甲加乙加丙，就等于丁”的句式总结方法，前面的词是条件，最后一个词是结论","energy":"中","needs":["文"],"overlay":true,"slot":4.6,"hero":4.2,"sfx":"term=pop, result=impact","pairs_with":["converge-arrows","word-punch"],"vars":[{"id":"items","type":"string","label":"等号左边的词块（用 | 分隔，2–5 个）","default":"清晰目标|具体示例|明确格式"},{"id":"result","type":"string","label":"等号右边的结果","default":"稳定输出"},{"id":"cues","type":"string","label":"每个词块落位的秒数，最后可多写一个给结果（逗号分隔）","default":"0.4,1.3,2.2,3.2"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.57,1.5,3.3,4.2],"doc":"## 命门\n\n1. **符号比词早一拍。** 加号在下一个词块落下之前 0.16 秒弹出，等号在结果之前 0.24 秒弹出。旁白说的是“……加上（停）具体示例”，符号对的是那个“加上”。符号和词同时到，一行东西一起蹦出来，听不出是在拼；符号比词晚，就成了事后补的标点。\n2. **结果是唯一放大的东西，而且单独占一行。** 词块是落下来的（位移），结果是从 0.3 倍放大到 1.14 倍再落到 1 的（缩放），字号 160px、块高 300px，对词块的 88px、块高 194px，用实心强调色块。结果也用落下的方式、和词块一样大，等号两边就是平的，没有“所以”的分量。\n3. **词块讲过就灰。** 当前词块白字、底边一条强调色线；下一个词块落下时它变灰、线撤掉；结果出来时所有词块都是灰的。词块一直全亮，结果出来时一屏四五个亮块，眼睛不知道落在哪。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| cue − 0.16 → +0.08s | 这个词块前面的加号 | 0 → 1 倍弹出（第一个词块没有） | back.out(3.5) |\n| cue → +0.34s | 词块 | 从上方 110px 落下，带 ±4° 的小歪斜回正，淡入 | back.out(1.6) |\n| cue → +0.15s | 词块底边的强调线 | 淡入 | 线性 |\n| 下一个 cue → +0.3s | 上一个词块 | 字变灰，底线撤掉 | power2.out |\n| hit − 0.24 → hit | 等号 | 0 → 1 倍弹出 | back.out(3.5) |\n| hit → +0.18s | 结果块 | 0.3 → 1.14 倍（原点在左边，贴着等号长出来） | power3.out |\n| hit + 0.18 → +0.48s | 结果块 | 回到 1 倍 | back.out(2.2) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| opLead 加号提前量 | 0.16s | 过 0.4 加号孤零零地悬着 | 0 时和词块同时到，拼的节奏没了 |\n| eqLead 等号提前量 | 0.24s | 过 0.5 等号后面空太久，像卡住 | 0 时等号被结果盖过去，看不到 |\n| drop 词块下落距离 | 110px | 过 200 会从第一行上方很远处飞来，像掉东西 | 低于 50 只是淡入 |\n| land 词块落位时长 | 0.34s | 过 0.5 发飘 | 低于 0.2 没有落的过程 |\n| peak 结果峰值倍数 | 1.14 | 过 1.3 长结果会顶出画面右边 | 1.0 没有砸的一下 |\n\n## 已知坑\n\n- 所有词块必须挤在一行里，字号按估算的总宽度统一缩：3 个四字词是 88px，4 个四字词约 69px，5 个四字词只剩 53px。五个词块时每个用两三个字，才保得住 56px 以上。\n- 词块在落下之前就已经占着位置（只是透明），所以先落的词块一开始就在最终位置上，不会被后来的挤着挪动。别改成“落下时才插入”，一行字会来回跳。\n- 结果块里是深色字压强调色底。色块用 0.08 秒淡入，字在色块过半不透明以后才一次切出来，避免半透明时深字压在暗底上糊成一团。\n- 结果最宽 1300px：8 个字以内是 160px，再长自动缩字号。两行加起来高约 584px，占画面一半多一点。\n- 结果块的放大原点在左边。原点在中间时，它放大的一瞬间会压到等号上。\n- `cues` 的最后一个数是结果的时间；不写的话按前面的平均间隔往后排。结果和最后一个词块至少隔 0.5 秒，否则等号没有地方弹。\n\n## 动效与皮的边界\n\n属于这张卡的：词块逐个落位、符号早一拍弹出、结果单独一行并且是唯一用缩放出现的、结果出现时前面全部退灰。\n\n只是皮：词块是底板还是只有下划线、符号的字形（+、×、→ 都可以，逻辑要对）、结果块的颜色和圆角、两行还是一行（词少时可以排成一行，只要结果仍然最大）。\n\n## 接进片子\n\n- `items`：等号左边的词，`|` 分隔，2–5 个。`result`：等号右边的结果，建议 2–6 个字。\n- `cues`：前几个数是每个词块落位的秒数，对齐旁白说出这个词的第一个字；最后多写的一个数是结果的时间，对齐旁白说出结果的那个词。\n- `backdrop`：`off` 时透明。词块和结果自带底板，加号和等号是裸的强调色字，底下画面太亮时要压暗。\n- 音效：每个词块一个 pop，结果那一帧一个 impact。\n- 接法：结果出来以后想单独强调，下一镜用 `word-punch`；条件之间没有相加关系、只是“都指向同一个结论”时，换 `converge-arrows`。"},{"id":"grid-perspective","name":"透视网格","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"画面下方一张向远处消失的地面网格整镜匀速朝观众滚过来，地平线上压着一条淡淡的光","use_when":"讲“未来、系统、空间、路线”这类抽象话题的标题镜，需要一点纵深感，但上半屏要干净地留给字","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["kicker-headline","chapter-numeral","slab-title-slam"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"标题放在地平线上方"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"网格和地平线光的浓度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **匀速，而且慢。** 地面 6 秒只滚 3 格（每格 100px），全程线性。带缓动的滚动读成“车在起步或刹车”，观众会等它停。\n2. **远处要淡进底色。** 地平线往下 30% 的范围用底色盖住。不盖的话远处的线挤成一片闪烁的密纹，比标题还抢眼。\n3. **字在地平线以上。** 地平线在画面高度的 62% 处，上面是空的。把字压到网格上，斜线会从笔画里穿过去，读起来很累。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 网格（在倾斜 68° 的地面里） | 沿地面朝观众平移 300px，正好 3 格，所以最后一帧和第一帧对得上 | 线性 |\n| 0 → 3s → 6s | 地平线上的光晕 | 透明度 0.6 → 1 → 0.6 | sine.inOut，往返一次 |\n| 全程 | 地平线细线、标题 | 不动 | — |\n\n透视距离 640px，消失点在地平线正中。线宽 2px，用第二强调色的 70%。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1（3 格） | 2 是 6 格，已经像在行驶；脚本最多取到 6 格 | 0.3 取整后是 1 格，接近静止的地面 |\n| strength（变量） | 0.7 | 1 时近处的线很亮，下半屏开始和标题争 | 0.3 只剩隐约的纵深 |\n| cell（CFG） | 100px | 160 以上近处只剩三四条线，不像网格 | 60 以下远处糊成一片 |\n| glowLow（CFG） | 0.6 | 1 时光晕不呼吸，地平线显得死 | 0.2 时光晕一明一暗，变成有节拍的东西 |\n\n## 已知坑\n\n- 格数不是整数时首尾对不上，循环播放会跳一下。脚本已经把“cells × speed”取整；自己改 `cell` 时记得同时改 CSS 里的 `background-size`。\n- 透视距离调得太小（低于 450px）时，近处一格会放大到半屏宽，只看得见几条粗线。先调倾角，再调距离。\n- 网格层比地面大，是靠裁切藏住的，所以包裹层上带着 `data-layout-allow-overflow`；去掉它检查会报溢出。\n- 浅色皮下线是蓝的、光是暖的，对比比深色皮更明显。浅色皮建议把 strength 降到 0.5。\n- 竖屏时地平线 62% 的位置偏低，上面空得太多。竖屏把地平线提到 50%，同时把标题区的高度一起改。\n\n## 动效与皮的边界\n\n属于这张卡的：单点透视的地面、匀速朝观众滚动、远处淡出到底色、地平线上一条只呼吸不闪的光、字留在地平线以上。\n\n只是皮的：线的颜色和粗细、格子大小、光晕颜色、地平线的高度、网格是方格还是只有纵线。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把标题卡叠在更高的轨道上，位置放在上半屏；`speed` 决定 6 秒滚几格；`strength` 是网格和光的浓度。\n- 时间：整镜铺满，不用对齐旁白。因为首尾对得上，镜头比 6 秒长时可以把这张卡首尾相接放两次。\n- 音效：没有。\n- 常见接法：章节标题（`chapter-numeral`、`slab-title-slam`）的幕底；标题卡的落点对齐地平线上方约 200px 最稳。"},{"id":"grid-to-hero","name":"网格选一张放大","group":"图片与多素材","type":"evidence","intents":["point","categories"],"numbers":null,"chart":null,"one_line":"六到九张图先排成网格，其中一张被黄框圈住并鼓一下，0.3 秒后它长到占满左边主区，其余缩成右侧一列小图并压暗","use_when":"旁白先铺开一批候选（“试了六种写法”），再说“其中这一个最好”，接下来要盯着这一张讲","energy":"中","needs":["多图"],"overlay":true,"slot":3.5,"hero":3.2,"sfx":"pick=tick, grow=whoosh","pairs_with":["stack-fan","media-pop","lower-third"],"vars":[{"id":"srcs","type":"string","label":"六到九张图的地址，用 | 分隔（六张排两行，七到九张排三行）","default":"motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p6.jpg"},{"id":"pick","type":"number","label":"选中第几张（从 1 数）","default":5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.9,1.25,1.6,1.9,3.2],"doc":"## 命门\n\n1. **先标记，再放大。** 1.1s 黄框出现、选中的那张鼓到 1.07、其余压暗；1.4s 才开始长大。中间这 0.3 秒让观众的眼睛先找到它。标记和放大同时发生，看到的是“一张图突然变大”，不知道它原来在哪一格。\n2. **是长大，不是缩放。** 放大改的是真实的宽高和位置，图在框里重新裁切，圆角和黄框粗细不变。用 scale 做的话，格子和主区比例不一样时图会被拉扁，黄框也会从 10px 变成 27px。\n3. **其余的不消失。** 另外几张缩到右边排成一列、压暗到 0.6，还在画面里。把它们淡出掉，“从一批里挑出来的”这层意思就没了，只剩一张大图。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.55s | 全部格子 | 沿对角线依次出现（每条对角线晚 0.05s），缩放 0.86 → 1 | power3.out |\n| 1.10 → 1.22s | 选中格的黄框 | 透明 → 不透明 | power2.out |\n| 1.10 → 1.26s | 选中格 | 缩放 1 → 1.07 | power3.out |\n| 1.10 → 1.35s | 其余格 | 蒙片压暗到 0.45 | power1.out |\n| 1.40 → 2.00s | 选中格 | 长到 1498×936，移到左侧主区，缩放回 1 | power3.inOut |\n| 1.40 → 2.02s | 其余格 | 依次（每张晚 0.03s）缩成 270×169，排到右侧一列，压暗到 0.6 | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| pick 选第几张（变量） | 5 | — | — |\n| pickAt 标记时刻 | 1.1s | 网格停留超过 1.5s 观众开始自己挑图看 | 早于 0.8s 网格还没看清就被打断 |\n| growAt − pickAt 标记到放大的间隔 | 0.3s | 过 0.6s 像卡了一下 | 低于 0.15s 标记白做，看不出选的是哪格 |\n| punch 标记时鼓多大 | 1.07 | 过 1.15 会盖住邻格的边 | 1.0 只剩黄框，在花哨的图上不够显眼 |\n| growDur 长大时长 | 0.6s | 过 0.9s 拖沓 | 低于 0.35s 看不清它从哪格来 |\n| dimSide 小图压暗 | 0.6 | 过 0.8 右边一列成了黑块 | 低于 0.3 小图会和主图抢注意力 |\n\n## 已知坑\n\n- 六张排 3×2，七到九张排 3×3（格子变矮到 560×304）。七张、八张时最后一行有空位，看着像没加载完；要么凑到九张，要么减到六张。\n- 九张时落选的有八张，右侧会排成两列，每张只有 128×80，基本看不清内容，只起“还有这么多”的作用。要让落选的也看得清，用六张。\n- 选中的那张要在最上层：脚本给它设了 `z-index: 2`。自己在包裹层里加别的元素时，别压过它。\n- 压暗用的是每格里的一层黑色蒙片。直接降格子的透明度，透明压在实拍上时底下的画面会从小图里透出来。\n- 主区是 16:10（1498×936）。格子在 3×3 时是 1.84:1，长大过程中图的上下会多露出一截，这是重新裁切造成的，不是 bug；介意的话把图事先裁成一样的比例。\n\n## 动效与皮的边界\n\n属于这张卡的：先标记后放大的两拍、真实宽高的生长、落选的缩到一边并留在画面里、网格只用很快的对角线入场当铺垫。\n\n只是皮：几行几列、圆角、黄框的颜色和粗细、主区在左还是在右、小图列的宽度、压暗的深浅。\n\n## 接进片子\n\n- 变量：`srcs` 六到九张图，用 `|` 分隔，按从左到右、从上到下的顺序；`pick` 选中第几张（从 1 数）；`backdrop`。\n- 卡的开始对上旁白说“这几种”的地方；`pickAt`（1.1s）对上旁白说“这一个”的那个词，对不上就改 `CFG.pickAt` 和 `CFG.growAt`，两者保持差 0.3 秒。\n- 音效：1.1s 标记一个滴答，1.4s 长大一个掠过声。\n- 落定后左下角留给 `lower-third` 写这张图的说明；前面常接 `stack-fan` 把这批图先亮出来。"},{"id":"highlighter-swipe","name":"荧光笔扫过","group":"字与强调","type":"structure","intents":["point","keyword"],"numbers":null,"chart":null,"one_line":"整句先到，旁白念到重点的那一刻，一条边缘不齐的荧光色带从左到右扫过那几个字，被扫到的字同时变成深色","use_when":"一句话里有一小段是要观众记住的原话（规则、定义、关键条件），语气是“划重点”而不是“砸重音”","energy":"中","needs":["文"],"overlay":true,"slot":3,"hero":2.6,"sfx":"swipe=draw","pairs_with":["line-rise","char-cascade"],"vars":[{"id":"text","type":"string","label":"整句","default":"每次只改一个变量"},{"id":"key","type":"string","label":"被划的重点（整句的子串）","default":"只改一个"},{"id":"hit","type":"number","label":"荧光笔落下的时间（秒）","default":0.9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.6,1,1.12,1.22,2.6],"doc":"## 命门\n\n1. **色带是扫出来的，不是亮起来的。** 色带有一条从左到右移动的前沿，0.42 秒走完。整条色带同时淡入，读起来是“选中了一段文字”，是界面动作，不是手的动作。\n2. **字跟着前沿换色。** 前沿扫过哪里，哪里的字就从浅色变成深色，两层字用同一条裁切边。色带先铺满、字再整体变色的话，中间有一瞬间浅字压在亮色带上，根本读不出来。\n3. **边是歪的。** 色带上下沿各有五六个高低不平的折点，整体逆时针歪 1.1°，两头比字多伸出 0.12em。做成一个规整的圆角矩形就退回成 `word-punch` 的色块了。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 0.9s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 整句（含重点词的浅色字） | 上移 26px 淡入 | power3.out |\n| 0 → 0.42s | 色带 + 深色字这一层 | 裁切右边界从 114% 收到 -14%，即从左向右揭开 | power2.inOut |\n| 0 → 0.42s | 重点词的浅色字 | 裁切左边界从 -14% 推到 114%，沿同一条边被收走 | power2.inOut |\n| 0.36 → 0.66s | 色带 | 纵向 1.12 → 1，笔压松开 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| swipe 扫过时长 | 0.42s | 过 0.7s 像进度条在读条 | 低于 0.25s 只看到结果，看不到“扫” |\n| pad 裁切外扩 | 14% | 没有坏处，只是前沿要多走一点空程 | 低于 10% 色带伸出字外的两头会被裁掉，变成齐头 |\n| press 笔压 | 0.06 | 过 0.15 色带落定时明显缩一下，像在呼吸 | 0 也成立，只是少一点手感 |\n| hit（变量） | 0.9s | — | 小于 0.35s 会和整句进场叠在一起，脚本自动抬到 0.35 |\n| 色带不透明度（CSS，.hs-band path） | 0.88 | 1 就是实心色块，少了荧光笔的透 | 深色底上低于 0.7 会发闷，像脏黄色 |\n\n## 已知坑\n\n- “半透明”在深色底上不能太透：黄色 50% 压在深底上是橄榄色，既不亮、上面的浅色字也读不清。深色底用 0.88 并且让字变深；换成浅色皮时可以降到 0.5–0.6，并把 `.hs-ink` 的颜色改回正文色。\n- 裁切外扩是按重点词宽度的百分比算的（14%），色带两头伸出的量却是按字号算的（0.12em）。重点词只有一个字时两者几乎相等；这时再把伸出量调大，色带两头就会被切成齐头。改伸出量要同步改 `pad`。\n- 两层字必须完全重合。给深色字那层加字重或字距，换色的边会出现重影。\n- 重点词换行：色带是一整块，跨行的重点会变成一个盖住两行的大方块。重点控制在一行以内（120px 字号下不超过 10 个字）。\n- 重点词这个节点保留空白字符（为了不吃掉句子里的空格），所以它里面的几层标签必须写在同一行、标签之间不留换行和缩进。我第一版按正常缩进分行写，换行被当成文字排了出来，色带被撑成半屏高的一大块。\n\n## 动效与皮的边界\n\n属于这张卡的：有前沿的从左到右揭开、字色沿同一条边同步切换、不齐的边和微小的倾斜、两头伸出字外。\n\n只是皮：色带颜色和不透明度、深色字用什么颜色、折点的具体形状、字号字重、有没有收尾时的笔压回弹。\n\n## 接进片子\n\n- 变量：`text` 整句；`key` 被划的那段（必须是整句的子串，找不到就不划）；`hit` 落笔秒数，对齐旁白念到重点第一个字的时刻；`backdrop`。\n- 音效：`hit` 那一帧起放一个 0.4 秒左右的马克笔划纸声，声音的长度要和 `swipe` 一致。\n- 常见接法：`line-rise` 或普通字幕先把话立住，这张卡只负责“划”；一屏里最多划两处，第二处的 `hit` 至少晚 0.6 秒。"},{"id":"host-arrows-focus","name":"口播双箭头","group":"人物与口播","type":"host","intents":["host","point","keyword"],"numbers":null,"chart":null,"one_line":"主持人站在一侧说话，另一侧两行字先后升起；说到重点时重点变成强调色，两支手绘箭头从上下两个方向错开一拍画过去，指住它","use_when":"口播镜头里，旁白一句话里有一个必须被记住的短语（几点、一个数、一个关键词），而且主持人正在画面里","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":3,"sfx":"draw=draw, hit=pop","pairs_with":["host-quote-hold","host-circle-note"],"vars":[{"id":"line1","type":"string","label":"第一行：铺垫（可空）","default":"今天只要你"},{"id":"line2","type":"string","label":"第二行：带重点的那句","default":"记住这 3 点就够了"},{"id":"key","type":"string","label":"箭头指住的重点（第二行里的一段）","default":"这 3 点"},{"id":"hit","type":"number","label":"箭头画到重点的时刻（秒）","default":1.5},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"right"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.75,1.3,1.6,3],"doc":"## 命门\n\n1. **箭头指的是一个短语，不是整句。** 两支箭头的尖都停在重点那几个字的边上（右上角、左下角），离字 4% 字高。指向整句或者停在句子中间，观众不知道该看哪几个字。\n2. **重点先亮，箭头后到。** 重点在第一支箭头到达前 0.12 秒变成强调色并轻轻放大到 1.06 倍；箭头画到时它已经是亮的。箭头先到、字后变色，读起来像箭头“点亮”了一个本来不重要的词。\n3. **两支箭头从相反方向来，错开一拍。** 一支从右上往下落，一支从左下往上挑，第二支晚 0.14 秒到。同时到、同一个方向来，看起来是一个装饰符号，不是“看这里”。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=1460（人在左时 460）；字在另一侧 760px 宽的一栏里，左边距 140（人在左时 1020），顶在 y=330。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.25 → 0.70s | 第一行 | 上移 24px 淡入，56px、次要色 | power3.out |\n| 0.55 → 1.00s | 第二行 | 上移 30px 淡入，96px、正文色 | power3.out |\n| hit − 0.12 → +0.2s | 重点 | 变成强调色；同时放大到 1.06 倍，再用 0.3 秒回到 1 | power1.out / power2.out |\n| hit − 0.38 → hit | 第一支箭头 | 从右上沿二次曲线画到重点右上角 | power2.inOut |\n| hit − 0.24 → hit + 0.14 | 第二支箭头 | 从左下画到重点左下角 | power2.inOut |\n| 每支画完前 0.05 秒 | 箭头的尖 | 0.06 秒内出现 | 线性 |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 每支箭头画多久 | 0.38s | 过 0.6 像慢慢描，跟不上口播的重音 | 低于 0.2 看不出是画出来的，像闪现 |\n| stagger 两支箭头的间隔 | 0.14s | 过 0.35 第二支像另一件事 | 0 时两支同时到，读成一个符号 |\n| keyLead 重点提前变色 | 0.12s | 过 0.3 重点亮了很久箭头才来，箭头多余 | 0 时箭头和变色同时，像箭头点亮了它 |\n| head 箭头尖的长度 | 28px | 过 44 箭头尖抢过曲线，像图标 | 低于 18 远处看不出方向 |\n| hostX 人脸中线 | 1460 | 人更靠边，肩膀被画面裁得更多 | 人往中间挤，压到字那一栏 |\n\n## 已知坑\n\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n- 透明底人物要用带透明通道的 webm（`hyperframes remove-background` 能直接出）；白墙前拍的 mp4 也能用，`backdrop` 保持 `on`，白墙和白底能接上，墙不白就能看出一个框。\n- 箭头位置是按重点那几个字的实际排版量出来的（`offsetLeft / offsetTop`），所以换字体、换字号都会跟着走；但重点在第二行的最右端时，第一支箭头的起点会被夹回字栏右边 70px 以内，曲线会变陡。\n- 第二行超过 8 个汉字会自动缩字号（按 760px 估算），12 个字时只剩 63px。话说不短就拆成两屏，别让它挤。\n- 重点在第二行里找不到（写错一个字）时，整个第二行都当重点，箭头会指向整句的两端。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、重点先变色再被两支箭头从相反方向错开一拍指住、箭头是画出来的。\n\n只是皮：字号、两行的颜色深浅、箭头的粗细和颜色、箭头是曲线还是折线、人站左边还是右边、底色。\n\n## 接进片子\n\n- `line1` 铺垫（可空）、`line2` 带重点的那句、`key` 是 `line2` 里要被指住的那一段，一字不差。\n- `hit`：对齐旁白说出重点的那个字（`align.py find` 查），相对这一镜的起点。第二行 0.55 秒才升起，所以 `hit` 不早于 1 秒。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字和箭头。\n- `side`：人在画面哪边。主持人本来就站在左边就写 `left`，字会放到右边。\n- 音效：两支箭头各配一个短 draw，第一支落点再加一个轻 pop。\n- 常接 `host-quote-hold`（下一句金句）或 `host-circle-note`（换一种标法，别连用两次箭头）。"},{"id":"host-brush-mark","name":"口播笔刷","group":"人物与口播","type":"host","intents":["host","keyword","point"],"numbers":null,"chart":null,"one_line":"主持人站在左边说话，右边两行字升起；说到重点时一笔强调色的笔刷从左往右刷在重点底下，盖满后重点一下子翻成反白字，轻轻弹一下","use_when":"口播镜头里，一句话的重音落在一个短语上，想要比箭头、圈更有力的一下（态度、立场、反常识的那个词），而且主持人正在画面里","energy":"高","needs":["人","文"],"overlay":true,"slot":4,"hero":3,"sfx":"hit=whoosh, flip=pop","pairs_with":["host-quote-hold","host-corner-frame"],"vars":[{"id":"line1","type":"string","label":"第一行：铺垫（可空）","default":"真正拉开差距的"},{"id":"line2","type":"string","label":"第二行：带重点的那句","default":"是你提问的方式"},{"id":"key","type":"string","label":"刷上笔刷的重点（第二行里的一段）","default":"提问的方式"},{"id":"hit","type":"number","label":"笔刷落下的时刻（秒）","default":1.4},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"left"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.9,1.6,1.9,3],"doc":"## 命门\n\n1. **笔刷是实色的一整块，压在字底下，把字整个托住。** 笔刷在重点下面有 1.16 个字号高，上下都比字多出一截，字始终在它上面。只是一条细线读成下划线，半透明读成荧光笔，都没有“刷上去”的分量。\n2. **盖满了才翻字。** 笔刷刷过时，字保持深色（深字压在强调色上看得清）；刷到 92% 的时刻字一次翻成反白，不跟着笔刷逐字变。先翻字后刷，右边那几个白字会落在白底上，几帧里看不见。同样的道理，笔刷在重点下面不能收细：哪一笔露出笔刷，翻成白字后就消失在白底上。\n3. **起笔圆、收笔干。** 笔刷在重点前 0.4 个字宽处圆圆地起笔，一直饱满地走过整个重点，过了最后一个字才收细，再拖出一个字宽，下沿比上沿收得快，像笔往上提着离开纸面。两头一样粗、一样齐，读成一个色块按钮，不是一笔。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=460（人在右时 1460）；字在另一侧 760px 宽的一栏里，左边距 1020（人在右时 140），顶在 y=330。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.25 → 0.70s | 第一行 | 上移 24px 淡入，56px、次要色 | power3.out |\n| 0.55 → 1.00s | 第二行 | 上移 30px 淡入，最大 96px、正文色 | power3.out |\n| 1.40 → 1.85s | 笔刷 | 从重点左边 0.4 个字宽处起笔，往右刷到重点右边一个字宽处，用裁切从左往右露出来 | power2.inOut |\n| 1.81 → 1.87s | 重点 | 从正文色一次翻成反白 | 线性 |\n| 1.81 → 2.21s | 重点 | 放大到 1.05 倍，再用 0.28 秒回到原大 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| sweep 笔刷刷多久 | 0.45s | 过 0.8 像慢慢涂，没有甩出去的劲 | 低于 0.25 一闪就满，看不出是刷的 |\n| body 笔刷半高（按字号算） | 0.58 | 过 0.7 笔刷碰到上一行的字 | 低于 0.5 字的顶和底露在笔刷外面，翻成白字后那几笔就没了 |\n| tailOut 尾巴拖出多远 | 1 个字宽 | 过 1.6 尾巴拖得像另一笔 | 低于 0.6 尾巴收得太急，像一个箭头尖 |\n| flick 尾巴往上挑多少 | 0.22 个字宽 | 过 0.4 尾巴像甩出去的另一笔 | 0 时尾巴是平的，少了手刷的劲 |\n| pop 翻字时放大多少 | 1.05 | 过 1.12 字跳出笔刷的边 | 1 时翻字没有落点 |\n\n## 已知坑\n\n- 反白字是强调色上的 `on-accent` 色（默认白）。强调色换成很浅的颜色（亮黄）时，项目要同时把 `--mc-on-accent` 换成深色，否则翻完字看不清。\n- 重点不能太长：一行 760px 的栏里，笔刷尾巴还要再出去一个字宽。重点在行尾、人又站在左边时，尾巴离画面右边只剩 40px 左右；人在右边时尾巴会伸到人的旁边，但和人的头之间还有一段空。\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n- `backdrop` 写 `off` 压在实拍上时，笔刷依然是实色，字的对比没问题；但白底没了以后，第一行次要色的字压在偏暗的画面上会看不清。\n- 和 `highlighter-swipe`、`underline-draw` 的区别：那两张是压在别的画面上，按坐标标一个位置；这张是整屏口播，字和人都在卡里，笔刷跟着字的实际排版走。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、说到重点时一笔实色笔刷从左往右刷在字底下、盖满后字一次翻成反白、起笔圆收笔干。\n\n只是皮：笔刷颜色、高低、尾巴的长短和上挑、翻字后的颜色、人站哪边（默认左边，给口播段落换个方向）、底色。\n\n## 接进片子\n\n- `line1` 铺垫（可空）、`line2` 带重点的那句、`key` 是 `line2` 里要被刷的那一段，一字不差。\n- `hit`：对齐旁白说出重点第一个字的时刻（`align.py find` 查），相对这一镜的起点；不早于 1 秒。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字和笔刷。\n- `side`：默认人在左边。同一段口播里和人在右边的卡交替用，画面不会一直是一个朝向。\n- 音效：笔刷配一个短 whoosh 对在 `hit`，翻字时一个轻 pop。\n- 一段口播里用一次就够，能量高；前后接 `host-corner-frame`（起名字）或 `host-quote-hold`（收结论）。"},{"id":"host-circle-note","name":"口播圈重点","group":"人物与口播","type":"host","intents":["host","keyword","point"],"numbers":null,"chart":null,"one_line":"主持人站在一侧说话，另一侧两行字升起；说到重点时一支笔把它圈起来，圈多绕一点收尾，随后在圈下面拖出一笔，写上一句手写批注","use_when":"口播镜头里，旁白一句话里有一个词要被记住，而且主持人还要顺口补一句旁白（“不是你以为的那个”“占了大头”），主持人正在画面里","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":3,"sfx":"hit=draw, note=pop","pairs_with":["host-arrows-focus","host-quote-hold"],"vars":[{"id":"line1","type":"string","label":"第一行：铺垫（可空）","default":"做好一个模型"},{"id":"line2","type":"string","label":"第二行：带重点的那句","default":"最难的其实是数据"},{"id":"key","type":"string","label":"被圈住的重点（第二行里的一段）","default":"数据"},{"id":"note","type":"string","label":"圈下面的手写批注（可空，6 个字以内）","default":"不是算力"},{"id":"hit","type":"number","label":"开始圈的时刻（秒）","default":1.3},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"right"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.9,1.55,2.05,3],"doc":"## 命门\n\n1. **圈从说出重点的那个字开始画。** `hit` 对齐重点的第一个字，圈在 0.55 秒内画完，跟着这个词的读音走完。提前画好，圈读成版式里本来就有的框；说完很久才圈，像事后补的记号。\n2. **圈是手画的：多绕一点、斜一点。** 一圈多出 12%，收尾越过起笔点、落在圈外侧；整体斜 3°，半径有轻微起伏。规整闭合的椭圆读成按钮或标签，不是“有人在这里圈了一下”。\n3. **批注在圈画完之后才写，而且用手写体。** 先圈、再拖一笔、再写字，三件事有先后。批注和圈同时出现，读成一个预先排好的图标；用正文字体写，读成正文的第三行。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=1460（人在左时 460）；字在另一侧 760px 宽的一栏里，左边距 140（人在左时 1020），顶在 y=330。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.25 → 0.70s | 第一行 | 上移 24px 淡入，56px、次要色 | power3.out |\n| 0.55 → 1.00s | 第二行 | 上移 30px 淡入，最大 96px、正文色 | power3.out |\n| 1.30 → 1.85s | 圈 | 从右上角起笔，逆时针绕 1.12 圈，左右比重点宽 16px、上下多 14px，越绕越松，最后一段比起笔处大 7% | power1.inOut |\n| 1.90 → 2.10s | 拖尾 | 从圈的下沿拖一笔到批注上方，向外鼓 34px | power1.out |\n| 2.00 → 2.35s | 批注 | 楷体 54px、强调色，上移 14px 淡入，正对圈的下方 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 圈画多久 | 0.55s | 过 0.9 像在慢慢描，跟不上口播 | 低于 0.3 看不出是画出来的，像弹出的框 |\n| turn 绕几圈 | 1.12 | 过 1.35 绕成两圈，像乱涂 | 1.0 时首尾刚好接上，像规整的椭圆 |\n| tilt 倾斜 | −0.06 弧度 | 过 0.15 圈歪得像没对准 | 0 时太规整，少了手画感 |\n| padX / padY 圈比重点宽多少 | 16 / 14px | 左右过 30 圈会切进前后相邻的字，像把它们也圈进去了 | 圈压到重点自己的笔画上 |\n| tailGap 圈和批注的距离 | 64px | 过 110 批注像下一行正文 | 低于 40 拖尾太短，看不出是一笔 |\n\n## 已知坑\n\n- 楷体是系统字体（Windows 的 KaiTi、macOS 的 Kaiti SC），没有楷体的机器会退回正文字体，批注就不像手写了。出片前在渲染的那台机器上看一眼。\n- 批注超过 6 个字时，会被夹在字栏里往左挪，不再正对圈的中心，拖尾会斜着拉过去。批注写短，长的话放进旁白。\n- 圈只比重点宽一点，句子里前后紧挨的字难免被圈的弧线擦到一点。重点前后是标点或空格时最干净；擦到的是一个字的边，不影响读。\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n- 重点在第二行里找不到（写错一个字）时，整个第二行都被圈住，圈会变得又扁又长。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、说到重点时开始圈、圈是手画的（多绕、斜、不规整）、圈完才拖出批注、批注是手写的。\n\n只是皮：圈和批注的颜色、笔画粗细、楷体还是别的手写字体、圈的松紧、人站哪边、底色、要不要批注。\n\n## 接进片子\n\n- `line1` 铺垫（可空）、`line2` 带重点的那句、`key` 是 `line2` 里要被圈的那一段，一字不差。\n- `note`：圈下面的手写批注，6 个字以内；不需要时留空，拖尾也不画。\n- `hit`：对齐旁白说出重点第一个字的时刻（`align.py find` 查），相对这一镜的起点。第二行 1 秒才升起完，所以 `hit` 不早于 1 秒。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字和圈。\n- `side`：人在画面哪边。主持人本来就站在左边就写 `left`，字会放到右边。\n- 音效：圈的整段配一个 draw，批注出现时一个很轻的 pop。\n- 和 `host-arrows-focus` 是同一类标法，别在相邻两镜里连用；一段口播里先圈一个词、下一镜用 `host-quote-hold` 收成一句话。"},{"id":"host-corner-frame","name":"口播角框","group":"人物与口播","type":"host","intents":["host","definition","keyword"],"numbers":null,"chart":null,"one_line":"主持人站在一侧说“这个叫……”，另一侧一个大号术语在说出它的那一刻落下，两只角框沿对角线合拢、带一点咬合地锁住它，随后一行小字解释它是什么","use_when":"口播镜头里，主持人第一次给一个概念起名字（“这种现象叫幻觉”“这一步叫微调”），要让观众记住这个名词，而且主持人正在画面里","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":3,"sfx":"lock=tick, gloss=none","pairs_with":["host-circle-note","host-quote-hold"],"vars":[{"id":"lead","type":"string","label":"引子（可空）","default":"这种现象有个名字"},{"id":"term","type":"string","label":"被框住的术语（2–6 个字最好）","default":"幻觉"},{"id":"gloss","type":"string","label":"一句话解释（可空）","default":"模型把编出来的东西说得像真的"},{"id":"hit","type":"number","label":"说出术语的时刻（秒）","default":1.1},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"right"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.8,1.3,1.62,3],"doc":"## 命门\n\n1. **只框一个名词，名词要大。** 术语单独一行、最大 150px，比引子和解释大两倍以上；角框只框它自己的外框。框住半句话或者和正文一样大的词，读成“选中了一段文字”，不是“这东西有个名字”。\n2. **先出名词，再合框。** 术语在说出它的那一刻落下，角框晚 0.15 秒才开始合拢。框先到、字后来，像一个空的取景框在等内容，节奏反了。\n3. **两只角在对角线上，从外往里合。** 左上一只、右下一只，各沿对角线往里收 44px，用带一点回弹的缓动停住，读成“对焦锁定”。四只角一起出现读成按钮的描边；从里往外张开读成“放大”。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=1460（人在左时 460）；字在另一侧 760px 宽的一栏里，左边距 140（人在左时 1020），顶在 y=300。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.25 → 0.70s | 引子 | 上移 24px 淡入，52px、次要色 | power3.out |\n| 1.00 → 1.35s | 术语 | 从 0.9 倍放大到原大并淡入，最大 150px、最粗 | power3.out |\n| 1.15 → 1.27s | 两只角 | 淡入 | 线性 |\n| 1.15 → 1.57s | 两只角 | 左上那只从 (−44, −44) 收到位，右下那只从 (+44, +44) 收到位，离术语外框 26px | back.out(1.4) |\n| 1.80 → 2.25s | 解释 | 上移 20px 淡入，44px、次要色 | power3.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| travel 角框收进来的距离 | 44px | 过 70 左上那只会从引子底下穿过去 | 低于 24 看不出是合拢，像直接出现 |\n| lock 合拢用时 | 0.42s | 过 0.7 像慢慢飘过来，没有“锁住”的感觉 | 低于 0.25 回弹太快，像抖了一下 |\n| pad 角框离术语多远 | 26px | 过 50 框得太松，像框住了一块空地 | 低于 12 角压到字上 |\n| lockLag 说出术语后多久开始合框 | 0.05s | 过 0.4 观众已经读完名词，框像补的 | 负数时框先到，像空取景框 |\n| glossLag 说出术语后多久出解释 | 0.7s | 过 1.2 解释等太久，这一镜被拖长 | 低于 0.4 和合框挤在一起，抢了锁定那一下 |\n\n## 已知坑\n\n- 术语超过 4 个汉字就会缩字号（按 708px 估算）：5 个字 141px、6 个字 118px、8 个字只剩 88px，名词就不再压过别的字了。长名词拆成“简称 + 解释”，比如框“RAG”，解释里写全称。\n- 引子和术语之间留了 64px，是给左上那只角飞进来让路的；不要为了紧凑把这段距离改小，否则角会从引子底下扫过去，压过引子的那几帧字的对比度不够。\n- 解释超过 17 个字会缩字号，30 个字时只剩 25px，看不清。解释只写一句短话，长的交给旁白。\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、一个大号名词单独成行、名词先落下、两只角沿对角线从外往里合拢并带一点咬合、解释最后才出来。\n\n只是皮：角框的颜色、粗细和臂长、名词是正文色还是强调色、名词的落下方式（放大或者上移）、人站哪边、底色、有没有引子和解释。\n\n## 接进片子\n\n- `lead`：引子，“这种现象叫”“这一步有个名字”，可空。\n- `term`：要被框住的名词，2–6 个字最好。\n- `gloss`：一句话解释，可空；空的时候这一镜可以缩短到 2.5 秒。\n- `hit`：对齐旁白说出名词第一个字的时刻（`align.py find` 查），相对这一镜的起点；不早于 0.6 秒。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字和角框。\n- `side`：人在画面哪边，`left` 时字放到右边。\n- 音效：两只角合拢到位时一个短 tick；解释出来时不配音效。\n- 常接 `host-circle-note`：先给概念起名字，下一镜圈出它最关键的一点；或者接 `host-quote-hold` 收成一句结论。"},{"id":"host-cutout-pop","name":"人物弹入","group":"人物与口播","type":"host","intents":["host","hook"],"numbers":null,"chart":null,"one_line":"身后的强调色底形先张开，0.12 秒后抠像人物从画面底边被拉长着窜上来，冲过落点 46px 再坐回去，旁边的字等人站稳才出","use_when":"主持人或角色第一次登场，或者换了一个话题、要重新把注意力拉回到人身上","energy":"高","needs":["人","文"],"overlay":true,"slot":3,"hero":2.5,"sfx":"shape=whoosh, land=pop","pairs_with":["nameplate-in","reaction-bubble","host-side-board"],"vars":[{"id":"host","type":"string","label":"抠像人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"side","type":"enum","label":"人站在哪","default":"left"},{"id":"shape","type":"enum","label":"身后的底形","default":"circle"},{"id":"kicker","type":"string","label":"旁边的小标题（可空）","default":"这一期"},{"id":"title","type":"string","label":"旁边的标题（可空，7 字以内）","default":"我来带你做"},{"id":"note","type":"string","label":"旁边的说明（可空）","default":"从零开始，一步一步来"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.367,0.433,0.667,2.5],"doc":"## 命门\n\n1. **底形先到。** 底形 0.25 秒开始张开，人 0.37 秒才起跳。人先到，就是一张抠像图贴在空底上，边缘的毛糙全露出来；底形先到，人是“跳到台上”。\n2. **从底边来，冲过头再回落。** 人从画面底边以下窜上来，高过落点 46px，再用 0.38 秒坐回去。原地放大是“弹窗”，淡入是“幻灯片”，只有带过冲的上窜才像一个人蹦出来。\n3. **脚不能露。** 人物图的底边要一直在画面外。默认人物比落点多往下伸了 70px，过冲 46px 时底边还在画面下面 24px。过冲超过这个余量，会看到人的腰部被齐齐切断的那条线。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.25 → 0.55s | 底形 | 0 → 1.07，淡入 | power3.out |\n| 0.37 → 0.65s | 人物 | 从底边下方上窜 976px 到落点上方 46px；纵向拉长 1.10 → 1.04，横向 0.93 → 0.97，原点在脚下 | power3.out |\n| 0.55 → 0.89s | 底形 | 1.07 → 1 | back.out(2.2) |\n| 0.65 → 1.03s | 人物 | 落回原位，拉伸归 1 | back.out(2.6) |\n| 0.75 → 1.33s | 旁边三行字 | 从人这一侧位移 40px 淡入，每行隔 0.09s | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| lead 人比底形晚多少 | 0.12s | 过 0.3s 底形孤零零等着，像出了错 | 0 时两者糊成一下，没有“台子先搭好”的层次 |\n| up 上窜时长 | 0.28s | 过 0.45s 像升降台，不是蹦 | 低于 0.18s 只看到结果 |\n| over 过冲 | 46px | 不能超过 70（见命门 3）；想更夸张先把人物图往下多伸 | 低于 20px 落地发死 |\n| settle 回落时长 | 0.38s | 过 0.6s 像果冻 | 低于 0.25s 回弹看不出来 |\n| 起跳时的纵向拉长 | 1.10 | 过 1.2 人脸变形明显，真人抠像别超过 1.08 | 1.0 时是一张硬纸板在移动 |\n\n## 已知坑\n\n- 真人抠像对拉伸很敏感。插画角色用默认的 1.10 没问题，真人照片请把起跳拉伸降到 1.05 左右，否则脸会被看出拉长。\n- 人物图要是半身或大半身、底边是平切的。全身像（带脚）用这张卡会悬在半空，因为它默认底边在画面外。\n- 底形换成圆角块时，块的底边是伸出画面的，所以人和块在底部连成一体；圆形底形的下缘在 890px，人的身体会从圆的下面伸出来，这是有意的。\n- 人站中间时旁边没有地方放字，脚本会把三行字都隐藏。中间站位要配字，请叠一张 `nameplate-in`。\n- 标题 7 个字以内。字区从 1090px 起、宽 760px，104px 的字第 8 个会贴到右边。\n\n## 动效与皮的边界\n\n属于这张卡的：底形比人早 0.12 秒；人从底边以下带拉伸上窜、过冲、回落；字等人到顶之后才出。\n\n只是皮：底形是圆、圆角块还是别的形状，底形的颜色；人站左、中、右；旁边是三行字还是不放字。\n\n## 接进片子\n\n- 变量：`host` 抠像人物图（透明底、底边平切）；`side` 人站左、中、右；`shape` 底形；`kicker / title / note` 旁边的三行字，各自可空；`backdrop`。\n- 开始时间：卡的 0.37 秒（人起跳）对齐旁白的第一个字，或者对齐一个音乐重拍。\n- 音效：0.25 秒底形张开一个短的掠过声，0.65 秒人冲到顶的那一帧一个弹出声。\n- 常见接法：人站稳后接 `nameplate-in` 报名字；或者接 `reaction-bubble` 让他马上被问一句。"},{"id":"host-myth-fact","name":"口播纠错","group":"人物与口播","type":"host","intents":["host","caution","compare"],"numbers":null,"chart":null,"one_line":"主持人站在一侧说“很多人以为……”，另一侧那句错的说法先完整出现，被一笔划掉后退成灰色；停半拍，对的说法在它下面升起，关键几个字是强调色","use_when":"口播镜头里，主持人先摆出一个常见误解再纠正它（“很多人以为……其实……”），而且主持人正在画面里","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":3,"sfx":"strike=draw, reveal=pop","pairs_with":["host-quote-hold","host-corner-frame"],"vars":[{"id":"lead","type":"string","label":"引子（可空）","default":"很多人以为"},{"id":"myth","type":"string","label":"错的说法（会被划掉）","default":"AI 在思考"},{"id":"fact","type":"string","label":"对的说法","default":"其实它在猜下一个字"},{"id":"factKey","type":"string","label":"对的说法里标成强调色的一段（可空）","default":"猜下一个字"},{"id":"strike","type":"number","label":"开始划掉的时刻（秒）","default":1.3},{"id":"reveal","type":"number","label":"对的说法出现的时刻（秒）","default":2.1},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"right"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,1,1.45,1.95,3],"doc":"## 命门\n\n1. **错的先说完整、用正文色。** 误解先以正常的样子站住，观众得先“信”它一下，划掉才有反转。一出来就是灰的、或者一出来就带着删除线，读成“这是个反例”，没有纠正的那一下。\n2. **先划，再变灰，再出对的。** 划线 0.3 秒画完，误解才退成灰色；对的说法至少再晚半秒才升起。三件事挤在同一刻，观众来不及看清被划掉的是什么。\n3. **错的和对的上下对齐、一样大。** 两句同一个字号、左边对齐，对的在下面。对的写得比错的大，读成“标题和副标题”；左右摆放，眼睛要来回扫，比不出差别。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=1460（人在左时 460）；字在另一侧 760px 宽的一栏里，左边距 140（人在左时 1020），顶在 y=300。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.25 → 0.70s | 引子 | 上移 24px 淡入，52px、次要色 | power3.out |\n| 0.55 → 1.00s | 错的说法 | 上移 28px 淡入，最大 84px、正文色 | power3.out |\n| 1.30 → 1.60s | 划线 | 从左端外 12px 起笔，略往上爬，划到右端外 12px，中段向上鼓 | power2.out |\n| 1.60 → 1.90s | 错的说法 | 从正文色退成次要色 | power1.out |\n| 2.10 → 2.55s | 对的说法 | 上移 26px 淡入，和错的同一字号；关键几个字是强调色 | power3.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| cut 划线用时 | 0.3s | 过 0.6 像慢慢画了一条线，没有“否掉”的干脆 | 低于 0.15 一闪而过，看不出是划的 |\n| over 划线超出两端 | 12px | 过 40 划线伸进别的地方，像画面上的分割线 | 0 时两头刚好卡在字上，像删除线格式 |\n| dim 变灰用时 | 0.3s | 过 0.7 变灰拖到对的说法出来，两句抢 | 0 时一下变灰，像换了一张图 |\n| gapMin 划完到出对的最少间隔 | 0.5s | 过 1 这一镜变长、口播等字 | 低于 0.3 看不清被划掉的是什么 |\n| fsMax 两句的最大字号 | 84px | 过 96 长一点的句子就要缩字号，两句对不齐 | 低于 64 在人旁边显得小 |\n\n## 已知坑\n\n- 两句按较长的那句定字号（按 760px 估算）：9 个字以内是 84px，12 个字 63px。对的说法写长了，错的说法也会跟着变小。\n- `reveal` 早于“划完再过 0.5 秒”时，会被推后到那个时刻，旁白就会比字快；把纠正那句话的旁白往后放一点，或者把 `strike` 提前。\n- 划线压在字上，所以错的说法上标了 `data-layout-allow-occlusion`。换成别的版式（比如让划线避开字）时，这个豁免要一起去掉。\n- 关键几个字（`factKey`）在对的说法里找不到时不标强调色，整句都是正文色。\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、错的先完整出现、一笔划掉后才变灰、停半拍、对的在下面同样大小地出来。\n\n只是皮：划线的颜色、粗细、弯度，变灰的颜色，对的说法里强调哪几个字，人站哪边，底色，有没有引子。\n\n## 接进片子\n\n- `lead`：引子，“很多人以为”“你可能听说过”，可空。\n- `myth`：被纠正的那句说法；`fact`：对的说法；`factKey`：对的说法里最关键的一段，一字不差，可空。\n- `strike`：对齐旁白说出“其实”“但”这类转折词的时刻；`reveal`：对齐说出对的说法第一个字的时刻（都用 `align.py find` 查，相对这一镜的起点）。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字和划线。\n- `side`：人在画面哪边，`left` 时字放到右边。\n- 音效：划线一个短 draw，对的说法出来时一个轻 pop。\n- 和 `strike-swap` 的区别：那张是在句子里原地换词、压在别的画面上也能用；这张是整屏口播，两句话都留在屏幕上做对比。常接 `host-quote-hold` 把对的说法收成一句结论。"},{"id":"host-quote-hold","name":"口播金句","group":"人物与口播","type":"host","intents":["host","conclusion","keyword"],"numbers":null,"chart":null,"one_line":"主持人站在一侧说话，另一侧两三行字踩着旁白逐行升起；最后的金句更粗更大，落定后一支荧光笔从左往右划过它，铺垫退成次要色，整屏停住","use_when":"口播镜头里，主持人用一两句铺垫引出一句结论，这句话要观众记下来，而且主持人正在画面里","energy":"低","needs":["人","文"],"overlay":true,"slot":4,"hero":3.2,"sfx":"pen=draw","pairs_with":["host-arrows-focus"],"vars":[{"id":"lines","type":"string","label":"几行字（用 | 分隔，2–3 行，最后一行是金句）","default":"你现在觉得难受|不是因为你不行|是因为你正在走出舒适区"},{"id":"cues","type":"string","label":"每行出现的秒数（逗号分隔，不够就均匀排开）","default":"0.3,1.1,1.9"},{"id":"mark","type":"number","label":"给第几行划荧光笔（0 = 最后一行）","default":0},{"id":"host","type":"string","label":"人物素材（透明底视频或图片，从项目根目录写起）","default":"motion-cards/lib/samples/presenter.png"},{"id":"hostKind","type":"enum","label":"人物素材是什么","default":"auto"},{"id":"side","type":"enum","label":"人在哪一边","default":"right"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.8,1.5,2.45,3.2],"doc":"## 命门\n\n1. **每一行踩着旁白出来。** 一行字在主持人说出它第一个字的那一刻升起（`cues`）。字比话早，观众先读完再听，口播成了念稿；字比话晚，像字幕跟不上。\n2. **荧光笔等金句站稳了再下笔。** 金句升起后 0.3 秒才开始划。跟着字一起出来，笔读成字的入场装饰，不是“这句要记住”。\n3. **只划一句。** 铺垫在下笔的同时退成次要色，整屏只剩一个重点。两句都划、或者铺垫还是正文色，观众不知道哪句是结论。\n\n## 动作拆解\n\n主持人放在一个 1100×900 的框里，贴着画面底边，人脸中线在 x=1460（人在左时 460）；字在另一侧 760px 宽的一栏里，左边距 140（人在左时 1020），三行时顶在 y=300，两行时往下挪 50。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 起 | 主持人 | 一直在，视频从第 0 秒开始播 | — |\n| 0.3 → 0.75s | 第一行 | 上移 26px 淡入，64px | power3.out |\n| 1.1 → 1.55s | 第二行 | 同上 | power3.out |\n| 1.9 → 2.35s | 金句 | 同上；字重加粗，最大 72px | power3.out |\n| 2.2 → 2.7s | 荧光笔 | 从左往右展开，盖住金句下半截，比字两头各多出 10px | power2.out |\n| 2.2 → 2.6s | 铺垫两行 | 从正文色退成次要色 | power1.out |\n| 2.7s 起 | 整屏 | 不再动，停到这一镜结束 | — |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| penLag 金句升起后多久下笔 | 0.3s | 过 0.6 观众已经读完了，笔来得像补一句 | 0 时笔和字一起出来，像入场装饰 |\n| pen 荧光笔划多久 | 0.5s | 过 0.9 像慢慢涂，拖住了这一镜的收尾 | 低于 0.25 一闪而过，看不出是划出来的 |\n| gold 金句最大字号 | 72px | 过 84 和铺垫差太多，像两张卡拼在一起 | 和铺垫一样大时，金句只靠荧光笔撑 |\n| rise 每行升起 | 0.45s | 过 0.7 字慢慢飘上来，跟不上语速 | 低于 0.25 像闪现 |\n| minGap 两行最小间隔 | 0.45s | 旁白说得快时，后面的行被推得越来越晚 | 低于 0.3 两行几乎同时升起，读成一块 |\n\n## 已知坑\n\n- `cues` 只给一个数时，后面的行按 0.8 秒一行往后排；给了两个以上，按它们的平均间隔补齐。两行挨得比 0.45 秒还近，后一行会被推后。\n- 金句超过 10 个字会按 760px 一栏缩字号：11 个字 69px，14 个字只剩 54px。再长就删字，或者拆成两屏。\n- 默认字是深色的正文色。`backdrop` 写 `off` 压在偏暗的实拍上时字会看不清，这时给项目换深色皮（`--mc-ink` 用浅色）。\n- 卡里的人物视频每次挂载都从第 0 秒播，而且同一张卡在一个工程里只有第一次挂载的视频有画面（HyperFrames 0.8.174 实测，换文件、改 id 都不行；图片不受影响）。一段口播要连续对口型、或者同一张卡要用两次以上时，把主持人视频放在主时间轴的一层（写法见 README「人物卡」），卡里 `host` 留空、`backdrop` 写 `off`。只用一次时可以直接填 `host`，素材至少和这一镜一样长：`episode.py media \u003c项目> \u003c原片> --start \u003c秒> --duration \u003c秒>` 截一段放进工程。\n- `mark` 指到第一行时，金句先出来，后面的行一出现就是次要色。这是有意的：后面的话是给金句做注解的。\n\n## 动效与皮的边界\n\n属于这张卡的：人和字各占一边、每行踩着旁白出现、只有金句被划、等金句落定再划、铺垫同时退下去、划完整屏停住。\n\n只是皮：字号、荧光笔的颜色深浅和高低、铺垫退成什么颜色、人站哪边、底色、行距。\n\n## 接进片子\n\n- `lines`：铺垫和金句，用 `|` 分开，最多三行；默认最后一行是金句，`mark` 写 1–3 可以指定别的行。\n- `cues`：每行出现的秒数，相对这一镜的起点，对齐主持人说出这一行第一个字的时刻（`align.py find` 查）。\n- `host`：本期主持人的透明底视频或图片，从项目根目录写起；`hostKind` 默认按扩展名自动判断（png、jpg、webp 当图片，其余当视频）；主持人已经在下面一层铺满播放时把 `host` 留空（或者 `hostKind` 写 `none`），`backdrop` 写 `off`，这张卡只留字。\n- `side`：人在画面哪边，`left` 时字放到右边。\n- 音效：荧光笔下笔时一个短 draw；金句本身不配音效，把重音留给旁白。\n- 常接在 `host-arrows-focus` 后面：先指住一个重点，再收成一句结论。也适合作为一段口播的最后一镜，后面直接切章节。"},{"id":"host-side-board","name":"人旁白板","group":"人物与口播","type":"host","intents":["host","steps"],"numbers":null,"chart":null,"one_line":"居中的主持人先向一侧滑开并略微缩小，他刚离开的位置长出一块内容板，板上的条目一条条跟着出现","use_when":"主持人要一边讲一边列清单（准备什么、分几步、注意哪几点），条目是跟着旁白一条条念出来的","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":3.4,"sfx":"slide=whoosh, item=tick","pairs_with":["host-to-chip","split-host-content","nameplate-in"],"vars":[{"id":"host","type":"string","label":"人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"side","type":"enum","label":"人让到哪一侧","default":"left"},{"id":"heading","type":"string","label":"板上的标题（可空）","default":"上手前先备好"},{"id":"items","type":"string","label":"条目，用 | 分开（2–4 条）","default":"一段示例素材|一句明确的目标|十分钟不被打断"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.8,1,1.467,3.4],"doc":"## 命门\n\n1. **人先让，板后开。** 人在 0.50 秒起步，板 0.70 秒才开始展开，差 0.2 秒。板先开会从人身上“穿”出来；同时开读成两个不相干的东西各动各的。\n2. **板从人这一侧的边长出来。** 板是从靠近人的那条边向外擦开的，还带着 90px 的同向位移。从远端滑进来的板像是另一页幻灯片，和人没有关系。\n3. **条目晚于板。** 第一条在板完全展开的那一刻（1.20 秒）才出现，之后每 0.24 秒一条。条目和板一起出来，观众只会看到“一块东西出现了”，不会逐条读。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.50s | 人 | 居中，比落定时大 8% | — |\n| 0.50 → 1.10s | 人 | 横移 510px 到一侧，1.08 → 1，原点在脚下 | power3.inOut |\n| 0.70 → 1.20s | 内容板（宽 940px，画面的 49%） | 从靠人的边向外擦开，同时位移 90px 归位 | power3.out |\n| 0.92 → 1.27s | 板标题（84px） | 位移 30px 淡入 | power3.out |\n| 1.00 → 1.30s | 标题下短线 | 从左画到右 | power2.out |\n| 1.20 / 1.44 / 1.68s | 每条的序号（92px 的圆，字 50px） | 0 → 1 弹出 | back.out(2.6) |\n| 序号后 0.06s | 每条的文字（66px，每条高 150px） | 位移 40px 淡入，0.32s | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| slide 人滑开时长 | 0.6s | 过 0.9s 像慢慢被推走，拖节奏 | 低于 0.4s 人像被弹开 |\n| big 居中时的放大 | 1.08 | 过 1.15 落定时缩得太明显，像镜头在拉 | 1.0 时人只是平移，少了“退后一步”的意思 |\n| boardLag 板的滞后 | 0.2s | 过 0.4s 人到位了板还没来，中间空一拍 | 0 时板从人身上穿过 |\n| gap 条目间隔 | 0.24s | 对着旁白念的话改成每条的实际间隔（1 秒左右也可以） | 低于 0.15s 等于一起出 |\n| 人的落定位置 | 左边 110px 起、宽 680（板从 890px 起，右边留 90px） | — | 人宽低于 500 时存在感太弱，不如换角标 |\n\n## 已知坑\n\n- 人滑到一半时（0.8 秒前后）会压在板的左缘上。那一刻板上还没有字，所以没问题；如果把标题提前到 0.8 秒之前出，字会被人挡住。\n- 条目文字是单行不换行的，板内序号右边可用宽度约 700px，66px 的字最多放 10 个；标题 84px，最多 9 个字。更长的要拆短，条目不要缩到 48px 以下、标题不要缩到 56px 以下。\n- 条目最多 4 条。4 条时板高 880px 左右，上下各剩 100px，再多会顶到画面上下边；超过 4 条分两屏。\n- 序号是深色字压在强调色圆上。它不能跟着整行一起淡入：淡到一半时深字压在深底上，对比度不够。所以序号是不透明地从 0 放大出来的，文字单独淡入。\n- 人物图要是透明底。带背景的方图会在滑动时露出一个矩形的边。\n\n## 动效与皮的边界\n\n属于这张卡的：人先动 0.2 秒；人既让位置也让大小；板从靠人的边擦开；条目在板开完之后逐条出现。\n\n只是皮：人身后的圆、板的底色圆角阴影、序号是圆是方、标题下那条短线、字体字号。板里换成一张图或一段代码也成立，只要它晚于板出现。\n\n## 接进片子\n\n- 变量：`host` 人物图；`side` 人让到左还是右（板在另一侧）；`heading` 板标题，可空；`items` 条目，用 `|` 分开，2–4 条；`backdrop`。\n- 开始时间：卡的 0.5 秒对齐旁白里引出清单的那句话（“需要准备三样东西”）。条目要严格对旁白时，把 `gap` 改成每条念出的间隔。\n- 音效：0.5 秒人滑开时一个掠过声；每条序号弹出时一个轻的滴答声。\n- 常见接法：讲完清单后用 `host-to-chip` 把人收到角上，接着逐条展开讲。"},{"id":"host-to-chip","name":"人缩成角标","group":"人物与口播","type":"host","intents":["host","software"],"numbers":null,"chart":null,"one_line":"满屏的主持人画面向一个角收拢成圆形头像，到位时弹一下坐稳，随后头像外圈按说话的节奏一圈圈往外荡，画面中间让给内容","use_when":"主持人开场说完一句，接下来要长时间讲图、讲字或讲录屏，但还想让观众知道“是这个人在讲”","energy":"中","needs":["人","文"],"overlay":true,"slot":4,"hero":2,"sfx":"shrink=whoosh, dock=pop","pairs_with":["pip-corner","host-side-board","nameplate-in"],"vars":[{"id":"host","type":"string","label":"人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"corner","type":"enum","label":"缩到哪个角","default":"br"},{"id":"size","type":"number","label":"头像直径（px）","default":260},{"id":"kicker","type":"string","label":"让出来的内容：小标题（可空）","default":"先看结论"},{"id":"title","type":"string","label":"让出来的内容：标题（可空）","default":"三步就能复现"},{"id":"note","type":"string","label":"让出来的内容：说明（可空）","default":"人退到角上，继续讲"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.9,1.067,2,3.6],"doc":"## 命门\n\n1. **人先走，内容后到。** 画面在 0.70 秒开始收，内容 1.00 秒才升起来，差 0.3 秒。两者同帧动，观众分不清是“人让位”还是“换了一页”；内容先到，字会被还没缩完的画面盖住。\n2. **脸一路都在框里。** 画面收拢时，人物同步从“全身居中”变成“头肩占满圆”。只缩外框不动人，缩到最后圆里是一截胸口，读成一个色块而不是一个人。\n3. **声波环不匀。** 六圈的幅度是 1.30 / 1.16 / 1.38 / 1.20 / 1.34 / 1.14，一大一小错开。等幅等速的环读成“加载中”，不是“在说话”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.70s | 满屏人物 | 停住，先让观众认出人 | — |\n| 0.70 → 1.25s | 外框 | 1920×1080 → 直径 260 的圆，同时整体缩到 0.86 倍；圆角 0 → 130 | power3.inOut |\n| 0.70 → 1.25s | 人物和身后底形 | 人从宽 800、居中，变到宽 312、头在圆心偏上；底形跟着铺满圆 | power3.inOut |\n| 0.70 → 1.55s | 外框的边距 | 贴角 0 → 离边 70px，略晚到，带一点过头 | back.out(1.5) |\n| 1.00 → 1.66s | 内容三行 | 上移 44px 淡入，每行隔 0.08s | power3.out |\n| 1.25 → 1.55s | 外框 | 0.86 → 1，“卡”进位置 | back.out(2.6) |\n| 1.55s 起，每 0.34s 一次 | 两圈声波环 | 从头像边缘放大到各自幅度并淡出；第二圈晚 0.06s、走得更远 | power1.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| at 满屏停留 | 0.7s | 过 1.5s 应该直接用实拍，别用这张卡撑时间 | 低于 0.4s 还没认出人就缩走了 |\n| shrink 收拢时长 | 0.55s | 过 0.8s 像幻灯片缩放，中间的方圆过渡形状看得太清楚 | 低于 0.35s 像跳切 |\n| under 到位前的大小 | 0.86 | 接近 1 就没有“卡进去”的那一下 | 低于 0.75 弹得像玩具 |\n| lag 内容滞后 | 0.3s | 过 0.6s 中间有一段空屏 | 0 时人和字抢同一拍 |\n| beat 一圈声波 | 0.34s | 过 0.5s 像心跳 | 低于 0.22s 像抖动 |\n| size（变量） | 260px | 360 以上开始和内容抢画面 | 180 以下脸只有四十来像素，看不出是谁 |\n\n## 已知坑\n\n- 圆里的人物是按“头在图片上方 22% 处、头宽约为图宽 37%”摆的。换成头特别大的插画角色或半身更长的抠像，要改脚本里人物落定的四个数（`S * 1.2`、`S * 1.5`、`-S * 0.1`、`S * 0.1`），不然圆里不是脸。\n- 声波环最远会荡到头像外 62px，默认边距是 70px。把 `margin` 改小或把幅度改大，环会被画面边缘切掉。\n- 满屏阶段是一张静帧。要缩的是正在播放的口播视频时，把遮罩里的人物节点换成宿主项目里的视频节点，动作不变。\n- 内容标题超过 9 个字会伸到头像下面去（右下角时）。长标题把头像放到上面两个角，或缩小字号。\n- 声波环的次数是写死的六圈。口播更长时按旁白时长加 `amps` 里的数，不要用无限循环。\n\n## 动效与皮的边界\n\n属于这张卡的：人先动、内容晚 0.3 秒；外框和人物同步变形，脸始终在框内；到位前略小再弹到位；幅度不匀的声波环。\n\n只是皮：身后的强调色底形、满屏阶段的底色、头像的白边粗细、环的颜色和线宽、让出来的内容是三行字还是别的东西。\n\n## 接进片子\n\n- 变量：`host` 人物图（透明底）；`corner` 四个角选一个；`size` 头像直径；`kicker / title / note` 让出来的三行字，留空就不显示，全空时这张卡只负责“人缩走”，内容由下一层别的卡来出；`backdrop` 填 `off` 时内容区透明。\n- 开始时间：卡的 0.7 秒对齐旁白里“我们来看……”这类转折词。\n- 音效：0.70 秒一个短的掠过声，1.25 秒到位时一个轻的弹出声。声波环不配音。\n- 常见接法：前面用 `nameplate-in` 介绍人，这张卡把人送到角上，后面接任何内容卡；头像可以一直留到这一段讲完。"},{"id":"input-typing","name":"输入框打字","group":"证据与界面","type":"evidence","intents":["software"],"numbers":null,"chart":null,"one_line":"一个大输入框获得焦点，提示词按意群一段一段打出来，段内连贯、段间换一口气；打完停 0.3 秒，发送按钮才亮起并弹一下","use_when":"旁白在念一条提示词、搜索词或指令，要让观众逐段看清“到底输入了什么”","energy":"中","needs":["文"],"overlay":true,"slot":5,"hero":4.4,"sfx":"typing=type, arm=chime","pairs_with":["chat-bubbles","cursor-click","typewriter-line"],"vars":[{"id":"text","type":"string","label":"提示词（用 | 按意群分段，总长两行以内）","default":"帮我把这份会议记录|整理成三条要点，|每条不超过二十个字，|最后列出待办事项。"},{"id":"hint","type":"string","label":"空输入框里的占位字","default":"在这里描述你想要的结果…"},{"id":"cap","type":"string","label":"输入框上方的小字（可空）","default":"提示词 · 示例"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.9,2,3.2,4.4],"doc":"## 命门\n\n1. **按意群停顿。** 每段内部每秒 18 个字连着出，段与段之间停 0.3 秒。从头到尾匀速，是打印机；每个字随机快慢，是抖动。人打字是想好一小段、打出来、再想下一段。\n2. **停顿落在语义断点上。** 分段符放在逗号后面、短语之间，而且每段和旁白的一个气口对齐。断在词中间（“会议记|录”）比不断还糟，读起来像卡壳。\n3. **按钮等字停了才亮。** 发送按钮在最后一个字之后 0.3 秒才从灰变成强调色。字还在出的时候按钮就亮着，这个画面就没有“写完了”的终点。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.25 → 0.45s | 输入框边线 | 换成强调色（获得焦点） | 线性 |\n| 0.5 → 1.0s | 第 1 段（9 字） | 逐字出现；第一个字出现时占位字消失 | 线性，取整 |\n| 1.3 → 1.74s | 第 2 段（8 字） | 逐字出现 | 同上 |\n| 2.04 → 2.6s | 第 3 段（10 字） | 逐字出现 | 同上 |\n| 2.9 → 3.4s | 第 4 段（9 字） | 逐字出现 | 同上 |\n| 3.7 → 3.84s | 发送按钮 | 灰底换成强调色，箭头换成深色 | 线性 |\n| 3.7 → 3.82 → 4.12s | 发送按钮 | 缩放 1 → 1.16 → 1 | power2.out，再 back.out(2.4) |\n| 4.2s 起 | 光标 | 闪 3 次后常亮 | 瞬间切换 |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| cps 段内速度 | 18 字/秒 | 过 30 一段字像是贴上去的 | 低于 10 段内也在一个字一个字蹦，意群感消失 |\n| pause 段间停顿 | 0.3s | 过 0.6s 像打字的人走神了 | 低于 0.15s 和段内速度分不开，等于匀速 |\n| arm 写完到按钮亮 | 0.3s | 过 0.8s 观众已经移开视线 | 0 时按钮和最后一个字抢同一帧 |\n| pop 按钮弹起 | 1.16 | 过 1.3 抢了文字的戏 | 1.0 只变色不动，容易漏看 |\n| 字号（样式里） | 72px | 一行放 21 个字，放不下时宁可减字 | 低于 56px 输入框显得空，字像备注 |\n\n## 已知坑\n\n- 输入框是 1720×520（画面宽的 90%），上下居中（300–820px），小字在它上方 214px 处。文字只留了两行的位置：72px 字、行高 108px，发送按钮占了右下角 132px。写到第三行，右边会顶到按钮。提示词超过 42 个字就拆成两次输入，或者把框的高度和按钮位置一起改。\n- 文字是靠时间轴的 `onUpdate` 写进去的；几段补间驱动同一个数值，只有第一段可以立即渲染，否则挂载时数值会被最后一段的起点覆盖，第一帧就出现大半句话。\n- 换行会跳：一行快满时，新出的字会把整个词带到下一行。中文基本看不出；夹着长英文单词时会看到单词在行尾闪一下再掉下去，把分段符放在那个单词前面可以盖住。\n- 占位字和正文不能同时在场。占位字的显示隐藏是跟着已出字数走的，不是另一条淡出补间，这样时间轴倒着拖也不会出现两行字叠在一起。\n- 分段符 `|` 本身不显示。提示词里真的要出现竖线时，这张卡现在处理不了，得改脚本里的分隔符。\n\n## 动效与皮的边界\n\n属于这张卡的：段内连贯、段间停顿的节奏，停顿对齐语义断点，按钮在文字停止之后才亮。\n\n只是皮：输入框的圆角、边线和阴影，发送按钮的形状和图标，占位字的文案，上方的小标题，光标的颜色。\n\n## 接进片子\n\n- 变量：`text` 提示词，用 `|` 分段（每段对应旁白的一个气口，总长两行以内）；`hint` 占位字；`cap` 框上方的小字，编出来的内容写“示例”；`backdrop`。\n- 开始时间对齐旁白开始念这条提示词之前 0.5 秒。段数和每段字数变了，后面的时刻都会跟着变：一段的时长是字数 ÷ 18 秒，再加 0.3 秒停顿。\n- 音效：每一段配一小串打字声，停顿处留空；按钮亮起（默认 3.7 秒）配一个轻的提示音。\n- 接法：按钮亮了以后接 `cursor-click`（透明模式）去点它，再切到 `chat-bubbles` 看回答。"},{"id":"iris-close","name":"圈入圈出","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"画面四周的暗幕向指定的一点收成一个越来越小的圆直到全黑，停两帧，再从同一点张开露出下一镜","use_when":"一段内容讲完要收尾，或者要把注意力先收到画面里的一个点、再从那个点展开下一段","energy":"中","needs":["无"],"overlay":true,"slot":2,"hero":0.934,"sfx":"close=whoosh, open=rise","pairs_with":["spotlight-dim","chapter-numeral"],"vars":[{"id":"ox","type":"number","label":"圆心横向 0–1","default":0.5},{"id":"oy","type":"number","label":"圆心纵向 0–1","default":0.5},{"id":"hold","type":"number","label":"全黑停几帧（1–6）","default":2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.934,1.034,1.167,1.6],"doc":"这是一个叠加层：一张中间开了圆洞的暗幕压在两镜上面，洞收到 0 时画面全遮，换镜发生在这时。\n\n## 命门\n\n1. **收和开是同一个圆心。** 洞在哪里消失，就在哪里重新张开，观众的视线不用搬家，读成“从这一点进入下一段”。两个圆心不一样，中间的全黑就成了两段无关画面之间的黑场。\n2. **越收越快，张开时先快后慢。** 收用 power2.in，最后两帧走掉 44% 的半径，圆是“啪”地合上的；开用 power2.out。反过来（收得越来越慢）会在一个小圆上逗留，变成“特写某个东西”，不再是转场。\n3. **洞边有一圈亮色。** 暗幕和暗画面之间没有边界，圆收到一半时看不出形状。亮边的宽度跟着半径缩（半径的 2.2%），收到点时自然消失，不会留一个亮点。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（洞刚合上的那一帧）。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.733 → 1.0s | 洞的半径 | 从刚好够到最远的画面角 → 0 | power2.in |\n| 1.0 → 1.067s | 暗幕 | 全遮（`hold` = 2 帧） | — |\n| 1.067 → 1.367s | 洞的半径 | 0 → 刚好够到最远的角 | power2.out |\n\n宿主把两镜的交界对在卡内 **1.033 秒**。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| close 收拢时长 | 0.267s | 过 0.5s 是老电影的落幕感，适合全片结尾，不适合中途 | 低于 0.17s 看不出是圆 |\n| open 张开时长 | 0.3s | 过 0.5s 下一镜被挡太久 | 低于 0.2s 像弹窗 |\n| hold（变量） | 2 帧 | 5–6 帧有“隔了一段时间”的意思 | 1 帧有漏镜风险 |\n| rim 亮边 | 半径 × 2.2% | 过 5% 像瞄准镜 | 1.0（没有边）在暗画面上看不出圆 |\n| ox / oy（变量） | 0.5, 0.5 | — | 贴近角落时起始半径更大，同样时长下收得更猛 |\n\n## 已知坑\n\n- 暗幕用的是底色（`--mc-bg`）。浅色皮下它是一张浅色的幕，全遮那两帧是一片亮，和“收黑”的预期相反；浅色皮下要么接受“收白”，要么单独把幕色改深。\n- 圆心要对准上一镜里真的有东西的位置（人脸、按钮、数字）。对着一片空白收，观众不知道为什么是那里。\n- 洞是渐变画的，半径大时亮边的两条边缘都是硬边，1080p 下干净；如果宿主把整段再放大（比如外层又套了推镜），边缘会出锯齿。\n- 下一镜的主体不在圆心附近时，张开的前几帧只看到一块背景。要么把圆心定在两镜主体都在的位置，要么让下一镜的主体晚 0.2 秒再动。\n\n## 动效与皮的边界\n\n属于这张卡的：同一个圆心的收和开、收拢加速张开减速、全遮停 2 帧。\n\n只是皮：幕的颜色、有没有亮边和亮边颜色、圆心位置、停几帧。\n\n## 接进片子\n\n- 变量：`ox` `oy` 圆心（0–1，相对画面宽高），`hold` 全遮帧数，`backdrop` 在片子里填 `off`。\n- 对齐：这段的起点 = 两镜交界 − 1.033 秒，时长 2 秒，轨道压在两镜上面。\n- 音效：收拢时一个向内收的掠过声，结束在 1.0 秒；张开时一个轻的上扬声。\n- 常见接法：先用聚光压暗把注意力引到一个点，再从这个点圈出；圈入之后接新章节的标题。"},{"id":"kicker-headline","name":"小标带大标","group":"标题与章节","type":"structure","intents":["question","chapter"],"numbers":null,"chart":null,"one_line":"一行引子小字先独自站在画面正中，随后上移缩小让出位置，大标题晚四分之一秒从它刚离开的地方长出来","use_when":"旁白是“铺垫 + 结论”两段式：先一句引子（提问、现象、误区），停一下，再说出真正的标题","energy":"中","needs":["文"],"overlay":true,"slot":3.5,"hero":3.2,"sfx":"kicker=tick, headline=pop","pairs_with":["outline-fill-title","word-punch"],"vars":[{"id":"kicker","type":"string","label":"引子小字","default":"很多人第一步就错了"},{"id":"headline","type":"string","label":"大标题（建议 5–9 个字）","default":"先别急着写提示词"},{"id":"give","type":"number","label":"小字让位的时间（秒）","default":1.1},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.15,0.9,1.3,1.43,3.2],"doc":"## 命门\n\n1. **同一个位置，先后两个主人。** 小字最初站的地方正好是大标题的中心（比它最终位置低 171px）。小字一开始就待在上面，大标题就只是在它下方出现，没有“让位”。\n2. **大标题晚 0.26 秒。** 小字开始上移 0.26 秒后（已经走了一半多）大标题才冒头。同时动，两行字会在中间撞在一起；晚过 0.5 秒，两个动作脱节，变成两张卡。\n3. **长出来，不是飘进来。** 大标题原地从 0.4 倍放大到 1，前 0.1 秒就涨到 0.85，没有位移。给它加上滑入，“从小字原来的位置长出来”的因果就断了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.50s | 小字 | 在画面中心偏下 24px 处升起淡入，保持 1.3 倍 | power3.out |\n| 1.10 → 1.60s | 小字 | 上移 171px，同时 1.3 倍缩回 1 倍 | power3.inOut |\n| 1.36 → 1.48s | 大标题 | 透明度 0 → 1 | 线性 |\n| 1.36 → 1.86s | 大标题 | 以自身中心从 0.4 倍放大到 1 倍 | expo.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| give 小字让位的时间（变量） | 1.1s | 引子越长越要往后放，给够读完的时间 | 低于 0.5s 小字还没读完就走了 |\n| lag 大标题滞后 | 0.26s | 过 0.5s 脱节 | 低于 0.2s 两行字的外框会叠上 |\n| kickBig 小字独处时的倍数 | 1.3 | 过 1.6 小字比大标题还像标题 | 1.0 时独处阶段画面太空 |\n| headFrom 大标题起始倍数 | 0.4 | 过 0.7 看不出“长” | 低于 0.2 像从一个点炸开 |\n| yield 让位时长 | 0.5s | 过 0.8s 小字走得犹豫 | 低于 0.3s 小字是被弹走的 |\n\n## 已知坑\n\n- 第一版 `lag` 是 0.14 秒，连拍里 1.35 秒那一帧小字正压在半透明的大标题上，两行糊在一起。算过两行外框的位置之后改成 0.26 秒，并把大标题起始倍数从 0.5 降到 0.4。\n- `lift`（171px）不是随手填的：它等于小字行高的一半 32 + 行距 44 + 大标题行高的一半 95。改了任何一个行高或行距，都要重算，否则小字起始位置不在大标题中心。\n- 小字的进场和让位是同一个节点的两段动作，第二段必须用 `to` 接。两段都写成 `fromTo`，后一段会在时间轴开头就把小字摆到错误的位置。\n- 大标题超过 10 个字（约 1560px）时，0.4 倍起始已经有 620px 宽，小字从它上面经过时两侧的短横会被挡。长标题先减字。\n- 小字两侧的短横和文字是同一个弹性行，文字为空时只剩两条横线；没有引子就不要用这张卡。\n\n## 动效与皮的边界\n\n属于这张卡的：小字先占着大标题的位置、上移缩小让位、大标题滞后并原地放大。\n\n只是皮：小字是强调色还是灰色、两侧短横有没有，大标题的字体字重，整组居中还是靠左（靠左时把大标题的放大原点改到左侧）。\n\n## 接进片子\n\n- 变量：`kicker` 引子；`headline` 大标题；`give` 小字开始让位的秒数；`backdrop`。\n- 对齐：起点对在引子第一个字之前 0.2 秒；`give` 填引子念完的时刻，大标题会在其后 0.26 秒出现，正好接旁白的下一句。\n- 音效：小字出现时一个轻的滴答；大标题冒头（`give` + 0.26 秒）一个弹出声。\n- 连用：大标题落定后可以接 `word-punch` 强调其中一个词，或在下一镜用 `outline-fill-title` 给出答案。"},{"id":"label-callout","name":"引线标签","group":"标注与手绘","type":"evidence","intents":["point","definition"],"numbers":null,"chart":null,"one_line":"目标边上先钉下一个圆点，一条折线从圆点引到空白处，线一到头就从线尾推出一块写着名字的标签牌","use_when":"画面里的东西需要一个名字或一句解释（部件名、字段含义、状态），而且文字不能盖在它身上","energy":"低","needs":["界面","文"],"overlay":true,"slot":3,"hero":2,"sfx":"dot=pop, plate=whoosh","pairs_with":["bracket-frame","media-pop"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":276},{"id":"w","type":"number","label":"目标宽","default":440},{"id":"h","type":"number","label":"目标高","default":88},{"id":"label","type":"string","label":"标签文字","default":"第一项：已完成"},{"id":"dx","type":"number","label":"折点相对圆点的横向偏移（负数向左）","default":170},{"id":"dy","type":"number","label":"折点相对圆点的纵向偏移（负数向上）","default":-170},{"id":"run","type":"number","label":"折点之后水平段的长度","default":70},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.167,0.3,0.533,0.767,2],"doc":"## 命门\n\n1. **顺序是点、线、牌。** 圆点 0.20 秒钉下，线 0.38 秒才出发，牌 0.64 秒才出来。眼睛先被钉在目标上，再被线带到字上。三样同时出现，观众会先读字，然后不知道它说的是谁。\n2. **牌是从线尾被推出来的。** 牌被一个贴着线尾的窗口裁住，从窗口里朝远离线的方向滑出整整一个自身宽度。淡入的牌和线没有关系，像后期贴上去的字幕。\n3. **线和牌接力，重叠 0.04 秒。** 线在 0.68 秒到头，牌在 0.64 秒已经起步。中间留出空拍，动作就断成两段。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.42s | 圆点 | 缩放 0 → 1，带过冲 | back.out(3) |\n| 0.26 → 0.66s | 圆点外的环 | 放大到 3.2 倍并淡出 | power2.out |\n| 0.38 → 0.68s | 折线 | 从圆点出发，先斜后平，描边画出 | power2.out |\n| 0.64 → 0.94s | 标签牌 | 从线尾横向滑出一个自身宽度 | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| lineAt 线出发时间 | 0.38s | 过 0.6s 圆点孤零零停太久 | 低于 0.25s 点还没钉稳线就跑了 |\n| line 画线时长 | 0.30s | 过 0.5s 拖沓，标签晚到 | 低于 0.18s 线像是直接出现 |\n| plate 推出时长 | 0.30s | 过 0.5s 像抽屉慢慢拉开 | 低于 0.18s 看不出是从线尾出来的 |\n| dx / dy（变量） | 170 / -170 | 线更长，标签离目标更远，关系变弱 | 斜线短于 90px 时折线看着像一条直线 |\n| run（变量） | 70px | 水平段更长，适合绕开中间的内容 | 0 时牌直接接在斜线尾上，接口显得别扭 |\n\n## 已知坑\n\n- 圆点钉在哪条边由 `dx` 的正负决定：向左引就钉在目标左边的中点，向右引就钉在右边中点。想钉在目标内部的某一点，把 `w` 和 `h` 填 0，`x / y` 直接填那个点。\n- 标签的宽度跟着字数走，从线尾朝外长。字多的时候先算：每个汉字 52px，加 84px 的边（牌高 112px），别让它伸出画面或盖住别的内容。\n- 斜线不是 45° 也成立，但 `dy` 接近 0 时线几乎是平的，读起来像下划线。纵向偏移至少留 90px（线宽 12px，圆点直径 44px，偏移太小线和点会糊在一起）。\n- 标签要压在空白上。默认示例垫的是放大 2 倍的任务列表，目标是第一行的标题（300,276 起、440×88，右边比字多留了 24px，圆点才不会压住最后一个字），圆点钉在它右边的中点，牌放在列表上方、页面标题右侧的空白里；换了截图要重新找空白。\n- 同屏两个标签：第二张卡的起始时间错开 0.3 秒以上，并且两条引线不要交叉。\n\n## 动效与皮的边界\n\n属于这张卡的：点、线、牌的先后顺序，折线（一斜一平），牌从线尾被推出来而不是淡入。\n\n只是皮：圆点大小和有没有外扩的环、线的粗细和颜色、标签牌的圆角和配色、斜线的角度。\n\n## 接进片子\n\n- 变量：`x / y / w / h` 是目标外框；`label` 是牌上的字（建议 10 个字以内）；`dx / dy` 是折点相对圆点的偏移，决定标签在目标的哪个方向；`run` 是水平段长度；`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：旁白说出这个名字的那一刻对齐 0.64 秒（牌开始出来），这一镜提前 0.64 秒开始。\n- 音效：0.2 秒圆点落下配一个轻的弹出音；0.64 秒标签滑出配一声短的掠过音。\n- 常见接法：先用 `bracket-frame` 框住区域，再用本卡给里面的部件起名；连着标三四个部件时，每个标签间隔 0.5 秒。"},{"id":"line-carry","name":"一条线带走","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"一条发亮的强调色竖线从画面一侧走到另一侧，线前面是被它微微拖着走的上一镜，线后面已经是下一镜","use_when":"前后对照、时间往前走一步、同一个界面的两种状态，想让观众同时看到两边各一半","energy":"中","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"line=whoosh","pairs_with":["before-after-wipe","underline-draw"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"dir","type":"enum","label":"线往哪边走","default":"right"},{"id":"thick","type":"number","label":"线宽（px）","default":14},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.867,1,1.134,1.6],"doc":"这张卡**不是叠加层**：线的两边要同时显示两镜各一部分，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **线就是分界，一像素都不能错开。** 上一镜只存在于线的前方，它的可见范围的边就是线的中心。线和分界错开哪怕十几像素，观众看到的就是“一条线”加“一次擦除”两件事。\n2. **上一镜被线拖着走一点。** 线走完全程时，上一镜顺着线的方向被带出 180px，像布被钩住了。完全不动的话就是普通的擦除，线只是装饰；拖太多（超过 400px）又成了推走。\n3. **线慢起慢停，中间快。** power2.inOut，0.6 秒。线在画面正中时最快，观众在两头有时间看清“这边是旧的、那边是新的”。匀速的线像进度条。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（线在画面正中）。没有全遮。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.7 → 1.3s | 线 | 从一侧画面外走到另一侧画面外 | power2.inOut |\n| 0.7 → 1.3s | 上一镜的可见范围 | 近边始终贴着线的中心 | 同上 |\n| 0.7 → 1.3s | 上一镜的画面 | 顺着线的方向被带出 180px | 同上 |\n| 0.7 → 1.3s | 下一镜的画面 | 从落后 60px 的位置滑到正位 | 同上 |\n\n四样东西共用同一段时间和同一条曲线，所以随便拖到哪一帧都对得上。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| cross 走完用时 | 0.6s | 过 0.8s 就不是转场了，是一次“前后对比”的展示 | 低于 0.4s 看不清线两边各是什么 |\n| drag 上一镜被带出 | 180px | 过 400px 是推走，线的存在感变弱 | 0 是纯擦除 |\n| drift 下一镜落后量 | 60px | 过 100px 线到达终点前，画面边上会露出底色 | 0 时下一镜是死的，少一层纵深 |\n| thick（变量） | 14px | 30px 以上是一根“杆”，适合粗线条风格的片子 | 低于 6px 在手机上看不见 |\n| dir（变量） | right | — | 向左走时观众读成“往回”，适合“改之前是这样” |\n\n## 已知坑\n\n- `drift` 不能随便加大。下一镜起始时往后退了 60px，它另一头空出来的 60px 靠上一镜盖着；超过 100px 后，线快到终点时这条空隙会露出来两三帧。\n- 线带一圈光晕（约 50px）。上一镜或下一镜是浅色画面时光晕看不见，线只剩一条细细的实色，可以把 `thick` 加到 20 以上。\n- `dir: left` 是把整个舞台左右镜像、再把图镜像回来实现的。往这张卡里加文字或图标时，要记得它们也会被镜像。\n- 两张图里同一位置有相同的元素（同一个界面的两种状态）时效果最好；内容完全无关时，线两边各半张图的那几帧会很乱，改用色块或闪白。\n\n## 动效与皮的边界\n\n属于这张卡的：线和分界重合、上一镜被拖着走、四样东西同一条曲线。\n\n只是皮：线的粗细、颜色、有没有光晕、往哪边走、拖多少。把竖线换成略斜的线也成立，只要分界跟着一起斜。\n\n## 接进片子\n\n- 变量：`from`、`to`（地址从项目根目录写起），`dir` 线往哪边走，`thick` 线宽，`backdrop`。\n- 对齐：这段自己占 2 秒，两镜的交界在卡内 1.0 秒。只取动的部分就是卡内 0.7 → 1.3 秒。\n- 音效：一个平滑的掠过声，从 0.7 秒到 1.3 秒，中间最响。\n- 常见接法：上一镜结尾刚画完一条下划线或一根指示线，让这条线“活过来”把画面带走；或接在前后对比之后，作为翻到下一组的动作。"},{"id":"line-draw-chart","name":"折线画出","group":"数据与图表","type":"structure","intents":["number","result"],"numbers":[2,10],"chart":"trend","one_line":"一条折线按时间从左画到右，线头上的圆点带着实时数值一起走，跑到关键拐点刹住停半秒、标注落下，再加速画完，终点数值放大留住","use_when":"旁白在讲一段随时间变化的过程，而且其中有一个“从这里开始不一样了”的时刻","energy":"中","needs":["数据"],"overlay":true,"slot":4,"hero":3.6,"sfx":"draw=draw, turn=tick, end=pop","pairs_with":["spark-metric","number-roll"],"vars":[{"id":"values","type":"string","label":"数值，用 | 分隔（按时间顺序）","default":"12|15|14|22|21|38|64"},{"id":"unit","type":"string","label":"数值后的单位（可空）","default":"%"},{"id":"span","type":"string","label":"起点和终点的时间标签，用 | 分隔","default":"第 1 周|第 7 周"},{"id":"turn","type":"number","label":"在第几个点停一下（0 = 不停）","default":5},{"id":"turnNote","type":"string","label":"停顿处的一句标注","default":"开始给示例"},{"id":"headline","type":"string","label":"结论（一句）","default":"通过率从这一周开始抬头（示例数据）"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.9,1.6,2.3,3.6],"doc":"## 命门\n\n1. **线头有东西。** 圆点和它头顶的数值全程跟着线头走，三样东西由同一个进度值算出来。只有线在长、没有线头的话，观众的眼睛没有落点，会直接跳去看终点。\n2. **拐点要停。** 画到关键点前用 power2.out 刹住，停 0.5 秒，标注在这半秒里落下，然后用 power2.in 重新起步。一口气画完的线，观众只记住首尾，中间那个“为什么”就丢了。\n3. **进度按时间走，不按线长走。** 横向每一段用的时间一样长。按线长匀速的话，陡的那段画得慢、平的那段画得快，正好和“突然涨起来”的感觉相反。\n\n## 动作拆解\n\n默认 7 个点，在第 5 个点停。图表区从线头数值的顶端（约 170px）到底部基线（910px），占画面高度的近七成；线本身在 x 160–1700、y 400–870 之间。结论句 68px，线头数值 110px，拐点标注 56px，首尾时间标签 52px。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.35s | 结论句 | 上移 20px 淡入 | power2.out |\n| 0.30 → 1.43s | 线、圆点、数值 | 从第 1 点画到第 5 点，数值 12% → 21% | power2.out |\n| 1.37 → 1.87s | 圆点外的圈 | 半径 26 → 100px，同时淡出 | power2.out |\n| 1.43 → 1.79s | 拐点下的短竖线和标注 | 竖线淡入 0.15s，标注下移 18px 淡入 0.3s | power3.out |\n| 1.43 → 1.93s | 线头 | 停住不动 | — |\n| 1.93 → 2.50s | 线、圆点、数值 | 画到第 7 点，数值 21% → 64% | power2.in |\n| 2.48 → 2.98s | 圆点外的圈 | 再扩一次 | power2.out |\n| 2.50 → 2.89s | 终点数值 | 放大到 1.30 再落到 1.18，原点在数值底部 | power2.out → back.out(2.5) |\n\n整条线的总时长（`draw`，1.7 秒）按拐点的位置分给前后两段。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 画完整条线的时长 | 1.7s | 过 3s 线头走得太慢，观众会提前看完 | 低于 1s 数值闪得看不清 |\n| hold 拐点停多久 | 0.5s | 过 1s 像卡住了，除非旁白正好在这里解释 | 低于 0.25s 标注还没读完线就走了 |\n| tagLift 数值离圆点多高 | 52px | 过 100px 数值和线头脱节 | 低于 34px 陡坡上数值会压到线 |\n| endKick 终点数值的落定倍数 | 1.18 | 过 1.4 会顶到结论句 | 1.0 时终点没有被强调 |\n| yTop 最高点的位置 | 400px | 往下调，坡度变缓，图表区又缩回画面下半 | 往上调过 380px，最高点的数值会伸进结论句那一行（结论句占 56–146px） |\n\n## 已知坑\n\n- 线端用了圆头，进度为 0 时圆头自己就是一个点。这里它被线头的圆点盖住了，所以看不出来；把圆点去掉的话，开头会多出一个孤零零的小点。\n- 最高点的数值顶端在 198px，终点放大的那一下最高到 153px，都在结论句（底边 146px）下面，所以最高点在左边的下降数据也不会压到结论句；把 `yTop` 调小或把数值字号调大前先算这笔账。\n- 上一版最高点在 300px，终点数值会顶进结论句那一行，只能靠“结论句在左、终点在右”错开，下降的数据（最高点在左）就压字了。现在最高点降到 400px，数值无论在左在右都在结论句下面；结论句本身 68px，最多 25 个字。\n- 标注放在拐点的右下方（右 30px、下 76px），默认认为拐点之后线是往上走的。拐点的数值低于最大值的 15% 时，标注会压到底部基线和时间标签上，那种数据把 `turnNote` 留空、改用旁白说。如果拐点之后往下走，标注会被线划过，要改到拐点上方。\n- 点太多（超过 12 个）时折线变成锯齿，观众看不出趋势。先把数据按周或按月合并，再填进来。\n- 实时数值是在两个点之间线性插出来的，中间值并不是真实数据。数据很敏感时，把数值改成只在到达每个点时才更新。\n\n## 动效与皮的边界\n\n属于这张卡的：线、圆点、数值三者同步；按时间走的进度；拐点的刹车、停顿和重新起步；终点数值放大后留在 1.18 倍。\n\n只是皮：线的粗细和颜色、圆点大小、有没有底部那条基线和首尾时间标签、标注的位置和字号、结论句。纵轴从 0 起算不是皮，改了就是在夸大坡度。\n\n## 接进片子\n\n- 变量：`values` 按时间顺序的数值，用 `|` 分隔；`unit` 数值后的单位；`span` 起点和终点的时间标签，用 `|` 分隔；`turn` 在第几个点停（0 表示不停，一口气画完）；`turnNote` 停顿处的标注；`headline` 结论句；`backdrop`。\n- 对齐：拐点的停顿（默认 1.43 秒）对旁白说“从这里开始”的那个词；终点（2.50 秒）对旁白报出最终数字。\n- 音效：画线时一个持续的笔划声，拐点停住时一声“嗒”，终点数值放大时一个“啵”。\n- 示例数字是编的，结论句里标了“示例数据”。"},{"id":"line-rise","name":"逐行上浮","group":"字与强调","type":"structure","intents":["conclusion","keyword"],"numbers":null,"chart":null,"one_line":"两三行大字各自从一条看不见的遮罩底边升上来，后一行在前一行还没停稳时就出发","use_when":"旁白是一组并列或递进的短句（先……再……最后……），每行一口气能念完","energy":"中","needs":["文"],"overlay":true,"slot":3,"hero":2.6,"sfx":"line=whoosh","pairs_with":["word-punch","underline-draw"],"vars":[{"id":"lines","type":"string","label":"两到三行，用 | 分开","default":"先把问题说清楚|再给一个例子|最后才讲原理"},{"id":"gap","type":"number","label":"行与行的间隔（秒）","default":0.16},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.1,0.34,0.5,0.7,2.6],"doc":"## 命门\n\n1. **遮罩，不是淡入。** 每行字是从自己那一行的底边“冒”出来的，字的上半截先露头。改成透明度淡入加位移，读起来就是普通的字幕上滑，没有“从缝里升起”的质感。\n2. **压尾巴。** 行间隔 0.16 秒，而单行上升要 0.62 秒，所以三行大部分时间是同时在动的。间隔拉到和上升时长一样，就成了三句话各放各的，节奏断成三拍。\n3. **急起缓停。** 用 power4.out：前 0.15 秒走完大半路程，剩下的时间只是在贴近终点。换成匀速或 inOut，字像被电梯送上来，没有劲。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.82s | 第 1 行 | 从遮罩下方 104% 行高处升到原位，同时从右倾 3° 摆正，原点在左下角 | power4.out |\n| 0.36 → 0.98s | 第 2 行 | 同上 | power4.out |\n| 0.52 → 1.14s | 第 3 行（强调色） | 同上 | power4.out |\n\n遮罩本身不动，也没有透明度变化。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| rise 单行上升时长 | 0.62s | 过 0.9s 尾巴太长，字幕已经念完字还在蹭 | 低于 0.4s 看不出是“升”，像弹出来 |\n| gap 行间隔（变量） | 0.16s | 过 0.35s 行与行脱节，成了逐条出现的清单 | 低于 0.08s 三行几乎同时，失去先后 |\n| travel 起点位置 | 104% | 过 130% 出发前要空等一小段，起步发虚 | 低于 100% 第一帧就露出字头 |\n| lean 起始倾角 | 3° | 过 6° 像甩上来的，偏俏皮 | 0 也成立，更规矩，适合正式内容 |\n| at 第一行起步 | 0.2s | — | 0 时和上一镜的切换贴在一起，看不到“空 → 有” |\n\n## 已知坑\n\n- 遮罩的高度就是行高。行高低于 1.3 时，“清”“原”这类上下顶满的字在落定后会被遮罩削掉一点顶，现在用的是 1.36。\n- 起始倾角会让行尾在遮罩里多探出一截：行越长探得越多。超过 12 个字的行把 `lean` 降到 1.5 或者 0，否则第一帧行尾会露出一个字角。\n- 遮罩左右各留了 0.08em。去掉以后粗体字的左边缘会被裁掉一两个像素，看起来像字缺了一条边。\n- 行数超过三行：整个动作会拖过 1.3 秒，最后一行还没到旁白已经往下走了。四行以上请拆成两屏。\n- 各行长短差太多时，左对齐的一短一长会显得头重脚轻；宁可改文案让各行字数相近。\n\n## 动效与皮的边界\n\n属于这张卡的：每行一个独立遮罩、自下而上的方向、0.16 / 0.62 这种“间隔远小于时长”的叠压关系、急起缓停的曲线。\n\n只是皮：字号字重、左对齐还是居中、最后一行要不要上强调色、起始倾角有没有、行数是两行还是三行。\n\n## 接进片子\n\n- 变量：`lines` 用 `|` 分行（两到三行，每行建议不超过 10 个字）；`gap` 行间隔；`backdrop` 填 `off` 时透明，可以压在实拍或录屏的暗部上。\n- 时间：第一行在卡内 0.2 秒起步。把这张卡的起点放在旁白说第一行之前约 0.2 秒；如果每行之间旁白有明显停顿，把 `gap` 改成那个停顿的长度（但不要超过 0.35）。\n- 音效：每行起步时一个很轻的掠过声，三行用同一个声音、音高依次略升；也可以只在第一行放。\n- 常见接法：这张卡把整段话立起来，下一镜用 `word-punch` 砸其中的重音词，或者接 `underline-draw` 给最后一行画线。"},{"id":"lower-third","name":"下三分之一名条","group":"标题与章节","type":"host","intents":["host"],"numbers":null,"chart":null,"one_line":"画面左下一根竖条先立起来，强调色块从它里面向右射出，名字和一行说明在色块上先后升起，停留后按原路倒着收回","use_when":"画面里第一次出现一个人、一个产品或一个地点，需要告诉观众“这是谁、是什么”，而画面本身要继续播","energy":"低","needs":["文"],"overlay":true,"slot":5,"hero":2.2,"sfx":"in=whoosh, out=whoosh","pairs_with":["title-behind-subject","title-to-corner"],"vars":[{"id":"name","type":"string","label":"名字或称呼","default":"本期嘉宾"},{"id":"desc","type":"string","label":"一行说明","default":"交互设计师 · 做了八年工具类产品"},{"id":"leave","type":"number","label":"开始收回的时间（秒）","default":3.7},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,0.5,0.75,2.2,4.05],"doc":"## 命门\n\n1. **先有底，后有字。** 色块 0.42 秒射出，名字 0.60 秒才升，说明再晚 0.14 秒。字和色块一起滑出来，字在移动中读不了，而且看起来是一张贴图。\n2. **怎么来怎么回。** 收回的顺序是进场的倒放：说明先落，名字再落，色块缩回竖条，竖条最后躺下。整条淡出的话，它就成了一个弹窗，而不是从画面里长出来又收回去的东西。\n3. **回得比来得快。** 进场从竖条到说明站稳用 0.84 秒，收回只用 0.65 秒，并且全部用加速缓动。收得慢会把注意力从主画面上拉回来。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.48s | 竖条 | 从底边向上立起 | power3.out |\n| 0.42 → 0.84s | 色块 | 从竖条处向右展开到全宽 | expo.out |\n| 0.60 → 1.00s | 名字 | 在自己那一行里从下方 80% 升起 | power3.out |\n| 0.74 → 1.14s | 说明 | 上移 22px 淡入 | power3.out |\n| 3.70 → 3.94s | 说明 | 下移 22px 淡出 | power2.in |\n| 3.77 → 4.01s | 名字 | 落回行下 | power2.in |\n| 3.91 → 4.21s | 色块 | 缩回竖条 | power3.in |\n| 4.21 → 4.35s | 竖条 | 躺下消失 | power2.in |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| leave 开始收回的时间（变量） | 3.7s | 按说明的字数放，每 10 个字多留 1 秒 | 低于 1.54s 字刚站稳就走，脚本会抬到 1.54 |\n| blockDur 色块展开时长 | 0.42s | 过 0.7s 像进度条 | 低于 0.25s 只看到色块突然在那儿 |\n| nameLag 名字滞后 | 0.3s | 过 0.6s 色块空着等，显得卡 | 低于 0.2s 字在还没展开的色块外面露头 |\

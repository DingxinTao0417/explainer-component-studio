n| lineStep 两行间隔 | 0.14s | 过 0.3s 两行像两件事 | 0 时两行同时出，分不出主次 |\n| outBlock 色块收回时长 | 0.3s | 过 0.5s 拖 | 低于 0.2s 像被剪掉 |\n\n## 已知坑\n\n- 两行字最初都是在遮罩里从整行以下升起。升到一半时字的外框伸到色块下面、压在深色画面上，校验不认遮罩，报深色字对比度不够（只在某些取样时刻报）。现在名字只走 80% 行高，起步和落回的瞬间透明度为 0；说明改成 22px 的短升加淡入。\n- 色块的宽度由文字撑开。说明超过 18 个字（约 800px）名条会超过画面一半，压到主体；长说明拆成两次名条或者删到一行。\n- 进场、收回是同一批节点的两段，收回一律用 `to`。用 `fromTo` 写收回，时间轴一建好色块就是展开的状态。\n- 实底模式（`backdrop: on`）垫的是一张压暗的示例图加缓慢放大，只为了演示时不对着纯黑；真正用的时候永远填 `off`。\n- 名条在左下、离底边 118px。字幕如果也在底部居中，会和名条右端相撞；有字幕的片子把名条抬到离底 260px，或让字幕在名条停留期间上移。\n\n## 动效与皮的边界\n\n属于这张卡的：竖条 → 色块 → 名字 → 说明的先后顺序、原路倒放的收回、收回比进场快。\n\n只是皮：名条在左下还是右下（右下时把色块的展开原点换到右边），色块颜色，竖条有没有，两行的字号比例，圆角。\n\n## 接进片子\n\n- 变量：`name` 名字或称呼；`desc` 一行说明；`leave` 开始收回的秒数；`backdrop` 填 `off`。这张卡的时长要比 `leave` 多 0.7 秒以上，否则收回动作被截断。\n- 对齐：人物开口后 0.5–1 秒再出名条，不要抢第一句话；收回放在一句话的句尾。\n- 音效：色块射出（0.42 秒）一个很轻的掠过声，收回时可以同样加一个，音量再低一半；访谈类内容建议都不加。\n- 连用：开场用 `title-behind-subject` 之后，人物出场时接这张卡。"},{"id":"magnifier-lens","name":"放大镜","group":"证据与界面","type":"evidence","intents":["point"],"numbers":null,"chart":null,"one_line":"一个圆形放大镜出现在截图一角，沿弧线滑到目标上，镜内始终是镜下那一点的放大画面，到位时镜框变成强调色并轻轻一收","use_when":"要看的东西很小（一个状态、一个数字、一行小字），但又不想离开整张界面","energy":"中","needs":["界面"],"overlay":false,"slot":4,"hero":3.2,"sfx":"glide=whoosh, lock=pop","pairs_with":["screen-push-focus","spotlight-dim"],"vars":[{"id":"src","type":"string","label":"截图地址（1920×1080，从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"x","type":"number","label":"要看的位置：中心 x（截图像素）","default":545},{"id":"y","type":"number","label":"要看的位置：中心 y（截图像素）","default":736},{"id":"mag","type":"number","label":"放大倍数","default":2.1},{"id":"size","type":"number","label":"镜片直径（像素）","default":440},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.6,1.1,1.5,3.2],"doc":"## 命门\n\n1. **镜里的画面跟着镜子走。** 镜片滑动的每一帧，镜内都是它正下方那一点的放大。镜内画面要是固定成目标的特写，镜片就成了一张贴上去的圆图，滑动没有意义。\n2. **镜外一点不动。** 整张截图保持原样、原亮度。镜外也跟着缩放或压暗，就分不清哪个是“原图”，哪个是“放大的”。\n3. **走弧线，到位有一下。** 横向两头缓、纵向只减速，路径自然弯成弧；到位前 0.08 秒镜框换成强调色并放大到 1.07 再弹回。直线匀速滑过去像界面上的悬停效果，没有“找到了”的那一下。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.25 → 0.55s | 放大镜整体 | 在起点淡入，缩放 0.6 → 1 | back.out(1.8) |\n| 0.7 → 1.7s | 放大镜整体（横向） | 滑到目标的 x | power2.inOut |\n| 0.7 → 1.7s | 放大镜整体（纵向） | 滑到目标的 y | power3.out |\n| 0.7 → 1.7s | 镜内的截图副本 | 以同样的时长和缓动反向平移，保持对位；副本固定放大 2.1 倍 | 同上，分轴 |\n| 1.62 → 1.74s | 镜框 | 白色换成强调色 | 线性 |\n| 1.62 → 1.72 → 2.02s | 放大镜整体 | 缩放 1 → 1.07 → 1 | power2.out，再 back.out(2.5) |\n\n起点默认离目标横向 1130px、纵向 290px，都朝画面中间那一侧（会被夹在画面内）。示例里目标在左下，镜片从右上方滑过来。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| mag（变量）倍数 | 2.1 | 过 3 镜里只剩两三个字，而且发糊 | 低于 1.5 看不出放大，像一个圆形高亮 |\n| size（变量）镜片直径 | 440px | 过 600px 挡住半个界面，“镜外保持原样”就没得看了 | 低于 300px 镜里装不下一个词 |\n| glide 滑行时长 | 1.0s | 过 1.5s 镜里的内容流得太慢，像在巡视 | 低于 0.6s 路上的内容看不清，弧线也看不出 |\n| lockScale 到位收缩 | 1.07 | 过 1.15 像要弹出去 | 1.0 到位没有手感 |\n| fromX / fromY 起点距离 | 1130 / 290px | 路程更长，镜里路过的东西更多 | 低于 400px 镜片几乎原地出现，滑动成了抖一下 |\n\n## 已知坑\n\n- 起点落在空白处，镜里就是一片白，前半程像一个空圈。做这张 demo 时第一版起点正好在两行之间，后来调了起点距离，让它落在一个有字的状态标签上。换截图后先看 0.6 秒那一帧镜里有没有内容。\n- 目标靠边时镜片会被画面裁掉：直径 440 的镜片，目标中心离边不到 226px（半径加镜框）就出界。第一版的目标是最右边的状态标签，为了不出界只能把镜片中心往里挪，结果标签在镜里偏到一边、右端还被镜框切掉，所以示例换成了画面中部的一行。靠边的目标把 `size` 调小，或者改用 `screen-push-focus`。\n- 镜内副本和镜片的缓动必须逐轴相同。只改了其中一个的缓动或时长，镜里的画面会在滑动途中“溜”一下再对回去。\n- 校验会报镜内副本和手柄 `escaped_container`（副本是整张截图放大后只露一个圆）。在镜片容器和手柄上加 `data-layout-allow-overflow`。\n- 截图是 1920 宽，放大 2.1 倍后镜里的字已经略软。源图有 2 倍分辨率时把两个 `img` 都换成高清的，尺寸仍写 1920×1080。\n\n## 动效与皮的边界\n\n属于这张卡的：镜内画面逐帧跟随镜片位置、镜外原样不动、弧线路径、到位时变色加一收。\n\n只是皮：手柄有没有、朝哪边，镜框粗细和颜色，玻璃的高光和阴影，镜片是圆还是圆角方形。\n\n## 接进片子\n\n- 变量：`src` 截图；`x / y` 要看的那一点（截图像素，镜片中心）；`mag` 倍数；`size` 镜片直径；`backdrop`。\n- 镜片 1.7 秒到位。把旁白里那个小东西的名字对在 1.6–1.7 秒。\n- 音效：0.7 秒起一个轻掠过声，1.62 秒到位配一个短的弹出声。\n- 接法：前面给一张静止全景；后面如果要长时间讲这个细节，切到 `screen-push-focus` 的特写。"},{"id":"margin-note","name":"旁注手写","group":"标注与手绘","type":"evidence","intents":["point","caution"],"numbers":null,"chart":null,"one_line":"目标旁边的空白处，一行微微上翘的手写体批注一个字一个字写出来，写完再甩一条下垂的小弧线连到目标","use_when":"想对画面里的某样东西说一句自己的话（提醒、吐槽、补充），语气是讲解者在页边随手写的，不是正式的标签","energy":"低","needs":["界面","文"],"overlay":true,"slot":4,"hero":3,"sfx":"write=draw, arc=draw","pairs_with":["circle-scribble","arrow-point"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":576},{"id":"w","type":"number","label":"目标宽","default":416},{"id":"h","type":"number","label":"目标高","default":88},{"id":"note","type":"string","label":"批注文字","default":"先写这个，别的不急"},{"id":"place","type":"enum","label":"批注写在目标的哪一侧","default":"right"},{"id":"away","type":"number","label":"批注离目标的横向距离（像素）","default":220},{"id":"lift","type":"number","label":"批注相对目标中线的纵向偏移（负数向上）","default":-16},{"id":"slant","type":"number","label":"字的倾斜角度（度，负数是右边翘起）","default":-4},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.567,1,1.5,3],"doc":"## 命门\n\n1. **字是写出来的，不是打出来的。** 每个字用 0.1 秒从左到右被揭开，而不是整个字一帧蹦出来。整字蹦出读成打字机；从左到右揭开，眼睛看到的是笔尖横穿过这个字。\n2. **字和字之间不等距，标点后要停。** 字间隔平均 0.085 秒，按一组固定的起伏在 0.066 到 0.105 秒之间变，逗号后面多停 0.14 秒。间隔全一样就是节拍器，人写字到标点一定会顿。\n3. **先字后线。** 最后一个字写完再过 0.08 秒，弧线才从批注这头画向目标。线先到的话观众会盯着线的落点等，等来的字反而没人读；先字后线则是“写完了，顺手一指”。\n\n## 动作拆解\n\n| 时间（默认 9 个字） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.76s | 前五个字“先写这个，” | 依次从左到右揭开，每字 0.1s | power1.out |\n| 0.76 → 0.88s | — | 逗号后的停顿 | — |\n| 0.88 → 1.22s | 后四个字“别的不急” | 同上 | power1.out |\n| 1.39 → 1.71s | 弧线 | 从批注近端下方起笔，向下兜一下，停在离目标 18px 处 | power2.out |\n\n整行字固定倾斜 -4°（右边翘起），以靠近目标的一端为轴。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| per 平均字间隔 | 0.085s | 过 0.15s 像小学生描红，等不起 | 低于 0.05s 一行字像被刷出来的，看不出逐字 |\n| jitter 间隔起伏 | 0.25 | 过 0.5 像写字时卡壳 | 0 是匀速，机器感 |\n| wipe 单字揭开时长 | 0.10s | 超过 per 很多时相邻几个字同时在长，变成一条擦除带 | 低于 0.05s 等于整字蹦出 |\n| comma 标点停顿 | 0.14s | 过 0.3s 像忘词了 | 0 时一口气写完，没有断句 |\n| sag 弧线下垂 | 44px | 过 90px 变成一个兜，可能压到下面的内容 | 0 是直线，像连接线而不是随手一划 |\n| slant（变量） | -4° | 超过 ±8° 字难读，行尾会翘出空白区 | 0 时是排版好的字，不像手写 |\n\n## 已知坑\n\n- 手写感靠的是系统里的楷体（Windows 的 KaiTi、macOS 的楷体-简）。渲染机没有楷体时会退回正文字体，动作还在，手写味少一半。要稳就在宿主项目里给 `--mc-font` 之外另配一款手写字体，并把这张卡的 `font-family` 换掉。\n- 行尾会翘：-4° 时每 100px 宽上升 7px，字号 84px，9 个字的行宽 756px，行尾比行首高约 53px。批注上方要留出这么多空白。\n- 字的深色包边是 9px 的文字描边，画在填色下面。字号改到 60px 以下时描边会把笔画的空隙填死，要把描边一起改细。\n- 弧线两端都在批注和目标的同一侧空隙里，弧线中段粗 16px；`away` 小于 120px 时弧线短到只剩一个点。\n- 批注写在左侧（`place: left`）时，字仍然从左往右写，所以是离目标最远的字先出现，弧线最后从行尾连过去。\n\n## 动效与皮的边界\n\n属于这张卡的：逐字从左到右揭开、字间隔不均匀、标点处停顿、整行微斜、字写完才画连接弧线。\n\n只是皮：字体、字号、颜色、有没有深色包边、弧线的弯度和粗细、倾斜多少度。\n\n## 接进片子\n\n- 默认演示（`backdrop: on`）垫的是示例截图放大 2 倍后的任务列表区域（原图 340,110 起的 960×540 一块铺满画面）；默认目标是第二行的标题（300,576 起、416×88），批注写在它右边 220px 处、同一张任务卡的空白里。\n- 变量：`x / y / w / h` 是目标外框；`note` 是批注（12 个字以内，可以带一个逗号）；`place` 选左侧或右侧；`away` 是批注离目标的距离；`lift` 是上下偏移；`slant` 是倾斜角；`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：批注通常和旁白同步念出来，第一个字在 0.3 秒落笔，把这一帧对到旁白那句话的第一个字。\n- 音效：0.3 秒起一段和写字等长的沙沙声（默认约 0.9 秒），1.39 秒弧线处一声短的笔划音。\n- 常见接法：先用 `circle-scribble` 圈住目标，圈合拢后 0.2 秒接本卡；这时可以把弧线的终点留在圈的外沿（把 `w / h` 报成圈的大小）。"},{"id":"media-pop","name":"图片弹入","group":"图片与多素材","type":"evidence","intents":["result","metaphor"],"numbers":null,"chart":null,"one_line":"一张带白边的图从略高处斜着落到桌面上，过冲一下再坐稳，落地那一帧闪一下白","use_when":"旁白点到一个具体的东西（一张截图、一件产品、一个人），要让它“被拿出来放在面前”","energy":"中","needs":["图"],"overlay":true,"slot":3,"hero":1.2,"sfx":"land=pop","pairs_with":["stack-fan","label-callout"],"vars":[{"id":"src","type":"string","label":"图片地址（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"label","type":"string","label":"图下标签（可空）","default":"示例图 · 一句说明"},{"id":"tilt","type":"number","label":"落定后的倾角（度）","default":-2.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,0.36,0.46,1.2,2.6],"doc":"## 命门\n\n1. **有来路。** 图是从上方 70px、反方向倾斜着落下来的，不是原地放大。原地缩放读起来是“弹窗”，带位移和反向倾角才是“被人放下”。\n2. **过冲很小。** 峰值只到 1.06。图片面积大，过冲超过 1.1 整屏都在晃。\n3. **落定是歪的。** 停在 -2.5° 左右。摆正的图是界面元素，微斜的图才是一张“照片”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.42s | 图卡 | 透明 → 不透明，缩放 0.55 → 1.06，下落 70px，倾角 从 -2.4×tilt 到 1.3×tilt | power3.out |\n| 0.38 → 0.68s | 白色闪层 | 透明度 0.55 → 0 | power2.out |\n| 0.42 → 0.72s | 图卡 | 缩放 1.06 → 1，倾角回到 tilt | back.out(2) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| inDur 落下时长 | 0.22s | 过 0.4s 像飘下来的纸，没有分量 | 低于 0.14s 看不出方向 |\n| over 过冲 | 1.06 | 过 1.1 大图会显得整屏在抖 | 1.0 落地发死 |\n| drop 下落距离 | 70px | 过 160px 变成“掉下来”，抢戏 | 0 就成了弹窗 |\n| tilt（变量） | -2.5° | 超过 ±6° 像贴歪了，图里的字难读 | 0 时是端正的界面截图感，适合录屏 |\n| flash 闪白强度 | 0.55 | 浅色底上过 0.4 就刺眼 | 0 也成立，只是落地感弱 |\n\n## 已知坑\n\n- 图里有小字、而且需要读：把 `tilt` 设成 0，并且别用白边（白边会再缩小图的有效面积）。\n- 连续弹三张以上：每张都闪白会像闪光灯，第二张起把 `flash` 降到 0.2 或者关掉；多图请换成扇开或并排的卡。\n- 压在实拍上（`backdrop: off`）时阴影要保留，不然图和背景贴在一起。\n- 竖图：现在的图框是 1084×610 的横框，竖图会被裁。竖图要改框的宽高，别硬塞。\n\n## 动效与皮的边界\n\n属于这张卡的：从上方反向倾斜落下、1.06 的小过冲、落定时的微斜、落地那一下的闪白时机。\n\n只是皮：白边有没有、多宽，圆角，阴影浓淡，标签的字体字号、有没有标签，图的尺寸和比例。\n\n## 接进片子\n\n- 变量：`src` 图片地址（从项目根目录写起），`label` 图下的一行字（留空就不显示），`tilt` 落定倾角，`backdrop`。\n- 开始时间对齐旁白说出这个东西的那个词，卡里图在 0.2 秒开始动，0.42 秒落地。\n- 音效：落地那一帧一个轻的“啪”。"},{"id":"mesh-flow","name":"流动色光","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"四团大而柔的色光垫在底色上，整镜各自沿一小段弯路游移并互相渗开，像一盏很慢的熔岩灯","use_when":"这一镜只有标题、金句或一个数字，纯色底显得空，又不想让任何图形和文字抢位置","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["word-punch","line-rise","kicker-headline"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"标题压在色光上也读得清"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.6}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **慢到看不出起点。** 最远的一团 6 秒只走 340px，而它自己有 1400px 宽，每秒位移不到自身的 5%。走得再快，观众会去追那团光，读成“有东西飞过去”。\n2. **没有边。** 每团光都是从中心到透明的径向渐变，没有任何一处能指出轮廓。出现了能看清的圆边，就读成四个半透明的圆，不是光。\n3. **最亮处也压得住字。** 默认浓度下最浓的一团只有约 37% 的强调色盖在底色上。再往上，白字压在黄光上、黑字压在蓝光上都会发灰。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 四团色光 | 横向各走 340 / -300 / 260 / -240px（以原位为中点） | sine.inOut |\n| 0 → 3s → 6s | 四团色光 | 纵向各走 150 / -130 / -160 / 120px，到头再原路回来，所以整条路是弯的 | sine.inOut，往返一次 |\n| 0 → 6s | 四团色光 | 缩放 1 → 1.16（第 1、3 团）或 1 → 0.84（第 2、4 团） | sine.inOut |\n\n标题不参与任何动作。四团光的直径是 1400、1240、1100、980px，两团用第二强调色，两团用强调色。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 2 能看出每团光在赶路，开始分散注意 | 0.5 以下接近静止的渐变底 |\n| strength（变量） | 0.6 | 过 0.85 浅色皮下黑字开始压不住蓝光 | 0.3 以下只剩一点点色温差 |\n| moves（CFG） | 最远 340px | 相邻两团会叠到同一处，画面一角突然变亮 | 四团都不离开原位，渗不开 |\n| breathe（CFG） | 0.16 | 过 0.3 像在一呼一吸，变成有节拍的东西 | 0 时只有平移，略显机械 |\n\n## 已知坑\n\n- 换成高饱和的强调色（纯红、纯绿）时，同样的浓度会显得脏。先把 strength 降到 0.4 再看。\n- 两团同色的光靠得太近会合成一块更亮的斑，正好落在标题后面时字会发灰。改 moves 之前先看 3 秒那一帧。\n- 想用 `filter: blur` 把边糊得更软：整屏模糊每帧都要重算，渲染会慢几倍。软边靠渐变的三个色标做，不靠滤镜。\n- 深色底上的大面积渐变在压缩后容易出色阶条纹。成片码率别压太低，或者在上面叠一层很淡的颗粒。\n- 首尾两帧不一样（每团光停在路的另一头）。要循环使用时，接法是倒放一遍，不是直接重播。\n\n## 动效与皮的边界\n\n属于这张卡的：色光没有轮廓、每团走一段弯的短路、一去不回的 6 秒慢移、彼此方向相反所以会互相渗开。\n\n只是皮的：两种色光的颜色（`--mc-accent`、`--mc-accent-2`）、底色、团数（三到五团都成立）、每团的大小和起始位置、标题的字体字号。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把真正的字幕或别的卡叠在更高的轨道上；`speed` 是位移倍数；`strength` 是色光浓度。\n- 时间：整镜铺满即可，不用对齐旁白。镜头超过 6 秒时把 `speed` 调小，同时把这一段的时长拉长，不要让它停在最后一帧不动。\n- 音效：没有。它不该有任何能被听见的时刻。\n- 常见接法：垫在 `word-punch`、`line-rise`、`kicker-headline` 这类纯文字卡下面；这些卡自己的实底要关掉。"},{"id":"mosaic-assemble","name":"拼贴汇成","group":"图片与多素材","type":"evidence","intents":["grouping","hook"],"numbers":null,"chart":null,"one_line":"十二张图歪着从画面四周飞进来，大的先到、小的补缝，全部到位后整面拼贴一下并拢、压暗，标题牌紧跟着砸在正中","use_when":"旁白在做归纳：“这些例子合起来说明一件事”；手上有一批零散的图，结论是一句话","energy":"高","needs":["多图","文"],"overlay":true,"slot":3.5,"hero":3,"sfx":"fly=whoosh, lock=impact, title=impact","pairs_with":["photo-wall-dolly","word-punch","kicker-headline"],"vars":[{"id":"srcs","type":"string","label":"拼贴用的图，用 | 分隔；不够十二张就循环用，前两张占最大的两格","default":"motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p8.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p7.jpg"},{"id":"title","type":"string","label":"最后压在中间的标题（一行，不超过 12 个字）","default":"十二个案例，一个规律"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.6,1,1.5,3],"doc":"## 命门\n\n1. **大的先到，小的补缝。** 飞入顺序按面积从大到小排：两块 2×2 的先落下定住版面，四块 1×1 的最后填进空隙。按从左到右的顺序飞，看到的是一行行铺砖；大小混着同时飞，看不出拼贴的骨架。\n2. **到齐以后并拢一下。** 图飞来的时候整面拼贴是撑开的（1.045 倍），最后一张快到位时在 0.22 秒里收到 1，而且是加速收（power3.in）。没有这一下，十二张图只是各自停在格子里；有了它，才读成“合成了一张”。\n3. **标题晚一拍。** 标题牌在并拢结束后 0.08 秒才出现，0.26 秒从 1.35 倍收到 1。和最后一张图同时到，它就只是第十三个飞进来的东西。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.15 → 1.52s | 12 张图 | 依次（间隔 0.07s）从各自格子外 1500px 处飞到位，每张用 0.6s；缩放 0.55 → 1，倾角最多 ±26° 转正 | expo.out |\n| 1.18 → 1.40s | 整面拼贴 | 缩放 1.045 → 1（并拢） | power3.in |\n| 1.40 → 1.70s | 拼贴上的蒙片 | 压暗到 0.5 | power1.out |\n| 1.48 → 1.74s | 标题牌 | 透明 → 不透明，缩放 1.35 → 1 | power4.out |\n| 1.62 → 1.97s | 标题下的黄条 | 从左向右画出 | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| step 每张间隔 | 0.07s | 过 0.12s 变成一张一张数着来，整段拖到 2 秒以上 | 低于 0.04s 十二张几乎同时到，分不出先后 |\n| fly 每张飞行时长 | 0.6s | 过 0.9s 尾巴太长，图在格子边上磨蹭 | 低于 0.4s 只看到图突然出现在格子里 |\n| far 起飞距离 | 1500px | — | 低于 900px 靠中间的格子一开始就在画面里，没有“飞来” |\n| loose 并拢前撑开多少 | 1.045 | 过 1.08 并拢像整屏缩了一下，外圈的图会出画 | 1.0 没有并拢，结尾发散 |\n| shade 标题下压暗 | 0.5 | 过 0.7 图基本看不见，前面白飞了 | 低于 0.3 标题牌周围太花 |\n| titleFrom 标题起始大小 | 1.35 | 过 1.8 标题牌一开始比画面还宽 | 1.0 标题只是淡入，压不住这面墙 |\n\n## 已知坑\n\n- 起飞方向是“从拼贴中心指向这一格”的方向。正中间的格子这个方向接近零，除出来的结果乱跳；离中心不到 200px 的格子改成按序号取一个固定方向。\n- 标题最初打算直接压在压暗的图上，底下十二张图明暗不一，字的对比没法保证。现在标题有一块实底的牌子，图再花也读得清；透明压在实拍上时牌子也在。\n- 压暗的蒙片最初铺满整个画面，`backdrop: off` 时会把拼贴以外的实拍也压暗。现在蒙片只盖拼贴那一块；`title` 留空时不压暗。\n- 版式写在 `CFG.slots` 里，是 6×4 的格子上 12 个互不重叠、正好铺满的矩形。自己改版式时要保证铺满，留一个洞会非常显眼；数组的顺序就是飞入的顺序，记得按面积从大到小排。\n- 图不够 12 张会循环使用。只给四五张时相邻两格容易是同一张图，至少给八张，并且把最想让人看清的两张放在最前面（它们占两块 2×2）。\n\n## 动效与皮的边界\n\n属于这张卡的：从四周向各自的格子汇聚、大先小后的顺序、到齐后整体并拢、压暗以后标题晚一拍砸下。\n\n只是皮：拼贴的具体版式和张数、格子间距和圆角、标题牌的形状和有没有黄条、压暗的深浅、每张图歪多少度飞进来。\n\n## 接进片子\n\n- 变量：`srcs` 用 `|` 分隔，前两张占最大的两格；`title` 一行标题，不超过 12 个字，留空就只拼图、不压暗；`backdrop`。\n- 标题在 1.48 秒砸下，对上旁白说出结论的第一个字；前面 1.3 秒的飞入对上旁白说“这些加起来”之类的铺垫。\n- 音效：飞入一串短的掠过声（或一条上扬的声音），1.40s 并拢一个闷的撞击，1.48s 标题一个更实的撞击，两下挨得很近。\n- 前面常接 `photo-wall-dolly`（先散着看）；标题里有一个要重读的词时，后面可以切到 `word-punch` 单独强调。"},{"id":"nameplate-in","name":"名字牌","group":"人物与口播","type":"host","intents":["host"],"numbers":null,"chart":null,"one_line":"人物胸口位置先立起一条强调色竖线，深色衬底从线里向右擦出，名字和身份两行先后从线后滑出来，停留后按原路收回","use_when":"一个人第一次出镜或第一次开口，需要告诉观众他是谁、凭什么讲这件事","energy":"低","needs":["人","文"],"overlay":true,"slot":4,"hero":1.8,"sfx":"in=whoosh, out=whoosh","pairs_with":["host-cutout-pop","host-to-chip","lower-third"],"vars":[{"id":"host","type":"string","label":"人物图地址（透明底；压在实拍上时留空）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"who","type":"string","label":"名字","default":"小周"},{"id":"role","type":"string","label":"身份一行（可空）","default":"本期主讲 · 做了八年剪辑"},{"id":"plateX","type":"number","label":"名字牌左边位置（px）","default":640},{"id":"plateY","type":"number","label":"名字牌顶边位置（px，对到胸口）","default":650},{"id":"hold","type":"number","label":"停留时长（秒）","default":2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.5,0.633,1.8,3.367],"doc":"## 命门\n\n1. **贴着人，不贴着画面边。** 牌子的顶边在胸口（默认 650px 高度），左边从身体左缘附近起。放到画面左下角它就是一条普通的下三分之一字幕条，和这个人的关系要靠观众自己猜。\n2. **线先立，字后出。** 竖线 0.40 秒立起，名字 0.60 秒才从线后滑出，身份再晚 0.14 秒。字和线一起出现，线就只是个装饰；有先后，字才像是“从线里抽出来的”。\n3. **不压脸。** 牌子最高只到胸口，离下巴至少留 100px。压到下巴以上，观众看字的时候就看不到表情了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.40 → 0.62s | 竖线 | 从中间向上下长到 200px 高 | power3.out |\n| 0.54 → 0.94s | 衬底 | 从线向右擦开 | power3.out |\n| 0.60 → 1.00s | 名字 | 从线后滑出 64px，淡入 | power3.out |\n| 0.74 → 1.14s | 身份 | 同上，晚 0.14s | power3.out |\n| 1.14 → 3.14s | 全部 | 停留（`hold`，默认 2 秒） | — |\n| 3.14 → 3.34s | 身份 | 向线退回 38px，淡出 | power2.in |\n| 3.22 → 3.44s | 名字 | 同上 | power2.in |\n| 3.26 → 3.54s | 衬底 | 向线擦回 | power3.in |\n| 3.54 → 3.70s | 竖线 | 缩回成一个点 | power2.in |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| nameLag 名字滞后 | 0.2s | 过 0.4s 线立着等太久，像卡住 | 0 时线和字同帧，没有“抽出来”的感觉 |\n| roleLag − nameLag 两行间隔 | 0.14s | 过 0.3s 像两条分开的字幕 | 0 时两行读成一块 |\n| slide 滑出距离 | 64px | 过 120px 字在移动中有一段读不了 | 低于 30px 看不出是滑出来的 |\n| hold（变量） | 2s | 名字加身份超过 16 个字时给到 3 秒 | 低于 1.2 秒读不完 |\n| plateY（变量） | 650px | 过 800 就离开胸口、成了字幕条 | 低于 520 开始压下巴 |\n\n## 已知坑\n\n- 默认位置是按“人居中、头在 340px 高度、胸口在 650–850px”摆的。实拍里人偏左或偏右、或者是半身近景时，一定要改 `plateX / plateY`，不要用默认值。\n- 衬底用的是画面底色，压在浅色衣服上对比很足；压在黑衣服上衬底会消失，只剩字和线。那种情况把衬底换成面板色，或者给它加一条细边。\n- 身份一行超过 14 个字，牌子会比身体还宽，从两边伸出去。可以接受，但超过 18 个字就该拆成两次出牌。\n- 退场是进场的倒放，总共 0.56 秒。接在它后面的镜头切换要等它收完，在牌子收到一半时切镜头会留下半条残影的印象。\n- 画面里同时有两个人时，一次只给一个人出牌，第二个人等第一块收回再出。\n\n## 动效与皮的边界\n\n属于这张卡的：位置贴着胸口；线 → 衬底 → 名字 → 身份的先后；字从线后滑出；退场原路倒放。\n\n只是皮：竖线的颜色粗细、衬底的颜色和圆角、两行字的字号字重、名字和身份谁大谁小。把竖线换成一个小图标也成立，只要它先出现、字从它后面出来。\n\n## 接进片子\n\n- 变量：`host` 人物图，压在实拍上时留空；`who` 名字；`role` 身份，可空；`plateX / plateY` 牌子左上角的位置，对到实拍里人的胸口；`hold` 停留时长；`backdrop` 压在实拍上填 `off`。\n- 开始时间：卡的 0.4 秒对齐这个人开口后的第一个停顿，不要抢他的第一句话。\n- 音效：0.4 秒进场一个很轻的掠过声，3.14 秒退场同样一个更轻的。\n- 常见接法：`host-cutout-pop` 把人弹进来，落定后接这张卡；或者实拍口播开场 2 秒后叠这张卡。"},{"id":"number-roll","name":"数字滚动","group":"数据与图表","type":"structure","intents":["number","result"],"numbers":[1,1],"chart":null,"one_line":"一个大数字从起始值冲向目标值，前快后慢，最后一位落定的那一帧整行轻轻顿一下、由暗变亮","use_when":"旁白报出一个量级（多少次、多少人、多少钱），想让观众感到“涨上去了”而不是直接看到结果","energy":"中","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"roll=tick, stop=impact","pairs_with":["big-stat-slab","spark-metric"],"vars":[{"id":"start","type":"number","label":"起始值","default":0},{"id":"target","type":"number","label":"目标值","default":12800},{"id":"decimals","type":"number","label":"小数位数","default":0},{"id":"unit","type":"string","label":"单位（可空）","default":"次"},{"id":"caption","type":"string","label":"数字下面的一行说明","default":"一个提示词模板每天被调用（示例数据）"},{"id":"roll","type":"number","label":"滚动时长（秒）","default":1.4},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.45,0.9,1.74,2.6],"doc":"## 命门\n\n1. **前快后慢。** 用 power3.out：前 0.3 秒就跑完一半以上，剩下的时间在最后几百里慢慢收。匀速滚读起来是进度条在加载，不是数字在涨。\n2. **顿在最后一位真正落定的那一帧。** 缓出曲线在补间结束前就已经显示出目标值了（0 → 12800 时早 0.05 秒，0 → 87 时早 0.25 秒）。顿点按“显示值不再变化的时刻”算，不按补间的终点算。顿晚了读成“数字停了，过一会儿又抖了一下”。\n3. **滚的时候暗，停的时候亮。** 滚动中数字是 0.6 透明度，停住那一帧回到 1，单位同时变成强调色。全程一样亮的话，观众分不清哪一帧算数。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.35s | 说明行 | 上移 20px 淡入 | power2.out |\n| 0.30 → 1.70s | 数字 | 0 滚到 12,800，透明度保持 0.6 | power3.out |\n| 1.65s（落定帧） | 数字、单位 | 数字透明度 0.6 → 1，单位换成强调色，用时 0.07s | 线性 |\n| 1.65 → 1.72s | 数字 + 单位整行 | 缩放 1 → 1.06 | power2.out |\n| 1.72 → 2.00s | 数字 + 单位整行 | 缩放 1.06 → 1 | back.out(3) |\n\n落定帧 = 开始时间 + 时长 ×（1 − ∛(0.5 ÷ 要跳的格数)），格数是“差值 × 10 的小数位数次方”。脚本自己算。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| roll 滚动时长（变量） | 1.4s | 过 2.5s 尾巴拖得太长，旁白早讲到下一句了 | 低于 0.7s 只看到一团闪动，没有“涨” |\n| dim 滚动中的透明度 | 0.6 | 1 时落定那一下没有明暗变化，只剩缩放 | 低于 0.4 滚动过程看不清，白滚了 |\n| kick 顿的倍数 | 1.06 | 过 1.1 变成“弹”，300px 的字会明显晃 | 1.0 时落定很平，适合严肃内容 |\n| kickUp 顶上去的时长 | 0.07s | 过 0.15s 变成慢慢鼓起来 | 再短就不到两帧，等于没有 |\n| kickDown 回落时长 | 0.28s | 过 0.5s 像果冻 | 低于 0.15s 回弹看不出来 |\n\n## 已知坑\n\n- 数字从 1 位涨到 5 位，整行宽度一直在变，居中的话单位会被一路推着走。现在的做法是开头先按最宽的那个值量一次宽度、把数字框定死、数字右对齐。代价是第一帧的“0”贴着单位、左边空着，这是计数器的正常样子。\n- 字体的数字不等宽时，每跳一格字都会左右抖。样式里开了 `tabular-nums`；换成不支持等宽数字的花体字就会抖，别用。\n- 目标值很小（比如 0 → 9）：只有 9 格可跳，后半段每一格都要停很久，像卡顿。小于 30 的数直接用 `big-stat-slab`。\n- 带小数时每一帧都换末位，闪得厉害。小数位数只在目标值本身需要时才开，并把时长收到 1 秒以内。\n- 千分位逗号是脚本加的；要用“万”“亿”这种单位，把换算后的数填进 `target`，把“万”写进 `unit`。\n\n## 动效与皮的边界\n\n属于这张卡的：power3.out 的前快后慢、按显示值算出来的落定帧、落定帧上的明暗切换和 1.06 的一顿、数字框定宽。\n\n只是皮：字号字重、单位放右边还是下面、单位落定后变什么颜色、有没有说明行、有没有千分位逗号。\n\n## 接进片子\n\n- 变量：`start` 起始值，`target` 目标值，`decimals` 小数位数，`unit` 单位（可空），`caption` 说明行，`roll` 滚动时长，`backdrop` 填 `off` 时透明。\n- 对齐：让落定帧（默认 1.65 秒）卡在旁白把这个数字念完的那一刻。数字念得长就把 `roll` 加长，不要让数字先停、旁白还在念。\n- 音效：滚动期间一串越来越疏的滴答，落定帧一个短的闷响。只放落定那一下也成立。\n- 示例里的数是编的，画面上标了“示例数据”；换成真数据时把来源写进 `caption`。"},{"id":"orbit-card","name":"环绕","group":"镜头运动","type":"evidence","intents":["result","hook"],"numbers":null,"chart":null,"one_line":"一张卡片先以 52 度的侧面出现，镜头用 2 秒绕到它正面，一道高光跟着角度从卡面上扫过去，转正时高光刚好离开","use_when":"要郑重地亮出一件东西（一张成果图、一个产品页、一张证书），想让它有体积、有分量，而不是“弹出来”","energy":"中","needs":["图"],"overlay":true,"slot":3.5,"hero":2.8,"sfx":"turn=whoosh","pairs_with":["media-pop","slow-push","lower-third"],"vars":[{"id":"src","type":"string","label":"卡片上的图片地址（从项目根目录写起）","default":"motion-cards/lib/samples/p4.jpg"},{"id":"label","type":"string","label":"卡片下方的一行字（可空）","default":"示例卡片 · 一句说明"},{"id":"from","type":"number","label":"从哪个角度开始绕（度，负数从左侧）","default":-52},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.667,1.133,1.6,2.8],"doc":"## 命门\n\n1. **小半圈，一直减速到正面。** 从 −52° 转到 0°，`power2.out`，2 秒。角度超过 70° 开场只看得到一条边；用两头慢的缓动，开场卡片是侧着静止的，像一张摆歪的图，不像镜头已经在走。\n2. **高光绑在角度上。** 高光的位置和转角用同一个时钟、同一条缓动，所以它是“因为转了才扫过去”。高光自己另起一个时间匀速扫，读成的是按钮上的流光特效，和镜头没关系。\n3. **正对时卡面是干净的。** 高光在转到 0° 之前已经淡完，压暗层也归零。落定画面上还留着一道光或一层灰，观众读图时一直被它挡着。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.2 → 2.2s | 卡片 | 绕竖轴 −52° → 0°，上仰 7° → 0°，缩放 0.9 → 1 | power2.out |\n| 0.2 → 2.2s | 卡面压暗层 | 透明度 0.42 → 0（背光面转向光） | power2.out |\n| 0.2 → 2.2s | 高光带 | 从卡片左外侧横移到右外侧（自身宽度的 −110% → 230%） | power2.out |\n| 0.2 → 0.6s | 高光带 | 透明度 0 → 0.9 | power1.out |\n| 1.3 → 1.9s | 高光带 | 透明度 0.9 → 0 | power1.in |\n| 0.2 → 2.2s | 地面投影 | 横向 0.55 倍 → 1 倍，并从偏左 40px 回到正中 | power2.out |\n\n透视距离 1700px。卡片 1160×764，落定时占画面宽的 60%；高光带宽度是卡片的 46%，向左斜 14°。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| from 起始角度（变量） | −52° | 过 ±70° 开场接近一条线，认不出是什么 | 小于 ±25° 只是歪了一下，没有“绕”的感觉 |\n| dur 环绕时长 | 2s | 3 秒更庄重，适合片尾；高光和压暗会自动跟着拉长 | 低于 1.2s 变成翻牌 |\n| lift 上仰角 | 7° | 过 15° 像从桌面上拿起来 | 0 时是纯水平环绕，更冷静 |\n| far 起始缩放 | 0.9 | 0.8 时带明显的“走近”，接近推镜 | 1.0 时镜头只绕不靠近 |\n| shade 侧面压暗 | 0.42 | 过 0.6 开场卡面是黑的 | 0 时没有受光变化，卡片像一张贴图 |\n| sheenPeak 高光强度 | 0.9（乘以渐变本身的 42%） | 浅色图上超过 0.6 就发白 | 0 也成立，只是少了材质感 |\n| perspective 透视距离 | 1700px | 过 3000px 近大远小消失 | 低于 1000px 近侧的边被拉得很夸张 |\n\n## 已知坑\n\n- 第一版高光是一个矩形里的 100° 斜向渐变，渐变没走完矩形就到边了，结果高光左右两侧是两条直直的硬边，像卡片前面立了一块玻璃板。改成水平渐变（两端正好是 0）再把整个高光带斜切 14°，边才是软的。\n- 转动集中在前半段：`power2.out` 下，1.13 秒（过了不到一半时间）卡片已经只剩 15° 左右。连拍的中间帧要靠前取（0.67、1.13 秒），后面的格子看起来都接近正面。\n- 卡片用了 `overflow: hidden` 来裁高光，这会把卡片压成一个平面：里面的元素不能再有自己的前后层次，卡片也没有厚度。要做有厚度的卡，得另加一条侧边并换掉裁切方式。\n- 高光带扫完后停在卡片右外侧（透明度已经是 0），单独跑检查时被报 `escaped_container`，合跑时没报。包裹层上加了 `data-layout-allow-overflow`；别为了消这条把高光带的终点改回卡片里面，那样落定画面上会留一道光。\n- 从右侧绕（`from` 为正）时高光方向会自动反过来，但地面投影偏移是按 40px 写死的，起始角度很大时投影和卡片底边会对不上，可以把偏移调到 60–80px。\n\n## 动效与皮的边界\n\n属于这张卡的：从侧面减速绕到正面、和角度同步的高光、背光到受光的明暗变化、落定时卡面干净。\n\n只是皮：卡片里放什么、有没有标签、卡片的底色圆角描边、高光的颜色和宽度、地面投影的浓淡、底色渐变。\n\n## 接进片子\n\n- 变量：`src` 卡片上的图片地址，`label` 图下的一行字（留空就不显示，卡片自动变矮），`from` 起始角度（负数从左侧绕，正数从右侧），`backdrop` 填 `off` 时只留卡片和投影，可以压在别的画面上。\n- 对旁白：卡片在 0.2 秒开始转、2.2 秒正对。把旁白里说出这件东西名字的词放在 1.5–2.2 秒之间，名字说完时它刚好正对观众。\n- 音效：0.2 秒起一个 1.5 秒左右、由强到弱的掠过声。\n- 连用：正对之后可以接 slow-push 的思路继续缓推；多张卡依次展示时，第二张起把 `from` 的正负号交替。"},{"id":"orbit-rings","name":"轨道环","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"五圈同心的细线圆环围着画面中心，整镜各自以不同的慢速匀速转动，每圈上带一个小光点","use_when":"讲“围绕一个核心”的内容：一个概念和它的几个方面、一个系统和它的部件，标题或关键词放在正中","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["kicker-headline","outline-fill-title","count-badge"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"细环绕着标题慢慢转"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"环线和光点的浓度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **匀速，圈和圈不同速。** 五圈 6 秒各转 62°、-44°、32°、-24°、17°，全程线性，相邻两圈反向。同速同向，五个光点会排成一条辐条一起转，变成一根指针。\n2. **线细到只是暗示。** 环线 2px，颜色是第二强调色或灰色的四到六成。线一粗，五个同心圆就成了靶子，中间的字像被瞄准。\n3. **光点小而少。** 每圈一个，直径 12 到 16px，带一圈很淡的光晕。光点是唯一能看出“在转”的东西，但它一大就成了主角。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 第 1 圈（直径 480px，实线） | 从 -30° 转到 32° | 线性 |\n| 0 → 6s | 第 2 圈（700px，虚线） | 从 200° 转到 156° | 线性 |\n| 0 → 6s | 第 3 圈（940px，实线） | 从 115° 转到 147° | 线性 |\n| 0 → 6s | 第 4 圈（1200px，实线） | 从 300° 转到 276° | 线性 |\n| 0 → 6s | 第 5 圈（1480px，虚线） | 从 48° 转到 65° | 线性 |\n\n光点固定在各自圆环的顶点上，跟着环一起转，自己不做动画。外面两圈比画面高，只露出左右两段弧。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 2 最里圈 6 秒转过三分之一圈，光点明显在跑 | 0.4 以下外圈看不出在转 |\n| strength（变量） | 0.7 | 1 时环线清楚，像一张图表的底图 | 0.35 以下只剩光点在飘 |\n| turns 的起始角（CFG） | -30 / 200 / 115 / 300 / 48 | — | 几个角度接近时光点会排成一线，见上 |\n| turns 的转角（CFG） | 62 → 17，由内到外递减 | 外圈转角比内圈大时，外圈光点的线速度过快 | 都很小时整张卡像静止的图 |\n\n## 已知坑\n\n- 环线和光点都从标题后面穿过。细线没问题；光点转到标题笔画后面时会被字挡住半个，看起来像闪了一下。最里圈在正左、正右各 15° 的范围内会碰到标题，默认的起始角让它只走上半圈；改角度后要重新看五帧。\n- 圆环用边框画，转动的是环本身，所以光点不需要单独算位置。不要给环加 CSS 的 `transform` 来居中（会和转动冲突），位置用 left / top 写死。\n- 虚线环转动时能看出线段在走，这是有意的；但把五圈全做成虚线，画面会布满爬动的小段，很吵。\n- 把圆心移到画面一角时，外圈会变成几条几乎平行的弧线，读成波纹而不是轨道。圆心离开画面中心不要超过 400px。\n- 光晕用的是小范围的 `box-shadow`，只有五个，不影响渲染速度；别把它加到环线上。\n\n## 动效与皮的边界\n\n属于这张卡的：同心、细线、不同速、相邻反向的匀速转动，每圈一个随环走的小光点。\n\n只是皮的：圈数（三到六圈）、每圈的直径和线型、线和光点的颜色、圆心位置、光点大小。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把标题或关键词卡叠在更高的轨道上并放在圆心；`speed` 是转角倍数；`strength` 是环线和光点的浓度。\n- 时间：整镜铺满，不用对齐旁白。\n- 音效：没有。\n- 常见接法：中心放一个词（`outline-fill-title`），随后的镜头把几个方面逐个摆出来；摆出来的条目可以对齐某一圈环的位置。"},{"id":"outline-fill-title","name":"描边填实","group":"标题与章节","type":"structure","intents":["chapter","keyword"],"numbers":null,"chart":null,"one_line":"标题先只有一圈描边，停一拍后强调色从字脚往上灌，液面右高左低地爬到字顶，灌满时整行轻轻顶一下","use_when":"旁白在说“从空到实”的过程（先有框架再补内容、从想法到落地、进度走完），而且说这句话要 1.5 秒以上","energy":"中","needs":["文"],"overlay":true,"slot":3.5,"hero":1.3,"sfx":"fill=rise, done=pop","pairs_with":["kicker-headline","underline-draw"],"vars":[{"id":"title","type":"string","label":"标题（建议 4–7 个字）","default":"先搭骨架再填肉"},{"id":"sub","type":"string","label":"标题下的一行（可空）","default":"结构定了，内容才有地方放"},{"id":"fillAt","type":"number","label":"开始灌色的时间（秒）","default":0.9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.15,0.8,1.3,1.5,3.2],"doc":"## 命门\n\n1. **空心要停够。** 描边 0.65 秒就位，0.9 秒才开始灌，中间有 0.25 秒只看得到空心字。不留这一拍，观众没看清“空”，后面的“实”就没有对照。\n2. **从下往上，而且液面是斜的。** 右端比左端早 0.12 秒起步，中途液面右高左低，差大约 60px。用一条水平线平推上去，读成进度条遮罩，不是灌进去的东西。\n3. **描边和填色完全重合。** 填色层和描边层是同一个节点画两遍，字号、字距、描边宽度一样。差 1px 灌满后字边就有一圈白线露出来。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.65s | 描边字 | 淡入，缩放 0.96 → 1 | power2.out |\n| 0.90 → 1.75s | 填色层右端液面 | 从字框底下 104% 升到顶上 -12% | power2.inOut |\n| 1.02 → 1.87s | 填色层左端液面 | 同上，晚 0.12 秒 | power2.inOut |\n| 1.83 → 1.93s | 整行 | 缩放 1 → 1.035 | power2.out |\n| 1.93 → 2.21s | 整行 | 缩放回 1 | back.out(2.2) |\n| 2.02 → 2.37s | 说明行 | 上移 20px 淡入 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| fillAt 开始灌的时间（变量） | 0.9s | 对旁白的那个词，往后放没问题 | 低于 0.3s 脚本会抬到 0.3，否则空心阶段没了 |\n| fillDur 灌满时长 | 0.85s | 过 1.5s 像加载动画 | 低于 0.4s 只是一次换色 |\n| lead 右端领先 | 0.12s | 过 0.25s 液面太陡，像斜切转场 | 0 时是一条水平线 |\n| bump 灌满后的顶一下 | 1.035 | 过 1.08 抢了灌色的戏 | 1.0 时结束得没有句号 |\n| 描边宽度（样式里） | 4px | 过 6px 笔画多的字内部会糊成一片 | 2px 在缩成小窗时看不见 |\n\n## 已知坑\n\n- 一开始把空心字写成透明填色，校验直接报“文字不可见”。现在的空心字带 9% 的墨色填充，肉眼仍是空心，校验能通过；别改回全透明。\n- 填色层最初是第二个文字节点，叠在描边字上，校验报两段文字互相重叠。现在它是描边字的 `::after`，内容取自 `data-fill` 属性；手工改标题时两处都要改，脚本会自动同步。\n- 液面位置是两个 CSS 变量（`--lv-l`、`--lv-r`），由时间轴直接补间。有人把它们写进 `transition` 或关键帧，拖动时间轴时就会不同步。\n- 连拍里 1.3 秒看到的是左端 79%、右端 53% 的液面。检查倾斜方向时取这一帧，1.5 秒以后基本灌满，看不出斜度。\n- 笔画特别密的字（“赢”“繁”）在 4px 描边下内部会连成块，空心阶段读不出字。换字，或者把字号加到 200px 以上。\n\n## 动效与皮的边界\n\n属于这张卡的：先空心后实心的两段、从下往上的方向、倾斜的液面、灌满瞬间的小顶动。\n\n只是皮：描边和填色各用什么颜色，说明行，字体字重。液面可以换成带波纹的遮罩，方向可以按内容改成从左到右（讲进度时），但必须保留“空心先停一拍”。\n\n## 接进片子\n\n- 变量：`title` 4–7 个字；`sub` 说明行，传空字符串不显示；`fillAt` 开始灌色的秒数；`backdrop`。\n- 对齐：`fillAt` 对在旁白说出“再”“变成”“落地”这类转折词的时刻，灌满大约在 1 秒之后。\n- 音效：灌色全程一个上扬音，灌满那一帧（默认 1.87 秒）一个轻的弹出声。\n- 连用：前面可以用 `kicker-headline` 提问，这张卡给答案；一期里用一次。"},{"id":"page-scroll-park","name":"网页滚动停靠","group":"证据与界面","type":"evidence","intents":["point","result"],"numbers":null,"chart":null,"one_line":"一张铺满的长网页从顶部滚下去，短促起步、长长地减速，停在目标段落上，停稳后那一句被荧光笔划出来","use_when":"证据在一篇长文、文档或报告的中间某一句，需要让观众知道“这是原文里翻到的”","energy":"中","needs":["网页"],"overlay":false,"slot":4,"hero":3.4,"sfx":"scroll=whoosh, mark=draw","pairs_with":["quote-pull","browser-rise","screen-push-focus"],"vars":[{"id":"src","type":"string","label":"长网页截图地址（从项目根目录写起）","default":"motion-cards/lib/samples/page.png"},{"id":"pagew","type":"number","label":"截图原始宽度（像素）","default":1600},{"id":"pageh","type":"number","label":"截图原始高度（像素）","default":4200},{"id":"x","type":"number","label":"目标句左边（截图像素）","default":152},{"id":"y","type":"number","label":"目标句上边（截图像素）","default":1670},{"id":"w","type":"number","label":"目标句宽","default":548},{"id":"h","type":"number","label":"目标句高","default":68},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.75,1.2,2.3,3.4],"doc":"## 命门\n\n1. **起步短，刹车长。** 加速只用 0.3 秒，减速用 1.3 秒。两头对称的缓动读起来是“电梯”，匀速读起来是“字幕滚动”，只有短起长收才像手指一划之后页面自己滑到位。\n2. **两段速度要接得上。** 起步段和滑行段是两条补间，交接处速度必须相等（脚本按 3·d1/0.3 = 4·d2/1.3 分配路程，起步段走总路程的 23.5%）。接不上就会在 0.7 秒那一下顿一顿。\n3. **停稳了再划。** 荧光笔在页面停住后 0.14 秒才开始。页面还在动的时候划线，线和字一起飘，读成界面自带的高亮，不是“我划给你看”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.4s | 页面 | 停在顶部，让人认出这是哪种页面 | — |\n| 0.4 → 0.7s | 页面 + 右侧滚动条 | 起步，走完总路程的 23.5% | power2.in |\n| 0.7 → 2.0s | 页面 + 右侧滚动条 | 滑行减速，目标句的中线停在画面高度的 44% | power3.out |\n| 2.14 → 2.56s | 荧光笔色块 | 从左向右铺开，正片叠底压在句子上 | power2.inOut |\n\n默认示例总共滚 1570px（画面像素）。\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| accel 起步 | 0.3s | 过 0.5s 起步发肉，像被拖着走 | 低于 0.15s 第一帧就是最高速，像跳了一下 |\n| brake 滑行 | 1.3s | 过 2s 最后一段几乎不动，观众以为停了 | 低于 0.8s 路过的内容糊成一片，停得也硬 |\n| parkAt 停靠高度 | 0.44 | 过 0.6 目标压在画面下半，上面全是无关内容 | 低于 0.3 目标贴顶，看不到它的上文 |\n| markGap 停稳到落笔 | 0.14s | 过 0.4s 像忘了划 | 0 时线和余速叠在一起 |\n| markDur 划线时长 | 0.42s | 过 0.7s 像进度条 | 低于 0.2s 成了闪现的色块 |\n\n## 已知坑\n\n- 校验会报页面层 `escaped_container`：5040px 高的页面必然大半在画面外。在页面层加 `data-layout-allow-overflow`。\n- 荧光笔用的是正片叠底，只在**浅色页面**上成立：深色页面叠出来是黑的。深色页面把色块改成不叠底的半透明，或者改用描边框。\n- 截图的原始宽高要填对（`pagew / pageh`）。目标坐标是按原始像素填的，脚本用 1920 ÷ pagew 换算；填错一个，划线就偏。\n- 路程太短（目标就在第一屏下面一点）时，1.6 秒的滚动只挪两三百像素，像在蹭。这种情况不要滚，直接用 `screen-push-focus`。\n- 路程超过四屏时滑行段中间会很快，如果路过的是大图会闪。把 `brake` 加到 1.6 秒，或者把截图裁短。\n\n## 动效与皮的边界\n\n属于这张卡的：顶部先停一下、短起长收且速度连续的滚动、目标停在偏上的位置、停稳之后才落笔的划线。\n\n只是皮：荧光笔颜色和圆角，右侧滚动条有没有，页面内容，页面是不是铺满（也可以放进浏览器窗里）。\n\n## 接进片子\n\n- 变量：`src` 长截图；`pagew / pageh` 截图原始宽高；`x / y / w / h` 目标句在截图上的位置；`backdrop`。\n- 页面在 2.0 秒停稳，2.14 秒落笔。让旁白念到那句话的第一个字时对上 2.14 秒。\n- 音效：0.4 秒起一段掠过声并随滚动衰减，2.14 秒一笔划线声。\n- 接法：前面用 `browser-rise` 把页面请出来；划完之后用 `quote-pull` 把这句话拉成引文卡。"},{"id":"paper-grain","name":"纸感底","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"一张带细颗粒和两道淡折痕的纸铺满画面，纸本身不动，只有一片亮光和对角的暗影整镜极慢地平移","use_when":"浅色皮的讲解镜，上面要放手写批注、便签、引用或文档截图，需要一个“桌上一张纸”的底而不是屏幕感的纯色","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["margin-note","highlighter-swipe","sketch-draw","quote-pull"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"一张安静的纸，字写在上面"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"纹理和光影的浓度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **纸不动，光在动。** 颗粒和折痕全程静止，动的只有亮光和暗影。让颗粒跟着动，画面会像老电影的噪点在跳，压在上面的小字会跟着闪。\n2. **光影慢到要对比两帧才看得出。** 亮光 6 秒走 620px，暗影反方向走 520px，两者都比画面还大。能一眼看出光在移动，就成了有人拿着手电照纸。\n3. **颗粒的浓度不改变纸的颜色。** 颗粒用字色画，默认浓度下平均只把纸压暗 4% 左右。再浓，浅色纸会整体发灰，黑字的对比跟着掉。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 全程 | 颗粒层、纤维层 | 不动 | — |\n| 0 → 6s | 亮光（1500×1400 的柔光，起点在左上） | 向右下平移 620px、200px | sine.inOut |\n| 0 → 6s | 暗影（1700×1500，起点在右下） | 向左上平移 520px、180px | sine.inOut |\n| 0 → 6s | 竖折痕（x=680） | 透明度 1 → 0.55 | sine.inOut |\n| 0 → 6s | 横折痕（y=725） | 透明度 0.55 → 1 | sine.inOut |\n\n两道折痕各 70px 宽：一侧是很淡的暗边，另一侧是很淡的亮边。光往右下走时竖折痕变淡、横折痕变明显，暗示光的角度变了。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 1.6 光影的移动一眼可见，开始抢戏 | 0.5 以下基本是一张静止的纸 |\n| strength（变量） | 0.7 | 1 时颗粒和折痕都更明显，适合上面只放大字 | 0.3 接近纯色，只剩一点点质感 |\n| 颗粒层透明度（SVG rect） | 0.26 | 过 0.5 纸发灰、发脏 | 0.1 以下缩小后看不见 |\n| 纤维层透明度（SVG rect） | 0.2 | 过 0.4 横向的短丝连成拉丝金属的质感 | 0 时更像打印纸 |\n| foldLow（CFG） | 0.55 | 1 时折痕不随光变化 | 0.2 时折痕会明显地出现和消失 |\n\n## 已知坑\n\n- 颗粒是 SVG 噪声滤镜画的，全屏两层。它是静止的，但每帧仍要重画，这张卡的渲染比其他幕底慢。片子里一次只挂一张，不要叠用。\n- 噪声和填色（`feTurbulence`、`feFlood`）不依赖被滤镜的那个矩形：宿主把不在时间窗内的片段藏起来时，矩形不画了，滤镜照样把颗粒铺满全屏，盖到别的片段上（和别的卡合跑时在柱子、头像上看到了一层颗粒）。所以两个滤镜的最后都多了一步，用矩形自己的透明度（`SourceAlpha`）把结果裁一次；改滤镜时这一步不能删。\n- 纤维层的噪声在横向拉得太长（第一个频率低于 0.01）会变成拉丝金属，浓度再低也不像纸。\n- 这张卡是全库唯一不用标准深色回退值的：`#root` 里的回退值是一套浅色纸（纸 `#f3efe6`、亮光用的面板色 `#fffdf7`、字 `#1a1c20`、次要字 `#6b7280`、强调色 `#e8590c`）。宿主没设 `--mc-*` 时它自己就是米白的纸；宿主设了，就跟宿主走。改这张卡时别把回退值“统一”回标准色板。\n- 颗粒的颜色靠滤镜里的 `flood-color` 取字色。宿主是深色皮时它变成暗底上的亮颗粒，读起来像黑卡纸或黑板，能用，但不是这张卡的本意；深色片子里想要纸，在挂这张卡的片段上单独把 `--mc-bg` 和 `--mc-ink` 设成浅纸深字。\n- 折痕不要穿过正文区的正中。现在竖折在左侧三分之一处、横折在下方三分之一处；换版式时把折痕挪到文字块之间。\n- 压缩码率低时细颗粒会被抹成色块。成片码率不够就把颗粒层调浓一点、频率调低一点（0.85 → 0.6）。\n\n## 动效与皮的边界\n\n属于这张卡的：静止的纸面质感、极慢且方向相反的一明一暗两片光影、折痕明暗随光轻微变化。\n\n只是皮的：纸的颜色（`--mc-bg`）、颗粒粗细、有没有纤维、折痕的条数和位置、亮光里那一点点强调色的色温。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把批注、便签、截图叠在更高的轨道上；`speed` 是光影位移的倍数；`strength` 是纹理和光影的浓度。\n- 换皮：这张卡是为浅色皮准备的，不设任何 `--mc-*` 时默认就是米白纸（`#f3efe6`）配深色字（`#1a1c20`），缩略图和预览看到的就是这个样子。宿主项目设了 `--mc-bg`、`--mc-ink` 等变量时以宿主为准：浅色皮直接合用；深色皮会得到黑卡纸，不想要就在这一个片段上把这两个变量改回浅色。预览里加 `?skin=dark` 可以看深色皮下的样子。\n- 时间：整镜铺满，不用对齐旁白。\n- 音效：没有。\n- 常见接法：`margin-note`、`highlighter-swipe`、`sketch-draw` 这类手绘标注卡的幕底，它们的实底要关掉。"},{"id":"parallax-drift","name":"视差漂移","group":"镜头运动","type":"metaphor","intents":["metaphor"],"numbers":null,"chart":null,"one_line":"远、中、近三层内容在整镜里朝同一个方向匀速漂，5 秒里分别走 42、135、300 像素，近的快、远的慢","use_when":"画面是几张摆好的图或一组并列的素材，旁白要在上面停留几秒，想让平面的排版有前后空间","energy":"低","needs":["多图"],"overlay":false,"slot":5,"hero":2.4,"sfx":"none","pairs_with":["slow-push","media-pop","lower-third"],"vars":[{"id":"src","type":"string","label":"远层：铺满的底图地址","default":"motion-cards/lib/samples/p5.jpg"},{"id":"mid","type":"string","label":"中层：第一张图片地址","default":"motion-cards/lib/samples/p2.jpg"},{"id":"mid2","type":"string","label":"中层：第二张图片地址","default":"motion-cards/lib/samples/p3.jpg"},{"id":"near","type":"string","label":"近层：透明底前景图地址","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"dist","type":"number","label":"近层整镜一共漂多少像素（负数向左）","default":-300},{"id":"dur","type":"number","label":"这一镜多长（秒）","default":5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.1,1.2,2.4,3.6,4.8],"doc":"## 命门\n\n1. **同向，速度差至少两倍一级。** 三层的位移比是 0.14 : 0.45 : 1，相邻两层差两到三倍。差距小于 1.5 倍，看起来是整个画面在平移；有一层反着走，读成的是物体各自在动，不是镜头在动。\n2. **线性，贯穿整镜。** 和慢推一样，从第一帧走到最后一帧，不加缓动。任何一处减速都会让观众看出“这一层停了”，空间感立刻塌掉。\n3. **近层要虚、要暗。** 近层模糊 9px、亮度压到 42%，远层模糊 5px、亮度 50%，只有中层是清楚的。三层一样清楚时，眼睛分不出谁近谁远，速度差只会显得乱。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 5s（= `dur`） | 远层（铺满的底图） | 横移 +21px → −21px，共 42px | none |\n| 0 → 5s | 中层（两张图卡） | 横移 +67.5px → −67.5px，共 135px | none |\n| 0 → 5s | 近层（前景剪影） | 横移 +150px → −150px，共 300px | none |\n\n每一层都以自己的静态位置为中点，前半镜在它右边，后半镜在它左边；2.5 秒那一帧就是不跑脚本时看到的版式。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| dist 近层总位移（变量） | −300px | 绝对值过 500 近层像有人走过去，抢戏 | 低于 150 中层只走 60 多像素，视差看不出来 |\n| dur 时长（变量） | 5s | 时长翻倍时 `dist` 也跟着加一半左右，保持每秒 40–60px 的近层速度 | 短于 3 秒按比例减小 `dist` |\n| midRate 中层速度比 | 0.45 | 靠近 1 时中层和近层粘成一层 | 低于 0.3 时和远层粘成一层 |\n| farRate 远层速度比 | 0.14 | 过 0.25 需要更大的底图余量 | 0 时远层是贴死的背景，也成立，只是少一层深度 |\n| 近层模糊 / 亮度 | 9px / 42% | 更虚更暗时近层退成一块影子，更安全 | 清楚明亮的近层会挡住中层还抢视线 |\n\n## 已知坑\n\n- 近层越漂越挡住中层：默认向左漂，到 4.8 秒时前景剪影已经盖住第二张图卡的右下角。这是视差自带的效果（遮挡变化是最强的深度线索），但被盖的不能是要读的内容。排版时用近层的**终点位置**检查，不是静态位置。\n- 远层的余量：底图每边只比画面多 120px，再减去 5px 模糊吃掉的边，实际可用约 100px。远层位移是 `dist × 0.14 ÷ 2`，脚本把 `dist` 限制在 ±700 以内就是为了这个；自己把 `farRate` 调大时要同步加宽底图。\n- 底图太抢眼：示例图都是高饱和的色块，远层原样铺上去会和中层的图卡搅在一起，所以远层压到了 50% 亮度、85% 饱和度并加模糊。换成本来就暗的底图时把亮度往回调。\n- 连拍图里远层几乎不动（每格只走几个像素），判断时看中层图卡的左边距和近层的位置变化。\n- 中层的两张图卡是同一层、同速的。想让它们也分前后，要把其中一张挪到新的一层并给它 0.6 左右的速度比，不要在同一层里给两个速度。\n\n## 动效与皮的边界\n\n属于这张卡的：三层、同向、线性、两倍以上的速度级差、近虚远暗中间清楚。\n\n只是皮：每层放什么（照片、图卡、图标、文字块都行）、图卡的白边和圆角、近层用人物还是别的物体、往左还是往右漂。\n\n## 接进片子\n\n- 变量：`src` 远层底图，`mid` / `mid2` 中层两张图，`near` 近层的透明底前景图，`dist` 近层总位移（负数向左，正数向右），`dur` 这一镜的秒数，`backdrop`。\n- 起点就是这一镜的起点，`dur` 填这一镜的真实时长；不需要对旁白的词。\n- 音效：不配。\n- 连用：中层的图卡可以先用 media-pop 的方式落进来，落定后整镜开始漂；上面照常叠字幕和名条（字幕不要放进任何一层，它应该是不动的）。"},{"id":"photo-wall-dolly","name":"照片墙推轨","group":"图片与多素材","type":"evidence","intents":["grouping","hook"],"numbers":null,"chart":null,"one_line":"一面大小错落的照片墙，镜头从左上斜着扫向右下，前后三层以不同速度滑动，最后一边摆正一边推近，停在其中一张上并给它套上黄框","use_when":"旁白在说“这么多里面”，然后落到“其中这一张”；需要先给出数量很多的感觉，再把注意力收到一个点","energy":"高","needs":["多图"],"overlay":true,"slot":4.5,"hero":4.2,"sfx":"sweep=whoosh, push=rise, lock=shutter","pairs_with":["grid-to-hero","mosaic-assemble","lower-third"],"vars":[{"id":"srcs","type":"string","label":"墙上的图，用 | 分隔；第一张是镜头最后停住的那张，其余循环铺满","default":"motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p8.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p5.jpg"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,1.2,2.2,2.9,4.2],"doc":"## 命门\n\n1. **三层速度不同。** 后层按 0.55 倍、墙面 1 倍、贴近镜头的两张虚焦照片按 1.7 倍的速度滑。只有一层的话，整面墙是一张平移的大图，看不出“镜头在走”。\n2. **只停一次。** 推近从 1.9s 开始，这时横移还剩最后 1 秒；两个动作叠着做完。先移到位停住、再推近，会有两次停顿，读成两个镜头。\n3. **停下来的那张是正的、亮的。** 横移时整面墙带 7° 的侧向角度，推近时转回 0°；落定后其余照片压暗 0.55，目标套黄框。目标和别的照片一样歪、一样亮的话，观众不知道镜头为什么停在这里。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.30s | 整体 | 淡入 | power1.out |\n| 0.10 → 2.90s | 镜头 | 从目标左上方（-1500, -260）斜向移到目标正中；后层走 0.55 倍、前层走 1.7 倍的路程 | sine.inOut |\n| 约 0.9 → 1.6s | 前层两张虚焦照片 | 先后从画面里横穿过去 | 跟随镜头 |\n| 1.90 → 3.30s | 镜头 | 缩放 0.8 → 1.6，侧向角度 7° → 0° | power2.inOut |\n| 2.90 → 3.35s | 其余照片 | 压暗到 0.55 | power1.out |\n| 3.05 → 3.25s | 目标照片 | 黄框出现；此时它在画面上是 896×560 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| travel 横移时长 | 2.8s | 过 4s 像在慢慢找东西 | 低于 1.8s 照片一张都看不清，只剩色块 |\n| from 镜头起点 | (-1500, -260) | 横向过 -2000 就走出了墙的范围，左边露空 | 横向小于 -800 扫过的照片太少，没有“很多”的感觉 |\n| pushAt 推近时刻 | 1.9s | 晚于 2.7s 横移先停了，出现两次停顿 | 早于 1.2s 还没扫完就凑上去，墙的规模没交代 |\n| close 落定时的放大 | 1.6 | 过 2.0 目标几乎满屏，周围没有别的照片，墙就没了 | 低于 1.2 目标和邻居差不多大，不够主次 |\n| far / near 视差倍率 | 0.55 / 1.7 | 前层过 2.2 一闪就过去，只是一道黑影 | 两个都接近 1 就没有前后层次 |\n| yaw 侧向角度 | 7° | 过 12° 远端的照片被压得很窄，像墙倒了 | 0 时是正对着平移，少了“斜着扫”的感觉 |\n\n## 已知坑\n\n- 前层那张虚焦照片在 1.2 秒前后会挡住画面中间约三分之一，持续不到半秒。这是用来表现纵深的；旁白这时如果正好在点某一张具体的照片，把 `near` 层的两行 `mk(...)` 删掉。\n- 侧向角度需要父层有 `perspective`（这里是 1800px，写在 `.pw-stage` 上）。把它写在转动的那一层自己身上不起作用，墙只会被横向压扁。\n- 墙是脚本按固定的行列铺的（后层 28 张、墙面 28 张、前层 2 张），位置和大小的“随机”全是用 `Math.sin` 按序号算的，每次渲染都一样。镜头起点改远了要相应加列（循环里的 `c` 的范围），否则会扫到空墙。\n- `srcs` 的第一张是目标，其余循环铺满。只给两三张图时，目标那张图不会出现在别的位置，但其余的会重复得很明显；至少给六张。\n- 前层用了 9px 的 `blur` 滤镜，只有两个节点。想加更多虚焦前景时注意，大面积模糊在渲染时很慢。\n\n## 动效与皮的边界\n\n属于这张卡的：三层视差、斜向的横移、横移和推近首尾相叠只停一次、落定时摆正并压暗其余的。\n\n只是皮：照片有没有白边、每张的大小和歪斜程度、墙有多密、后层压多暗、黄框的样式、从哪个方向扫过来。\n\n## 接进片子\n\n- 变量：`srcs` 用 `|` 分隔，第一张是镜头最后停住的那张；`backdrop`。\n- 卡的开始对上旁白说“这么多”的地方；黄框出现在 3.05 秒，对上旁白说“这一张”的那个词。差得多时一起平移 `CFG.pushAt` 和 `CFG.travel`，保持“推近开始时横移还剩 1 秒左右”。\n- 音效：横移一条长的掠过声，1.9s 起一个上扬的垫音，3.05s 黄框出现时一个快门声。\n- 停住以后常接 `lower-third` 说明这张是什么；想从“很多”直接跳到“整齐排开”，后面接 `grid-to-hero`。"},{"id":"pie-wedge","name":"扇形切出","group":"数据与图表","type":"structure","intents":["number","grouping"],"numbers":[1,2],"chart":"proportion","one_line":"一个灰色的圆先顺时针扫满，停一拍，其中一块扇形沿着自己的中线向外滑出半步并变成强调色，一条引线从它身上长出去，把数字和说明带出来","use_when":"旁白在说“整体里的这一块”，重点是它属于一个整体、又要被单独拎出来看","energy":"中","needs":["数据"],"overlay":true,"slot":3.5,"hero":3.1,"sfx":"sweep=whoosh, cut=pop, label=tick","pairs_with":["unit-grid","ring-progress"],"vars":[{"id":"percent","type":"number","label":"切出来的那块占多少（1–60）","default":28},{"id":"caption","type":"string","label":"数字下面的一行说明","default":"的时间在等别人回复"},{"id":"note","type":"string","label":"来源小注（可空）","default":"示例数据"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.75,1.38,1.8,3.1],"doc":"## 命门\n\n1. **先有整体，再有局部。** 圆要先完整地画满（0.8 秒），停 0.15 秒，扇形才动。一上来就是切好的饼，观众感觉不到“这一块是从整体里拿出来的”。\n2. **只滑半步，沿自己的中线。** 扇形向外移 48px（半径的 15%），方向是它自己的角平分线，带一点过冲。滑太远就脱离了饼，像另一个图形；方向不对（比如水平移）会和旁边的切口不平行，看着是坏的。\n3. **颜色在离开的时候变。** 强调色在滑出的前 0.2 秒里淡入。先变色再滑，是“高亮了一块”；边滑边变，才是“切出来一块”。\n\n## 动作拆解\n\n默认切出 28%。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 1.10s | 灰色圆盘 | 从 12 点方向顺时针扫满 | power2.inOut |\n| 1.10s | 圆盘 | 同一帧换成“扇形 + 其余部分”两块，颜色相同，看不出变化 | — |\n| 1.25 → 1.67s | 扇形 | 沿中线向右上滑出 48px | back.out(2.4) |\n| 1.25 → 1.45s | 扇形 | 灰色 → 强调色 | 线性 |\n| 1.55 → 1.83s | 引线 | 起点圆点弹出，线先沿中线走 74px 再水平走 120px | power2.out |\n| 1.75 → 2.05s | 百分比数字 | 缩放 0.5 → 1 并淡入，原点在左侧（引线到达的那一端） | back.out(2.4) |\n| 1.95 → 2.30s | 说明行 | 从左 24px 滑入并淡入 | power3.out |\n| 2.23 → 2.53s | 来源小注 | 淡入 | 线性 |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| sweep 扫满时长 | 0.8s | 过 1.5s 观众在等，不知道要看什么 | 低于 0.4s 等于直接出现一个圆，“整体”没有建立 |\n| beat 扫满后的停顿 | 0.15s | 过 0.5s 像结束了 | 0 时扫满和切出连成一个动作，分不出两步 |\n| step 滑出距离 | 48px | 过 90px 扇形脱离了饼 | 低于 25px 缝太细，缩略图里看不出来 |\n| slide 滑出时长 | 0.42s | 过 0.7s 变成慢慢漂出去 | 低于 0.25s 过冲看不见 |\n| aim 扇形朝向 | -38°（右上） | — | 朝左时标签要整体搬到左边；朝正上或正下时引线的水平段会很别扭 |\n\n## 已知坑\n\n- 扫满用的是“半径一半、线宽等于半径的粗描边圆”，它没法挖洞。所以扫满的那一帧必须把它换成两块真正的扇形路径。两块的颜色要和描边圆完全一样，不然换的那一帧会闪。\n- 换成两块之后，扇形和其余部分的接缝处会有一条极细的浅线（两条抗锯齿边叠在一起）。在 1.10 到 1.25 秒之间能看到，正好像一道预告的切痕，所以没有处理；想去掉就给其余部分加 1px 同色描边。\n- 扇形和标签的位置是脚本按 `aim` 算出来的，静态 HTML 里路径是空的，不跑脚本时看不到饼。文字部分是静态的。\n- 比例超过 50% 时，“切出来的一块”比剩下的还大，滑出半步后重心不稳。脚本把上限设在 60%；超过一半的比例请反过来切小的那块，或者换 `ring-progress`。\n- 比例很小（5% 以下）时扇形是一根细条，变色后也不显眼。把 `step` 加到 70px，或者换 `unit-grid`。\n\n## 动效与皮的边界\n\n属于这张卡的：先扫满再切出的两步、沿角平分线滑出半步并过冲、滑出的同时变色、引线从扇形长向标签。\n\n只是皮：饼的大小和位置、灰色的深浅、扇形朝哪个方向、引线的折法、标签的字号、有没有那圈细的底环。\n\n## 接进片子\n\n- 变量：`percent` 切出来的那块占多少（1–60）；`caption` 数字下面的说明行；`note` 来源小注（留空不显示）；`backdrop`。\n- 对齐：扇形开始滑出（1.25 秒）对旁白说“其中”“有一块”的那个词，数字弹出（1.75 秒）对旁白报出百分比。\n- 音效：扫满时一个掠过声，滑出时一个“啵”，标签到位一声轻的“嗒”。\n- 一张饼只切一块。想讲两块，就连用两次这张卡，或者换成 `bar-grow`。\n- 示例数字是编的，画面上标了“示例数据”。"},{"id":"pip-corner","name":"画中画缩到角","group":"图片与多素材","type":"evidence","intents":["transition","host"],"numbers":null,"chart":null,"one_line":"满屏的画面在 0.5 秒里朝一个角收拢，先缩得比小窗略小、再弹到位，带上白边和阴影停在角上，把主画面让出来","use_when":"前一段是满屏的实拍或录屏，旁白要转去讲别的内容，但这段画面还得留在眼角（操作还在继续、人还在说话）","energy":"中","needs":["图"],"overlay":true,"slot":3.5,"hero":1.4,"sfx":"shrink=whoosh, dock=pop","pairs_with":["title-to-corner","kicker-headline","lower-third"],"vars":[{"id":"srcs","type":"string","label":"满屏那张图的地址（只用第一张）","default":"motion-cards/lib/samples/p4.jpg"},{"id":"corner","type":"enum","label":"缩到哪个角","default":"br"},{"id":"size","type":"number","label":"小窗宽度（px）","default":560},{"id":"kicker","type":"string","label":"让出来的主画面：小标题（可空）","default":"接下来"},{"id":"title","type":"string","label":"让出来的主画面：标题（可空）","default":"把这一步拆开看"},{"id":"note","type":"string","label":"让出来的主画面：说明（可空）","default":"原画面缩到角上，继续放"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.85,1.05,1.4,3.2],"doc":"## 命门\n\n1. **钉在角上缩。** 小窗用 `right/bottom`（或 `left/top`）钉住目标角，只改宽高和 60px 的边距。它是朝着那个角收拢的，路径是一条直线。用 `left/top` 从画面中心算位移的话，宽高和位置的缓动稍有不同，小窗就会在半路画一个 S 形。\n2. **先小后弹。** 0.6 → 1.1s 缩到最终尺寸的 0.9 倍，1.1 → 1.38s 再弹到位。直接缩到最终尺寸停住，像一次普通的缩放；多这一下，才有“卡进停靠位”的感觉。\n3. **缩完就让出主画面。** 底下的内容在 0.75s 就开始从 1.05 缩回 1、变实，不等小窗落定。等小窗完全停稳再出主内容，中间会空出将近半秒什么都没有的画面。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 3.4s | 小窗里的图 | 一直缓慢推近 1 → 1.08（代替“视频还在放”） | 线性 |\n| 0 → 0.60s | 满屏画面 | 停住 | — |\n| 0.60 → 1.10s | 小窗 | 宽高 1920×1080 → 504×284（最终的 0.9 倍），圆角 0 → 22，阴影出现 | power3.inOut |\n| 0.68 → 1.43s | 小窗 | 离两条画面边的距离 0 → 60px，略过头再回来 | back.out(1.7) |\n| 0.70 → 0.95s | 白边 | 透明 → 不透明 | power1.out |\n| 0.75 → 1.35s | 让出来的主内容 | 缩放 1.05 → 1，透明度 0.4 → 1 | power3.out |\n| 1.10 → 1.38s | 小窗 | 宽高弹到 560×315 | back.out(2.4) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| at 满屏停留 | 0.6s | 这段本来就是前一个镜头的延续，可以随便长 | 0 时一上来就在缩，观众没看清原画面 |\n| shrink 收拢时长 | 0.5s | 过 0.8s 像慢慢被挤走 | 低于 0.3s 看不出它去了哪个角 |\n| under 先缩到几成 | 0.9 | 1.0 就没有弹的那一下 | 低于 0.8 弹得太大，小窗像在跳 |\n| size 小窗宽度（变量） | 560px | 过 700px 会压到让出来的标题 | 低于 400px 里面的内容基本看不清，只剩“还在放”的意思 |\n| margin 离边距离 | 60px | 过 100px 小窗像悬在半空 | 低于 30px 贴边，阴影被画面边切掉 |\n| drift 图的缓慢推近 | 1.08 | 过 1.15 小窗里的图明显在动，抢戏 | 1.0 小窗是一张定格图 |\n\n## 已知坑\n\n- 让出来的标题在前 0.6 秒被满屏画面完全盖着，`verify` 会把它当成“字被挡住”。三行字都加了 `data-layout-allow-occlusion`，这是有意的叠压。\n- 白边是单独的一层，盖在图上淡入。直接给小窗加 `border` 并让它从 0 长到 6px，图会被边框往里挤，收拢过程中画面内容在抖。\n- 小窗是 16:9（560×315），示例图是 16:10，上下各裁掉一点；满屏时同样是裁过的，所以前后一致。素材是别的比例时，改脚本里 `w * 9 / 16` 这个算式。\n- 选左边的两个角（`bl` / `tl`）时，让出来的文字会自动改成靠右对齐，避开小窗。自己换了主内容的版式，要按小窗的位置（宽 `size`、高约 `size × 0.56`、离边 60px）把那一块空出来。\n- 这张卡的“满屏画面”是一张图。前一个镜头是视频时，取它最后一帧存成图填进 `srcs`，并把卡的开始对在那一帧上，接缝才看不出来。\n\n## 动效与皮的边界\n\n属于这张卡的：钉住一个角收拢、先缩过头再弹到位、收拢途中带上边框圆角阴影（从“画面”变成“一个窗口”）、主内容在收拢中途就接上来。\n\n只是皮：哪个角、小窗多大、白边的颜色和粗细、圆角、让出来的主内容是标题还是别的卡、图在小窗里要不要缓慢推近。\n\n## 接进片子\n\n- 变量：`srcs` 满屏那张图（只用第一张）；`corner` 缩到哪个角；`size` 小窗宽度；`kicker` / `title` / `note` 是演示用的主内容，三个都留空就只剩小窗；`backdrop`。\n- 真实用法：`backdrop: off`、三个文字变量留空，把这张卡放在高一层的轨道上，下面一层放接下来要讲的内容。小窗落定后（1.4s 以后）可以一直留着，把 `slot` 设成下面那段内容的时长。\n- 卡的 0.6 秒对上旁白转话题的那个词（“接下来”“我们换个角度”）。\n- 音效：0.6s 一个短的掠过声，1.1s 弹到位时一个轻的弹出声。\n- 常和 `title-to-corner` 对着用：一个把画面收到角上，一个把标题收到角上。"},{"id":"polaroid-drop","name":"拍立得连落","group":"图片与多素材","type":"evidence","intents":["steps","categories"],"numbers":null,"chart":null,"one_line":"三四张带白边的照片一张接一张从画面上方加速落到桌上，每张倾角不同、压住前一张的边，被压的那张会被碰得晃一下","use_when":"旁白在数“第一、第二、第三”，每一项都有一张图，而且几项是并列的、不需要谁更大","energy":"中","needs":["多图","文"],"overlay":true,"slot":3,"hero":1.75,"sfx":"land1=impact, land2=impact, land3=impact, land4=impact","pairs_with":["media-pop","stack-fan","lower-third"],"vars":[{"id":"srcs","type":"string","label":"三到四张图的地址，用 | 分隔，按落下的先后排","default":"motion-cards/lib/samples/p3.jpg|motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p8.jpg"},{"id":"captions","type":"string","label":"每张照片白边上的字，用 | 分隔（可空）","default":"准备素材|写下要求|对比结果|挑出最好"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.45,1,1.6,1.75,2.7],"doc":"## 命门\n\n1. **加速落下。** 下落用 power2.in，越到底越快，落地那一帧速度最大。换成 out 类缓动，照片是“飘”进来慢慢停住，读成幻灯片的滑入，没有重量。\n2. **落地碰到邻居。** 后一张压住前一张 85px 的边，落地那一帧前一张被撞得转 1.1°、让开 7px，再回来。去掉这一下，几张照片像是分别贴上去的，互相没有关系。\n3. **间隔不等。** 四张的起落间隔是 0.36、0.34、0.44 秒，最后一张多等一拍。等间隔会被听成节拍器，最后一张也没有“收尾”的感觉。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.54s | 第 1 张 | 从画面上方落到位，缩放 1.16 → 1，边落边转 9°，过头 1.6° | power2.in |\n| 0.54 → 0.86s | 第 1 张 | 倾角回到 -7° | back.out(2.6) |\n| 0.56 → 0.90s | 第 2 张 | 同上，落定 4.5° | power2.in → back.out(2.6) |\n| 0.90 → 0.96 → 1.22s | 第 1 张 | 被撞：转 1.1°、左移 7px，再回位 | power1.out / power2.out |\n| 0.90 → 1.24s | 第 3 张 | 同上，落定 -3°；1.24s 撞第 2 张 | power2.in → back.out(2.6) |\n| 1.34 → 1.68s | 第 4 张 | 同上，落定 6.5°；1.68s 撞第 3 张 | power2.in → back.out(2.6) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| fall 下落时长 | 0.34s | 过 0.5s 能看清整张照片在空中，像慢动作 | 低于 0.22s 只剩一闪，看不出从上面来 |\n| starts 起落时刻 | 0.2 / 0.56 / 0.9 / 1.34 | 间隔过 0.6s 变成一张一张单独讲，那该用四次 `media-pop` | 间隔小于 0.32s 前一张还没坐稳就被撞，倾角会跳 |\n| fromScale 起始大小 | 1.16 | 过 1.3 像从镜头前砸下来，抢戏 | 1.0 是平面下滑，没有“落到桌面”的纵深 |\n| spin 下落中多转的角度 | 9° | 过 20° 像被甩出来 | 0 时照片僵直下落，像贴纸 |\n| nudge 被撞的角度 | 1.1° | 过 3° 像被推开，注意力跑到旧照片上 | 0 时几张互不相干 |\n| angles 落定倾角 | -7 / 4.5 / -3 / 6.5 | 过 ±10° 白边上的字难读，角也容易出画 | 全设成 0 就成了一排证件照 |\n\n## 已知坑\n\n- 第 4 张最初是 8°、间距 425px，落定后右上角离画面右边只剩约 40px。现在间距 415px、倾角 6.5°。自己改倾角时先看最右和最左那张的角有没有贴边。\n- 被撞的回位动作和这张照片自己的“坐稳”动作改的是同一个倾角。相邻两张的落地时刻至少要隔 0.32 秒（坐稳的时长），不然两个动作抢同一个值，倾角会跳一下。\n- 白边上的字是 44px，照片内宽 460px，最多放 9 个字。再长会顶到白边外面，这里没有做自动缩小。\n- 起落位置是“自己的 top 再加 720px”往上算的，保证整张在画外。把照片改高或把 `fromScale` 调大时，这个 720 也要加大，否则第一帧能看到照片的下沿。\n- 只给三张图时脚本会隐藏第 4 张、把间距放到 560px，时间轴在 1.56s 就结束了。这时把 `slot` 收到 2.5 秒，别让落定画面空等。\n\n## 动效与皮的边界\n\n属于这张卡的：加速下落、落地时倾角过头再回正、后一张压住前一张并把它撞一下、不等的间隔。\n\n只是皮：白边的宽窄和下方留白的高度、有没有字、照片的宽高比、阴影、三张还是四张、每张具体歪多少度。\n\n## 接进片子\n\n- 变量：`srcs` 三到四张图，用 `|` 分隔，按落下的先后排；`captions` 每张白边上的字，同样用 `|` 分隔，可以留空；`backdrop`。\n- 落地时刻是 0.54 / 0.90 / 1.24 / 1.68 秒。让每一次落地对上旁白数到这一项的那个词；旁白的间隔和默认值差得多时，直接改 `CFG.starts`。\n- 音效：每次落地一个短的撞击声，最后一张可以略重。\n- 落完以后常接 `lower-third` 给一句总结，或者用 `stack-fan` 换一批图。"},{"id":"progress-rail","name":"章节进度轨","group":"标题与章节","type":"structure","intents":["chapter","steps"],"numbers":null,"chart":null,"one_line":"顶部一条分段的轨道，刚走完的那段先暗下去、标签缩回，当前段再从左到右填满，它的标签放大变亮","use_when":"一期内容有 3–5 个并列的段落，每次换段时用 2–3 秒告诉观众“走到哪了”；也可以整期常驻在画面顶上","energy":"低","needs":["文"],"overlay":true,"slot":3,"hero":1.1,"sfx":"fill=tick","pairs_with":["chapter-numeral","title-to-corner"],"vars":[{"id":"steps","type":"string","label":"各段的名字，用 | 分开（3–5 段）","default":"明确目标|拆解任务|给出示例|检查结果"},{"id":"current","type":"number","label":"现在走到第几段（从 1 数）","default":2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.6,0.85,1.1,2.6],"doc":"## 命门\n\n1. **先交出去，再接过来。** 上一段在 0.40 秒开始变暗，当前段 0.52 秒才开始填，中间差 0.12 秒。两段同时变，读成“两段一起闪了一下”，看不出方向。\n2. **走过的段不消失。** 走过的段保留填充，只是降到 0.32 的浓度。清空它，轨道就退化成一个只显示当前位置的指示灯，观众数不出已经走了几段。\n3. **标签的大小就是状态。** 当前段的标签放大到 1.3 倍、换成正文色（序号换成强调色），其余标签是 48px 的次要文字色，不降透明度所以仍然读得清。只靠轨道上那 28px 高的色条，缩成手机小窗时看不出哪段是当前段。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.40 → 0.70s | 上一段的填充 | 浓度 1 → 0.32 | power2.out |\n| 0.40 → 0.70s | 上一段的标签 | 1.3 倍缩回 1 倍，正文色 → 次要文字色（序号从强调色 → 次要文字色） | power2.inOut |\n| 0.52 → 1.22s | 当前段的填充 | 从左端填到满 | power2.inOut |\n| 0.70 → 1.12s | 当前段的标签 | 以左端为原点放大到 1.3 倍，次要文字色 → 正文色（序号 → 强调色） | back.out(2) |\n\n更早走过的段和还没到的段在整段里不动。\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| fillDur 填充时长 | 0.7s | 过 1.2s 像在加载 | 低于 0.35s 看不出从左到右的方向 |\n| fillLag 交接间隔 | 0.12s | 过 0.4s 中间有一拍哪段都不亮 | 0 时两段同时变 |\n| grow 当前标签倍数 | 1.3 | 过 1.45 会碰到右边一段的标签 | 低于 1.15 和旁边的标签分不出大小 |\n| dimFill 走过段的浓度 | 0.32 | 过 0.6 和当前段分不清 | 低于 0.15 和没走到的空轨分不清 |\n| labelLag 标签滞后 | 0.3s | 过 0.7s 填满了标签才动，脱节 | 0 时标签先于填充变亮，因果反了 |\n\n## 已知坑\n\n- 标签放大是以左端为原点的，放大后向右多占 30%。轨道左右各留 80px，4 段时每段约 422px 宽，“02 拆解任务”（48px 字）放大后约 345px，放得下；5 段时每段约 333px，放大后只容得下 3 个字的名字，4 个字以上要么减字要么把 `grow` 降到 1.15。\n- 轨道和标签是脚本按 `steps` 重建的，HTML 里写的 4 段只是不跑脚本时的样子。直接改 HTML 里的段落不会生效，要改变量。\n- 走过的段、没到的段的状态是静态摆好的，不在时间轴里；所以 `current` 填 1 时没有“上一段变暗”这半个动作，只有填充和标签放大。\n- 压在浅色实拍上时（`backdrop: off`），深色空轨几乎看不见。空轨带了一圈 7% 的亮边，仍不够时给轨道容器加一层半透明深色垫底。\n- 标签的颜色是补间出来的，GSAP 不认 `var(--k-…)`，脚本开头先把正文色、次要文字色、强调色读成色值。宿主换皮不用改脚本；但时间轴建好之后再改 `--mc-*`，标签颜色不会跟着变。\n- 标签 48px，轨道 28px 高。想把轨道缩成更细的常驻条，标签会低于 40px，那种用法请去掉标签只留轨道。\n\n## 动效与皮的边界\n\n属于这张卡的：分段、走过的段保留但变暗、交接的先后顺序、当前段从左到右填充、当前标签放大。\n\n只是皮：轨道在顶部还是侧边（侧边时把填充改成从上到下），轨道粗细圆角，序号有没有，颜色。\n\n## 接进片子\n\n- 变量：`steps` 各段名字，用 `|` 分开；`current` 现在是第几段，从 1 数；`backdrop` 填 `off` 时透明压在画面上。\n- 对齐：每次换段时插一次，起点放在旁白说出新段名字之前 0.5 秒，填充在 0.52 秒开始。\n- 音效：填充开始时一下轻的滴答；常驻用法不加声音。\n- 连用：和 `chapter-numeral` 同一镜叠用（章节页在下，进度轨在上）；或者在 `title-to-corner` 的角标右侧常驻。"},{"id":"pull-reveal","name":"拉出全貌","group":"镜头运动","type":"evidence","intents":["result","hook"],"numbers":null,"chart":null,"one_line":"开场是 3.2 倍的局部特写，停 0.8 秒后镜头向后拉 1.5 秒退到整个画面，再用一个框标出刚才看的是哪一块","use_when":"旁白先讲一个细节、再说“而这只是其中一项”；或者想让观众先猜这是什么，再给答案","energy":"中","needs":["图"],"overlay":false,"slot":4,"hero":3.2,"sfx":"pull=whoosh","pairs_with":["crash-zoom","slow-push","screen-push-focus"],"vars":[{"id":"src","type":"string","label":"画面地址（从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"fx","type":"number","label":"开场特写对着哪一点：横向 0–1","default":0.31},{"id":"fy","type":"number","label":"开场特写对着哪一点：纵向 0–1","default":0.4},{"id":"zoom","type":"number","label":"开场特写的倍数","default":3.2},{"id":"hold","type":"number","label":"特写停多久再拉（秒）","default":0.8},{"id":"mark","type":"enum","label":"拉开后框出刚才看的那一块","default":"on"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.4,1.4,1.633,1.867,3.2],"doc":"## 命门\n\n1. **先让人看够特写。** 拉之前停 0.8 秒，这段时间画面里只有局部。一上来就拉，观众还没建立“我在看这个”，后面的全貌就不是揭晓，只是一次缩小。\n2. **拉的过程两头慢。** 1.5 秒，`power3.inOut`。匀速拉像监控画面在变焦；只有缓出没有缓入，起步那一下是跳的。\n3. **落点是完整画面，一步到位。** 最后必须退到缩放 1、整张图恰好铺满。停在 1.3 倍之类的中间值，观众看到的仍然是“一部分”，没有“原来如此”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.8s（`hold`） | 镜头 | 对着 (fx, fy) 的特写，缩放 3.2 → 3.104（往外松 3%） | none |\n| 0.8 → 2.3s | 镜头 | 缩放 3.104 → 1，位移同步归零 | power3.inOut |\n| 1.73 → 2.18s | 标记框 | 透明度 0 → 1 | power2.out |\n\n标记框画在内容层上，位置和大小就是开场那一刻的取景范围（默认 600×338），所以它跟着画面一起缩小，落定后正好圈住刚才的特写。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| zoom 开场倍数（变量） | 3.2 | 过 4 倍 1920 宽的图明显发虚，除非素材本身有 4K | 低于 2 倍，开场已经能看出周围是什么，没有悬念 |\n| hold 特写停留（变量） | 0.8s | 配合旁白可以拉到 2–3 秒，停留期间有 3% 的外松不会死 | 低于 0.4s 等于没有特写 |\n| pull 拉出时长 | 1.5s | 过 2.2s 拖沓，中段像在等 | 低于 0.9s 变成一次反向的急推，揭晓感变成惊吓 |\n| creep 停留时外松 | 3% | 过 6% 提前泄露周围内容 | 0 时特写是一张定格 |\n| mark（变量） | on | — | 关掉后全貌里找不到刚才那一块，适合全貌本身就是答案的图片 |\n\n## 已知坑\n\n- 第一版的标记框外面压了一层 38% 的暗色，想突出框里的内容，结果好不容易拉出来的全貌整个变暗了，揭晓的东西被自己盖住。现在只留一圈描边。\n- 目标点靠边时特写不居中：镜头被限制在画面范围内，`fx` 小于 0.16 或大于 0.84（3.2 倍时）目标会偏向一侧。这是为了不露边，换倍数时这个范围是 0.5 ÷ zoom 到 1 − 0.5 ÷ zoom。\n- 拉的前四成几乎不动：1.4 秒（拉了 0.6 秒）时缩放才从 3.1 到 2.57。连拍图的第二格看着和第一格差不多是正常的，选帧时把中间三格往后放。\n- 特写发虚：示例图是 1920 宽，3.2 倍时每个像素被放大三倍多。真实项目里用比成片大的原图，或者把倍数降到 2.5。\n- 放大后的镜头层有一半在画面外，检查会报 `escaped_container`；包裹层上加了 `data-layout-allow-overflow`，换结构时别丢。\n\n## 动效与皮的边界\n\n属于这张卡的：先停后拉的顺序、拉到恰好全貌、缩放和位移共用一条两头慢的缓动、特写停留时的轻微外松。\n\n只是皮：标记框的颜色、粗细、圆角、要不要；被拍的是界面、照片还是图表；实底还是透明。\n\n## 接进片子\n\n- 变量：`src` 画面地址，`fx` / `fy` 开场特写对准的点（0–1），`zoom` 开场倍数，`hold` 特写停多久，`mark` 落定后是否框出，`backdrop`。\n- 对旁白：这一镜的起点对齐讲细节的那句话；`hold` 调到“而这只是……”的转折词出现的时刻，镜头在那个词上开始拉。\n- 音效：开始拉的那一帧（`hold` 处）放一个由近到远的掠过声，长度和 1.5 秒对齐。\n- 连用：和 crash-zoom 是一对，一进一出；落定后可以叠标注类的卡指向别的项。"},{"id":"push-through","name":"穿过去","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜朝镜头越冲越快、放大到糊成一片色，下一镜从同一点的深处很小地出现，迎面放大并急刹到位","use_when":"旁白说“点进去”“往里看”“深入一层”，下一镜是上一镜里某个东西的内部或下一级","energy":"高","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"rush=whoosh, land=impact","pairs_with":["crash-zoom","screen-push-focus"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"ox","type":"number","label":"从哪一点穿过去：横向 0–1","default":0.5},{"id":"oy","type":"number","label":"从哪一点穿过去：纵向 0–1","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.934,1,1.1,1.6],"doc":"这张卡**不是叠加层**：它要放大两镜的画面本身，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **两镜朝同一个方向运动。** 上一镜在放大，下一镜也在放大，镜头一直往前走，只是穿过了一层。下一镜如果是从大缩回来，就成了“推进去又拉出来”，那是匹配缩放，意思不同。\n2. **上一镜加速，下一镜减速。** 冲出去用 power3.in（最后 3 帧从 2.3 倍冲到 6 倍），到位用 expo.out（第 1 帧就走完 44%）。两段的速度在换镜处接上，中间没有慢下来的一帧；一旦有，读成两个独立的缩放。\n3. **下一镜出现时，四周是上一镜糊掉的颜色，不是黑底。** 上一镜放大到 6 倍并模糊后是一片色雾，它一直留在下一镜的后面，直到下一镜长满画面。四周是黑的话，下一镜像一张卡片飞过来，没有“穿过”的感觉。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒。没有全遮；下一镜在 0.967 → 1.033s 的两帧里淡入。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.767 → 1.033s | 上一镜 | 以穿过点为原点，缩放 1 → 6，模糊 0 → 14px | power3.in |\n| 0.967 → 1.033s | 下一镜 | 透明度 0 → 1 | 线性 |\n| 0.967 → 1.367s | 下一镜 | 以同一点为原点，缩放 0.3 → 1 | expo.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| rush 冲出时长 | 0.267s | 过 0.45s 变成一个慢慢的推镜，没有冲劲 | 低于 0.17s 看不到加速 |\n| peak 冲到几倍 | 6 | 10 以上色雾更均匀，但原图分辨率不够时能看见色块 | 低于 4 还能认出上一镜的内容，像放大失败 |\n| deep 下一镜起始大小 | 0.3 | 0.6 以上“深处”感没了，只是轻微放大 | 低于 0.15 第一帧小到看不见，白占一帧 |\n| arrive 到位时长 | 0.4s | 过 0.6s 尾巴太长，下一镜迟迟不稳 | 低于 0.25s 没有刹车感 |\n| haze 上一镜模糊 | 14px | 过 30px 色雾发灰 | 0 时放大的像素边缘很脏 |\n\n## 已知坑\n\n- 穿过点（`ox` / `oy`）要选在上一镜里一块颜色比较整的地方，或者正是旁白说的那个东西。对着高对比的细节放大 6 倍，色雾会带着明显的条纹。\n- 下一镜到位前有大约 5 帧能看见它的四条边和一圈阴影。这是有意的（它是“远处的一块画面”）；不想要这个边，把 `deep` 调到 0.6 以上，但纵深感也跟着没了。\n- `to` 放大到位后要和下一镜真正的第一帧完全一致，不然这段结束的那一帧会跳。\n- 穿过点偏离画面中心很多时，下一镜是从那个偏的位置长出来的，前两帧大半画面还是上一镜的色雾；偏得越多 `arrive` 越要短一点。\n\n## 动效与皮的边界\n\n属于这张卡的：同向放大、前加速后减速并在换镜处接上、下一镜从小而远处出现、上一镜化成色雾垫在后面。\n\n只是皮：穿过点的位置、冲到几倍、下一镜四周的阴影浓淡、色雾的模糊量。\n\n## 接进片子\n\n- 变量：`from`、`to`（地址从项目根目录写起），`ox` `oy` 穿过点（0–1），`backdrop`。\n- 对齐：这段自己占 2 秒，两镜的交界在卡内 1.0 秒。只取动的部分就是卡内 0.767 → 1.367 秒。\n- 音效：冲出时一个上扬的掠过声，1.0 秒附近到顶；下一镜刹住时（约 1.2 秒）可以加一个很轻的落地声。\n- 常见接法：先用急推把镜头推到一个按钮或卡片上，再从那里穿过去到它的详情画面。"},{"id":"quote-pull","name":"引文拉出","group":"证据与界面","type":"evidence","intents":["point","definition"],"numbers":null,"chart":null,"one_line":"文档里的一句话先被强调色从左到右划过，这条色块连同上面的字轻压一下后离开纸面、放大到画面中央成为引文卡，身后的页面同时虚化变暗","use_when":"旁白要原样引用文档、文章或报告里的一句话，并且希望观众知道这句话是从原文里拿出来的","energy":"中","needs":["文"],"overlay":false,"slot":4,"hero":3.4,"sfx":"swipe=draw, pull=whoosh","pairs_with":["page-scroll-park","highlighter-swipe","lower-third"],"vars":[{"id":"quote","type":"string","label":"被拉出来的那句话（一行，建议 14 字以内）","default":"先给例子，再提要求。"},{"id":"source","type":"string","label":"出处（可空）","default":"示例文档 · 第 2 节"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.7,1.35,1.55,3.4],"doc":"## 命门\n\n1. **卡就是那条划线。** 引文卡一开始缩到 0.35 倍，正好盖在原句上，看起来只是一道荧光笔；之后是这同一块东西被拉出来。另起一张卡从画面中央淡入，原句和引文之间就没有“是同一句”的联系了。\n2. **起点对准原句。** 卡片缩小后的文字要和页面上那句话逐字重合，字号比就是起始缩放（42 ÷ 120）。对不准，划线那一步就能看到重影。\n3. **页面退后和卡片出来是同一刻。** 页面的虚化、变暗、缩小和卡片的放大用同一段 0.62 秒。页面先虚化再出卡，中间有一拍画面里什么都读不了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.4 → 0.85s | 卡片（缩在原句上） | 从左到右揭开，像一道划线 | power2.inOut |\n| 1.1 → 1.2s | 卡片 | 往下轻压：缩放再乘 0.94，右移 8px、下移 3px | power2.in |\n| 1.2 → 1.82s | 卡片 | 放大到 1 倍并移到画面正中，带一点过冲 | back.out(1.25) |\n| 1.2 → 1.5s | 卡片投影 | 淡入 | power1.out |\n| 1.2 → 1.82s | 页面 | 虚化 0 → 9px，亮度 1 → 0.42，缩放 1 → 0.965 | power2.out |\n| 1.2s | 原句位置 | 留下一条 45% 浓度的划线痕迹 | 瞬间 |\n| 1.77 → 2.07s | 引号 | 上移 30px 淡入 | power3.out |\n| 1.92 → 2.22s | 出处 | 淡入 | power1.out |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| swipe 划线时长 | 0.45s | 过 0.8s 像进度条 | 低于 0.25s 色块是闪出来的，看不出方向 |\n| wait 划完到拉出 | 0.25s | 过 0.6s 观众以为划线就是全部 | 0 时划线还没读完就飞走了 |\n| dip 预压 | 0.1s | 过 0.2s 像卡了一下 | 0 时卡片是飘起来的，没有“揭下来”的力 |\n| pull 拉出时长 | 0.62s | 过 0.9s 飘 | 低于 0.4s 看不出是从原句来的 |\n| blur 页面虚化 | 9px | 过 16px 身后只剩一片色，不像文档了 | 低于 4px 页面的字和引文抢着被读 |\n| maxFont 引文字号上限 | 120px | 一行放得下的字更少 | 低于 80px 引文不够分量 |\n\n## 已知坑\n\n- 引文必须是一行。页面上是一行、卡片上折成两行，两头的形状对不上，中途文字会被拉扁。脚本按字数自动缩字号（1400 ÷ 字数，上限 120px），14 个字以内最好看，超过 20 个字就低于 70px 了。\n- 卡片压在页面文字上，校验会报 `content_overlap`（两块文字重叠）。这是这个动法本身的结构，让不开，所以在卡片的文字、引号、出处上加了 `data-layout-allow-overlap`；`data-layout-allow-occlusion` 不管这一条。\n- 划线那一步是用裁剪做的，裁剪会把卡片的投影一起裁掉。所以拉出的那一刻要把裁剪关掉（设成 none），投影另用一个子层淡入。\n- 起点位置是读排版偏移算出来的，原句所在的那一行必须独占一行、不换行。把原句塞进段落中间，它一折行，起点就是错的。\n- 页面是浅色、卡片是强调色时最清楚。把皮换成浅底深字后，页面会变成深色纸，记得确认划线色块上的字还读得出。\n\n## 动效与皮的边界\n\n属于这张卡的：卡片从原句的位置和大小出发、先划线后拉出、拉出前的预压、页面同步退后。\n\n只是皮：卡片的底色和圆角，引号的造型，出处那一行，页面上的其他文字和标题，页面是纸还是网页。\n\n## 接进片子\n\n- 变量：`quote` 被拉出的那句话（一行，建议 14 字以内；页面上的原句会同步替换）；`source` 出处，留空就不显示；`backdrop`。\n- 划线 0.4 秒开始，对齐旁白开始念这句话；卡片 1.82 秒落定，之后停住，让旁白把这句话念完。\n- 音效：0.4 秒一笔划线声，1.2 秒一个短的掠过声。\n- 接法：前面用 `page-scroll-park` 把页面滚到这一句，再切到这张卡；页面上的其他文字要换成真实原文，改模板里的几段正文即可。"},{"id":"rack-focus","name":"焦点转移","group":"镜头运动","type":"evidence","intents":["compare","point"],"numbers":null,"chart":null,"one_line":"前景清楚、后景虚着停一秒，然后 0.7 秒内两层的虚实对调，同时前后层各往相反方向挪一二十像素","use_when":"旁白的注意力从“谁在看”转到“看的是什么”，或者从一个东西转到它背后的另一个东西，而你不想切镜","energy":"低","needs":["图","人"],"overlay":false,"slot":3.5,"hero":2.8,"sfx":"none","pairs_with":["slow-push","blur-resolve","lower-third"],"vars":[{"id":"src","type":"string","label":"后层画面地址（从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"front","type":"string","label":"前层图片地址（透明底）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"fx","type":"number","label":"前层放在哪：横向 0–1","default":0.16},{"id":"to","type":"enum","label":"焦点最后落在","default":"back"},{"id":"at","type":"number","label":"开始转焦的时间（秒）","default":1},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,1.2,1.367,1.533,2.8],"doc":"## 命门\n\n1. **两层同时变，方向相反。** 前层从清楚到 20px 模糊、后层从 16px 模糊到清楚，用同一个时钟、同一条缓动。只让一层变清楚是“淡入”，先虚掉一层再清楚另一层是两个动作，都读不成“焦点移过去了”。\n2. **0.7 秒，两头慢。** 像手拧对焦环：起步和到位都是软的。0.3 秒以内像自动对焦抽了一下，1.2 秒以上观众会在中间那段两层都糊的时间里失去画面。\n3. **位移要有，但只有一点。** 前层左移 24px，后层右移 12px，后层同时从 1.025 倍缩回 1。完全不动是两张图在调滤镜；位移超过 60px 就成了视差镜头，焦点不再是主角。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 1.0s（`at`） | 两层 | 前层清楚，后层 16px 模糊、1.025 倍，静止 | — |\n| 1.0 → 1.7s | 前层 | 模糊 0 → 20px，横移 0 → −24px | power2.inOut |\n| 1.0 → 1.7s | 后层 | 模糊 16px → 0，横移 0 → +12px，缩放 1.025 → 1 | power2.inOut |\n\n`to` 填 `front` 时整个过程反过来：从后层清楚开始，焦点落到前层。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| dur 转焦时长 | 0.7s | 1.0s 更抒情，过 1.2s 中段太糊 | 0.4s 偏新闻感，低于 0.3s 像故障 |\n| blurBack 后层虚化 | 16px | 过 24px 后层只剩色块，转过来时像换了一张图 | 低于 8px 一开始就能读后层的字，没有“转”的必要 |\n| blurFront 前层虚化 | 20px | 前层面积大时可以到 28px，让它彻底退成一团 | 低于 10px 前层的轮廓还在抢视线 |\n| shiftFront / shiftBack 反向位移 | −24px / +12px | 各自翻倍后是明显的横移 | 0 时没有空间感 |\n| breathe 后层呼吸 | 2.5% | 过 5% 像在推镜 | 0 也成立，只是少一点镜头味 |\n| fx 前层位置（变量） | 0.16 | 靠右放时把两个位移的正负号也对调 | — |\n\n## 已知坑\n\n- 模糊会把图层的边吃掉：16px 的模糊在离边四五十像素内都会透出底色。后层必须比画面大一圈，现在是 2112×1188（每边多出 96 / 54px）。直接用 1920×1080 铺满，开场四条边是暗的。\n- 前层挡住了要读的东西：第一版前景放在 fx 0.2、偏上，落定后正好盖住后层每一行的勾选框和标题开头。挪到 0.16、整体下移 120px 才让开。换后层内容时先看落定帧，前层压着的地方不能有关键信息。\n- 前层图片的底边：示例人物图的下沿是平切的，底边必须落在画面外（现在在画面下方约 340px），不然虚化后能看到一条发灰的横边。\n- 前层虚化后比清楚时大一圈（模糊向外扩散约 40px），会多盖住一点后层，排版时按虚化后的轮廓留位置。\n- 检查的结果跟着采样点变：和别的卡合跑时通过，单独跑时两层都被报 `container_overflow`（后层故意比画面大，前层故意伸出画面）。包裹层上的 `data-layout-allow-overflow` 是为这个加的，不是版式出了问题。\n\n## 动效与皮的边界\n\n属于这张卡的：两层虚实同步对调、两头慢的 0.7 秒、很小的反向位移和后层呼吸。\n\n只是皮：前层是人物、一只手、一件物体还是一块面板；后层是界面还是照片；前层放左还是放右；焦点从前到后还是从后到前。\n\n## 接进片子\n\n- 变量：`src` 后层画面地址，`front` 前层图片地址（透明底），`fx` 前层的横向位置，`to` 焦点最后落在哪一层，`at` 开始转焦的秒数，`backdrop`。\n- 对旁白：`at` 对齐话题转折的那个词（“而他面前的……”“真正要看的是……”），转焦在词后 0.7 秒完成。\n- 音效：不配，或者只在配乐上做一个很轻的换气。给转焦配掠过声会显得用力过猛。\n- 连用：落定后叠 slow-push 的思路继续往后层推一点；前层是人物时，落定前可以先压一条名条。"},{"id":"rank-ladder","name":"排名换位","group":"数据与图表","type":"structure","intents":["number","compare"],"numbers":[3,6],"chart":"ranking","one_line":"一个五行的排行榜里，下面的一行先亮起来、分数涨上去，然后先向右拉出 260px、在空出来的车道里上移，被它超过的行在它经过时依次让到下面，到位后再并回队列，新名次的数字应一声","use_when":"旁白在说“原来排第几，现在超到第几”，名次的变化本身就是结论","energy":"高","needs":["数据"],"overlay":true,"slot":3.5,"hero":3.1,"sfx":"arm=rise, go=whoosh, land=impact","pairs_with":["bar-grow","stat-compare"],"vars":[{"id":"names","type":"string","label":"各行名字，按当前名次，用 | 分隔（4–5 行）","default":"分步追问|限定格式|加上背景|给出示例|直接提问"},{"id":"scores","type":"string","label":"各行数值，用 | 分隔","default":"92|85|78|71|64"},{"id":"mover","type":"number","label":"哪一行要上移（当前名次）","default":4},{"id":"climb","type":"number","label":"上移到第几名","default":2},{"id":"newScore","type":"number","label":"上移那一行的新数值","default":88},{"id":"headline","type":"string","label":"结论（一句）","default":"多给一个示例，第四名超到第二（示例数据）"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.9,1.45,1.9,3.1],"doc":"## 命门\n\n1. **先给理由，再动。** 这一行先变成强调色、分数从 71 滚到 88（0.55 → 1.15 秒），然后才开始上移。直接移动的话，观众看到的是“表格重排了”，不知道为什么。\n2. **先变道，再超，最后并回。** 出发前 0.12 秒就开始向右拉出 260px，在外侧车道里完成上移，纵向到位之后才收回来。垂直地直上直下、或者边上移边收回，这一行会正面穿过别人的名字，读起来是两层字叠在一起，不是超过。\n3. **被超的行在它经过时才让。** 每一行在上移行经过自己的那一刻开始下移一格，离得近的先让。所有行同时让位的话，是“大家给它腾地方”，没有一个一个被超过的过程。\n\n## 动作拆解\n\n默认五行，第 4 行上移到第 2 名。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.30s | 整个榜单 | 淡入 | 线性 |\n| 0.55 → 0.77s | 第 4 行 | 底板换成强调色、字变深色，放大到 1.035 | power2.out |\n| 0.65 → 1.15s | 第 4 行的分数 | 71 → 88 | power2.out |\n| 1.08 → 1.32s | 第 4 行 | 向右拉出 260px | power2.out |\n| 1.20 → 1.80s | 第 4 行 | 上移 320px（两格） | power2.inOut |\n| 1.20 → 1.50s | 原第 3 行 | 下移 160px | power2.inOut |\n| 1.47 → 1.77s | 原第 2 行 | 下移 160px | power2.inOut |\n| 1.75 → 2.03s | 第 4 行 | 并回原来的横向位置 | power2.inOut |\n| 1.95 → 2.25s | 第 4 行 | 缩放回 1 | back.out(3) |\n| 1.98 → 2.38s | 左侧的名次数字“2” | 放大到 1.35 再落到 1.12，变成强调色 | power2.out → back.out(2.5) |\n\n左侧的名次数字是固定的格子，全程不动；动的只有右边的行。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| perRow 每超一行用多久 | 0.3s | 过 0.5s 像在慢慢挪 | 低于 0.2s 看不清超过了谁 |\n| lane 向右拉出多少 | 260px | 过 300px 行的右端会出画面（行宽 1170px，榜单左边在 300px） | 小于名字的宽度（四个字约 232px）时两行的名字会叠在一起，`verify` 会报文字重叠 |\n| laneBack 并回时长 | 0.28s | 过 0.5s 落位拖泥带水 | 低于 0.15s 像被吸回去 |\n| yield 让位时长 | 0.3s | 过 0.5s 让位的行还没到位，上移行已经落下了 | 低于 0.2s 让位像瞬移 |\n| lift 上移行的放大倍数 | 1.035 | 过 1.08，1170px 宽的行会明显变宽、压住名次数字 | 1.0 时它和别的行在同一层，没有“浮起来” |\n| goAt − armAt 亮起到出发的间隔 | 0.65s | 过 1.2s 观众以为亮起就是全部 | 低于 0.3s 分数还没滚完就走了 |\n\n## 已知坑\n\n- `lane` 最开始是 64px，而且是边上移边拉出、边收回。上移行经过别的行时两行的名字叠在一起，`verify` 报了文字重叠；加到 160px 还是报。最后改成三段：先拉出 260px（比四个字的名字宽），在外侧上移，到位后再并回，并且把行宽从 1270px 收到 1170px 给外侧车道留地方。\n- 上移行的色块经过时会盖住被超那一行右侧的分数，`verify` 会按“白字压在强调色上”报对比度不够。这是真的遮挡，也是有意的，所以脚本给被超过的行的名字和分数加了 `data-layout-allow-occlusion`。\n- 名字超过四个字时，外侧车道里的色块仍会盖到被超行名字的末尾。名字尽量控制在四个字以内。\n- 分数滚动结束后的值必须真的能排到新名次（88 夹在 92 和 85 之间）。填一个排不到那里的数，画面就是自相矛盾的；脚本不会替你检查。\n- 行内文字的颜色要从浅色补间到深色（强调色底板上用深色字）。色板是 CSS 变量，补间之前要先让浏览器把它算成具体的颜色值，脚本里做了这一步；换皮之后不需要动。\n- 上移超过三格时总时长按格数增加（每格 0.3 秒）。从第 5 超到第 1 要 1.2 秒，注意把这一镜的时长留够。\n- 这张卡只演示“往上超”。往下掉的情况方向、让位顺序都要反过来，而且情绪不同，不要直接填反的数来凑。\n\n## 动效与皮的边界\n\n属于这张卡的：先亮起并涨分、拉出来超车再并回、被超的行逐个让位、落位时名次数字回应。名次数字固定不动也属于这张卡，它让“第几名”始终可读。\n\n只是皮：行的高度、圆角和底色，名字和分数的字号，有没有结论句，强调色，榜单有四行还是五行。\n\n## 接进片子\n\n- 变量：`names` 各行名字，按当前名次，用 `|` 分隔（4 或 5 行）；`scores` 对应的数值；`mover` 哪一行要上移（填它现在的名次）；`climb` 上移到第几名；`newScore` 这一行涨到多少；`headline` 结论句；`backdrop`。\n- 对齐：亮起（0.55 秒）对旁白说出这一行的名字，出发（1.20 秒）对“超过了”那个词，并回队列、名次数字亮起（2.0 秒前后）对新名次。\n- 音效：涨分时一个短的上扬声，出发时一个掠过声，落位时一个撞击声。\n- 示例数字是编的，结论句里标了“示例数据”。"},{"id":"reaction-bubble","name":"反应气泡","group":"人物与口播","type":"host","intents":["question","host"],"numbers":null,"chart":null,"one_line":"人物头的两侧接连冒出两三个带尖角的气泡，每个都从自己的尖角里弹出来、晃一下停住，挂一会儿再往上飘着缩没，人物每挨一个就轻轻一沉","use_when":"主持人刚说了一句反常识的话，要替观众把心里的疑问或吐槽说出来，再接着回答","energy":"高","needs":["人","文"],"overlay":true,"slot":3.5,"hero":1.667,"sfx":"pop1=pop, pop2=pop, pop3=pop","pairs_with":["word-punch","host-cutout-pop","chat-bubbles"],"vars":[{"id":"host","type":"string","label":"人物图地址（透明底；压在实拍上时留空）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"bubbles","type":"string","label":"气泡里的话，用 | 分开（2–3 条，每条 8 字以内）","default":"这也行？|真的假的|等等，再说一遍"},{"id":"gap","type":"number","label":"相邻两个气泡隔多久（秒）","default":0.55},{"id":"stay","type":"number","label":"每个气泡停多久再飘走（秒）","default":1.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.467,1.033,1.667,3.1],"doc":"## 命门\n\n1. **一个接一个，不是一起。** 三个气泡相隔 0.55 秒。一起弹出来是一张“观众评论”的静态图；有先后，才像是七嘴八舌、越问越多。\n2. **从尖角里长出来。** 每个气泡的变形原点在它自己的尖角上，从 0 弹到 1.14 再回到 1。从中心放大的气泡是一个弹窗，和头没有关系；从尖角长，才是“这句话是冲着这个人说的”。\n3. **在头边，不在头上。** 三个气泡分别在头的右上、左侧、右侧偏下，离头的边缘留 30px 以上。压住脸，观众就看不到主持人被问到时的表情，这张卡最好看的部分没了。\n\n## 动作拆解\n\n三个气泡各自的起点是 0.40 / 0.95 / 1.50 秒，下面的时间相对各自的起点。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.16s | 气泡 | 从尖角处 0 → 1.14，角度从 3 倍倾角甩到反向 | power3.out |\n| 0.04 → 0.13s | 人物 | 下沉 10px | power2.out |\n| 0.13 → 0.43s | 人物 | 回到原位 | power2.out |\n| 0.16 → 0.46s | 气泡 | 1.14 → 1，角度落到自己的倾角（-3° / 2.5° / -2°） | back.out(3) |\n| 0.46 → 1.30s | 气泡 | 挂着，慢慢上浮 10px | 线性 |\n| 1.30 → 1.80s | 气泡 | 上飘 110px，横向漂 ±40px | power1.in |\n| 1.50 → 1.80s | 气泡 | 缩到 0 | power2.in |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| gap（变量）间隔 | 0.55s | 过 1 秒变成一问一答的节奏，适合旁白逐条回应 | 低于 0.3s 等于同时出 |\n| stay（变量）停留 | 1.3s | 每条超过 6 个字时给到 1.8 秒 | 低于 0.8s 读不完 |\n| peak 弹出峰值 | 1.14 | 过 1.25 气泡会撞到头 | 1.0 时没有弹性，像贴纸 |\n| nod 人物下沉 | 10px | 过 20px 像被砸了一下，适合搞笑片 | 0 时人是一张不动的图，气泡和他没关系 |\n| rise 飘走距离 | 110px | 过 200px 第一个气泡会飘出画面顶边再消失 | 低于 50px 看不出是飘走 |\n\n## 已知坑\n\n- 气泡是深色字压在浅色泡上，所以进出场都不用淡入淡出：泡淡到一半时，深字压在透出来的深底上，对比度掉到不合格。进场是不透明地从 0 放大，退场是不透明地缩到 0。\n- 人物下沉用的是向下的位移，人物图的底边要贴着或伸出画面底边。如果人物是悬空的半身图，下沉会看起来像整个人往下掉，改成缩放 0.99 更稳。\n- 每个气泡的位置是按“头在画面正中、高度 380px、头宽 270px”写死的。人物偏一侧时，三个气泡的 `left / right / top` 要跟着整体平移。\n- 每条 8 个字以内。右侧的气泡从 1130px 起，58px 的字超过 11 个就伸出画面右边。\n- 只有两条时用的是右上和左侧两个位置，第三个位置空着，画面右下会偏空，可以把人物往右挪一点。\n\n## 动效与皮的边界\n\n属于这张卡的：相隔半秒接连出现；从尖角处弹出并带一点甩动；人物随每个气泡沉一下；各自挂够时间后向上飘走缩没。\n\n只是皮：气泡的颜色（默认两白一黄）、圆角、尖角的形状、字体、倾角的具体度数、人物身后的底形。气泡里换成表情符号或问号也成立。\n\n## 接进片子\n\n- 变量：`host` 人物图，压在实拍上时留空；`bubbles` 气泡里的话，用 `|` 分开，2–3 条；`gap` 相邻两个的间隔；`stay` 每个停多久；`backdrop`。\n- 开始时间：卡的 0.4 秒对齐主持人那句反常识的话说完的瞬间。旁白要逐条念出气泡内容时，把 `gap` 改成每条念出的间隔。\n- 音效：每个气泡弹出的那一帧一个短的弹出声，三个的音高可以依次升高。\n- 常见接法：气泡飘走后，主持人用 `word-punch` 给出回答里的重音词。"},{"id":"reticle-lock","name":"准星锁定","group":"标注与手绘","type":"evidence","intents":["point","result"],"numbers":null,"chart":null,"one_line":"一个放大的准星在画面里直线跳两步、每步都停死，第三步扑到目标上，圈收紧摆正、闪一下，旁边滑出一行读数","use_when":"旁白在“找”一个东西（哪一行有问题、哪个数字不对），找到的那一刻要有分量；语气是系统识别，不是人在批注","energy":"高","needs":["界面","文"],"overlay":true,"slot":4,"hero":3,"sfx":"hop=tick, lock=impact, read=pop","pairs_with":["scan-line","bracket-frame"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":576},{"id":"w","type":"number","label":"目标宽","default":416},{"id":"h","type":"number","label":"目标高","default":88},{"id":"readout","type":"string","label":"锁定后弹出的读数","default":"已锁定 · 进行中"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.1,0.5,1.2,1.467,3],"doc":"## 命门\n\n1. **走直线，停死。** 每一跳 0.24 秒、`power2.inOut`，跳完原地停 0.11 秒再走。有停顿才像“看了一眼，不是它”；一条连续的曲线滑到目标上读成鼠标指针。\n2. **锁定是一个硬动作。** 准星到位后用 0.18 秒从 1.3 倍收到 1 倍，同时从斜 45° 转正，`power4.out`：前三帧就走完九成。收得软（0.4 秒以上、带回弹）就成了呼吸灯，没有“咔”的一下。\n3. **闪光和读数都晚于收紧。** 圈内的色块在收紧开始后 0.10 秒亮起，读数再晚 0.12 秒滑出。三件事同帧发生，观众只看到一团东西冒出来，分不清哪一帧是锁定。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.15 → 0.27s | 准星 | 在第一个落点淡入，1.3 倍、斜 45° | 线性 |\n| 0.38 → 0.62s | 准星 | 直线跳到第二个落点 | power2.inOut |\n| 0.73 → 0.97s | 准星 | 直线跳到第三个落点 | power2.inOut |\n| 1.08 → 1.30s | 准星 | 扑到目标中心 | power3.inOut |\n| 1.30 → 1.48s | 准星 | 缩放 1.3 → 1，旋转 45° → 0° | power4.out |\n| 1.30 → 1.38s | 中心小十字 | 淡出，把目标让出来 | 线性 |\n| 1.40 → 1.72s | 圈内色块 | 强调色亮到 0.6，放大到 1.3 倍并淡出 | power2.out |\n| 1.52 → 1.68s | 读数牌 | 从准星一侧滑出 36px | power3.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hops 搜索落点 | 3 个 | 4 个以上观众开始不耐烦 | 只留 1 个就没有“找”的过程 |\n| move 每跳时长 | 0.24s | 过 0.4s 像在飘 | 低于 0.15s 变成瞬移，看不出路径 |\n| hold 每跳后的停顿 | 0.11s | 过 0.25s 节奏断掉 | 0 时几跳连成一条折线，像弹球 |\n| big 搜索时的倍数 | 1.3 | 目标宽过 400px 时再大，搜索中的圆环会伸出画面上下沿；小目标（宽 200px 以内）可以加到 1.45 | 1 时锁定没有收紧可做 |\n| grip 收紧时长 | 0.18s | 过 0.35s 发软 | 低于 0.1s 只剩闪光，看不见收 |\n| flash 闪光时长 | 0.32s | 过 0.6s 目标被色块盖住太久 | 低于 0.15s 30 帧下只闪到一两帧 |\n\n## 已知坑\n\n- 搜索落点是相对目标中心写死的偏移，横向朝画面中间量（目标在右半屏就往左找，在左半屏自动镜像）。第一个落点横向离目标 860px、纵向高 280px：默认目标的圆环在搜索时半径约 300px，落点的纵坐标要留在 300–780 之间才不出画。目标贴近画面上沿或正好在中线附近时，落点会跑到画面外，要改 `hops`。\n- 准星是正圆，半径取目标长边的一半加 20px（默认目标宽 416px，圆环直径 456px），线宽 12px。目标很扁时圆会盖到上下相邻的内容，这是叠加层可以接受的；实在介意就改用 `bracket-frame`。\n- 读数自动放在空间大的一侧（目标在右半屏就放左边），高 88px、字 48px，离圆环 60px，和目标中心对齐。那个位置有内容时要换目标或缩短读数。\n- 闪光用的是强调色而不是白色：白色在浅色界面上完全看不见。它会盖住目标 0.3 秒左右，目标上的字要等闪完才读得清。\n- 读数留空就不显示读数牌，只剩锁定动作。\n- 落点停在别的内容上会让观众以为那也是答案。落点尽量选空白或明显不相关的东西。\n\n## 动效与皮的边界\n\n属于这张卡的：直线分段搜索且每段停死、到位后又快又硬的收紧摆正、紧跟的一次闪光、最后才出的读数。\n\n只是皮：准星的样子（圆环、刻度、十字）、线宽、颜色、读数牌的配色和字体、搜索落点的具体位置。\n\n## 接进片子\n\n- 默认演示（`backdrop: on`）垫的是示例截图放大 2 倍后的任务列表区域（原图 340,110 起的 960×540 一块铺满画面）；默认目标是第二行的标题（300,576 起、416×88）。\n- 变量：`x / y / w / h` 是目标外框，`readout` 是锁定后那一行字（12 个字以内，留空不显示），`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：旁白说“找到了”“就是它”的那个字对齐 1.30 秒（开始收紧的那一帧），这一镜提前 1.3 秒开始。\n- 音效：每次跳到位一声“滴”（0.62、0.97 秒），1.30 秒一声短促的撞击，1.52 秒读数出来配轻的弹出音。\n- 常见接法：前面先用 `scan-line` 扫一遍，再用本卡锁定其中一个；全片用一两次，多了就不稀奇。"},{"id":"retype-fix","name":"打错重打","group":"字与强调","type":"structure","intents":["caution","compare"],"numbers":null,"chart":null,"one_line":"光标先在句尾很顺地打出一个错的说法，停住、闪一下，按住退格把它逐字删光，再稍慢一点打出强调色的正确说法","use_when":"要纠正一个观众自己也会下意识说出口的说法，而且想让纠正显得像“我自己刚想明白”，不是在训人","energy":"中","needs":["文"],"overlay":true,"slot":3.5,"hero":3.2,"sfx":"type=type, erase=tick, retype=type","pairs_with":["typewriter-line","strike-swap"],"vars":[{"id":"lead","type":"string","label":"不变的前半句","default":"学 AI，最重要的是"},{"id":"wrong","type":"string","label":"先打出来的错说法","default":"背提示词"},{"id":"right","type":"string","label":"改成的对说法","default":"学会提问"},{"id":"at","type":"number","label":"开始打字的时间（秒）","default":0.4},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.95,1.37,1.75,3.2],"doc":"## 命门\n\n1. **停顿是戏眼。** 错的说法打完以后，手停 0.55 秒，其间光标灭一下再亮。没有这一拍，删字读起来是手滑打错了；有了它才是“等等，不对”。\n2. **删比打快，而且匀速。** 打错的时候每字 0.085 秒，删的时候每字 0.05 秒、间隔完全相等（按住退格键），重打时放慢到每字 0.095 秒。三段速度一样的话，整件事是机器在播放，不是人在改主意。\n3. **前半句纹丝不动。** 不变的前半句从第一帧就在，位置按最终的句子居中；只有句尾在伸缩。让整行每打一个字就重新居中，前半句会来回晃，观众的眼睛会去追它而不是看被改的词。\n\n## 动作拆解\n\n以默认文案（错、对两个说法各 4 个字）为例：\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.40s | 前半句 + 光标 | 静止，光标常亮 | — |\n| 0.40 → 0.74s | 错的说法 | 逐字出现，每字 0.085s | 无（瞬时） |\n| 0.74 → 1.29s | 光标 | 停顿 0.55s，其间 0.93s 灭、1.13s 亮 | 无（瞬时） |\n| 1.29 → 1.49s | 错的说法 | 从最后一个字起逐字消失，每字 0.05s | 无（瞬时） |\n| 1.49 → 1.67s | — | 换气 0.18s | — |\n| 1.67 → 2.05s | 对的说法（强调色） | 逐字出现，每字 0.095s | 无（瞬时） |\n| 2.50 / 2.95s | 光标 | 灭一次再亮，停在亮 | 无（瞬时） |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hold 打错后的停顿 | 0.55s | 过 1s 观众以为画面卡了，除非旁白正好在这里停顿 | 低于 0.3s 来不及读完错的说法 |\n| typeBad 打错的字间隔 | 0.085s | 过 0.14s 显得犹豫，和“脱口而出”相反 | 低于 0.05s 像粘贴 |\n| erase 删除的字间隔 | 0.05s | 过 0.09s 像一个一个地斟酌，拖 | 低于 0.03s 像整段选中删除，看不出是退格 |\n| breath 删完到重打的间隔 | 0.18s | 过 0.5s 像又卡住一次 | 0 时删和打连在一起，分不出两个动作 |\n| typeGood 重打的字间隔 | 0.095s | 过 0.15s 太郑重 | 小于 typeBad 时显得比打错时还草率 |\n| at（变量） | 0.4s | — | 0 时看不到“前半句先在那儿等着”这一拍 |\n\n## 已知坑\n\n- 这里的字是靠“占不占位”来出现和消失的（不是透明度），所以光标可以只做一个，自然跟在行尾。代价是每次增删都会重新排版；前半句必须被钉在左边，否则会跟着晃。现在的做法是用一行看不见的“最终句子”撑出宽度，真正在打字的那一行贴在它的左上角。\n- 错的说法比对的说法长时，打错的那段会伸出最终句子的右边界，画面暂时偏右；长出三个字以上要确认没有顶到画面边（108px 字号下整行别超过 15 个字）。\n- 那行看不见的句子和真正的句子完全重叠，HyperFrames 的版式检查可能把它当成遮挡，已经在它上面标了允许遮挡。\n- 第一版结尾闪两次，最后一次“亮”落在 3.85 秒，超出了 3.5 秒的建议时长，这一镜会结束在光标灭掉的状态。现在只闪一次，2.95 秒以后常亮。改了文案长度后要重新算一下结尾。\n- 前半句里的半角空格（比如“学 AI”）在逐字拆开后仍然要占位，每个字的节点都保留了空白；别把这条样式删掉，否则空格会被吃掉。\n\n## 动效与皮的边界\n\n属于这张卡的：打错 → 停顿并闪一下 → 匀速快删 → 换气 → 稍慢地重打，三段速度不同，前半句固定。\n\n只是皮：对的说法用什么颜色、光标形状、字体（等宽字更像输入框）、错的说法要不要在停顿时变色、有没有输入框外形。\n\n## 接进片子\n\n- 变量：`lead` 不变的前半句；`wrong` 先打出的错说法；`right` 改成的对说法；`at` 开始打字的秒数；`backdrop`。\n- 时间：以默认 4 + 4 个字计，错的说法在 `at` + 0.34 秒打完，`at` + 0.89 秒开始删，对的说法在 `at` + 1.65 秒打完。旁白通常在停顿处说“不对”，把那一刻对到 `at` + 0.5 秒左右。\n- 音效：打字和重打铺键盘声；删除用一串更密、更轻的滴答声；停顿处留白，不要垫音。\n- 常见接法：`typewriter-line` 负责正常输入，这张只用在需要“改口”的那一句；想要更果断的否定用 `strike-swap`。"},{"id":"ring-progress","name":"环形进度","group":"数据与图表","type":"structure","intents":["number"],"numbers":[1,1],"chart":"proportion","one_line":"一个粗环从 12 点方向顺时针画到目标百分比，环中间的数字跟着同一个进度值滚，数字落定的那一帧整个环鼓一下，说明行随后跟上","use_when":"旁白说的是“占了多少”“完成了多少”，一个 0 到 100 之间的比例，而且只讲这一个","energy":"中","needs":["数据"],"overlay":true,"slot":3,"hero":2.7,"sfx":"sweep=rise, stop=pop","pairs_with":["unit-grid","big-stat-slab"],"vars":[{"id":"percent","type":"number","label":"目标百分比（0–100）","default":68},{"id":"caption","type":"string","label":"环下面的一行说明","default":"的问题，追问一轮就能解决"},{"id":"note","type":"string","label":"来源小注（可空）","default":"示例数据"},{"id":"sweep","type":"number","label":"画环时长（秒）","default":1.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.8,1.2,1.57,2.7],"doc":"## 命门\n\n1. **环和数字是同一个值。** 脚本里只有一个进度值，弧长和数字都从它算。分开做两段动画，哪怕时长、缓动填得一样，拖动到任意一帧时也可能对不上：环已经过半，数字还是 48。\n2. **过冲给环的大小，不给数字。** 落定时整个环放大到 1.04 再弹回，数字本身从不超过目标值。用 back 缓动去推进度的话，数字会先显示 69 再退回 68，观众会以为是 69。\n3. **两头慢、中间快。** 用 power2.inOut，像仪表指针扫过去。纯缓出的话一开场环就甩出去一大截，粗环显得很冲。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 1.60s | 环 + 中间数字 | 进度 0 → 68，弧长和数字同步 | power2.inOut |\n| 1.52s（数字落定帧） | 整个环（含数字） | 缩放 1 → 1.04，用 0.08s | power2.out |\n| 1.60 → 1.90s | 整个环 | 缩放 1.04 → 1 | back.out(3) |\n| 1.64 → 2.04s | 说明行 | 上移 26px 淡入 | power3.out |\n| 1.89 → 2.19s | 来源小注 | 淡入 | 线性 |\n\n数字落定帧 = 开始 + 时长 ×（1 − √(0.25 ÷ 目标值)）。目标 68 时比补间终点早 0.08 秒。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| sweep 画环时长（变量） | 1.3s | 过 2.5s 像加载中 | 低于 0.7s 数字只是闪一下 |\n| pulse 落定时环的放大倍数 | 1.04 | 过 1.08，640px 的环会晃得很明显 | 1.0 时落定没有句号 |\n| capLag 说明行延迟 | 0.12s | 过 0.5s 说明像另一屏的内容 | 0 时和落定抢同一帧 |\n| 环的粗细（样式里） | 64px | 过 90px 中间放不下 210px 的数字 | 低于 30px 就是一个加载圈，没有分量 |\n\n## 已知坑\n\n- 圆头的线端在进度为 0 时会在 12 点位置留下一个圆点，看着像已经有 2% 了。脚本在进度小于 0.2 时把进度弧整个隐藏。\n- 圆头会让弧的两端各多出半个线宽，所以 68% 看起来略多于 68%。数值在 95 以上时，弧的头会碰到尾，看着像满了；这种情况把线端改成平头。\n- 目标是 100 时环闭合成一个完整的圈，没有“还差多少”的信息了。100% 用 `big-stat-slab` 更合适。\n- 环中间的数字是 210px，三位数（100）加百分号会顶到环的内沿。需要三位数时把数字字号降到 170px。\n- 一屏放两个以上的环，观众会去比谁大，而环形很难比大小。要比较就换 `bar-grow` 或 `stat-compare`。\n\n## 动效与皮的边界\n\n属于这张卡的：环和数字共用一个进度值、两头慢中间快的扫动、数字落定帧上的那一下鼓胀、说明行晚到。\n\n只是皮：环的粗细和半径、底环的深浅、起点在 12 点还是 6 点、线端圆头还是平头、百分号的颜色、说明行放下面还是右边。\n\n## 接进片子\n\n- 变量：`percent` 目标百分比（0–100）；`caption` 环下面的说明行；`note` 来源小注（留空不显示）；`sweep` 画环时长；`backdrop`。\n- 对齐：数字落定帧（默认 1.52 秒）对旁白念完这个百分比的时刻。旁白念得慢就把 `sweep` 拉长。\n- 音效：扫动时一个上扬的声音，落定帧一个轻的“啵”。\n- 示例数字是编的，画面上标了“示例数据”；换真数据时把来源写进 `note`。"},{"id":"roadmap-light","name":"路线图点亮","group":"结构与流程","type":"structure","intents":["chapter","steps"],"numbers":null,"chart":null,"one_line":"所有步骤卡先以暗的状态一次摊开，旁白讲到哪张，哪张亮起并浮起来，讲完的落回去保持半亮","use_when":"旁白先说“一共这几步”，再逐个展开；或者这是一条贯穿全片的路线，每到一章回来点亮一格","energy":"低","needs":["文"],"overlay":true,"slot":5.4,"hero":5,"sfx":"light=tick","pairs_with":["flow-nodes","chapter-numeral"],"vars":[{"id":"items","type":"string","label":"步骤（用 | 分隔，2–5 条）","default":"明确目标|拆解任务|给出示例|检查结果"},{"id":"cues","type":"string","label":"每一步亮起的秒数（逗号分隔，不够就均匀排开）","default":"0.9,1.9,2.9,3.9"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.7,1.07,2.2,3.2,5],"doc":"## 命门\n\n1. **先摊开，再点亮。** 全部卡片在 0.05–0.7 秒内以灰字、无边框的状态到齐，第一个 cue 不早于 0.6 秒。卡片跟着旁白一张张出现，就成了 `step-stack`，观众失去了“全图”。\n2. **三档亮度必须同时看得出来。** 当前：白字、强调色边框、上浮 32px、放大；讲完：落回原位、字是灰和白的中间色、边框留 40%；没讲：灰字、没有边框。少一档，要么看不出讲到哪，要么看不出哪些讲过了。\n3. **位置不变，只动亮度和高度。** 卡片一旦摊开就不再换位置。当前那张只是原地浮起，别让它滑到中间或者放大占屏，那样路线图就散了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.05 + 0.07 × 序号 → +0.4s | 每张卡 | 上移 36px 淡入，暗的状态 | power3.out |\n| cue → +0.36s | 当前卡 | 上浮 32px，放大（每边最多长 10px，四张卡时约 1.05 倍） | back.out(2) |\n| cue → +0.25s | 当前卡的边框、文字、序号 | 边框淡入，字变白，序号变强调色 | power2.out |\n| 下一个 cue → +0.4s | 上一张卡 | 落回原位原尺寸，边框降到 40%，字和序号变成半亮 | power2.inOut |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| spread 摊开的间隔 | 0.07s | 过 0.15 像在逐张出场，抢了点亮的戏 | 0 是同时出现，少一点“摊牌”的手感 |\n| lift 上浮距离 | 32px | 过 60 卡片像要飞走，和同排脱节 | 低于 16 看不出浮起，只剩变色 |\n| fonts 各条数的字号 | 112 / 96 / 84 / 64px（2 / 3 / 4 / 5 张） | 四张卡时格子内宽 347px，超过 86px 四个字就要折行 | 五张卡不要低于 64 |\n| grow 放大上限 | 1.05 | 过 1.08 卡片碰到邻居（间距只有 28px） | 1.0 也成立，靠上浮和边框 |\n| half 讲完的边框透明度 | 0.4 | 过 0.7 和当前卡分不开 | 0 时讲完的和没讲的只差字色，太接近 |\n| up / down 浮起、落回 | 0.36s / 0.4s | 过 0.6 跟不上一句一格的旁白 | 低于 0.2 是跳，不是浮 |\n\n## 已知坑\n\n- 整排宽 1760px、高 560px。两张卡时每张宽 866px，按固定倍数放大会顶到邻居（我换成两条时就贴上了）。现在放大按“每边最多 10px”折算，宽卡的倍数自动变小；别把它改回固定倍数。\n- 五张卡时每格内宽只有 258px，64px 的字一行放 4 个；5–8 个字会折成两行（格子高 560px，放得下三行），再长就该减步骤。\n- 半亮的字色是用脚本把灰和白按 55% 混出来的，换皮以后会跟着变；如果新皮的灰和白本来就很接近，三档会糊成两档，要自己把 `--mc-muted` 调暗。\n- 开场摊开要 0.4 + 0.07 × 张数 秒。第一个 cue 小于 0.6 秒会被抬到 0.6，否则第一张还没摊完就亮了。\n- 整排没有连线和箭头，先后顺序只靠序号和从左到右。需要强调方向时换 `flow-nodes`。\n\n## 动效与皮的边界\n\n属于这张卡的：全图先暗着摊开、位置固定、当前卡上浮并亮起、讲完的落回并保持半亮、三档亮度并存。\n\n只是皮：卡片的形状和底色、序号的写法（01 / 第一步 / 图标）、边框还是底色发亮、一排还是两排、强调色。\n\n## 接进片子\n\n- `items`：步骤名，`|` 分隔，2–5 条。\n- `cues`：每一步亮起的秒数，对齐旁白开始讲这一步的第一个词。第一个不早于 0.6 秒，相邻两个至少隔 0.5 秒。\n- `backdrop`：`off` 时没有底，卡片自带底板，可以压在录屏或实拍上。\n- 音效：摊开时一串很轻的 tick（每张一个），每个 cue 一个稍重的 tick 或 chime。\n- 接法：做章节路标时，同一组 items 在每章开头各挂一次，把当前章之前的 cue 写得很密（0.6、1.1、1.6…），让前几格快速走到半亮，再停在当前章。"},{"id":"scale-contrast","name":"大小字对比","group":"字与强调","type":"structure","intents":["conclusion","hook"],"numbers":null,"chart":null,"one_line":"一行小字先占着画面正中，接着一个撑满画面宽度的巨大的词从镜头前压下来，小字提前一拍被挤到左上角变成注脚","use_when":"一句铺垫加一个分量很重的短词（原因、结论、数字），而且愿意让这个词独占一整屏","energy":"高","needs":["文"],"overlay":false,"slot":3,"hero":2.7,"sfx":"push=whoosh, hit=impact","pairs_with":["line-rise","stamp-verdict"],"vars":[{"id":"small","type":"string","label":"铺垫的小字（一行）","default":"结果不好，多半不是模型的问题"},{"id":"big","type":"string","label":"压进来的大词（2–4 个字）","default":"没说清"},{"id":"hit","type":"number","label":"大词压下来的时间（秒）","default":1.2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.8,1.22,1.34,1.42,2.7],"doc":"## 命门\n\n1. **大小差要到十倍。** 小字落定是 48px，大词是 560px。差距只有两三倍时，画面是“标题加副标题”的正常排版，没有压迫感；这张卡靠的就是不合常理的比例。\n2. **大词是加速砸到位的。** 从 1.8 倍缩到 1 倍用 power3.in，0.2 秒，越接近终点越快，到位以后再凹进去 4.5% 弹回来。用 out 类缓动会变成“飘过来慢慢停住”，没有重量。\n3. **小字先让位。** 小字在大词出发前 0.05 秒就开始往角上走，而且用的是急起缓停。大词到了小字才动，两者会在画面中央叠在一起整整 0.2 秒。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 1.2s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0.15 → 0.55s | 小字（画面正中，84px 大小） | 淡入 | power2.out |\n| -0.05 → 0.27s | 小字 | 从正中移到左上角，1.75 倍缩回 1 倍（48px），透明度 1 → 0.6 | 位移 power3.out，透明度线性 |\n| 0 → 0.20s | 大词 | 透明 → 不透明，1.8 倍 → 1 倍 | power3.in |\n| 0.20 → 0.27s | 大词 | 缩到 0.955 倍 | power1.out |\n| 0.27 → 0.61s | 大词 | 弹回 1 倍 | back.out(3) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| from 大词起始倍数 | 1.8 | 过 3 起始帧只看到几根笔画，认不出是字 | 低于 1.3 没有“压过来”的纵深 |\n| slam 压下时长 | 0.2s | 过 0.35s 变成缓慢推近 | 低于 0.12s 只剩一个硬切 |\n| dent 落地凹陷 | 0.955 | 低于 0.9（凹得更深）大词明显缩一下，像橡皮 | 1 时落地是死的 |\n| lead 小字提前量 | 0.05s | 过 0.2s 小字自己先跑了，和大词没有因果 | 0 或负数时两者在中央重叠 |\n| smallUp 小字开场倍数 | 1.75 | 过 2.2 一行放不下 | 1 时小字开场太小，撑不起第一拍 |\n| fill / max 大词占宽和字号上限 | 1680px / 560px | 超过 1700 会贴到画面边 | — |\n\n## 已知坑\n\n- 大词的字号是按“1680 ÷ 字数”算的，前提是每个字宽 1em（汉字、全角符号）。英文和数字比 1em 窄，算出来撑不满；纯英文或数字要手动把 `fill` 调大，或者直接写死字号。\n- 大词超过四个字时字号掉到 420px 以下，和小字的差距不够，压迫感明显变弱。五个字以上请换 `word-punch`。\n- 小字的位置是用左、上两个百分比加自身的偏移做的动画，不是纯位移，因为它的起点（正中）和终点（左上角）差多少取决于这行字有多宽，没法写死一个像素数。别把它改成 flex 居中再加位移。\n- 大词在 1.8 倍时四周都伸出了画面，这一小段它是半透明的；透明度到位得比缩放晚的话，会看到一个巨大的实心色块闪一下。现在两者同时结束。\n- 这张卡默认不适合压在别的画面上：大词占了整屏，下面什么都看不见。\n\n## 动效与皮的边界\n\n属于这张卡的：十倍级的大小差、小字从正中被挤到角上、大词加速压下并且落地回弹、大词撑满画面宽度。\n\n只是皮：大词的颜色、小字被挤到哪个角、小字落定后的透明度、字体字重、有没有实底。\n\n## 接进片子\n\n- 变量：`small` 铺垫的那行小字（14 个字

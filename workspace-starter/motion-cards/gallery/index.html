A","type":"string","label":"左边要点（用 | 分隔，1–4 条）","default":"想到哪写到哪|结果忽好忽坏|出错难排查"},{"id":"itemsB","type":"string","label":"右边要点（用 | 分隔，1–4 条）","default":"先定目标格式|结果稳定可复现|哪步错改哪步"},{"id":"mark","type":"string","label":"中间的对比符号","default":"VS"},{"id":"cues","type":"string","label":"每一行要点出现的秒数（逗号分隔；写满左右总条数时按先左后右逐条对）","default":"1.4,2.3,3.2"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.05,0.7,0.94,2.5,4.6],"doc":"## 命门\n\n1. **两个标题同一帧撞停。** 两边都用 0.3 秒、越来越快（power3.in）地冲到斜线前，在 0.8 秒那一帧同时停住，各自回弹 22px 再归位，整屏跟着晃一下。减速滑入就是普通的左右入场，没有“对上了”的那一下；两边不同时到，读成先后介绍。\n2. **对比符号从撞击里弹出来。** 符号在撞停的同一帧从 0.2 倍弹到 1.35 倍再落到 1。它比标题早出现，就成了一个摆在那里的徽章，标题撞的是空气。\n3. **要点比标题小一半，而且每边只有最新的一行是白的。** 标题 150px，要点 76px；新的一行出现时，同侧上一行变灰。标题和要点一样大，或者几行全亮，这一屏就有七八个东西在抢。\n\n斜线是这张卡的“连线”：它在最开始 0.1–0.42 秒自上而下画出来，先把场地分好，之后所有东西都贴着它排。线画在标题之后，劈开的动作就没了因果。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.42s | 斜线 | 从上到下画出 | power2.in |\n| 0.37 → 0.62s | 左半边的底色 | 淡入 | power1.out |\n| 0.50 → 0.80s | 两个标题 | 各从外侧 760px 处冲到斜线前 | power3.in |\n| 0.80 → 0.88 → 1.18s | 两个标题 | 各向外回弹 22px，再归位 | power2.out，back.out(3) |\n| 0.80 → 0.94 → 1.22s | 对比符号 | 0.2 → 1.35 → 1 倍，带 −18° → 4° → 0° 的拧转 | power3.out，back.out(2.5) |\n| 0.80 → 1.04s | 整屏 | 横向 ±10px 衰减晃 4 下 | 线性 |\n| cue → +0.35s | 左边这一行 | 从斜线一侧向外滑 50px 淡入；同侧上一行变灰 | power3.out |\n| cue + 0.3 → +0.65s | 右边这一行 | 同上，方向相反 | power3.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hit 撞停时刻 | 0.8s | 往后挪要同时把第一个 cue 往后挪 | 小于 0.6 斜线还没画完标题就到了 |\n| fly 冲入时长 | 0.3s | 过 0.5 冲不起来，像推拉门 | 低于 0.18 看不到来路 |\n| recoil 回弹距离 | 22px | 过 40 像撞到了弹簧 | 0 时撞击是死的 |\n| peak 符号峰值倍数 | 1.35 | 过 1.6 会盖住两边标题的字 | 低于 1.15 弹不出来 |\n| shakePx 整屏晃幅 | 10px | 过 16 像画面坏了 | 0 时撞击感少一半 |\n| lag 右边比左边晚 | 0.3s | 过 0.6 左右像两句话 | 0 时两边同时出，眼睛只能看一边 |\n\n## 已知坑\n\n- 整屏晃动的几段补间必须各自写明起始时间。我第一版把后几段不带时间地接在后面，它们被排到了整条时间轴的末尾，晃动在撞击之后好几秒才发生。\n- 斜线的两端要正好落在画面边上（1060,0 → 860,1080）。往外多画 10px，检查会报线溢出了它的画布。\n- 标题最多 720px 宽：4 个字是 150px，5 个字 144px，6 个字自动缩到 120px，更长会明显变小，而且左标题会顶到画面左边。双方名字控制在 2–5 个字。\n- 要点 76px，每行最多 9 个字（720px），再长自动缩字号；每边最多 4 行（行距 128px），第 4 行已经到 926px，再多会出画。\n- `backdrop` 设成 `off` 时只去掉最底下那层，左半边的底色还在：右半边直接露出底下的画面，字会读不清。这张卡不适合压在别的画面上。\n\n## 动效与皮的边界\n\n属于这张卡的：斜线先劈开场地、两个标题同帧加速撞停并回弹、符号在撞击帧弹出、整屏挨一下、要点贴着斜线逐行出并且同侧只亮最新一行。\n\n只是皮：斜线的角度和颜色、左右两半各用什么底色、符号写 VS 还是 ≠ 还是一个图标、要点前的小方块、字体。两半都换成图片也成立，只要标题下面垫得住。\n\n## 接进片子\n\n- `sideA` / `sideB`：左右标题。`itemsA` / `itemsB`：两边的要点，`|` 分隔，每边 1–4 条，两边条数可以不同。`mark`：中间的符号。\n- `cues` 有两种写法。只写“行数”那么多个：第 k 个是第 k 行的时间，左边先出，右边晚 0.3 秒，适合“一条对一条”的旁白。写满“左边条数 + 右边条数”那么多个：按先左后右逐条对，适合“先把左边说完，再说右边”的旁白。第一个 cue 不早于 1.15 秒。\n- 这一镜的起点对在旁白说出双方名字之前约 0.8 秒，让撞停落在“对”“还是”这样的连接词上。\n- 音效：0.1 秒 whoosh（劈线），0.8 秒 impact（撞停），每行一个轻的 tick。\n- 接法：比完以后要给数字，接 `stat-compare`；要给同一画面的前后对比，接 `before-after-wipe`。"},{"id":"whip-pan","name":"甩镜","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜带着越来越重的横向拖影被甩出画面，下一镜紧贴着它从另一侧甩进来，拖影收干净时急停","use_when":"旁白在同一口气里换了对象或地点（“而另一边”“同一时间”），节奏快，不想有停顿","energy":"高","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"whip=whoosh","pairs_with":["triptych-relay","filmstrip-pass"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"dir","type":"enum","label":"画面往哪边甩走","default":"left"},{"id":"smear","type":"number","label":"最快那一帧的拖影（px）","default":90},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.934,1,1.067,1.6],"doc":"这张卡**不是叠加层**：它要移动两镜的画面本身，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **两镜是连在一起的一条。** 上一镜和下一镜首尾相接，一起移动一个画面宽。它们之间不能有缝，也不能一个出去了另一个才进来——那是两次滑动，不是一次甩头。\n2. **拖影只有横向，并且跟着速度走。** 静止时为 0，接缝经过画面正中的那一帧最重（90px），急停时回到 0。用普通的四向模糊，画面会上下也发虚，读成“失焦”；拖影不随速度变，就成了一张糊图在平移。\n3. **慢起、中间极快、急停。** power3.inOut，12 帧里中间 4 帧走掉约 70% 的路程。匀速移动是幻灯片的“推入”。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（两镜的接缝在画面正中、速度最快的那一帧）。没有全遮。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.8 → 1.2s | 两镜拼成的长条 | 横向移动 1920px | power3.inOut |\n| 0.8 → 1.0s | 横向拖影 | 0 → 90px | power2.in |\n| 1.0 → 1.2s | 横向拖影 | 90px → 0 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| whip 总时长 | 0.4s | 过 0.6s 能看清两张图的内容在平移，成了滑动换页 | 低于 0.27s 只剩一闪，分不清方向 |\n| smear（变量） | 90px | 过 130px 最快的三帧只剩色带，适合两镜内容差别很大时 | 0 时是硬邦邦的推入，不像镜头 |\n| 移动曲线 | power3.inOut | power4.inOut 起止更狠，中间几乎是瞬移 | power1.inOut 接近匀速，没有“甩” |\n| dir（变量） | left | — | 连续两次甩镜方向相反，像镜头甩过去又甩回来，适合对比 |\n\n## 已知坑\n\n- `from` 是上一镜最后一帧的静帧，`to` 是下一镜第一帧的静帧。下一镜开头如果自己还在动（标题飞入之类），和甩镜叠在一起会乱，让它晚于卡内 1.2 秒再开始。\n- 没有做停下后的回弹：回弹会让画面越过终点，边上露出空白。想要回弹，就给 `to` 准备一张左右各多出几十像素的图，并自己加一段回位。\n- 拖影用的是一个 SVG 滤镜，滤镜的名字在整个页面里是唯一的。同一个片子里放两次这张卡没问题（它们不同时出现），但别让两段在时间上重叠。\n- 两镜的亮度差很大时，接缝在拖影里是一条明显的明暗分界，看上去像“撕开”。可以接受；介意就把 `smear` 加到 120。\n- 画面里有贴边的小字（角标、水印）时，它们在拖影里会拉成一条白线，很显眼。静帧里先去掉这类元素。\n\n## 动效与皮的边界\n\n属于这张卡的：两镜连成一条一起走、只有横向的拖影、拖影随速度涨落、极快的中段和急停。\n\n只是皮：往左还是往右、拖影的强弱、总时长在 0.33–0.5 秒之间的取值。改成上下方向也成立，只是拖影方向要跟着改成纵向。\n\n## 接进片子\n\n- 变量：`from`、`to`（地址从项目根目录写起），`dir` 画面往哪边甩走，`smear` 最快那一帧的拖影，`backdrop`。\n- 对齐：这段自己占 2 秒，两镜的交界在卡内 1.0 秒。只取动的部分就是卡内 0.8 → 1.2 秒。\n- 音效：一个 0.3 秒左右的掠过声，峰值对在 1.0 秒。\n- 常见接法：两个并列的例子之间；一组三连图的相邻两张之间。"},{"id":"word-punch","name":"重音词砸字","group":"字与强调","type":"structure","intents":["keyword","conclusion"],"numbers":null,"chart":null,"one_line":"整句先平平地到，重音词扣住不出，等旁白念到它的那一帧才带着色块砸进来，整屏跟着挨一下","use_when":"一句话里有一个词是全句的分量（数字、结论、反转），而且旁白会重读它","energy":"高","needs":["文"],"overlay":true,"slot":3,"hero":1.4,"sfx":"hit=impact","pairs_with":["line-rise","underline-draw"],"vars":[{"id":"text","type":"string","label":"整句","default":"提示词越具体，结果越稳"},{"id":"key","type":"string","label":"重音词（整句的子串）","default":"越具体"},{"id":"hit","type":"number","label":"重音词砸下的时间（秒）","default":0.9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.96,1.06,1.4,2.6],"doc":"## 命门\n\n1. **晚到。** 重音词必须比整句晚，卡在旁白念出它的那一帧（`hit`）。和整句同帧出现就只是一个上了色的词，没有“砸”。\n2. **快进慢收。** 放大到峰值只用 0.16 秒，回落用 0.24 秒带一点回弹。进场超过 0.3 秒就成了幻灯片的缩放入场。\n3. **停下来比正文大。** 落定在 1.12 倍，不回到 1。回到 1 的话，动作一结束强调就没了。\n\n## 动作拆解\n\n| 时间（相对 hit） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 重音词以外的字 | 上移 26px 淡入 | power3.out |\n| 0 → 0.16s | 重音词 + 色块 | 缩放 0.2 → 1.5，旋转 -7° → 2°，原点在词的底部 | power4.out |\n| 0.14 → 0.38s | 整屏 | 横向 ±8px 衰减晃 4 下 | 线性 |\n| 0.16 → 0.40s | 重音词 + 色块 | 缩放 1.5 → 1.12，旋转回 0 | back.out(2.4) |\n\n色块和字是同一个节点一起变形，色块自己不单独做动画。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| peak 峰值倍数 | 1.5 | 过 1.8 像整活，并且会盖住两边的字 | 低于 1.3 看不出砸 |\n| rest 落定倍数 | 1.12 | 过 1.25 把一行字顶乱 | 1.0 时强调留不住 |\n| popIn 进场时长 | 0.16s | 过 0.3s 变成缩放入场 | 低于 0.1s 只看到结果，看不到来路 |\n| shakePx 晃动幅度 | 8px | 过 12px 像画面坏了 | 0 时砸感少一半；压在实拍上时建议 4 |\n| hit（变量） | 0.9s | — | 小于 0.35s 会和整句进场叠在一起，脚本会自动抬到 0.35 |\n\n## 已知坑\n\n- 变形原点留在默认的正中间：词会往上下两头胀，像气球，不像从行里长出来。原点要在底部（50% 85%）。\n- 色块左右不留外边距：落定的 1.12 倍会让色块压住相邻的字。现在是 0.42em，换更粗的字体时要再加。\n- 一句里放两个重音词：两个重音互相抵消。一句只砸一个，全片也别超过三四次。\n- 用透明度淡入代替缩放：读起来是“打出来的字”，不是重音。\n- 换行：整句超过一行时，重音词可能被排到行首，色块左边会贴边。长句先拆成两屏。\n\n## 动效与皮的边界\n\n属于这张卡的：晚到的时间差、0.2 → 1.5 → 1.12 的缩放曲线和底部原点、同时的小角度旋转、整屏衰减晃动。\n\n只是皮、可以随便换的：色块颜色（`--mc-accent`）和上面的字色（`--mc-on-accent`）、色块圆角、字体字重字号、有没有实底。色块和字只要对比够，换成描边框或下划线都不影响这张卡成立。\n\n## 接进片子\n\n- 变量：`text` 整句，`key` 重音词（必须是 text 的子串，找不到就不砸），`hit` 砸下的秒数（用对齐工具查这个词被说出的时间，减去这一镜的起点），`backdrop` 填 `off` 时透明、压在实拍或录屏上。\n- 音效：`hit` 那一帧放一个短促的撞击声；晃动幅度调小时音效也换轻的。\n- 常见接法：上一句用普通字幕，这一句换成本卡；或者先 `line-rise` 出整句，再用本卡的 `hit` 对重音。"},{"id":"word-slot","name":"词槽轮换","group":"字与强调","type":"structure","intents":["categories","keyword"],"numbers":null,"chart":null,"one_line":"一句话里留一个带底色的空位，几个候选词在里面自上而下飞快滚过、越滚越慢，最后冲过头一点再退回来停在答案上，外框随即扣住","use_when":"旁白在卖关子（“关键不是 A，不是 B，也不是 C，而是……”），或者要表现“试了好几个选项，最后选定这个”","energy":"高","needs":["文"],"overlay":true,"slot":3.5,"hero":3,"sfx":"spin=tick, stop=impact","pairs_with":["word-punch","underline-draw"],"vars":[{"id":"lead","type":"string","label":"空位前的半句","default":"好提示词，要写得"},{"id":"tail","type":"string","label":"空位后的半句（可空）","default":""},{"id":"options","type":"string","label":"滚过去的几个词，用 | 分开","default":"更长|更礼貌|更花哨"},{"id":"answer","type":"string","label":"最后停住的答案","default":"更具体"},{"id":"spin","type":"number","label":"开始滚动的时间（秒）","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.4,0.62,0.8,1.3,3],"doc":"## 命门\n\n1. **速度全在开头。** 滚动用 power3.out：前 0.3 秒滚过一大半的词，最后两个词是慢慢爬过去的。匀速滚动读起来是“列表在翻页”，没有“要停了、停在哪”的悬念。\n2. **冲过头再退回。** 滚轴停在答案下方 9% 行高的位置，再用 0.22 秒退回来。直接停在正位置上，停得太干净，像数字计数器，不像有重量的轮子。\n3. **句子不动，只有槽里在动。** 槽的宽度从头到尾等于最宽的那个词，前后半句的位置一帧都不变。槽宽跟着词变的话，整句话会左右抖。\n\n## 动作拆解\n\n| 时间（相对 spin，默认 0.5s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 整行（槽里是第一个候选词） | 上移 26px 淡入 | power3.out |\n| 0 → 1.30s | 槽里的词带 | 向下滚过 6 个词（候选词循环两遍），停在答案下方 9% 行高处 | power3.out |\n| 1.30 → 1.52s | 词带 | 退回正位 | power2.inOut |\n| 1.46 → 1.70s | 强调色外框 | 从 1.14 倍、透明收到 1 倍、不透明 | back.out(2.4) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| roll 滚动时长 | 1.3s | 过 2s 尾巴太长，悬念变成等待 | 低于 0.8s 一个词都看不清，只是一闪 |\n| loops 候选词循环遍数 | 2 | 3 遍以上开头更糊、更像老虎机，但要相应加长 roll | 1 遍时每个词都看得清，更像“逐个排除” |\n| over 冲过头的幅度 | 9（% 行高） | 过 20 会露出槽上方的空白，像出了错 | 0 时停得太硬 |\n| back 退回时长 | 0.22s | 过 0.4s 像在犹豫 | 低于 0.12s 是一下抖动 |\n| spin（变量） | 0.5s | — | 小于 0.35s 会在整行还没淡入完时就开始滚 |\n\n## 已知坑\n\n- 词带在布局里是答案排最上面、候选词在下面，整条向下走。这样不跑脚本时槽里显示的就是答案；副作用是整条词带有七个词高，会伸出槽外很远甚至伸出画面，HyperFrames 的检查会报溢出，所以槽上标了允许溢出（它本来就被槽裁掉了，看不见）。\n- 槽是一个会裁切的块，行内对齐不能用基线（裁切的块没有可用的基线），整行用的是垂直居中，并且所有文字都用同一个 1.4 的行高。改了某一段的行高，槽和两边的字会上下错开。\n- 候选词长短差太多时，槽按最长的词定宽，短词停在中间、两边留很多空。候选词和答案尽量字数相同。\n- 连拍图的时间点如果正好隔了整数个词，两帧看起来会一模一样（我第一次取的 0.62 和 0.9 秒就都是同一个词在同一位置），会误以为没在动；换时间点再看。\n- 上下两条渐变遮罩用的是面板色。换皮时如果给槽单独改了底色，遮罩要一起改，不然上下会出现两条色带。\n\n## 动效与皮的边界\n\n属于这张卡的：固定宽度的槽、单方向竖向滚动、先快后慢的速度分布、冲过头再回正、停稳以后才出现的锁定框。\n\n只是皮：槽的底色圆角、要不要上下渐变、候选词和答案的颜色、锁定框换成下划线或者色块、滚动方向向上还是向下。\n\n## 接进片子\n\n- 变量：`lead` 空位前的半句，`tail` 空位后的半句（可空）；`options` 滚过去的候选词，用 `|` 分开，三个左右最合适；`answer` 答案；`spin` 开始滚的秒数；`backdrop`。\n- 时间：答案在 `spin` + 1.52 秒停稳。把这个时刻对到旁白说出答案的那个词，倒推出 `spin`。\n- 音效：滚动期间一串由密到疏的滴答声，停稳那一帧一个短促的撞击或“咔”声。\n- 常见接法：停稳后停 0.5 秒，下一镜用 `word-punch` 把答案单独放大重说一遍。"},{"id":"zoom-match","name":"匹配缩放","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜朝画面里的一个点急推到 3 倍，换镜时下一镜里对应的点正好压在同一个屏幕位置上，再从 3 倍拉回全貌","use_when":"两镜里有同一个东西或同一类东西（同一个按钮、同一张脸、两个圆形的图标），旁白说“这个 X，其实是……”","energy":"中","needs":["多图"],"overlay":false,"slot":2,"hero":0.9,"sfx":"push=whoosh","pairs_with":["crash-zoom","magnifier-lens"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"ax","type":"number","label":"上一镜推向的点：横向 0–1","default":0.53},{"id":"ay","type":"number","label":"上一镜推向的点：纵向 0–1","default":0.27},{"id":"bx","type":"number","label":"下一镜里对上的点：横向 0–1","default":0.43},{"id":"by","type":"number","label":"下一镜里对上的点：纵向 0–1","default":0.15},{"id":"zoom","type":"number","label":"推到几倍","default":3},{"id":"mark","type":"enum","label":"对位圈","default":"on"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.9,1,1.134,1.7],"doc":"这张卡**不是叠加层**：它要缩放两镜的画面本身，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **换镜那一帧，两个点在屏幕上重合。** 上一镜绕 A 点放大，所以 A 在屏幕上始终不动；下一镜起始时被摆成 B 点正好在 A 的位置。眼睛盯着的那一点没有跳，换镜就不觉得断。两个点差出 100px 以上，读成“放大完了，又换了一张不相干的图”。\n2. **两边在换镜时是同一个倍数。** 上一镜推到 3 倍，下一镜从 3 倍开始拉。倍数不一致时，重合点周围的东西大小突变，像掉帧。\n3. **推是加速的，拉是减速的。** power3.in 接 power3.out，速度在换镜处最大，方向相反。这个“折返”是它和“穿过去”的区别：这里强调的是两样东西对得上，不是镜头往前走。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒。没有全遮；下一镜在 0.967 → 1.033s 的两帧里淡入，两边各带 8px 模糊盖住细节差。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.4 → 0.6s | 对位圈（可关） | 在 A 点由 1.7 倍缩到 1 倍并出现 | power3.out |\n| 0.733 → 1.0s | 上一镜 | 绕 A 点缩放 1 → 3，模糊 0 → 8px | power3.in |\n| 0.967 → 1.033s | 下一镜 | 透明度 0 → 1 | 线性 |\n| 1.0 → 1.4s | 下一镜 | 从“3 倍、B 压在 A 上”回到原大原位，模糊 8px → 0 | power3.out |\n| 1.0 → 1.4s | 对位圈 | 跟着 B 点走到它在下一镜里的位置，1.3 → 1.5s 淡出 | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| zoom（变量） | 3 | 4–5 更容易盖住两镜的差别，但图会糊 | 低于 2 两镜的差别看得太清，对位不准就露馅 |\n| push 推入时长 | 0.267s | 过 0.45s 观众有时间看清 A 周围，换镜时更容易发现不是同一个东西 | 低于 0.17s 看不到“朝哪里推” |\n| pull 拉出时长 | 0.4s | 过 0.6s 拖沓 | 低于 0.27s 下一镜的全貌出现得太突然 |\n| haze 模糊 | 8px | 过 16px 换镜处是一团雾，对位的意义没了 | 0 时两个点只要形状不同就能看出跳 |\n| mark（变量） | on | — | off：对位足够准、两个东西足够像时不需要圈 |\n\n## 已知坑\n\n- A 和 B 要自己量。用图片在 16:9 画面里实际显示的位置（裁切后），不是原图的像素坐标。示例里 A 是第一张图中间那个大圆的圆心，B 是第二张图上方大圆的圆心。\n- B 太靠近下一镜的边缘、A 又在另一侧时，把 B 压到 A 上会露出下一镜的边。脚本会自动把下一镜挪回去盖满画面，但这时两点就不再重合——对位圈会跟着偏。出现这种情况就加大 `zoom`（约到 4），或者换一对点。\n- 两个东西大小差很多（一个圆直径 600px，另一个 200px）时，只对位置不对大小，换镜处还是会跳一下。这张卡只管位置；大小差超过两倍就别用它。\n- 对位圈要在推之前 0.2 秒出现，所以这张卡在 0.4 秒就开始动，比别的转场卡早。裁短这段时别把圈的出场裁掉一半。\n\n## 动效与皮的边界\n\n属于这张卡的：绕 A 推、B 压在 A 上换镜、同倍数、推加速拉减速。\n\n只是皮：推到几倍、对位圈有没有以及它的样子（圈、方框、十字都行）、换镜处的模糊量。\n\n## 接进片子\n\n- 变量：`from`、`to`（地址从项目根目录写起），`ax` `ay` 上一镜里推向的点，`bx` `by` 下一镜里对上的点（都是 0–1，相对画面宽高），`zoom`，`mark`，`backdrop`。\n- 对齐：这段自己占 2 秒，两镜的交界在卡内 1.0 秒。旁白说出那个东西名字的时刻对在 0.6 秒左右（圈落定时）。\n- 音效：推入时一个短的掠过声，峰值在 1.0 秒。\n- 常见接法：上一镜先用放大镜或聚光把 A 标出来，再接这张卡；下一镜落定后从 B 点引出标注。"}]};
</script>
<script>
(function () {
  "use strict";
  var D = window.MC, BASE = D.base, cards = D.cards, groups = D.groups;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("mc." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("mc." + k, JSON.stringify(v)); } catch (e) {} }
  };

  // Webfonts are an extra: added from script so an unreachable font host never holds up the page.
  ["https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap",
   "https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap&text=" + encodeURIComponent($("h1").textContent)].forEach(function (href) {
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = href; document.head.appendChild(l);
  });

  // page order (group, then id), so "下一张" is the next tile on screen
  var gi = {};
  groups.forEach(function (g, i) { gi[g.name] = i; });
  cards.sort(function (a, b) { return (gi[a.group] - gi[b.group]) || (a.id < b.id ? -1 : 1); });
  var byId = {};
  cards.forEach(function (c) {
    byId[c.id] = c;
    c._hay = [c.id, c.name, c.one_line, c.use_when, c.group, c.needs.join(" "), c.intents.map(function (k) { return D.intents[k]; }).join(" ")].join(" ").toLowerCase();
    c._doc = (c.doc || "").toLowerCase();
  });
  var skin = store.get("skin", "light");
  if (skin !== "dark") skin = "light";
  var state = { q: "", group: "", energy: "", need: "", intent: "", overlay: false };
  var basket = store.get("basket", []);
  basket = Array.isArray(basket) ? basket.filter(function (id) { return byId[id]; }) : [];
  var NEEDS = ["文", "数据", "图", "多图", "界面", "网页", "人", "无"];
  var current = null;

  $("#slate").innerHTML = "<span><b class='mono'>" + cards.length + "</b> 张卡</span><span><b class='mono'>" + groups.length + "</b> 组</span><span>HyperFrames <b class='mono'>" + esc(D.hf) + "</b></span><span>更新于 <b class='mono'>" + esc(D.built) + "</b></span>";

  // ---- filters
  function chip(label, n, pressed, attr) { return "<button type='button' class='chip' aria-pressed='" + pressed + "' " + attr + ">" + esc(label) + (n != null ? "<span class='n'>" + n + "</span>" : "") + "</button>"; }
  function drawFilters() {
    $("#f-group").innerHTML = chip("全部", cards.length, !state.group, "data-group=''") + groups.map(function (g) { return chip(g.name, g.count, state.group === g.name, "data-group='" + esc(g.name) + "'"); }).join("");
    $("#f-energy").innerHTML = ["", "低", "中", "高"].map(function (e) { return chip(e || "全部", null, state.energy === e, "data-energy='" + e + "'"); }).join("");
    $("#f-needs").innerHTML = chip("不限", null, !state.need, "data-need=''") + NEEDS.map(function (n) { return chip(n, cards.filter(function (c) { return c.needs.indexOf(n) >= 0; }).length, state.need === n, "data-need='" + n + "'"); }).join("");
    $("#f-overlay").innerHTML = chip("能透明压在画面上", cards.filter(function (c) { return c.overlay; }).length, state.overlay, "data-overlay='1'");
    $("#f-intent").innerHTML = "<option value=''>全部</option>" + Object.keys(D.intents).map(function (k) {
      var n = cards.filter(function (c) { return c.intents.indexOf(k) >= 0; }).length;
      return n ? "<option value='" + k + "'" + (state.intent === k ? " selected" : "") + ">" + esc(D.intents[k]) + "（" + n + "）</option>" : "";
    }).join("");
    $("#skin-dark").setAttribute("aria-pressed", skin === "dark");
    $("#skin-light").setAttribute("aria-pressed", skin === "light");
  }
  $("#rail").addEventListener("click", function (e) {
    var b = e.target.closest("[data-group],[data-energy],[data-need],[data-overlay]");
    if (!b) return;
    if (b.hasAttribute("data-group")) state.group = b.getAttribute("data-group");
    if (b.hasAttribute("data-energy")) state.energy = b.getAttribute("data-energy");
    if (b.hasAttribute("data-need")) state.need = b.getAttribute("data-need");
    if (b.hasAttribute("data-overlay")) state.overlay = !state.overlay;
    drawFilters(); render();
  });
  $("#f-intent").addEventListener("change", function (e) { state.intent = e.target.value; render(); });
  var typing;
  $("#q").addEventListener("input", function (e) { clearTimeout(typing); typing = setTimeout(function () { state.q = e.target.value; render(); }, 180); });
  $("#reset").addEventListener("click", function () { state = { q: "", group: "", energy: "", need: "", intent: "", overlay: false }; $("#q").value = ""; drawFilters(); render(); });
  $("#filter-toggle").addEventListener("click", function () { var r = $("#rail"), open = r.getAttribute("data-open") !== "true"; r.setAttribute("data-open", open); this.setAttribute("aria-expanded", open); });
  ["dark", "light"].forEach(function (s) { $("#skin-" + s).addEventListener("click", function () { skin = s; store.set("skin", s); drawFilters(); render(); }); });

  // Search looks at names and uses first; only when nothing matches there does it fall back to the full card text.
  function visible() {
    var base = cards.filter(function (c) {
      return (!state.group || c.group === state.group) && (!state.energy || c.energy === state.energy) &&
        (!state.need || c.needs.indexOf(state.need) >= 0) && (!state.intent || c.intents.indexOf(state.intent) >= 0) && (!state.overlay || c.overlay);
    });
    var words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return { list: base, full: false };
    var has = function (field) { return function (c) { return words.every(function (w) { return c[field].indexOf(w) >= 0; }); }; };
    var hit = base.filter(has("_hay"));
    return hit.length ? { list: hit, full: false } : { list: base.filter(has("_doc")), full: true };
  }

  // ---- per-card timeline: slot length, the five sampled frames, the hero frame
  function ruler(c) {
    var slot = c.slot || 4, at = function (t) { return "left:calc((100% - 34px) * " + Math.max(0, Math.min(1, t / slot)).toFixed(4) + ")"; };
    var ticks = (c.frames || []).map(function (t) { return "<i class='tick' style='" + at(t) + "'></i>"; }).join("");
    var hero = c.hero != null ? "<i class='hero' style='" + at(c.hero) + "'></i>" : "";
    return "<div class='ruler' aria-hidden='true' title='建议时长 " + slot + " 秒；竖线是连拍的五个时刻，菱形是主画面（" + c.hero + " 秒）'><i class='track'></i>" + ticks + hero + "<span class='len'>" + slot + "s</span></div>";
  }
  function demoUrl(c, extra) { return BASE + "cards/" + c.id + "/demo.html?skin=" + skin + (extra || ""); }

  // ---- contact sheet: a preview iframe exists only while its tile is on screen
  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      var st = e.target, f = st.querySelector("iframe");
      if (e.isIntersecting && !f && !reduced) mount(st);
      else if (!e.isIntersecting && f) unmount(st);
    });
  }, { rootMargin: "200px 0px" }) : null;
  function unmount(st) {
    var f = st.querySelector("iframe"), p = st.querySelector(".play");
    if (f) f.remove();
    if (p) p.hidden = false;
  }
  function mount(st) {
    if (st.querySelector("iframe")) return;
    var p = st.querySelector(".play");
    if (p) p.hidden = true;
    var f = document.createElement("iframe");
    f.setAttribute("aria-hidden", "true");
    f.tabIndex = -1;
    f.addEventListener("load", function () { f.classList.add("on"); });
    f.src = st.getAttribute("data-src");
    st.insertBefore(f, st.firstChild);
  }
  function pickLabel(c, on) { return (on ? "移出选卡篮：" : "放进选卡篮：") + c.name; }
  var shown = "";
  function render() {
    var v = visible(), list = v.list;
    $("#count").textContent = v.full ? "卡名和用途里没有，按说明全文找到 " + list.length + " 张" : "显示 " + list.length + " / " + cards.length + " 张";
    var key = skin + "|" + list.map(function (c) { return c.id; }).join(",");
    if (key === shown) return;
    shown = key;
    if (io) io.disconnect();
    var html = "";
    groups.forEach(function (g) {
      var sub = list.filter(function (c) { return c.group === g.name; });
      if (!sub.length) return;
      html += "<section><div class='group-head'><h3>" + esc(g.name) + "</h3><span class='n'>" + sub.length + "</span></div><div class='grid'>";
      sub.forEach(function (c) {
        var on = basket.indexOf(c.id) >= 0;
        html += "<article class='tile' data-id='" + c.id + "'>" +
          "<div class='stage' data-src='" + esc(demoUrl(c, "&bare=1")) + "' style=\"background-image:url('" + BASE + "cards/" + c.id + "/thumb.jpg')\">" +
          (reduced ? "<button type='button' class='play'>▶ 播放</button>" : "") + "</div>" +
          "<button type='button' class='pick' aria-pressed='" + on + "' aria-label='" + esc(pickLabel(c, on)) + "'>" + (on ? "✓" : "＋") + "</button>" +
          "<div class='meta'><div class='name'><button type='button' class='open'>" + esc(c.name) + "</button><span class='id'>" + c.id + "</span></div>" +
          "<p class='one'>" + esc(c.one_line) + "</p>" +
          "<div class='tags'><span class='energy e" + esc(c.energy) + "'>能量" + esc(c.energy) + "</span><span>" + c.needs.map(esc).join(" · ") + "</span>" + (c.overlay ? "<span>可叠加</span>" : "") + "</div>" +
          ruler(c) + "</div></article>";
      });
      html += "</div></section>";
    });
    $("#sheet").innerHTML = html || "<p class='empty'>没有符合条件的卡。换个说法搜，或者点“清空筛选”。</p>";
    if (io) document.querySelectorAll(".stage").forEach(function (s) { io.observe(s); });
  }
  $("#sheet").addEventListener("click", function (e) {
    var tile = e.target.closest(".tile"); if (!tile) return;
    var id = tile.getAttribute("data-id");
    if (e.target.closest(".pick")) return toggle(id);
    if (e.target.closest(".play")) return mount(e.target.closest(".stage"));
    if (e.target.closest(".stage") || e.target.closest(".open")) open(id);
  });

  // ---- basket
  function toggle(id) {
    var i = basket.indexOf(id);
    if (i >= 0) basket.splice(i, 1); else basket.push(id);
    store.set("basket", basket);
    syncPicks();
  }
  function syncPicks() {
    document.querySelectorAll(".tile").forEach(function (t) {
      var c = byId[t.getAttribute("data-id")], on = basket.indexOf(c.id) >= 0, b = t.querySelector(".pick");
      b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", pickLabel(c, on)); b.textContent = on ? "✓" : "＋";
    });
    $("#basket").hidden = !basket.length;
    $("#basket-n").textContent = "选卡篮 " + basket.length + " 张";
    $("#basket-list").innerHTML = basket.map(function (id) { return "<span>" + esc(id) + "</span>"; }).join("");
    if (current) drawPick();
  }
  function useCmd(ids) { return "node motion-cards/tools/cards.mjs use <项目>/hyperframes " + ids.join(","); }
  $("#copy-names").addEventListener("click", function () { copy(basket.map(function (id) { return id + "（" + byId[id].name + "）"; }).join("、"), "已复制 " + basket.length + " 张卡的名字"); });
  $("#copy-use").addEventListener("click", function () { copy(useCmd(basket), "已复制装卡命令"); });
  $("#clear").addEventListener("click", function () { basket = []; store.set("basket", basket); syncPicks(); });

  // an open modal dialog covers everything outside it, so the toast and the copy fallback move inside it
  function layer(el) { var host = $("#dl").open ? $("#dl") : document.body; if (el.parentNode !== host) host.appendChild(el); return el; }
  function copy(text, done) {
    var fail = function () { layer($("#manual")).hidden = false; $("#manual-text").value = text; $("#manual-text").focus(); $("#manual-text").select(); };
    try { navigator.clipboard.writeText(text).then(function () { toast(done); }, fail); } catch (e) { fail(); }
  }
  $("#manual-close").addEventListener("click", function () { $("#manual").hidden = true; });
  var tt;
  function toast(msg) { var t = layer($("#toast")); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 1800); }

  // ---- inspector
  function md(src) {
    var out = "", lines = src.split(/\r?\n/), i = 0;
    var inline = function (s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); };
    var cells = function (row) { return row.trim().replace(/^\||\|$/g, "").split("|").map(function (x) { return x.trim(); }); };
    while (i < lines.length) {
      var l = lines[i];
      if (/^#{2,3} /.test(l)) { out += "<h3>" + inline(l.replace(/^#+ /, "")) + "</h3>"; i++; continue; }
      if (/^\|/.test(l)) {
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { if (!/^\|[\s:|-]+$/.test(lines[i].trim())) rows.push(cells(lines[i])); i++; }
        out += "<div class='table-wrap'><table>" + rows.map(function (r, k) { var t = k ? "td" : "th"; return "<tr>" + r.map(function (c) { return "<" + t + ">" + inline(c) + "</" + t + ">"; }).join("") + "</tr>"; }).join("") + "</table></div>";
        continue;
      }
      var m = /^\s*(\d+\.|-)\s+/.exec(l);
      if (m) {
        var ordered = /\d/.test(m[1]), re = ordered ? /^\s*\d+\.\s+/ : /^\s*-\s+/, items = [];
        while (i < lines.length && re.test(lines[i])) { items.push(lines[i].replace(re, "")); i++; }
        out += (ordered ? "<ol>" : "<ul>") + items.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + (ordered ? "</ol>" : "</ul>");
        continue;
      }
      if (l.trim()) out += "<p>" + inline(l) + "</p>";
      i++;
    }
    return out;
  }
  function snippet(c) {
    var vals = {}; c.vars.forEach(function (v) { vals[v.id] = v.default; });
    return "<div id=\"" + c.id + "-1\" class=\"clip\"\n     data-composition-id=\"" + c.id + "\"\n     data-composition-src=\"motion-cards/cards/" + c.id + "/demo.html\"\n     data-variable-values='" + JSON.stringify(vals).replace(/'/g, "&#39;") + "'\n     data-start=\"0\" data-duration=\"" + c.slot + "\" data-track-index=\"2\"\n     data-width=\"1920\" data-height=\"1080\"></div>";
  }
  function drawPick() {
    var on = basket.indexOf(current.id) >= 0;
    $("#dl-pick").textContent = on ? "✓ 在选卡篮里" : "＋ 放进选卡篮";
    $("#dl-pick").className = "btn" + (on ? " key" : "");
    $("#dl-pick").setAttribute("aria-pressed", on);
  }
  function open(id) {
    var c = byId[id];
    if (!c) return;
    current = c;
    $("#dl-name").textContent = c.name;
    $("#dl-id").textContent = c.id + " · " + c.group;
    $("#dl-stage").innerHTML = "<iframe title='" + esc(c.name) + " 预览，可拖动进度条' src='" + esc(demoUrl(c)) + "'></iframe>";
    $("#dl-strip").innerHTML = "<img alt='" + esc(c.name) + " 的五帧连拍' src='" + BASE + "cards/" + c.id + "/strip.jpg' width='1936' height='238'><figcaption>连拍：五个关键时刻，每帧左上角是时间。</figcaption>";
    var intents = c.intents.map(function (k) { return D.intents[k]; }).join("、") || "不按旁白挑，垫在画面底下用";
    var facts = [["用在", c.use_when], ["旁白在说", intents], ["要的素材", c.needs.join("、")], ["能量", c.energy + (c.overlay ? "，能透明压在画面上" : "")], ["建议时长", c.slot + " 秒，主画面在 " + c.hero + " 秒"]];
    if (c.numbers) facts.push(["数字", "一屏摆 " + (c.numbers[0] === c.numbers[1] ? c.numbers[0] : c.numbers[0] + "–" + c.numbers[1]) + " 个" + (c.chart ? "，画" + (D.charts[c.chart] || c.chart) : "")]);
    if (c.sfx && c.sfx !== "none") facts.push(["音效", c.sfx]);
    if (c.pairs_with && c.pairs_with.length) facts.push(["常搭", c.pairs_with.map(function (p) { return byId[p] ? byId[p].name + "（" + p + "）" : p; }).join("、")]);
    $("#dl-facts").innerHTML = facts.map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; }).join("");
    $("#dl-snippet").textContent = snippet(c);
    $("#dl-vars").innerHTML = c.vars.length ? "<tr><th>变量</th><th>说明</th><th>默认</th></tr>" + c.vars.map(function (v) { return "<tr><td>" + esc(v.id) + "</td><td>" + esc(v.label) + "</td><td>" + esc(typeof v.default === "string" ? v.default : JSON.stringify(v.default)) + "</td></tr>"; }).join("") : "<tr><td>这张卡没有变量</td></tr>";
    $("#dl-doc").innerHTML = md(c.doc || "");
    drawPick();
    if (!$("#dl").open) $("#dl").showModal();
    $("#dl").scrollTop = 0;
    try { history.replaceState(null, "", "#" + c.id); } catch (e) {}
  }
  $("#dl").addEventListener("close", function () { $("#dl-stage").innerHTML = ""; $("#manual").hidden = true; current = null; try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} });
  function step(d) {
    var list = visible().list;
    if (!current || !list.length) return;
    var i = list.indexOf(current);
    open(list[(i + d + list.length) % list.length].id);
  }
  $("#dl-prev").addEventListener("click", function () { step(-1); });
  $("#dl-next").addEventListener("click", function () { step(1); });
  $("#dl-close").addEventListener("click", function () { $("#dl").close(); });
  $("#dl-pick").addEventListener("click", function () { if (current) toggle(current.id); });
  $("#dl-copy").addEventListener("click", function () { if (current) copy(snippet(current), "已复制挂载片段"); });
  $("#dl-copy-use").addEventListener("click", function () { if (current) copy(useCmd([current.id]), "已复制装卡命令"); });
  $("#dl").addEventListener("keydown", function (e) {
    if (/^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  $("#dl").addEventListener("click", function (e) { if (e.target === $("#dl")) $("#dl").close(); });

  function fromHash() { var h = decodeURIComponent((location.hash || "").slice(1)); if (byId[h] && (!current || current.id !== h)) open(h); }
  addEventListener("hashchange", fromHash);
  drawFilters(); syncPicks(); render(); fromHash();
})();
</script>

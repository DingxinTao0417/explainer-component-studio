以内）；`big` 大词（2–4 个字）；`hit` 大词压下的秒数，对齐旁白重读这个词的时刻；`backdrop`。\n- 时间：小字在 0.15 秒出现，所以 `hit` 至少留到 0.75 秒以后，脚本会自动保证这一点；默认 1.2 秒是给一句八九个字的铺垫留的阅读时间。\n- 音效：`hit` 前 0.1 秒起一个短的掠过声，`hit` + 0.2 秒（落地那一帧）一个低沉的撞击声。\n- 常见接法：这张卡自己就是一个完整的“铺垫 → 揭晓”，后面接正文画面或 `line-rise` 展开解释。一条片子里用一到两次。"},{"id":"scan-beams","name":"光束扫","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"三道宽窄不一、很淡的斜向光束整镜匀速从左往右扫过，光束经过的地方底色略微被提亮","use_when":"展示、揭晓、强调“这是重点”的文字镜，想要一点舞台灯光的感觉，但不能有闪光或扫光特效那种抢眼的瞬间","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["slab-title-slam","big-stat-slab","stamp-verdict"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"光从标题后面慢慢扫过"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"光束浓度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **是提亮，不是白条。** 光束的主体是比底色亮一档的面板色，芯里只掺两到三成的强调色。直接用白色或纯强调色，就成了一道划过屏幕的高光，观众的眼睛会被它带走。\n2. **匀速，6 秒只走大半个画面。** 三道光每秒走 220 到 280px，全程线性。带加减速的扫光读成“特效开始了、特效结束了”，有了明确的瞬间。\n3. **三道同一个斜度。** 都向右倾 22°。斜度各不相同时像几把乱晃的手电，不再是同一个光源。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 中等光束（宽 520px，芯带强调色） | 左边缘从 x=-260 走到 1240 | 线性 |\n| 0 → 6s | 最宽的光束（宽 860px，最淡，芯带第二强调色） | 从 x=520 走到 1840 | 线性 |\n| 0 → 6s | 最窄的光束（宽 300px） | 从 x=-1000 走到 700，约 2 秒时从左上角进画 | 线性 |\n\n每道光束横向是“透明 → 面板色 → 带色的芯 → 面板色 → 透明”的渐变，没有硬边。标题不动。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 1.6 光束在镜头结束前全部扫出画面右侧，后面是空底 | 0.4 时光束像固定的灯柱 |\n| strength（变量） | 0.7 | 1 时芯的颜色明显，深色皮下像霓虹灯管 | 0.3 只剩一点明暗起伏 |\n| skew（CFG） | -22° | 过 -45° 光束接近横扫，会长时间压在标题整行后面 | 0° 是竖直的光柱，像百叶窗 |\n| runs（CFG） | 见上表 | 起点都在画面外时第一帧是空底 | 距离太短时看不出在扫 |\n\n## 已知坑\n\n- 光束的斜度是用补间里的 `skewX` 定的（起止值相同），没有写在 CSS 里。把斜度挪到 CSS 的 `transform` 上，它会和位移补间互相覆盖，光束要么不斜要么不动。\n- 斜着的光束上下两头会露出画面，所以每道光高 1320px、顶部在画面上方 120px。改斜度后要重新算高度，否则角上会露出光束的端头。光束大部分时间有一截在画面外，所以包裹层带着 `data-layout-allow-overflow`，去掉它检查会报元素跑出容器。\n- 浅色皮下面板色是白的，提亮的幅度很小，主要靠芯里的颜色看出光束。浅色皮可以把 strength 提到 0.85。\n- 最宽那道光经过标题时，标题后面的底色会亮一档。深色皮白字没有影响；如果上面压的是灰色小字，对比会掉一点。\n- 一去不回，首尾两帧不同。镜头比 6 秒长时把 speed 调小并拉长时长，不要重播，重播时光束会跳回左边。\n\n## 动效与皮的边界\n\n属于这张卡的：同斜度、软边、宽窄不同的几道光，匀速单向扫过，用“比底色亮一档”而不是高光来表现。\n\n只是皮的：光束条数（两到四道）、每道的宽度和起点、芯里掺哪种强调色、斜的方向（左倾右倾都行）、扫的方向。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把标题或数字卡叠在更高的轨道上；`speed` 是扫过距离的倍数；`strength` 是光束浓度。\n- 时间：整镜铺满。想让光正好在揭晓的那个词出现时经过画面中央：中等那道光约在第 3.8 秒到达正中。\n- 音效：没有。上面的卡自己有落点音效时，不要再给光束配扫过的声音。\n- 常见接法：`slab-title-slam`、`big-stat-slab`、`stamp-verdict` 的幕底。"},{"id":"scan-line","name":"扫描线","group":"标注与手绘","type":"evidence","intents":["point","software"],"numbers":null,"chart":null,"one_line":"一条拖着光尾的水平亮线匀速从上扫到下，线刚离开哪个目标的下沿，那个目标的识别框就弹出来并亮一下","use_when":"旁白在说“系统把这一页读了一遍”“自动识别出了五处”，要表现逐项被检出，而不是一次全亮","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":2.6,"sfx":"sweep=whoosh, hit=tick","pairs_with":["reticle-lock","count-badge"],"vars":[{"id":"x","type":"number","label":"扫描区域左上角 x（1920×1080 坐标）","default":60},{"id":"y","type":"number","label":"扫描区域左上角 y","default":180},{"id":"w","type":"number","label":"扫描区域宽","default":1800},{"id":"h","type":"number","label":"扫描区域高","default":880},{"id":"boxes","type":"string","label":"被识别出的框：x,y,宽,高；用分号隔开","default":"300,276,416,88;300,576,416,88;300,876,484,88"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.7,1.2,1.6,2.6],"doc":"## 命门\n\n1. **匀速。** 扫描线 1.5 秒走完全程，线性，不加任何缓动。带缓入缓出的线读起来是一块幕布在拉，不是机器在逐行读。\n2. **框由位置触发。** 每个框的出现时间是“线离开它下沿的那一刻再过 0.02 秒”算出来的，不是等间隔排的。框的间距不均匀时这一点立刻见分晓：按固定节拍弹出的框会跑到线的前面或落在后面，因果关系就断了。\n3. **线走了，框留下。** 线扫到底后 0.16 秒淡出，框一直留到镜头结束。线和框一起消失，观众只记得有道光划过，记不住检出了什么。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.40s | 扫描线 | 在区域上沿淡入 | 线性 |\n| 0.30 → 1.80s | 扫描线 | 从区域上沿匀速移到下沿（默认 880px） | 线性 |\n| 线过每个框下沿 +0.02s | 识别框 | 缩放 1.14 → 1 弹出；框内填色闪到 0.5 再用 0.45 秒褪掉 | power3.out / power2.out |\n| 1.80 → 1.96s | 扫描线 | 淡出 | 线性 |\n\n默认三个框分别在 0.66、1.17、1.68 秒弹出。扫描线的亮线粗 12px，框线粗 10px。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| sweep 扫描时长 | 1.5s | 过 2.5s 观众等不及；长页面宁可分两段扫 | 低于 0.8s 框挤在一起弹，数不清 |\n| grow 框的外扩 | 14px | 过 28px 框松垮，不像检测结果 | 0 时框线压在目标的字上 |\n| popFrom 弹出起始倍数 | 1.14 | 过 1.3 像贴纸砸下来，太闹 | 1 就只是出现，没有“命中” |\n| glow 填色褪去时长 | 0.45s | 过 1s 上一个还亮着下一个又亮，整屏发黄 | 低于 0.2s 看不出哪个刚被扫到 |\n| late 触发延迟 | 0.02s | 过 0.15s 框明显晚于线，像网络卡 | 负数时框会先于线出现 |\n\n## 已知坑\n\n- `boxes` 里的坐标是画面绝对坐标，不是相对扫描区域的。写成相对值时框会全部挤在左上角。\n- 框必须在扫描区域的纵向范围内。超出下沿的框会在线到底时一起弹，超出上沿的在一开始就弹。\n- 光尾高 160px，在线的上方。扫描区域紧贴画面顶部时，起始那一刻光尾会伸出画面，没有影响；但区域上方 160px 内如果有不想被染色的内容，把光尾的高度改小。\n- 浅色底上发光不明显，线主要靠上下两条深色细边显形；深色底上则是发光在起作用。两种底都要各看一眼。\n- 框超过 7 个：填色闪烁此起彼伏，会乱。多于 7 个时把 `glowTo` 降到 0.25。\n\n## 动效与皮的边界\n\n属于这张卡的：匀速的水平扫描、框的出现时间由线的位置决定、线离场而框留下。\n\n只是皮：线的粗细和发光、有没有光尾、框的圆角和线宽、弹出时的缩放幅度、框内闪不闪填色。\n\n## 接进片子\n\n- 默认演示（`backdrop: on`）垫的是示例截图放大 2 倍后的任务列表区域（原图 340,110 起的 960×540 一块铺满画面）；默认扫描区域是 60,180 起的 1800×880，三个框套住三行任务的标题（416×88、416×88、484×88）。\n- 变量：`x / y / w / h` 是被扫描的区域；`boxes` 是识别结果，每个框写成 `x,y,宽,高`，框之间用分号；`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：旁白开始说“扫一遍”时对齐 0.3 秒。要让某个框对上旁白里的词，用上面的触发公式反推 `sweep`。\n- 音效：0.3 秒起一条 1.5 秒的掠过音；每个框弹出时一声很轻的“滴”，音高可以逐个升高。\n- 常见接法：扫完接 `reticle-lock` 锁定其中一个，或者接一个计数角标报出总数。"},{"id":"screen-push-focus","name":"录屏推近圈框","group":"证据与界面","type":"evidence","intents":["point","software"],"numbers":null,"chart":null,"one_line":"截图先全景停半秒，镜头一次推近到目标区域，快到位时强调色框沿边描出来，框外同时压暗","use_when":"旁白说“看这里”“注意这一项”，而证据在一张满屏截图或录屏的某个小区域里","energy":"中","needs":["界面"],"overlay":false,"slot":4,"hero":3.2,"sfx":"push=whoosh, frame=draw","pairs_with":["spotlight-dim","cursor-click","magnifier-lens"],"vars":[{"id":"src","type":"string","label":"截图地址（1920×1080，从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"x","type":"number","label":"目标区域左边（截图像素）","default":478},{"id":"y","type":"number","label":"目标区域上边（截图像素）","default":538},{"id":"w","type":"number","label":"目标区域宽","default":270},{"id":"h","type":"number","label":"目标区域高","default":96},{"id":"zoom","type":"number","label":"最大推近倍数","default":2.4},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.9,1.2,1.5,3.2],"doc":"## 命门\n\n1. **先给全景。** 前 0.5 秒镜头不动。一上来就是特写，观众不知道这块东西在界面的哪里，读成“一张裁过的图”，不是“我带你看过去”。\n2. **框抢在镜头停稳之前。** 框在推近结束前 0.25 秒开始描，两个动作一起落定。等镜头停死再描框，会读成两件事：先放大，再想起来要标注。\n3. **框外压暗，框内一点不动。** 压暗层是从目标区域向外铺的，框里的像素保持原样。整张图一起变暗再把框里调亮，颜色会偏，证据就不像原图了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.5s | 整张截图 | 全景静止 | — |\n| 0.5 → 1.4s | 镜头（截图层） | 缩放 1 → 2.4，同时平移到目标居中；原点固定在左上角 | power3.inOut |\n| 1.15 → 1.6s | 强调色框 | 沿边线从 0 描到闭合，线宽在画面上恒为 6px | power2.out |\n| 1.15 → 1.55s | 框外压暗层 | 透明度 0 → 1（遮罩本身是 62% 的黑） | power2.out |\n| 1.6s 之后 | 全部 | 停住 | — |\n\n推近倍数是算出来的：让目标占到画面宽的 60% 或高的 46%，先到哪个算哪个，再用 `zoom` 封顶。\n\n## 参数手感\n\n| 参数（CFG / 变量） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hold 全景停留 | 0.5s | 过 1s 观众开始自己找重点，推近就晚了 | 低于 0.3s 等于没有全景 |\n| push 推近时长 | 0.9s | 过 1.4s 像慢慢凑上去，拖 | 低于 0.5s 变成跳切，晕 |\n| lead 框提前量 | 0.25s | 过 0.45s 框在乱晃的画面上描，看不清 | 0 就是“停稳再标” |\n| zoom（变量）倍数上限 | 2.4 | 过 3 截图的字发糊（1920 的图只有这么多像素） | 1.3 以下推近感消失，不如用聚光压暗 |\n| 压暗浓度 | 0.62 | 过 0.8 周围全黑，失去“在界面里”的上下文 | 低于 0.4 框外的字还在抢眼 |\n| pad 框到内容的留白 | 12px | 过 30px 框住了旁边的东西 | 0 时框线压在字的边上 |\n\n## 已知坑\n\n- 校验会报镜头层 `container_overflow` 和 `escaped_container`：放大后的截图本来就比画面大。这是有意的，在镜头层上加 `data-layout-allow-overflow`，不要去改几何。\n- 目标贴着截图边缘时到不了画面正中：脚本会把平移量夹住，不让截图外面的空白露出来，所以示例里靠右的目标会停在偏右的位置。这是对的，别为了居中露黑边。\n- 框的线宽要除以倍数：框和截图一起被放大，不除的话 6px 会变成 14px 的粗边。换倍数时不用手改，脚本已经按最终倍数算了。\n- 目标又宽又扁（比如一整行）时算出来的倍数会小于 1.3，推近几乎看不出。这种目标改用 `spotlight-dim`。\n- 坐标填的是**截图原始像素**（1920×1080 的图）。截图不是这个尺寸要先缩放到 1920 宽，否则框会偏。\n\n## 动效与皮的边界\n\n属于这张卡的：先全景后推近的顺序、一次到位的 inOut 推近、框抢在落定前开始描、框外压暗而框内不动、落定后不再有任何动作。\n\n只是皮：框的颜色、圆角和线宽，压暗的浓度，截图本身，要不要在框旁边另加文字标注（那是另一张卡的事）。\n\n## 接进片子\n\n- 变量：`src` 截图地址；`x / y / w / h` 目标区域在截图上的像素位置和大小；`zoom` 倍数上限；`backdrop`。\n- 起点对齐旁白里“看这里”之前的半句，让 1.15 秒描框的时刻落在指示词上。\n- 音效：0.5 秒起一个轻的掠过声，1.15 秒描框配笔划声。\n- 接法：同一张截图要看第二处，后面接 `spotlight-dim`；要演示操作，接 `cursor-click`。"},{"id":"shape-wipe","name":"形状擦除","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"一个斜切的长色块（或一个从某点涨开的圆）不停顿地扫过画面，前沿盖掉上一镜，后沿放出下一镜","use_when":"同一个话题里往前推进一步（下一个步骤、下一个例子），需要“翻页”而不是“断开”","energy":"中","needs":["无"],"overlay":true,"slot":2,"hero":0.9,"sfx":"sweep=whoosh","pairs_with":["kicker-headline","progress-rail"],"vars":[{"id":"shape","type":"enum","label":"形状","default":"slant"},{"id":"dir","type":"enum","label":"斜块往哪边扫","default":"right"},{"id":"ox","type":"number","label":"圆心横向 0–1（圆形时）","default":0.5},{"id":"oy","type":"number","label":"圆心纵向 0–1（圆形时）","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.9,1,1.134,1.6],"doc":"这是一个叠加层：压在两镜的交界上，中间有 2 帧把画面完全盖住，换镜发生在这 2 帧底下。\n\n## 命门\n\n1. **它是一个经过的形状，不是一块停下来的板。** 前沿一路加速到盖满，后沿用同样的速度接着走再减速，中间不停。一停就成了色块砸切，语气从“翻页”变成“打断”。\n2. **边是斜的（或是圆的）。** 斜 18° 的边让画面在同一帧里上半已经换了、下半还没换，眼睛能跟着边走。垂直的边读成幻灯片的“擦除”，和普通界面动画没区别。\n3. **前后沿各带一条第二色的细边。** 细边告诉观众这是一个有厚度的东西在动；没有它，大色块和上一镜之间只是一条色差线，快速扫过时看不清方向。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（全遮 2 帧的正中）。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.733 → 0.967s | 前沿 | 从画面一角外扫到对角外，盖满 | power2.in |\n| 0.967 → 1.033s | 整块 | 全遮 2 帧 | — |\n| 1.033 → 1.3s | 后沿 | 沿同一方向扫出，露出下一镜 | power2.out |\n\n圆形时：前沿是圆的外径，从圆心涨到够到最远的角；后沿是圆心处张开的洞。宿主把两镜的交界对在卡内 **1.0 秒**。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| lead 前沿用时 | 0.233s | 过 0.4s 像慢慢拉上的幕布 | 低于 0.13s 只看到一闪 |\n| tail 后沿用时 | 0.267s | 过 0.4s 下一镜被挡太久 | 低于 0.17s 收得太急，像抖了一下 |\n| cover 全遮帧数 | 2 | 4 帧以上就有了停顿感，变成砸切 | 1 帧有漏镜风险 |\n| slant 斜角 | 18° | 过 35° 上下时间差太大，像撕开 | 0° 是直边，失去辨识度 |\n| rim 细边宽 | 4%（圆形 44px） | 过 8% 变成双色条纹，抢戏 | 0 时方向感变弱 |\n\n## 已知坑\n\n- 形状是用一个渐变画的，前后沿是两个数。改颜色时别把渐变里的色标顺序打乱，顺序错了细边会跑到色块里面去。\n- 圆心（`ox` / `oy`）贴近画面一角时，圆要涨到对角才盖满，同样的时长下边缘速度几乎翻倍，看着更猛；想保持力度就把 `lead` 加 2 帧。\n- 斜块向右扫时，观众的视线被带到右下角。下一镜的主体如果在左上，会有一瞬间找不到看哪，换成 `dir: left`。\n- 全遮的 2 帧是纯强调色。上一镜和下一镜都很暗时，这 2 帧会显得刺眼，把强调色的明度压一点。\n\n## 动效与皮的边界\n\n属于这张卡的：不停顿地经过、前沿加速后沿减速、非垂直的边、2 帧全遮。\n\n只是皮：形状选斜块还是圆、两种颜色、细边宽窄、斜角大小（10°–30° 之间都成立）、扫的方向。\n\n## 接进片子\n\n- 变量：`shape`（slant 斜块 / circle 圆），`dir` 斜块往哪边扫，`ox` `oy` 圆心位置（只在圆形时用，对准上一镜里正在讲的那个东西），`backdrop` 在片子里填 `off`。\n- 对齐：这段的起点 = 两镜交界 − 1.0 秒，时长 2 秒，轨道压在两镜上面。\n- 音效：一个 0.5 秒左右的掠过声，峰值对在 1.0 秒。\n- 常见接法：步骤一 → 步骤二之间用斜块；“放大看这里”之后用圆，从那个位置涨开。"},{"id":"sketch-draw","name":"线稿画出","group":"标注与手绘","type":"metaphor","intents":["process"],"numbers":null,"chart":null,"one_line":"一张“方框 → 圆 → 方框”的示意图按阅读顺序一笔一笔画出来，每个形状画到一半时它里面的字跟着浮出来","use_when":"旁白在讲一个三步的关系或流程（输入、处理、输出），想让观众跟着讲解的顺序一步步看到，而不是一次看到整张图","energy":"低","needs":["文"],"overlay":true,"slot":5,"hero":4.2,"sfx":"stroke=draw","pairs_with":["line-rise","label-callout"],"vars":[{"id":"items","type":"string","label":"三个节点的文字，用 | 隔开（方框 | 圆 | 方框）","default":"素材|模型|成片"},{"id":"x","type":"number","label":"示意图左上角 x（1920×1080 坐标）","default":160},{"id":"y","type":"number","label":"示意图左上角 y","default":380},{"id":"w","type":"number","label":"示意图宽","default":1600},{"id":"h","type":"number","label":"示意图高（也是圆的直径）","default":320},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.633,1.667,2.733,4.2],"doc":"## 命门\n\n1. **一次只有一支笔。** 九笔严格首尾相接：方框、箭杆、箭头两笔、圆、箭杆、箭头两笔、方框，任何时刻画面上只有一条线在长。两个形状同时画，就没有“人”了，是一张图在做入场动画。\n2. **字跟着形状来，不等它画完。** 每个字在自己的形状画到 45% 时开始浮现。等形状画完再出字，节奏变成“画、停、字”，拖沓；字先于形状出现，线稿就成了给字描边。\n3. **提笔有长短。** 箭头的三笔之间只停 0.045 秒，换到下一个形状时停 0.09 秒。停顿全都一样长，读起来像打印机在逐段输出。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.85s | 第一个方框 | 从左上角偏右起笔顺时针一笔画完，最后一边冲过起点上方 | power2.out |\n| 0.55 → 0.81s | 第一个词 | 上移 14px 淡入 | power2.out |\n| 0.94 → 1.39s | 第一支箭头 | 箭杆 0.22s，箭头两笔各 0.07s | power2.out |\n| 1.48 → 1.98s | 圆 | 一笔画完，收笔越过起笔并落在内侧 | power2.out |\n| 1.71 → 1.97s | 第二个词 | 上移 14px 淡入 | power2.out |\n| 2.07 → 2.52s | 第二支箭头 | 同第一支 | power2.out |\n| 2.61 → 3.16s | 第二个方框 | 同第一个 | power2.out |\n| 2.86 → 3.12s | 第三个词 | 上移 14px 淡入 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| box 画方框时长 | 0.55s | 过 0.9s 观众在等笔走完 | 低于 0.35s 四条边糊成一下，看不出是画的 |\n| ring 画圆时长 | 0.50s | 同上 | 同上 |\n| shaft 箭杆时长 | 0.22s | 过 0.4s 箭头比形状还慢，喧宾夺主 | 低于 0.12s 箭头像是弹出来的 |\n| beat / rest 提笔停顿 | 0.045 / 0.09s | rest 过 0.3s 每一步之间断气 | 两个都是 0 时九笔连成一条线，没有换气 |\n| word 出字的进度点 | 0.45 | 接近 1 变成“画完才出字” | 0 时字和线同时起步，字抢在前面 |\n\n默认整张图宽 1600px、高 320px（方框 400×320，圆直径 320），形状的线中段粗 18px，箭杆 16px，字 80px。整张图画完要 2.9 秒。想对上更慢的旁白，把 `rest` 加大，不要把每一笔拉长。\n\n## 已知坑\n\n- 节点数是固定的三个，形状固定为方框、圆、方框。`items` 少写一项，那个形状还会画出来，只是里面空着。要四步以上请串两张，或者另做一张卡。\n- 方框的宽度是总宽的 25%，圆的直径等于 `h`。`w` 小于约 `3.5 × h` 时箭头的位置只剩几十像素，箭杆短到看不见。\n- 每个词超过 4 个汉字（80px）会顶到方框的边（方框宽 400px）。字多时减字，不要缩字号到 56px 以下。\n- 方框的起笔点和收笔点相距 35px 是故意的：蒙版描边宽 28px，靠得更近的话收笔那一段会在起笔时提前露出来。\n- 压在实拍上时（`backdrop: off`）字是浅色的，只靠一圈暗色阴影托着。底很亮的话把 `--mc-ink` 换成深色，或者在下面垫一块半透明暗底。\n\n## 动效与皮的边界\n\n属于这张卡的：同一时刻只画一笔、按阅读顺序画、字在形状画到一半时跟出来、提笔停顿有长有短。\n\n只是皮：线的颜色和粗细、形状不规整的程度、字的字体字号、三个形状具体是什么（都换成方框也成立）。\n\n## 接进片子\n\n- 变量：`items` 是三个词，用 `|` 隔开；`x / y / w / h` 是整张图占的区域，方框和圆都从这四个数算出来；`backdrop` 填 `off` 时透明，可以压在一张虚化的实拍上。\n- 时间：三个词的出现时间是 0.55、1.71、2.86 秒，旁白念到这三个词时分别对上。对不上就调 `rest`。\n- 音效：每一笔一声笔划音太吵，只在三个形状起笔时（0.30、1.48、2.61 秒）各放一声。\n- 常见接法：画完后用 `label-callout` 给其中一个节点加注，或者用 `circle-scribble` 圈出这一期要讲的那一步。"},{"id":"slab-title-slam","name":"厚底标题砸入","group":"标题与章节","type":"structure","intents":["hook","chapter"],"numbers":null,"chart":null,"one_line":"一块强调色厚底板从画面外加速冲进来撞停，标题字在它停住的那一帧才出现，底板带着字弹一下","use_when":"一期或一章的开头要一个不容商量的标题；旁白是短促的陈述句，重音落在标题最后一个字上","energy":"高","needs":["文"],"overlay":true,"slot":3,"hero":0.7,"sfx":"slam=impact, travel=whoosh","pairs_with":["word-punch","progress-rail"],"vars":[{"id":"title","type":"string","label":"标题（建议 4–8 个字）","default":"三步写好提示词"},{"id":"sub","type":"string","label":"底板下的一行说明（可空）","default":"照着做，十分钟上手"},{"id":"side","type":"enum","label":"底板从哪边砸进来","default":"left"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.47,0.54,0.7,2.6],"doc":"## 命门\n\n1. **到站时还在加速。** 底板 0.2 秒走完 2100px，缓动是 `power1.in`，没有任何减速段，位移在 0.50 秒那一帧直接归零。换成 ease-out 就读成“滑进来的横幅”，没有撞。\n2. **字不搭车。** 标题在底板移动期间完全不可见，0.50 秒停住时用 0.03 秒亮起。让字跟着底板一起飞进来，观众的眼睛会追字，撞击那一下就被稀释了。\n3. **撞完要有后果。** 停住后底板顶边继续前冲（倾角从 15° 甩到 -6.75°），整块前移 34px，再用弹性缓动回正。没有这一段，急停读成“卡帧”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.50s | 底板 | 从左侧 2100px 外冲到位，全程后仰 15° | power1.in |\n| 0.50 → 0.53s | 标题 | 透明度 0 → 1 | 线性 |\n| 0.50 → 0.70s | 标题 | 缩放 1.1 → 1 | power3.out |\n| 0.50 → 0.55s | 底板 / 底板+字 | 倾角 15° → -6.75°；整块前冲 34px | power2.out |\n| 0.55 → 0.97s | 底板 / 底板+字 | 倾角回 0；整块回原位 | elastic.out(1, 0.42) / elastic.out(1, 0.5) |\n| 0.76 → 1.11s | 说明行 | 上移 22px 淡入 | power3.out |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| travel 冲入时长 | 0.2s | 过 0.35s 看得清底板的形状，变成推拉门 | 低于 0.13s 在 30 帧下只剩 3 帧，看不到来路 |\n| lean 后仰角 | 15° | 过 22° 像斜体装饰，而且底板两头会多伸出 60px 以上 | 0° 时是一块平移的矩形，没有速度感 |\n| over 前冲距离 | 34px | 过 60px 像橡皮，底板显得轻 | 0 时撞击没有反作用 |\n| recoil 回弹时长 | 0.42s | 过 0.7s 晃得没完，标题难读 | 低于 0.25s 弹性看不出来 |\n| titlePop 字的起始倍数 | 1.1 | 过 1.25 字会顶出底板上下边 | 1.0 时字是“被点亮”，少了一点砸感 |\n\n## 已知坑\n\n- 厚底最初用的是黑色半透明投影，在深色底上完全看不见，底板就是一张薄片。现在的厚度是把强调色压暗 48% 画出来的 26px 实边；换浅色皮时这条边仍然成立。\n- 说明行离底板至少 78px。它上面压着 26px 的厚边，留少了说明行会贴在厚边下面。\n- 15° 的后仰让 300px 高的底板左右各多出约 40px。标题超过 9 个字时底板接近 1700px 宽，回弹那几帧会碰到画面边，先减字或把字号降到 132px。\n- 连拍是按 30 帧取整的：把时间点写成 0.52 实际拍到的是 0.50，正好是字还没亮的那一帧。看这张卡的字有没有准时出现，要取 0.54。\n- 标题的缩放和透明度是两条补间。合成一条的话，0.03 秒里缩放也走完了，字只是闪一下。\n\n## 动效与皮的边界\n\n属于这张卡的：加速冲入并硬停、标题晚于底板到站才出现、停后的前冲和弹性回正、冲入时的后仰。\n\n只是皮：底板颜色、圆角、厚边的深浅和高度，标题的字体字重，说明行有没有，从左还是从右进（`side`）。底板换成描边框也成立，但厚边要一起换成同色。\n\n## 接进片子\n\n- 变量：`title` 标题；`sub` 底板下的说明，传空字符串就不显示；`side` 填 `left` 或 `right`；`backdrop` 填 `off` 时透明压在画面上。\n- 对齐：这一镜的起点放在旁白说出标题最后一个字之前 0.5 秒，让 0.50 秒的撞停落在那个字上。\n- 音效：0.30 秒起一个短的掠过声，0.50 秒一记低频撞击，两者不要重叠超过 2 帧。\n- 连用：后面接 `progress-rail` 交代这一期分几段；一期里只在大章节开头用，连续两个标题都砸就不稀奇了。"},{"id":"slice-shutter","name":"百叶切","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜被切成几条横条（或竖条），从第一条到最后一条依次绕自己的中线翻成侧面消失，缝里露出下一镜","use_when":"一组并列的内容换到下一组（清单翻页、换一批例子），想要有节拍、带一点机械感的换镜","energy":"中","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"flip=tick","pairs_with":["rank-ladder","mosaic-assemble"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"axis","type":"enum","label":"条的方向","default":"rows"},{"id":"count","type":"number","label":"条数（3–12）","default":6},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.9,1,1.1,1.6],"doc":"这张卡**不是叠加层**：被切开翻走的是上一镜的画面本身，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **各条错开，但要重叠。** 每条翻 0.233 秒，相邻两条只差 0.033 秒，所以任何一帧都有三四条同时在翻，整体是一道波从上扫到下。错开得比单条时长还久，就成了一条翻完再翻下一条，像在数数，拖沓。\n2. **是翻，不是缩。** 条带着透视绕自己的中线转 90°，近的一边变宽、远的一边变窄，同时变暗到 45%。只做高度缩到 0，读成“压扁”，没有叶片的立体感。\n3. **越翻越快。** 单条用 power2.in：前一半时间只转了 22°，后一半甩过去。先快后慢的话，每条都会在接近侧面时拖出一条细线，整屏挂着几道线迟迟不走。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（一半的条已经翻走）。没有全遮。默认 6 条。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.8 → 1.033s | 第 1 条 | 绕中线翻 0° → 90°，亮度 1 → 0.45 | power2.in |\n| 每条晚 0.033s | 第 2–5 条 | 同上 | power2.in |\n| 0.967 → 1.2s | 第 6 条 | 同上 | power2.in |\n\n首尾两条的起点相差 0.167 秒，不随条数变；条数越多，相邻两条挨得越紧。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| count（变量） | 6 | 10–12 条细而密，像真的百叶窗，更轻 | 3–4 条每条很大，更重，接近翻板 |\n| flip 单条翻转时长 | 0.233s | 过 0.4s 像慢动作 | 低于 0.15s 看不出转，只是条在闪 |\n| span 首尾错开 | 0.167s | 过 0.35s 波太长，最后一条走的时候第一条早没了 | 0 是所有条一起翻，没有“依次” |\n| depth 透视距离 | 1500 | 3000 以上几乎没有近大远小，变成压扁 | 低于 800 条的梯形很夸张，像鱼眼 |\n| dim 翻到侧面时的亮度 | 0.45 | 1 时没有明暗，立体感减半 | 低于 0.2 条翻到一半就是黑条，脏 |\n\n## 已知坑\n\n- 每一条其实都是一整幅上一镜，只是被裁成一条。条数到 12 就是 12 幅整图叠着，渲染变慢但没问题；别再往上加。\n- 条数不能整除画面高度（比如 7 条）时，条和条之间按整像素取整并互相多盖 1px。自己改裁切的写法时别用百分比，会在静止时露出发丝一样的缝。\n- 上一镜的图是用背景图画的，不是图片标签。`from` 地址写错时这张卡不会报错，只是条全是空的，直接看到下一镜。\n- 横条从上往下翻，竖条从左往右翻。上一镜的重点在画面下方时，横条会让它最后才走，视线被拖住；这种情况用竖条。\n- 条翻到一半时，缝里露出的下一镜是静止的。下一镜自己的入场动作要等到卡内 1.2 秒以后再开始。\n\n## 动效与皮的边界\n\n属于这张卡的：切成等宽的条、绕各自中线带透视翻走、依次且重叠、越翻越快。\n\n只是皮：横条还是竖条、几条、翻的时候变多暗、透视强弱。把翻的方向反过来（朝观众翻还是背向观众翻）也只是皮。\n\n## 接进片子\n\n- 变量：`from`、`to`（地址从项目根目录写起），`axis`（rows 横条 / cols 竖条），`count` 条数，`backdrop`。\n- 对齐：这段自己占 2 秒，两镜的交界在卡内 1.0 秒。只取动的部分就是卡内 0.8 → 1.2 秒。\n- 音效：一串很轻的滴答，每条一下；或者整段只放一个 0.4 秒的“唰”。\n- 常见接法：上一镜是一张排行或清单，下一镜是下一张；条数和清单的行数一致时最顺。"},{"id":"slow-push","name":"慢推","group":"镜头运动","type":"metaphor","intents":["metaphor","result"],"numbers":null,"chart":null,"one_line":"整个画面从第一帧到最后一帧匀速向一个点推近 5%，不加速、不减速、不停，让一张静止的图一直“活着”","use_when":"旁白要在一张截图、一张照片上讲五秒以上，画面里没有别的东西在动","energy":"低","needs":["图"],"overlay":false,"slot":5,"hero":2.4,"sfx":"none","pairs_with":["crash-zoom","lower-third","highlighter-swipe"],"vars":[{"id":"src","type":"string","label":"画面地址（从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"fx","type":"number","label":"推向哪一点：横向 0–1","default":0.58},{"id":"fy","type":"number","label":"推向哪一点：纵向 0–1","default":0.4},{"id":"amount","type":"number","label":"整镜一共推近百分之几","default":5},{"id":"dur","type":"number","label":"这一镜多长（秒）","default":5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.1,1.2,2.4,3.6,4.8],"doc":"## 命门\n\n1. **幅度小到说不出来。** 整镜只放大 5%（1 → 1.05），1920 宽的画面最远的边一共才移动几十像素。超过 10% 观众会意识到“镜头在推”，开始等它推到哪儿去；这张卡要的是观众只觉得画面没死，说不出它在动。\n2. **线性，贯穿整镜。** 缓动是 `none`，时长等于这一镜的时长。加了缓入缓出，开头和结尾各有半秒是静止的，接上下一镜时读成“停了一下再切”；推到一半就到位，后半镜就成了一张死图。\n3. **朝着要讲的东西推。** 变形原点就是目标点（默认 0.58, 0.40），那一点在屏幕上不动，四周向外散。原点留在正中而要讲的东西在角落，它会被越推越靠边。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 5s（= `dur`） | 整个内容层 | 以 (fx, fy) 为原点，缩放 1 → 1.05 | none（线性） |\n\n只有这一个动作。内容层在缩放 1 时正好铺满 1920×1080，之后只会变大，所以任何一帧都不会露边。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| amount 推近幅度（变量） | 5% | 8% 以上能明确看出在推，适合“越说越近”的情绪段；过 12% 请换成有起止的推镜 | 3% 是下限，再小在压缩后的视频里等于没动 |\n| dur 时长（变量） | 5s | 同样的 5% 摊到 10 秒更隐蔽，适合长段口播 | 短于 3 秒时 5% 就显得快了，按每秒 1% 左右折算 |\n| fx / fy 目标点（变量） | 0.58 / 0.40 | — | 目标贴着画面边缘（小于 0.1 或大于 0.9）时，另一侧的内容被推出去得最多，先确认那边没有要读的字 |\n\n速度参考：每秒 1% 上下最稳。5 秒 5%、8 秒 6%、3 秒 3% 都是这个量级。\n\n## 已知坑\n\n- 连拍图上几乎看不出动：每格只有 384px 宽，5% 的总位移摊到相邻两格只有两三个像素。检查时比第一格和最后一格的边缘（左侧栏的宽度、右边徽章离边的距离），别指望中间三格有明显差别。这是这张卡该有的样子，不是没动。\n- `dur` 比这一镜短：推完之后画面停住，观众会在停的那一下察觉到之前一直在动。`dur` 填这一镜的真实时长，宁可略长。\n- 它不会把目标挪到画面中央：原点处的内容留在原位，只是周围放大。要“推过去并居中”用 crash-zoom 或 screen-push-focus。\n- 素材不是 16:9：内容层用 `object-fit: cover` 铺满，多出来的部分直接被裁掉，`fx / fy` 是按画面算的比例，不是按原图。\n- 满屏小字的截图：缩放一直停在非整数倍，细笔画会比静止时略糊。要读的小字多时把幅度降到 3%，或者不用这张卡。\n\n## 动效与皮的边界\n\n属于这张卡的：个位数百分比的幅度、线性、从头到尾不停、以目标点为原点。\n\n只是皮：推的是截图、照片还是一整个已经排好的画面；有没有实底；往里推还是往外拉（把 1 → 1.05 反过来就是慢拉，规则完全一样）。\n\n## 接进片子\n\n- 变量：`src` 画面地址（从项目根目录写起），`fx` / `fy` 推向的点（0–1 的比例，画面左上是 0,0），`amount` 一共推百分之几，`dur` 这一镜的秒数，`backdrop`。\n- 起始时间就是这一镜的起点，不用对旁白的词。\n- 音效：不配。给慢推配声音等于提醒观众镜头在动。\n- 连用：字幕、名条、荧光笔这类压在上面的卡照常叠；段落末尾接一次 crash-zoom，慢和急的反差最大。上下两镜都用慢推时，方向和幅度保持一致。"},{"id":"spark-metric","name":"指标带迷你线","group":"数据与图表","type":"structure","intents":["number","result"],"numbers":[1,2],"chart":"trend","one_line":"一张指标卡里，大数字先站住，涨跌箭头顺着自己的方向冲进来，最后一条迷你趋势线从左画到右、在终点点一个圆点","use_when":"旁白在报一个指标的现状和变化（现在是多少、比之前涨了还是跌了），需要一个像仪表盘上摘下来的小卡片","energy":"低","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"delta=pop, line=draw","pairs_with":["number-roll","line-draw-chart"],"vars":[{"id":"title","type":"string","label":"指标名","default":"本周处理完的工单（示例数据）"},{"id":"value","type":"string","label":"大数字","default":"1,284"},{"id":"delta","type":"string","label":"涨跌幅（以 - 开头算下跌）","default":"+24%"},{"id":"trend","type":"string","label":"迷你线的数值，用 | 分隔","default":"40|46|42|55|51|66|60|79|98|128"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.6,1,1.55,2.6],"doc":"## 命门\n\n1. **三样东西按“是多少 → 往哪走 → 怎么来的”的顺序到。** 数字 0.40 秒，箭头 0.80 秒，线 1.15 秒，各差 0.35 到 0.4 秒。一起出现的话，这就是一张静态截图，观众不知道先看哪。\n2. **箭头顺着自己的方向进场。** 上涨的箭头从下面 70px 往上冲并过冲，下跌的从上面往下落。箭头只是淡入的话，涨跌的方向要靠读颜色和符号才知道，慢半拍。\n3. **线最后画，并且以一个点收尾。** 线是对前两样的解释，所以排最后；终点的圆点弹出来，把视线带回右上角那个“现在”。线先画的话，数字出来时没人看了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.45s | 整张卡（1640px 宽，含 60px 的指标名） | 上移 40px 淡入 | power3.out |\n| 0.40 → 0.72s | 大数字（320px） | 上移 44px 淡入 | power3.out |\n| 0.80 → 1.14s | 箭头（110px） | 从下方 70px 冲到位（下跌时从上方落下），淡入 | back.out(2.6) |\n| 0.92 → 1.17s | 涨跌幅文字（120px） | 从左 16px 滑入并淡入 | power2.out |\n| 1.15 → 1.90s | 迷你线（1448×230px，线粗 14px） | 从左画到右 | power2.inOut |\n| 1.84 → 2.14s | 终点圆点 | 半径 0 → 22px | back.out(3.5) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| deltaAt − numAt 数字到箭头的间隔 | 0.4s | 过 0.8s 三样东西像三张卡 | 低于 0.2s 分不出先后 |\n| arrowTravel 箭头行程 | 70px | 过 130px 箭头会从数字那一行外面飞进来，太抢 | 低于 26px 看不出方向 |\n| arrowIn 箭头进场时长 | 0.34s | 过 0.6s 过冲变成慢悠悠的晃 | 低于 0.2s 过冲看不见 |\n| draw 画线时长 | 0.75s | 过 1.5s，这张卡就变成了折线图，该换 `line-draw-chart` | 低于 0.4s 线像是直接出现的 |\n| dotR 终点圆点半径 | 22px | 过 32px 像一个按钮 | 低于 12px 起不到收尾的作用 |\n\n## 已知坑\n\n- 迷你线的纵向是按“自己的最小值到最大值”撑满的，不是从 0 开始。它只表达走势的形状，不能拿来读数；所以线上不标任何数值，也不要给它加纵轴。\n- 线端是圆头，画线刚开始的那一帧左下角会先出现一个小圆点（长度为 0 的线只剩圆头）。它出现在线开始画的同一刻，不算穿帮；如果介意，把线端改成平头。\n- 涨跌的颜色：上涨用强调色，下跌用第二强调色。别直接套“红涨绿跌”或“绿涨红跌”，不同地区的习惯相反，而且“涨”不一定是好事（比如报错数）。\n- 卡片宽 1640px（画面的 85%），内容区 1448px。320px 的大数字每位约 185px，超过五位（含逗号）时会把箭头和涨跌幅挤出卡片右边；涨跌幅超过 4 个字符（如 `+124%`）时大数字最多四位。超长的数换算成“1.2 万”再填。\n- 透明模式压在录屏一角时，这张卡是按满屏设计的，直接缩小宿主片段（例如缩到 45%）即可，不要去改里面的字号。\n- 指标名里带了“示例数据”几个字，换成真数据时别忘了删。\n\n## 动效与皮的边界\n\n属于这张卡的：数字、箭头、线三者的先后顺序和间隔；箭头按涨跌方向进场并过冲；线最后画、以圆点收尾。\n\n只是皮：卡片的底色、圆角和阴影，有没有卡片这块底板，数字字号，箭头的造型，线的粗细，涨跌各用什么颜色。\n\n## 接进片子\n\n- 变量：`title` 指标名；`value` 大数字（当字符串填，自己带好千分位）；`delta` 涨跌幅，以 `-` 开头就按下跌处理（箭头朝下、换色、从上方落下），留空则不显示箭头；`trend` 迷你线的数值，用 `|` 分隔，8 到 12 个点最合适；`backdrop` 填 `off` 时只留卡片，可以压在录屏的一角。\n- 对齐：数字（0.40 秒）对旁白报出这个数，箭头（0.80 秒）对“涨了”“降了”那个词。\n- 音效：箭头到位一个轻的“啵”，画线时一个短的笔划声。两个都可以不放，这是一张安静的卡。\n- 想让数字滚上去，把这张卡的数字换成 `number-roll` 的做法；默认不滚，是为了让三样东西里只有一样在“动”。"},{"id":"split-host-content","name":"六四分屏","group":"人物与口播","type":"host","intents":["host","steps"],"numbers":null,"chart":null,"one_line":"一条强调色分界线先从上画到下，人的那 40% 和内容的那 60% 随后以线为起点向两边推开，人先开、内容晚 0.14 秒","use_when":"一段较长的讲解里，人和要点需要同屏停留十几秒以上，人负责语气，右边负责让观众记住","energy":"低","needs":["人","文"],"overlay":false,"slot":4,"hero":3.2,"sfx":"line=draw, open=whoosh","pairs_with":["host-side-board","host-to-chip","line-rise"],"vars":[{"id":"host","type":"string","label":"人物图地址（透明底，从项目根目录写起）","default":"motion-cards/lib/samples/presenter-bust.png"},{"id":"side","type":"enum","label":"人在哪一边","default":"left"},{"id":"share","type":"number","label":"人那一块占画面宽度（%）","default":40},{"id":"kicker","type":"string","label":"小标题（可空）","default":"第二步"},{"id":"title","type":"string","label":"标题（10 字以内）","default":"先搭框架，再填细节"},{"id":"points","type":"string","label":"要点，用 | 分开（最多 3 条）","default":"列出三个小标题|每个标题下写一句话"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.133,0.4,0.667,0.9,3.2],"doc":"## 命门\n\n1. **线先画。** 分界线 0.20 秒开始、0.56 秒画完，两边 0.52 秒才开始开。没有线先立住，两块内容是各自滑进来的，画面读成“左边一张图、右边一段字”；线先在，才是“一个画面被分成两块”。\n2. **都从线往外走。** 人的那块从贴线的一边向外擦开，人本身同时向外移 200px；文字从线边向外移 110px。从画面两侧往中间滑，方向正好反了，线就成了它们撞上去的墙。\n3. **人不到一半。** 人占 40%，内容占 60%。五五开时两边争主次；人低于 30% 时那一条里只剩半个肩膀，不如改用角标。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.56s | 分界线 | 从顶画到底 | power2.inOut |\n| 0.52 → 1.12s | 人的那一块（从画面边缘铺到分界线，整块面板色；人物宽 720px、高 900px） | 从贴线的边向外擦开 | power3.out |\n| 0.52 → 1.22s | 人物 | 从靠线的位置向外移 200px | power3.out |\n| 0.66s 起 | 小标题（56px）、标题（默认 110px）、各条要点（64px，每条高 112px） | 从线边向外移 110px 淡入，每行 0.5s，隔 0.1s | power3.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 画线时长 | 0.36s | 过 0.6s 观众在等，开场拖 | 低于 0.2s 线像是闪出来的 |\n| openAt 两边起开 | 线开始后 0.32s | 等线完全画完（0.36s 以后）再开，更庄重也更慢 | 低于 0.15s 线还没立住两边就动了 |\n| textLag 内容滞后 | 0.14s | 过 0.4s 像两个镜头 | 0 时两边完全对称，人不再是“先被看到的那个” |\n| hostPush 人的位移 | 200px | 过 320px 人像被甩出去 | 低于 80px 看不出是从线推开的 |\n| share（变量） | 40% | 50% 时标题会自动缩字才放得下 | 30% 时人物会自动缩小，只剩头和肩 |\n\n## 已知坑\n\n- 标题是单行的。内容区从分界线铺到画面另一边，宽度减去两侧 160px 留白后除以字数就是字号，上限 112px、下限 64px：默认 9 个字是 110px，10 个字 99px。`share` 调到 50% 且标题 10 个字时字号会落到 80px，低于 88px 的标准，这种组合要么把标题删到 9 个字以内，要么把 `share` 降回 45% 以下；再长就会顶到线。\n- 人的那一块是整块铺满的：靠画面的一边贴着画面边缘、另一边贴着分界线，上下通高。人物宽度取“720px”和“这一块的宽度减 48px”里小的那个，`share` 低于 40% 时人物会跟着变小。\n- 人物图是底边对齐、居中放在自己那一块里的。原图里人不在正中的（比如侧身、手伸出去），会有一边被分界线切掉，需要先在图里把人摆正。\n- 这张卡不适合透明压在别的画面上：它本身就是在切分整个画面。`backdrop: off` 只是去掉内容区的底色，人的那一块仍然有面板色。\n- 要点最多 3 条，每条 12 个字以内（64px 字，`share` 50% 时最多 11 个字）。再多就是一块白板，请换 `host-side-board`。\n- 分界线会一直留着。接下一镜时让线和两块一起退场，别只把线留在下一个画面上。\n\n## 动效与皮的边界\n\n属于这张卡的：线先画完；两边以线为起点向外打开、人先内容后；四六的比例。\n\n只是皮：线的颜色粗细、人那一块的底色、人身后的圆、内容区放的是字还是图、人在左还是右。\n\n## 接进片子\n\n- 变量：`host` 人物图；`side` 人在左还是右；`share` 人那一块占画面宽度的百分比（30–50）；`kicker` 小标题，可空；`title` 标题；`points` 要点，用 `|` 分开，最多 3 条；`backdrop`。\n- 开始时间：卡的 0.2 秒对齐这一段讲解的第一句。要点需要跟着旁白逐条出时，把脚本里的 `step` 从 0.1 改成每条念出的间隔。\n- 音效：0.2 秒画线一个笔划声，0.52 秒两边打开一个轻的掠过声。\n- 常见接法：这一段讲完后用 `host-to-chip` 把人收成角标，内容区放大成全屏。"},{"id":"split-title-reveal","name":"裂开露标题","group":"标题与章节","type":"structure","intents":["chapter","transition"],"numbers":null,"chart":null,"one_line":"一条亮线从画面中心向两边划开，画面沿这条线上下猛地裂出一道缝露出后面的标题，缝继续慢慢变宽，然后两半加速退出画面","use_when":"上一段内容结束、要翻到一个新话题；旁白有一个明显的转折词（“但是”“换个角度”“真正的问题是”）","energy":"高","needs":["文","图"],"overlay":true,"slot":4,"hero":1.5,"sfx":"score=draw, burst=impact, exit=whoosh","pairs_with":["slab-title-slam","kicker-headline"],"vars":[{"id":"title","type":"string","label":"标题（建议 4–8 个字）","default":"换一个思路试试"},{"id":"sub","type":"string","label":"两半退场后出现的一行（可空）","default":"同样的问题，倒过来问"},{"id":"src","type":"string","label":"被裂开的那张画面（从项目根目录写起）","default":"motion-cards/lib/samples/p5.jpg"},{"id":"gap","type":"number","label":"第一下裂开的缝高（px）","default":340},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.6,1.5,1.95,3.6],"doc":"## 命门\n\n1. **三段速度，不是一段。** 先 0.45 秒猛地裂开 340px 并刹住，再用 0.75 秒匀速多开 52px，最后 0.45 秒加速退出。一口气匀速拉开到底，就是一个普通的上下开门转场，标题在缝里没有被“端出来”的那一下。\n2. **中间那段不能停死。** 读标题的 0.75 秒里两半各自还在以每秒 35px 的速度后退，标题也在慢慢变大。完全静止的话，这一段看起来像视频卡住。\n3. **缝要比字高。** 第一下裂开的缝是 340px，标题字高 172px，上下各留 80px 以上。缝只比字高一点，字像被两块板夹着，而且亮边会贴到笔画。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.26 → 0.50s | 两条亮边 | 从画面中心向左右划满全宽 | power2.in |\n| 0.50 → 0.95s | 上半 / 下半 | 各退 170px，裂出 340px 的缝 | expo.out |\n| 0.50 → 0.95s | 标题 | 缩放 0.86 → 1 | expo.out |\n| 0.95 → 1.70s | 上半 / 下半 | 各再退 26px | 线性 |\n| 1.70 → 2.15s | 上半 / 下半 | 加速退出画面 | power3.in |\n| 0.95 → 2.15s | 标题 | 缩放 1 → 1.06 | power1.inOut |\n| 2.35 → 2.75s | 说明行 | 上移 24px 淡入 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| gap 第一下的缝高（变量） | 340px | 过 480px 第一下就露出大半个画面，后面没有余地 | 低于 260px 夹字 |\n| burst 裂开时长 | 0.45s | 过 0.7s 没有“裂”的力度 | 低于 0.25s 只看到结果 |\n| creep 读字时长 | 0.75s | 标题长就加，每多 3 个字加 0.3 秒 | 低于 0.4s 标题在缝里一闪而过 |\n| creepPx 读字期间每半再退 | 26px | 过 60px 分不清哪里是第二段、哪里是第三段 | 0 时中段冻住 |\n| score 划线时长 | 0.24s | 过 0.5s 预告太久，泄了劲 | 0 时没有预兆，裂开显得突然（可以接受，更硬） |\n\n## 已知坑\n\n- 第一版两条亮边一直是满宽的，合拢状态下画面正中就横着一条 16px 的黄线，第一帧不是一张完整的画面。现在亮边在裂开前 0.24 秒才从中心划出来，顺便成了裂开的预兆。\n- 两半最初各是一个 540px 高、带 `overflow: hidden` 的容器，里面放整张图。校验把图报成“超出裁切容器”。现在每一半是整幅 1920×1080 的图层，用 `clip-path` 只留自己那一半；别改回去。\n- 两半在样式里的静止位置是画面外（这是最终状态），合拢靠时间轴把它们移回来。所以不跑脚本看到的是只有标题的落定画面，这是有意的。\n- 标题在合拢阶段被两半完全盖住，校验会当成遮挡，标题和说明行上的 `data-layout-allow-occlusion` 要留着。\n- 裂缝固定在画面正中的水平线。被裂开的画面如果正中是人脸，会从脸上切过去；那种画面先换一帧，或者改用别的转场。\n\n## 动效与皮的边界\n\n属于这张卡的：沿一条水平线上下分开、爆开—缓开—退出的三段速度、标题在缝里随之由快到慢地变大。\n\n只是皮：被裂开的是什么画面（图、上一镜的定格、纯色块），亮边的颜色粗细、有没有，标题后面的底色，说明行。\n\n## 接进片子\n\n- 变量：`title` 标题；`sub` 两半退场后出现的说明，传空字符串不显示；`src` 被裂开的画面，通常填上一镜最后一帧的截图；`gap` 第一下的缝高；`backdrop` 填 `off` 时标题后面透明，直接露出下一镜。\n- 对齐：0.50 秒的裂开对在转折词上；上一镜的画面要和 `src` 那一帧对齐，这张卡的前 0.26 秒是静止的，正好盖住接缝。\n- 音效：0.26 秒一个短的划线声，0.50 秒一记撞击，1.70 秒两半退出时一个掠过声。\n- 连用：裂开之后标题已经在画面上，下一镜可以直接接正文；不要紧接着再用 `slab-title-slam`，两个重动作会互相抵消。"},{"id":"spotlight-dim","name":"聚光压暗","group":"证据与界面","type":"evidence","intents":["point","software"],"numbers":null,"chart":null,"one_line":"暗场从画面四边向里收，收成一个贴着目标的圆角亮窗并描上强调色边；讲到下一处时，亮窗整块滑过去并变成新的形状","use_when":"界面不需要放大，但要依次指两三个地方；或者要压在一段正在播放的录屏上指位置","energy":"低","needs":["界面"],"overlay":true,"slot":4,"hero":3.4,"sfx":"close=whoosh, hop=whoosh","pairs_with":["screen-push-focus","cursor-click","lower-third"],"vars":[{"id":"src","type":"string","label":"截图地址（1920×1080；底设为透明时不显示）","default":"motion-cards/lib/samples/ui.png"},{"id":"x","type":"number","label":"第一处：左","default":380},{"id":"y","type":"number","label":"第一处：上","default":370},{"id":"w","type":"number","label":"第一处：宽","default":1460},{"id":"h","type":"number","label":"第一处：高","default":122},{"id":"x2","type":"number","label":"第二处：左（宽填 0 就不移动）","default":1600},{"id":"y2","type":"number","label":"第二处：上","default":540},{"id":"w2","type":"number","label":"第二处：宽","default":222},{"id":"h2","type":"number","label":"第二处：高","default":86},{"id":"move","type":"number","label":"移到第二处的时间（秒）","default":2.1},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.75,1.6,2.4,3.4],"doc":"## 命门\n\n1. **暗是收进来的，不是淡进来的。** 亮窗一开始和画面一样大（等于没压暗），0.7 秒收到目标上。整屏淡暗再淡出一个洞，眼睛不知道往哪看；从四边收拢，视线是被暗场的边一路赶到目标上的。\n2. **亮窗里是原图。** 窗内不加滤镜、不提亮、不放大。动了窗里的东西，它就不再是“原界面的一部分”。\n3. **移动是一整块滑过去。** 位置和大小在同一条补间里一起变，矩形走的是直线插值。先淡出旧窗再淡入新窗，读成两个无关的高亮；分开动位置和大小，中途会鼓出一个比两头都大的怪形状。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.4s | 界面 | 原样静止 | — |\n| 0.4 → 1.1s | 亮窗（外面是 74% 的黑） | 从比画面大一圈收到第一处，圆角 0 → 18px | power3.inOut |\n| 1.0 → 1.25s | 强调色边（6px） | 淡入 | power1.out |\n| 2.1 → 2.7s | 亮窗 | 左、上、宽、高一起变到第二处 | power3.inOut |\n| 2.7s 之后 | 全部 | 停住 | — |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| close 收拢时长 | 0.7s | 过 1.1s 像舞台慢慢关灯，太隆重 | 低于 0.4s 看不出是“收”，像闪了一下 |\n| 压暗浓度（样式里） | 0.74 | 过 0.85 周围接近全黑，界面上下文没了 | 低于 0.55 窗外的字还读得清，聚不了光 |\n| hop 移动时长 | 0.6s | 过 0.9s 亮窗在路上停留太久，照到无关内容 | 低于 0.35s 像瞬移 |\n| move（变量）移动时刻 | 2.1s | — | 小于 1.5s 会被脚本抬到收拢结束后 0.4 秒 |\n| radius 圆角 | 18px | 过 40px 像胶囊，套不住方形区域 | 0 像裁剪框 |\n\n## 已知坑\n\n- 第一版把位置和大小拆成两条补间（位置先走、大小后跟），2.4 秒那一帧亮窗还是整行那么宽，却已经挪到了右边，一半伸出画面。合成一条补间后才对。\n- 亮窗外的暗是用一圈 2400px 的外扩阴影画的。亮窗很小又在角落时这一圈要盖得住对角；画面大于 1920×1080 时要跟着加大。\n- 亮窗收拢前要比画面大一圈（四边各出 30px），不然第一帧四个角能看到一条暗边。\n- 两处相距很远（比如左上到右下）时，亮窗途中会扫过大片无关区域。这种情况把 `hop` 压到 0.45 秒，或者中间切一刀。\n- 透明模式下它只负责压暗和亮窗，底下的录屏要自己停稳：录屏在滚动时亮窗对不住目标。\n\n## 动效与皮的边界\n\n属于这张卡的：从全画面收到目标的开场、窗内保持原样、位置和形状在一条补间里连续变化、到位后停住。\n\n只是皮：边线颜色和粗细（也可以不要边），圆角，压暗浓度和色调，亮窗的个数（脚本只做了两处，再多就接第二张卡）。\n\n## 接进片子\n\n- 变量：`x / y / w / h` 第一处；`x2 / y2 / w2 / h2` 第二处（`w2` 填 0 就只照一处）；`move` 移到第二处的时刻；`src` 示例截图；`backdrop` 填 `off` 时不显示截图，只留暗场和亮窗，直接压在录屏上。\n- 亮窗 1.1 秒收到位，对齐旁白第一个“这里”；`move` 对齐第二个指示词出现前 0.3 秒。\n- 音效：收拢和移动各配一个很轻的掠过声，或者不配。\n- 接法：需要放大看清时换 `screen-push-focus`；亮窗里要演示点击，叠一张 `cursor-click`（透明模式）。"},{"id":"stack-fan","name":"卡堆扇开","group":"图片与多素材","type":"evidence","intents":["categories","result"],"numbers":null,"chart":null,"one_line":"五张图先叠成一摞整体落下，停一拍，下面四张绕同一个支点向两边扇开，最上面一张最后落回并比别的大一号","use_when":"旁白先说“有这么几样”，再点出其中最重要的一样；手上有四五张同类的图，其中一张是主图","energy":"中","needs":["多图"],"overlay":true,"slot":3,"hero":2.6,"sfx":"land=impact, fan=whoosh, top=pop","pairs_with":["media-pop","grid-to-hero"],"vars":[{"id":"srcs","type":"string","label":"五张图的地址，用 | 分隔；最后一张是压在最上面的主图","default":"motion-cards/lib/samples/p2.jpg|motion-cards/lib/samples/p6.jpg|motion-cards/lib/samples/p4.jpg|motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p1.jpg"},{"id":"spread","type":"number","label":"最外侧一张扇开的角度（度）","default":16},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.7,1,1.2,2.6],"doc":"## 命门\n\n1. **先是一摞，再是五张。** 整叠作为一个物体落下（0.15 → 0.45s），坐稳以后隔 0.1 秒才扇开。落下和扇开叠在一起，观众看到的是五张图各飞各的，读成“散落”，不是“摊开给你看”。\n2. **同一个支点。** 下面四张都绕卡片中心正下方 1600px 的那一点转，像捏在手腕上的牌。各自绕自己的中心转就成了四张歪图排一排，没有“扇”的弧线。\n3. **主图最后到，而且更大。** 顶上一张在别人扇开时先抬起 28px 让路，1.3s 才落回并停在 1.12 倍。它和别的同时到位、同样大小，画面就没有主次，只是五张图。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.15 → 0.45s | 整叠 | 从上方 760px 落下，倾角 -5° → 0°，淡入 | power2.in |\n| 0.45 → 0.52s | 整叠 | 落地后下沉 16px | power1.out |\n| 0.52 → 0.76s | 整叠 | 回到原位 | back.out(3) |\n| 0.85 → 1.07s | 顶上一张 | 上抬 28px，放大到 1.03 | power2.out |\n| 0.85 → 1.35s | 最外两张 | 绕支点转到 ∓16°，压暗 0.3 | back.out(1.5) |\n| 0.92 → 1.42s | 里面两张 | 绕支点转到 ∓8°，压暗 0.3 | back.out(1.5) |\n| 1.30 → 1.64s | 顶上一张 | 落回原位，放大到 1.12 | back.out(2.2) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| spread 最外角度（变量） | 16° | 上限 18°，再大外侧两张的角会出画 | 低于 10° 里面两张只露一条窄边，看不出是图 |\n| fall 下落时长 | 0.3s | 过 0.45s 像飘下来，没有“一摞”的分量 | 低于 0.2s 看不到它是从上面来的 |\n| fanAt 扇开时刻 | 0.85s | 停太久（落地后超过 0.6s）像卡住了 | 早于 0.7s 会和落地回弹叠在一起，读成散落 |\n| innerLag 里层晚出 | 0.07s | 过 0.15s 变成两次动作 | 0 时四张同时走，扇面发硬 |\n| topScale 主图落定大小 | 1.12 | 过 1.2 会把里面两张完全盖住 | 1.0 就没有主次了 |\n| dim 背后四张压暗 | 0.3 | 过 0.5 背后的图只剩剪影 | 0 时五张一样亮，主图靠大小撑着 |\n\n## 已知坑\n\n- 最初是给四张卡设一个很远的 `transformOrigin` 来转，`verify` 报 `rotation_pivot_drift`（旋转元素的中心漂了 944px）。现在每张卡挂在一个零尺寸的“臂”上，臂放在支点处、绕自己的中心转，卡片本身不旋转，弧线一样，检查通过。\n- 里面两张落定后只露出约 180px 宽的一条。图的重点在正中间的，放在最外两张或主图的位置，别放里层。\n- `spread` 试到 20° 时左右两张的下角出了画面，所以脚本里把它夹在 18° 以内。要更开，先把卡片宽度 760px 改小。\n- 背后四张是用一层黑色蒙片压暗的，不是降透明度。透明压在实拍上时降透明度会让底下的画面透上来。\n- 图少于五张时空位仍然显示默认示例图；只有三张图请把里层两张的节点删掉，别留空。\n\n## 动效与皮的边界\n\n属于这张卡的：整叠先落、停一拍再扇开的两段式；共用一个远支点的弧线；外层先走里层晚 0.07s；主图抬起让路、最后落回并放大。\n\n只是皮：白边宽度、圆角、阴影，卡片的宽高比，压暗的深浅，一共四张还是五张，整叠在画面里的上下位置。\n\n## 接进片子\n\n- 变量：`srcs` 五张图用 `|` 分隔，顺序是外左、外右、内左、内右、主图（最后一张压在最上面）；`spread` 最外一张的角度；`backdrop`。\n- 开始时间对齐旁白说“这几样”的地方；想让主图落定（1.3s 起）卡在旁白点名主图的那个词上，就把卡的开始时间往前提 1.3 秒。\n- 音效：0.45s 落地一个闷的撞击，0.85s 扇开一个短的掠过声，1.3s 主图落回一个轻的弹出声。\n- 后面常接 `grid-to-hero`（从多张里挑一张放大）或 `media-pop`（单独再拿出一张）。"},{"id":"stamp-verdict","name":"盖章定论","group":"字与强调","type":"structure","intents":["caution","conclusion"],"numbers":null,"chart":null,"one_line":"一句话摆在画面上，接着一个带粗边框的结论词从镜头前斜着砸在它的右下角，整屏一震，章的外沿扩散出一圈印痕，原话随之变暗","use_when":"旁白对一个说法下最终判断（成立 / 不成立 / 过时了 / 已验证），语气是一锤定音","energy":"高","needs":["文"],"overlay":true,"slot":3,"hero":2.7,"sfx":"hit=impact","pairs_with":["strike-swap","scale-contrast"],"vars":[{"id":"claim","type":"string","label":"被下结论的那句话","default":"提示词越长，效果越好"},{"id":"verdict","type":"string","label":"章上的字（1–4 个字）","default":"不成立"},{"id":"hit","type":"number","label":"章盖下来的时间（秒）","default":1.1},{"id":"tilt","type":"number","label":"章的倾角（度）","default":-9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.8,1.2,1.27,1.4,2.7],"doc":"## 命门\n\n1. **一路加速到接触。** 章从 2.6 倍缩到 1 倍只用 0.15 秒，power3.in，最后一帧速度最快，然后戛然而止。任何带减速的缓动都会让它变成“贴纸飘落”，没有“盖”的力气。\n2. **接触之后有三件事同时发生。** 章本身凹到 0.93 倍再弹回、整屏上下震 12px 并衰减、一圈和章同形的线框向外扩到 1.5 倍并消失。只做缩放不做后面这些，章是悬在画面上的，没有盖在“纸”上。\n3. **斜的，而且转着下来。** 落定倾角 -9°，下落过程中从 -21° 转过来。摆正的框是一个按钮或标签；带倾角并且有旋转来路才是手盖的章。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 1.1s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 被下结论的那句话 | 上移 26px 淡入 | power3.out |\n| 0 → 0.15s | 章 | 透明 → 不透明，2.6 倍 → 1 倍，倾角 -21° → -9° | power3.in |\n| 0.15 → 0.21s | 章 | 缩到 0.93 倍 | power1.out |\n| 0.21 → 0.53s | 章 | 弹回 1 倍 | back.out(2.6) |\n| 0.15 → 0.35s | 整屏（那句话和章一起） | 纵向 +12、-7.2、+3.6、0 px | 线性 |\n| 0.15 → 0.40s | 那句话 | 透明度 1 → 0.42 | power1.out |\n| 0.15 → 0.70s | 印痕线框 | 1 倍 → 1.5 倍，透明度 0.75 → 0 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| from 章的起始倍数 | 2.6 | 过 4 起始帧章比画面还大，只看到一块色 | 低于 1.6 像原地放大的标签 |\n| slam 下落时长 | 0.15s | 过 0.3s 没有力量 | 低于 0.1s 在 30 帧的片子里只有两三帧，看不到来路 |\n| dent 接触时的凹陷 | 0.93 | 低于 0.85（凹得更深）像橡皮章 | 1 时落地发死 |\n| shakePx 整屏震幅 | 12px | 过 20px 像画面故障 | 0 时章和底下的内容没有关系；压在实拍上建议 6 |\n| ringTo / ringDur 印痕扩散 | 1.5 倍 / 0.55s | 过 2 倍像冲击波，偏夸张 | 低于 1.2 倍几乎看不见 |\n| dim 原话变暗到 | 0.42 | 0.7 以上原话和章抢视线 | 低于 0.25 原话看不清，观众忘了被否定的是什么 |\n| tilt 倾角（变量） | -9° | 超过 ±15° 章上的字难读 | 0 时不像章 |\n\n## 已知坑\n\n- 章如果盖在原话正上方，底下那几个字就被章的底色挡住了。第一版把章放在画面中心偏右下一点，结果盖住了原话的最后三个字；现在往右下挪到只压住原话的一个角。原话很长（14 个字以上）时章的位置要再往下。\n- 章有一层 82% 不透明的底色，为的是章上的字不和底下的字搅在一起。想要真印章那种透出底下文字的效果，可以去掉底色，但原话变暗的幅度要更大（0.25 左右）。\n- 章和原话是有意叠在一起的，HyperFrames 的检查会把它报成两段文字重叠；要在原话和章上的字这两个节点上各自标明允许重叠，标在外层容器上不起作用。\n- 印痕线框扩到 1.5 倍时比章大出一圈，章靠近画面边缘时线框会被画面裁掉。章离右边和下边至少留 150px。\n- 震动加在包着原话和章的那一层上，底色层不动；把底色层也放进去的话，震动时画面上下沿会露出一条缝。\n\n## 动效与皮的边界\n\n属于这张卡的：从镜头前加速落下、带旋转的来路和斜的落定、接触时的凹陷回弹、整屏衰减震动、和章同形的一圈扩散印痕、原话随之变暗。\n\n只是皮：章的颜色、边框粗细和圆角、单框还是双框、有没有底色、章上是字还是对勾叉号、被盖的是一句话还是一张图。\n\n## 接进片子\n\n- 变量：`claim` 被下结论的那句话；`verdict` 章上的字（1–4 个字）；`hit` 章开始落下的秒数；`tilt` 倾角；`backdrop` 填 `off` 时可以把章直接盖在截图或实拍上（这时 `claim` 留一个空格）。\n- 时间：章在 `hit` + 0.15 秒接触。把接触的那一帧对到旁白说出结论词的重音上，也就是 `hit` = 那个时刻 - 0.15。\n- 音效：接触那一帧一个闷而短的撞击声，可以叠一层很轻的纸张声。\n- 常见接法：前面用 `line-rise` 把这句话立住再盖章；只否定其中一个词时改用 `strike-swap`。一条片子里盖章不要超过两次。"},{"id":"stat-compare","name":"两数对比","group":"数据与图表","type":"structure","intents":["compare","number"],"numbers":[2,2],"chart":"compare","one_line":"左边的数字先到、带出一条长条，右边的数字后到、只带出一小截，两条从同一个起点用同一把尺画出来，最后倍数像盖章一样压在两个数字中间","use_when":"旁白在说“以前要多少，现在只要多少”或“A 是 B 的多少倍”，而且两个数差得足够悬殊","energy":"高","needs":["数据"],"overlay":true,"slot":3.5,"hero":3.2,"sfx":"a=whoosh, b=pop, verdict=impact","pairs_with":["big-stat-slab","bar-grow"],"vars":[{"id":"pair","type":"string","label":"两个数值，用 | 分隔（先左后右）","default":"52|4"},{"id":"unit","type":"string","label":"单位","default":"分钟"},{"id":"names","type":"string","label":"两边的名字，用 | 分隔","default":"从零手写一份周报|给够背景让 AI 起草"},{"id":"verdict","type":"string","label":"压在中间的结论（填 auto 自动算倍数）","default":"快 13 倍"},{"id":"note","type":"string","label":"来源小注（可空）","default":"示例数据"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.15,0.8,1.55,2.13,3.2],"doc":"## 命门\n\n1. **同一个起点、同一把尺、同一个速度。** 两条都从左边同一位置出发，按同一个比例换算长度，按每秒 2000px 的同一个速度生长。长条因此画了 0.8 秒，短条只有 0.12 秒。差距不只是看出来的，也是“等”出来的。各自缩放到好看的长度，对比就是假的。\n2. **先后出现。** 左边的数字和长条先演完（0.25 → 1.2 秒），右边才出现（1.35 秒）。同时出现的话，观众两个数都没读清就被结论盖住了。\n3. **结论最后压上来。** 倍数在短条画完后 0.55 秒才落下，从 1.8 倍加速缩到 1 倍，带 -4° 的倾角。它是观众自己比完之后的确认，先出就成了剧透。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.25 → 0.60s | 左边数字 + 名字 | 上移 36px 淡入 | power3.out |\n| 0.40 → 1.20s | 长条 | 宽度 0 → 1600px | power1.out |\n| 1.35 → 1.70s | 右边数字 + 名字 | 上移 36px 淡入 | power3.out |\n| 1.50 → 1.62s | 短条 | 宽度 0 → 123px | power1.out |\n| 2.02 → 2.17s | 结论牌 | 缩放 1.8 → 1，旋转 -12° → -4°，淡入 | power3.in |\n| 2.17 → 2.22s | 结论牌 | 压到 0.94 | power1.out |\n| 2.22 → 2.48s | 结论牌 | 弹回 1 | back.out(3) |\n| 2.37 → 2.67s | 来源小注 | 淡入 | 线性 |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| pxPerSec 条的生长速度 | 2000px/s | 两条都很快，时间上的差距被抹平 | 低于 1000，长条要画 1.6 秒以上，拖 |\n| atB 右边出现的时间 | 1.35s | 过 2s 中间出现空拍 | 小于长条画完的时间（1.2s）就会抢 |\n| stampLag 结论的延迟 | 0.55s | 过 1s 像忘了盖 | 低于 0.3s 观众还没比完 |\n| stampFrom 结论牌起始倍数 | 1.8 | 过 2.2 时半透明的大牌子会先糊住两边的数字（第一版就是 2.2，连拍里能看到） | 低于 1.5 没有“盖下来”的力度 |\n| tilt 结论牌倾角 | -4° | 超过 ±8° 显得轻佻 | 0 时像一个普通按钮 |\n\n## 已知坑\n\n- 两个数差距不到两倍时，两条看起来差不多长，这张卡就没有意义了。差距小的比较用 `bar-grow`，并且在结论里写差值而不是倍数。\n- 差距太大（超过 100 倍）时短条只剩十几像素，脚本给了 10px 的保底。这时短条已经不按比例了，要在小注里说明，或者换成 `unit-grid`。\n- 结论牌的位置是按“左右两个数字都不超过三位”留的，宽 500px。数字是四位数时两侧的数字块会伸进中间，被结论牌压住；先把数字换算成更大的单位。\n- 两边的颜色有含义：右边（后到的、要强调的）是强调色，左边是灰。如果要强调的是大的那个数，把它放在右边，让它后出场，而不是去改颜色。\n- 名字超过十个字会比数字块宽，左右两块的间隙变窄。名字写短。\n\n## 动效与皮的边界\n\n属于这张卡的：两条共用起点、比例和速度；左右先后出场；结论最后以加速下落的方式压在中间。\n\n只是皮：数字的字号、单位放右边还是下面、条的高度和圆角、结论牌的形状和倾角、谁用强调色、有没有来源小注。\n\n## 接进片子\n\n- 变量：`pair` 两个数值，先左后右，用 `|` 分隔；`unit` 共用的单位；`names` 两边的名字；`verdict` 压在中间的结论，填 `auto` 时脚本按“大数 ÷ 小数”取整写成“N 倍”（不到两倍时写差值），留空则不出结论牌；`note` 来源小注；`backdrop`。\n- 对齐：左边数字对旁白说出第一个数，右边数字（1.35 秒）对第二个数，结论牌落下（2.17 秒）对旁白说“快了多少倍”的重音。\n- 音效：长条生长配一个拉长的掠过声，短条一个“啵”，结论牌落下一个撞击声。\n- 示例数字是编的，画面上标了“示例数据”。"},{"id":"step-stack","name":"步骤叠出","group":"结构与流程","type":"structure","intents":["steps"],"numbers":null,"chart":null,"one_line":"旁白每说到一步，这一步的卡从下方升进前排，之前的卡同一拍被顶上去、缩小、变灰","use_when":"旁白按“第一步、第二步、第三步”往下讲，每一步只有一个短语，需要观众始终知道现在讲到第几步","energy":"中","needs":["文"],"overlay":true,"slot":4.2,"hero":3.9,"sfx":"step=whoosh","pairs_with":["chapter-numeral","checklist-tick"],"vars":[{"id":"items","type":"string","label":"步骤（用 | 分隔，2–5 条）","default":"明确目标|拆解任务|给出示例"},{"id":"cues","type":"string","label":"每一步出现的秒数（逗号分隔，不够就均匀排开）","default":"0.4,1.6,2.8"},{"id":"side","type":"enum","label":"整叠卡放在哪","default":"center"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.57,1.9,2.97,3.9],"doc":"## 命门\n\n1. **前排只有一张。** 当前这一步永远在最下面、原尺寸、白字、带强调色边框和实心序号；退后的卡缩到 0.8 / 0.7 倍、字变灰、边框和实心序号一起撤掉。只缩不灰，会读成“三张一样重要的卡排成一列”；只灰不缩，层次靠颜色硬撑，压在录屏上就分不出来。\n2. **新卡进和旧卡让是同一拍、同一条曲线。** 两个动作同起同止（0.5 秒、power3.out），看上去是新卡把旧卡顶上去的。旧卡先走、新卡后到，会读成“翻页”；而且同一条曲线保证两张卡在途中的间距始终不小于 18px，不会互相擦过。\n3. **这张卡没有连线，先后靠“位置”表达。** 越靠上越早。所以新卡只能从下方来；从侧面或上方进，“叠”的方向就乱了。\n\n## 动作拆解\n\n| 时间（相对这一步的 cue） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.5s | 新的步骤卡 | 从前排位置下方 260px 升到位，0.94 → 1 倍，淡入 | power3.out |\n| 0 → 0.5s | 之前的每张卡 | 各上移一层；刚退下来的缩到 0.8，再往上的停在 0.7 | power3.out |\n| 0 → 0.35s | 刚退下来的那张 | 字和序号变灰，强调色边框、实心序号淡出，换成灰色圆环 | power1.out |\n\n整叠卡每加一张都重新垂直居中，所以第一张卡单独出现时就在画面正中。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| levels 各层倍数 | 1 / 0.8 / 0.7 / 0.7 / 0.7 | 第二层超过 0.9，前排和后排拉不开 | 低于 0.64，后排的字小于 56px，手机上读不出 |\n| rise 新卡起点偏移 | 260px | 过 400 新卡飞得太远，像从画外扔进来 | 小于卡高 220 时，新卡一出现就压在旧卡上 |\n| move 移动时长 | 0.5s | 过 0.7 拖沓，跟不上一句一步的旁白 | 低于 0.3 看不出“顶上去”，只是跳了一下 |\n| dim 变灰时长 | 0.35s | 比 move 长时，卡已经停了颜色还在变 | 0.1 以下是硬切，显得闪 |\n| minGap 两步最小间隔 | 0.55s | — | 小于 move 时上一拍还没停下一拍就来了，卡会连着窜 |\n\n## 已知坑\n\n- 卡宽 1500px、高 220px、字 88px。五条时整叠高 930px，上下各只剩 75px；再加第六条一定出画，脚本直接截到五条。\n- 步骤文字超过 13 个汉字会自动缩字号（按 1200px 可用宽度估算），超过 21 个字就低于 56px 了，先把话缩短。`side` 为 `left` / `right` 时卡宽 800px，可用宽度只有 500px：5 个字以内保持 88px，8 个字缩到 62px，9 个字起就低于 56px。\n- 压在实拍上、又要让画面露出一半时，用 `side: left / right`，不要在宿主上给这张卡 `transform` 平移或缩小：1500px 的卡一平移就出画（序号最先被切掉），整体缩小连字一起变小。2026-10-19 的样片就是这样踩到的。\n- 估宽把英文和数字按 0.6 个汉字宽算，全大写的英文实际更宽，长英文步骤要自己再短一点。\n- 退后的卡不要再给不同的透明度：半透明的卡压在别的画面上会透出底下的内容，灰字就读不清了。现在靠缩小和换灰色字来退后。\n- `cues` 里两步靠得比 0.55 秒近，后一步会被自动推迟，画面就和旁白对不上了。这种密度的旁白应该换成一次列全的清单。\n\n## 动效与皮的边界\n\n属于这张卡的：新卡从下方升入前排、旧卡同拍同曲线上移一层并缩小、只有前排一张是亮的、整叠随张数重新居中。\n\n只是皮：卡的底色和圆角、序号是圆还是方、边框粗细、强调色、字体字重、阴影、整叠放在中间还是一侧。把序号换成图标也可以，只要退后时它跟着一起暗下去。\n\n## 接进片子\n\n- `items`：每步一个短语，用 `|` 分开，2–5 条，每条尽量 4–8 个字。\n- `cues`：每一步出现的秒数（相对这一镜的起点），对齐到旁白说出这一步名字的第一个字。只给了前几个，后面的按已有间隔往后排；一个都不给就从 0.4 秒起每 1.2 秒一步。\n- `side`：`center`（默认，卡宽 1500 居中）/ `left` / `right`（卡宽 800，离这一侧画面边 96px；退后的卡朝这一侧缩，这一侧的边保持对齐）。压在实拍上时，人或手在哪边，卡就放另一边。\n- `backdrop`：`off` 时没有底，可以压在录屏或实拍上（卡自带底板和阴影）。和 `side` 一起用时，在宿主里给卡这一侧的画面加一层渐变压暗，字更稳。\n- 音效：每个 cue 放一个轻的 whoosh 或 tick，落在 cue 后 0.1 秒左右（卡升到一半时）。\n- 接法：前面用 `chapter-numeral` 报“三步法”，这张卡逐步展开；讲完以后需要回顾，接 `checklist-tick` 把同样的条目逐条打勾。"},{"id":"strike-swap","name":"划掉换词","group":"字与强调","type":"structure","intents":["caution","compare"],"numbers":null,"chart":null,"one_line":"句尾的旧说法被一道斜线划掉，随即变小变淡沉到下一行，新说法趁它还在下沉就从上方落进它原来的位置","use_when":"旁白在纠正一个常见说法（“不是……而是……”“很多人以为……其实……”），而且新旧两个说法长度相近","energy":"中","needs":["文"],"overlay":true,"slot":3,"hero":2.7,"sfx":"strike=draw, land=pop","pairs_with":["line-rise","stamp-verdict"],"vars":[{"id":"lead","type":"string","label":"不变的前半句","default":"写提示词，靠的是"},{"id":"wrong","type":"string","label":"被划掉的旧说法","default":"套模板"},{"id":"right","type":"string","label":"顶替进来的新说法","default":"讲清楚"},{"id":"hit","type":"number","label":"划线的时间（秒）","default":1},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.7,1.12,1.4,1.56,2.7],"doc":"## 命门\n\n1. **先划，后走。** 划线 0.2 秒画完，再停 0.06 秒，旧词才开始下沉。划线和下沉同时发生的话，观众看不清被否定的是哪个词，只看到一团东西在动。\n2. **旧词留在画面里。** 它沉到新词正下方，缩到 0.56 倍、透明度 0.45，带着那道线一直待着。直接淡出消失，就成了普通的文字替换，“纠正”的意思丢了。\n3. **新词踩着旧词的尾巴进来。** 旧词下沉开始后 0.1 秒新词就出发，两个动作有 0.32 秒重叠，看起来是新词把旧词顶了下去。等旧词完全沉稳再进新词，位置会空一拍，像掉帧。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 1.0s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 整行（前半句 + 旧词） | 上移 26px 淡入 | power3.out |\n| 0 → 0.20s | 划线 | 从左端横向长出，全程倾斜 -4° | power3.inOut |\n| 0.26 → 0.68s | 旧词连同划线 | 从行内原位沉到下一行，缩到 0.56 倍，透明度 1 → 0.45，原点在左上角 | power3.inOut |\n| 0.36 → 0.50s | 新词（强调色） | 透明 → 不透明 | 线性 |\n| 0.36 → 0.76s | 新词 | 从上方 96px 落到行内 | back.out(2.2) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| strike 划线时长 | 0.2s | 过 0.4s 像在慢慢涂改，不果断 | 低于 0.12s 线像是凭空出现的 |\n| hold 划完后的停顿 | 0.06s | 过 0.3s 节奏断开，适合特别想让人看清旧词的时候 | 0 时划线和下沉粘在一起 |\n| sink 旧词下沉时长 | 0.42s | 过 0.7s 拖泥带水 | 低于 0.25s 旧词像被弹开 |\n| enter 新词相对下沉的延迟 | 0.1s | 等于 sink 时位置空一拍 | 0 时新旧两词在同一位置重叠一瞬，读不清 |\n| small / dim 旧词最终大小和透明度 | 0.56 / 0.45 | 过 0.75 和 0.7 时旧词抢新词的戏 | 低于 0.4 时小字不到 46px，看不清被否定的是什么 |\n| drop 新词下落高度 | 96px | 过 180px 像从天上掉下来 | 低于 40px 只是抖一下 |\n\n## 已知坑\n\n- 整行的宽度是按“前半句 + 新词”算的，旧词只是叠在这个位置上。旧词比新词长时，开场那一段整行会偏左、右边多出一截；差两个字以上就改文案，或者把长的那个放在新词。\n- 旧词在布局里本来就是下面那行小字，行内的大字状态是靠位移和放大“抬”上去的。所以别给旧词写 CSS 变换，也别改它的 `top: 100%`，否则抬上去的位置对不齐基线。\n- `small` 既是 CSS 字号（脚本会写进去），也决定抬升的距离和倍数，三处必须是同一个数；只在样式表里改字号会让旧词开场时大小不对。\n- 旧词和新词开场时占同一个位置，HyperFrames 的版式检查会把它当成文字互相遮挡；这是有意的，已经在这两个节点上标了允许遮挡。\n- 划线用的是强调色，新词也是强调色。换皮后如果强调色偏暗，划线压在白字上会不明显，可以单独把划线改成正文色。\n\n## 动效与皮的边界\n\n属于这张卡的：划线 → 停顿 → 下沉的先后顺序，旧词缩小变淡但留在画面里，新词从上方进入并且和下沉重叠。\n\n只是皮：划线的颜色粗细和倾角、新词的颜色、旧词停在下方还是上方、字号字重、前半句有多长。\n\n## 接进片子\n\n- 变量：`lead` 不变的前半句；`wrong` 旧说法；`right` 新说法（两者字数尽量接近）；`hit` 划线的秒数，对齐旁白说出“不是”“其实”这类转折词的时刻；`backdrop`。\n- 时间：新词在 `hit` + 0.76 秒停稳，旁白说新说法的时间应该落在 `hit` + 0.4 到 0.8 秒之间。\n- 音效：`hit` 一个短的划线声；新词落定（`hit` + 0.6 秒左右）一个轻的弹出声。\n- 常见接法：前一镜用 `line-rise` 或普通字幕把旧说法完整说一遍，这一镜再纠正；结论性更强、要整句否定时改用 `stamp-verdict`。"},{"id":"subscribe-cta","name":"行动号召","group":"人物与口播","type":"structure","intents":["outro"],"numbers":null,"chart":null,"one_line":"一行里的三样东西按阅读顺序先后到：图标跳一下并晃几下，一句话滑出，箭头自己画向按钮、按钮随后弹出；两秒后图标、箭头、按钮按同样的顺序再轻轻提醒一遍","use_when":"片尾或一段讲完的收口，需要一句明确的“接下来请你做什么”","energy":"中","needs":["文"],"overlay":true,"slot":4.5,"hero":4.2,"sfx":"icon=pop, arrow=draw, button=pop, again=tick","pairs_with":["follow-card","host-to-chip","word-punch"],"vars":[{"id":"icon","type":"enum","label":"图标","default":"bell"},{"id":"line","type":"string","label":"一句话（12 字以内）","default":"觉得有用，就点个关注"},{"id":"btn","type":"string","label":"按钮文字（4 字以内）","default":"关注"},{"id":"rowY","type":"number","label":"这一行的顶边位置（px）","default":430},{"id":"again","type":"number","label":"第二次提示的时间（秒）","default":2.7},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.467,1.1,2.867,4.2],"doc":"## 命门\n\n1. **从左到右，一样一样来。** 图标 0.30 秒、句子 0.60 秒、箭头 1.05 秒、按钮 1.30 秒。四样一起出现，观众的眼睛不知道先落哪儿；按阅读方向排开，视线会被一路带到按钮上。\n2. **箭头比按钮早。** 箭头先画过去，0.25 秒后按钮才在它指的地方弹出来。按钮先在、箭头后到，箭头只是在重复一件已经看见的事。\n3. **只提醒一次，而且更轻。** 2.70 秒的第二遍里，图标只跳 30px（第一次 40px），箭头前探 20px，按钮只鼓到 1.09 倍。再来第三遍、或者第二遍和第一遍一样大，就从“提醒”变成了“催”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.30 → 0.48s | 图标底圆 | 0 → 1，同时向上跳 40px | power3.out |\n| 0.48 → 0.93s | 图标底圆 | 落回，弹两下 | bounce.out |\n| 0.44 → 0.89s | 图标图形 | 绕顶部摆 16° / -12° / 8° / -4° / 0°，每段 0.09s | sine.inOut |\n| 0.60 → 1.00s | 句子 | 右移 36px 淡入 | power3.out |\n| 1.05 → 1.29s | 箭头的杆 | 从左画到右 | power2.out |\n| 1.21 → 1.41s | 箭头的头 | 接着画出 | power2.out |\n| 1.30 → 1.46s | 按钮 | 0 → 1.10（不透明） | power3.out |\n| 1.46 → 1.80s | 按钮 | 1.10 → 1 | back.out(2.8) |\n| 2.70 → 3.28s | 图标 | 再跳 30px 并落回，图形再摆一轮 | power2.out → bounce.out |\n| 2.88 → 3.36s | 箭头 | 向按钮探 20px 再回来 | power2.out → back.out(3) |\n| 3.06 → 3.58s | 按钮 | 鼓到 1.09 再回 1，外圈扩出一圈描边并淡出 | power2.out → back.out(3) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hop 图标跳的高度 | 40px | 过 70px 会跳出这一行、撞到上面的内容 | 低于 20px 看不出跳 |\n| textLag / arrowLag / btnLag | 0.3 / 0.75 / 1.0s | 整体拉长到 1.5 倍适合慢节奏的片尾 | 三者间隔都低于 0.15s 就成了一起出 |\n| step 第二遍的间隔 | 0.18s | 过 0.3s 三下互相不挨着 | 低于 0.1s 像整行抖了一下 |\n| again（变量） | 2.7s | 片尾停留越长设得越晚，但只提醒一次 | 低于 2.2s 会被自动推后，保证第一遍已经停稳 |\n| swing 摆动角度 | 16° 起 | 过 25° 铃铛像在甩 | 全 0 时图标只是跳，没有“响”的意思 |\n\n## 已知坑\n\n- 图标的摆动支点在图形顶部。直接给图形设一个偏上的变形原点会被检查报“转轴漂移”，所以图形挂在支点处一个零尺寸的节点上，转的是那个节点。换图标时保持这个结构。\n- 箭头两段在检查里曾被当成“两端没接上的连线”报警，原因是节点的类名里带了“箭头、杆”这类词。现在的类名避开了这些词，改类名时别改回去。\n- 按钮是深色字压在强调色上，不能用淡入：淡到一半对比度不够。它是不透明地从 0 弹出来的。\n- 尺寸：图标底圆 170px、句子 80px、箭头 192×72px、按钮高 140px（字 68px），这一行高 220px、默认顶边 430px（上下居中）。默认内容（10 个字 + 2 字按钮）整行宽约 1580px，是画面的 82%；句子 12 个字、按钮 4 个字时约 1850px，两边只剩 35px，已经是极限。再长会顶出画面，这一行没有自动换行，也不该换行。\n- 透明压在片尾画面上时，句子是直接压在画面上的浅色字。底下画面亮或者花的时候，给整行加一条半透明深色衬底。\n\n## 动效与皮的边界\n\n属于这张卡的：图标、句子、箭头、按钮按阅读顺序先后到；箭头先于按钮；隔两秒按同样顺序、更小的幅度提醒一次。\n\n只是皮：图标是铃铛、心还是星，图标底圆的颜色，按钮的形状和文字，箭头的画法，这一行放在画面的哪个高度。它不带任何平台的标志，按钮文字写什么由使用者决定。\n\n## 接进片子\n\n- 变量：`icon` 图标（铃铛 / 心 / 星）；`line` 一句话；`btn` 按钮文字；`rowY` 这一行的顶边位置（片尾常用 800 左右，行高 220px，最大 840）；`again` 第二次提醒的时间；`backdrop` 压在画面上填 `off`。\n- 开始时间：卡的 0.3 秒对齐旁白收尾句的开头，按钮弹出的 1.3 秒尽量落在“关注”“订阅”这个词上。\n- 音效：0.3 秒图标一个弹出声，1.05 秒箭头一个短的笔划声，1.3 秒按钮一个弹出声；2.7 秒第二遍只在图标上放一个很轻的滴答声。\n- 常见接法：这张卡停住后，上方叠一张 `follow-card` 演示点击；或者主持人用 `host-to-chip` 缩到角上，把中间让给这一行。"},{"id":"terminal-log","name":"终端日志","group":"证据与界面","type":"evidence","intents":["software","result"],"numbers":null,"chart":null,"one_line":"深色终端窗里，命令匀速逐字打出，停一拍回车，输出整行整行不等间隔地刷出来，最后一行先是灰的，三分之一秒后被强调色从左扫亮并打上勾","use_when":"要展示“跑了一条命令，它成功了”：安装、构建、导出、跑脚本，重点在最后的结果","energy":"中","needs":["文"],"overlay":true,"slot":4.5,"hero":3.2,"sfx":"typing=type, done=chime","pairs_with":["code-walk","input-typing","stamp-verdict"],"vars":[{"id":"cmd","type":"string","label":"命令","default":"build --target demo"},{"id":"out","type":"string","label":"输出行（用 | 分开，最多 5 行）","default":"读取配置 demo.config|编译 12 个模块|打包资源 3.2 MB|写入 dist/"},{"id":"done","type":"string","label":"最后一行成功状态","default":"完成 · 用时 1.8 秒（示例）"},{"id":"title","type":"string","label":"窗口标题","default":"终端 · 示例"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.9,1.85,2.4,3.2],"doc":"## 命门\n\n1. **命令是打出来的，输出是刷出来的。** 命令每秒 20 个字符逐字出现；输出一出现就是一整行。输出也逐字打，读成“有人在手敲日志”，机器感全没了。\n2. **回车前停一拍。** 最后一个字符到回车之间留 0.28 秒。没有这一拍，输出像是命令自己变出来的，少了“按下回车”这个动作。\n3. **结果晚一步变色。** 最后一行先以和其他输出一样的灰色落下，0.32 秒后才变色。一出现就是亮的，它只是又一行输出；先灰后亮，眼睛才会被那一下变化抓过去。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.35 → 1.3s | 命令（19 个字符） | 逐字出现，每秒 20 个；方块光标跟在后面 | 线性，取整 |\n| 1.58s | 光标 | 离开命令行（回车） | 瞬间 |\n| 1.70 / 1.77 / 1.93 / 1.99s | 四行输出 | 各自整行出现，间隔 0.12、0.07、0.16、0.06 秒 | 瞬间 |\n| 2.21s | 结果行 | 以灰色整行出现 | 瞬间 |\n| 2.53 → 2.89s | 结果行底色 | 14% 浓度的强调色从左铺到右 | power3.out |\n| 2.53 → 2.67s | 结果行文字 | 灰色变成强调色 | 线性 |\n| 2.57 → 2.83s | 勾 | 沿笔画描出 | power2.out |\n| 2.93s 起 | 新提示符 | 出现，光标闪 3 次后常亮 | 瞬间 |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| cps 打字速度 | 20 字符/秒 | 过 35 看不清在打什么 | 低于 12 一条命令要打两秒多，拖 |\n| beat 回车前停顿 | 0.28s | 过 0.6s 像打完忘了按 | 0 时没有回车的动作 |\n| gaps 输出间隔 | 0.12 / 0.07 / 0.16 / 0.06s | 每行过 0.3s 像卡顿的机器 | 全部相等时像幻灯片逐条出现，不像日志 |\n| turn 变色延迟 | 0.32s | 过 0.8s 观众以为已经结束了 | 0 时结果行不突出 |\n| 字号 / 行高（样式里） | 56px / 100px | 行数要跟着减 | 低于 40px 在手机上读不了 |\n\n## 已知坑\n\n- 结果行的变色，第一版是灰、亮两份文字叠在一起做交叉淡化，校验报 `content_overlap`（两块文字重叠）。现在只留一份文字，直接补间颜色。\n- 颜色补间的目标不能写 `var(--k-accent)`，GSAP 认不出。脚本在开头把 `--k-muted` 和 `--k-accent` 读成具体色值再用，所以换皮照样生效。\n- 命令文字是靠时间轴的 `onUpdate` 写进去的，建完时间轴要手动调一次，不然第一帧会显示整条命令。\n- 窗口是 1760×960（占画面宽的 92%），标题栏 100px，正文从 132px 起每行 100px，正好放 8 行：命令 1 行、输出最多 5 行、结果 1 行、末尾提示符 1 行，底下只剩 28px。想要更大的字就减输出行：64px 字、行高 116px 时输出最多 4 行。\n- 一行最多大约 50 个半角字符（中文算两个）。更长的行会被窗口右边裁掉，不会换行。\n\n## 动效与皮的边界\n\n属于这张卡的：命令逐字而输出整行、回车前的停顿、不等间隔的输出、结果行先灰后亮。\n\n只是皮：窗口标题栏的样式和三个圆点、提示符是 `$` 还是别的、字体、底色扫过的方向、勾的造型、末尾有没有新提示符。\n\n## 接进片子\n\n- 变量：`cmd` 命令；`out` 输出行，用 `|` 分开，最多 5 行；`done` 结果行文字（编出来的数字后面写“示例”）；`title` 窗口标题；`backdrop`。\n- 命令长度决定后面所有时刻：每多 10 个字符，回车和结果都晚 0.5 秒。默认命令下结果在 2.53 秒变色，把它对齐旁白里的“成功了”“跑完了”。\n- 音效：0.35–1.3 秒一段打字声，2.53 秒一个提示音。\n- 接法：前面接 `code-walk` 讲完代码再跑；后面可以接 `stamp-verdict` 盖一个结论。"},{"id":"tick-cross","name":"打勾打叉","group":"标注与手绘","type":"evidence","intents":["caution","compare"],"numbers":null,"chart":null,"one_line":"一列条目先全部摆好，然后从上到下每隔半秒在条目左边手画一个勾或一个叉，叉的两笔画完后那一条变淡","use_when":"旁白在逐条表态（这个做、那个别做；这条对、那条错），条目本身观众已经看到，重点是每一条的判决","energy":"中","needs":["文"],"overlay":true,"slot":4,"hero":3.4,"sfx":"tick=draw, cross=draw","pairs_with":["line-rise","stamp-verdict"],"vars":[{"id":"items","type":"string","label":"条目，用 | 隔开（留空则只画记号）","default":"先列提纲再动笔|想到哪里写到哪里|放一晚再改一遍|第一稿就要完美"},{"id":"marks","type":"string","label":"每条的记号：v 是勾，x 是叉，用逗号隔开","default":"v,x,v,x"},{"id":"x","type":"number","label":"第一个记号左上角 x（1920×1080 坐标）","default":380},{"id":"y","type":"number","label":"第一行顶边 y","default":100},{"id":"pitch","type":"number","label":"行距（像素）","default":220},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.567,1.167,1.767,3.4],"doc":"## 命门\n\n1. **勾和叉的速度曲线是反的。** 勾是一笔，0.26 秒，`power2.in`：先慢慢压下去，转过弯以后越甩越快，笔离纸时还在加速，线尾最细（6px）。叉是两笔，每笔 0.12 秒，`power2.out`：起笔最快，收笔刹住。两种记号用同一条曲线，勾会显得犹豫，或者叉显得轻飘。\n2. **变淡发生在叉画完之后。** 第二笔落定（起笔后 0.29 秒）那一帧条目才开始淡到 0.38。叉还没画完字就淡了，因果倒过来，像是字自己消失、叉是补上去的。\n3. **打勾的条目不动。** 勾画完后条目保持原样，不放大、不变色。给它也加动作，“被否掉的变淡”这个唯一的对比就被稀释了。\n\n## 动作拆解\n\n| 时间（默认四条：勾、叉、勾、叉） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.40s | 全部条目 | 已经在画面上，不动 | — |\n| 0.40 → 0.66s | 第 1 条的勾 | 短的下压接长的上挑，一笔 | power2.in |\n| 0.95 → 1.07s | 第 2 条的叉，第一笔 | 左上到右下 | power2.out |\n| 1.12 → 1.24s | 第 2 条的叉，第二笔 | 右上到左下 | power2.out |\n| 1.24 → 1.59s | 第 2 条的字 | 透明度 1 → 0.38 | power1.out |\n| 1.50 → 1.76s | 第 3 条的勾 | 同第 1 条 | power2.in |\n| 2.05 → 2.69s | 第 4 条的叉和字 | 同第 2 条 | 同上 |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| step 条与条的间隔 | 0.55s | 过 1s 可以逐条对旁白，但要确认旁白真有那么慢 | 低于 0.35s 上一条的字还没淡完下一条就开始，眼睛跟不上 |\n| tick 勾的时长 | 0.26s | 过 0.4s 像在描字 | 低于 0.16s 看不到那一下上挑 |\n| slash 叉每笔时长 | 0.12s | 过 0.2s 叉变得犹豫 | 低于 0.07s 30 帧下每笔只有两帧 |\n| lift 叉两笔之间的提笔 | 0.05s | 过 0.15s 像两个分开的斜杠 | 0 时两笔同时在画 |\n| dim 被叉掉后的透明度 | 0.38 | 过 0.6 看不出变淡 | 低于 0.25 字读不出来，观众不知道否掉的是什么 |\n| size 记号的边长 | 156px | 超过行距（220px）会压到上下行 | 低于字号（116px）的 0.9 倍显得小气 |\n\n## 已知坑\n\n- `marks` 的个数和 `items` 对不上：记号按行号对应。记号比条目多，多出来的会画在空行上；比条目少，后面的条目没有记号。\n- 字淡到 0.38 后在深色底上还读得出，压在亮的实拍上可能就看不清了。实拍上把 `dim` 提到 0.5。\n- 勾的下压段和上挑段在拐点处是个尖角，填色带在那里会有一个小小的凸起，看起来像笔尖顿了一下。这是想要的；嫌它重就把勾的中段粗细从 22 调到 16。\n- 条目太长：字是 116px，整列从 380px 起，记号占 236px，8 个字的一行宽 1164px（画面的六成）；一行最多放 11 个字（到 1892px）。超过 10 个字先减字，或者把字号和 `x` 一起改小。\n- 四行是 4 × 220 = 880px，从 100px 排到 980px。五行要把 `pitch` 收到 176、字号收到 96 左右，否则出画。\n- 只想在已有画面（比如录屏里的清单）上画记号：把 `items` 留空，用 `x / y / pitch` 把记号对到每一行左边。这时“变淡”做不了，因为字不是这张卡的。\n\n## 动效与皮的边界\n\n属于这张卡的：条目先在、记号后到；勾一笔越甩越快，叉两笔各自刹住；叉完之后条目才变淡；逐条有间隔。\n\n只是皮：记号的颜色和粗细、字体字号、条目数量、变淡到多少、记号在条目的左边还是右边。\n\n## 接进片子\n\n- 变量：`items` 是条目，用 `|` 隔开；`marks` 是每条的记号，`v` 勾、`x` 叉，用逗号隔开；`x / y` 是第一个记号的左上角；`pitch` 是行距；`backdrop` 填 `off` 时透明。\n- 时间：第 n 条的记号在 `0.4 + 0.55 × (n − 1)` 秒起笔。旁白逐条念的话，把 `step` 改成旁白每条的平均时长。\n- 音效：每个记号一声笔划音，叉可以用两声更短的。\n- 常见接法：条目可以先用别的卡逐行升起，等这张卡接手时条目已经停稳；最后的总判决再用一个印章类的卡。"},{"id":"tilt-page-3d","name":"三维倾斜页","group":"镜头运动","type":"evidence","intents":["software","result"],"numbers":null,"chart":null,"one_line":"一张长页面向后仰 54 度、斜着躺在画面里，镜头贴着它滑行 2.6 秒，滑到后半程页面立起来转正，和滑行同一帧停住","use_when":"要带观众“翻到”一篇长文、一份文档、一个长网页里的某一段，而且想先给出“这东西很长”的印象","energy":"中","needs":["网页"],"overlay":true,"slot":4,"hero":3.4,"sfx":"glide=whoosh","pairs_with":["page-scroll-park","highlighter-swipe","crash-zoom"],"vars":[{"id":"src","type":"string","label":"长页面图片地址（从项目根目录写起）","default":"motion-cards/lib/samples/page.png"},{"id":"ratio","type":"number","label":"页面的高宽比（高 ÷ 宽）","default":2.625},{"id":"fy","type":"number","label":"最后停在页面的哪里：纵向 0–1","default":0.41},{"id":"travel","type":"number","label":"滑行多远（页面上的像素，正数向页首方向飞）","default":1100},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,1.2,1.633,2,3.4],"doc":"## 命门\n\n1. **第一帧就在动。** 滑行用 `power2.out`，开场速度最大、一路减速到停。加了缓入，开头是一张静止的斜图，观众先看到的是“一张歪着的截图”，不是“镜头在飞”。\n2. **滑行发生在页面自己的平面里。** 位移加在页面上，倾斜加在它外面的那一层上。两样加在同一层，页面会沿屏幕的上下方向平移，看起来是一张斜图在屏幕上被拖动，没有纵深。\n3. **转正和滑行同时落地。** 转正从 1.2 秒开始、2.6 秒结束，滑行也在 2.6 秒结束。先滑完再转，是两个动作；先转正再滑，后半段就是普通的滚动页面。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 2.6s | 页面 | 沿自身方向滑 1100px，停在 `fy` 那一行对着画面中线的位置 | power2.out |\n| 0 → 1.2s | 支架（页面外层） | 保持后仰 54°、水平扭 −20°、放大 1.3 倍 | — |\n| 1.2 → 2.6s | 支架 | 后仰 54° → 0，扭转 −20° → 0，缩放 1.3 → 1 | power3.inOut |\n\n透视距离 2000px。页面宽 1300px（画面的 68%），高度 = 1300 × `ratio`。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| tiltX 后仰角 | 54° | 过 65° 页面压成一条带子，远处什么都认不出 | 低于 35° 透视感弱，像只是变窄了一点 |\n| tiltZ 水平扭转 | −20° | 过 ±35° 行文方向接近对角线，头晕 | 0 时是正对着的仰视，规整但呆板 |\n| zoom 倾斜时的放大 | 1.3 | 再大近处的字会冲出画面 | 低于 1.1 页面四周露出大片底色 |\n| travel 滑行距离（变量） | 1100px | 过 2000px 在 2.6 秒里太快，内容糊成条纹 | 低于 500px 看不出在滑 |\n| glide 滑行时长 | 2.6s | 配长旁白可以到 4 秒，转正的起点按比例后移 | 低于 1.8s 转正那一段会显得赶 |\n| perspective 透视距离 | 2000px | 过 3500px 接近正交，没有近大远小 | 低于 1200px 近处的边被夸张得很厉害 |\n\n## 已知坑\n\n- 脚本运行时图片还没加载，读不到它的真实高度，所以页面高度不能从图片上取。加了 `ratio` 变量（高 ÷ 宽，示例长页是 2.625），换图必须一起改，不然页面下半截是空白或者图被裁掉。\n- 滑行方向：`travel` 为正时内容朝观众这边流过来，相当于镜头向页首方向往前飞，所以开场看到的是目标**后面**的内容。想按阅读顺序从前往后带，填负数，那样内容是往远处退的，镜头相当于倒着走；示例只调过正数这一种，用负数时请自己看一遍连拍。\n- 停靠位置有上下限：目标行太靠近页首或页尾时不会居中，页面的上边或下边贴住画面边缘为止。`travel` 也受同样的限制，起点被挡住时实际滑行距离会比填的短。\n- 选帧：转正在 2.6 秒结束，但 `power3.inOut` 的最后 0.3 秒变化极小，2.3 秒那一格和落定格几乎一样。连拍的中间帧要取在 1.6–2.0 秒之间才看得到“正在立起来”。\n- 倾斜时页面和支架有一大半在画面外，单独跑检查时报过 `container_overflow` 和 `escaped_container`（合跑时采样点没碰上，没报）。包裹层上的 `data-layout-allow-overflow` 是为它加的。落定后页面两侧各留 310px 底色也是有意的：页面是放在空间里的一件东西，不是铺满的背景。\n\n## 动效与皮的边界\n\n属于这张卡的：倾斜放置的页面、沿页面平面的减速滑行、滑行后半程叠加的转正、两者同帧落定。\n\n只是皮：页面内容、页面圆角和阴影、底色的渐变、倾斜朝左还是朝右（把 −20° 换成 20°）。\n\n## 接进片子\n\n- 变量：`src` 长页面截图地址，`ratio` 这张图的高宽比，`fy` 最后停在页面纵向的哪里（0 是页首，1 是页尾），`travel` 滑行的像素数（正数向页首方向飞），`backdrop`。\n- 对旁白：这一镜的起点对齐“我们来看这篇……”，`fy` 那一段的内容在 2.6 秒落定，把旁白里点到具体段落的那个词放在 2.6 秒附近。\n- 音效：从 0 秒起一个 2 秒左右、逐渐减弱的掠过声，落定不加重音。\n- 连用：落定后直接接 highlighter-swipe 或圈重点的卡；要继续往下读，接 page-scroll-park，衔接前把两边页面的宽度和停靠位置对齐。"},{"id":"timeline-vertical","name":"竖时间线","group":"结构与流程","type":"structure","intents":["steps","process"],"numbers":null,"chart":null,"one_line":"一条竖线从上往下长，长到哪个节点，那个节点的圆点就亮起，文字从线里被推出来","use_when":"旁白按时间或阶段往下讲（第一天、第一周、第一个月；过去、现在、以后），每个阶段一个短语","energy":"中","needs":["文"],"overlay":false,"slot":4.4,"hero":4,"sfx":"node=tick","pairs_with":["step-stack","progress-rail"],"vars":[{"id":"items","type":"string","label":"节点文字（用 | 分隔，2–5 条）","default":"跑通一个例子|做成固定流程|交给别人也能用"},{"id":"tags","type":"string","label":"线左边的时间标签（用 | 分隔，可留空）","default":"第一天|第一周|第一个月"},{"id":"cues","type":"string","label":"每个节点亮起的秒数（逗号分隔，不够就均匀排开）","default":"0.5,1.7,2.9"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.15,0.6,1.5,3,4],"doc":"## 命门\n\n1. **线先到，字后出。** 线在 cue 之前的 0.5 秒开始长，正好在 cue 那一帧碰到节点，圆点这时才弹出，文字再晚 0.04 秒从线的位置被裁着推出来。线和字同时出现，会读成“一张带装饰线的列表”，时间在流动的感觉就没了。\n2. **当前节点带光晕、原尺寸白字；讲过的缩到 0.8 倍、变灰、光晕收掉。** 圆点也从 1.3 倍退到 0.8 倍。讲过的还是全亮，观众的眼睛会停在第一行不往下走。\n3. **没到的节点只有空心圆和淡线。** 让人看见“后面还有几站”，但不剧透文字。一开始就把字全摆出来，这条线就只是在给现成的列表描边。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.03 → 0.33s | 淡轨和全部空心圆 | 淡入到 30% / 45% | power1.out |\n| cue − 0.5 → cue | 强调色的线 | 从上一个节点长到这个节点（第一段从轨顶长起，时长不超过 cue − 0.1） | power2.inOut |\n| cue → +0.2s | 圆点 | 0 → 1.3 倍弹出，空心圆同时淡掉 | back.out(3) |\n| cue → +0.3s | 光晕 | 0 → 2.4 倍，30% 透明 | power2.out |\n| cue + 0.04 → +0.44s | 文字 | 从左裁到右露出，同时右移 70px | power3.out |\n| cue + 0.04 → +0.34s | 左侧时间标签 | 向线的方向滑 24px 淡入 | power3.out |\n| 下一个 cue → +0.35s | 上一条 | 文字缩到 0.8 倍变灰，圆点缩到 0.8 倍，光晕收掉，标签变灰 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| grow 线每段生长时长 | 0.5s | 过 0.8 线拖在旁白后面，像进度条 | 低于 0.25 线是“闪”过去的，看不出在长 |\n| pop 圆点弹出 | 0.2s | 过 0.35 圆点软绵绵 | 低于 0.12 只看到结果 |\n| push 文字推出 | 0.4s | 过 0.6 字出来得比旁白慢 | 低于 0.25 裁切的过程看不到，等于直接出现 |\n| past 讲过的倍数 | 0.8 | 0.9 以上主次拉不开 | 低于 0.7，四五条时讲过的字太小 |\n| fonts 各条数的字号 | 120 / 108 / 92 / 76（2 / 3 / 4 / 5 条） | 再大，三条七个字的一行就超过 1180px 的可用宽度，会被自动缩回来 | 五条时讲过的是 76 × 0.8 = 61px，再小就贴着 56px 的下限 |\n\n## 已知坑\n\n- 第一条的 cue 小于 0.4 秒，线没有时间长出来，脚本会把它抬到 0.4。这一镜的起点要比第一个词早半秒。\n- 文字的裁切和缩放要放在两层节点上：外层做裁切和位移，内层做缩放和变色。写在同一层，缩小时裁切框跟着缩，字的右边会被吃掉。\n- 文字从隐藏到露出这段，除了裁切还要把透明度设成 0：检查工具不认裁切，会把“藏着的字”当成和线重叠。\n- 整个图形（标签栏 + 节点 + 最宽的一条文字）由脚本按内容宽度居中。不填 `tags` 时没有标签栏，线的横坐标会跟着变，别在宿主里写死位置。\n- 线宽 8px，圆点 60px，左侧标签 60px。三条时每条超过 10 个汉字会自动缩字号（可用宽度 1180px），过长时讲过的那几条会小到读不清。一条只放一个短语。\n\n## 动效与皮的边界\n\n属于这张卡的：线先于文字到达节点、圆点在到达那一帧弹出、文字从线的一侧被推出、当前与讲过的大小和明暗差、未到节点的空心占位。\n\n只是皮：线的粗细和颜色、圆点换成方块或图标、光晕要不要、时间标签放左边还是不要、字体字重。横过来就是另一张卡（`flow-nodes`），不算换皮。\n\n## 接进片子\n\n- `items`：节点文字，`|` 分隔，2–5 条。`tags`：线左边的小标签（时间、阶段名），和 items 一一对应，可以整个留空。\n- `cues`：每个节点亮起的秒数，对齐到旁白说出这个阶段名的第一个字。线会提前 0.5 秒动身，所以相邻两个 cue 至少隔 0.6 秒。\n- `backdrop`：`off` 只留线和字，底下需要自己垫一层压暗的画面，直接压在亮的实拍上字会读不清。\n- 音效：每个 cue 一个 tick；线生长的那 0.5 秒可以垫一个很轻的 draw。\n- 接法：讲“先后”用这张，讲“步骤并列”用 `step-stack`；后面常接 `progress-rail` 把同一组阶段缩到角落当进度。"},{"id":"title-behind-subject","name":"字在主体后","group":"标题与章节","type":"structure","intents":["hook","chapter"],"numbers":null,"chart":null,"one_line":"大标题从画面主体的背后慢慢升上来，停下时下缘仍被主体的轮廓挡着，一行小字再压到最前面","use_when":"有一张主体轮廓清楚的图或定格画面（山脊、建筑、人物半身），想让标题长在画面里而不是贴在画面上","energy":"中","needs":["文","图"],"overlay":false,"slot":4,"hero":1.6,"sfx":"rise=rise","pairs_with":["chapter-numeral","lower-third"],"vars":[{"id":"title","type":"string","label":"大标题（2–5 个字）","default":"先看全局"},{"id":"sub","type":"string","label":"压在最前面的一行小字（可空）","default":"再决定从哪里下手"},{"id":"src","type":"string","label":"图片地址（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"cut","type":"string","label":"遮挡层的轮廓（CSS polygon 的点，1920×1080 坐标）","default":"75px 1080px, 672px 600px, 1185px 802px, 1920px 495px, 1920px 1080px"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.57,0.8,1.6,3.8],"doc":"## 命门\n\n1. **停下时还被挡着。** 标题落定后，下缘有 25–75px 留在主体后面。升到完全露出，前后关系就消失了，变成一行普通的叠字。\n2. **挡得不能多。** 被遮的部分不超过字高的四分之一，而且只挡下缘。挡到字的中段，观众认不出字。\n3. **落定后字和图不同步。** 图和遮挡层一起匀速放大到 1.06，标题落定后另外再向上漂 16px。两者的速度差就是纵深；一起静止，画面会塌成一张平面海报。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 4.0s | 底图 + 遮挡层 | 同步放大 1 → 1.06 | 线性 |\n| 0.35 → 0.55s | 标题 | 透明度 0 → 1 | 线性 |\n| 0.35 → 1.35s | 标题 | 从下方 400px 升到位 | power3.out |\n| 1.35 → 4.0s | 标题 | 继续上漂 16px | 线性 |\n| 1.25 → 1.70s | 最前面的小字 | 上移 26px 淡入 | power2.out |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| rise 升起时长 | 1.0s | 过 1.6s 像片尾字幕 | 低于 0.5s 字是蹿出来的，看不清它从后面来 |\n| from 起始下沉 | 400px | 更大没有意义，反正被挡着 | 低于字高（300px）时起始帧字就露头了 |\n| float 落定后上漂 | 16px | 过 40px 字会慢慢脱离遮挡 | 0 时落定后画面是平的 |\n| push 图的放大终点 | 1.06 | 过 1.12 轮廓移动明显，被挡的位置前后不一样 | 1.0 时全靠字的漂移撑纵深，偏弱 |\n| 标题行的 top（样式里） | 380px | 往下，挡得更多 | 往上，挡得更少，低于 340px 就挡不到了 |\n\n## 已知坑\n\n- 遮挡层是同一张图再叠一次，用 `clip-path` 只留主体那一块。轮廓点是按示例图的山脊量出来的（图铺满 1920×1080 之后的坐标），换图必须重量，否则字会被一块看不见的形状切掉。\n- 底图和遮挡层要用同一条补间放大。分开写两条、缓动差一点，轮廓边缘就会露出一条错位的缝。\n- 标题最初放在 top 404px，山尖把“看”字的左下角吃掉了一大块，字难认；抬到 380px 后最深处只挡约 75px。调位置时盯着被挡最多的那个字。\n- 校验把被挡的标题报成遮挡，标题上的 `data-layout-allow-occlusion` 是有意加的。\n- 接实拍时，把 `src` 换成抠好主体的透明 PNG、`cut` 填 `none`、`backdrop` 填 `off`，底下放原视频；主体在动的镜头不适用，轮廓会和字错开。\n\n## 动效与皮的边界\n\n属于这张卡的：三层的前后关系（底图、标题、主体）、标题从主体后面升起并停在仍被遮住下缘的位置、落定后字与图的速度差。\n\n只是皮：图的内容、亮度压多少，标题的字体颜色，最前面那行小字有没有、放在哪。升起方向可以改成从侧面滑出，只要仍然是“从主体背后出来”。\n\n## 接进片子\n\n- 变量：`title` 2–5 个字；`sub` 压在最前面的小字，传空字符串不显示；`src` 图片地址；`cut` 遮挡层轮廓的点；`backdrop` 填 `off` 时不画底图。\n- 对齐：标题 0.35 秒开始升，1.35 秒落定，把落定对在旁白说完标题的时刻。\n- 音效：升起全程一个 1 秒的上扬垫音，不要打击声。\n- 连用：适合做一期的开场画面，后面接 `lower-third` 介绍人物，或接 `chapter-numeral` 进入第一段。"},{"id":"title-to-corner","name":"标题退成角标","group":"标题与章节","type":"structure","intents":["chapter","categories"],"numbers":null,"chart":null,"one_line":"居中的大标题读完之后，同一行字缩小并沿一条弯路退到左上角，一根色条咔地立在它左边，正文随后占满腾出来的画面","use_when":"标题页之后紧接着要讲细节，又希望观众全程知道“现在在讲哪一段”；旁白从念标题过渡到“具体来说”","energy":"中","needs":["文"],"overlay":true,"slot":4,"hero":3.6,"sfx":"park=whoosh, bar=tick","pairs_with":["chapter-numeral","progress-rail"],"vars":[{"id":"title","type":"string","label":"标题（建议 4–8 个字）","default":"提示词三件套"},{"id":"points","type":"string","label":"腾出画面后进来的正文，用 | 分行（可空）","default":"目标：说清要什么|例子：给一个样板|检查：让它自己核对"},{"id":"park","type":"number","label":"标题开始退到角上的时间（秒）","default":1.2},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.9,1.4,1.55,1.75,3.6],"doc":"## 命门\n\n1. **是同一行字在走。** 角标就是刚才那个标题节点，从 3.1 倍缩回 1 倍、移到角上。做成“大标题淡出 + 角标淡入”，观众不会把两者认成同一个东西，角标就得重新读一遍。\n2. **路线是弯的。** 横向位移用 `power2.inOut`，纵向位移和缩放用 `power4.inOut`，标题先横着起步、中段才猛地上提。两个方向用同一条缓动，标题沿直线滑过去，像被拖走的图层。\n3. **正文等它让开。** 正文在标题动身 0.42 秒后才进，那时标题已经缩到 1.2 倍以内、离开了正文区。同时进，画面中央有 0.3 秒是两层字叠着。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.15 → 0.55s | 标题 | 在画面正中以 3.1 倍（约 161px 字高）上移 46px 淡入 | power3.out |\n| 1.20 → 1.82s | 标题 | 横向移到左上角 | power2.inOut |\n| 1.20 → 1.82s | 标题 | 纵向移到位，同时 3.1 倍缩到 1 倍（52px） | power4.inOut |\n| 1.62s 起，每行隔 0.12s | 正文各行（104px 字，整组在画面中部居中，行内左对齐） | 上移 34px 淡入，每行 0.4 秒 | power3.out |\n| 1.70 → 1.96s | 色条 | 从中间向上下长出 | back.out(2.6) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| park 开始退的时间（变量） | 1.2s | 标题越长越往后放，留够读完的时间 | 低于 0.55s 标题还没站稳就走，脚本会抬到 0.55 |\n| big 居中时的倍数 | 3.1 | 过 3.6 时 8 个字的标题会超出 1800px | 低于 2.4 居中阶段不像标题页 |\n| move 退场时长 | 0.62s | 过 1s 像在演示动画软件 | 低于 0.4s 眼睛跟不上，认不出是同一行字 |\n| bodyLag 正文滞后 | 0.42s | 过 0.8s 中间空一拍 | 低于 0.3s 和还没走开的标题叠在一起 |\n| barLag 色条滞后 | 0.5s | 晚于 `move` 就成了事后补的装饰 | 早于 0.3s 色条孤零零地先立在角上 |\n\n## 已知坑\n\n- 居中位置是脚本量出标题宽度后算出来的（用排版宽度，不受预览缩放影响）。在标题文字填好之后才能量；先量再改字，标题会偏到一边。\n- 标题节点按最终的 52px 排版，居中阶段靠放大 3.1 倍显示。给这个节点加 `will-change` 或强制 3D，大字会按 52px 的位图放大而发虚；补间里的 `force3D: false` 是为这个留的。\n- 进场和退场是同一个节点的前后两段，退场用 `to` 接。写成 `fromTo` 会在开头就把标题放到错误的位置。\n- 标题超过 8 个字时，3.1 倍下宽度超过 1300px，两侧留白不足 300px，居中阶段显得顶格。先减字，或把 `big` 降到 2.6。\n- 正文是 104px 字、每行 190px 高，整组在角标下方的区域（150–990px）里居中。最多放 4 行、每行最多 15 个字（含圆点约 1700px）；第 5 行会顶到角标和画面底边，要么减行，要么把字号降到 84px、行高降到 160px。这张卡的正文只是示意，真正的正文建议在宿主里另起一层。\n- 正文现在占的就是标题居中时站的位置，靠 `bodyLag` 错开：0.42 秒时标题已经上提到 180px 以上，第一行正文从 285px 起排。行数加到 4 行后第一行上移到 190px，`bodyLag` 不要再调小。\n\n## 动效与皮的边界\n\n属于这张卡的：同一个文字节点从居中大字变成角上小字、弯曲的路线、到位时色条的确认、正文晚于标题让位。\n\n只是皮：角标停在哪个角（改 `left`/`top` 即可），色条的形状颜色，正文是列表、图还是录屏，字体字重。\n\n## 接进片子\n\n- 变量：`title` 标题；`points` 正文各行，用 `|` 分开，传空字符串就只做标题退场；`park` 开始退的秒数；`backdrop` 填 `off` 时透明，角标可以一直压在后面的录屏上。\n- 对齐：`park` 对在旁白念完标题、开始说第一条内容之前 0.3 秒。\n- 音效：`park` 那一刻一个短的掠过声；色条立起（`park` + 0.5 秒）一下轻的滴答。\n- 连用：前面接 `chapter-numeral` 或 `slab-title-slam` 的标题页；角标留在画面上时，把这张卡的时长拉到整段，正文区交给别的卡。"},{"id":"tracking-settle","name":"字距收拢","group":"字与强调","type":"structure","intents":["chapter","keyword"],"numbers":null,"chart":null,"one_line":"标题以拉得很开的字距和一层虚化出现在原地，字与字向中间靠拢的同时逐渐变清楚，最后一段几乎是静止着收紧","use_when":"章节标题、片头主题句这类需要“沉下来”的时刻，旁白语速慢或者此处只有音乐","energy":"低","needs":["文"],"overlay":true,"slot":3,"hero":2.7,"sfx":"settle=rise","pairs_with":["line-rise","blur-resolve"],"vars":[{"id":"title","type":"string","label":"标题（一行）","default":"把复杂的事讲简单"},{"id":"kicker","type":"string","label":"标题上方的小字（可空）","default":"第二部分"},{"id":"wide","type":"number","label":"起始字距（em）","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.45,0.7,1,2.7],"doc":"## 命门\n\n1. **字距和清晰度走同一条曲线。** 两者在同一个补间里，同时开始、同时结束：字靠拢到哪一步，就清楚到哪一步。分开做（先收拢再变清，或者反过来）会读成两个特效接在一起。\n2. **长尾。** 1.3 秒，power3.out：前 0.4 秒完成七成的收拢，剩下 0.9 秒只在收最后那一点。尾巴砍短到 0.6 秒以内就是普通的入场动画，“落定”的沉稳感来自那段几乎不动的时间。\n3. **始终居中。** 字距是加在每个字右边的，最后一个字后面也有一份，不处理的话整行会在收拢过程中从偏左滑向中间。这里用一个和字距等量的负右边距同步抵消。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.50s | 标题上方的小字 | 淡入 | power2.out |\n| 0.30 → 0.85s | 标题 | 透明 → 不透明 | power1.out |\n| 0.30 → 1.60s | 标题 | 字距 0.5em → 0.04em，右边距同步从 -0.5em 到 -0.04em，虚化 18px → 0 | power3.out |\n\n没有位移，没有缩放。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| settle 收拢时长 | 1.3s | 过 2s 适合片头，正文里会拖 | 低于 0.7s 失去长尾，变成一个快速的挤压 |\n| wide 起始字距（变量） | 0.5em | 过 0.8em 开头是散开的单字，认不出是一句话；脚本会按字数封顶，保证不超出画面 | 低于 0.2em 看不出在收 |\n| tight 落定字距 | 0.04em | 过 0.12em 标题显得松 | 0 时粗体汉字会挤在一起 |\n| soft 起始虚化 | 18px | 过 30px 开头只是一片灰雾 | 0 时只剩字距动画，偏硬、偏“设计感” |\n| fade 淡入时长 | 0.55s | 接近 settle 时前半段太暗，看不到最宽的那几帧 | 低于 0.2s 最虚的那一帧会突然跳出来 |\n\n## 已知坑\n\n- 字越多，能用的起始字距越小：140px 字号、8 个字时最多 0.53em，10 个字只剩 0.23em，效果就很弱了。标题控制在 4–8 个字；更长的标题先减字号（同时改脚本里那个 140）。\n- 字距动画每一帧都在重新排版，字的位置是按整像素对齐的，在最后那段很慢的长尾里，个别字可能看起来一格一格地挪。虚化在这段还剩一点，正好盖住；所以别让虚化比字距先结束。\n- 虚化的边缘会向外扩散 18px 左右。标题贴着别的元素时，开头几帧虚边会漫到邻居身上；上下至少留 40px。\n- 透明模式压在实拍上时，虚化的白字在亮背景上几乎看不见，只在最后才冒出来，等于没有前半段。实拍上用这张卡要先压暗背景。\n- 标题上方的小字自己带着 0.32em 的固定字距，同样用负右边距抵消过；改它的字距时两处一起改。\n\n## 动效与皮的边界\n\n属于这张卡的：字距从宽到正常、虚化同步消退、长尾缓动、全程居中且没有位移和缩放。\n\n只是皮：标题上方有没有小字、小字的内容和颜色、字号字重、落定后的字距、要不要在落定时加一条细线。\n\n## 接进片子\n\n- 变量：`title` 标题；`kicker` 标题上方的小字（章节号之类，留空就不显示）；`wide` 起始字距；`backdrop`。\n- 时间：标题在 0.3 秒开始出现，0.8 秒左右已经可读，1.6 秒完全落定。旁白念标题的话，从 0.5 秒开始念；这一镜至少留 2.5 秒，落定后的静止也是动作的一部分。\n- 音效：一个 1 秒左右、由虚到实的上扬垫音，在 1.6 秒收住；不要用撞击声。\n- 常见接法：章节开头单独用；之后正文用 `line-rise`。和 `blur-resolve` 气质接近，同一条片子里选一个当标题动法即可。"},{"id":"triptych-relay","name":"三联接力","group":"图片与多素材","type":"evidence","intents":["steps","compare"],"numbers":null,"chart":null,"one_line":"三张竖裁的图并排，旁白讲到哪一格，那一格就在 0.5 秒里变宽变亮、底部进度条开始走，另外两格同时收窄变暗","use_when":"一段旁白连着讲三个并列或先后的东西（三个步骤、三个例子、三种方案），每个讲一两秒，而且希望三个一直都在画面里","energy":"中","needs":["多图","文"],"overlay":true,"slot":5,"hero":2.6,"sfx":"pass1=whoosh, pass2=whoosh, pass3=whoosh","pairs_with":["chapter-numeral","progress-rail","lower-third"],"vars":[{"id":"srcs","type":"string","label":"三张图的地址，用 | 分隔，按接棒顺序","default":"motion-cards/lib/samples/p5.jpg|motion-cards/lib/samples/p1.jpg|motion-cards/lib/samples/p3.jpg"},{"id":"labels","type":"string","label":"三格的标签，用 | 分隔（每个不超过 6 个字）","default":"写提示词|看结果|改一轮"},{"id":"beats","type":"string","label":"三次接棒的时刻（秒），用 | 分隔，对齐旁白","default":"0.7|2.0|3.3"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.95,2.25,2.6,4.7],"doc":"## 命门\n\n1. **总宽不变。** 宽的一格 1000px、窄的两格各 376px，加起来和三格等宽时一样是 1752px；三格的宽度用同一个缓动、同一个时刻、同一个时长变化。任何一格错开，整排的左右边缘就会抖，读成版式出错。\n2. **图不缩放，窗口在开合。** 图固定是 1440×900，格子只是它上面的一个窗口。跟着格子一起缩放的话，变宽的那格图在放大、变窄的在缩小，三张图同时在动，眼睛没处落。\n3. **进度条就是接力棒。** 当前格底部的黄条匀速走满，走满的那一刻正好交给下一格。没有它，观众不知道这一格还要停多久，交接来得很突然。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.66s | 三格 | 依次（间隔 0.08s）上移 70px 淡入，三格等宽 584px、都是暗的 | power3.out |\n| 0.70 → 1.20s | 三格宽度 | 第 1 格 584 → 1000，另两格 584 → 376 | power3.inOut |\n| 0.80 → 1.10s | 第 1 格蒙片 | 0.6 → 0（变亮） | power2.out |\n| 0.70 → 2.00s | 第 1 格进度条和图 | 黄条走满；图缓慢推近到 1.05 | 线性 |\n| 2.00 → 2.50s | 三格宽度 | 第 1 格收到 376，第 2 格开到 1000；第 1 格变暗、图退回 1 | power3.inOut |\n| 2.00 → 3.30s | 第 2 格 | 同第 1 格 | 线性 |\n| 3.30 → 3.80s | 三格宽度 | 第 2 格收窄，第 3 格开到 1000 | power3.inOut |\n| 3.30 → 4.60s | 第 3 格 | 黄条走满，停在这里 | 线性 |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| beats 三次接棒时刻（变量） | 0.7 / 2.0 / 3.3 | 每格超过 3 秒建议换成单张图的卡 | 两次接棒间隔小于 0.6s，前一次开合还没完下一次就开始了 |\n| swap 开合时长 | 0.5s | 过 0.8s 整排一直在动，没有停稳的时候 | 低于 0.3s 像硬切 |\n| wide / narrow 宽窄 | 1000 / 376 | 宽格过 1150 窄格只剩 300，标签放不下四个字 | 宽格低于 800 主次不明显 |\n| dim 非当前格压暗 | 0.6 | 过 0.8 另外两格等于消失 | 低于 0.35 三格一样亮，看不出轮到谁 |\n| push 当前图推近 | 1.05 | 过 1.12 能明显看出图在放大，分散注意 | 1.0 当前格停住时是一张死图 |\n| tail 最后一格停留 | 1.3s | — | 低于 0.8s 第三格没讲完就走了 |\n\n## 已知坑\n\n- 最初图是一张比格子宽的 `\u003cimg>`，居中放在格子里靠 `overflow: hidden` 裁。`verify` 报了 `container_overflow`（左右各溢出 532px）和 `escaped_container`。现在图是格子里一层 `background-image`，尺寸固定 1440×900、居中，没有溢出的节点。\n- 因为是背景图，`srcs` 里的地址会被拼进 `url(\"…\")`。地址里有引号或括号会断，文件名用普通字符。\n- 标签在窄格里可用宽度是 312px，52px 的字最多 6 个。再长会被格子边缘切掉，没有自动换行。\n- 图的重点要在横向正中间：窄格只露出图中间 376px 宽的一条（约四分之一），重点偏在一侧的图在窄的时候看不到主体。\n- `beats` 填少了（比如只填两个），缺的那次会按“上一次加 1.3 秒”补上；填的不是数字也按这个规则补。\n\n## 动效与皮的边界\n\n属于这张卡的：三格总宽守恒的同步开合、图不动窗口动、当前格亮其余暗、进度条走满即交棒、当前图的缓慢推近。\n\n只是皮：标签的字体字号和位置、有没有编号、进度条的颜色粗细和在上还是在下、圆角、格子间距、压暗的深浅。\n\n## 接进片子\n\n- 变量：`srcs` 三张图，用 `|` 分隔，按讲的顺序；`labels` 三个标签，用 `|` 分隔，每个不超过 6 个字；`beats` 三次接棒的时刻（卡内秒数）；`backdrop`。\n- 每个 `beats` 值对上旁白开始讲这一项的那个词。最后一格的停留时间是 `CFG.tail`，旁白第三项讲得长就加大它，并把 `slot` 设成“第三个 beat + tail + 0.4”。\n- 音效：每次接棒一个短的掠过声，三次音高可以依次升一点。\n- 前面常接 `chapter-numeral` 报章节；和 `progress-rail` 同屏时二选一，两条进度会打架。"},{"id":"typewriter-line","name":"打字机","group":"字与强调","type":"structure","intents":["question","keyword"],"numbers":null,"chart":null,"one_line":"一行字跟着一根强调色光标逐字打出来，遇到标点停一口气，打完以后光标原地闪两下","use_when":"画面在模拟“正在输入”（提示词、搜索词、一条消息、一句命令），或者想让观众按阅读速度一个字一个字跟着读","energy":"低","needs":["文"],"overlay":true,"slot":4,"hero":3.8,"sfx":"key=type","pairs_with":["retype-fix","highlighter-swipe"],"vars":[{"id":"text","type":"string","label":"要打出的一行字","default":"先别急着写代码，把需求说清楚。"},{"id":"step","type":"number","label":"每个字的平均间隔（秒）","default":0.075},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.7,1.2,1.9,3.8],"doc":"## 命门\n\n1. **字是“出现”的，不是“淡入”的。** 每个字在自己的时刻从不可见直接变成可见，没有任何过渡。给字加淡入或位移，打字机的机械感就没了，变成逐字浮现的字幕。\n2. **节奏不匀，标点有停顿。** 字间隔在 0.049–0.101 秒之间按固定的正弦起伏，句中标点后多停 0.34 秒。间隔完全相等读起来是机器在吐字；标点处不停，观众会觉得这句话没有断句。\n3. **光标一直贴着最后一个字。** 打字过程中光标常亮并紧跟行尾，只在打完以后才闪。打字时也让光标闪，会出现“字在走、光标不见了”的帧。\n\n## 动作拆解\n\n以默认文案（15 个字，含句中一个逗号）为例：\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.40s | 光标 | 停在行首，常亮 | — |\n| 0.40 → 0.90s | 前 8 个字（到逗号） | 逐个出现，间隔 0.05–0.10s，光标跟到最新一个字的右边 | 无（瞬时） |\n| 0.90 → 1.34s | 光标 | 逗号后停 0.34s（加一个正常间隔） | — |\n| 1.34 → 1.79s | 后 7 个字 | 逐个出现 | 无（瞬时） |\n| 2.29 / 2.74 / 3.19 / 3.64s | 光标 | 灭、亮、灭、亮，每半拍 0.45s，最后停在亮 | 无（瞬时） |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| step 平均字间隔（变量） | 0.075s | 过 0.14s 像新手一指禅，适合特意强调每个字 | 低于 0.045s 是粘贴，看不出在打 |\n| jitter 间隔起伏 | 0.35 | 过 0.6 忽快忽慢，像卡顿 | 0 就是匀速吐字 |\n| pause 标点后的停顿 | 0.34s | 过 0.6s 像打字的人走神了 | 0 时长句没有断句 |\n| at 第一个字的时间 | 0.4s | — | 0 时看不到“光标先在、字后来”这一拍 |\n| blink / blinks 光标闪烁半周期和次数 | 0.45s / 2 | 次数多了要相应加长这一镜 | 0 次时光标打完就不动，也成立 |\n\n## 已知坑\n\n- 所有字从一开始就排好了版，只是不可见，所以这一行始终居中、不会随着打字往左挪。代价是第一帧光标在偏左的行首，不在画面中间；要让光标从正中开始，得把整行改成左对齐。\n- 每个字都自带一根光标，时间轴只是切换哪一根亮。别把光标改成单独一个节点再去算它的位置：挂进 HyperFrames 时脚本运行那一刻量到的宽度不可靠。\n- 第一次取连拍图时，3.6 秒那一帧正好落在光标“灭”的半拍里，落定画面看起来像没有光标。挑缩略图和收尾帧时要避开灭的时段（默认文案是 2.29–2.74 秒和 3.19–3.64 秒）。\n- 换文案后总时长会变：大约是 0.4 + 字数 × 0.075 + 句中标点数 × 0.34 秒，再加闪烁的 1.8 秒。20 个字以上要把这一镜加长，或者把 `blinks` 改成 1。\n- 一行放不下时不会自动换行（整行是不换行的）。100px 字号下最多 16 个全角字；更长的句子拆成两镜，或者改小字号。\n\n## 动效与皮的边界\n\n属于这张卡的：字瞬时出现、光标紧跟行尾、不均匀的间隔、标点处的停顿、打完后的有限次闪烁。\n\n只是皮：光标的形状（竖线、方块、下划线）和颜色，字体（换成等宽字更像终端），字号字重，前面要不要加一个提示符或输入框的外形。\n\n## 接进片子\n\n- 变量：`text` 要打的一行字；`step` 平均字间隔；`backdrop`。把它压在一张输入框截图上时用 `off`，并把整行的位置和字号对到输入框里。\n- 时间：这张卡不逐字对齐旁白。通常让旁白在打字开始时说“比如我们输入……”，字打完（默认 1.8 秒）时旁白正好读完这句。\n- 音效：从 0.4 秒起铺一段键盘声，长度等于打字时长；标点停顿处键盘声也要断开。\n- 常见接法：打完后接 `highlighter-swipe` 划出其中的关键词；要表现“改口”时换用 `retype-fix`。"},{"id":"underline-draw","name":"手绘下划线","group":"字与强调","type":"structure","intents":["point","keyword"],"numbers":null,"chart":null,"one_line":"整句先到，念到重点词时，词下面一条头粗尾细的手绘线从左到右一笔甩出去，词被笔压得微微一沉","use_when":"要轻轻点一下某个词（术语、步骤名、要记的那个动作），又不想打断整句的阅读","energy":"低","needs":["文"],"overlay":true,"slot":3,"hero":2.6,"sfx":"stroke=draw","pairs_with":["line-rise","char-cascade"],"vars":[{"id":"text","type":"string","label":"整句","default":"先看懂报错，再去搜答案"},{"id":"key","type":"string","label":"要画线的重点词（整句的子串）","default":"看懂报错"},{"id":"hit","type":"number","label":"落笔时间（秒）","default":0.9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.6,1.14,1.24,1.32,2.6],"doc":"## 命门\n\n1. **先慢后快。** 画线用 power2.in：落笔时慢（笔压着，线粗），越到后面越快，最后是一个甩出去的细尾巴。用 out 类缓动会反过来——冲出去再慢慢蹭到头，像进度条，不像笔。\n2. **线有轻重。** 线不是等宽的描边，而是一块头钝、中段收细、再略微变粗、最后收成尖的填充形状，而且整体向右上方微微翘起。等宽直线是“链接下划线”，是排版，不是手。\n3. **晚到，而且只画一次。** 线在 `hit` 才开始，比整句晚约半秒。和字同时出现的线只是字的装饰，观众不会把它读成“这个词要注意”。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 0.9s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 开场 0 → 0.35s | 整句 | 上移 26px 淡入 | power3.out |\n| 0 → 0.46s | 手绘线 | 裁切右边界从 106% 收到 -6%，从左到右露出 | power2.in |\n| 0 → 0.12s | 重点词 | 下沉 5px | power2.out |\n| 0.38 → 0.68s | 重点词 | 回到原位，带一点回弹 | back.out(3) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 画线时长 | 0.46s | 过 0.8s 是在“描”，不是“划” | 低于 0.25s 线像是直接出现的 |\n| dip 词的下沉 | 5px | 过 10px 词像被按下去的按钮 | 0 时线和词没有关系，各动各的 |\n| pad 裁切外扩 | 6% | 没有坏处 | 0 时线头线尾伸出词外的部分会被切掉 |\n| hit（变量） | 0.9s | — | 小于 0.35s 脚本会抬到 0.35，保证整句先站稳 |\n| 线的高度（CSS，.ud-pen height） | 0.34em | 过 0.45em 像荧光笔，会顶到字的底部 | 低于 0.18em 轻重变化看不出来 |\n\n## 已知坑\n\n- 线是按重点词的宽度横向拉伸的同一个形状。词很短（两个字）时线又短又胖，像一个逗号；词很长（八个字以上）时被拉得很扁，起伏消失。两到六个字最合适，超出就换 `highlighter-swipe`。\n- 行高要给线留位置。行高 1.5 时线会贴着下一行的字头；现在用 1.7，线的底边在字框底部再往下 0.15em。第一版把线放在字框以内（往上 0.02em），结果压在“懂”“错”的最后一笔上，线和字糊在一起。\n- 下沉和回弹写在同一个节点（重点词）上，和开场的上移淡入是同一个属性。第二段必须关掉立即渲染，否则开场第一帧词就会被摆到 0 的位置，淡入时少了上移。\n- 用描边加虚线偏移来画也可以，但描边是等宽的，轻重就没了。要保留头粗尾细，只能用填充形状加裁切。\n- 强调色的线压在实拍上时，遇到亮的背景会看不见；透明模式下给整句加一条深色衬底，或者换一个和画面对比更大的强调色。\n\n## 动效与皮的边界\n\n属于这张卡的：晚到、从左到右一笔、先慢后快的笔速、头粗尾细并且上翘的线形、词被压一下再回来。\n\n只是皮：线的颜色、粗细、具体的起伏形状（可以换成波浪线或双线），字号字重，重点词要不要同时换色。\n\n## 接进片子\n\n- 变量：`text` 整句；`key` 要画线的词（整句的子串，建议 2–6 个字）；`hit` 落笔秒数，对齐旁白开始念这个词的时刻；`backdrop`。\n- 音效：`hit` 起放一个短的笔划声，重音放在最后 0.1 秒（甩尾那一下）。\n- 常见接法：`char-cascade` 或 `line-rise` 把字摆好，停 0.3 秒以上再画线；同一屏不要和 `highlighter-swipe` 同时用，两种标记会打架。"},{"id":"unit-grid","name":"百格比例","group":"数据与图表","type":"structure","intents":["number"],"numbers":[1,1],"chart":"proportion","one_line":"十乘十的一百个小方格，从左下角开始一格一格匀速点亮，连成一整块，旁边的大数字就是此刻亮了几格","use_when":"旁白说“百分之几”，而你想让观众感到这是“一百份里的多少份”，尤其是比例不大不小、光看数字没感觉的时候","energy":"中","needs":["数据"],"overlay":true,"slot":3.5,"hero":3.2,"sfx":"fill=tick, stop=pop","pairs_with":["ring-progress","big-stat-slab"],"vars":[{"id":"percent","type":"number","label":"点亮多少格（0–100）","default":37},{"id":"caption","type":"string","label":"数字下面的一行说明","default":"的时间花在返工上"},{"id":"note","type":"string","label":"来源小注（可空）","default":"每格 = 1%　示例数据"},{"id":"fill","type":"number","label":"点亮全程最长用时（秒）","default":1.4},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,0.9,1.4,1.86,3.2],"doc":"## 命门\n\n1. **匀速，一格一格。** 每格的间隔相同（37 格时每格 0.038 秒），不加缓动。每一格都是同样分量的“1%”，这是这张卡的全部意义。整块用缓出一起亮的话，就变成一个长得像格子的进度条。\n2. **亮的格子连成一块。** 从最下面一行的左边开始，一行排满再往上一行。按随机位置点亮，最后是一片散点，观众看不出面积，只看到“闪了一些格子”。\n3. **数字等于亮了几格。** 数字不是单独滚的，是直接数“已经开始亮的格子”。任何一帧截下来，数字和格子都对得上。\n\n## 动作拆解\n\n默认点亮 37 格。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.40 → 1.80s | 第 1 到第 37 格 | 每隔 0.038s 点亮一格；每格自己用 0.22s 从 0.2 倍放大到 1 并淡入 | 间隔匀速；单格 back.out(2.6) |\n| 0.40 → 1.80s | 大数字 | 0 → 37，和已点亮的格数一致 | 线性 |\n| 1.80 → 1.87s | 数字 + 百分号 | 缩放 1 → 1.07，原点在左下 | power2.out |\n| 1.87 → 2.15s | 数字 + 百分号 | 缩放回 1 | back.out(3) |\n| 1.90 → 2.30s | 说明行 | 从左边 24px 处滑入并淡入 | power3.out |\n| 2.15 → 2.45s | 来源小注 | 淡入 | 线性 |\n\n每格间隔 = `fill` ÷ 格数，但不超过 0.06 秒。所以 5 格只用 0.3 秒，不会一格一格慢吞吞地蹦。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| fill 点亮全程最长用时（变量） | 1.4s | 过 2.5s，格数多时像在数数，观众会走神 | 低于 0.8s 看不出“逐个”，只是刷了一下 |\n| stepMax 单格间隔上限 | 0.06s | 过 0.12s 每格都成了一个事件，太碎 | 调小后格数少时一闪而过 |\n| cellIn 单格点亮时长 | 0.22s | 过 0.4s 前沿拖成一条渐变带 | 低于 0.1s 格子是硬切出来的，没有弹性 |\n| cellFrom 单格起始倍数 | 0.2 | 接近 1 时只剩变色 | 0 也行，区别不大 |\n| kick 数字落定的一顿 | 1.07 | 过 1.12 会碰到说明行 | 1.0 时结尾很平 |\n\n## 已知坑\n\n- 一百个格子是脚本生成的，不跑脚本时网格是空的。这是这张卡唯一没有做到“静态 HTML 就是最终画面”的地方；文字部分仍然是静态写好的。\n- 数字从一位变两位时宽度会变，百分号会被推着走。现在按目标值先量好宽度并右对齐，所以开头的“0”是贴着百分号的。\n- 百格图边长 758px（每格 65px、间隔 12px），右侧数字 340px、百分号 136px、说明行 76px、小注 44px，两块之间隔 100px，默认内容整组宽约 1470px（画面的 76%）。说明行最多 11 个字、小注最多 20 个字，再长整组会超出画面两侧的 80px 留白；长说明拆一半放进旁白。\n- `percent` 填 100 时没有“不亮的格子”，脚本要先判断再给它们设状态，否则控制台报 “target not found”（换内容测试时遇到，已加判断）。\n- 比例带小数（37.5%）时没法点半格，脚本四舍五入成整格。需要小数时在说明行里写准确值，格子仍按整数亮。\n- 格数很少（3% 以下）时亮块太小，一眼看不到。这种情况反过来用：把说明写成“一百个里只有 3 个”，让大片灰格成为主角。\n- 压在实拍上时，未点亮的灰格是半透明感的深色，在暗画面上会消失。把 `--mc-muted` 调亮，或者给网格垫一块底板。\n\n## 动效与皮的边界\n\n属于这张卡的：十乘十的一百格、匀速逐格点亮、从底边往上连成一块、数字等于亮格数。\n\n只是皮：格子的大小、圆角和间距，格子是方的还是圆的（甚至是小人图标），亮格的颜色，数字放右边还是下面，说明行的位置。\n\n## 接进片子\n\n- 变量：`percent` 点亮多少格（0–100，取整）；`caption` 说明行；`note` 小注，默认写了“每格 = 1%”，建议保留这半句；`fill` 点亮最长用时；`backdrop`。\n- 对齐：最后一格点亮的时刻（默认 1.80 秒）对旁白念完这个百分比。\n- 音效：点亮期间一串均匀的轻滴答（不用每格都响，四五格响一次就够），落定时一个“啵”。\n- 示例数字是编的，小注里标了“示例数据”。"},{"id":"versus-split","name":"对决分屏","group":"结构与流程","type":"structure","intents":["compare"],"numbers":null,"chart":null,"one_line":"一条斜线把画面劈成两半，两边的标题从两侧加速撞到线前停住，撞击处弹出对比符号，然后两边的要点沿着斜线逐行列出","use_when":"旁白在比较两种做法、两个方案、两类人，先点出双方名字，再一条条对比","energy":"高","needs":["文"],"overlay":false,"slot":5,"hero":4.6,"sfx":"cut=whoosh, hit=impact, row=tick","pairs_with":["before-after-wipe","stat-compare"],"vars":[{"id":"sideA","type":"string","label":"左边标题","default":"凭感觉写"},{"id":"sideB","type":"string","label":"右边标题","default":"按结构写"},{"id":"items

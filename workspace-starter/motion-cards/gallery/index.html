<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动效卡库</title>
    <style>
      :root { --bg: #0b0d11; --panel: #14181f; --line: #232a35; --ink: #e9ecf1; --muted: #8791a3; --accent: #ffcf33; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif; }
      header { position: sticky; top: 0; z-index: 5; background: rgba(11, 13, 17, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 24px 10px; }
      h1 { margin: 0 0 10px; font-size: 20px; }
      h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      input[type="search"] { flex: 1 1 260px; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 8px 12px; font: inherit; }
      .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
      .chip.on { background: var(--accent); border-color: var(--accent); color: #14161a; font-weight: 700; }
      main { padding: 20px 24px 80px; }
      h2 { font-size: 16px; margin: 26px 0 12px; color: var(--muted); font-weight: 700; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
      .card:hover { border-color: #3a4556; }
      .stage { position: relative; aspect-ratio: 16 / 9; background: #000 center/cover no-repeat; }
      .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
      .meta { padding: 10px 12px 12px; }
      .name { font-weight: 700; }
      .name code { color: var(--muted); font: 12px ui-monospace, Consolas, monospace; margin-left: 8px; }
      .one { color: var(--muted); font-size: 13px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
      .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
      .tag.e高 { color: #ff8a65; border-color: #5a3327; } .tag.e中 { color: #ffd76a; border-color: #5a4a1e; } .tag.e低 { color: #7fd3a8; border-color: #244a3a; }
      dialog { width: min(1180px, 94vw); max-height: 92vh; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; }
      dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
      .dl-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
      .dl-head b { font-size: 17px; } .dl-head span { flex: 1; color: var(--muted); font: 13px ui-monospace, Consolas, monospace; }
      .dl-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; }
      .dl-stage { position: relative; aspect-ratio: 16 / 9.6; background: #000; align-self: start; }
      .dl-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .dl-doc { padding: 6px 20px 20px; overflow: auto; max-height: 78vh; font-size: 14px; }
      .dl-doc h3 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
      .dl-doc table { border-collapse: collapse; width: 100%; font-size: 13px; } .dl-doc td, .dl-doc th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
      .dl-doc code { background: #0d1016; padding: 0 4px; border-radius: 3px; font: 12.5px ui-monospace, Consolas, monospace; }
      .dl-doc pre { white-space: pre-wrap; background: #0d1016; padding: 10px; border-radius: 6px; font: 12.5px/1.5 ui-monospace, Consolas, monospace; user-select: all; }
      @media (max-width: 860px) { .dl-body { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>动效卡库<small id="count"></small></h1>
      <div class="row">
        <input id="q" type="search" placeholder="搜名字、用途、素材类型，比如：数字 / 对比 / 录屏 / 转场" />
        <button class="chip" data-skin="dark">深色</button><button class="chip" data-skin="light">浅色</button>
      </div>
      <div class="row" id="groups" style="margin-top: 8px"></div>
    </header>
    <main id="main"></main>
    <dialog id="dl">
      <div class="dl-head"><b id="dl-name"></b><span id="dl-id"></span><button class="chip" id="dl-close">关闭</button></div>
      <div class="dl-body"><div class="dl-stage" id="dl-stage"></div><div class="dl-doc" id="dl-doc"></div></div>
    </dialog>
    <script>
      window.MC = {"cards":[{"id":"arrow-point","name":"箭头指","group":"标注与手绘","type":"evidence","intents":["point"],"one_line":"一条带弧度的手绘箭头从空白处甩向目标，箭杆画完后箭头的两笔分两下点上，最后整支箭朝目标戳一下再弹回","use_when":"旁白说“看这里”“就是这个按钮”，目标周围有一块空白能让箭头起笔，而且想让观众的视线顺着线走过去","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":1.6,"sfx":"draw=draw, jab=pop","pairs_with":["circle-scribble","margin-note"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":576},{"id":"w","type":"number","label":"目标宽","default":416},{"id":"h","type":"number","label":"目标高","default":88},{"id":"side","type":"enum","label":"箭头从目标的哪个方向来","default":"rb"},{"id":"reach","type":"number","label":"箭头长短（像素）","default":420},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"aurora-band","name":"极光带","group":"幕底与氛围","type":"structure","intents":[],"one_line":"三条斜着铺满画面的宽色带整镜沿各自的方向缓慢错位滑动，同时一宽一窄地呼吸","use_when":"开场、转折、金句这类需要一点情绪和方向感的文字镜，纯色底太平，又不想用具体的图","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["line-rise","quote-pull","outline-fill-title"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"色带在后面慢慢错开"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.6}]},{"id":"bar-grow","name":"柱子长出","group":"数据与图表","type":"structure","intents":["number","compare"],"one_line":"普通柱子从同一条基线从左到右依次长出、跳过要强调的那个位置，强调色的那根最后单独冲上来并过冲，每根到位时数值从柱顶弹出来","use_when":"旁白在比较三到五个同类的量，而且结论是“其中一个明显不一样”","energy":"中","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"grow=rise, focus=pop","pairs_with":["stat-compare","number-roll"],"vars":[{"id":"values","type":"string","label":"数值，用 | 分隔（3–5 个）","default":"18|27|64|35"},{"id":"labels","type":"string","label":"柱子下的标签，用 | 分隔","default":"只给任务|加了背景|加了示例|加了格式"},{"id":"unit","type":"string","label":"数值后的单位（可空）","default":"分"},{"id":"focus","type":"number","label":"强调第几根（0 = 最高的那根）","default":0},{"id":"headline","type":"string","label":"结论（一句）","default":"给一个示例，评分直接翻倍（示例数据）"},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"before-after-wipe","name":"前后对比拖条","group":"图片与多素材","type":"evidence","intents":["compare","result"],"one_line":"同一位置叠着两张图，一条带圆把手的竖线从左边拖到中间停住让人对比，再一口气拖到最右，把“之前”擦成“之后”","use_when":"同一个画面改动前后的两个版本（修图前后、改提示词前后、旧版新版界面），旁白在说“改完以后是这样”","energy":"低","needs":["多图"],"overlay":true,"slot":4,"hero":1.9,"sfx":"grab=tick, drag1=whoosh, drag2=whoosh","pairs_with":["media-pop","stat-compare"],"vars":[{"id":"srcs","type":"string","label":"两张同构图的图：之前|之后。只给一张时，“之前”自动用它的灰化版","default":"motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p3.jpg"},{"id":"before","type":"string","label":"“之前”角标（可空）","default":"之前"},{"id":"after","type":"string","label":"“之后”角标（可空）","default":"之后"},{"id":"pauseAt","type":"number","label":"中途停下来对比的位置（%）","default":52},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"big-stat-slab","name":"大数字压屏","group":"数据与图表","type":"structure","intents":["number","hook"],"one_line":"一个占半屏高的数字带着小得多的单位，从比画面还大的尺寸加速砸到位，压扁一下再弹回，说明行晚 0.32 秒从下面跟上","use_when":"这一句的全部内容就是一个数字，而且它本身够惊人，不需要图表帮忙","energy":"高","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"hit=impact","pairs_with":["number-roll","stat-compare"],"vars":[{"id":"value","type":"string","label":"大数字","default":"73"},{"id":"unit","type":"string","label":"单位","default":"%"},{"id":"caption","type":"string","label":"数字下面的一行说明","default":"的返工，来自第一句话没说清"},{"id":"note","type":"string","label":"来源小注（可空）","default":"示例数据"},{"id":"hit","type":"number","label":"数字砸到位的时间（秒）","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"blur-bridge","name":"模糊过桥","group":"转场","type":"structure","intents":["transition"],"one_line":"上一镜越来越虚并微微胀大，虚到认不出内容时在三帧里换成同样虚的下一镜，再收回来变实","use_when":"两段内容是递进或并列关系，语气平稳，不想打断旁白的气口（“另一方面”“再来看”）","energy":"低","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"none","pairs_with":["rack-focus","slow-push"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"soft","type":"number","label":"最虚时的模糊（px）","default":30},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"blur-resolve","name":"虚焦变实","group":"字与强调","type":"structure","intents":["conclusion","definition"],"one_line":"一整句话先以一片虚焦的光斑出现，然后一段一段地对上焦：每段先变清、稍微过头又糊一点、再锁实","use_when":"内容本身在讲“从模糊到清楚”（想法成形、问题被看清、答案浮现），或者需要一个安静、带镜头感的句子入场","energy":"低","needs":["文"],"overlay":true,"slot":3,"hero":2.7,"sfx":"focus=rise","pairs_with":["tracking-settle","underline-draw"],"vars":[{"id":"text","type":"string","label":"一句话，按对焦顺序用 | 分段","default":"把模糊的想法|变成|清楚的步骤"},{"id":"step","type":"number","label":"相邻两段的间隔（秒）","default":0.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}]},{"id":"bokeh-drift","name":"光斑漂浮","group":"幕底与氛围","type":"structure","intents":[],"one_line":"十五个大小不一的虚化光斑整镜缓慢上浮并轻微左右摆，大的近、升得多摆得宽，小的远、几乎不动","use_when":"语气放松、偏感性的段落：开场寒暄、收尾致谢、讲一个小故事，需要一点温度和景深但没有具体画面","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["line-rise","quote-pull","subscribe-cta"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"光斑往上漂，标题不动"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.7}]},{"id":"bracket-frame","name":"角标取景框","group":"标注与手绘","type":"evidence","intents":["point"],"one_line":"四个直角先松松地出现在目标外一圈，然后同时向内收紧、略微收过头再回到位，最后闪两下表示对上了","use_when":"要把观众的注意力框在画面里的一块区域上（一行、一张卡片、一个人脸），语气是“锁定”“就看这一块”，而不是手写批注","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":2,"sfx":"close=whoosh, lock=tick","pairs_with":["label-callout","crash-zoom"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":140},{"id":"y","type":"number","label":"目标左上角 y","default":572},{"id":"w","type":"number","labe     <script>
      (function () {
        var cards = MC.cards, groups = MC.groups, state = { q: "", group: "", skin: "dark" };
        var $ = function (s) { return document.querySelector(s); };
        var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
        var demo = function (c, extra) { return "../cards/" + c.id + "/demo.html?skin=" + state.skin + (extra || ""); };

        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            var st = e.target, f = st.querySelector("iframe");
            if (e.isIntersecting && !f) { f = document.createElement("iframe"); f.loading = "lazy"; f.src = st.dataset.src; st.appendChild(f); }
            else if (!e.isIntersecting && f) f.remove(); // only the cards on screen keep playing
          });
        }, { rootMargin: "120px" });

        function render() {
          var q = state.q.trim().toLowerCase();
          var list = cards.filter(function (c) {
            if (state.group && c.group !== state.group) return false;
            if (!q) return true;
            return [c.id, c.name, c.one_line, c.use_when, c.group, c.energy, (c.needs || []).join(" ")].join(" ").toLowerCase().indexOf(q) >= 0;
          });
          $("#count").textContent = list.length + " / " + cards.length + " 张";
          io.disconnect();
          var html = "";
          groups.forEach(function (g) {
            var sub = list.filter(function (c) { return c.group === g.name; });
            if (!sub.length) return;
            html += "<h2>" + esc(g.name) + " · " + sub.length + '</h2><div class="grid">';
            sub.forEach(function (c) {
              html += '<div class="card" data-id="' + c.id + '"><div class="stage" data-src="' + demo(c, "&bare=1") + '" style="background-image:url(../cards/' + c.id + '/thumb.jpg)"></div><div class="meta"><div class="name">' + esc(c.name) + "<code>" + c.id + '</code></div><div class="one">' + esc(c.one_line) + '</div><div class="tags"><span class="tag e' + esc(c.energy) + '">能量 ' + esc(c.energy) + "</span>" + (c.needs || []).map(function (n) { return '<span class="tag">' + esc(n) + "</span>"; }).join("") + (c.overlay ? '<span class="tag">可叠加</span>' : "") + "</div></div></div>";
            });
            html += "</div>";
          });
          $("#main").innerHTML = html || '<p style="color:var(--muted)">没有匹配的卡。</p>';
          document.querySelectorAll(".stage").forEach(function (s) { io.observe(s); });
        }

        function md(src) { // just enough markdown for a card
          var out = "", lines = src.replace(/^---[\s\S]*?---\s*/, "").split(/\r?\n/), i = 0;
          var inline = function (s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); };
          while (i < lines.length) {
            var l = lines[i];
            if (/^## /.test(l)) out += "<h3>" + inline(l.slice(3)) + "</h3>";
            else if (/^\|/.test(l)) {
              out += "<table>";
              var first = true;
              while (i < lines.length && /^\|/.test(lines[i])) {
                if (!/^\|\s*-/.test(lines[i])) { var cells = lines[i].replace(/^\||\|$/g, "").split("|"); out += "<tr>" + cells.map(function (c) { return (first ? "<th>" : "<td>") + inline(c.trim()) + (first ? "</th>" : "</td>"); }).join("") + "</tr>"; first = false; }
                i++;
              }
              out += "</table>"; continue;
            } else if (/^\s*(\d+\.|-)\s+/.test(l)) out += "<div>• " + inline(l.replace(/^\s*(\d+\.|-)\s+/, "")) + "</div>";
            else if (l.trim()) out += "<p>" + inline(l) + "</p>";
            i++;
          }
          return out;
        }

        function open(id) {
          var c = cards.filter(function (x) { return x.id === id; })[0];
          if (!c) return;
          $("#dl-name").textContent = c.name; $("#dl-id").textContent = c.id + " · " + c.group + " · 建议 " + c.slot + " 秒";
          $("#dl-stage").innerHTML = '<iframe src="' + demo(c) + '"></iframe>';
          var clip = '<div id="' + c.id + '-1" class="clip" data-composition-id="' + c.id + '" data-composition-src="motion-cards/cards/' + c.id + '/demo.html" data-variable-values=\'' + JSON.stringify(Object.fromEntries((c.vars || []).map(function (v) { return [v.id, v.default]; }))) + '\' data-start="0" data-duration="' + c.slot + '" data-track-index="2" data-width="1920" data-height="1080"></div>';
          $("#dl-doc").innerHTML = "<p>" + esc(c.use_when) + "</p><h3>挂进项目</h3><pre>" + esc(clip) + "</pre><p style='color:var(--muted)'>正在读取卡片…</p>";
          fetch("../cards/" + c.id + "/card.md").then(function (r) { return r.text(); }).then(function (t) { $("#dl-doc").lastChild.outerHTML = md(t); }).catch(function () { $("#dl-doc").lastChild.textContent = "直接用文件方式打开时浏览器不让读 card.md，请看 cards/" + c.id + "/card.md，或用 npx serve 起一个本地服务。"; });
          $("#dl").showModal();
        }

        $("#groups").innerHTML = '<button class="chip on" data-g="">全部</button>' + groups.map(function (g) { return '<button class="chip" data-g="' + esc(g.name) + '">' + esc(g.name) + " " + g.count + "</button>"; }).join("");
        $("#groups").onclick = function (e) { var b = e.target.closest("[data-g]"); if (!b) return; state.group = b.dataset.g; document.querySelectorAll("[data-g]").forEach(function (x) { x.classList.toggle("on", x === b); }); render(); };
        document.querySelectorAll("[data-skin]").forEach(function (b) { b.classList.toggle("on", b.dataset.skin === state.skin); b.onclick = function () { state.skin = b.dataset.skin; document.querySelectorAll("[data-skin]").forEach(function (x) { x.classList.toggle("on", x === b); }); render(); }; });
        $("#q").oninput = function (e) { state.q = e.target.value; render(); };
        $("#main").onclick = function (e) { var c = e.target.closest(".card"); if (c) open(c.dataset.id); };
        $("#dl-close").onclick = function () { $("#dl").close(); $("#dl-stage").innerHTML = ""; };
        render();
      })();
    </script>
  </body>
</html>

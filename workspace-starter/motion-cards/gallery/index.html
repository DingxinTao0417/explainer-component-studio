<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动效卡库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* 剪辑台：顶部场记栏（名字、计数、搜索），宽屏左侧是筛选轨、窄屏收成一块；主区是一张 16:9 的接触表，每张卡底下一条真时间轴（建议时长、五个抽帧时刻、主画面）；点开是检视台。 */
  :root {
    --ground: #eceef1;
    --panel: #ffffff;
    --ink: #161a20;
    --muted: #5a6371;
    --line: #d3d8df;
    --key: #ffcf33;
    --key-ink: #161a20;
    --key-text: #8a6200;
    --scrim: rgba(18, 21, 26, 0.55);
    --font-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    --energy-low: #2f8a5b;
    --energy-mid: #b07a00;
    --energy-high: #c2412d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101216; --panel: #181b21; --ink: #eceef2; --muted: #9199a7; --line: #2b3038;
      --key: #ffcf33; --key-ink: #161a20; --key-text: #ffcf33; --scrim: rgba(0, 0, 0, 0.66);
      --energy-low: #6fd29c; --energy-mid: #ffcf33; --energy-high: #ff8a70;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101216; --panel: #181b21; --ink: #eceef2; --muted: #9199a7; --line: #2b3038;
    --key: #ffcf33; --key-ink: #161a20; --key-text: #ffcf33; --scrim: rgba(0, 0, 0, 0.66);
    --energy-low: #6fd29c; --energy-mid: #ffcf33; --energy-high: #ff8a70;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.6 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 96px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--key-text); outline-offset: 2px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- 场记栏 ---- */
  .masthead { display: grid; gap: 14px; padding-block: 28px 18px; max-width: 1480px; margin: 0 auto; }
  .titleline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 6vw, 64px); line-height: 1; margin: 0; letter-spacing: 0.02em; }
  .slate { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 13px; }
  .slate b { color: var(--ink); font-weight: 700; }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); }
  .searchrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; outline: none; }
  .search:focus-within { border-color: var(--key-text); }
  .search svg { flex: none; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--key); color: var(--key-ink); font-weight: 700; }
  .filter-toggle { display: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 13px; }

  /* ---- 主体：筛选轨 + 接触表 ---- */
  .bench { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 28px; max-width: 1480px; margin: 0 auto; align-items: start; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 20px; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 4px; }
  .rail h2 { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
  .chip .n { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  .chip[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--key-ink); }
  .chip[aria-pressed="true"] .n { color: var(--key-ink); }
  .rail select { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; }
  .rail .reset { border: 0; background: none; color: var(--key-text); padding: 0; font-size: 13px; text-align: left; justify-self: start; }
  .count { font-size: 13px; color: var(--muted); }

  .sheet { display: grid; gap: 34px; min-width: 0; }
  .group-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .group-head h3 { margin: 0; font-size: 18px; font-weight: 700; }
  .group-head .n { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 18px; }

  .tile { position: relative; display: grid; grid-template-rows: auto 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
  .tile:hover { border-color: var(--muted); }
  .stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #f4f5f7 center / cover no-repeat; cursor: pointer; overflow: hidden; }
  /* color-scheme: normal stops a dark page from painting an opaque white backdrop behind the loading demo */
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; color-scheme: normal; opacity: 0; transition: opacity 0.25s; }
  .stage iframe.on { opacity: 1; }
  .stage .play { position: absolute; left: 10px; bottom: 10px; border: 0; border-radius: 999px; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 12px; padding: 4px 10px; }
  .pick { position: absolute; z-index: 1; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(10, 12, 16, 0.55); color: #fff; font-size: 18px; line-height: 1; display: grid; place-items: center; padding: 0; }
  .pick[aria-pressed="true"] { background: var(--key); border-color: var(--key); color: var(--key-ink); font-weight: 700; }
  .meta { display: grid; gap: 6px; padding: 10px 12px 12px; min-width: 0; }
  .name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .open { border: 0; background: none; padding: 0; font-size: 15px; font-weight: 700; text-align: left; color: var(--ink); }
  .open:hover { text-decoration: underline; text-underline-offset: 3px; }
  .name .id { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .one { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); }
  .energy::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: currentColor; vertical-align: 1px; }
  .energy.e低 { color: var(--energy-low); } .energy.e中 { color: var(--energy-mid); } .energy.e高 { color: var(--energy-high); }

  /* 每张卡的真时间轴：建议时长、五个抽帧时刻、主画面 */
  .ruler { position: relative; height: 18px; margin-top: 2px; }
  .ruler .track { position: absolute; left: 0; right: 34px; top: 8px; height: 2px; background: var(--line); }
  .ruler .tick { position: absolute; top: 4px; width: 1px; height: 10px; background: var(--muted); }
  .ruler .hero { position: absolute; top: 4px; width: 9px; height: 9px; background: var(--key); border: 1px solid var(--key-ink); transform: translateX(-4px) rotate(45deg); }
  .ruler .len { position: absolute; right: 0; top: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .empty { padding: 40px 0; color: var(--muted); }

  /* ---- 检视台 ---- */
  dialog { width: min(1240px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: var(--scrim); }
  .dl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .dl-head .title { flex: 1 1 220px; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .dl-head .title strong { font-size: 18px; }
  .dl-head .title span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
  .dl-head .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .btn.key { background: var(--key); border-color: var(--key); color: var(--key-ink); font-weight: 700; }
  .dl-body { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
  .dl-left { padding: 16px; display: grid; gap: 14px; align-content: start; border-right: 1px solid var(--line); min-width: 0; }
  /* 预览高度 = 16:9 画面 + 34px 播放条 */
  .dl-stage { position: relative; background: #f4f5f7; border-radius: 8px; overflow: hidden; }
  .dl-stage::before { content: ""; display: block; padding-top: calc(56.25% + 34px); }
  .dl-stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; color-scheme: normal; }
  .strip { margin: 0; }
  .strip img { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
  .strip figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; min-width: 0; }
  .dl-right { padding: 16px 20px 24px; display: grid; gap: 18px; align-content: start; min-width: 0; overflow-wrap: anywhere; }
  .dl-right h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
  .snippet pre { margin: 0; padding: 12px; border-radius: 8px; background: var(--ground); border: 1px solid var(--line); font: 12px/1.55 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .vars-wrap { overflow-x: auto; }
  .vars { width: 100%; border-collapse: collapse; font-size: 13px; }
  .vars th, .vars td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .vars td:first-child, .vars td:nth-child(3) { font-family: var(--font-mono); font-size: 12px; }
  .doc { font-size: 14px; }
  .doc h3 { font-size: 15px; margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .doc h3:first-child { margin-top: 0; }
  .doc p { margin: 6px 0; }
  .doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
  .doc li { margin: 3px 0; }
  .doc code { font-family: var(--font-mono); font-size: 12.5px; background: var(--ground); border-radius: 4px; padding: 0 4px; }
  .doc .table-wrap { overflow-x: auto; }
  .doc table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .doc th { background: var(--ground); }

  /* ---- 选卡篮 ---- */
  .basket { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .basket[hidden] { display: none; }
  .basket .picked { flex: 1 1 260px; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .basket .picked span { flex: none; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .basket .label { font-weight: 700; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 6; background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; max-width: calc(100vw - 32px); }
  .toast[hidden], .manual[hidden] { display: none; }
  .manual { position: fixed; inset: auto max(16px, env(safe-area-inset-right, 0px)) calc(80px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
  .manual textarea { width: 100%; min-height: 70px; font: 12px var(--font-mono); background: var(--ground); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

  @media (max-width: 900px) {
    .bench { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .rail { position: static; max-height: none; overflow: visible; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .rail[data-open="false"] { display: none; }
    .filter-toggle { display: inline-block; }
    .dl-body { grid-template-columns: minmax(0, 1fr); }
    .dl-left { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 600px) {
    body { padding-block-end: 120px; }
    .basket { gap: 8px; }
    .basket .picked { display: none; }
    .basket .label { flex: 1 0 100%; }
    .dl-head .wide { display: none; }
  }
</style>

<header class="masthead">
  <div class="titleline">
    <h1>动效卡库</h1>
    <div class="slate" id="slate"></div>
  </div>
  <p class="lede">每张卡是一个动法：一份说明（命门、参数手感、已知坑）加一个单文件 HyperFrames 子合成。滚到哪张，哪张自动播放；点开看完整说明和挂进工程的代码；用预览右上角的 ＋ 把要用的卡放进选卡篮。</p>
  <div class="searchrow">
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜卡名、用途、动法，比如：数字、对比、录屏、转场" autocomplete="off">
    </label>
    <div class="seg" role="group" aria-label="卡片预览用哪套皮">
      <button type="button" id="skin-light" aria-pressed="true">浅色皮</button>
      <button type="button" id="skin-dark" aria-pressed="false">深色皮</button>
    </div>
    <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="rail">筛选</button>
  </div>
</header>

<div class="bench">
  <aside class="rail" id="rail" data-open="false" aria-label="筛选">
    <div class="count" id="count" aria-live="polite"></div>
    <section><h2>分组</h2><div class="chips" id="f-group"></div></section>
    <section><h2>能量</h2><div class="chips" id="f-energy"></div></section>
    <section><h2>需要的素材</h2><div class="chips" id="f-needs"></div></section>
    <section>
      <h2><label for="f-intent">旁白在说什么</label></h2>
      <select id="f-intent"></select>
    </section>
    <section><h2>用法</h2><div class="chips" id="f-overlay"></div></section>
    <button type="button" class="reset" id="reset">清空筛选</button>
  </aside>
  <main class="sheet" id="sheet"></main>
</div>

<dialog id="dl" aria-labelledby="dl-name">
  <div class="dl-head">
    <div class="title"><strong id="dl-name"></strong><span id="dl-id"></span></div>
    <div class="tools">
      <button type="button" class="btn" id="dl-prev" aria-label="上一张">←<span class="wide"> 上一张</span></button>
      <button type="button" class="btn" id="dl-next" aria-label="下一张"><span class="wide">下一张 </span>→</button>
      <button type="button" class="btn" id="dl-pick"></button>
      <button type="button" class="btn" id="dl-close">关闭</button>
    </div>
  </div>
  <div class="dl-body">
    <div class="dl-left">
      <div class="dl-stage" id="dl-stage"></div>
      <figure class="strip" id="dl-strip"></figure>
      <dl class="facts" id="dl-facts"></dl>
    </div>
    <div class="dl-right">
      <section>
        <h4>挂进工程</h4>
        <div class="snippet"><pre id="dl-snippet"></pre></div>
        <div class="row"><button type="button" class="btn key" id="dl-copy">复制挂载片段</button><button type="button" class="btn" id="dl-copy-use">复制装卡命令</button></div>
      </section>
      <section><h4>变量</h4><div class="vars-wrap"><table class="vars" id="dl-vars"></table></div></section>
      <section class="doc" id="dl-doc"></section>
    </div>
  </div>
</dialog>

<div class="basket" id="basket" hidden>
  <span class="label" id="basket-n"></span>
  <div class="picked" id="basket-list"></div>
  <button type="button" class="btn key" id="copy-names">复制卡名</button>
  <button type="button" class="btn" id="copy-use">复制装卡命令</button>
  <button type="button" class="btn" id="clear">清空</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
window.MC = {"base":"../","hf":"0.8.174","built":"2026-10-19","intents":{"hook":"开场钩子","chapter":"章节进入","keyword":"概念首次出现","definition":"定义","number":"数字作论据","compare":"对比","steps":"步骤清单","process":"流程或因果链","branch":"分支选择","categories":"并列分类","grouping":"归组关系","point":"指向重点","software":"软件操作","result":"结果兑现","question":"提问悬念","conclusion":"结论金句","caution":"注意误区","metaphor":"比喻情境","outro":"结尾号召","host":"主持人出场","transition":"转场"},"charts":{"compare":"比大小","ranking":"名次变化","trend":"趋势","proportion":"占比","quantity":"数量"},"groups":[{"name":"字与强调","count":13},{"name":"标题与章节","count":10},{"name":"数据与图表","count":10},{"name":"证据与界面","count":12},{"name":"图片与多素材","count":10},{"name":"镜头运动","count":8},{"name":"转场","count":10},{"name":"标注与手绘","count":9},{"name":"人物与口播","count":14},{"name":"结构与流程","count":10},{"name":"幕底与氛围","count":8}],"cards":[{"id":"arrow-point","name":"箭头指","group":"标注与手绘","type":"evidence","intents":["point"],"numbers":null,"chart":null,"one_line":"一条带弧度的手绘箭头从空白处甩向目标，箭杆画完后箭头的两笔分两下点上，最后整支箭朝目标戳一下再弹回","use_when":"旁白说“看这里”“就是这个按钮”，目标周围有一块空白能让箭头起笔，而且想让观众的视线顺着线走过去","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":1.6,"sfx":"draw=draw, jab=pop","pairs_with":["circle-scribble","margin-note"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":576},{"id":"w","type":"number","label":"目标宽","default":416},{"id":"h","type":"number","label":"目标高","default":88},{"id":"side","type":"enum","label":"箭头从目标的哪个方向来","default":"rb"},{"id":"reach","type":"number","label":"箭头长短（像素）","default":420},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.167,0.3,0.633,0.767,1.6],"doc":"## 命门\n\n1. **三笔，不是一笔。** 箭杆 0.42 秒，停 0.05 秒，箭头一笔 0.09 秒，再停 0.05 秒，另一笔 0.09 秒。两次停顿就是“提笔”。箭头和箭杆一起长出来读成图形工具里的箭头。\n2. **箭杆是弯的，而且从远处来。** 弧线向外鼓出弦长的 22%，起点在离目标约 420px 的空白处。直线箭头像标尺，贴着目标起笔则看不出“指”的方向。\n3. **画完才弹。** 最后一笔落下后整支箭朝目标戳 16px（0.08 秒），再用 0.32 秒弹回原位。没有这一下箭头只是“在那里”；弹得早于最后一笔，线还没画完就在晃。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.62s | 箭杆 | 从空白处起笔，沿弧线画到离目标 20px 处 | power2.out |\n| 0.67 → 0.76s | 箭头第一笔 | 从箭尖往回甩 90px，偏开约 30° | power2.out |\n| 0.81 → 0.90s | 箭头第二笔 | 同上，偏向另一侧 | power2.out |\n| 0.90 → 0.98s | 整支箭 | 沿箭尖方向前戳 16px | power2.out |\n| 0.98 → 1.30s | 整支箭 | 弹回原位，带一次小过冲 | back.out(3) |\n\n三笔都是两头细中间粗的填色带（箭杆 8 → 20 → 14px，箭头两笔 14 → 18 → 8px），由各自的蒙版描边揭开。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| shaft 箭杆时长 | 0.42s | 过 0.7s 像在描线，跟不上旁白 | 低于 0.25s 看不到线从哪来 |\n| beat 提笔停顿 | 0.05s | 过 0.15s 三笔散开，像卡顿 | 0 时三笔连成一个动作，手绘感消失 |\n| bow 弧度 | 0.22 | 过 0.4 变成钩子，指向含糊 | 0 是直线 |\n| barbLen 箭头长 | 90px | 过 130px 箭头比箭杆抢眼 | 低于 50px 在 1080p 上糊成一个点 |\n| jabPx 戳的距离 | 16px | 超过 gap（20px）会戳进目标里 | 0 就没有回弹 |\n| reach（变量） | 420px | 箭杆变长，要确认起点还在画面里 | 低于 220px 弧线展不开 |\n\n## 已知坑\n\n- 起点出画：起点在目标中心外侧 `w/2 + 0.88×reach`、`h/2 + 0.4×reach` 处。目标贴近画面边时换 `side`，让箭头从有空间的一侧来。\n- 起点压在内容上：箭头起笔的地方必须是空白。默认示例垫的是放大 2 倍的任务列表，箭头从第三行卡片里的空白处（约 1086,832）起笔，指向第二行的标题（300,576 起、416×88），箭杆长约 430px；换截图后先看起点落在哪。\n- 目标很大（宽过 600px）：箭尖落在外框靠近起点的那条边上，离视觉中心很远。大目标把 `x/y/w/h` 报成里面真正要看的那一小块。\n- 箭头的两笔在暗色实拍上发虚：深色包边在暗底上不起作用，这时把 `--mc-accent` 换成更亮的颜色。\n\n## 动效与皮的边界\n\n属于这张卡的：箭杆和两笔箭头分三次画、中间有提笔、箭杆带弧度并从远处来、全部画完后朝目标戳一下再弹回。\n\n只是皮：颜色、线的粗细、箭头张角、弧线朝哪边鼓、有没有深色包边。\n\n## 接进片子\n\n- 变量：`x / y / w / h` 是目标外框；`side` 选箭头从哪一侧来（左下、左上、右下、右上，默认右下）；`reach` 控制箭杆长短；`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：旁白说到“这里”的那个字对齐 0.9 秒（最后一笔落下、开始戳的那一帧），所以这一镜要比那个字早 0.9 秒开始。\n- 音效：0.2 秒一声笔划；0.9 秒一声很轻的弹出音配那一戳。\n- 常见接法：箭头尾巴旁边要有一句话时，同时放一张 `margin-note`；只想圈住不想指时用 `circle-scribble`。"},{"id":"aurora-band","name":"极光带","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"三条斜着铺满画面的宽色带整镜沿各自的方向缓慢错位滑动，同时一宽一窄地呼吸","use_when":"开场、转折、金句这类需要一点情绪和方向感的文字镜，纯色底太平，又不想用具体的图","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["line-rise","quote-pull","outline-fill-title"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"色带在后面慢慢错开"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.6}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **相邻两条反着走。** 三条带的位移是 +260、-320、+220px，中间那条和上下两条方向相反。三条同向就成了整屏平移的斜纹布，没有“错位”。\n2. **带子两头在画面外。** 每条带长 3560px，斜 17°，左右都伸出画面。能看到带子的端头，就读成三根彩色的棒子飞过去。\n3. **宽窄变化不超过四成。** 带宽在 0.8 到 1.25 倍之间呼吸，3 秒一个来回。变化再大，带子会忽然盖住标题又忽然让开，标题像在闪。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 上、中、下三条色带 | 沿自己的长边滑 260 / -320 / 220px（以原位为中点） | sine.inOut |\n| 0 → 3s → 6s | 上带 | 宽度 0.82 → 1.2 → 0.82 倍 | sine.inOut，往返一次 |\n| 0 → 3s → 6s | 中带 | 宽度 1.18 → 0.8 → 1.18 倍 | 同上 |\n| 0 → 3s → 6s | 下带 | 宽度 0.9 → 1.25 → 0.9 倍 | 同上 |\n\n每条带里有两处较浓的椭圆色团和一层很淡的通长底色。色团是为了让“沿长边滑动”看得出来：一条从头到尾一样浓的带子，滑动了也看不见。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 2 色团明显在流动，像背景里有车灯划过 | 0.4 以下只剩宽窄呼吸 |\n| strength（变量） | 0.6 | 过 0.85 中间那条压在标题后面时字开始发灰 | 0.3 是一点若有若无的斜向色温 |\n| slide（CFG） | 260 / -320 / 220 | 过 600 会把带里的色团推出画面一侧 | 都设成同号就失去错位 |\n| wide（CFG） | 0.8–1.25 | 上限过 1.5 相邻两条会合成一整片 | 都设成 1 时带子像贴上去的 |\n| 倾角（CSS rotate） | -17° | 过 35° 接近对角线，画面显得倾斜不稳 | 0° 是三条横带，像旗子 |\n\n## 已知坑\n\n- 倾角写在外层、滑动和宽窄写在内层。把两者写到同一个节点上，滑动方向就不再沿带子的长边，而是水平移，带子边缘会扫过标题。\n- 中间那条带正好压在标题后面。换成很亮的强调色时，先看 3 秒这一帧的字是不是还清楚。\n- 宽窄呼吸的起止值相同，但滑动是一去不回的，所以首尾两帧不一样。要循环时倒放一遍。\n- 两种颜色的带叠在一起的地方会混出第三种颜色（黄加蓝发灰绿）。不想要就把上下两条和中间那条的间距拉开。\n\n## 动效与皮的边界\n\n属于这张卡的：斜向、通长、没有端头的宽带，相邻反向的慢速错位，三条带各自错开节拍的宽窄呼吸。\n\n只是皮的：带的颜色和条数（两到三条）、倾角、每条带里色团的位置和浓淡、底色。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把文字卡叠在更高的轨道上；`speed` 是滑动距离的倍数；`strength` 是色带浓度。\n- 时间：整镜铺满，不用对齐旁白。\n- 音效：没有。\n- 常见接法：`line-rise` 或 `quote-pull` 的幕底。文字从下往上进场时，色带的斜向正好给一个向上的势，不用再加别的动势。"},{"id":"bar-grow","name":"柱子长出","group":"数据与图表","type":"structure","intents":["number","compare"],"numbers":[3,5],"chart":"compare","one_line":"普通柱子从同一条基线从左到右依次长出、跳过要强调的那个位置，强调色的那根最后单独冲上来并过冲，每根到位时数值从柱顶弹出来","use_when":"旁白在比较三到五个同类的量，而且结论是“其中一个明显不一样”","energy":"中","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"grow=rise, focus=pop","pairs_with":["stat-compare","number-roll"],"vars":[{"id":"values","type":"string","label":"数值，用 | 分隔（3–5 个）","default":"18|27|64|35"},{"id":"labels","type":"string","label":"柱子下的标签，用 | 分隔","default":"只给任务|加了背景|加了示例|加了格式"},{"id":"unit","type":"string","label":"数值后的单位（可空）","default":"分"},{"id":"focus","type":"number","label":"强调第几根（0 = 最高的那根）","default":0},{"id":"headline","type":"string","label":"结论（一句）","default":"给一个示例，评分直接翻倍（示例数据）"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.62,1,1.25,2.6],"doc":"## 命门\n\n1. **强调的那根最后出发。** 不管它排在第几个，普通柱子先按从左到右的顺序长完，它的位置空着；等所有普通柱子都出发了，再过 0.12 秒它才单独冲上来。它按位置顺序跟着长的话，后面长出来的柱子会把视线带走，结论就散了。\n2. **只有强调柱过冲。** 普通柱用 power3.out 平稳到位，强调柱用 back.out(1.5) 冲过头再坐回来。全都过冲，画面是一排弹簧，看不出谁是主角。\n3. **数值等柱子到了才出现。** 普通柱的数值在柱子到位前 0.1 秒从柱顶弹出，强调柱的数值在它冲到过冲最高点时弹出。一开始就挂着数字的话，观众先读完了数，柱子长不长都无所谓了。\n\n## 动作拆解\n\n默认四根柱子，强调第三根（最高的）。柱宽 320px、间隔 80px，四根合起来 1520px（画面宽的 79%），基线 1680px；五根时脚本把柱宽收到 270px、间隔 64px。结论句 68px，普通数值 96px，强调数值 128px，柱下标签 52px。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.35s | 结论句 | 上移 20px 淡入 | power2.out |\n| 0.25s 起，每个隔 0.16s | 柱下标签 | 淡入 0.3s | 线性 |\n| 0.35 / 0.51 / 0.67s 起 | 第 1、2、4 根柱子 | 高度 0 → 目标，各用 0.5s | power3.out |\n| 0.95 → 1.50s | 第 3 根（强调柱） | 高度 0 → 520px，中途冲过头再坐回 | back.out(1.5) |\n| 0.75 / 0.91 / 1.07s | 普通柱的数值 | 缩放 0.3 → 1 并淡入，用 0.28s，原点在数值底部 | back.out(2) |\n| 1.20 → 1.48s | 强调柱的数值 | 同上，弹得更狠 | back.out(3.2) |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| gap 相邻柱子的间隔 | 0.16s | 过 0.3s 变成一根一根地讲，适合旁白逐项点名时用 | 低于 0.08s 像一起长，看不出顺序 |\n| grow 普通柱生长时长 | 0.5s | 过 0.9s 拖沓 | 低于 0.3s 柱子是“跳出来”的 |\n| focusLag 强调柱比最后一根普通柱晚出发多少 | 0.12s | 过 0.4s 像单独又演了一段 | 0 时它只是队伍里的最后一根，主次变弱 |\n| focusGrow 强调柱生长时长 | 0.55s | 过 0.9s 过冲变成慢悠悠的晃 | 低于 0.35s 像弹出来的，不像长出来的 |\n| maxH 最高柱的高度 | 520px | 过 560px 强调柱的数值过冲时会顶到结论句 | 低于 350px 柱子之间的差距看不出来，图表也缩回画面下半 |\n| popLead 数值提前量 | 0.1s | 过 0.25s 数值比柱子先到 | 0 时数值像事后贴上去的 |\n\n## 已知坑\n\n- 第一版是让强调柱按位置顺序出发、只把时长拉长到最后落定。结果缓出曲线让它在 1.0 秒就已经长到顶了，比右边那根普通柱还早，“最后到”只存在于数字里。改成最后出发才真的最后到。\n- 强调柱过冲时，柱顶的数值会跟着被顶高三十多像素。最高柱上方必须留出这段空间，现在图表区高 750px、柱子最高 520px、强调数值占 160px，剩 70px，够用；把 `maxH` 调大前先算这笔账。\n- 用 `scaleY` 长柱子的话，圆角会被拉扁，数值也没法跟着柱顶走。这里改的是高度，数值排在柱子上面，自然被顶上去。\n- 柱子不从 0 开始（截断纵轴）会把 18 和 27 的差距夸大。这张卡的柱高永远按“数值 ÷ 最大值”算，不提供截断。\n- 标签 52px，列宽 320px：超过六个字会撑出列宽、和邻居连在一起；五根柱子时列宽 270px，标签最多五个字。标签写短，细节交给旁白。\n- 数值超过三位（如 `1284`）加单位后，128px 的强调数值会比 320px 的柱子宽，压到邻居头上。大数先换算成“1.3 千”，或者把单位留空。\n- 最小值太小（不到最大值的 2%）时柱子只剩一条线，脚本给了 8px 的保底高度。这种悬殊的对比更适合 `stat-compare`。\n\n## 动效与皮的边界\n\n属于这张卡的：从同一条基线依次长出、强调柱最后出发并且独自过冲、数值在柱子到位时才从柱顶弹出。\n\n只是皮：柱子宽度、圆角、间距、非强调柱的灰度、数值和标签的字号、结论句放上面还是不放、基线的粗细。\n\n## 接进片子\n\n- 变量：`values` 用 `|` 分隔的 3–5 个数；`labels` 对应的标签；`unit` 数值后的小单位（可空）；`focus` 强调第几根，填 0 自动取最高的；`headline` 结论句；`backdrop`。\n- 对齐：强调柱数值弹出的时刻（默认 1.20 秒）对旁白说出结论的那个词。柱子多一根，这个时刻晚 0.16 秒。\n- 音效：整段生长配一个 1 秒左右的上扬声，强调柱的数值弹出时加一个“啵”。\n- 一屏只留一个结论。想同时强调最高和最低，就拆成两屏。\n- 示例数字是编的，结论句里标了“示例数据”。"},{"id":"before-after-wipe","name":"前后对比拖条","group":"图片与多素材","type":"evidence","intents":["compare","result"],"numbers":null,"chart":null,"one_line":"同一位置叠着两张图，一条带圆把手的竖线从左边拖到中间停住让人对比，再一口气拖到最右，把“之前”擦成“之后”","use_when":"同一个画面改动前后的两个版本（修图前后、改提示词前后、旧版新版界面），旁白在说“改完以后是这样”","energy":"低","needs":["多图"],"overlay":true,"slot":4,"hero":1.9,"sfx":"grab=tick, drag1=whoosh, drag2=whoosh","pairs_with":["media-pop","stat-compare"],"vars":[{"id":"srcs","type":"string","label":"两张同构图的图：之前|之后。只给一张时，“之前”自动用它的灰化版","default":"motion-cards/lib/samples/p7.jpg|motion-cards/lib/samples/p3.jpg"},{"id":"before","type":"string","label":"“之前”角标（可空）","default":"之前"},{"id":"after","type":"string","label":"“之后”角标（可空）","default":"之后"},{"id":"pauseAt","type":"number","label":"中途停下来对比的位置（%）","default":52},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.45,1.2,1.9,2.75,3.7],"doc":"## 命门\n\n1. **中途要停。** 线先拖到 52% 停 0.55 秒，左边是“之后”、右边是“之前”，两半同时在画面里。一次拖到底的话观众只看到一次转场，没有机会对比，这张卡就白做了。\n2. **线和擦除边缘是同一个数。** 把手的位置和上层图的可见宽度用同样的起止值、同样的缓动、同样的时刻驱动。两者差一帧，线后面就会露出一条错位的缝。\n3. **像手拖的。** 第一段拖过头 2.5% 再退回来，拖动时把手缩到 0.86、松手弹回 1。匀速直线拖过去是进度条，不是“有人在拖”。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.40s | 图框 | 淡入，缩放 0.97 → 1 | power2.out |\n| 0.50 → 0.72s | 竖线 | 在最左边从中间向上下长出 | power3.out |\n| 0.56 → 0.82s | 把手 | 缩放 0 → 1 | back.out(2.6) |\n| 0.75 → 0.87s | 把手 | 按下，缩到 0.86 | power2.out |\n| 0.85 → 1.55s | 竖线 + 擦除边缘 | 0% → 54.5% | power2.inOut |\n| 1.55 → 1.75s | 竖线 + 擦除边缘 | 退回 52%，随后把手弹回 1 | sine.inOut |\n| 1.75 → 2.30s | — | 停住对比 | — |\n| 2.30 → 3.05s | 竖线 + 擦除边缘 | 52% → 100%，把手先按下 | power3.inOut |\n| 2.93 → 3.11s | 竖线 | 到边后淡出 | power1.in |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| pauseAt 停下的位置（变量） | 52% | 过 70% “之前”只剩一条，没法比 | 低于 30% “之后”还没露出重点 |\n| pause 停多久 | 0.55s | 旁白在这里要解释差别时可以放到 1.5s 以上 | 低于 0.3s 眼睛来不及左右各看一眼 |\n| drag1Dur 第一段时长 | 0.7s | 过 1.2s 拖得犹豫 | 低于 0.4s 像自动播放的转场 |\n| overPct 拖过头的量 | 2.5% | 过 6% 像手滑 | 0 时停得很机械 |\n| drag2Dur 第二段时长 | 0.75s | — | 低于 0.4s 第二段会比第一段还抢眼 |\n| press 拖动时把手大小 | 0.86 | — | 低于 0.7 把手上的箭头看不清 |\n\n## 已知坑\n\n- 分段拖动要对同一个属性连写几段 `fromTo`。第一版没关 `immediateRender`，最后一段的起始值（52%）在建时间轴时就被写进了画面，第一帧线就在中间。现在每一段都带 `immediateRender: false`，初始位置单独用 `gsap.set` 给。\n- 第一版让线从 5% 的位置出现，结果把手还没出来，左边就已经露出一条“之后”的图。现在从 0% 开始，把手先出现在图框左边缘上。\n- 图框最初是 16:9，示例图是 16:10，上下被裁掉一截（图底部的小字被切了一半）。现在图框是 1488×930（16:10）。素材是 16:9 的，把 `.bw-frame`、`.bw-img`、`.bw-after` 三处的宽高和 `CFG.W` 一起改。\n- 两张图必须构图对齐。内容不同的两张图用这张卡，读出来是“换了一张图”，不是“同一张图变了”。只有一张图时 `srcs` 只填一个地址，“之前”会自动用它的灰化压暗版。\n- “之后”的角标在上层图的左上角，线拖过去才露出来；`pauseAt` 小于 12% 时它在停顿那一刻还被切着一半。\n\n## 动效与皮的边界\n\n属于这张卡的：两张图同位叠放、竖线从左到右、中途停住对比、线和擦除边缘严格同步、拖过头再退回的手感。\n\n只是皮：把手的形状和大小、线的粗细和颜色、角标的文字和样式、图框的圆角和阴影、图框尺寸。\n\n## 接进片子\n\n- 变量：`srcs` 填“之前|之后”两张图；`before` / `after` 两个角标的字，留空就不显示；`pauseAt` 中途停的位置；`backdrop`。\n- 把停住的那一段（1.75 → 2.30s）对上旁白解释差别的那半句；需要讲得久就加大 `CFG.pause`，同时把 `slot` 放长。\n- 音效：0.75s 按下把手一个轻的滴答，两段拖动各一个短的掠过声，第二段略响。\n- 停顿时可以叠一张标注类的卡，在“之后”那一半圈出改了哪里；拖完以后可以接 `stat-compare` 给数字。"},{"id":"big-stat-slab","name":"大数字压屏","group":"数据与图表","type":"structure","intents":["number","hook"],"numbers":[1,1],"chart":null,"one_line":"一个占半屏高的数字带着小得多的单位，从比画面还大的尺寸加速砸到位，压扁一下再弹回，说明行晚 0.32 秒从下面跟上","use_when":"这一句的全部内容就是一个数字，而且它本身够惊人，不需要图表帮忙","energy":"高","needs":["数据"],"overlay":true,"slot":3,"hero":2.6,"sfx":"hit=impact","pairs_with":["number-roll","stat-compare"],"vars":[{"id":"value","type":"string","label":"大数字","default":"73"},{"id":"unit","type":"string","label":"单位","default":"%"},{"id":"caption","type":"string","label":"数字下面的一行说明","default":"的返工，来自第一句话没说清"},{"id":"note","type":"string","label":"来源小注（可空）","default":"示例数据"},{"id":"hit","type":"number","label":"数字砸到位的时间（秒）","default":0.5},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,0.47,0.55,1,2.6],"doc":"## 命门\n\n1. **从大到小，加速落下。** 数字从 2.3 倍缩到 1 倍，用 power3.in，最后几帧最快。这是“朝屏幕砸过来”。反过来从小放大、或者用缓出，读成“弹出一个数字”，没有重量。\n2. **数字和单位差三倍以上。** 数字 560px，单位 150px。两者一样大时观众读到的是“73%”这个词；差得悬殊时先读到“73”，然后才是单位，数字才压得住屏。\n3. **说明晚到。** 说明行在砸到位之后 0.32 秒才出现。同时出现的话，眼睛会先去读那行字，数字白砸了。\n\n## 动作拆解\n\n| 时间（相对 hit，默认 hit = 0.5s） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| -0.17 → 0s | 数字 + 单位 | 缩放 2.3 → 1，透明 → 不透明，原点在数字的下部（50% 78%） | power3.in |\n| 0 → 0.05s | 数字 + 单位 | 纵向压到 0.92，横向撑到 1.03 | power1.out |\n| 0 → 0.28s | 整屏 | 纵向 16px 衰减晃 4 下（+16、-10、+6、-2、0） | 线性 |\n| 0.05 → 0.31s | 数字 + 单位 | 压扁弹回 1 | back.out(3) |\n| 0.32 → 0.72s | 说明行 | 上移 36px 淡入 | power3.out |\n| 0.57 → 0.87s | 来源小注 | 淡入 | 线性 |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| from 起始倍数 | 2.3 | 过 3 时第一帧只是一片模糊的色块，看不出是数字 | 低于 1.5 没有“砸”，只是缩了一下 |\n| fall 落下时长 | 0.17s | 过 0.3s 变成慢慢缩小的片头字 | 低于 0.1s 只剩结果 |\n| squash 压扁程度 | 0.92 | 0.97 以上看不出来 | 低于 0.85 像橡皮，数字失去硬度 |\n| shakePx 晃动幅度 | 16px | 过 24px 像地震，压在实拍上尤其难受 | 0 也成立，砸感靠压扁撑着 |\n| capLag 说明行延迟 | 0.32s | 过 0.6s 像两件不相干的事 | 低于 0.15s 和数字抢 |\n\n## 已知坑\n\n- 起始倍数下数字比画面还大，会被画面边缘裁掉。这是有意的（压屏就是要出框），但只能发生在前几帧、透明度还低的时候；`from` 不要配合更长的 `fall` 一起调大。\n- 数字超过三位（比如 12,800）时 560px 放不下一行。三位以内用这张卡；更长的数把它换算成“1.28 万”，或者改用 `number-roll`。\n- 变形原点放在正中时，压扁是上下一起往中间收，像被夹了一下。原点放在下部，压扁才是“落在地上”。\n- 大字自带的留白：560px 的字，字体本身在基线下面还留着约 146px 的下行空间。说明行贴得太近时肉眼看不出问题，但 `verify` 会报两块文字重叠（content_overlap）。现在数字行高 540px，说明行再往下让 106px 才通过；换字体或改字号后要重新量这段。\n- 说明行太长（超过 18 个字）会比数字宽出很多，重心掉到下面去。说明行只写半句，剩下的交给旁白。\n\n## 动效与皮的边界\n\n属于这张卡的：2.3 → 1 的加速下落、落地的压扁回弹和整屏纵向晃、数字与单位的悬殊字号、说明行的晚到。\n\n只是皮：单位的颜色、数字字体、说明行的字号和位置（下面或右边）、有没有来源小注、有没有实底。\n\n## 接进片子\n\n- 变量：`value` 大数字（当字符串填，可以带小数点），`unit` 单位，`caption` 说明行，`note` 来源小注（留空不显示），`hit` 砸到位的秒数，`backdrop`。\n- 对齐：`hit` 对旁白念出这个数字的重音。说明行会在 0.32 秒后自己跟上，正好接旁白的后半句。\n- 音效：`hit` 那一帧放一个低沉的撞击声，比砸字的那种更闷。\n- 一条片子里用一到两次。连着两屏都是压屏数字，第二个就没有分量了。\n- 示例数字是编的，画面上标了“示例数据”；换真数据时把来源写进 `note`。"},{"id":"blur-bridge","name":"模糊过桥","group":"转场","type":"structure","intents":["transition"],"numbers":null,"chart":null,"one_line":"上一镜越来越虚并微微胀大，虚到认不出内容时在三帧里换成同样虚的下一镜，再收回来变实","use_when":"两段内容是递进或并列关系，语气平稳，不想打断旁白的气口（“另一方面”“再来看”）","energy":"低","needs":["多图"],"overlay":false,"slot":2,"hero":1,"sfx":"none","pairs_with":["rack-focus","slow-push"],"vars":[{"id":"from","type":"string","label":"上一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p1.jpg"},{"id":"to","type":"string","label":"下一镜的画面（从项目根目录写起）","default":"motion-cards/lib/samples/p2.jpg"},{"id":"soft","type":"number","label":"最虚时的模糊（px）","default":30},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.9,1,1.167,1.6],"doc":"这张卡**不是叠加层**：它要把两镜的画面本身弄虚，所以自带两张图，地址用变量 `from` / `to` 传入。\n\n## 命门\n\n1. **在最虚的时候换，而且两边一样虚。** 模糊 30px 时轮廓和文字都认不出，只剩色块，这时混入下一镜，观众看到的是颜色在流动。还没虚够（低于 15px）就换，会看见两个画面的轮廓叠在一起，读成“叠化没做完”。\n2. **虚得慢，实得稳。** 变虚用 power2.in（先慢后快），变实用 power2.out（先快后慢），整体像镜头换了一次焦。匀速变虚像在调滤镜参数。\n3. **带一点胀缩。** 最虚时放大到 1.12 倍再收回。一是把模糊造成的暗边推到画面外，二是给“失焦”一点呼吸感；完全不动的模糊像是视频卡了加载。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（最虚的那一帧）。没有全遮；两镜在 0.95 → 1.05s 之间交叠。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.7 → 1.0s | 上一镜 | 模糊 0 → 30px，缩放 1 → 1.12 | power2.in |\n| 0.95 → 1.05s | 下一镜 | 透明度 0 → 1（3 帧） | 线性 |\n| 1.0 → 1.4s | 下一镜 | 模糊 30px → 0，缩放 1.12 → 1 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| soft（变量） | 30px | 过 50px 画面边缘开始发暗，要同时加大 swell | 低于 16px 能认出两镜的轮廓，穿帮 |\n| out 变虚时长 | 0.3s | 过 0.6s 观众会以为要看的是“模糊”本身 | 低于 0.2s 像闪了一下 |\n| back 变实时长 | 0.4s | 过 0.7s 下一镜迟迟看不清，着急 | 低于 0.25s 没有“对上焦”的落定 |\n| swell 胀大倍数 | 1.12 | 过 1.2 变成推镜 | 低于 1.08 最虚时四边会露出暗边 |\n| mix 交叠时长 | 0.1s | 过 0.2s 是普通叠化 | 0 是硬切，两镜颜色差大时能看见跳 |\n\n## 已知坑\n\n- `from` 应该是上一镜最后一帧的静帧，`to` 是下一镜第一帧的静帧。任何一边对不上，转场开头或结尾就会跳一下。\n- 两镜主色差别很大（暖橙 → 冷蓝）时，中间几帧是两种颜色的混色，会发灰发紫。这是正常的；介意的话把 `mix` 缩到 0.067。\n- 整幅 30px 的模糊很吃渲染时间，一期里用三四次没问题，别拿它当默认转场。\n- 上一镜有大面积小字（文档、代码）时，变虚的前几帧字会“糊成一团再消失”，观感不如直接切。这类画面先推近或压暗，再过桥。\n\n## 动效与皮的边界\n\n属于这张卡的：最虚点换镜、两边等虚、先慢后快地虚和先快后慢地实、最虚时的轻微胀大。\n\n只是皮：模糊多少（20–40px）、胀大多少、交叠几帧。给最虚的那几帧叠一层很淡的强调色也只是皮。\n\n## 接进片子\n\n- 变量：`from` 上一镜静帧，`to` 下一镜静帧（地址从项目根目录写起），`soft` 最虚时的模糊，`backdrop`（图带透明区域时才有区别）。\n- 对齐：这段自己占 2 秒。上一镜的结尾接到这段的开头，下一镜从这段结束处接上；两镜的“交界”在卡内 1.0 秒。只想要动的部分，就取卡内 0.7 → 1.4 秒。\n- 音效：不需要。配乐有长音时让它盖过去。\n- 常见接法：前一镜用缓推，后一镜用焦点转移，中间用它，三者速度感一致。"},{"id":"blur-resolve","name":"虚焦变实","group":"字与强调","type":"structure","intents":["conclusion","definition"],"numbers":null,"chart":null,"one_line":"一整句话先以一片虚焦的光斑出现，然后一段一段地对上焦：每段先变清、稍微过头又糊一点、再锁实","use_when":"内容本身在讲“从模糊到清楚”（想法成形、问题被看清、答案浮现），或者需要一个安静、带镜头感的句子入场","energy":"低","needs":["文"],"overlay":true,"slot":3,"hero":2.7,"sfx":"focus=rise","pairs_with":["tracking-settle","underline-draw"],"vars":[{"id":"text","type":"string","label":"一句话，按对焦顺序用 | 分段","default":"把模糊的想法|变成|清楚的步骤"},{"id":"step","type":"number","label":"相邻两段的间隔（秒）","default":0.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.62,0.92,1.3,2.7],"doc":"## 命门\n\n1. **整句从一开始就在画面上。** 第一帧就能看到整句话的轮廓，只是完全虚焦（虚化 24px、透明度 0.55）。如果每段是从无到有地出现，那是逐词淡入，“镜头在找焦点”的前提——东西本来就在那儿——就没有了。\n2. **对焦要过头再回来。** 每段 0.38 秒变清以后，会再糊到 5px（0.1 秒），然后才锁实（0.2 秒）。少了这一下回摆，就只是一个模糊淡入；有了它才像镜头。\n3. **逐段，不是逐字。** 按意群分两到四段，段间隔 0.3 秒，前一段还在回摆时下一段已经开始变清。逐字对焦太碎，观众看到的是一排闪烁。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.30s | 整句（全部虚焦） | 淡入 | 线性 |\n| 0.50 + i×0.30s 起，持续 0.38s | 第 i 段 | 虚化 24px → 0，透明度 0.55 → 1，1.07 倍 → 1 倍 | power2.out |\n| 接着 0.10s | 第 i 段 | 虚化回到 5px | sine.inOut |\n| 接着 0.20s | 第 i 段 | 虚化 → 0，锁定 | sine.out |\n\n默认三段：第一段 0.50 秒起，第三段 1.10 秒起、1.78 秒锁定。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| soft 起始虚化 | 24px | 过 40px 光斑连成一片，看不出有几段 | 低于 12px 开头就能读出字，没有“找”的过程 |\n| haze 虚焦时的透明度 | 0.55 | 1 时虚焦的字太亮，抢了已经对上焦的字 | 低于 0.3 开头画面像是空的 |\n| pull 对焦时长 | 0.38s | 过 0.7s 像慢速自动对焦，拖 | 低于 0.2s 是跳变 |\n| hunt 回摆幅度 | 5px | 过 10px 像对焦失败，观众会出戏 | 0 时就是普通的模糊淡入 |\n| step 段间隔（变量） | 0.3s | 过 0.6s 每段各自为政 | 低于 0.15s 几段几乎同时，分不出顺序 |\n| swell 虚焦时的放大 | 1.07 | 过 1.15 相邻的段在虚焦时互相压住 | 1 时少一点镜头的呼吸感 |\n\n## 已知坑\n\n- 虚化会让每段向外漫出 24px，再加上 1.07 倍的放大，相邻两段在虚焦状态下是互相渗进去的；这正是“大面积虚焦”想要的样子，但段与段之间如果有不同颜色（比如最后一段是强调色），交界处会混出一小块脏色，只持续开头零点几秒。\n- 虚化滤镜是按段加在整块上的。段很长（八个字以上）时那一块的渲染面积大，成片渲染会明显变慢；一段控制在六个字以内。\n- 分段符 `|` 不会显示，段与段是直接连排的。需要逗号就把逗号写在前一段的末尾。\n- 整句超过一行时会自动折行，但折行点只会落在段与段之间；某一段特别长会让上一行右边空出一大截。\n- 透明模式压在实拍上时，虚焦的字和背景的对比很低，前半段基本看不到；这时把 `haze` 提到 0.8。\n\n## 动效与皮的边界\n\n属于这张卡的：整句预先以虚焦状态在场、按意群逐段对焦、每段带一次小幅回摆、对焦时轻微缩小。\n\n只是皮：最后一段用不用强调色、字号字重、分成几段、有没有实底。\n\n## 接进片子\n\n- 变量：`text` 一句话，用 `|` 按意群分成两到四段（对焦顺序就是书写顺序）；`step` 段间隔；`backdrop`。\n- 时间：第 i 段（从 0 数）在 0.5 + i × 0.3 秒开始变清，0.4 秒后可读。把每段开始变清的时刻对到旁白说这一段的开头；旁白慢的话加大 `step`。\n- 音效：整句一个缓慢上扬的垫音即可；不建议每段配一个音，会把安静的气质打碎。\n- 常见接法：句子锁实后用 `underline-draw` 给最后一段画线；章节标题用 `tracking-settle`，正文里的关键句用这张。"},{"id":"bokeh-drift","name":"光斑漂浮","group":"幕底与氛围","type":"structure","intents":[],"numbers":null,"chart":null,"one_line":"十五个大小不一的虚化光斑整镜缓慢上浮并轻微左右摆，大的近、升得多摆得宽，小的远、几乎不动","use_when":"语气放松、偏感性的段落：开场寒暄、收尾致谢、讲一个小故事，需要一点温度和景深但没有具体画面","energy":"低","needs":["无"],"overlay":false,"slot":6,"hero":3,"sfx":"none","pairs_with":["line-rise","quote-pull","subscribe-cta"],"vars":[{"id":"title","type":"string","label":"示例标题（留空不显示）","default":"光斑往上漂，标题不动"},{"id":"speed","type":"number","label":"速度倍数","default":1},{"id":"strength","type":"number","label":"色光浓度（0–1）","default":0.7}],"frames":[0.5,1.75,3,4.25,5.5],"doc":"## 命门\n\n1. **大小决定速度。** 直径 400px 的光斑 6 秒上升 300px，52px 的只升约 100px；摆幅也是大的 ±46px、小的 ±18px。所有光斑同速上升，就是一张贴图在整体上移，没有景深。\n2. **越大越透明。** 最大的光斑透明度只有 0.16 到 0.2，最小的到 0.5。大光斑做得和小光斑一样实，几个大圆会把标题后面整片盖住。\n3. **只升不闪。** 光斑全程不改变透明度和大小。让它们忽明忽暗，就成了节日彩灯，注意力会被每一次变亮拉走。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 6s | 每个光斑 | 匀速上升，距离 = 300px ×（0.25 + 0.75 × 直径 ÷ 400），以原位为中点 | 线性 |\n| 0 → 6s | 大的四个（250–400px） | 左右摆一个来回，摆幅随直径最大 ±46px | sine.inOut，往返 |\n| 0 → 6s | 中等的五个（130–220px） | 左右摆一个到一个半来回 | sine.inOut |\n| 0 → 6s | 小的六个（52–110px） | 6 秒只从一侧摆到另一侧，摆幅约 ±18px | sine.inOut |\n\n相邻编号的光斑摆动方向相反。光斑的位置、大小、颜色、透明度都写死在 CFG 的 `spots` 里，没有随机数。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| speed（变量） | 1 | 过 1.8 大光斑像气泡往上冒，开始抢戏 | 0.4 以下只剩左右轻摆 |\n| strength（变量） | 0.7 | 1 时浅色皮下光斑像彩色贴纸 | 0.35 以下小光斑看不见了 |\n| rise（CFG） | 300px | 过 500 大光斑会从底下升出画面顶端 | 100 以下大小光斑的速度差看不出来 |\n| sway（CFG） | 46px | 过 90 像水草在摆，有明显节拍 | 0 时是笔直上升，略显机械 |\n| spots 的个数 | 15 | 过 25 画面变花，标题周围没有干净的地方 | 少于 8 个显得稀，像镜头上的脏点 |\n\n## 已知坑\n\n- 光斑的软边是径向渐变画的：中间六成是平的，边缘稍亮一圈再淡出，这是镜头虚化的样子。不要用 `filter: blur` 去糊一个实心圆，十五个大模糊会让渲染慢很多。\n- 上升是以原位为中点的，6 秒里不会有光斑从画面外补进来。speed 调大后画面下方会空出一截，要么加光斑、要么把 `rise` 调回去。\n- 标题正后方有一个 180px 的光斑经过。默认透明度下不影响读字；改 `spots` 时别把两个大光斑同时排到中间。\n- 两种颜色的光斑重叠处会混色。重叠本身是好看的，但三个以上叠在一起会出现一块明显更亮的区域。\n- 光斑是脚本按 `spots` 生成的，不跑脚本时画面只有底色和标题。预览不出光斑时先看控制台有没有报错。\n\n## 动效与皮的边界\n\n属于这张卡的：大小、速度、透明度三者联动的景深关系，匀速上浮加轻微横摆，全程不闪不缩放。\n\n只是皮的：光斑的颜色、个数、形状（圆、六边形都可以）、边缘亮圈的有无、上浮还是下沉。\n\n## 接进片子\n\n- 变量：`title` 是演示用的标题，接进片子时留空，把文字卡叠在更高的轨道上；`speed` 是上升距离的倍数；`strength` 是光斑整体的浓度。\n- 时间：整镜铺满，不用对齐旁白。\n- 音效：没有。\n- 常见接法：`line-rise`、`quote-pull` 的幕底，或片尾 `subscribe-cta` 下面。文字本身也在上移时，把 speed 降到 0.6，免得两种上移叠在一起。"},{"id":"bracket-frame","name":"角标取景框","group":"标注与手绘","type":"evidence","intents":["point"],"numbers":null,"chart":null,"one_line":"四个直角先松松地出现在目标外一圈，然后同时向内收紧、略微收过头再回到位，最后闪两下表示对上了","use_when":"要把观众的注意力框在画面里的一块区域上（一行、一张卡片、一个人脸），语气是“锁定”“就看这一块”，而不是手写批注","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":2,"sfx":"close=whoosh, lock=tick","pairs_with":["label-callout","crash-zoom"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":140},{"id":"y","type":"number","label":"目标左上角 y","default":572},{"id":"w","type":"number","label":"目标宽","default":580},{"id":"h","type":"number","label":"目标高","default":158},{"id":"pad","type":"number","label":"扣住后离目标的余量（像素）","default":16},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.167,0.3,0.367,0.567,2],"doc":"## 命门\n\n1. **四个角完全同步。** 同一帧出发、同样的距离（90px）、同一条曲线。这是它和手绘圈的根本区别：四个角有一丝先后，读起来就是四个小图标各自飘过来，不是一台机器在对焦。\n2. **收过头再回来。** 先收到比最终位置再靠里 10px，再用 0.16 秒退回。这一进一退是相机“找焦”的动作；直接停在最终位置只是一个框缩小了。\n3. **到位后闪两下，然后不动。** 每下 0.13 秒，透明度掉到 0.2 再回来。闪是“确认”；闪三下以上像报警，不闪则看不出哪一帧是锁定。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.30s | 四个角 | 在最终位置外 90px 处淡入 | 线性 |\n| 0.30 → 0.56s | 四个角 | 一起向内收，收到最终位置再往里 10px | power3.out |\n| 0.56 → 0.72s | 四个角 | 退回最终位置 | sine.inOut |\n| 0.74 → 1.01s | 四个角 | 透明度 1 → 0.2 → 1，连闪两次 | 线性 |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| loose 起始外扩 | 90px | 过 200px 像四个角从屏幕外飞进来，变成转场 | 低于 45px 看不出在收紧 |\n| over 收过头 | 10px | 过 24px 像弹簧，失去机器的克制 | 0 就没有找焦的那一下 |\n| close 收紧时长 | 0.26s | 过 0.5s 像慢慢缩放 | 低于 0.15s 只看到结果 |\n| blink 闪烁半周期 | 0.067s | 过 0.1s 变成慢闪，像待机灯 | 低于 0.034s 在 30 帧下拍不到 |\n| line 线宽 | 14px | 过 20px 角像两块色块，压住目标旁边的内容 | 低于 10px 在录屏上发细 |\n| pad（变量） | 16px | 框松，适合框住一组东西 | 低于 over 的值时收过头那一帧会压到目标 |\n\n## 已知坑\n\n- `pad` 小于 `over`：收过头的那一帧角会压在目标上。要贴得很紧就把 `over` 一起改小。\n- 目标很小（短边小于 100px）：角的臂长最短 48px，四个角会几乎连成一个框。小目标把 `pad` 加到 30 以上，或者改用 `circle-scribble`。\n- 角的臂长是短边的 50%，最长 140px（默认示例是 79px）。很大的目标（整屏的一半）角会显得细小，这时把线宽 `line` 和臂长上限一起加大。\n- 深色包边是用阴影滤镜做的，在纯黑底上看不出来，不影响；在强调色相近的底上才靠它。\n- `blink` 是按 30 帧取的整两帧（0.067 秒）。导出 25 帧的片子时改成 0.08，否则两次闪烁明暗不齐。\n\n## 动效与皮的边界\n\n属于这张卡的：四角同步、从外向内收紧、收过头再回位、到位后的两次闪烁。\n\n只是皮：线宽、臂长、颜色、直角还是带一点圆角、闪烁时掉到多暗。\n\n## 接进片子\n\n- 默认演示（`backdrop: on`）垫的是示例截图放大 2 倍后的任务列表区域（原图 340,110 起的 960×540 一块铺满画面）；默认目标是第二行的圆圈、标题和副标题这一组（140,572 起、580×158），四个角扣住后外沿是 640×218。\n- 变量：`x / y / w / h` 是目标外框，`pad` 是扣住之后角离目标的距离，`backdrop` 填 `off` 时透明压在录屏或实拍上。\n- 时间：旁白说到目标的那个词对齐 0.56 秒（收到最紧的那一帧），这一镜提前 0.56 秒开始。\n- 音效：0.3 秒起一声短的掠过音跟着收紧；0.74 秒一声“滴”配第一下闪烁。\n- 常见接法：扣住之后接 `label-callout` 给它起名；或者扣住的同时让底下的画面推近。"},{"id":"branch-tree","name":"分叉树","group":"结构与流程","type":"structure","intents":["branch"],"numbers":null,"chart":null,"one_line":"顶上一个问题，向下一条条画出枝线，每条枝线画到底时它的选项才出现；最后其中一个选项被填亮放大，其余变暗","use_when":"旁白在说“遇到这种情况，有几条路可走……我们选这一条”，选项二到五个，各是一个短语","energy":"中","needs":["文"],"overlay":true,"slot":4.8,"hero":4.4,"sfx":"branch=draw, option=pop, pick=chime","pairs_with":["flow-nodes","spotlight-dim"],"vars":[{"id":"question","type":"string","label":"顶上的问题","default":"结果不理想？"},{"id":"items","type":"string","label":"选项（用 | 分隔，2–5 个）","default":"换个问法|补充背景|从头重来"},{"id":"pick","type":"number","label":"被选中的是第几个（0 = 都不选）","default":2},{"id":"cues","type":"string","label":"每个选项出现的秒数，最后可多写一个给“选中”（逗号分隔）","default":"0.9,1.7,2.5,3.5"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.05,0.75,1.9,2.67,4.4],"doc":"## 命门\n\n1. **枝线画到底，选项才存在。** 每条枝线在 cue 之前 0.45 秒从问题下方出发，cue 那一帧到达，选项这时才弹出来。选项先摆好再补线，读成“给三个框连上线”，不是“从问题里分出来的路”。\n2. **列举和选择是两个阶段，亮法不一样。** 列举时：当前选项白字加强调色描边，讲过的变灰。选择时：被选中的整块填成强调色、放大到 1.1 倍、它的枝线加粗到 16px 回到全亮；其余选项是灰字，枝线降到 30%。列举时就把某一个填亮，等于提前剧透；选择时只是描个边，分量不够。\n3. **问题节点始终是白的、不动的。** 它是所有枝线的起点，观众要靠它记住“我们在回答什么”。问题在选项出来后变暗或缩小，树就没有根了。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.12 → 0.47s | 问题节点 | 0.85 → 1 倍弹出 | back.out(2) |\n| cue − 0.45 → cue | 这个选项的枝线 | 从问题下方画到选项上方（S 形曲线） | power2.inOut |\n| cue → +0.32s | 选项 | 从上方 30px、0.9 倍落到位，白字带描边 | back.out(1.7) |\n| 下一个 cue → +0.3s | 上一个选项 | 字变灰，描边撤掉，枝线降到 45% | power2.out |\n| hit → +0.12s | 被选中的选项 | 填色淡入，字在填到一半时切成深色 | 线性 |\n| hit → +0.16 → +0.46s | 被选中的选项 | 放大到 1.16 倍再落到 1.1 倍 | power3.out，back.out(2.2) |\n| hit → +0.25s | 被选中的枝线 | 回到全亮，线宽 9 → 16px | power2.out |\n| hit → +0.3s | 其余枝线 | 降到 30%；最后一个没被选中的选项变灰 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 枝线绘制时长 | 0.45s | 过 0.7 线比旁白慢 | 低于 0.2 线是闪出来的 |\n| optIn 选项落位时长 | 0.32s | 过 0.5 发软 | 低于 0.18 没有“长出来”的感觉 |\n| win 选中后的倍数 | 1.1 | 过 1.2 五个选项时会碰到邻居 | 1.0 时只靠填色，可以但弱 |\n| lose 落选枝线的亮度 | 0.3 | 过 0.6 和选中的分不开 | 0 时树只剩一根线，看不出是选出来的 |\n| fill 选中填色时长 | 0.12s | 过 0.25 选中发软 | 0 是硬切 |\n| fonts 各条数的字号 | 104 / 96 / 80 / 64px（2 / 3 / 4 / 5 个），问题 104px | 三个四字选项在 96px 时放大后已经占满 600px 的列 | 低于 56px 选项读不清 |\n\n## 已知坑\n\n- 枝线用 `pathLength=\"1\"` 归一后画，不用量曲线长度；线帽用平头，圆头在还没开始画时会在起点露一个点。\n- 选中时字色要换两次：先在 hit 那一帧切回白色（它可能已经是灰的），填色淡到一半再切成深色。直接从灰切到深色，中间有几帧是灰字压半透明的黄，读不出来。\n- 选项的宽度跟着字数走，但字号按“列宽 ÷（字数 + 1）÷ 1.16”封顶，保证放大后不碰邻居。整排宽 1800px，问题和选项的框都高 200px。五个选项时每列 360px，三个字是 64px，四个字就掉到 56px。\n- `pick` 填 0 表示不选：这时最后一个选项会一直保持白字描边，没有收尾。这种用法只适合“先列出来，下一镜再选”。\n- 选项只排一行。超过五个或者有第二层分叉，这张卡做不了，拆成两镜：先分大类，再在选中的那一类下面分一次。\n\n## 动效与皮的边界\n\n属于这张卡的：枝线从同一个根出发、线先到选项后出、列举时逐个点亮并退灰、最后一次性地选中一个并压暗其余。\n\n只是皮：枝线是曲线还是折线、节点的形状、选中用填色还是打勾、根在上面还是在左边（横着分叉也成立）、强调色。\n\n## 接进片子\n\n- `question`：顶上的问题。`items`：选项，`|` 分隔，2–5 个。`pick`：选中第几个（从 1 数），0 表示不选。\n- `cues`：前几个数是每个选项出现的秒数，对齐旁白说出这个选项的词；最后多写的一个数是“选中”的时间，对齐旁白说“我们选……”“更好的是……”的那个词。第一个不早于 0.7 秒。\n- `backdrop`：`off` 时透明，问题和选项都自带底板，枝线是细线，底下画面太花时先压暗。\n- 音效：每条枝线出发时一个轻的 draw，选项落位时一个 pop，选中那一帧一个 chime。\n- 接法：选中以后，下一镜直接展开被选中的那一项（录屏或 `flow-nodes`）；想在选中时把其余部分压得更暗，叠一层 `spotlight-dim`。"},{"id":"browser-rise","name":"浏览器窗升起","group":"证据与界面","type":"evidence","intents":["software","result"],"numbers":null,"chart":null,"one_line":"一个只有三个圆点和地址栏的浏览器窗从画面下方向后仰着升上来，边升边立直；快停稳时地址栏开始逐字打出网址，打完后页面内容才淡入","use_when":"要引出一个网站、一篇在线文档或一个网页工具，需要一个“我们现在打开它”的开场","energy":"中","needs":["网页"],"overlay":true,"slot":4,"hero":3.4,"sfx":"rise=rise, typing=type","pairs_with":["page-scroll-park","cursor-click","screen-push-focus"],"vars":[{"id":"url","type":"string","label":"地址栏里的网址（不带协议头）","default":"docs.example.com/guide/start"},{"id":"src","type":"string","label":"网页截图地址（从项目根目录写起，取顶部）","default":"motion-cards/lib/samples/page.png"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,0.5,0.8,1.7,3.4],"doc":"## 命门\n\n1. **绕底边立起来。** 窗口的转轴在底边：起始向后仰 46°，升起的同时立直。转轴放在中心，窗口是在原地翻牌；不带倾角直着上移，就只是普通的滑入，没有“从桌面上立起来”的体积感。\n2. **全程只减速。** 升起用 0.95 秒的减速缓动，一出现就是最快的。两头缓的话，起步那一下会显得窗口很沉、很犹豫。\n3. **网址抢在停稳之前，内容等在网址之后。** 窗口落定前 0.2 秒地址栏就开始打字，两个动作有交叠；页面内容要等网址打完再过 0.18 秒才出现。窗口一上来就带着内容，地址栏打字就成了摆设。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.25 → 1.2s | 浏览器窗 | 从下方 640px 升到位，后仰 46° → 0°，缩放 0.84 → 1；转轴在底边 | power3.out |\n| 0.25 → 0.47s | 浏览器窗 | 淡入 | 线性 |\n| 1.0 → 2.08s | 地址栏文字（28 个字符） | 逐字出现，每秒 26 个 | 线性，取整 |\n| 1.0 → 2.26s | 地址栏下的加载线 | 从左长到 70% | power1.out |\n| 2.26 → 2.46s | 加载线 | 走完剩下的 30%，随后 0.25 秒淡出 | power2.out |\n| 2.26 → 2.66s | 页面内容 | 上移 26px 淡入；地址栏光标同时消失 | power2.out |\n\n透视距离 1700px，视点在画面高度的 40%。\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| tilt 起始后仰 | 46° | 过 60° 起始几乎是一条线，升起时变形太猛 | 低于 20° 看不出立起来，像普通上滑 |\n| drop 起始下移 | 640px | 过 900px 前几帧窗口完全在画面外，白等 | 低于 300px 没有“升”的路程 |\n| rise 升起时长 | 0.95s | 过 1.4s 沉重 | 低于 0.6s 透视变化太快，看着晕 |\n| cps 网址打字速度 | 26 字符/秒 | 过 40 网址像贴上去的 | 低于 15 一个网址要打两秒，观众等不及 |\n| loadGap 打完到出内容 | 0.18s | 过 0.6s 像网速很慢，除非你就是要这个效果 | 0 时内容和最后一个字符同帧，看不出因果 |\n\n## 已知坑\n\n- 起始那几帧窗口带着透视，底边比画面还宽，而且大半在画面下方，校验会报溢出。这是有意的，在窗口上加了 `data-layout-allow-overflow`。\n- 网址不要带协议头。库的格式检查会把任何带协议头的字符串当成“引用了网络资源”拦下来；画面上的地址栏本来也不显示它。\n- 页面截图是按 1620px 宽铺的，高度在样式里写死成示例图的比例（4252px）。换了自己的截图，脚本会把高度改成自动；截图加载前高度是 0，所以它必须是本地文件，不能是慢速来源。\n- 转轴在底边时，缩放也是以底边为原点的。如果再给窗口加一条“落定时轻轻一弹”的缩放，记得原点一致，不然窗口会上下窜。\n- 透视是加在窗口的父层上的。把这张卡再套进一个带 3D 变换的容器里，两层透视会叠加，倾角看起来翻倍。\n\n## 动效与皮的边界\n\n属于这张卡的：绕底边后仰着升起并立直、全程减速、网址和落定交叠、内容在网址之后出现。\n\n只是皮：窗口的圆角和边线，三个圆点的颜色，地址栏的形状和锁形图标，加载线有没有，页面里放什么。\n\n## 接进片子\n\n- 变量：`url` 网址，不带协议头；`src` 页面截图（取顶部）；`backdrop`。\n- 窗口 1.2 秒落定，网址 2.08 秒打完，内容 2.66 秒完整出现。旁白念出网站名字的时刻对在 1.0–2.0 秒之间。\n- 音效：0.25 秒一个上扬的声音，1.0–2.08 秒一段打字声。\n- 接法：内容出现后接 `page-scroll-park` 往下滚，或者接 `cursor-click` 点页面上的入口。"},{"id":"canvas-tour","name":"大画布巡游","group":"镜头运动","type":"evidence","intents":["process","steps"],"numbers":null,"chart":null,"one_line":"三块内容摆在一张大画布上，镜头在每块上停 0.9 秒、用 1 秒飞到下一块，飞的途中略微拉远，全程一个镜头不切","use_when":"旁白按顺序讲三四个并列或先后的东西（步骤、模块、案例），而且它们之间的位置关系本身就是信息","energy":"中","needs":["多图"],"overlay":false,"slot":5.5,"hero":2.4,"sfx":"move1=whoosh, move2=whoosh","pairs_with":["pull-reveal","crash-zoom","progress-rail"],"vars":[{"id":"s1","type":"string","label":"第一块的图片地址","default":"motion-cards/lib/samples/p1.jpg"},{"id":"t1","type":"string","label":"第一块的标题","default":"第一步 · 收集素材"},{"id":"s2","type":"string","label":"第二块的图片地址","default":"motion-cards/lib/samples/ui.png"},{"id":"t2","type":"string","label":"第二块的标题","default":"第二步 · 排进任务表"},{"id":"s3","type":"string","label":"第三块的图片地址","default":"motion-cards/lib/samples/p3.jpg"},{"id":"t3","type":"string","label":"第三块的标题","default":"第三步 · 导出检查"},{"id":"hold","type":"number","label":"每一块停多久（秒）","default":0.9},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,1.4,2.4,3.3,4.6],"doc":"## 命门\n\n1. **不切镜，途中看得见路。** 两块之间镜头是连续移动的，画布上有点阵和连线，飞行时它们从画面里划过。直接跳到下一块，或者中间是一片纯色，观众得不到“它们在同一张图上”的信息，那就不如直接切。\n2. **走一段，停一段。** 移动 1 秒（`power3.inOut`），停 0.9 秒。不停就一路滑过去，哪一块都没看清；停的时候完全静止，又像三张幻灯片。停留期间镜头仍在以 2.5% 的幅度缓推。\n3. **飞行途中拉远一点。** 移动的中点整个视野缩到 0.86 倍再回来。没有这一下，镜头是贴着画布平移的，像在拖动一张图；有了它才像镜头抬起来、越过去、再落下。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.9s | 镜头 | 停在第一块（画布坐标 900, 666，1.18 倍），缓推 2.5% | none |\n| 0.9 → 1.9s | 镜头 | 飞到第二块（3000, 1107，0.9 倍） | power3.inOut |\n| 0.9 → 1.4 → 1.9s | 整个视野 | 缩到 0.86 倍再回到 1 | sine.inOut 两段 |\n| 1.9 → 2.8s | 镜头 | 停在第二块，缓推 2.5% | none |\n| 2.8 → 3.8s | 镜头 | 飞到第三块（1680, 2172，1.3 倍），途中同样拉远到 0.86 | power3.inOut |\n| 3.8 → 4.7s | 镜头 | 停在第三块，缓推 2.5% | none |\n\n每一块的停留倍数按“块宽 × 倍数 ≈ 1320px（画面的 69%）”来定：1120×1.18、1480×0.9、1000×1.3。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| hold 每块停留（变量） | 0.9s | 按旁白拉长到 2–4 秒都可以，停留时的缓推会跟着变慢 | 低于 0.5s 来不及读标题 |\n| move 飞行时长 | 1s | 两块相距很远（超过 3000px）时加到 1.3s | 低于 0.7s 途中的东西糊成一片，接近甩镜 |\n| dip 途中拉远 | 0.86 | 0.7 时每次移动都像回到总览，适合块很多的画布 | 1.0 时是纯平移 |\n| creep 停留缓推 | 2.5% | 过 5% 停留变成推镜 | 0 时停留是定格 |\n| 块与块的间距 | 中心相距 1700–2200px | 再远就需要更长的飞行时间和更大的地面 | 小于 1400px 时停在一块上能看到另一块的边，画面不干净 |\n\n## 已知坑\n\n- 不在画面里的那两块，检查会报文字超出画布。画布层上加了 `data-layout-allow-overflow`，加块、改结构时要保留在所有块的共同祖先上。\n- 图片被裁：第一版每一块的高度是随手写的，图片区域不是 16:9，示例图底部自带的小字被切掉半行。现在三块的尺寸都是按“图片区正好 16:9”算的（宽 1120 → 高 732，1480 → 934，1000 → 664）。换成别的比例的图要重算块高，或者接受裁切。\n- 标题字号要按最小倍数算：标题在画布上是 48px，第二块只放大到 0.9 倍，实际 43px，刚过 40px 的线。再加一个更大的块（倍数低于 0.84）时标题就要加到 52px 以上。\n- 点阵地面不是无限的：现在是 7200×5000，四周比三块的范围各多出一千多像素。把块摆到更远、或者把 `dip` 调到 0.7 以下之前，先确认飞行途中视野的四角还在地面里，否则会看到点阵的边。\n- 停留的终点和下一段飞行的起点是同一个状态（已经推近了 2.5%），所以每次起飞都是从“稍微近一点”的位置出发；改 `creep` 不需要动别的数字，但别把停留和飞行拆成两条各自从固定值出发的动画，会在衔接处跳一下。\n\n## 动效与皮的边界\n\n属于这张卡的：一张连续的大画布、走停交替的镜头、位置和倍数同步变化、途中的轻微拉远、停留时不死。\n\n只是皮：块的数量和摆法、块里放图还是放界面、标题样式、连线画成虚线还是箭头、地面是点阵还是网格还是什么都没有。\n\n## 接进片子\n\n- 变量：`s1`–`s3` 三块的图片地址，`t1`–`t3` 三块的标题，`hold` 每块停多久，`backdrop`（填 `off` 时底色和点阵一起去掉，只剩块和连线）。\n- 块的位置和每一站的倍数写在脚本顶部的 `CFG.stops` 里，加一块就加一行（画布坐标的中心点和倍数），同时在样式里给它一个位置。\n- 对旁白：每一站对应旁白的一句。把 `hold` 调成一句话的长度减 1 秒，让镜头在句子结束前半秒起飞、下一句开头时落定。三句长短差很多时，把 `hold` 改成每站一个值。\n- 音效：每次起飞（默认 0.9 秒和 2.8 秒）一个 1 秒以内的掠过声，落定不加重音。\n- 连用：开场先用 pull-reveal 的思路给一眼全貌再进第一站；某一站需要强调时落定后接 crash-zoom；画面角落可以常驻一条进度条类的卡标出“第几站”。"},{"id":"card-assemble","name":"信息卡拼装","group":"结构与流程","type":"structure","intents":["definition","categories"],"numbers":null,"chart":null,"one_line":"一张信息卡的边框先一笔画出来，里面是灰色的占位条；然后标题、图标、几行要点、底部标签依次落进各自的位置","use_when":"旁白要介绍一个概念或一个工具的“身份卡”：先报名字，再说两到五个要点，最后给它归个类","energy":"中","needs":["文"],"overlay":true,"slot":5,"hero":4.6,"sfx":"frame=draw, item=tick","pairs_with":["label-callout","checklist-tick"],"vars":[{"id":"title","type":"string","label":"卡片标题","default":"写好提示词"},{"id":"items","type":"string","label":"要点（用 | 分隔，2–5 条）","default":"先说清楚目标|再给一个示例|最后限定格式"},{"id":"tag","type":"string","label":"底部标签","default":"三步法"},{"id":"cues","type":"string","label":"每条要点落位的秒数（逗号分隔，第一条不早于 1.4 秒）","default":"1.6,2.4,3.2"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.05,0.4,1.25,2.57,4.6],"doc":"## 命门\n\n1. **先有框和空位，再有内容。** 边框用 0.55 秒一笔画完，卡面淡入，同时每个位置出现一条 16% 透明的灰色占位条；内容落下的那一刻，它的占位条消失。没有占位，内容就是一行行往下加，和普通列表一样；有了占位，观众看到的是“把一张卡填满”，而且提前知道还剩几格。\n2. **要点跟旁白，标题和图标不等。** 标题在 0.85 秒、图标在 1.08 秒自己落位（这是卡的“抬头”，要在旁白讲第一条要点之前就位），要点各自对 cue。把标题也拆给旁白去对，开头会空着一个框等很久。\n3. **拼的过程里只亮最新一条，拼完全部亮回来。** 新要点落下时上一条变灰；底部标签落位后 0.1 秒，所有要点回到白色。过程中全亮，看不出讲到哪；结束时还灰着，这张卡停在画面上就是残的。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.10 → 0.65s | 边框 | 从左上角起一笔画完一圈 | power2.inOut |\n| 0.50 → 0.80s | 卡面 | 淡入 | power1.out |\n| 0.60 → 0.85s | 所有占位条、图标的虚线框 | 淡入到 16% / 45% | power1.out |\n| 0.85 → 1.21s | 标题 | 从上方 30px 落下，占位条 0.12 秒淡掉 | back.out(1.8) |\n| 1.08 → 1.48s | 图标 | 0.3 → 1 倍，从 −30° 拧正 | back.out(2.4) |\n| cue → +0.36s | 这一条要点 | 从上方 30px 落下，占位条淡掉；上一条变灰 | back.out(1.8) |\n| 最后一个 cue + 0.7s → +0.36s | 底部标签 | 落下（间隔不超过最后两条要点的间隔） | back.out(1.8) |\n| 标签 + 0.1s → +0.3s | 所有要点 | 回到白色 | power2.out |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| frame 边框绘制时长 | 0.55s | 过 0.9 开场太慢，标题要跟着往后挪 | 低于 0.3 看不出是画的 |\n| ghost 占位条透明度 | 0.16 | 过 0.3 占位条比内容还抢眼 | 0 时没有空位，变成普通列表 |\n| drop 下落距离 | 30px | 过 32 会和上一行的字叠在一起（行高 112px，字高 76px，行间只空 36px；五条时是 104 / 72 / 32px） | 低于 15 只是淡入 |\n| land 落位时长 | 0.36s | 过 0.55 发飘 | 低于 0.2 没有落的过程 |\n| tagLag 标签比最后一条晚 | 0.7s | 过 1.2 像忘了又补上 | 低于 0.4 和最后一条要点叠在一起 |\n\n## 已知坑\n\n- 卡宽 1480px，高度跟着要点条数变（432 + 112 × 条数；五条时每行收到 104px、字 72px），边框的画布和矩形高度由脚本一起改。只改卡高不改边框，线会画在卡外面或者被压扁。\n- 边框用 `pathLength=\"1\"` 归一。矩形的起笔点在左上圆角之后，所以线是从上边偏左处开始顺时针走的；想换起点只能改成自己写的路径。\n- 我第一版让内容从上方 46px 落下，起点会压到上一行已经落定的字上（虽然那时还很淡）。现在把要点的行高收成 1 倍、下落改成 30px，小于行间最窄的 32px 空隙，路径上碰不到别的字。加大字号或下落距离时要重新算这笔账。\n- 第一条要点的 cue 小于 1.4 秒会被抬到 1.4，因为边框、标题、图标要先走完。这一镜的起点要比旁白讲第一条要点早 1.4 秒以上，通常正好是报名字的那句。\n- 要点 76px，一行最多约 16 个字（1240px），再长会缩字号；标题 104px，超过 10 个字也会缩。三条要点时卡高 768px；五条时卡高 952px，上下只剩 64px。\n\n## 动效与皮的边界\n\n属于这张卡的：边框先画、占位条先于内容、各部件按“标题 → 图标 → 要点 → 标签”的顺序落进固定位置、过程中只亮最新一条、拼完全亮。\n\n只是皮：卡的尺寸和圆角、图标的图形（现在是一个四角星）、要点前的圆点、标签是描边胶囊还是实心、占位条的长短。把图标位换成一张小图也成立。\n\n## 接进片子\n\n- `title`：卡片标题。`items`：要点，`|` 分隔，2–5 条。`tag`：底部标签（类别、出处、一句定位），2–6 个字。\n- `cues`：每条要点落位的秒数，对齐旁白说出这条要点的第一个词。第一个不早于 1.4 秒。\n- `backdrop`：`off` 时透明，卡自带底板和阴影，可以压在录屏或实拍上。\n- 音效：0.1 秒起一个 draw（边框），标题、图标、每条要点、标签各一个 tick，标签那个可以稍重。\n- 接法：讲完以后要在实物上指出对应位置，接 `label-callout`；要点需要逐条确认时，下一镜换 `checklist-tick`。"},{"id":"chapter-numeral","name":"巨大序号章节","group":"标题与章节","type":"structure","intents":["chapter"],"numbers":null,"chart":null,"one_line":"背景里一个顶天立地的半透明序号全程匀速横移，前景的章节标题从遮罩里升起，短线和说明行跟着依次到位","use_when":"讲解分成几大段，每段开头需要一个安静但有体量的章节页；旁白在说“第二步”“接下来”","energy":"低","needs":["文"],"overlay":true,"slot":4,"hero":1.6,"sfx":"title=rise, rule=tick","pairs_with":["progress-rail","title-to-corner"],"vars":[{"id":"num","type":"string","label":"序号（1–2 位）","default":"02"},{"id":"title","type":"string","label":"章节标题","default":"把任务拆成小步"},{"id":"sub","type":"string","label":"标题下的一行（可空）","default":"一次只让它做一件事"},{"id":"drift","type":"number","label":"序号在整段里滑过的距离（px，负数向左）","default":-170},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.3,0.65,0.95,1.6,3.8],"doc":"## 命门\n\n1. **序号不停。** 序号用线性缓动在 4 秒里走完 170px，从第一帧动到最后一帧。给它加减速，它会在某一刻停下，画面跟着死掉；它的作用就是在标题落定之后让画面还活着。\n2. **序号只是底纹。** 不透明度 0.1。到 0.2 以上它会和前景标题抢读，观众先念“02”再念标题，层次就反了。\n3. **前景按阅读顺序来。** 标题 0.45 秒先到，短线晚 0.3 秒从左画出，说明行再晚 0.2 秒。三样同帧出现就是一张静态版式淡入。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 4.0s | 序号 | 从右偏 85px 匀速移到左偏 85px | 线性 |\n| 0 → 0.7s | 序号 | 不透明度 0 → 0.1 | power1.out |\n| 0.45 → 1.00s | 标题（168px） | 在遮罩里从下方整行升起（108% → 0） | power3.out |\n| 0.75 → 1.15s | 短线 | 从左端画出，180px 长、14px 粗 | power2.out |\n| 0.95 → 1.35s | 说明行（72px，次要文字色） | 从左 24px 滑入并淡入 | power2.out |\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| drift 序号滑动距离（变量） | -170px | 过 ±300 序号会明显滑出画面，像在赶路 | 低于 ±80 在 4 秒里几乎看不出在动 |\n| numAlpha 序号浓度 | 0.1 | 0.2 以上压标题 | 0.05 以下在压缩后的视频里会消失 |\n| titleDur 标题升起时长 | 0.55s | 过 0.9s 拖沓 | 低于 0.3s 变成弹出，和这张卡的安静气质不合 |\n| ruleGap 短线滞后 | 0.3s | 过 0.6s 短线像是另一件事 | 0 时和标题糊成一个动作 |\n| span 序号滑动总时长 | 4s | 必须等于这张卡在片里的时长 | 比片里的时长短，序号会提前停住 |\n\n## 已知坑\n\n- 序号字号 1280px，两位数宽约 1450px。最初把它贴着右边放，起始位置的“2”被画面切掉一截；现在右边留 70px，向左滑。三位数放不下。\n- 1280px 的字，字框有 1690px 高，上下各伸出画面 300px 左右。序号写成普通文字时，校验报“文字超出画布”（而且只在某几次取样时报）。现在序号用 `::before` 从 `data-d` 属性画出来，当作底纹而不是文案；手工改序号要改这个属性。\n- 把这张卡拉长到 6 秒用时，`span` 要一起改成 6，否则序号在 4 秒处停住，后 2 秒是死画面。\n- 前景从左 140px 起排，标题 168px、说明行 72px。标题超过 8 个字（约 1370px）会压到序号最浓的笔画上，对比下降，10 个字顶到右边缘；长标题拆成“标题 + 说明行”。说明行最多 22 个字，再长要换行或减字，不要把它缩到 44px 以下。\n- 标题遮罩上下各留了 6px。换成带长下行笔画的西文字体时，升起过程中字的下缘会被切，要把遮罩的内边距加大。\n\n## 动效与皮的边界\n\n属于这张卡的：占满画面高度的序号、它的低浓度和全程匀速滑动、前景“标题 → 短线 → 说明”的顺序。\n\n只是皮：序号是实心还是描边、用墨色还是强调色，前景靠左还是靠右，短线的长短粗细，字体字重。序号换成一个单字（“壹”“A”）也成立。\n\n## 接进片子\n\n- 变量：`num` 序号；`title` 章节标题；`sub` 说明行，传空字符串不显示；`drift` 序号滑动距离，负数向左；`backdrop`。\n- 对齐：起点对在旁白说“第二步”之前 0.4 秒，标题在 0.45 秒开始升。\n- 音效：标题升起时一个轻的上扬声；短线画出时可以加一下很轻的滴答，也可以不加。\n- 连用：章节页之后接 `title-to-corner` 把标题收成角标，或者接 `progress-rail` 标出现在是第几段。"},{"id":"char-cascade","name":"逐字落位","group":"字与强调","type":"structure","intents":["keyword","hook"],"numbers":null,"chart":null,"one_line":"一行大字逐字从上方歪着掉下来，从左到右一个接一个砸到基线上，各自回弹一下站直","use_when":"一句短口号、一个小标题要有“被一个字一个字摆出来”的仪式感，旁白语速偏慢或者干脆没有旁白","energy":"中","needs":["文"],"overlay":true,"slot":3,"hero":2.4,"sfx":"land=tick","pairs_with":["underline-draw","highlighter-swipe"],"vars":[{"id":"text","type":"string","label":"一行大字（建议 4–9 个字）","default":"先跑通，再优化"},{"id":"key","type":"string","label":"上强调色的词（可空）","default":"跑通"},{"id":"step","type":"number","label":"相邻两个字的间隔（秒）","default":0.055},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.1,0.36,0.5,0.66,2.4],"doc":"## 命门\n\n1. **每个字的来路不一样。** 下落高度和初始倾角沿着这行字按正弦起伏（高度 100–200px，倾角 ±26°），所以看上去是一道波浪扫过去。所有字用同一个高度和角度，就成了机械的阶梯动画。\n2. **间隔远小于下落时长。** 相邻两字只差 0.055 秒，单字下落要 0.5 秒，任何时刻都有四五个字同时在空中。间隔拉到 0.15 秒以上就是打字机，不是“落”。\n3. **落地要过头一点。** back.out(1.9)：字会先多沉下去约 10% 再弹回基线，倾角也跟着回摆过零。去掉回弹，字像被吸到位置上，没有重量。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 + i×0.055s 起，持续 0.10s | 第 i 个字 | 透明 → 不透明 | 线性 |\n| 0.20 + i×0.055s 起，持续 0.50s | 第 i 个字 | 从上方 150 ± 50px、倾角 ±26° 内落到原位并摆正，原点在字的下部（50% 80%） | back.out(1.9) |\n\n默认 7 个字：第一个字 0.20 秒出发，最后一个字 0.53 秒出发、1.03 秒停稳。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| step 字间隔（变量） | 0.055s | 过 0.12s 变成逐字蹦，波浪断开 | 低于 0.03s 整行一起掉，看不出顺序 |\n| fall 单字下落时长 | 0.5s | 过 0.8s 像羽毛飘 | 低于 0.3s 回弹被压扁，只剩一抖 |\n| drop 下落高度 | 150px | 过 260px 字会从画面外来，抢戏 | 低于 60px 只是原地晃一下 |\n| swing 最大倾角 | 26° | 过 45° 像撒了一把字，适合搞笑段落 | 低于 10° 波浪感消失 |\n| back 回弹强度 | 1.9 | 过 3 字会明显下坠再弹起，偏卡通 | 1 以下基本没有回弹 |\n\n## 已知坑\n\n- 标点也是一个“字”：逗号、句号同样会掉下来，而且它们的墨迹在字框的左下角，旋转时甩动幅度比汉字大。句中标点多的句子，把 `swing` 降到 15 以内。\n- 字数多了会超宽：168px 的字放 9 个就到 1512px。脚本在超过 9 个字时会按 1560 ÷ 字数自动缩字号，但超过 14 个字已经不像“大字”，应该换 `line-rise`。\n- 透明度只用 0.1 秒就到位。如果让透明度跟着整个 0.5 秒的下落慢慢淡入，前半程的字是半透明的，叠在一起会糊成一片灰。\n- 变形原点放在正中间时，倾角回摆像字在原地转；放在下部（80%）才像脚先着地、身子再摆正。\n- 一个英文单词会被拆成单个字母逐个掉，字母宽度不一，节奏会忽快忽慢。纯英文短词可以用，中英混排的长句不合适。\n\n## 动效与皮的边界\n\n属于这张卡的：逐字、自上而下、带倾角、间隔远小于时长的叠压、落地回弹、高度和倾角沿行起伏。\n\n只是皮：字号字重、哪个词上强调色（`key`）、有没有实底、整行居中还是靠左。\n\n## 接进片子\n\n- 变量：`text` 一行字（4–9 个字最合适）；`key` 其中要上强调色的词，留空就全是正文色；`step` 字间隔；`backdrop`。\n- 时间：整行在 0.2 + 字数 × 0.055 + 0.5 秒时全部停稳（默认 7 个字是 1.03 秒）。这张卡不逐字对齐旁白，把“全部停稳”的时刻对到旁白念完这句话的时刻即可。\n- 音效：每个字落地一个很短的滴答声太密，建议只在第一个字和最后一个字落地（出发时间 + 0.3 秒左右）各放一个。\n- 常见接法：字落稳以后停半秒，再用 `underline-draw` 或 `highlighter-swipe` 标出其中的重点词。"},{"id":"chat-bubbles","name":"对话气泡流","group":"证据与界面","type":"evidence","intents":["software","result"],"numbers":null,"chart":null,"one_line":"提问的气泡从底部顶上来并把旧气泡一起推高；回答先在原位冒出三个跳动的点，接近一秒后点换成整句话；再往前的对话自动变暗","use_when":"要展示一问一答的交互过程（和助手、客服、同事的对话），重点是“问了什么、答了什么”的先后","energy":"中","needs":["文"],"overlay":true,"slot":5.5,"hero":5.2,"sfx":"bubble=pop, think=tick","pairs_with":["input-typing","lower-third","quote-pull"],"vars":[{"id":"q1","type":"string","label":"第一问","default":"怎么让回答更稳定？"},{"id":"a1","type":"string","label":"第一答","default":"先给一个例子，再说清输出格式。"},{"id":"q2","type":"string","label":"第二问","default":"格式要写多细？"},{"id":"a2","type":"string","label":"第二答","default":"列出字段名，每个字段配一行示例。"},{"id":"tag","type":"string","label":"角标（编出来的对话要标明）","default":"示例对话"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,1.4,2.2,3.1,5.2],"doc":"## 命门\n\n1. **新气泡和旧气泡一起走。** 旧气泡上移和新气泡升起用同一个时长（0.42 秒）和同一条缓动，看上去是新的把旧的顶上去。旧的先挪开、新的再淡入，就成了幻灯片换页，没有“流”。\n2. **回答要先想一下。** 三个点先占住回答的位置 0.95 秒，再换成文字。回答和提问同时出现，读成两条并列的字幕；有了这段等待，才读成“它在回应我”。\n3. **只有最新一轮是亮的。** 第二问出现时，前一轮降到 50% 的亮度。四个气泡一样亮，观众会从头重读一遍，跟不上旁白。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.3 → 0.72s | 第一问 | 从下方 80px 升起，淡入，缩放 0.86 → 1（原点在右下角） | power3.out |\n| 0.95 → 1.37s | 整列 + 三点气泡 | 整列上移一个气泡的高度；三点气泡从下方升起（原点在左下角） | power3.out |\n| 1.21s 起 | 三个点 | 依次上跳 16px 再落回，间隔 0.11 秒，各跳两次 | sine.inOut |\n| 1.9 → 2.24s | 第一答 | 三点气泡 0.1 秒淡出；文字气泡从左下角由 0.5 长到 1；回答折成两行时，整列同时再补顶 90px（0.3 秒，power3.out） | back.out(1.5) |\n| 2.9 → 3.32s | 第二问 + 旧气泡 | 同第一问；同时前两个气泡降到 50% | power3.out |\n| 3.55 → 4.84s | 第二答 | 同第一答（三点 3.55 秒出现，文字 4.5 秒出现） | 同上 |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| think 三点停留 | 0.95s | 过 1.6s 观众开始等得不耐烦 | 低于 0.5s 三个点只闪一下，不如不要 |\n| push 顶起时长 | 0.42s | 过 0.6s 气泡像漂上来的，没有“发送”的干脆 | 低于 0.25s 整列一跳，看不出谁推谁 |\n| rise 升起距离 | 80px | 过 160px 像从屏幕外飞进来 | 低于 30px 只剩淡入 |\n| old 旧对话亮度 | 0.5 | 过 0.7 等于没压 | 低于 0.4 提问气泡上的深色字和压暗后的底色分不开（对比度检查也会报） |\n| beats 四个节拍 | 0.3 / 0.95 / 2.9 / 3.55s | 问答之间拉开，留给旁白 | 一问和它的三点之间低于 0.4 秒，像抢答 |\n\n## 已知坑\n\n- 前两版气泡偏小（50px、60px 字），连拍里四个气泡只占画面下半，上面空着。现在是 64px 字、行高 90px，气泡最宽 1160px（画面的 60%），列左右各留 120px、底边在 970px；默认四条都是一行（每条高 162px），叠起来从 220px 排到 970px，整组中心在画面中线偏下 55px。文字更长时先减字，不要缩字号。\n- 整列是按最终状态排版、再整体往下错位的，错位量靠脚本读每一行的实际高度。字体没加载完就读，高度会差几像素，气泡落点会偏。换了网络字体的项目要等字体就绪再挂载这张卡。\n- 回答超过一行时，三点气泡只有一行高。脚本会先按一行高顶起，出字时再补顶一次（0.3 秒）。如果把这第二次顶起删掉，多行回答的下半截会掉到列底线以下。\n- 一行最多 16 个字（气泡最宽 1160px，内边距左右各 56px），超过就折成两行。一行的气泡高 162px、两行 252px：两条回答都是两行时整组从 40px 排起，还放得下；再有一条提问也折行就会顶出画面上边。折行是浏览器按宽度断的，17、18 个字的句子会在第二行只剩一两个字，宁可删到 16 个字以内。提问尽量控制在 16 个字以内，三行的气泡不要用。\n- 角标在左上角（120, 56），最上面那条永远是靠右的提问，所以两者不会相撞；如果把左右对调（提问放左边），角标要跟着换到右上角。\n- 还没出场的气泡排在画面下方外侧（透明度为 0）。如果给它们加了投影或描边的入场前状态，注意别让它们在画面底边露头。\n\n## 动效与皮的边界\n\n属于这张卡的：新旧气泡同缓动一起上移、回答前的三点等待、文字气泡从三点的位置长出来、上一轮自动变暗。\n\n只是皮：气泡颜色和圆角、左右哪边是提问、有没有头像、字体字号、角标文字。\n\n## 接进片子\n\n- 变量：`q1 / a1 / q2 / a2` 四句话；`tag` 左上角角标，编出来的对话写“示例对话”；`backdrop`。\n- 四个节拍在脚本顶部的 `beats` 里，分别对齐旁白念出每一句的起点；回答的文字在节拍后 0.95 秒出现，所以把回答的节拍放在旁白念回答之前一秒左右。\n- 音效：每个气泡出现时一个轻的弹出声；三点跳动时可以配很轻的滴答，或者不配。\n- 接法：前面用 `input-typing` 打出第一问，再切到这张卡；最后一答可以接 `quote-pull` 单独拎出来。"},{"id":"checklist-tick","name":"清单逐条勾","group":"结构与流程","type":"structure","intents":["steps","caution"],"numbers":null,"chart":null,"one_line":"一列清单先灰着摆好，旁白确认到哪一条，那一条的方框填色、勾一笔画出、文字变白；最后一条勾完整列轻轻顿一下","use_when":"旁白在逐条确认（做到了哪几件事、检查项、回顾要点），每条是一个短句，条目本身观众已经见过或一眼能懂","energy":"中","needs":["文"],"overlay":false,"slot":4.6,"hero":4.2,"sfx":"tick=tick, done=chime","pairs_with":["step-stack","stamp-verdict"],"vars":[{"id":"items","type":"string","label":"清单项（用 | 分隔，2–5 条）","default":"目标写清楚了|给了参考示例|限定了输出格式"},{"id":"cues","type":"string","label":"每一条打勾的秒数（逗号分隔，不够就均匀排开）","default":"0.9,1.9,2.9"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.6,1,2.2,3,4.2],"doc":"## 命门\n\n1. **勾是画出来的，不是出现的。** 方框先在 0.1 秒内填成强调色，勾从左下起笔、0.26 秒一笔画到右上。勾直接淡入，就只是“换了个图标”，没有“打上了”的动作。\n2. **颜色变化跟着勾走，一行分三档。** 没勾的：灰字、空框；正在勾的：白字、整行放大到 1.05 倍；勾过的：退回原尺寸，字是灰和白的中间色，框保持填色。整列一上来就是白字，勾了和没勾只差一个小方框，远看分不出进度。\n3. **收尾那一下只做一次，而且很轻。** 最后一条勾完 0.45 秒后，所有行回到全白，整列放大到 1.03 倍再弹回。它的意思是“全部完成”。每勾一条都顿一下，或者幅度做大，就成了抖动。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.05 + 0.08 × 序号 → +0.32s | 每一行 | 从左 40px 滑入淡入，灰字空框 | power3.out |\n| cue → +0.1s | 方框填色 | 淡入 | 线性 |\n| cue → +0.12s → +0.37s | 方框 | 1 → 1.2 → 1 倍 | power2.out，back.out(3) |\n| cue + 0.04 → +0.30s | 勾 | 一笔画出 | power2.out |\n| cue → +0.2s / +0.25s | 这一行 | 字变白；整行放大到 1.05 倍（原点在左） | power2.out / back.out(2) |\n| 下一个 cue → +0.3s | 上一行 | 回到 1 倍，字变成半亮 | power2.out |\n| 最后一个 cue + 0.45s → +0.2s | 所有行 | 字回到全白，最后一行回到 1 倍 | power2.out |\n| 同上 → +0.12s → +0.42s | 整列 | 1 → 1.03 → 1 倍 | power2.out，back.out(3) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| stroke 勾的绘制时长 | 0.26s | 过 0.45 像慢动作，跟不上“这条有了” | 低于 0.15 看不出笔顺 |\n| now 当前行倍数 | 1.05 | 过 1.1 五条时行与行会挤（行距只有 28px） | 1.0 时当前行只靠颜色，弱 |\n| fonts 各条数的字号 | 120 / 112 / 96 / 80px（2 / 3 / 4 / 5 条），方框 132px | 五条时整列已经高 772px，再大就顶到上下边 | 低于 72px 整列又缩成画面中间一小块 |\n| beat 收尾延迟 | 0.45s | 过 0.8 像另一件事 | 低于 0.3 会和最后一个勾叠在一起 |\n| nudge 收尾幅度 | 1.03 | 过 1.06 整列在跳 | 1.0 等于没有收尾 |\n| deal 开场每行间隔 | 0.08s | 过 0.15 开场拖长，第一个 cue 要更晚 | 0 同时出现 |\n\n## 已知坑\n\n- 勾的路径用 `pathLength=\"1\"` 归一，虚线写成“1 1.2”。间隔写成和线段一样长时，圆头线帽会在起笔处提前露出一个点，所以勾在起笔那一帧之前透明度是 0。\n- 整列按“最宽一行”居中。第一版把列的左边写死在 380px，短条目时整列明显偏左。\n- 当前行放大的原点在左边（方框那一侧）。原点留在中间，行会往左顶，方框就不在一条竖线上了。\n- 三条时条目超过 11 个汉字会缩字号（可用宽度 1300px）；五条时基础字号是 80px，超过 16 个字开始缩，超过 23 个字掉到 56px 以下。\n- 开场摆列表要 0.3 + 0.08 × 条数 秒，第一个 cue 不早于 0.6 秒。想要“条目跟着旁白一条条出现”的效果，这张卡不合适，用 `step-stack`。\n\n## 动效与皮的边界\n\n属于这张卡的：列表先整体摆出、勾按笔顺画、文字颜色跟着勾变化、当前行略大、只在全部勾完时顿一次。\n\n只是皮：方框的圆角和大小、勾的粗细、填色还是只描边、文字字重、半亮的深浅。把勾换成叉也成立（否定清单），但一张清单里不要混用。\n\n## 接进片子\n\n- `items`：清单项，`|` 分隔，2–5 条，每条 4–9 个字。\n- `cues`：每一条打勾的秒数，对齐旁白确认这一条的那个词（“有了”“做到了”，或条目名的最后一个字）。第一个不早于 0.6 秒，相邻至少隔 0.5 秒。\n- `backdrop`：`off` 只留清单本身，底下自己垫压暗的画面。\n- 音效：每个 cue + 0.04 秒（起笔）一个 tick；收尾那一下配一个轻的 chime。\n- 接法：前面用 `step-stack` 逐步讲，这张卡做回顾；全部勾完后要下结论，接 `stamp-verdict`。"},{"id":"circle-scribble","name":"手绘圈","group":"标注与手绘","type":"evidence","intents":["point"],"numbers":null,"chart":null,"one_line":"旁白点到画面里某个东西的那一刻，一个不太圆的圈从左上起笔、一笔画完套住它，收笔越过起笔一小段","use_when":"录屏、截图或照片里有一个具体的按钮、数字、词要观众立刻看过去，而且只有这一个","energy":"中","needs":["界面"],"overlay":true,"slot":3,"hero":0.9,"sfx":"draw=draw","pairs_with":["arrow-point","margin-note"],"vars":[{"id":"x","type":"number","label":"目标左上角 x（1920×1080 坐标）","default":300},{"id":"y","type":"number","label":"目标左上角 y","default":576},{"id":"w","type":"number","label":"目标宽","default":416},{"id":"h","type":"number","label":"目标高","default":150},{"id":"pad","type":"number","label":"圈离目标的余量（像素）","default":20},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.167,0.3,0.4,0.9,2.6],"doc":"## 命门\n\n1. **一笔，先快后慢。** 整圈 0.52 秒，`power2.out`：前 0.2 秒已经走完六成，最后一小段明显减速。匀速画完读起来是进度环在加载，不是手在画。\n2. **收笔越过起笔，并且不重合。** 笔多走 0.42 弧度（约 24°），同时整圈向内收 40px，所以收笔那段落在起笔的内侧，两条线并排露出一个小岔口。首尾正好接上就是一个椭圆图形，机器画的。\n3. **线有粗细。** 落笔 7px，中段 18px，提笔 4px。等粗的线像描边框；粗细变化是“笔压”的全部来源。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 → 0.20s | 画面 | 只有底图，圈还没出现 | — |\n| 0.20 → 0.72s | 圈 | 从左上（-140° 方向）起笔，顺时针画 360° + 24°，沿途向内收 40px | power2.out |\n| 0.72s 之后 | 圈 | 停住不动，至少留 1 秒 | — |\n\n圈不是描边线，而是一条两头细中间粗的填色带；画的过程是一条蒙版描边沿着中心线把它揭开。\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| draw 画圈时长 | 0.52s | 过 0.9s 像在慢慢描，观众会等它 | 低于 0.3s 只看到圈“出现”，看不到笔在走 |\n| lap 多走的弧度 | 0.42 | 过 1.2 变成绕了两圈的涂鸦，更躁 | 0 时首尾刚好碰上，像图形工具画的 |\n| gap 首尾错开 | 40px | 过 60px 像蚊香 | 低于 30px 收笔段会在起笔时被提前露出来（见已知坑） |\n| wob 不圆的程度 | 7px | 过 12px 像抖着手画的 | 0 是标准椭圆，没有手感 |\n| thick 中段粗细 | 18px | 过 26px 盖住目标边上的东西 | 低于 10px 在录屏上看不清 |\n| pad（变量） | 20px | 圈离目标远，套得松 | 0 时圈会擦到目标的四个角 |\n\n## 已知坑\n\n- 目标很扁（宽是高的 4 倍以上）：圈被拉成很扁的椭圆，上下两条边几乎是直线，手绘感没了。这种目标改用 `underline-draw`，或者把 `h` 报大一些。\n- `gap` 小于 30px：蒙版描边宽 30px，起笔时会把紧挨着的收笔段一起露出来，圈一开始就多一小截。要改小 `gap`，同时把 `thick` 也改小。\n- 目标贴着画面边：圈的外沿是目标外框再加约 40%，会画出画面。先确认 `x - 0.21w - pad - 20` 不小于 0，右边同理。\n- 强调色和底图太接近（黄圈压在黄色图上）：圈有一圈 3px 的深色包边兜底，但仍然不够醒目，这时换 `--mc-accent`。\n- 同一画面放两个圈：两处都在抢，等于没圈。第二个东西请用箭头或标签。\n\n## 动效与皮的边界\n\n属于这张卡的：一笔画完、先快后慢、收笔越过起笔并向内错开、两头细中间粗、圈略歪略不圆。\n\n只是皮：颜色、粗细的绝对值、有没有深色包边、起笔的角度（现在是左上）、顺时针还是逆时针。\n\n## 接进片子\n\n- 默认演示（`backdrop: on`）垫的是示例截图放大 2 倍后的任务列表区域（原图 340,110 起的 960×540 一块铺满画面）；默认目标是第二行的标题加副标题（300,576 起、416×150），圈画出来约 670×290。接进片子时四个数都要换成自己画面里的目标。\n- 变量：`x / y / w / h` 是目标的外框（1920×1080 坐标，左上角加宽高），`pad` 是圈和目标之间的余量，`backdrop` 填 `off` 时透明，直接压在录屏或实拍那一轨上面。\n- 时间：这一镜的起点放在旁白说出目标那个词之前 0.2 秒，圈在 0.72 秒合拢。画完至少再留 1 秒才能切走。\n- 音效：0.2 秒处放一声短的笔划声，长度和 `draw` 一致。\n- 常见接法：圈完以后用 `arrow-point` 或 `margin-note` 在旁边补一句话；圈本身不带字。"},{"id":"code-walk","name":"代码逐行讲","group":"证据与界面","type":"evidence","intents":["software","steps"],"numbers":null,"chart":null,"one_line":"整段代码先退到三成亮度，一条带强调色边的高亮带落在第一段上；每讲到下一段，高亮带整条滑下去并变成新的高度，被罩住的几行变亮并放大 5%","use_when":"旁白按顺序讲一段代码或配置的两三个部分，每一段说一两句","energy":"低","needs":["文"],"overlay":true,"slot":5,"hero":3.9,"sfx":"step=tick","pairs_with":["terminal-log","typewriter-line","lower-third"],"vars":[{"id":"code","type":"string","label":"代码（用 \\n 换行，最多 9 行）","default":"// 示例：把长文档切成小段\nfunction splitDoc(text, size) {\n  const parts = [];\n  for (let i = 0; i \u003c text.length; i += size) {\n    parts.push(text.slice(i, i + size));\n  }\n  return parts;\n}\nconst chunks = splitDoc(doc, 800);"},{"id":"steps","type":"string","label":"依次讲哪几行（起-止，逗号分开）","default":"2-3,4-6,9"},{"id":"hold","type":"number","label":"每段停多久（秒）","default":1.3},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.2,1,2.1,2.5,3.9],"doc":"## 命门\n\n1. **先全体退后，再点亮。** 0.3 秒时整段先降到 30% 亮度，之后才出现高亮带。不压暗只加亮，白字上再加亮几乎看不出，高亮带就成了一条没人注意的色条。\n2. **高亮带是滑过去的。** 换段时同一条带子用 0.5 秒移到新位置、变到新高度。旧带淡出、新带淡入，读成两处无关的标记，看不出讲解的顺序。\n3. **字跟在带子后面亮。** 新的几行在带子出发后 0.2 秒才变亮，旧的几行在带子一出发就暗下去。同时亮同时暗，中间有一瞬两段都是半亮的，眼睛没处落。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.3 → 0.65s | 全部代码行 | 亮度 1 → 0.3 | power1.out |\n| 0.6 → 0.9s | 高亮带 | 在第一段（第 2–3 行）的位置淡入 | power1.out |\n| 0.65 → 0.95s | 第 2–3 行 | 亮度回到 1，缩放到 1.05（原点在行首） | power2.out |\n| 1.9 → 2.4s | 高亮带 | 滑到第 4–6 行，高度从两行变成三行 | power3.inOut |\n| 1.9 → 2.2s | 第 2–3 行 | 回到 0.3 亮度和原大小 | power1.out |\n| 2.1 → 2.4s | 第 4–6 行 | 变亮、放大 | power2.out |\n| 3.2 → 3.7s | 高亮带 | 滑到第 9 行，高度从三行变成一行（第 4–6 行同时变暗，第 9 行 3.4 秒变亮） | power3.inOut |\n\n窗口 1728×960（画面宽的 90%），代码 54px 等宽字，每行高 100px，默认 9 行正好排满；段与段之间隔 1.3 秒。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| rest 未讲到的亮度 | 0.3 | 过 0.55 对比不够，高亮带白忙 | 低于 0.15 其余代码读不出，丢了上下文 |\n| grow 放大倍数 | 1.05 | 过 1.1 长的行会冲出窗口，而且行与行对不齐了 | 1.0 也成立，只是少一点“凑近”的感觉 |\n| slide 滑动时长 | 0.5s | 过 0.8s 带子在路上扫过无关的行太久 | 低于 0.3s 像跳过去 |\n| lag 字比带子晚多少 | 0.2s | 过 0.4s 带子到了字还没亮，像坏了 | 0 时两段同时半亮 |\n| hold（变量）每段间隔 | 1.3s | 按旁白每段的实际长度填 | 低于 0.6s 会被抬到 0.6（滑动本身要 0.5 秒） |\n\n## 已知坑\n\n- 放大的原点必须在行首。原点留在行中间，放大 5% 时行首会往左跑 20 多像素，缩进就对不齐了。\n- 最长的一行放大后不能超过窗口：54px 的等宽字每个字符约 30px，默认最长的一行 47 个字符宽约 1400px，放大后 1470px，窗口内行号右边的可用宽度约 1570px。超过 50 个半角字符的行要先折行（中文算两个）。\n- 行数和字号是绑在一起的：9 行 × 100px 加上下各 28px 就是窗口的高度，脚本只取前 9 行，多出来的直接丢掉。要放 11 行，把 `lineH` 和样式里的行高一起改成 82px、字号降到 44px，再把脚本里的 9 改掉；不要低于 38px。\n- 代码里的 `\u003c` 写在 HTML 正文里要转义成 `&lt;`；写在变量默认值里则不用（那是 JSON 字符串）。两处写法不一样，改示例时容易只改对一处。\n- 变量里的换行写 `\\n`。有些宿主传进来的是字面上的反斜杠加 n，脚本两种都认；空行会保留成一个空格，行号照常计数。\n- 两段之间隔了很多行（比如从第 2 行跳到第 9 行）时，带子 0.5 秒扫过七行会显得很快。把这一步的间隔留长一点，或者把代码裁到只剩相关的部分。\n\n## 动效与皮的边界\n\n属于这张卡的：先整体压暗、同一条高亮带滑动并变高、字比带子晚亮、被讲到的行略微放大。\n\n只是皮：高亮带的底色和左边那条强调色边，行号有没有，注释行的颜色，窗口边框，字体字号，要不要语法着色（demo 里故意没有，亮暗才是主角）。\n\n## 接进片子\n\n- 变量：`code` 代码，用 `\\n` 换行，最多 9 行；`steps` 依次讲哪几行，写成 `2-3,4-6,9`；`hold` 段与段的间隔秒数；`backdrop`。\n- 第一段 0.65 秒亮起，之后每隔 `hold` 秒换一段。旁白每段长短不一时，把 `hold` 设成最短的那段，再把这张卡拆成两次使用。\n- 音效：每次换段一个很轻的滴答声，放在带子出发的那一帧（1.9、3.2 秒）。\n- 接法：讲完接 `terminal-log` 跑一遍；某一行需要单独强调时，在它旁边叠一条 `lower-third` 说明。"},{"id":"color-slam","name":"色块砸切","group":"转场","type":"structure","intents":["transition","chapter"],"numbers":null,"chart":null,"one_line":"一整块强调色从一侧加速盖满画面，停一帧，再朝同一个方向冲出去，后面拖着一条第二色的尾巴","use_when":"话题硬转（换章节、换案例、“说完优点说缺点”），旁白在这里有一个明显的停顿或重音","energy":"高","needs":["无"],"overlay":true,"slot":2,"hero":0.967,"sfx":"slam=impact, leave=whoosh","pairs_with":["chapter-numeral","slab-title-slam"],"vars":[{"id":"dir","type":"enum","label":"色块从哪一侧进","default":"left"},{"id":"hold","type":"number","label":"停几帧（1–4）","default":1},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.967,1.034,1.167,1.6],"doc":"这是一个叠加层：压在上一镜的结尾和下一镜的开头上面，真正的换镜藏在全遮的那几帧底下。\n\n## 命门\n\n1. **最快的一帧是盖满的那一帧。** 进场用 power2.in，5 帧里走过的比例是 4%、16%、36%、64%、100%。换成先快后慢（out 类曲线），色块像一扇慢慢关上的门，读成“遮挡”，不是“砸”。\n2. **进出同一个方向。** 从左进就从右出，色块是“路过”画面。原路退回去会读成“盖上又掀开”，观众以为还是同一个画面，换镜就像穿帮。\n3. **全遮至少 2 帧，而且换镜必须在这 2 帧里。** 只遮 1 帧，编码后可能前后两镜各漏半帧，看上去是画面闪坏了。\n\n## 动作拆解\n\n`cut` = 卡内 1.0 秒（色块刚盖满的那一帧）。\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.833 → 1.0s | 主色块 + 第二色块（叠在一起） | 从画面外一侧滑到盖满 | power2.in |\n| 1.0 → 1.033s | 两块 | 停住（`hold` = 1 帧） | — |\n| 1.033 → 1.233s | 主色块 | 继续朝同方向滑出画面 | power2.in |\n| 1.067 → 1.267s | 第二色块 | 晚 1 帧跟着滑出，露出一条尾巴 | power2.in |\n\n全遮：1.0 → 1.067s，保证 2 帧（第二色块起步慢，实际看到约 3 帧）。宿主把两镜的交界对在卡内 **1.033 秒**。\n\n## 参数手感\n\n| 参数 | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| slam 进场时长 | 0.167s | 过 0.27s 变成推拉门，没有力度 | 低于 0.1s（3 帧）看不出从哪边来 |\n| hold（变量） | 1 帧 | 3–4 帧像卡了一下，只有要在色块上叠章节字时才用 | 不能为 0 |\n| leave 离场时长 | 0.2s | 过 0.33s 下一镜的开头被挡太久 | 低于 0.13s 尾巴看不见 |\n| lag 第二色落后 | 0.033s | 0.067s 尾巴更宽，更花 | 0 就是纯单色块，也成立 |\n| dir（变量） | left | — | 上下方向行程短，同样时长下显得更慢，可把 slam 减 1 帧 |\n\n## 已知坑\n\n- 下一镜开头 0.2 秒是被色块挡着的。下一镜的第一个动作（标题砸字之类）要晚于卡内 1.27 秒再开始，不然被吃掉。\n- 强调色和上一镜的主色太接近时，看不出色块的边。换皮时让色块和两镜都有明显的明度差。\n- 连着两次转场都用它：第二次换 `dir`，否则像同一条素材放了两遍。\n- 做这张卡时踩到的：不要给叠加元素写 `visibility: visible`，它会穿透宿主对整段的隐藏，卡没开始就露出来。这里用透明度控制。\n\n## 动效与皮的边界\n\n属于这张卡的：加速盖满、停 1 帧、同方向离场、全遮 2 帧以上。\n\n只是皮：两块的颜色（`--mc-accent` / `--mc-accent-2`）、要不要第二色的尾巴、从哪一边进。在色块上叠一个章节号也算皮，但 `hold` 要相应加到 3 帧以上才读得到。\n\n## 接进片子\n\n- 变量：`dir` 从哪边进（left / right / up / down），`hold` 停几帧，`backdrop` 在片子里一律填 `off`（`on` 只是预览时垫两张占位图）。\n- 对齐：这段的起点 = 两镜交界的时间 − 1.033 秒，时长 2 秒，轨道压在两镜上面。\n- 音效：1.0 秒放一个短的撞击声；离场可以叠一个很轻的掠过声。\n- 常见接法：砸完之后下一镜用章节号或大标题开场。"},{"id":"converge-arrows","name":"多源汇聚","group":"结构与流程","type":"structure","intents":["grouping","process"],"numbers":null,"chart":null,"one_line":"几个来源标签从四周依次站出来，各画一条箭头指向中心，最后一条箭头到达的那一帧，中心的结论弹出","use_when":"旁白在说“把这几样东西合起来，得到一个结论”，来源二到五个，结论是一个短语","energy":"中","needs":["文"],"overlay":true,"slot":4.4,"hero":4,"sfx":"source=pop, hit=impact","pairs_with":["formula-assemble","word-punch"],"vars":[{"id":"items","type":"string","label":"来源（用 | 分隔，2–5 个）","default":"用户反馈|销售数据|竞品动态"},{"id":"result","type":"string","label":"中心的结论","default":"下一步做什么"},{"id":"cues","type":"string","label":"每个来源出现的秒数，最后可多写一个给结论（逗号分隔）","default":"0.4,1.4,2.4"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.25,0.8,1.8,2.84,4],"doc":"## 命门\n\n1. **结论等箭头。** 中心在最后一条箭头画完的那一帧才出现（最后一个 cue + 0.58 秒），之前只是一个虚线空框。结论先摆在中间，箭头就成了装饰，“汇聚”说成“发散”也讲得通。\n2. **箭头在标签站稳之后才出发。** 标签用 0.32 秒弹进来，箭头从第 0.18 秒起画 0.4 秒，箭头尖在线快到时才出现。标签和箭头同时出现，眼睛分不清是谁指向谁。\n3. **主次分两段换手。** 逐个讲来源时：当前来源白字加强调色边框，讲过的变灰、箭头降到 35%。结论弹出时：所有来源都变灰，所有箭头回到全亮，中心是屏幕上唯一的色块，字号也最大。结论出来以后来源还亮着，一屏就有四五个重点。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.03 → 0.33s | 中心虚线空框 | 淡入到 45% | power1.out |\n| cue → +0.32s | 来源标签 | 从远离中心的方向 44px 外弹入，0.8 → 1 倍，白字带边框 | back.out(1.8) |\n| cue + 0.18 → +0.58s | 这个来源的箭头 | 线从标签画向中心，最后 0.1 秒箭头尖淡入 | power2.inOut |\n| 下一个 cue → +0.3s | 上一个来源 | 字变灰，边框淡掉，箭头降到 35% | power2.out |\n| hit − 0.05 → +0.1s | 所有箭头 | 回到全亮 | power2.out |\n| hit → +0.16s | 中心结论 | 0.5 → 1.12 倍，虚线框消失，最后一个来源变灰 | power3.out |\n| hit + 0.16 → +0.46s | 中心结论 | 回到 1 倍 | back.out(2.2) |\n\n## 参数手感\n\n| 参数（脚本顶部 CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| lag 箭头比标签晚 | 0.18s | 过 0.4 标签和箭头像两件无关的事 | 0 时一起出现，分不清先后 |\n| draw 箭头绘制时长 | 0.4s | 过 0.7 结论迟到，旁白已经讲完 | 低于 0.2 看不到“画”，只是出现 |\n| dimTo 讲过的箭头亮度 | 0.35 | 过 0.7 讲过的和当前的分不开 | 0 时旧箭头消失，结论弹出前画面发空 |\n| peak 结论峰值倍数 | 1.12 | 过 1.25 会撞上箭头尖（箭头停在框外 34px） | 1.0 没有“到达”的一下 |\n| spots 各条数的落点 | 见脚本 | — | 落点离中心太近时箭头只剩一小截，至少留 150px |\n| 标签 / 中心的字号 | 72px / 116px | 中心框已经宽 816px、高 250px，再大四角的箭头就短于 150px | 标签低于 56px、中心低于 90px，整张图又缩回一小团 |\n\n## 已知坑\n\n- 箭头的起止点是用“标签的宽高”算出来的，所以每个标签和中心框都由脚本给了明确的宽高（按字数估算）。改成自适应宽度以后，箭头会戳进框里或者悬在半空。\n- 第一版的落点离中心框太近，三个来源时上面两条箭头只剩四十来像素的小茬。现在三、四个来源用四角加底边，中心框限宽 820px；结论超过 6 个字会自动缩字号。一两个来源时如果还排在中心框的左右，箭头只剩几像素，所以它们排在上方，中心框下移到 620px。\n- 线用的是平头线帽。圆头线帽在偏移量等于线长时仍会在起点画出一个小圆点，箭头还没出发就露了头。\n- `cues` 多写一个数就是结论的时间，但它不会早于最后一条箭头到达的时刻；想让结论更早，只能把最后一个来源的 cue 提前。\n- 五个来源时第五个在正上方，中心框整体下移 50px，四角的标签再往外挪到离边 56px。来源名超过 6 个字会缩字号（标签最宽 580px），上面三个标签会挤在一起，先缩短名字。\n\n## 动效与皮的边界\n\n属于这张卡的：来源在外圈、箭头一律指向中心、箭头在标签之后出发、结论在最后一条箭头到达时弹出、弹出时主次整体换手。\n\n只是皮：标签的形状、箭头是直线还是弧线、虚线空框要不要、中心是色块还是描边、落点布局（只要在外圈）。把箭头方向反过来（中心向外）是另一个动法，不是换皮。\n\n## 接进片子\n\n- `items`：来源，`|` 分隔，2–5 个。`result`：中心的结论，6 个字以内最好。\n- `cues`：每个来源出现的秒数，对齐旁白说出它的那个词；想自己定结论的时间，在最后多写一个数。相邻两个 cue 至少隔 0.7 秒，给箭头留出画完的时间。\n- `backdrop`：`off` 时透明，标签和中心都自带底板，可以压在画面上；箭头是细线，底下的画面太花时先压暗。\n- 音效：每个 cue 一个 pop，结论弹出的那一帧一个 impact。\n- 接法：结论弹出后想再强调，下一镜用 `word-punch` 单独砸这个词；来源之间是相加关系、想保留加号时，换 `formula-assemble`。"},{"id":"count-badge","name":"计数徽章标题","group":"标题与章节","type":"structure","intents":["steps","categories"],"numbers":null,"chart":null,"one_line":"写着“第 N 个”的圆徽章先在画面正中弹出，里面的数字滚两格落到 N，标题随后从徽章背后向右滑出，把徽章顶到左边","use_when":"清单式内容（几个方法、几个错误、几个步骤）里每一条的开头，旁白在说“第三个”","energy":"高","needs":["文"],"overlay":true,"slot":3,"hero":0.85,"sfx":"pop=pop, roll=tick, push=whoosh","pairs_with":["progress-rail","word-punch"],"vars":[{"id":"n","type":"number","label":"第几个（1–9 最好）","default":3},{"id":"unit","type":"string","label":"量词","default":"个"},{"id":"title","type":"string","label":"标题（建议 4–7 个字）","default":"检查输出格式"},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.15,0.34,0.6,0.85,2.6],"doc":"## 命门\n\n1. **徽章先独占正中。** 徽章弹出时标题宽度是 0，整行居中，所以徽章在画面正中。一开始就把徽章摆在最终的左侧位置，它像是弹歪了，观众的视线也要多跳一次。\n2. **数字是滚到的。** 数字从 N-2 经过 N-1 滚到 N，用带回弹的缓动落定，而且在徽章回落的同时还在滚。直接显示 N，“计数”的意思就没了，只剩一个带字的圆。\n3. **标题是从背后出来的。** 标题整行从徽章后面向右平移，最后一个字先露头；行宽同步变大，把徽章往左顶，徽章还被顶得歪 7°。用左到右擦除来显示标题，徽章和标题之间没有力的关系。\n\n## 动作拆解\n\n| 时间 | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0.20 → 0.38s | 徽章 | 缩放 0 → 1.16 | power3.out |\n| 0.38 → 0.64s | 徽章 | 缩放回 1 | back.out(2.6) |\n| 0.26 → 0.76s | 数字条 | 上移两格（400px），从 N-2 到 N | back.out(1.5) |\n| 0.72 → 1.27s | 标题 + 遮罩宽度 | 标题从徽章后平移出来，行宽从 0 长到标题全宽 | power3.out |\n| 0.72 → 0.84s | 徽章 | 被顶歪到 -7° | power2.out |\n| 0.84 → 1.24s | 徽章 | 转回 0° | back.out(2.4) |\n\n## 参数手感\n\n| 参数（CFG） | 默认 | 调大 | 调小 |\n| --- | --- | --- | --- |\n| popPeak 徽章峰值 | 1.16 | 过 1.3 像气球 | 1.0 时是淡入的圆 |\n| steps 数字滚过几格 | 2 | 4 格以上在 0.5 秒里只是一片模糊 | 0 时不滚 |\n| rollDur 滚动时长 | 0.5s | 过 0.9s 标题等不及 | 低于 0.3s 看不清经过了哪些数 |\n| pushLag 标题滞后 | 0.52s | 过 0.9s 徽章独处太久，节奏断 | 低于 0.4s 数字还没落定标题就出来，两处同时抢眼 |\n| pushDur 推出时长 | 0.55s | 过 0.9s 像抽屉慢慢拉开 | 低于 0.3s 徽章是被撞飞的 |\n\n## 已知坑\n\n- 数字条比它的窗口高得多，滚过去的数字会跑到徽章圆的外面。校验不认遮罩，把这些深色数字当成压在深色底上的字，报对比度不够，而且时报时不报。现在徽章里的“第”、数字、量词都用 `::before` 从 `data-d` 属性画出来，数字窗口用 `clip-path` 裁切；别改回普通文字加 `overflow: hidden`。\n- 标题滑出时整行从徽章底下经过，校验报过它和徽章里的字重叠。现在标题拆成一个字一个节点，每个字在前缘到达徽章边沿的那一刻才打开（之前反正被徽章盖着）；这个时刻是按 `power3.out` 反算的，换缓动要把那行算式一起换。第一版把打开时刻定在整个字离开徽章文字之后，结果字是一个个蹦出来的，不是滑出来的。\n- 标题宽度是脚本量的，必须在填完文字之后量。量早了行宽不对，徽章会停在偏右的位置。\n- N 是两位数时数字自动降到 132px，但“第 12 个”仍然很挤；两位数建议把量词去掉，只留“第 12”。\n- 徽章外圈那 14px 的底色环是用来和标题分开的，透明模式下会自动去掉；压在实拍上时标题和徽章之间就靠 56px 的间距。\n\n## 动效与皮的边界\n\n属于这张卡的：徽章先在正中弹出、数字滚动落定、标题从徽章背后滑出并把徽章顶到一边。\n\n只是皮：徽章是圆是方、什么颜色，“第”和量词有没有，标题字体字重，数字滚过几格。\n\n## 接进片子\n\n- 变量：`n` 第几个；`unit` 量词（个、步、条）；`title` 标题；`backdrop`。\n- 对齐：起点放在旁白说“第三个”之前 0.2 秒，徽章在“第”字上弹出；标题 0.72 秒开始滑出，对旁白念标题的第一个字。\n- 音效：0.20 秒弹出声；0.26–0.76 秒每过一个数一下滴答，共两下；0.72 秒一个短的掠过声。\n- 连用：清单的每一条都用它开头，条与条之间保持同样的节奏；配合 `progress-rail` 显示一共几条。"},{"id":"crash-zoom","name":"急推","group":"镜头运动","type":"evidence","intents":["point","hook"],"numbers":null,"chart":null,"one_line":"画面先静止，到点后镜头在 0.2 秒内加速冲到目标上放大 2.4 倍，冲过头 7% 再收回来，最快的那一两帧带径向拖影","use_when":"旁白说“就是这里”“问题出在这一行”，要把观众的眼睛一下子按到画面里的一个点上","energy":"高","needs":["图"],"overlay":false,"slot":3,"hero":2.4,"sfx":"hit=whoosh, land=impact","pairs_with":["pull-reveal","slow-push","highlighter-swipe"],"vars":[{"id":"src","type":"string","label":"画面地址（从项目根目录写起）","default":"motion-cards/lib/samples/ui.png"},{"id":"fx","type":"number","label":"推到哪一点：横向 0–1","default":0.36},{"id":"fy","type":"number","label":"推到哪一点：纵向 0–1","default":0.54},{"id":"zoom","type":"number","label":"推到几倍","default":2.4},{"id":"hit","type":"number","label":"开始推的时间（秒）","default":0.8},{"id":"backdrop","type":"enum","label":"底","default":"on"}],"frames":[0.5,0.9,0.967,1,2.4],"doc":"## 命门\n\n1. **0.2 秒，一路加速。** 冲的阶段用 `power2.in`，最快的一帧是停下前的那一帧，所以读成“撞上去”。换成缓出（先快后慢）就是一次普通的推近；拉长到 0.4 秒以上就只是“放大”。\n2. **幅度要大。** 默认 2.4 倍。急推靠的是画面内容在几帧里整个换掉，1.3 倍的急推看起来像画面抖了一下。\n3. **拖影只在最快的两帧。** 径向拖影在停下前一帧最浓，停下那一帧必须已经干净。拖影留到停稳之后，读成的是重影、没对上焦，不是速度。\n\n## 动作拆解\n\n| 时间（相对 hit） | 谁 | 做什么 | 缓动 |\n| --- | --- | --- | --- |\n| 0 之前 | 镜头 | 全貌，静止 | — |\n| 0 → 0.2s | 镜头 | 缩放 1 → 2.568（2.4 × 1.07），目标点移到画面中央 | power2.in |\n| 0.047 → 0.167s | 4 层拖影 | 透明度 0 → 0.5 / 0.4 / 0.3 / 0.22，各自以目标点为原点放大到 1.025 / 1.05 / 1.075 / 1.1 | power1.in |\n| 0.167 → 0.2s | 4 层拖影 | 透明度归零 | none |\n| 0.2 → 0.46s | 镜头 | 缩放 2.568 → 2.4，位移跟着回正 | power2.out |\n\

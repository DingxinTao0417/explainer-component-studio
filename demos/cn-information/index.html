<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息图与附件 · 可调组件</title><link rel="stylesheet" href="demo.css"></head><body>
<header><a href="../../catalog.html">← 讲解组件库</a><span>第一批 · 信息图与附件</span><a href="../../CN_INFORMATION_GUIDE.md" target="_blank">调用说明 ↗</a></header>
<main><div class="intro"><div><p class="eyebrow">可编辑 · 可调样式 · 可定位时间</p><h1>把关系和依据，讲清楚。</h1><p>五个示例，可替换数据、微调样式，拖动时间查看变化。</p></div><span class="tag">3 个新组件 + 2 项增强</span></div>
<nav id="presets" aria-label="组件示例"></nav>
<div class="workspace"><section class="preview"><div id="stage"><iframe id="frame" title="组件实时预览"></iframe></div><div class="transport"><button id="play">播放</button><button id="restart">从头</button><input id="time" aria-label="预览时间" type="range" min="0" max="8" value="6.8" step=".01"><output id="clock">6.80 秒</output></div><p id="description" class="muted"></p><div id="error" role="alert"></div></section>
<aside><h2>微调当前示例</h2><label>强调色<input id="accent" type="color" value="#0879ff"></label><label>文字大小<input id="font" type="range" min="22" max="36" value="28" step="1"><output id="font-value">28</output></label><div id="specific"></div><button id="reset">恢复示例</button><button id="download">下载当前配置</button><a id="component-link" href="#" target="_blank">在组件库查看 ↗</a><hr><p class="small">调参只作用于当前示例。整片使用时，同一语义等级保持同一种样式。</p><button id="check">检查当前画面</button><output id="qa" aria-live="polite"></output></aside></div>
<details><summary>查看完整参数</summary><textarea id="json" aria-label="当前组件的完整参数" spellcheck="false"></textarea><button id="apply">应用参数</button><p class="small">时间使用组件原生的 0–8 秒。超出范围或放不下的内容会明确报错。</p></details>
<footer>参考 AntV Infographic、ECharts 和 Ant Design X 的相关表达；已改编为本库的原生组件。<a href="../../references/cn-batch1/provenance.json">来源与许可记录 ↗</a></footer></main><script type="module" src="demo.mjs"></script></body></html>

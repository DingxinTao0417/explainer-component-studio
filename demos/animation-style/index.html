on" aria-pressed="false"><img src="../../snapshots/ani-file-collection.png" alt="动画风 · 文件夹与窗口对照"><span><strong>动画风 · 文件夹与窗口对照</strong><small>文件卡片、文件夹与浏览器窗口并排展示；文件名称、标签与说明均可替换。</small></span></button><button class="tile" data-id="ani-method-transfer" aria-pressed="false"><img src="../../snapshots/ani-method-transfer.png" alt="动画风 · 窗口与部件组合"><span><strong>动画风 · 窗口与部件组合</strong><small>浏览器、文件卡片与容器通过连线组合；步骤、容器标题和新增项分别可编辑。</small></span></button><button class="tile" data-id="ani-knowledge-network" aria-pressed="false"><img src="../../snapshots/ani-knowledge-network.png" alt="动画风 · 文档与窗口连线"><span><strong>动画风 · 文档与窗口连线</strong><small>文件、预览窗口与文档通过连线组成图解；字段、步骤、输出和注释可编辑。</small></span></button><button class="tile" data-id="ani-capability-tiles" aria-pressed="false"><img src="../../snapshots/ani-capability-tiles.png" alt="动画风 · 图标卡片组"><span><strong>动画风 · 图标卡片组</strong><small>六块带图标的卡片与预览窗口并置；卡片标签、窗口标题和结果文字可编辑。</small></span></button><button class="tile" data-id="ani-processing-machine" aria-pressed="false"><img src="../../snapshots/ani-processing-machine.png" alt="动画风 · 输入处理装置"><span><strong>动画风 · 输入处理装置</strong><small>文件送入三通道装置，内部处理后生成对应结果；输入、处理标签和输出内容可替换。</small></span></button><button class="tile" data-id="ani-question-outro" aria-pressed="false"><img src="../../snapshots/ani-question-outro.png" alt="动画风 · 问题与预告"><span><strong>动画风 · 问题与预告</strong><small>保留两个案例对象，将当前问题引向下一期；大字问题牌、橙色问号和预告标签依次出现。</small></span></button><button class="tile" data-id="ani-notice-check" aria-pressed="false"><img src="../../snapshots/ani-notice-check.png" alt="动画风 · 文档逐项核对"><span><strong>动画风 · 文档逐项核对</strong><small>根据 V8 通知母版复刻折角纸张、深蓝描边、钴蓝标题牌与四行彩色图标，逐项核对后保留检查结果。全部图形与文字可编辑。</small></span></button></div><footer>依据本次提供的 19 场参考图、桌面插画和 V8 分镜素材重建。素材中的示例均为教学情境，不代表真实软件操作记录。<a href="../../references/animation-style/sources.json">参考来源</a></footer></main><script>

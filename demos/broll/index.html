<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-roll 插镜组件</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#1f2329;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}button,a,input{font:inherit}button,a{cursor:pointer}header{padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{font-size:23px;margin:4px 0}header small{font-size:11px;letter-spacing:2px;color:#2563eb}a{color:#2563eb;text-decoration:none}main{max-width:1480px;margin:auto;padding:0 28px 28px}.player-grid{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:20px}.screen{position:relative;background:#f6f8fc;aspect-ratio:1.6;overflow:hidden;border-radius:12px}iframe{position:absolute;left:0;top:0;border:0;width:1280px;height:800px;transform-origin:top left}.controls{display:flex;gap:12px;align-items:center;padding:14px 0;flex-wrap:wrap}.controls button{padding:8px 19px;background:#2563eb;color:#fff;border:0;border-radius:5px}.controls input{flex:1;min-width:80px;accent-color:#2563eb}.controls output{font-variant-numeric:tabular-nums;font-size:12px}.sidebar{background:white;border:1px solid #dce4ee;border-radius:9px;padding:18px}.sidebar h2{font-size:18px;line-height:1.5;margin:0 0 14px}.sidebar p{color:#526175;line-height:1.85}.sidebar .use{border-top:1px solid #dce4ee;padding-top:14px;color:#526175}.sidebar a{display:inline-block;margin-top:8px;border-bottom:1px solid #a8c4ff}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:18px}.tile{text-align:left;border:1px solid #dce4ee;border-radius:12px;background:#fff;padding:0;overflow:hidden}.tile[aria-pressed=true]{border:2px solid #2563eb}.tile img{display:block;width:100%;aspect-ratio:1.6;object-fit:cover}.tile div{padding:12px 14px}.tile strong{display:block;font-size:14px}.tile small{display:block;margin-top:5px;color:#657389;font-size:11px}.footnote{font-size:12px;color:#657389;line-height:1.8;margin:22px 0 0}@media(max-width:860px){.player-grid{grid-template-columns:1fr}.sidebar{padding:16px}.tiles{grid-template-columns:repeat(2,1fr)}header,main{padding-left:16px;padding-right:16px}}
</style></head><body><header><div><small>组件库 / B-ROLL</small><h1>B-roll 插镜组件</h1></div><a href="../../catalog.html?q=broll">返回组件库 ↗</a></header><main><div class="player-grid"><section><div class="screen"><iframe id="frame" title="B-roll 动态预览"></iframe></div><div class="controls"><button id="play">播放</button><button id="restart">重播</button><input id="seek" type="range" min="0" max="6" step=".01" value="0" aria-label="预览时间"><output id="time">0.00 / 6.00 s</output></div></section><aside class="sidebar"><h2 id="title"></h2><p id="desc"></p><p class="use" id="use"></p><a id="edit" href="../../catalog.html">编辑内容与选择动画 ↗</a><p>每段 6 秒，可独立使用。照片、视频、文案和取景位置均可替换。</p></aside></div><div class="tiles"><button class="tile" data-id="broll-cutaway" aria-pressed="false"><img src="../../snapshots/broll-cutaway.png" alt="B-roll · 实景切镜"><div><strong>实景切镜</strong><small>真实素材 / 6s</small></div></button><button class="tile" data-id="broll-sequence" aria-pressed="false"><img src="../../snapshots/broll-sequence.png" alt="B-roll · 三镜头组接"><div><strong>三镜头组接</strong><small>真实素材 / 6s</small></div></button><button class="tile" data-id="broll-detail" aria-pressed="false"><img src="../../snapshots/broll-detail.png" alt="B-roll · 素材局部聚焦"><div><strong>素材局部聚焦</strong><small>真实素材 / 6s</small></div></button><button class="tile" data-id="broll-brief-desk" aria-pressed="false"><img src="../../snapshots/broll-brief-desk.png" alt="桌面文档与便签"><div><strong>桌面文档与便签</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-message-pile" aria-pressed="false"><img src="../../snapshots/broll-message-pile.png" alt="消息与结果卡片"><div><strong>消息与结果卡片</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-revision-stack" aria-pressed="false"><img src="../../snapshots/broll-revision-stack.png" alt="文档版本叠层"><div><strong>文档版本叠层</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-document-scan" aria-pressed="false"><img src="../../snapshots/broll-document-scan.png" alt="文档扫描与字段提取"><div><strong>文档扫描与字段提取</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-search-focus" aria-pressed="false"><img src="../../snapshots/broll-search-focus.png" alt="检索与结果定位"><div><strong>检索与结果定位</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-calendar-pin" aria-pressed="false"><img src="../../snapshots/broll-calendar-pin.png" alt="日历排期与落点"><div><strong>日历排期与落点</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-folder-sort" aria-pressed="false"><img src="../../snapshots/broll-folder-sort.png" alt="文件分类与归档"><div><strong>文件分类与归档</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-edit-timeline" aria-pressed="false"><img src="../../snapshots/broll-edit-timeline.png" alt="剪辑轨道与播放头"><div><strong>剪辑轨道与播放头</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-voice-transcript" aria-pressed="false"><img src="../../snapshots/broll-voice-transcript.png" alt="语音波形与文字落稿"><div><strong>语音波形与文字落稿</strong><small>动画插镜 / 6s</small></div></button><button class="tile" data-id="broll-focus-timer" aria-pressed="false"><img src="../../snapshots/broll-focus-timer.png" alt="专注计时与完成"><div><strong>专注计时与完成</strong><small>动画插镜 / 6s</small></div></button></div><p class="footnote">真实素材作为可替换的媒体占位。图片/视频来源与许可已随项目保存。原创动画中的文字均为模板内容。<a href="../../assets/broll/CREDITS.md">查看素材来源</a></p></main><script>
const data=[{"id":"broll-cutaway","name":"B-roll · 实景切镜","category":"B-roll · 真实素材","use":"替换媒体、标题和说明，展示单段环境插镜。","description":"可换素材的全屏切镜框架。图片、视频、字幕与取景均由本期内容决定；办公画面仅为演示，不限定题材。"},{"id":"broll-sequence","name":"B-roll · 三镜头组接","category":"B-roll · 真实素材","use":"按顺序替换三段媒体与对应的文字。","description":"三个可独立换图或视频的并排素材槽。只固定布局与动效，不限定素材题材；用于过程、对照与归纳。"},{"id":"broll-detail","name":"B-roll · 素材局部聚焦","category":"B-roll · 真实素材","use":"替换媒体与要点文字，聚焦需要展示的细节。","description":"照片留在主画面，标记一个观察区域并配三条简短旁白提示。聚焦框位置可调；标注不冒充照片中真实文字。"},{"id":"broll-brief-desk","name":"桌面文档与便签","category":"B-roll · 动画插镜","use":"四张便签分别填写短标题与正文，依次落位。","description":"俯拍纸张与四张便签，把模糊任务补成对象、任务、时间和入口；所有正文可编辑。"},{"id":"broll-message-pile","name":"消息与结果卡片","category":"B-roll · 动画插镜","use":"分别填写消息内容，预览消息逐条堆叠。","description":"抽象消息纸条堆积在桌上，问题标签与右侧明确通知形成对照；不仿冒任何软件界面。"},{"id":"broll-revision-stack","name":"文档版本叠层","category":"B-roll · 动画插镜","use":"替换版本名称、正文和标注，预览版本叠放。","description":"三版稿纸和蓝色标注呈现逐次修订，最新一页形成可核对清单；版本、缺口、正文均可替换。"},{"id":"broll-document-scan","name":"文档扫描与字段提取","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"扫描线读过原稿，文字逐项落入右侧结果；用于识别、摘录与结构化过程。"},{"id":"broll-search-focus","name":"检索与结果定位","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"检索词展开，光标选中一条结果，再展开对应摘录；适合查找资料与定位证据。"},{"id":"broll-calendar-pin","name":"日历排期与落点","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"日历翻入、日期锁定、任务条落位；适合截止日期、预约与计划安排的插镜。"},{"id":"broll-folder-sort","name":"文件分类与归档","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"三张文件分别滑入对应目录，归档标签依次落下；适合素材整理、知识分类与归档。"},{"id":"broll-edit-timeline","name":"剪辑轨道与播放头","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"图像、讲解和声音轨道按次序铺开，播放头穿过组合；适合解释混剪与多轨协作。"},{"id":"broll-voice-transcript","name":"语音波形与文字落稿","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"波形游标扫过录音示意，转写段落逐条出现；适合配音、采访整理与字幕制作。"},{"id":"broll-focus-timer","name":"专注计时与完成","category":"B-roll · 动画插镜","use":"替换标题、正文与列表；在组件库中编辑内容并预览专属动作。","description":"环形计时推进，任务逐项落实，结束标记替换起始时间；适合等待、专注与工作阶段完成。"}],frame=document.getElementById('frame'),slider=document.getElementById('seek'),play=document.getElementById('play');let current=data[0].id,playing=false;
function fit(){frame.style.transform='scale('+frame.parentElement.clientWidth/1280+')';}new ResizeObserver(fit).observe(frame.parentElement);
function api(){return frame.contentWindow?.previewAPI;}function pause(){api()?.pause();playing=false;play.textContent='播放';}
function select(id){pause();current=id;const c=data.find(x=>x.id===id);document.getElementById('title').textContent=c.name;document.getElementById('desc').textContent=c.description;document.getElementById('use').textContent=c.use;document.getElementById('edit').href='../../catalog.html?component='+id;document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));slider.value=0;document.getElementById('time').textContent='0.00 / 6.00 s';frame.src='scenes/'+id+'.html';}
frame.onload=fit;document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>select(b.dataset.id));play.onclick=async()=>{if(playing){pause();return;}await api()?.play();playing=true;play.textContent='暂停';};document.getElementById('restart').onclick=async()=>{await api()?.restart();playing=true;play.textContent='暂停';};slider.oninput=()=>{pause();api()?.seek(Number(slider.value));document.getElementById('time').textContent=Number(slider.value).toFixed(2)+' / 6.00 s';};
function refresh(){if(playing){const t=api()?.time()||0;slider.value=t;document.getElementById('time').textContent=t.toFixed(2)+' / 6.00 s';if(t>=5.999)pause();}requestAnimationFrame(refresh);}select(current);refresh();window.addEventListener('pagehide',()=>{pause();api()?.destroy();});
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画风 · 基础部件</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><p>讲解组件库 / 动画风</p><h1>把部件拆开，自由组合</h1><p class="intro">从纸张、单元格到输入框、光标与流程节点，独立修改，组合成自己的画面。</p></div><nav><a href="../../catalog.html">全部组件 ↗</a><a href="../animation-style/index.html">完整场景 ↗</a></nav></header>
<main><section class="workspace"><div class="left"><div class="canvas-bar"><h2 id="name">基础部件</h2><div class="example-controls"><label for="example">组合示例</label><select id="example"><option value="materials">资料处理</option><option value="interface">界面操作</option><option value="flow">条件分流</option></select><button id="compose">查看组合</button></div></div><div class="stage" id="stage" aria-label="透明组件预览"></div><div class="stage-bottom"><span id="description"></span><span class="pill">透明 SVG</span></div><div class="variant-bar" id="variants" aria-label="部件状态"></div></div><aside><h2 id="editor-title">替换内容</h2><p>选择下方部件；可先点常用状态，再细调文字、位置和尺寸。</p><label for="props">组件配置 · JSON</label><textarea id="props" spellcheck="false"></textarea><div class="actions"><button id="apply" class="primary">应用内容</button><button id="reset">恢复示例</button></div><p id="error" role="alert"></p><button id="download-svg" class="download">下载透明 SVG</button><button id="download-json" class="download">下载组件配置</button><a id="catalog-edit">到组件库加动画 ↗</a></aside></section><section class="parts"><div class="section-title"><h2>选择基础部件 <small id="count"></small></h2><label class="part-search">搜索 <input id="search" type="search" placeholder="如：单元格、输入框、箭头"></label></div><div id="groups" class="group-filters" aria-label="部件分组"></div><div class="grid" id="grid"></div><p id="empty" hidden>没有匹配的部件。清空搜索或选择“全部”再看。</p></section></main><footer>延续参考图中的深蓝描边、浅蓝厚度与绿橙状态色。每个部件都可独立下载透明 SVG 和配置；宽高布局与整体缩放分别控制。</footer><script type="module" src="controller.mjs"></script></body></html>
